    gate_human + approved_by_human only) treats a licensing DECISION and a
    brief-confirmation checkpoint identically by construction -- verifying this
    kind of "should X and Y be treated the same" task is often a matter of reading
    the one function involved rather than writing new code, and the resulting
    regression-test gap (resolve_deps.py had zero prior coverage) is usually the
    more valuable output of the task. Also surfaced that the same
    satisfied()/dependency_satisfied() check is independently reimplemented in
    next_ready_task.py and audit_roadmaps.py -- filed as conductor/t-043.
