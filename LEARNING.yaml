    seven siblings already did. A single well-known bug class is worth checking function-by-
    function across an entire store rather than assuming one comprehensive fix closes the
    category -- the fix pattern (call an existing clear helper at the start of every mutating
    path, not just the ones that happened to need it last time) generalizes directly. Also
    reconfirmed (4th independent instance) that a delegated background agent's "waiting on a
    CI timer" self-report is not a real block -- the coordinating session must poll CI itself
    and merge, then explicitly tell the sub-agent to stop via SendMessage. Promoted this from a
    per-cycle TALKBACK observation to AGENTS.md hard safety rule 13.
