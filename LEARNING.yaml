  lesson: >
    A same-item reentrancy guard (autoBuildItem vs itself, PR #1223) is only
    half the concurrency picture when a "do everything" action (Auto) and
    several "do one thing" manual actions (Generate candidate/Draft with
    AI/Execute commit) can both reach the same underlying operation for the
    same item. Guarding the automatic path against itself doesn't guard it
    against a manual path already in flight -- the automatic path just sees
    the stage as "not yet approved" and proceeds, firing a second concurrent
    request. When a store has both a batch/auto entry point and matching
    manual single-stage entry points into the same underlying calls, check
    for a cross-guard (auto vs. manual in-flight state) in addition to the
    obvious self-vs-self guard.
- date: '2026-08-01'
  project: model-builder
