  passes: 0
  outcome: done
  failure_category: null
  lesson: "Idempotent canonical writes without a live DB: an atomic claim on a unique key (updateMany\
    \ where key IS NULL; count===0 means already committed) gives exactly-once semantics, releasing the\
    \ key on write failure enables retry, and create+link in one $transaction prevents orphans. When you\
    \ can't run the DB, keep writes to KNOWN exact field/relation names (pulled from schema) so vue-tsc\
    \ validates every prisma.model.update/create at PR time \u2014 a wrong field name fails CI instead\
    \ of corrupting prod. Covers t-013/t-014/t-015; kind_robots PR #190. Live proof still pending (t-022)."
