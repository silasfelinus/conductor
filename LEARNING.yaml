    resetRun()/resetAll() do, but never called their in-flight-singleton-clearing logic,
    reproducing the exact stale-busy-indicator bug those two were already fixed for.
    Lesson for future cycles: a directory-glob "already covered" check is not the same
    as per-file coverage -- cross-check individual filenames against the cumulative note
    history, not just the glob pattern. Also, when a file traced this way reads clean,
    the bug may be in a function it *calls into* rather than the file itself; tracing
    outward from a clean file is a distinct, useful search strategy from re-reading a
    file's own body. Also confirmed: extracting a shared helper to reduce duplication
    across the four fix sites broke two pre-existing narrow-textual-checker guards that
    were pinned to the literal inline shape -- inlining the fix at each site (matching
    the existing pattern) instead of refactoring was the lower-risk choice once existing
    guards are keyed to literal text shape, not just behavior.
