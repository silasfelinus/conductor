    specifically so it never disturbs whatever branch or uncommitted work the calling session already
    has -- validated with a real throwaway git repo (bare + clone), not just unit-level YAML assertions,
    since the git push/race path is exactly the part most likely to look correct and behave wrong under
    concurrency.'
