  failure_category: null
  lesson: "Extracting shared mechanics into a new server/utils/*.ts file risks a silent Nuxt
    auto-import name collision when the new file's export name happens to match an existing
    server/utils export -- nuxi prepare only WARNs ('Duplicated imports... ignored'), it does
    not fail the build, so a colliding helper name can quietly shadow (or be shadowed by) an
    unrelated existing function with different behavior. Ran into this for real: the shared
    module's first draft named its Server-auth-header builder `buildServerAuthHeaders`,
    identical to an existing, differently-shaped helper in serverApi.ts (Content-Type vs
    Accept header contract) used by two other call sites. Caught by actually running `nuxi
    prepare` locally and reading its warnings, not by vue-tsc/eslint (neither flags this).
    Renamed to a distinct name rather than merging the two behaviors, to keep the migration's
    'no observable behavior change' guarantee intact. Also: a shared module that mixes pure
    helpers with one Prisma-touching function (via a static import chain through
    serverResolver.ts -> prisma.ts) will make an otherwise-DB-free self-test require
    DATABASE_URL just by importing the file -- dynamic-importing the Prisma-touching piece
    inside its own function body keeps the rest of the module importable standalone, which
    mattered here because contract-tests.yml is explicitly documented as a DB-free workflow."
