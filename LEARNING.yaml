- date: 2026-08-01
  project: interface-vision
  task: t-012
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    PR #1518 landed the roadmap side of this task (status: review, t-033..t-036
    split out) while its companion kind_robots PR #1272 was still open, on the
    explicit plan to close t-012 to done once #1272 merged -- but the closing
    session ended without doing so, leaving the PR open and t-033..t-036 stuck
    at status: waiting for a full day. Meanwhile a concurrent direct push
    completed interface-vision/t-027 on main, so PR #1518's stale branch
    snapshot (which still carried t-027 at status: review) would have reverted
    that completion if merged as-is -- caught by diffing origin/main before
    merging and resolved with `git merge origin/main` (keeping main's t-027,
    keeping the branch's t-012/t-033..t-036 additions) rather than force-pushing
    over it. A companion-PR task with a stated "I'll close this once X merges"
    plan is a real, easy-to-drop loose end if the closing step isn't done in
    the same session that opens the PR -- a later Reviewer sweep should check
    for exactly this shape (review-status task + already-merged companion PR)
    rather than assuming an open PR's own body is still accurate.
- date: 2026-07-29
  project: animation-manager
  task: t-006
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    Routine daily-pitch cycle (geode-bloom, priority 20) using the established
    dated-artifact + consume_animation_pitches.py --live flow, no incident. One
    real gap found and fixed along the way: this sandbox's isolated pytest tool
    (installed via `uv tool install`) had no `yaml` dependency, so `pytest` failed
    to collect any test touching PyYAML-based scripts (consume_animation_pitches,
    check_animation_novelty) even though the system `python3` interpreter used by
    the scripts themselves has yaml installed fine -- `uv tool install pytest
    --with pyyaml --force` fixed it for this session. Worth a standing note for
    future burst-mode sessions that hit an unexplained `ModuleNotFoundError: yaml`
    under `pytest` specifically (not under `python3 -m pytest`, which has its own
    separate "no pytest module" failure): the two interpreters are not the same
    environment.
- date: 2026-07-29
  project: conductor
  task: t-095
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    Kaizen from the fauvism ArtJob incident (ai-art-academy/t-010): consume_art_requests.py
    --live printed a submitted ArtJob's id to stdout only, never durably, before blocking on
    wait_for_job() -- a timeout, failed job, or killed process left no trace of which job had
    been submitted for a request, discoverable only from a session's own (unrecoverable) prose.
    Fixed by writing the id onto the request's own art-prompts.yaml entry (record_submitted_job)
    immediately after enqueue() succeeds and before the wait. The non-zero-exit half of the
    original kaizen was already correct and needed no fix -- worth checking both stated gaps
    independently rather than assuming a two-part kaizen implies two real bugs.
- date: 2026-07-29
  project: conductor
