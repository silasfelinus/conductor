# LEARNING.yaml — append-only task-outcome ledger.
#
# One record per CLOSED task (done / blocked / cancelled), appended by the agent
# that closes it. Same rule as TALKBACK: never edit or delete a prior record.
# Full protocol: AGENTS.md § "Learning ledger". Summary view: LEARNING-REPORT.md
# (regenerate with `python scripts/build_learning_summary.py`).
#
# Record shape:
#   - date: YYYY-MM-DD
#     project: <slug>
#     task: <task-id>
#     kind: software | content | proposal
#     stakes: reversible | outward-facing | irreversible
#     passes: <final pass count>
#     outcome: done | blocked | cancelled
#     failure_category: transient | actionable | quality | scope | null
#     lesson: "one sentence — what the next similar task should know"
#
# failure_category is null for clean first-pass successes; otherwise it is the
# triage category of the dominant failure (AGENTS.md § "Failure triage").
records:
  - date: 2026-07-11
    project: challenge-center
    task: t-003
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "Audit the target repo before claiming a task: the full t-003 API surface already existed on kind_robots main (built in a Silas-directed session outside the Worker loop), so the task closed by spec verification alone."
  - date: 2026-07-12
    project: conductor
    task: t-027
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "A stale task spec can be closed by a larger cutover that subsumes it: the Dream-sync priority ask was satisfied by rewriting the bridge to /api/projects — check whether pending tasks target a replaced integration before working them as written."
  - date: 2026-07-12
    project: model-builder
    task: frontend-scaffold
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "Front-end-first, no-schema slice merges cleanly and safely: the Model Builder UI (source picker -> gated recipe runner -> four gates) reused existing model list APIs, the art generator, and /api/suggest without touching Prisma, so merge-to-main deployed only additive UI. When you can't run the toolchain locally, lean on the repo's whole-project vue-tsc PR check as the verification gate before merging. Partial slice spanning t-005/t-014 — durable BuildRun persistence (t-004) intentionally deferred, not done."
  - date: 2026-07-12
    project: conductor
    task: t-035
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "Secrets expire silently: a JWT-backed integration needs its failure mode loud (nonzero exit on auth errors) or the bridge can be dead for weeks while CI stays green."
  - date: 2026-07-12
    project: model-builder
    task: t-004
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "An additive-only Prisma migration (new CREATE TABLEs, internal cascade FKs, external refs as plain scalar Int columns with no FK) merges safely even though merge-to-main runs prisma migrate deploy against prod — no reverse-relation edits to User/ArtImage were needed. The typecheck CI runs prisma generate before vue-tsc, so it validates a new schema file end-to-end (client types + routes + store) without a live DB; that plus the Vercel preview build is enough of a gate when you can't run the toolchain locally. kind_robots PR #188."
  - date: 2026-07-12
    project: model-builder
    task: t-021
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "Once a resource is durable, the cheapest high-value follow-up is a history/list surface — the list endpoint already existed, so the run-history panel was pure front-end with zero new API. kind_robots PR #189."
  - date: 2026-07-12
    project: model-builder
    task: t-013
    kind: software
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "Idempotent canonical writes without a live DB: an atomic claim on a unique key (updateMany where key IS NULL; count===0 means already committed) gives exactly-once semantics, releasing the key on write failure enables retry, and create+link in one $transaction prevents orphans. When you can't run the DB, keep writes to KNOWN exact field/relation names (pulled from schema) so vue-tsc validates every prisma.model.update/create at PR time — a wrong field name fails CI instead of corrupting prod. Covers t-013/t-014/t-015; kind_robots PR #190. Live proof still pending (t-022)."
  - date: 2026-07-12
    project: model-builder
    task: t-016
    kind: content
    stakes: reversible
    passes: 0
    outcome: done
    failure_category: null
    lesson: "The Model Builder's four gates are OPTIONAL front-end pauses (skip an item, or stop after prompt to edit) — NOT a backend block that waits on a repo-file approval. Default is to create full objects for everything. I over-applied a 'needs-human, internal-draft-only' framing to the HSS marketing deck; the right move was a full example set with the visuals queued into the real art pipeline (projects/art-generate.yaml). Also: the art generator forbids text/logos, so marketing collateral splits into generated text-free imagery + a text/logo layout step over the real logo (no rebrand). Don't invent brand facts — pricing/area/logo/descriptor came from Silas and were folded into CONTENT-BRIEF."
