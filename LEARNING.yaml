    Live-sanitizing a slug field on every keystroke (lowercase + collapse +
    trim) breaks manual typing of hyphenated slugs: a hyphen is trailing
    (and therefore gets trimmed) the instant it's typed, before the next
    character lands, so "my-project" becomes impossible to type by hand.
