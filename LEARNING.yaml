- date: 2026-08-20
  project: kapowarr
  task: t-060
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: |-
    When a ranking signal is only available from some sources, the shape of the fix is
    forced by the sources that lack it, not by the ones that have it. "Prefer available
    releases" reads like it wants a seeder-count gradient, but peer counts come only from
    Torznab, and a gradient cannot place a no-peer-data result anywhere on it without
    either promoting or demoting every non-torrent source for no reason. The only shape
    that satisfies "absent data ranks neutrally" is binary: demote proven-dead, treat
    unknown and healthy identically. Four lines of production code, and the constraint
    picked them.
    Second: a rank component that encodes a fact about a release (it has no seeders, so
    it cannot download) does not belong behind a user preference, even when every helper
    beside it is preference-driven -- the only value a "prefer_available: off" setting
    could carry is "please also consider releases that cannot download." A side benefit
    worth knowing in this codebase: skipping the settings read also skips the database,
    so the helper's unit tests need no Flask app_context, which is exactly why the
    pre-existing ranking test has to patch pack_preference_rank.
    Third: when placing a new component into an ordered rating list, pin the position
    from both sides with named tests. Here availability was deliberately put one tier
    above where the task note suggested (above pack preference, since preferring the
    shape of an undownloadable release is meaningless); a reviewer who disagrees now sees
    a failing named test rather than a silent behaviour change. The tier order is the
    actual policy and was otherwise documented only in inline comments -- filed as t-063.

- date: 2026-08-20
  project: kapowarr
  task: t-061
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    Deleting special-casing from a fan-out is a contract problem before it is a
    control-flow problem. search_metadata_with_fallback() could not iterate providers
    because MetadataProvider had no way to answer "should I be in the fan-out" or "is
    this error me being unavailable, or a bug" -- so the two questions the old code
    answered inline (_metron_is_configured(), isinstance against MetronError /
    CVRateLimitReached) had to become is_configured() and unavailable_errors on the
    contract first. Once they were there the loop wrote itself.
    Second: preserve the exact success/failure algebra, not just the happy path. The old
    code returned ComicVine's results when Metron failed recoverably, even if ComicVine
    returned an empty list -- so the generalized version has to raise on "every provider
    was unavailable", tracked with an `answered` flag, NOT on "results is empty". Those
    two conditions look interchangeable and are not; an empty successful search is a
    valid answer.
    Third: order the provider list explicitly rather than inheriting dict insertion
    order. The registry's order depends on which module imported first, so the fan-out's
    result order would have been an import-order accident; sorting default-first then
    alphabetically makes the existing ['comicvine', 'metron'] assertion a guarantee
    instead of a coincidence.

- date: 2026-08-20
  project: kapowarr
  task: t-063
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    A test written to catch a silent regression must be shown to fail against that
    regression, not merely to pass against current behaviour -- and for an ordering
    policy this is cheap to do: break the policy deliberately, run the suite, restore
    from a byte-copy. Doing it here proved the task's premise rather than assuming it.
    Transposing two rating components failed four tests, but inserting a NEW component
    above match correctness failed only the new table guard while all 22 pre-existing
    pairwise tests passed. That is the exact gap the task described, demonstrated
    instead of argued, and it is the evidence that belongs in the PR body.
    Second: lexicographic list comparison is what makes a whole-order assertion possible
    in one place. Because a result degraded at tier N differs from the baseline first at
    index N, it loses to one degraded at any later tier regardless of magnitudes -- so
    ranking one result per tier and sorting them reproduces the policy backwards, and
    six adjacent-boundary assertions collapse into one readable list.
    Third: when two ranking components share an input (pack preference and issue-number
    fit both read result['issue_number']), no single result can vary one alone. Patching
    the component's return value rather than driving it through a real preference is what
    isolates it -- and the coupling itself is worth writing into the test, since it is
    otherwise only discoverable by trying and failing to construct the case.

- date: 2026-08-20
  project: kapowarr
  task: t-062
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    A prior evaluation doc that names exact measured traps (response shapes, pagination
    ceilings, a 404-not-JSON edge case) turns an "implement a REST client" task into
    something closer to transcription than design -- the risk shifts from "did I miss a
    trap" to "did I quietly widen scope while transcribing it." Re-reading the evaluation
    doc's own recommendation section against the actual diff before opening the PR (does
    every field mapping trace to a table row, is every new file/setting/test named in the
    doc's follow-on task description) is what kept this PR three files instead of six --
    the doc's own field tables for `Series`/`overview` rows against `VolumeMetadata`/
    `IssueMetadata` could be pasted almost directly into code comments, and the two
    schema-shape questions the doc explicitly left unmeasured (a `title` field on overview
    rows, `longest_story.synopsis`) were exactly the two places worth flagging as
    judgment calls in the PR body rather than silently guessing.
    Second: an existing sibling provider is not automatically a safe copy source. Reading
    `metron.py` for the pattern surfaced a real latent bug in it (`test_key()` imports
    `run` from `backend.base.helpers`, which re-exports `subprocess.run`, not an async
    runner -- calling `subprocess.run(<coroutine>)` raises, it doesn't return `False`;
    the sibling `comicvine.py` gets this right via `from asyncio import gather, run,
    sleep`). Never had a test covering `test_key()`'s actual return value, so it shipped
    unnoticed. Filed as kapowarr/t-066 rather than folded into this PR, but the general
    point is that "match the existing provider's pattern" needs the same scrutiny as any
    other code being read for reuse, not a pass just because it already merged.
