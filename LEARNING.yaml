    adding a sibling one) to also flag any store function whose body awaits
    performFetch inside a try/catch with no `.success` check anywhere in scope --
    the same "silently-dead catch block" shape likely recurs elsewhere in this
    store (and possibly other Pinia stores) wherever performFetch's always-resolve
    contract isn't the author's first assumption. Filed as this cycle's kaizen
    suggestion rather than a new task, since the fix (widen an existing guard) is
