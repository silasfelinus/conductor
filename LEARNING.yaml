  task: t-109
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    When a hard gate will also be applied retroactively to an existing backlog, decide
    per-rule whether a pre-existing row should FAIL or be REPAIRED. kind_robots' prompt
    contract (2026-08-08) re-applies at claim time so pre-gate rows cannot render with
    stale settings — correct — but its only verdict was FAILED, so eight ArtJobs died on
    nothing but "krea2 runs at roughly 12 steps or fewer; got 20" with 27 more queued to
    die the same way. A step count above the engine's ceiling has one objectively correct
    repair and no authorial intent to preserve; rejecting it is not the conservative
    choice, just a different failure. Rules needing judgment (a conditional a diffusion
    model cannot evaluate, a format noun) must still fail. Two corollaries: a recovery
    endpoint that repairs everything EXCEPT the thing that killed the job is a loop, not
    a recovery (reenqueue-failed normalized paths/prompts/LoRAs but not the sampler);
    and fixing a per-engine DEFAULT without also bounding the explicit OVERRIDE leaves
    the door open at exactly the width of the original bug.
- date: '2026-08-09'
  project: conductor
  task: t-110
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: >
    A default is a decision, and an unnamed one never gets reviewed.
    /api/art/enqueue resolved an omitted engine with `String(value || 'a1111')` —
    one word, no constant, no test — long after the relay stopped serving A1111,
    so "just enqueue this" meant "enqueue something that cannot render". The
    same shape hid a second bug next to it: buildDefaultComfyWorkflow passed a
    literal -1 seed into the KSampler where every sibling builder resolved a
    random one, pinning that lane to one image per Comfy install, and
    patchComfyWorkflow repeated the -1 immediately afterward so fixing only the
    builder would have been invisible. Both were invisible for the same reason —
    the value was inline, unnamed, and untested, so nothing ever asked whether
    it was still right. When a fallback decides behaviour for every caller that
    stays silent, give it a named constant and a test that states the intent;
    "krea2 is the default" and "an unspecified seed is random" are claims a test
    can hold, `|| 'a1111'` is not.
- date: 2026-08-09
