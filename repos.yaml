# repos.yaml — External repositories tracked by Conductor
# Maps GitHub repos to their Conductor project slugs.
# Format:
#   - slug: <project-slug matching projects/<slug>/>
#     repo: <owner/repo>
#     kind: software | content | proposal
#     description: one line

repos:
  - slug: conductor
    repo: silasfelinus/conductor
    kind: software
    description: This repo — the coordination system itself

  - slug: kind-robots
    repo: silasfelinus/kind_robots
    kind: software
    description: Kind Robots — Silas's personal frontend + AI art platform

  # HSS has one canonical implementation repository. The historical
  # `humboldt-scoop` Conductor project is finished; `humboldt-scoop-cms` is the
  # continuing coordination slug for the entire product, not a second codebase.
  - slug: humboldt-scoop-cms
    repo: silasfelinus/humboldtscoopsolutions
    kind: software
    description: Humboldt Scoop Solutions — website, customer/admin/worker portals, routing/CMS, and iOS/Android clients

  # repo: null -- retired; the repo was never created (the issue bridge 404'd on it, 2026-10-02).
  - slug: approval-portal
    repo: null
    kind: software
    description: Admin console — review pitches, approve tasks, confirm updates

  # repo: null -- its storefront code ships inside kind_robots; no repo of its own was ever created (the issue bridge 404'd on it, 2026-10-02).
  - slug: digital-storefront
    repo: null
    kind: content
    description: Research + content pipeline for digital products

  - slug: brainstorm
    repo: null
    kind: proposal
    description: Pitch-generation project — no external repo needed

  - slug: mermaids-of-venice
    repo: null
    kind: content
    description: Mermaids of Venice creative content project

  - slug: coat-dance
    repo: null
    kind: content
    description: Coat Dance creative content project

  - slug: music-mentor
    repo: silasfelinus/kind_robots
    kind: software
    description: Audio singing & arrangement feedback tool — upload a medley, get coaching

  # Game code ships inside kind_robots (same pattern as music-mentor); the
  # silasfelinus/cthulhuquarium repo is the portable data canon — fish bible,
  # balance tables, lore, art prompts — consumed by the game and by ruler-hooked.
  - slug: cthulhuquarium
    repo: silasfelinus/kind_robots
    kind: software
    description: Cthulhuquarium — darkly funny idle aquarium game with a collectible monster-fish bestiary
  - slug: music-video
    repo: silasfelinus/kind_robots
    kind: software
    description: Suno-inspired music video creator that turns a pitch into lyrics, a song, scenes and a compiled video on our ComfyUI backend
  - slug: comic-creator
    repo: silasfelinus/kind_robots
    kind: software
    description: "A browser comic book creator: pick or upload panels, lay out pages from templates, drop in Kind Robots characters, speech bubbles and captions, export a PDF/PNG comic. Zero LLM required."
  - slug: kr-solitaire
    repo: silasfelinus/kind_robots
    kind: software
    description: Klondike solitaire played with a hand-designed 52-card Kind Robots deck (four suits of robots, illustrated court cards) and Kind Robots card backs. Pure client-side game, no LLM.
  - slug: kr-adventures
    repo: silasfelinus/kind_robots
    kind: software
    description: Pre-written choose-your-own-adventure books that start from existing Kind Robots scenarios, each with a preset hero, a fully authored branching story graph, and pre-generated art for every node. Static content, no LLM at read time.
  - slug: kind-oracle
    repo: silasfelinus/kind_robots
    kind: software
    description: A full 78-card Kind Robots tarot deck (22 major arcana plus 56 minor arcana in four suits), each card a full piece of art with an upright and a reversed meaning, where you draw a one, three or five card spread and read a pre-written reading assembled from hand-authored card, pair and position texts. Every combination is written ahead of time, so it feels personal and costs nothing to run. The 22 major arcana ship first as a complete, playable oracle; the minor arcana follow in suit-sized slices.
  - slug: pocket-pet-robot
    repo: silasfelinus/kind_robots
    kind: software
    description: A tiny virtual pet you adopt, name, feed, play with and put to bed, whose mood sprites and room scenes are all pre-generated and whose state lives in your own browser. It grows through three forms over a couple of weeks of casual visits and never needs a server or a token.
  - slug: evolve-rebel-button
    repo: silasfelinus/kind_robots
    kind: software
    description: Turns the early Rebel Button toy into an art reviewer once someone hits 100 clicks.
  - slug: comic-film
    repo: silasfelinus/kind_robots
    kind: software
    description: Animated short films made from Comic Studio issues, built on the music-video pipeline
  - slug: robot-mashup-flipbook
    repo: silasfelinus/kind_robots
    kind: software
    description: Build the approved free-to-play, no-LLM-at-runtime pitch; see pitches/2026-10-03-robot-mashup-flipbook.md for hook, art plan and first slice.
  - slug: robot-sound-garden
    repo: silasfelinus/kind_robots
    kind: software
    description: Build the approved free-to-play, no-LLM-at-runtime pitch; see pitches/2026-10-03-robot-sound-garden.md for hook, art plan and first slice.
  - slug: kind-trivia-trail
    repo: silasfelinus/kind_robots
    kind: software
    description: Build the approved free-to-play, no-LLM-at-runtime pitch; see pitches/2026-10-03-kind-trivia-trail.md for hook, art plan and first slice.
