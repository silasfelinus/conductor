name: Rainbow opening WAN queue budget

on:
  pull_request:
    paths:
      - 'projects/rainbow-bullet-hell-space-princess/art/OPENING-CLIPS-2-DOODLE.yaml'
      - 'scripts/export_rainbow_opening.py'
      - 'scripts/test_rainbow_opening_budget_ci.py'
      - '.github/workflows/rainbow-opening-budget.yml'
  push:
    branches: [main]
    paths:
      - 'projects/rainbow-bullet-hell-space-princess/art/OPENING-CLIPS-2-DOODLE.yaml'
      - 'scripts/export_rainbow_opening.py'
      - 'scripts/test_rainbow_opening_budget_ci.py'
      - '.github/workflows/rainbow-opening-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opening-wan-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ledger parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Reject over-budget opening ArtJobs before enqueue
        run: python scripts/export_rainbow_opening.py --check-queue-budget
      - name: Exercise valid and rejected ledger fixtures
        run: python -m unittest discover -s scripts -p 'test_rainbow_opening_budget_ci.py' -v
