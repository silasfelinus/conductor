name: Reconcile challenge-center t-006 v4

on:
  push:
    branches:
      - worker/challenge-center-t-006-reconcile-v4

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/challenge-center-t-006-reconcile-v4
          fetch-depth: 0
      - name: Reconcile merged implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('projects/challenge-center/roadmap.yaml')
          lines = roadmap.read_text(encoding='utf-8').splitlines()
          output = []
          current_task = None
          inserted_completion = False

          for line in lines:
              if line.startswith('- id: '):
                  if current_task == 't-006' and not inserted_completion:
                      output.extend([
                          '  completion_note: >',
                          '    DONE (2026-07-13): Kind Robots PR #210 merged the logged-in Challenge Center voting arena.',
                          '    It ships the two-contender VS split and responsive N-contender grid; renders art, text,',
                          '    Character, and Scenario submissions; shows score, rank, variant, and mini-leaderboard data;',
                          '    and enforces one auditable LOVED/CLAPPED/BOOED/HATED vote per logged-in user. Contract tests,',
                          '    Prisma generation, whole-project vue-tsc, and the Vercel build passed. No live vote was cast.'
                      ])
                      inserted_completion = True
                  current_task = line.removeprefix('- id: ').strip()

              if current_task == 't-006' and line.startswith('  status: '):
                  line = '  status: done'
              elif current_task == 't-006' and line.startswith('  updated: '):
                  line = "  updated: '2026-07-13T10:13:18Z'"
              elif current_task == 't-007' and line.startswith('  status: waiting'):
                  line = '  status: ready'

              output.append(line)

          t006 = output[output.index('- id: t-006'):output.index('- id: t-007')]
          t007 = output[output.index('- id: t-007'):]
          if '  status: done' not in t006:
              raise SystemExit('t-006 status was not updated')
          if '  status: ready' not in t007:
              raise SystemExit('t-007 status was not promoted')
          if not inserted_completion:
              raise SystemExit('t-006 completion note was not inserted')

          roadmap.write_text('\n'.join(output) + '\n', encoding='utf-8')

          ledger = Path('LEARNING.yaml')
          text = ledger.read_text(encoding='utf-8')
          record = '''  - date: 2026-07-13
            project: challenge-center
            task: t-006
            kind: software
            stakes: reversible
            passes: 0
            outcome: done
            failure_category: null
            lesson: "After a cross-repo PR merges, reconcile the conductor task immediately so a successful implementation cannot remain stranded as claimed."
          '''
          record = '\n'.join(line.strip() if index == 0 else line[10:] for index, line in enumerate(record.splitlines())) + '\n'
          if '\n    task: t-006\n' not in text:
              ledger.write_text(text.rstrip() + '\n' + record, encoding='utf-8')
          PY
          rm .github/workflows/reconcile-challenge-t006-v4.yml
      - name: Verify YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          roadmap = yaml.safe_load(Path('projects/challenge-center/roadmap.yaml').read_text())
          tasks = {task['id']: task for task in roadmap['tasks']}
          assert tasks['t-006']['status'] == 'done'
          assert tasks['t-007']['status'] == 'ready'
          learning = yaml.safe_load(Path('LEARNING.yaml').read_text())
          assert any(row.get('project') == 'challenge-center' and row.get('task') == 't-006' and row.get('outcome') == 'done' for row in learning['records'])
          PY
      - name: Commit reconciliation
        run: |
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/challenge-center/roadmap.yaml LEARNING.yaml .github/workflows/reconcile-challenge-t006-v4.yml
          git commit -m "done: challenge-center/t-006 [skip ci]"
          git push origin HEAD:worker/challenge-center-t-006-reconcile-v4
