name: Daily digest retry watchdog

# The dedicated watchdog pass. The logic lives in scripts/ensure_daily_digest.sh
# so this workflow and hourly-conductor.yml cannot drift apart -- see that
# script for why a second, more frequently firing carrier is needed at all.
#
# NOTE: this workflow is itself schedule-triggered, so it shares the failure
# mode it exists to catch. When GitHub stops delivering scheduled events to
# this repo, these two passes go missing along with the digest.

on:
  schedule:
    - cron: "30 16 * * *" # First fallback, one hour after the primary digest.
    - cron: "30 18 * * *" # Second fallback for a longer Actions outage.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-digest-retry-watchdog
  cancel-in-progress: false

jobs:
  retry-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately no actions/checkout: this watchdog exists for the case where
      # Actions infrastructure is degraded, so it must not depend on downloading
      # an action. gh is runner-bundled, so fetching the one script it needs
      # through the API keeps that property AND keeps the logic shared with
      # hourly-conductor.yml instead of drifting as a second copy.
      - name: Re-run a failed or missing daily digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: daily-digest.yml
          MAX_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ensure_daily_digest.sh?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/ensure_daily_digest.sh
          bash /tmp/ensure_daily_digest.sh
