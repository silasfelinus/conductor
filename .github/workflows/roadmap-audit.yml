name: Roadmap Audit

on:
  pull_request:
    paths:
      - 'CONTROL.md'
      - 'AGENTS.md'
      - 'project-overrides.yaml'
      - 'projects/priority.yaml'
      - 'projects/*/roadmap.yaml'
      - 'projects/*/TALKBACK.md'
      - 'scripts/audit_roadmaps.py'
      - 'scripts/check_talkback_kaizen.py'
      - 'docs/AUDITOR-DUTIES.md'
      - 'docs/SELF-IMPROVING-STUDIO.md'
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      # Runs before the audit: audit_roadmaps.py reads with PyYAML, which accepts
      # a shape the kind_robots Projects board's YAML 1.2 parser rejects outright.
      # A roadmap can therefore look perfectly healthy here while rendering as an
      # empty project on the live site.
      - name: Check roadmaps are spec-compliant YAML
        run: python scripts/check_roadmap_yaml.py

      # A TALKBACK entry naming a kaizen id is a promise the task exists. Nothing
      # checked it did, so promised follow-on scope could evaporate silently
      # (interface-vision/t-093).
      - name: Check every promised kaizen task was actually created
        run: python scripts/check_talkback_kaizen.py

      - name: Generate portfolio audit
        run: python scripts/audit_roadmaps.py --json ROADMAP-AUDIT.json --markdown ROADMAP-AUDIT.md
      - name: Persist initial audit snapshot on the audit branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'worker/roadmap-audit-2026-07-12'
        run: |
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add ROADMAP-AUDIT.json ROADMAP-AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate portfolio roadmap audit"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Persist scheduled audit snapshot
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add ROADMAP-AUDIT.json ROADMAP-AUDIT.md
          if git diff --staged --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "chore: refresh roadmap audit [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to persist roadmap audit after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-audit
          path: |
            ROADMAP-AUDIT.json
            ROADMAP-AUDIT.md
          retention-days: 30
