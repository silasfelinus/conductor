name: Apply owner-approved Downward Mobility project title

# One-shot: applied successfully in run 44269967281 (2026-11-18). Push trigger removed so a
# later owner retitle is never silently reverted; re-run only by manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downward-mobility-project-title
  cancel-in-progress: false

jobs:
  update-title:
    name: Update exactly one Kind Robots Project via API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update approved Project presentation
        run: python scripts/update_downward_mobility_project.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
