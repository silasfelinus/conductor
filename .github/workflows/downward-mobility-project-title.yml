name: Apply owner-approved Downward Mobility project title

on:
  push:
    branches: [main]
    paths:
      - projects/shifting-desks/PLAYTEST-HANDOFF-2026-11-17.md
      - scripts/update_downward_mobility_project.py
      - .github/workflows/downward-mobility-project-title.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downward-mobility-project-title
  cancel-in-progress: false

jobs:
  update-title:
    name: Update exactly one Kind Robots Project via API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update approved Project presentation
        run: python scripts/update_downward_mobility_project.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
