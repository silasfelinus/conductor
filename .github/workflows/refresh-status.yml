name: Refresh Status

on:
  push:
    branches:
      - main
    paths:
      - 'projects/*/roadmap.yaml'
      - 'pitches/*.md'
      - 'LEARNING.yaml'
  workflow_dispatch:

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate STATUS.md
        run: python scripts/build_status.py

      - name: Regenerate workspace.html
        run: python scripts/build_workspace.py

      - name: Regenerate LEARNING-REPORT.md
        run: python scripts/build_learning_summary.py

      - name: Commit if changed
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add STATUS.md workspace.html LEARNING-REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh STATUS.md and workspace.html [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt}/3 lost a race; retrying."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to push refreshed status after 3 attempts."
          exit 1
