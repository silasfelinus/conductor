name: Refresh Status

on:
  push:
    branches:
      - main
    paths:
      - 'projects/*/roadmap.yaml'
      - 'pitches/*.md'
      - 'LEARNING.yaml'
  workflow_dispatch:

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate and commit if changed
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            # STATUS.md, workspace.html and LEARNING-REPORT.md are deterministic
            # outputs of the roadmaps/inputs on main. Regenerate them on top of
            # the *freshest* main every attempt rather than committing first and
            # rebasing — a concurrent writer that regenerated the same files
            # would otherwise make the rebase conflict and abort the job.
            git fetch --quiet origin main
            git reset --hard origin/main

            python scripts/build_status.py
            python scripts/build_workspace.py
            python scripts/build_learning_summary.py

            git add STATUS.md workspace.html LEARNING-REPORT.md
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "chore: refresh STATUS.md and workspace.html [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt}/3 lost a race; regenerating against new main."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to push refreshed status after 3 attempts."
          exit 1
