name: Process Coloring Book Studio events

on:
  push:
    branches:
      - main
    paths:
      - "color-art-events/*.yaml"
      - "projects/coloring-book/cover-art-jobs.yaml"
      - "scripts/process_coloring_art_events.py"
      - "scripts/consume_coloring_book_studio_request.py"
      - "scripts/manage_coloring_book_production.py"
      - "scripts/manage_coloring_book_cover.py"
      - "scripts/adopt_coloring_book_asset.py"
      - "scripts/consume_coloring_book_color_art.py"
      - "scripts/semantic_art_quality.py"
      - "scripts/curate_art.py"
      - "scripts/art_quality.py"
      - "scripts/coloring_queue_status.py"
      - "scripts/coloring_book_package_status.py"
      - "tests/test_coloring_book_studio_events.py"
      - "tests/test_coloring_book_studio_workflow.py"
      - "tests/test_coloring_book_production.py"
      - "tests/test_coloring_book_cover.py"
      - "tests/test_coloring_book_asset_adoption.py"
      - "tests/test_coloring_queue_status.py"
      - "tests/test_coloring_book_package_status.py"
      - ".github/workflows/process-color-art-events.yml"
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coloring-book-color-artjobs
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml Pillow

      - name: Verify studio and package contracts
        run: |
          python -m unittest \
            tests.test_coloring_book_studio_events \
            tests.test_coloring_book_studio_workflow \
            tests.test_coloring_book_production \
            tests.test_coloring_book_cover \
            tests.test_coloring_book_asset_adoption \
            tests.test_coloring_queue_status \
            tests.test_coloring_book_package_status

      - name: Check semantic-gate credentials
        id: queue_preflight
        shell: bash
        run: |
          set +e
          python scripts/coloring_queue_status.py \
            --book monster-recast \
            --require-no-semantic-gate-error \
            > /tmp/coloring-queue-status.json
          status=$?
          set -e

          cat /tmp/coloring-queue-status.json
          if [ "$status" -eq 0 ]; then
            echo "process=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            echo "process=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Coloring Book Studio submission while pending entries are blocked by the ANTHROPIC_API_KEY credential gate."
            exit 0
          fi
          exit "$status"

      - name: Process one targeted event
        id: consume
        if: ${{ steps.queue_preflight.outputs.process == 'true' }}
        continue-on-error: true
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLOR_ART_MIN_SEMANTIC_SCORE: "75"
          COLOR_ART_MAX_SEMANTIC_ATTEMPTS: "3"
          BW_PAIR_MIN_SEMANTIC_SCORE: "80"
        run: python scripts/process_coloring_art_events.py --live --max-events 1

      - name: Refresh print-package readiness
        run: python scripts/coloring_book_package_status.py --check

      - name: Commit landed renders, decisions, revisions, and readiness
        run: |
          git config user.name "conductor-coloring-studio[bot]"
          git config user.email "conductor-coloring-studio[bot]@users.noreply.github.com"
          git add -A \
            color-art-events \
            projects/coloring-book/color-art-jobs.yaml \
            projects/coloring-book/cover-art-jobs.yaml \
            projects/coloring-book/sets \
            projects/coloring-book/print-readiness.yaml \
            projects/coloring-book/packages

          if git diff --staged --quiet; then
            echo "Coloring Book Studio and package readiness are current."
            exit 0
          fi

          git commit -m "art: process Coloring Book Studio request and readiness [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report unsuccessful event
        if: ${{ steps.queue_preflight.outputs.process == 'true' && steps.consume.outcome != 'success' }}
        run: |
          echo "::warning::The targeted coloring event was preserved for retry."
          exit 1
