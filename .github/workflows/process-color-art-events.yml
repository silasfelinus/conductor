name: Process Coloring Book Studio events

on:
  push:
    branches:
      - main
    paths:
      - "color-art-events/*.yaml"
      - "scripts/process_coloring_art_events.py"
      - "scripts/consume_coloring_book_studio_request.py"
      - "scripts/manage_coloring_book_production.py"
      - "scripts/consume_coloring_book_color_art.py"
      - "scripts/semantic_art_quality.py"
      - "scripts/curate_art.py"
      - "scripts/art_quality.py"
      - "tests/test_coloring_book_studio_events.py"
      - "tests/test_coloring_book_production.py"
      - ".github/workflows/process-color-art-events.yml"
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coloring-book-color-artjobs
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml Pillow

      - name: Verify studio event contracts
        run: |
          python -m unittest \
            tests.test_coloring_book_studio_events \
            tests.test_coloring_book_production

      - name: Process one proposal-targeted event
        id: consume
        continue-on-error: true
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLOR_ART_MIN_SEMANTIC_SCORE: "75"
          COLOR_ART_MAX_SEMANTIC_ATTEMPTS: "3"
          BW_PAIR_MIN_SEMANTIC_SCORE: "80"
        run: python scripts/process_coloring_art_events.py --live --max-events 1

      - name: Commit landed renders, decisions, revisions, and queue state
        run: |
          git config user.name "conductor-coloring-studio[bot]"
          git config user.email "conductor-coloring-studio[bot]@users.noreply.github.com"
          git add -A color-art-events projects/coloring-book/color-art-jobs.yaml projects/coloring-book/sets

          if git diff --staged --quiet; then
            echo "No Coloring Book Studio changes to commit."
            exit 0
          fi

          git commit -m "art: process Coloring Book Studio request [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report unsuccessful event
        if: ${{ steps.consume.outcome != 'success' }}
        run: |
          echo "::warning::The targeted coloring event was preserved for retry."
          exit 1
