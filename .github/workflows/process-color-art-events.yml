name: Process coloring art events

on:
  push:
    branches:
      - main
    paths:
      - color-art-events/*.yaml
      - scripts/process_coloring_art_events.py
      - scripts/consume_coloring_book_color_art.py
      - .github/workflows/process-color-art-events.yml
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conductor-color-art-events
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml Pillow

      - name: Process one bounded event
        id: consume
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          set +e
          python scripts/process_coloring_art_events.py --live --max-events 1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit landed renders and queue state
        run: |
          git config user.name "conductor-color-art-events[bot]"
          git config user.email "conductor-color-art-events[bot]@users.noreply.github.com"
          git add -A color-art-events projects/coloring-book/color-art-jobs.yaml projects/coloring-book/sets

          if git diff --staged --quiet; then
            echo "No coloring-art changes to commit."
            exit 0
          fi

          git commit -m "chore: process coloring art event [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report unsuccessful event
        if: ${{ steps.consume.outputs.status != '0' }}
        run: |
          echo "::error::Coloring-art event was preserved for retry; inspect the consumer output above."
          exit 1
