# Keeps Hybridizer's launch-hybrid render window full (hybridizer/t-007).
#
# Kind Robots' admin-only POST /api/hybridizer/batch holds at most 60 launch renders
# pending at once, below every other ArtJob's priority. This workflow tops that window up
# from the curated projects/hybridizer/LAUNCH-PAIRS.json list, refreshes delivery status
# for earlier submissions, and checkpoints projects/hybridizer/art/LAUNCH-LEDGER.json.
# It stops on its own once every pair is submitted; delivered images are verified by URL.
name: Hybridizer launch batch

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hybridizer-launch-batch
  cancel-in-progress: false

jobs:
  trickle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh delivery and submit the next launch pairs
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: python scripts/hybridizer_launch_batch.py --max-batches 4
      - name: Checkpoint the launch ledger
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/hybridizer/art/LAUNCH-LEDGER.json
          if git diff --staged --quiet; then
            echo "Launch ledger unchanged."
            exit 0
          fi
          git commit -m "chore: checkpoint Hybridizer launch ledger [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Checkpoint push race (attempt $attempt), integrating newer main."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::Could not persist the Hybridizer launch ledger."
          exit 1
