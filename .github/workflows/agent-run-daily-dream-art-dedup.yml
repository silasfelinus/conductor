name: Run Daily Dream Art Dedup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-run-daily-dream-art-dedup.yml"

permissions:
  contents: write

concurrency:
  group: agent-daily-dream-art-dedup
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/dream-cycle-t-006-art-queue-dedup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Apply bounded patch
        run: python scripts/agent_daily_dream_art_dedup.py
      - name: Validate patch
        run: |
          python -m py_compile scripts/build_dream_records.py
          python -m pytest -q tests/
          git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add -A
          git commit -m "Deduplicate daily-dream art requests"
          git push origin HEAD:worker/dream-cycle-t-006-art-queue-dedup
