name: OpenAI t-032 exact roadmap patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'openai/brainstorm-t032-milestone-status-z9c4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply one exact milestone-status correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('projects/brainstorm/roadmap.yaml')
          text = path.read_text(encoding='utf-8')
          old = """  - id: m6
    title: Preview verification and release readiness
    weight: 5
    status: planned
"""
          new = """  - id: m6
    title: Preview verification and release readiness
    weight: 5
    status: in-progress
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/openai-t032-roadmap-patch.yml
          git config user.name 'openai-scheduled-worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/brainstorm/roadmap.yaml
          git diff --cached --check
          git commit -m 'fix: reconcile Brainstorm release milestone status'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
