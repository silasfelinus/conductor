name: daily-digest

# Emails Silas a daily summary across all projects + pitches awaiting his vote.
# Run via this cron OR from a managed assistant session pointed at scripts/build_digest.py.

on:
  schedule:
    - cron: "30 15 * * *"  # 30m after the 15:00 UTC hourly builder; ≈8:30am Pacific in DST.
  workflow_dispatch:
    inputs:
      send_email:
        description: "Actually send the Brevo email. Leave false for a safe dry run."
        required: false
        default: false
        type: boolean

# This job now pushes one commit to main (the authored dream proposal), so it
# joins the same serialization group Hourly Conductor uses. Two workflows racing
# a push to main is the failure this group exists to prevent.
concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHOULD_SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml Pillow

      - name: Build digest JSON
        run: |
          python scripts/build_digest.py --since "24 hours ago" > digest-base.json
          python scripts/enrich_daily_dream_digest.py digest-base.json --output digest.json
          python scripts/annotate_daily_dream_art_queue.py digest.json
          cat digest.json
      - name: Validate digest JSON
        run: python scripts/validate_digest.py digest.json
      - name: Build Brevo payload preview
        run: python scripts/build_digest_email_v2.py digest.json digest-email.json
      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-artifacts
          path: |
            digest-base.json
            digest.json
            digest-email.json
          if-no-files-found: warn
      - name: Check digest configuration
        run: python scripts/check_digest_config.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}
      - name: Email via Brevo
        if: ${{ env.SHOULD_SEND_EMAIL == 'true' }}
        run: python scripts/send_digest_brevo.py digest-email.json
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}

      # Silas, 2026-08-09: "I'm not sure why the next dreams aren't written the
      # turn the digest is sent, or a step later if there isn't enough process."
      #
      # They weren't, because authoring lived only in CLAUDE.md's session-startup
      # checklist: a proposal appeared when a session happened to run and happened
      # to notice one was missing, and on a quiet day there was simply no dream.
      # This is that step. It runs AFTER the email so a failure here can never
      # cost Silas the digest, and it is idempotent — on a day a session already
      # authored one it prints "already exists" and exits 0.
      #
      # `continue-on-error` on purpose: the digest job's real product is the
      # email, already sent by this point. A model hiccup should show up as a
      # missing dream (which the next session's sweep reports) rather than as a
      # red daily-digest run that trains everyone to ignore it.
      - name: Author tomorrow's daily dream
        id: author_dream
        continue-on-error: true
        run: python scripts/author_dream_proposal.py
        env:
          # No KR_API_TOKEN, deliberately. The digest stays read-only with
          # respect to kind_robots content (PIPELINE.md §4, enforced by
          # check_daily_dream_pipeline.py) — it authors a proposal FILE in this
          # repo and never touches kind_robots objects or Facets. The Facet
          # catalog read is a public unauthenticated GET, so no token is needed
          # and adding one would hand this job a capability it must not have.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KR_BASE_URL: https://kind-robots.vercel.app

      - name: Commit the authored dream
        if: ${{ steps.author_dream.outcome == 'success' }}
        run: |
          if git diff --quiet -- projects/dream-cycle/backlog; then
            echo "No new proposal to commit."
            exit 0
          fi
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog
          git commit -m "daily dream: author $(date -u +%Y-%m-%d) proposal [skip ci]"
          # Rebase rather than force: hourly-conductor and task-event processing
          # write to main on their own schedule and one of them may have landed
          # while the model was thinking.
          git pull --rebase origin main
          git push origin HEAD:main
