name: daily-digest

# One ordered Daily Dream cycle, then the email:
#   1. author today's steering proposal
#   2. build the now-eligible prior proposal into six live records
#   3. attach its Facets
#   4. submit every staged Daily Dream request into the real ArtJob queue
#   5. commit the durable proposal/build/ArtJob evidence, even on a partial failure
#   6. report any Daily Dream failure without blocking digest delivery
#   7. render and send the digest
#   8. leave Daily Dream sidecar issues as warnings; digest/email failures still fail normally
#
# Human-requested creative resets also stay inside this sole-writer workflow. A
# revision-request push takes the dedicated creative-revision job, which preflights
# every request before patching existing rows / replacing unbuilt steering, submits
# replacement art through the same canonical submitter, persists evidence, and sends
# a correction digest. It does NOT run the normal morning creation job in parallel.
#
# ANTHROPIC_API_KEY is OPT-IN (2026-09-04, Silas: "I'm not spending $100 a month
# so it can then trigger the API"). The two model-authored steps -- the Daily
# Dream proposal and the container-log review -- get the key only on a manual
# workflow_dispatch with spend_api_credits=true. On the schedule, the docket is
# topped up by the hourly Conductor Agent sessions (see CLAUDE.md, session
# startup step 7) and the digest falls back to its mechanical log banner.
#
# The morning email showcases the bundle just built. Its six priority-200 ArtJobs get
# a bounded same-cycle render window, then the digest probes the live image paths and
# shows whatever is ready (with honest queue placeholders for the rest). Today's newly
# authored proposal remains a compact text-only preview because it has not been built yet.

on:
  schedule:
    - cron: "30 15 * * *"  # ≈8:30am Pacific in DST.
  push:
    branches:
      - main
    paths:
      - "projects/dream-cycle/revisions/*-request.json"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Actually send the Brevo email. Leave false for a safe dry run."
        required: false
        default: false
        type: boolean
      spend_api_credits:
        description: "Hand the model-authored steps ANTHROPIC_API_KEY. Off = sessions author the docket; no API spend."
        required: false
        default: false
        type: boolean

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  delivery-guard:
    # GitHub can deliver the nominal 15:30 UTC schedule hours late. If the
    # hourly watchdog already dispatched and completed today's replacement,
    # that delayed schedule is not a second Daily Dream cycle; it is a zombie
    # copy of the first trigger. Human workflow_dispatch runs remain explicit
    # operator actions and are never suppressed here.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Suppress a delayed duplicate delivery
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A human-triggered dispatch is an intentional resend/dry-run. The
          # duplicate we need to suppress is either the scheduled run itself or
          # an automated watchdog dispatch from github-actions[bot].
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.actor }}" != "github-actions[bot]" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Human workflow_dispatch is explicit; duplicate suppression is bypassed."
            exit 0
          fi

          today="$(date -u +%F)"
          runs="$(gh api --method GET             "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-digest.yml/runs"             -f branch=main             -f per_page=30)"

          # Look only backward. More importantly, a workflow can conclude
          # "success" with its digest job skipped by this very guard, so workflow
          # conclusion alone is not proof that mail was or will be sent. Confirm
          # the actual digest job is queued/running or completed successfully.
          candidate_ids="$(
            jq -r --arg today "$today" --argjson current "${GITHUB_RUN_ID}" '
              [.workflow_runs[]
                | select(.id < $current)
                | select(.created_at | startswith($today))
                | select(
                    .event == "schedule"
                    or (.event == "workflow_dispatch" and .actor.login == "github-actions[bot]")
                  )]
              | sort_by(.created_at)
              | reverse
              | .[].id
            ' <<<"$runs"
          )"

          prior=""
          for run_id in $candidate_ids; do
            jobs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" -f per_page=100)"
            digest_claim="$(
              jq -r '
                [.jobs[]
                  | select(.name == "digest")
                  | select(.status != "completed" or .conclusion == "success")]
                | length
              ' <<<"$jobs"
            )"
            if [ "$digest_claim" -gt 0 ]; then
              prior="$run_id"
              break
            fi
          done

          if [ -n "$prior" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's Daily Dream digest is already claimed by automated run ${prior}; suppressing this delayed duplicate."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: delivery-guard
    if: ${{ github.event_name != 'push' && needs.delivery-guard.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHOULD_SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
      KR_BASE_URL: https://kindrobots.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml Pillow

      - name: Author today's next Daily Dream proposal
        id: daily_dream_author
        continue-on-error: true
        run: python scripts/author_dream_proposal.py
        env:
          ANTHROPIC_API_KEY: ${{ inputs.spend_api_credits == true && secrets.ANTHROPIC_API_KEY || '' }}

      # These steps can produce durable evidence even when their final exit code
      # is non-zero: a build retry marker, a partial Facet ledger, or some
      # successfully submitted ArtJob IDs. Keep going long enough to commit that
      # evidence. Daily Dream sidecar failures are warnings; digest generation,
      # validation, configuration, and delivery still fail normally on their own.
      - name: Build the eligible Daily Dream proposal
        id: daily_dream_build
        continue-on-error: true
        run: python scripts/run_daily_dream_build.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Attach Daily Dream Facets
        id: daily_dream_facets
        if: ${{ steps.daily_dream_build.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/apply_daily_dream_facets.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Submit Daily Dream ArtJobs and give priority renders a head start
        id: daily_dream_art
        if: ${{ steps.daily_dream_build.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/submit_daily_dream_art.py --wait-timeout 300
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com

      - name: Commit Daily Dream cycle evidence
        if: ${{ always() }}
        id: daily_dream_commit
        continue-on-error: true
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog/ projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "Daily Dream cycle produced no repository changes."
            exit 0
          fi
          git commit -m "daily dream: build and submit $(date -u +%Y-%m-%d) cycle [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Daily Dream evidence push attempt ${attempt}/3 lost a race; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Unable to persist Daily Dream cycle evidence after 3 attempts."
          exit 1

      # Detection, not repair: the 2026-08-31 de-stemming fix corrected the
      # builder but left rows it had already built on live still garbled,
      # because the repair lane only rewrites backstory/desc when it also
      # rewrites carries -- so a bundle that never needed a prose repair goes
      # unchecked forever. This recomposes every built bundle's deterministic
      # fields and diffs them against the live row so the next builder fix
      # that doesn't back-propagate is caught this cycle, not whenever it
      # happens to surface on a card (dream-cycle/t-024).
      - name: Verify live prose composition
        id: daily_dream_verify_live
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/repair_dream_prose_catalog.py --verify-live --strict
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Verify Daily Dream cycle
        if: ${{ always() }}
        run: |
          if [ "${{ steps.daily_dream_author.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream authoring failed; digest delivery will continue."
          fi
          if [ "${{ steps.daily_dream_build.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream object build failed; digest delivery will continue."
          elif [ "${{ steps.daily_dream_facets.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream Facet attachment failed; digest delivery will continue."
          elif [ "${{ steps.daily_dream_art.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream ArtJob submission was partial or failed; digest delivery will continue."
          fi
          if [ "${{ steps.daily_dream_commit.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream evidence commit failed; digest delivery will continue."
          fi
          if [ "${{ steps.daily_dream_verify_live.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream live composed-field verification found drift (or failed to run); see the 'Verify live prose composition' step output above. Digest delivery will continue."
          fi

      # Must run before "Build digest JSON": build_digest.py reads the review
      # file this writes. It exits 0 on every failure path -- no key, no
      # digest, a stale digest, an API error -- so the worst case is the email
      # falling back to the mechanical one-line banner it had before.
      - name: Review Alexandria's container logs
        id: container_log_review
        continue-on-error: true
        run: python scripts/author_container_log_review.py
        env:
          ANTHROPIC_API_KEY: ${{ inputs.spend_api_credits == true && secrets.ANTHROPIC_API_KEY || '' }}

      # The review file carries the nag counter -- when each signature was
      # first written up -- so "unfixed for 9 days" is arithmetic on a
      # committed date rather than something a model was asked to remember.
      # That only works if the file survives the run, so it gets its own
      # commit rather than riding along with the Daily Dream evidence above,
      # which is staged several steps earlier.
      - name: Commit the container log review
        if: ${{ always() }}
        continue-on-error: true
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          if [ ! -f ops/home-server/CONTAINER-LOG-REVIEW.json ]; then
            # No key, no digest, or a stale one -- all normal, all silent.
            echo "No container log review was authored this run."
            exit 0
          fi
          git add ops/home-server/CONTAINER-LOG-REVIEW.json
          if git diff --staged --quiet; then
            echo "No container log review to commit."
            exit 0
          fi
          git commit -m "ops: container log review $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Container log review push attempt ${attempt}/3 lost a race; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::warning::Could not persist the container log review; the nag counter will restart."

      - name: Build digest JSON
        env:
          # Needed for the render-engine health line. Without it that section
          # degrades to "unresolved" and the digest silently stops reporting
          # whether the art pipeline can render at all.
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          python scripts/build_digest.py --since "24 hours ago" > digest-base.json
          python scripts/enrich_daily_dream_digest.py digest-base.json --output digest.json
          python scripts/annotate_daily_dream_art_queue.py digest.json
          cat digest.json

      - name: Validate digest JSON
        run: python scripts/validate_digest.py digest.json

      - name: Build Brevo payload preview
        run: python scripts/build_digest_email_v2.py digest.json digest-email.json

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-artifacts
          path: |
            digest-base.json
            digest.json
            digest-email.json
          if-no-files-found: warn

      - name: Check digest configuration
        run: python scripts/check_digest_config.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}

      - name: Email via Brevo
        if: ${{ env.SHOULD_SEND_EMAIL == 'true' }}
        run: python scripts/send_digest_brevo.py digest-email.json
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}

  creative-revision:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KR_BASE_URL: https://kindrobots.org
      KR_MEDIA_ORIGIN: https://media.acrocatranch.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml Pillow

      - name: Find pending creative revision requests
        id: pending
        shell: bash
        run: |
          shopt -s nullglob
          files=(projects/dream-cycle/revisions/*-request.json)
          if (( ${#files[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pending Daily Dream creative revisions."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${files[@]}" > /tmp/dream-revision-files.txt
          printf 'Revision requests:\n'
          cat /tmp/dream-revision-files.txt

      - name: Preflight all creative revisions
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          mapfile -t files < /tmp/dream-revision-files.txt
          python scripts/preflight_dream_revisions.py "${files[@]}"

      - name: Patch source and live Daily Dream entities
        if: steps.pending.outputs.found == 'true'
        shell: bash
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          mapfile -t files < /tmp/dream-revision-files.txt
          python scripts/apply_dream_revision.py "${files[@]}"

      - name: Submit replacement Daily Dream ArtJobs
        if: steps.pending.outputs.found == 'true'
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: python scripts/submit_daily_dream_art.py

      - name: Commit creative revision evidence
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog/ projects/dream-cycle/revisions/ projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "Revision produced no repository changes."
            exit 0
          fi
          git commit -m "daily dream: apply creative revision [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Revision evidence push attempt ${attempt}/3 lost a race; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Unable to persist Daily Dream revision evidence after 3 attempts."
          exit 1

      - name: Send creative-reset digest through Brevo
        if: steps.pending.outputs.found == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}
        run: |
          if [ -f creative-reset-email.json ]; then
            python scripts/send_digest_brevo.py creative-reset-email.json
          else
            echo "No creative-reset digest requested."
          fi
