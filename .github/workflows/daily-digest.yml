name: daily-digest

# One ordered Daily Dream cycle, then the email:
#   1. author today's steering proposal
#   2. build the now-eligible prior proposal into six live records
#   3. attach its Facets
#   4. submit every staged Daily Dream request into the real ArtJob queue
#   5. commit the durable proposal/build/ArtJob evidence, even on a partial failure
#   6. report any Daily Dream failure without blocking digest delivery
#   7. render and send the digest
#   8. fail the workflow after delivery if the Daily Dream sidecar was unhealthy
#
# The email itself shows the older completed bundle with art first, followed by
# the bundle just built in a compact no-image layout. Today's newly authored
# proposal is intentionally not a third showcase section.

on:
  schedule:
    - cron: "30 15 * * *"  # ≈8:30am Pacific in DST.
  workflow_dispatch:
    inputs:
      send_email:
        description: "Actually send the Brevo email. Leave false for a safe dry run."
        required: false
        default: false
        type: boolean

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHOULD_SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
      KR_BASE_URL: https://kindrobots.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml Pillow

      - name: Author today's next Daily Dream proposal
        id: daily_dream_author
        continue-on-error: true
        run: python scripts/author_dream_proposal.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # These steps can produce durable evidence even when their final exit code
      # is non-zero: a build retry marker, a partial Facet ledger, or some
      # successfully submitted ArtJob IDs. Keep going long enough to commit that
      # evidence. A Daily Dream failure is reported immediately, but the digest
      # is still rendered/sent before the workflow is marked failed at the end.
      - name: Build the eligible Daily Dream proposal
        id: daily_dream_build
        continue-on-error: true
        run: python scripts/build_dream_records.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Attach Daily Dream Facets
        id: daily_dream_facets
        if: ${{ steps.daily_dream_build.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/apply_daily_dream_facets.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Submit Daily Dream ArtJobs
        id: daily_dream_art
        if: ${{ steps.daily_dream_build.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/submit_daily_dream_art.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com

      - name: Commit Daily Dream cycle evidence
        if: ${{ always() }}
        id: daily_dream_commit
        continue-on-error: true
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog/ projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "Daily Dream cycle produced no repository changes."
            exit 0
          fi
          git commit -m "daily dream: build and submit $(date -u +%Y-%m-%d) cycle [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Daily Dream evidence push attempt ${attempt}/3 lost a race; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Unable to persist Daily Dream cycle evidence after 3 attempts."
          exit 1

      - name: Verify Daily Dream cycle
        if: ${{ always() }}
        run: |
          if [ "${{ steps.daily_dream_author.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream authoring failed; digest delivery will continue."
          fi
          if [ "${{ steps.daily_dream_build.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream object build failed; digest delivery will continue."
          elif [ "${{ steps.daily_dream_facets.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream Facet attachment failed; digest delivery will continue."
          elif [ "${{ steps.daily_dream_art.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream ArtJob submission was partial or failed; digest delivery will continue."
          fi
          if [ "${{ steps.daily_dream_commit.outcome }}" != "success" ]; then
            echo "::warning::Daily Dream evidence commit failed; digest delivery will continue."
          fi

      - name: Build digest JSON
        run: |
          python scripts/build_digest.py --since "24 hours ago" > digest-base.json
          python scripts/enrich_daily_dream_digest.py digest-base.json --output digest.json
          python scripts/annotate_daily_dream_art_queue.py digest.json
          cat digest.json

      - name: Validate digest JSON
        run: python scripts/validate_digest.py digest.json

      - name: Build Brevo payload preview
        run: python scripts/build_digest_email_v2.py digest.json digest-email.json

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-artifacts
          path: |
            digest-base.json
            digest.json
            digest-email.json
          if-no-files-found: warn

      - name: Check digest configuration
        run: python scripts/check_digest_config.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}

      - name: Email via Brevo
        if: ${{ env.SHOULD_SEND_EMAIL == 'true' }}
        run: python scripts/send_digest_brevo.py digest-email.json
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}

      - name: Fail after digest if Daily Dream cycle failed
        if: ${{ always() }}
        run: |
          failed=0
          if [ "${{ steps.daily_dream_author.outcome }}" != "success" ]; then
            echo "::error::Daily Dream authoring failed."
            failed=1
          fi
          if [ "${{ steps.daily_dream_build.outcome }}" != "success" ]; then
            echo "::error::Daily Dream object build failed; durable retry evidence was attempted."
            failed=1
          else
            if [ "${{ steps.daily_dream_facets.outcome }}" != "success" ]; then
              echo "::error::Daily Dream Facet attachment failed; durable bundle evidence was attempted."
              failed=1
            fi
            if [ "${{ steps.daily_dream_art.outcome }}" != "success" ]; then
              echo "::error::Daily Dream ArtJob submission was partial or failed; submitted IDs were attempted."
              failed=1
            fi
          fi
          if [ "${{ steps.daily_dream_commit.outcome }}" != "success" ]; then
            echo "::error::Daily Dream evidence commit failed."
            failed=1
          fi
          exit "$failed"
