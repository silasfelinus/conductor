name: daily-digest

# Emails Silas a daily summary across all projects + pitches awaiting his vote.
# Run via this cron OR from a managed assistant session pointed at scripts/build_digest.py.

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC ≈ 8am Pacific. Shifts with DST.
  workflow_dispatch:
    inputs:
      send_email:
        description: "Actually send the Brevo email. Leave false for a safe dry run."
        required: false
        default: false
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHOULD_SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml Pillow # Pillow => objective art-quality floor + image encode

      # --- Art-forward morning ritual -------------------------------------
      # Generate tomorrow's dream proposal (starter dream: 3 characters, 2
      # locations, a narrator, 2 rewards) and score the day's fresh renders for
      # the digest gallery. Both soft-fail: no ANTHROPIC_API_KEY (or the render
      # box offline) just means a thinner digest, never a red build.
      - name: Generate tomorrow's dream proposal
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_dream_proposal.py

      - name: Score the day's art (style assessor)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/curate_art.py --daily --limit 12

      - name: Commit proposal + daily scoring report
        continue-on-error: true
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/dream-cycle/backlog/ projects/curation/daily/
          if git diff --staged --quiet; then
            echo "No proposal/report changes to commit."
          else
            git commit -m "chore: daily dream proposal + art scoring [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi
      # --------------------------------------------------------------------

      - name: Build digest JSON
        run: |
          python scripts/build_digest.py --since "24 hours ago" > digest.json
          cat digest.json
      - name: Validate digest JSON
        run: python scripts/validate_digest.py digest.json
      - name: Build Brevo payload preview
        run: python scripts/build_digest_email.py digest.json digest-email.json
      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-artifacts
          path: |
            digest.json
            digest-email.json
          if-no-files-found: warn
      - name: Check digest configuration
        run: python scripts/check_digest_config.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}
      - name: Email via Brevo
        if: ${{ env.SHOULD_SEND_EMAIL == 'true' }}
        run: python scripts/send_digest_brevo.py digest-email.json
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}
