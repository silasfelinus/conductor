name: Apply Daily Dream Art Dedup

on:
  push:
    branches:
      - worker/dream-cycle-t-006-art-queue-dedup

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/dream-cycle-t-006-art-queue-dedup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused deduplication patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          builder_path = Path("scripts/build_dream_records.py")
          builder = builder_path.read_text(encoding="utf-8")
          old = '''def append_art_requests(entries: list[str], dry_run: bool) -> None:
              if not entries:
                  return
              text = ART_PROMPTS.read_text(encoding="utf-8")
              if "\\nrequests:" not in text and not text.startswith("requests:"):
                  text += "\\nrequests:\\n"
              request_yaml = "".join(entries)
              # requests is followed by other top-level collections (notably inspirations).
              # Appending at EOF silently turns request rows into malformed members of the
              # final collection. Insert immediately before the next top-level section.
              request_header = re.search(r"(?m)^requests:\\s*$", text)
              next_section = (
                  re.search(r"(?m)^[A-Za-z][A-Za-z0-9_-]*:\\s*$", text[request_header.end():])
                  if request_header else None
              )
              if request_header and next_section:
                  insertion = request_header.end() + next_section.start()
                  before = text[:insertion].rstrip() + "\\n"
                  after = text[insertion:].lstrip("\\n")
                  text = before + request_yaml + "\\n" + after
              else:
                  if not text.endswith("\\n"):
                      text += "\\n"
                  text += request_yaml
              if dry_run:
                  print(f"  [dry-run] would append {len(entries)} art request(s) to projects/art-prompts.yaml")
                  return
              ART_PROMPTS.write_text(text, encoding="utf-8")
              print(f"  appended {len(entries)} art request(s) to projects/art-prompts.yaml")
          '''.replace("          ", "")
          new = '''def _art_request_id(entry: str) -> Optional[str]:
              """Extract one request ID from the comment-preserving YAML fragment."""
              match = re.search(r"(?m)^-\\s+id:\\s*(['\\\"]?)([^'\\\"\\n]+)\\1\\s*$", entry)
              return match.group(2).strip() if match else None


          def append_art_requests(entries: list[str], dry_run: bool) -> None:
              if not entries:
                  return
              text = ART_PROMPTS.read_text(encoding="utf-8")
              if "\\nrequests:" not in text and not text.startswith("requests:"):
                  text += "\\nrequests:\\n"

              # Limit uniqueness checks to the requests collection. Other top-level
              # sections can legitimately carry their own id fields.
              request_header = re.search(r"(?m)^requests:\\s*$", text)
              request_start = request_header.end() if request_header else len(text)
              next_section = (
                  re.search(r"(?m)^[A-Za-z][A-Za-z0-9_-]*:\\s*$", text[request_start:])
                  if request_header else None
              )
              insertion = request_start + next_section.start() if next_section else len(text)
              existing_ids = {
                  request_id
                  for request_id in (
                      _art_request_id(match.group(0))
                      for match in re.finditer(
                          r"(?m)^-\\s+id:\\s*(['\\\"]?)([^'\\\"\\n]+)\\1\\s*$",
                          text[request_start:insertion],
                      )
                  )
                  if request_id
              }

              unique_entries: list[str] = []
              seen_ids = set(existing_ids)
              skipped = 0
              for entry in entries:
                  request_id = _art_request_id(entry)
                  if request_id and request_id in seen_ids:
                      skipped += 1
                      continue
                  if request_id:
                      seen_ids.add(request_id)
                  unique_entries.append(entry)

              if not unique_entries:
                  print(f"  skipped {skipped} already-queued art request(s)")
                  return

              request_yaml = "".join(unique_entries)
              if request_header and next_section:
                  before = text[:insertion].rstrip() + "\\n"
                  after = text[insertion:].lstrip("\\n")
                  text = before + request_yaml + "\\n" + after
              else:
                  if not text.endswith("\\n"):
                      text += "\\n"
                  text += request_yaml
              if dry_run:
                  print(
                      f"  [dry-run] would append {len(unique_entries)} art request(s) "
                      f"and skip {skipped} duplicate(s)"
                  )
                  return
              ART_PROMPTS.write_text(text, encoding="utf-8")
              print(
                  f"  appended {len(unique_entries)} art request(s) "
                  f"and skipped {skipped} duplicate(s)"
              )
          '''.replace("          ", "")
          if builder.count(old) != 1:
              raise SystemExit("append_art_requests source changed; refusing an ambiguous patch")
          builder_path.write_text(builder.replace(old, new, 1), encoding="utf-8")

          tests_path = Path("tests/test_daily_dream_bundle_art_queue.py")
          tests = tests_path.read_text(encoding="utf-8")
          additions = r'''


def test_append_art_requests_skips_ids_already_in_requests(tmp_path, monkeypatch):
    art = tmp_path / "art-prompts.yaml"
    _, _, existing = bdr.art_request_entry(
        "repeat-dream", "existing", "Existing", "existing prompt"
    )
    _, _, fresh = bdr.art_request_entry(
        "repeat-dream", "fresh", "Fresh", "fresh prompt"
    )
    art.write_text(
        "requests:\n"
        + existing
        + "inspirations:\n"
        + "- project: reference-project\n"
        + "  images:\n"
        + "  - image_path: reference.webp\n",
        encoding="utf-8",
    )
    monkeypatch.setattr(bdr, "ART_PROMPTS", art)

    bdr.append_art_requests([existing, fresh], dry_run=False)

    parsed = yaml.safe_load(art.read_text(encoding="utf-8"))
    assert [request["id"] for request in parsed["requests"]] == [
        "dream-cycle-repeat-dream-existing",
        "dream-cycle-repeat-dream-fresh",
    ]
    assert parsed["inspirations"] == [{
        "project": "reference-project",
        "images": [{"image_path": "reference.webp"}],
    }]


def test_append_art_requests_deduplicates_one_incoming_batch(tmp_path, monkeypatch):
    art = tmp_path / "art-prompts.yaml"
    art.write_text("requests:\n", encoding="utf-8")
    monkeypatch.setattr(bdr, "ART_PROMPTS", art)
    _, _, entry = bdr.art_request_entry(
        "same-batch", "only-once", "Only Once", "one prompt"
    )

    bdr.append_art_requests([entry, entry], dry_run=False)

    requests = yaml.safe_load(art.read_text(encoding="utf-8"))["requests"]
    assert [request["id"] for request in requests] == [
        "dream-cycle-same-batch-only-once"
    ]
'''
          if "test_append_art_requests_skips_ids_already_in_requests" in tests:
              raise SystemExit("deduplication tests already exist")
          tests_path.write_text(tests.rstrip() + additions + "\n", encoding="utf-8")

          queue_path = Path("projects/art-prompts.yaml")
          queue = queue_path.read_text(encoding="utf-8")
          header = re.search(r"(?m)^requests:\s*$", queue)
          if not header:
              raise SystemExit("projects/art-prompts.yaml has no requests section")
          next_section = re.search(
              r"(?m)^[A-Za-z][A-Za-z0-9_-]*:\s*$", queue[header.end():]
          )
          end = header.end() + next_section.start() if next_section else len(queue)
          block = queue[header.end():end]
          starts = list(re.finditer(r"(?m)^-\s+id:\s*(['\"]?)([^'\"\n]+)\1\s*$", block))
          prefix = block[:starts[0].start()] if starts else block
          kept = []
          first_by_id = {}
          removed = []
          for index, match in enumerate(starts):
              stop = starts[index + 1].start() if index + 1 < len(starts) else len(block)
              chunk = block[match.start():stop]
              request_id = match.group(2).strip()
              normalized = chunk.strip()
              if request_id in first_by_id:
                  if first_by_id[request_id] != normalized:
                      raise SystemExit(f"duplicate request {request_id} has conflicting content")
                  removed.append(request_id)
                  continue
              first_by_id[request_id] = normalized
              kept.append(chunk)
          expected = {
              "dream-cycle-the-filing-echidna-the-filing-echidna",
              "dream-cycle-the-filing-echidna-reef-cathedral-of-her-spine",
              "dream-cycle-the-filing-echidna-bramble-osei",
              "dream-cycle-the-filing-echidna-starlight-stamp",
              "dream-cycle-the-filing-echidna-wilderness-filing",
              "dream-cycle-the-filing-echidna-equinox-inspection-scenario",
          }
          if len(removed) != 6 or set(removed) != expected:
              raise SystemExit(f"expected six Filing Echidna duplicates, found {removed}")
          cleaned = prefix + "".join(kept)
          if cleaned and not cleaned.endswith("\n"):
              cleaned += "\n"
          queue_path.write_text(queue[:header.end()] + cleaned + queue[end:], encoding="utf-8")

          Path(".github/workflows/agent-apply-daily-dream-art-dedup.yml").unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Validate patch
        run: |
          python -m py_compile scripts/build_dream_records.py
          python -m pytest -q tests/
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import yaml

          data = yaml.safe_load(Path("projects/art-prompts.yaml").read_text(encoding="utf-8"))
          ids = [row.get("id") for row in data.get("requests", []) if isinstance(row, dict)]
          duplicates = [request_id for request_id, count in Counter(ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f"duplicate request ids remain: {duplicates}")
          filing = [request_id for request_id in ids if str(request_id).startswith("dream-cycle-the-filing-echidna-")]
          if len(filing) != 6:
              raise SystemExit(f"expected six Filing Echidna requests, found {len(filing)}")
          print(f"validated {len(ids)} unique art requests; six belong to The Filing Echidna")
          PY
      - name: Commit patch to branch
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add scripts/build_dream_records.py tests/test_daily_dream_bundle_art_queue.py projects/art-prompts.yaml .github/workflows/agent-apply-daily-dream-art-dedup.yml
          git commit -m "Deduplicate daily-dream art requests"
          git push origin HEAD:worker/dream-cycle-t-006-art-queue-dedup
