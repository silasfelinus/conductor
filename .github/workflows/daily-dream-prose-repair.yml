name: Daily Dream Prose Repair

on:
  push:
    branches:
      - main
    paths:
      - "projects/dream-cycle/prose-repairs/*-request.json"
  workflow_dispatch:

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      KR_BASE_URL: https://kindrobots.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml Pillow

      # Self-healing. Publishing is a separate phase from authoring, which made
      # source-ahead-of-live the safe failure -- but only if something can still
      # close the gap. Run 33477217234 wrote 17 bundles to main and then died
      # partway through publishing on a Kind Robots timeout, and because the
      # request file had already been consumed, no later run could reach the
      # receipt. Every run now finishes an unfinished publish first, request or
      # no request. Idempotent by content, so re-patching a row already patched
      # in the failed run is a no-op.
      - name: Resume any unfinished live publish
        id: resume
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: python scripts/repair_dream_prose_catalog.py --resume-pending

      - name: Persist resumed publish confirmation
        shell: bash
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog/ projects/dream-cycle/prose-repairs/
          if git diff --staged --quiet; then
            echo "Nothing resumed."
            exit 0
          fi
          git commit -m "daily dream: finish stranded prose-repair publish [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Resumed publish landed live but its evidence could not be pushed."
          exit 1

      - name: Locate prose-repair request
        id: pending
        shell: bash
        run: |
          shopt -s nullglob
          files=(projects/dream-cycle/prose-repairs/*-request.json)
          if (( ${#files[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pending Daily Dream prose repair."
            exit 0
          fi
          # A stranded receipt is handled by the resume step below, which runs
          # whether or not a request is present.
          if (( ${#files[@]} != 1 )); then
            echo "::error::Expected exactly one prose-repair request, found ${#files[@]}."
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "request=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Audit catalog before repair
        if: steps.pending.outputs.found == 'true'
        run: python scripts/repair_dream_prose_catalog.py --audit

      # Phase one writes repaired SOURCE only. Production is not touched until
      # that source is pushed, below. Run 33450722225 patched live first and then
      # had its evidence push rejected, leaving live ahead of main with the
      # repaired best_used_when values existing nowhere else.
      - name: Author and validate prose repairs (source only)
        if: steps.pending.outputs.found == 'true'
        id: author
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/repair_dream_prose_catalog.py "${{ steps.pending.outputs.request }}"
          receipt="${{ steps.pending.outputs.request }}"
          echo "receipt=${receipt/-request.json/-applied.json}" >> "$GITHUB_OUTPUT"

      - name: Verify catalog prose contract
        if: steps.pending.outputs.found == 'true'
        # Informational, not a gate. A partial batch is now a legitimate
        # outcome: bundles that failed are left untouched and stay flagged, so
        # complaints remaining here is expected and the receipt's
        # failed_bundles records exactly which. Per-bundle validation inside the
        # authoring step is what guarantees nothing half-repaired is written.
        run: python scripts/repair_dream_prose_catalog.py --audit

      - name: Commit prose-repair evidence
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dream-cycle/backlog/ projects/dream-cycle/prose-repairs/
          if git diff --staged --quiet; then
            echo "Prose repair produced no repository changes."
            exit 0
          fi
          git commit -m "daily dream: repair catalog prose [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Prose-repair evidence push attempt ${attempt}/3 lost a race; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Unable to persist Daily Dream prose-repair evidence after 3 attempts."
          echo "::error::No live rows were patched -- source is written first by design, so this is safely re-runnable."
          exit 1

      # Phase two. Only reached when the repaired source is durable on main.
      - name: Publish repaired copy to live records
        if: steps.pending.outputs.found == 'true'
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: python scripts/repair_dream_prose_catalog.py --publish "${{ steps.author.outputs.receipt }}"

      - name: Persist publish confirmation
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          git add projects/dream-cycle/backlog/ projects/dream-cycle/prose-repairs/
          if git diff --staged --quiet; then
            echo "No publish confirmation to persist."
            exit 0
          fi
          git commit -m "daily dream: confirm prose repair published to live [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Live rows are patched but the confirmation commit did not land; re-run --publish to reconcile."
          exit 1
