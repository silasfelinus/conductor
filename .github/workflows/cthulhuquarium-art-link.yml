name: Cthulhuquarium Art Link

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read

concurrency:
  group: cthulhuquarium-art-link
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KR_API_BASE: https://kindrobots.org
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Link plates to Monster rows
        run: |
          if [[ "${{ inputs.mode }}" == "write" ]]; then
            python3 scripts/link_cthulhuquarium_monster_art_api.py --write
          else
            python3 scripts/link_cthulhuquarium_monster_art_api.py
          fi
