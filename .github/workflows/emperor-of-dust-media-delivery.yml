name: Emperor of Dust curated media delivery

# Existing DONE ArtImages only. Never auto-run a secret-consuming or
# potentially outward-facing media write on PR, push, merge or schedule.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Regex matching ledger asset paths, e.g. ^endings/ or ^quests/"
        type: string
        required: true
        default: "^endings/"
      mode:
        description: "audit = no writes, deliver = explicitly curated keepers only"
        type: choice
        options:
          - audit
          - deliver
        required: true
        default: audit
      approval_phrase:
        description: "For deliver only: type APPROVED_CURATED_ART_DELIVERY"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: emperor-of-dust-curated-media-delivery
  cancel-in-progress: false

jobs:
  audit-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
      KR_BASE_URL: https://kindrobots.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ledger reader dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate explicit write approval and available credential
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval_phrase }}
        run: |
          set -eu
          if [ "$REQUESTED_MODE" = "deliver" ] && \
             [ "$APPROVAL" != "APPROVED_CURATED_ART_DELIVERY" ]; then
            echo "::error::Actual media publication requires an explicit approval phrase."
            exit 1
          fi
          if [ -z "$KR_API_TOKEN" ]; then
            echo "::error::KR_API_TOKEN is unavailable."
            exit 1
          fi
      - name: Build source-backed offline batch plan
        env:
          ART_SCOPE: ${{ inputs.scope }}
        run: |
          python scripts/deliver_emperor_art_to_media.py \
            --plan --only "$ART_SCOPE" \
            --report "$RUNNER_TEMP/emperor-art-source-plan.json"
      - name: Audit remote durable-media delivery without writing
        if: ${{ inputs.mode == 'audit' }}
        env:
          ART_SCOPE: ${{ inputs.scope }}
        run: |
          python scripts/deliver_emperor_art_to_media.py \
            --live --only "$ART_SCOPE" \
            --report "$RUNNER_TEMP/emperor-art-delivery-receipt.json"
      - name: Deliver already curated keepers, refusing overwrite
        if: ${{ inputs.mode == 'deliver' }}
        env:
          ART_SCOPE: ${{ inputs.scope }}
        run: |
          python scripts/deliver_emperor_art_to_media.py \
            --live --write --only "$ART_SCOPE" \
            --report "$RUNNER_TEMP/emperor-art-delivery-receipt.json"
      - name: Preserve only ID, checksum and URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-art-delivery-receipt
          path: |
            ${{ runner.temp }}/emperor-art-source-plan.json
            ${{ runner.temp }}/emperor-art-delivery-receipt.json
          retention-days: 14
          if-no-files-found: warn
