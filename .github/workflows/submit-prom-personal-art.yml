name: Submit Prom of Doom Personal Outcomes
# A targeted, repeatable submission lane. The generic sweep is too broad to
# attribute accepted ArtJobs when another project is filling the render queue.
# The reconciler reads the server queue before posting each missing personal
# outcome, so interrupted runs can safely retry without double-enqueueing.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-prom-personal-art.yml"
      - "scripts/submit_prom_personal_outcomes.py"
      - "projects/comet-city-academy/art/PERSONAL-CONSEQUENCES-ROUND-1.yaml"
  workflow_dispatch:
  # GitHub App merge commits do not necessarily emit a runnable push workflow.
  # Exactly one trusted comment on the already-merged submission PR can start it.
  issue_comment:
    types: [created]

concurrency:
  group: auto-art-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 6733 &&
       github.event.comment.body == '/submit-prom-outcomes-144 n7q4' &&
       github.event.comment.user.login == 'silasfelinus')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KR_BASE_URL: https://kindrobots.org
    steps:
      - name: Check out latest Conductor main
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The prompt-contract preflight (check_art_prompts_live_contract.py) runs kind_robots'
      # artPromptContract.ts under Node type stripping, which needs Node 22. Without it the
      # preflight falls back to the negation mirror and claim-time rejections reach the queue.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install art-submission dependencies
        run: python -m pip install pyyaml pillow

      - name: Verify the 144-request contract and reconciliation logic
        run: python -m unittest discover -s tests -p 'test_prom_personal_artjob_submit.py'

      - name: Reconcile and submit only missing Prom of Doom personal outcomes
        id: submit_art
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          python scripts/submit_prom_personal_outcomes.py --live

      - name: Record durable submission receipt
        if: always() && steps.checkout.outcome == 'success'
        env:
          SUBMIT_RESULT: ${{ steps.submit_art.outcome }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          path = Path("projects/comet-city-academy/art/PERSONAL-CONSEQUENCES-ROUND-1.yaml")
          output = Path("ops/prom-of-doom-personal-art-submit.json")
          result = os.getenv("SUBMIT_RESULT", "unknown")
          ids = []
          images = []
          try:
              data = yaml.safe_load(path.read_text())
              subjects = data.get("subjects", [])
              ids = [s["jobs"]["krea2"] for s in subjects
                     if isinstance(s.get("jobs"), dict) and isinstance(s["jobs"].get("krea2"), int)]
              images = [(s.get("art") or {}).get("krea2", {}).get("art_image_id")
                        for s in subjects if isinstance(s.get("art"), dict)]
              images = [v for v in images if isinstance(v, int) and v > 0]
          except Exception:
              result = "invalid-ledger"
          body = {
              "artRound": "prom-of-doom-personal-consequences-20261027",
              "workflowRunId": int(os.getenv("CURRENT_RUN", "0")),
              "submitStepOutcome": result,
              "requested": 144,
              "artJobsRecorded": len(ids),
              "artImagesRecorded": len(images),
              "allSubmitted": len(ids) == 144,
          }
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(body, indent=2) + "\n")
          print("Prom of Doom submission receipt:", body)
          PY

      # Commit accepted ArtJob IDs even if a partial batch failed. The next
      # run queries the server and recovers uncommitted jobs before POSTing.
      - name: Checkpoint accepted IDs and statuses
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/comet-city-academy/art/PERSONAL-CONSEQUENCES-ROUND-1.yaml
          git add ops/prom-of-doom-personal-art-submit.json
          if git diff --staged --quiet; then
            echo "No new personal ArtJob IDs or statuses to checkpoint."
          else
            git commit -m "chore: checkpoint Prom of Doom personal ArtJobs [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "Recorded accepted personal ArtJob IDs on Conductor main."
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not checkpoint ArtJob IDs; next run must reconcile before submitting." >&2
                exit 1
              fi
              git pull --rebase --autostash origin main || exit 1
              sleep "$attempt"
            done
          fi
