name: One-time Oversight Warning Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-oversight-warning-cleanup.yml

permissions:
  contents: write

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Remove stale duplicate roadmap key
        shell: python
        run: |
          from pathlib import Path

          path = Path('projects/cthulhuquarium/roadmap.yaml')
          text = path.read_text(encoding='utf-8')
          needle = "  # ------------------------------------------------------- m3 POLISH & SHIP\n    updated: '2026-08-26T20:19:15Z'\n  - id: t-016\n"
          replacement = "  # ------------------------------------------------------- m3 POLISH & SHIP\n  - id: t-016\n"
          if needle not in text:
              raise SystemExit('Expected stale duplicate updated key was not found; refusing broad edit')
          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one cleanup target, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Validate and regenerate roadmap audit
        run: |
          python scripts/validate_roadmaps.py
          python scripts/audit_roadmaps.py

      - name: Remove one-shot workflow and persist cleanup
        run: |
          rm .github/workflows/one-time-oversight-warning-cleanup.yml
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/cthulhuquarium/roadmap.yaml ROADMAP-AUDIT.md ROADMAP-AUDIT.json .github/workflows/one-time-oversight-warning-cleanup.yml
          git diff --staged --check
          git commit -m "fix(oversight): clear roadmap audit warnings [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
