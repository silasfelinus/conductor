name: Prom and Tactics Private Art Byte Proof

# Rendered receipts are not delivery. This independent lane fetches every
# private crew and house-style ArtImage through authenticated production media,
# inspects real bytes, and publishes ONLY metadata (no private art files).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prom-tactics-private-media-proof.yml"
      - "scripts/verify_prom_tactics_private_media.py"
      - "tests/test_verify_prom_tactics_private_media.py"
      - "projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml"
      - "projects/comet-city-academy/art/UNSTABLE-PRODUCTION-FAMILY-ROUND-1.yaml"
      - "projects/comet-city-academy/art/FRANCHISE-SAFE-RERENDERS-ROUND-1.yaml"
      - "projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml"
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prom-tactics-private-media-proof
  cancel-in-progress: false

jobs:
  verify-private-image-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KR_BASE_URL: https://kindrobots.org
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media proof dependencies
        run: pip install pyyaml Pillow pytest
      - name: Test media proof contracts without production credentials
        run: python -m pytest -q tests/test_verify_prom_tactics_private_media.py
      - name: Probe twelve Tactics and twenty Prom production images
        run: |
          if [ -z "$KR_API_TOKEN" ]; then
            echo "::error::KR_API_TOKEN is unavailable. No production media probe ran."
            exit 1
          fi
          python scripts/verify_prom_tactics_private_media.py \
            projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml \
            projects/comet-city-academy/art/UNSTABLE-PRODUCTION-FAMILY-ROUND-1.yaml \
            projects/comet-city-academy/art/FRANCHISE-SAFE-RERENDERS-ROUND-1.yaml \
            projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml \
            --min-done 32 --report "$RUNNER_TEMP/prom-tactics-media-proof.json"
      # This public repository may expose Actions artifacts to viewers. The
      # report contains dimensions, hashes and receipt IDs, never image bytes,
      # authenticated URLs or tokens. No JPEG/WebP contact sheets are uploaded.
      - name: Preserve non-image technical verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prom-tactics-private-media-metadata
          path: ${{ runner.temp }}/prom-tactics-media-proof.json
          if-no-files-found: ignore
          retention-days: 30
