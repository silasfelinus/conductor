name: Project Sync

on:
  push:
    branches:
      - main
    paths:
      - "project-overrides.yaml"
      - "projects/**/roadmap.yaml"
      - "scripts/sync_projects.py"
      - ".github/workflows/project-sync.yml"
  workflow_dispatch:

concurrency:
  group: project-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyyaml
      - name: Run sync script
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(python scripts/sync_projects.py 2>&1)"
          status=$?
          echo "## Project Sync" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$status"
