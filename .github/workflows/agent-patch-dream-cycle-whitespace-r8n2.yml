# Triggered after the canonical fixture and focused suite were green.
name: Patch Dream Cycle Cleanup Whitespace

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-patch-dream-cycle-whitespace-r8n2.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add whitespace normalization to the cleanup gate
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path(".github/workflows/agent-dream-cycle-doc-hygiene-r8n2.yml")
          text = target.read_text(encoding="utf-8")
          old = "          python scripts/check_daily_dream_pipeline.py\n"
          new = (
              "          sed -i 's/[[:space:]]\\+$//' "
              "projects/dream-cycle/CREATIVE-SEED-CONTRACT.md "
              "projects/dream-cycle/DESIGN-BRIEF.md "
              "projects/dream-cycle/docs/api-surface.md\n"
              + old
          )
          if text.count(old) != 1:
              raise SystemExit("cleanup validation insertion point changed")
          target.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/agent-patch-dream-cycle-whitespace-r8n2.yml").unlink()
          PY
      - name: Commit patch and trigger cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "dream-cycle-whitespace-patch[bot]"
          git config user.email "dream-cycle-whitespace-patch[bot]@users.noreply.github.com"
          git add -A .github/workflows/agent-dream-cycle-doc-hygiene-r8n2.yml .github/workflows/agent-patch-dream-cycle-whitespace-r8n2.yml
          git commit -m "Normalize generated Dream Cycle documentation whitespace"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
