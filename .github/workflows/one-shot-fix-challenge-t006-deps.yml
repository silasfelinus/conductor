name: One-shot Fix Challenge t-006 Dependencies

on:
  push:
    branches:
      - worker/challenge-center-t-005-complete

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/challenge-center-t-005-complete
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: pip install pyyaml

      - name: Normalize dependency list and resolve
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('projects/challenge-center/roadmap.yaml')
          data = yaml.safe_load(path.read_text())
          task = next(t for t in data['tasks'] if t['id'] == 't-006')
          raw = task.get('depends_on')
          if isinstance(raw, str) and ',' in raw:
              task['depends_on'] = [part.strip() for part in raw.split(',') if part.strip()]
          path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True, width=100))
          PY
          python scripts/resolve_deps.py

      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-fix-challenge-t006-deps.yml
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/challenge-center/roadmap.yaml .github/workflows/one-shot-fix-challenge-t006-deps.yml
          git commit -m "fix: normalize challenge t-006 dependencies"
          git push origin HEAD:worker/challenge-center-t-005-complete
