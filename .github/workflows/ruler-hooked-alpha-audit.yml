name: Ruler Hooked Alpha Audit

on:
  pull_request:
    paths:
      - scripts/audit_ruler_hooked_alpha.py
      - tests/test_ruler_hooked_alpha.py
      - projects/art-prompts.yaml
      - .github/workflows/ruler-hooked-alpha-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test the WebP header and request selection contracts
        run: python -m unittest tests.test_ruler_hooked_alpha -v
      - name: Audit delivered Ruler Hooked region art (report-only)
        run: |
          python scripts/audit_ruler_hooked_alpha.py \
            --manifest projects/art-prompts.yaml \
            --json artifacts/ruler-hooked-alpha.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruler-hooked-alpha-report
          path: artifacts/ruler-hooked-alpha.json
          if-no-files-found: ignore
