name: Coloring Book Package Readiness

on:
  pull_request:
    paths:
      - "projects/coloring-book/print-package.yaml"
      - "projects/coloring-book/cover-art-jobs.yaml"
      - "projects/coloring-book/sets/*/proposals.yaml"
      - "projects/coloring-book/sets/*/approved/**"
      - "projects/coloring-book/sets/*/generated/**"
      - "scripts/coloring_book_package_status.py"
      - "tests/test_coloring_book_package_status.py"
      - ".github/workflows/coloring-book-package-readiness.yml"
  push:
    branches: [main]
    paths:
      - "projects/coloring-book/print-package.yaml"
      - "projects/coloring-book/cover-art-jobs.yaml"
      - "projects/coloring-book/sets/*/proposals.yaml"
      - "projects/coloring-book/sets/*/approved/**"
      - "projects/coloring-book/sets/*/generated/**"
      - "scripts/coloring_book_package_status.py"
      - "tests/test_coloring_book_package_status.py"
      - ".github/workflows/coloring-book-package-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coloring-book-package-readiness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Verify package readiness contracts
        run: python -m unittest tests.test_coloring_book_package_status

      - name: Build current readiness and ordered manifests
        run: python scripts/coloring_book_package_status.py --check

      - name: Commit generated readiness on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "conductor-coloring-package[bot]"
          git config user.email "conductor-coloring-package[bot]@users.noreply.github.com"
          git add \
            projects/coloring-book/print-readiness.yaml \
            projects/coloring-book/packages/*/interiors.yaml

          if git diff --staged --quiet; then
            echo "Coloring-book package readiness is current."
            exit 0
          fi

          git commit -m "docs: refresh coloring-book package readiness [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1
