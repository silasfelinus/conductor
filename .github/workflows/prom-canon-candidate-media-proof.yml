name: Prom Canon Candidate Private Media Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prom-canon-candidate-media-proof.yml"
      - "scripts/verify_prom_tactics_media.py"
      - "scripts/verify_tactics_runtime_media.py"
      - "scripts/prove_private_media_ledgers.py"
      - "tests/test_prove_private_media_ledgers.py"
      - "tests/test_prom_canon_candidate_media.py"
      - "projects/comet-city-academy/art/CANON-ASHA-FOUR-ARM-REPAINT-2026-11-21.yaml"
      - "projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml"
  workflow_dispatch:

concurrency:
  group: prom-canon-candidate-media-proof
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-private-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KR_BASE_URL: https://kindrobots.org
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private media QA dependencies
        run: pip install pyyaml pillow pytest
      - name: Verify ten canonical replacement receipts and proof commands
        run: python -m pytest -q tests/test_prom_canon_candidate_media.py tests/test_prove_private_media_ledgers.py
      - name: Verify production API credential is configured
        run: |
          if [ -z "$KR_API_TOKEN" ]; then
            echo "::error::Production art media credential unavailable; no private images fetched."
            exit 1
          fi
      - name: Fetch and prove four original Asha repaint candidates
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/comet-city-academy/art/CANON-ASHA-FOUR-ARM-REPAINT-2026-11-21.yaml:4 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint four Asha candidate media receipts [skip ci]"
      - name: Fetch and prove six original canon-outcome replacements
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml:6 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint six canon-outcome candidate media receipts [skip ci]"
