name: Conductor Oversight

# Repo-side watchdog for portfolio drift plus disappearance of the OpenAI
# scheduled Conductor agent specifically. Claude's scheduled sessions do not
# satisfy the OpenAI heartbeat marker.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  oversight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build portfolio oversight report
        id: oversight
        shell: bash
        run: |
          set +e
          python scripts/build_portfolio_oversight.py --fail-on-action
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Upload oversight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-oversight
          path: |
            PORTFOLIO-OVERSIGHT.json
            PORTFOLIO-OVERSIGHT.md
          retention-days: 30

      - name: Persist oversight report
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add PORTFOLIO-OVERSIGHT.json PORTFOLIO-OVERSIGHT.md
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: refresh portfolio oversight [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to persist oversight report after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      # An actionable sensor result is not a workflow crash. Send the actual
      # reason through the same Brevo path as the digest instead of deliberately
      # turning the job red and making GitHub email only "Run failed".
      - name: Email explained oversight action
        if: ${{ steps.oversight.outputs.exit_code != '0' }}
        shell: bash
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME }}
        run: |
          subject="$(python scripts/render_portfolio_oversight_alert.py PORTFOLIO-OVERSIGHT.json --subject)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/render_portfolio_oversight_alert.py PORTFOLIO-OVERSIGHT.json --run-url "$run_url" \
            | python scripts/send_alert_brevo.py --subject "$subject" --body -
          echo "::notice::Portfolio oversight needs attention; sent an email explaining the triggering sensor(s)."
