name: Conductor Oversight

# Repo-side watchdog for portfolio drift plus disappearance of the OpenAI
# scheduled Conductor agent specifically. Claude's scheduled sessions do not
# satisfy the OpenAI heartbeat marker.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  oversight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build portfolio oversight report
        run: python scripts/build_portfolio_oversight.py
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Decide whether external email escalation is due
        id: email_gate
        shell: bash
        run: |
          needed="$(python scripts/portfolio_oversight_email_gate.py PORTFOLIO-OVERSIGHT.json)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "Portfolio oversight email escalation needed: $needed"

      - name: Upload oversight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-oversight
          path: |
            PORTFOLIO-OVERSIGHT.json
            PORTFOLIO-OVERSIGHT.md
          retention-days: 30

      - name: Persist oversight report
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add PORTFOLIO-OVERSIGHT.json PORTFOLIO-OVERSIGHT.md
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: refresh portfolio oversight [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to persist oversight report after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      # Deterministic failures/unresolved parity retain their existing policy.
      # The due sensor dispatches the GitHub-hosted LLM job if no recent
      # attempt exists. It does not email Silas merely for missing a deadline.
      - name: Ensure due semantic review was attempted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ensure_semantic_intent_review.py

      # Only an actual failed review run recorded by GitHub (or an explicit
      # failure marker) is an incident eligible for semantic email escalation.
      - name: Email explained oversight action
        if: ${{ steps.email_gate.outputs.needed == 'true' }}
        shell: bash
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME }}
        run: |
          subject="$(python scripts/render_portfolio_oversight_alert.py PORTFOLIO-OVERSIGHT.json --subject)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/render_portfolio_oversight_alert.py PORTFOLIO-OVERSIGHT.json --run-url "$run_url" \
            | python scripts/send_alert_brevo.py --subject "$subject" --body -
          echo "::notice::Portfolio oversight needs attention; sent an email explaining the triggering sensor(s)."

      - name: Record delivered oversight alert
        if: ${{ steps.email_gate.outputs.needed == 'true' }}
        run: |
          python scripts/portfolio_oversight_email_gate.py PORTFOLIO-OVERSIGHT.json --record
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add PORTFOLIO-OVERSIGHT-EMAIL-STATE.json
          git commit -m "chore: record oversight notification [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to record oversight notification after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
