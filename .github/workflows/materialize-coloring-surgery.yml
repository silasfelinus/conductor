name: Materialize coloring surgery

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/coloring-book/.surgery-payload/**"
      - "scripts/materialize_coloring_surgery.py"
      - ".github/workflows/materialize-coloring-surgery.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml
      - name: Expand validated coloring-book files
        run: python scripts/materialize_coloring_surgery.py
      - name: Validate generated files
        run: |
          python scripts/coloring_proposal_status.py --check
          python scripts/consume_coloring_book_color_art.py --limit 18
      - name: Commit materialized surgery
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Coloring surgery is already materialized."
            exit 0
          fi
          git commit -m "coloring-book: queue color-first proposals in 18-image passes"
          git push origin HEAD:${{ github.head_ref }}
