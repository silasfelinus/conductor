name: Patch Interface Vision recurring dependencies 3172

on:
  push:
    branches:
      - worker/interface-vision-dependency-3172

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install roadmap parser dependency
        run: python -m pip install pyyaml

      - name: Remove impossible recurring completion dependencies
        run: |
          python scripts/set_task_field.py interface-vision t-105 depends_on null
          python scripts/set_task_field.py interface-vision t-106 depends_on null
          python scripts/validate_roadmaps.py
          python - <<'PY'
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path('projects/interface-vision/roadmap.yaml').read_text())
          tasks = {task['id']: task for task in data['tasks']}
          assert tasks['t-104'].get('recurring') is True
          assert tasks['t-105'].get('recurring') is True
          assert tasks['t-105'].get('depends_on') is None
          assert tasks['t-105']['status'] == 'blocked'
          assert tasks['t-106'].get('depends_on') is None
          assert tasks['t-106']['status'] == 'waiting'
          assert tasks['t-106'].get('gate_human') is True
          print('Interface Vision dependency repair verified.')
          PY

      - name: Commit roadmap patch
        run: |
          if git diff --quiet -- projects/interface-vision/roadmap.yaml; then
            echo 'No roadmap change required.'
            exit 0
          fi
          git config user.name 'conductor-bot'
          git config user.email 'conductor-bot@users.noreply.github.com'
          git add projects/interface-vision/roadmap.yaml
          git commit -m 'fix(interface-vision): remove recurring completion dependencies'
          git push origin HEAD:worker/interface-vision-dependency-3172
