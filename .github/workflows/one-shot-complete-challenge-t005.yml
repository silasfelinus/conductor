name: One-shot Complete Challenge Center t-005

on:
  push:
    branches:
      - worker/challenge-center-t-005-complete

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/challenge-center-t-005-complete
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: pip install pyyaml

      - name: Close task and unblock dependents
        run: |
          python scripts/worker_task_status.py done challenge-center t-005 --note "DONE (2026-07-12): Kind Robots PR #208 merged the Challenge Center browser on the existing /challenges content route. It adds division/status filters, fight-card styling, difficulty stars, entrant counts, per-challenge leader previews, and links into /challenges/[slug]. TypeScript and contract CI passed; the Vercel preview build completed successfully."
          cat >> LEARNING.yaml <<'EOF'
          - date: 2026-07-12
            project: challenge-center
            task: t-005
            kind: software
            stakes: reversible
            passes: 0
            outcome: done
            failure_category: null
            lesson: "Upgrade the existing project-front content route rather than creating a duplicate page; API-backed filters and lightweight leaderboard previews can turn a partial browser into the shipped arena without schema work."
          EOF
          python scripts/resolve_deps.py

      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-complete-challenge-t005.yml
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/challenge-center/roadmap.yaml LEARNING.yaml .github/workflows/one-shot-complete-challenge-t005.yml
          git commit -m "done: challenge-center/t-005"
          git push origin HEAD:worker/challenge-center-t-005-complete
