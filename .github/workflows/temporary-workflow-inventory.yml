name: Temporary workflow inventory

on:
  push:
    branches:
      - worker/workflow-audit-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate current coloring-book gates
        run: |
          echo TEST_FILES_BEGIN
          find tests -maxdepth 2 -type f | sort | grep -Ei 'color|semantic|render|artjob' || true
          echo TEST_FILES_END
          echo SEMANTIC_REFERENCES_BEGIN
          grep -R -n -E 'coloring_book_semantic_gate|semantic gate|semantic_gate' tests scripts .github/workflows projects/coloring-book || true
          echo SEMANTIC_REFERENCES_END
          echo WORKFLOW_VALIDATION_BEGIN
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          failures = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('All workflow YAML parsed successfully.')
          PY
          echo WORKFLOW_VALIDATION_END
