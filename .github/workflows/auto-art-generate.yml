name: Auto Art Generate

# Closes the autonomous art loop (art-generator-connect/t-012) so no one has to
# run scripts on a local drive. On a schedule (and on demand) this:
#   1. (optional) refreshes projects/art-generate.yaml to ONLY the project
#      icon/card/hero art currently MISSING from projects/images/ — this is what
#      makes the loop self-draining: once an image lands, it stops being queued.
#   2. submits each queued entry to the kind_robots ArtJob queue on Vercel
#      (public endpoint, machine-auth via KR_API_TOKEN — no Tailscale needed for
#      this direction). This covers BOTH lanes: the self-draining project-art
#      batch (art-generate.yaml) and the requests: block of art-prompts.yaml
#      (ad-hoc / missing-image / voice requests), so everything funnels through
#      the same queue.
#   3. the home-box relay agent (already under pm2) claims each job outward,
#      renders on localhost ComfyUI/A1111, and uploads the result.
#   4. downloads finished images into projects/process/, routes them with
#      distribute_images.py, and commits conductor- and kind_robots-side results.
#
# Box-down tolerance: if the home box is offline, jobs simply wait in the queue
# and the consume step times out; that step is allowed to fail without failing
# the whole run, so an offline box is a soft no-op rather than a red build.

on:
  schedule:
    - cron: "0 9 * * *" # daily ~2am Pacific; bump the cadence any time
  workflow_dispatch:
    inputs:
      limit:
        description: "Max entries to generate this run"
        default: "5"
        required: false
      timeout:
        description: "Seconds to wait per job before giving up"
        default: "300"
        required: false
      refresh_queue:
        description: "Rebuild art-generate.yaml from currently-missing project art first (self-draining). Set false to consume the committed queue as-is."
        default: "true"
        required: false

concurrency:
  group: auto-art-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: conductor
          fetch-depth: 0

      # kind_robots checkout so distribute_images.py can land site-side images.
      # Needs GH_PAT (repo scope). Fails soft: if unavailable, kind_robots-target
      # files stay in projects/process/ for the distribute-images workflow.
      - uses: actions/checkout@v4
        id: kr-checkout
        continue-on-error: true
        with:
          repository: silasfelinus/kind_robots
          path: kind_robots
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml Pillow # Pillow => proper .webp output from the consumer

      - name: Refresh queue to currently-missing project art
        if: ${{ (github.event.inputs.refresh_queue || 'true') != 'false' }}
        working-directory: conductor
        run: python scripts/queue_missing_project_art.py --limit ${{ github.event.inputs.limit || '5' }}

      - name: Submit + wait + download (live)
        id: consume
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          python scripts/consume_art_queue.py --live \
            --limit ${{ github.event.inputs.limit || '5' }} \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      # Drain the requests: block of art-prompts.yaml (ad-hoc / missing-image /
      # voice requests) through the same ArtJob queue. Marks each done. Fails
      # soft like the batch consume: an offline box just leaves them pending.
      - name: Submit + wait + download art requests (live)
        id: consume_requests
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          python scripts/consume_art_requests.py --live \
            --limit ${{ github.event.inputs.limit || '5' }} \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      - name: Route downloaded images
        working-directory: conductor
        run: python scripts/distribute_images.py

      - name: Commit conductor results
        working-directory: conductor
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/images/ projects/process/ projects/art-generate.yaml projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "No conductor-side changes."
          else
            git commit -m "chore: auto-generate project art [skip ci]"
            # This job runs for ~an hour, so main almost always moves under it.
            # Rebase onto the latest main and retry, so a genuine render never
            # gets stranded on a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Commit kind_robots results
        if: steps.kr-checkout.outcome == 'success'
        working-directory: kind_robots
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "No kind_robots-side changes."
          else
            git commit -m "chore: auto-generated art from conductor queue"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Report generation outcome
        run: |
          for step in "batch:${{ steps.consume.outcome }}" "requests:${{ steps.consume_requests.outcome }}"; do
            name="${step%%:*}"; outcome="${step#*:}"
            if [ "$outcome" = "success" ]; then
              echo "$name consume step succeeded."
            else
              echo "::warning::$name consume step did not fully succeed — the home render box may be offline, or some jobs failed/timed out. Queued jobs wait in the kind_robots ArtJob queue and will be picked up on the next run when the box is back online."
            fi
          done