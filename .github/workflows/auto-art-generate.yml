name: Auto Art Generate

# Closes the autonomous art loop (art-generator-connect/t-012) so no one has to
# manually shepherd generated files. On a schedule (and on demand) this:
#   1. repairs legacy request paths/prompts and optionally refreshes project art
#   2. repairs and requeues failed Kind Robots jobs with legacy payloads
#   3. submits project-art and ad-hoc request lanes to the Kind Robots ArtJob queue
#   4. the home-box relay renders each job and writes Kind Robots-targeted files
#      directly to self-hosted media before completing the job
#   5. conductor-targeted results (and any direct-media verification fallback)
#      land in projects/process/ and are routed by distribute_images.py
#   6. commits only conductor metadata/assets; Kind Robots image binaries are no
#      longer checked out or committed by this workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-art-generate.yml"
      - "projects/art-prompts.yaml"
      - "scripts/consume_art_requests_to_media.py"
      - "scripts/repair_art_request_defaults.py"
      - "scripts/repair_failed_kindrobots_artjobs.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max entries to generate this run (blank = drain the whole queue)"
        default: ""
        required: false
      timeout:
        description: "Seconds to wait per job before giving up"
        default: "300"
        required: false
      refresh_queue:
        description: "Rebuild art-generate.yaml from currently-missing project art first (self-draining). Set false to consume the committed queue as-is."
        default: "true"
        required: false

concurrency:
  group: auto-art-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: conductor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml Pillow

      - name: Canonicalize committed art requests
        working-directory: conductor
        run: python scripts/repair_art_request_defaults.py --write

      - name: Check render box health
        id: boxhealth
        working-directory: conductor
        env:
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
        run: |
          STATUS_FILE="ops/home-server/RENDER-BOX-STATUS"
          PREV="unknown"
          if [ -f "$STATUS_FILE" ]; then PREV="$(tr -d '[:space:]' < "$STATUS_FILE")"; fi
          if python scripts/check_render_box.py; then
            NOW="up"
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Render box reachable — repairing and draining the pending art queue."
          else
            NOW="down"
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Render box offline — skipping art generation this run. The pending queue is preserved and will drain when the box is back."
          fi
          printf '%s\n' "$NOW" > "$STATUS_FILE"
          ALERT="none"
          if [ "$NOW" = "down" ] && [ "$PREV" != "down" ]; then ALERT="down"; fi
          if [ "$NOW" = "up" ] && [ "$PREV" = "down" ]; then ALERT="recovered"; fi
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"

      - name: Email on render-box state change
        if: ${{ steps.boxhealth.outputs.alert != 'none' }}
        continue-on-error: true
        working-directory: conductor
        env:
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          DIGEST_TO_NAME: ${{ secrets.DIGEST_TO_NAME || vars.DIGEST_TO_NAME }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME || vars.DIGEST_FROM_NAME }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.boxhealth.outputs.alert }}" = "down" ]; then
            SUBJECT="⚠️ Render box DOWN — art generation paused"
            BODY="The self-hosted ComfyUI/media render box ($KR_MEDIA_ORIGIN) is unreachable from CI. Art generation is paused; the pending queue is preserved and drains automatically once the box is back. Run: $RUN_URL"
          else
            SUBJECT="✅ Render box recovered — art generation resumed"
            BODY="The render box ($KR_MEDIA_ORIGIN) is reachable again; auto-art-generate has resumed draining the queue. Run: $RUN_URL"
          fi
          python scripts/send_alert_brevo.py --subject "$SUBJECT" --body "$BODY"

      - name: Repair and requeue failed Kind Robots ArtJobs
        id: repair_failed
        if: ${{ steps.boxhealth.outputs.up == 'true' }}
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: python scripts/repair_failed_kindrobots_artjobs.py --live

      - name: Refresh queue to currently-missing project art
        if: ${{ steps.boxhealth.outputs.up == 'true' && (github.event.inputs.refresh_queue || 'true') != 'false' }}
        working-directory: conductor
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          python scripts/queue_missing_project_art.py --limit "${LIMIT:-500}"

      # Time-sensitive request lanes go first. Daily Dream requests are already
      # priority 200 once they become ArtJobs; the media wrapper mirrors that
      # priority before submission so they cannot starve behind the broad repair
      # and project-art backlogs on the way into Kind Robots.
      - name: Submit + wait + verify art requests
        id: consume_requests
        if: ${{ steps.boxhealth.outputs.up == 'true' }}
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT_FLAG=""
          if [ -n "$LIMIT" ]; then LIMIT_FLAG="--limit $LIMIT"; fi
          python scripts/consume_art_requests_to_media.py --live $LIMIT_FLAG \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      - name: Submit + wait + verify project-art results
        id: consume
        if: ${{ steps.boxhealth.outputs.up == 'true' }}
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT_FLAG=""
          if [ -n "$LIMIT" ]; then LIMIT_FLAG="--limit $LIMIT"; fi
          python scripts/consume_art_queue_to_media.py --live $LIMIT_FLAG \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      - name: Route downloaded conductor and fallback images
        working-directory: conductor
        run: python scripts/distribute_images.py

      - name: Commit conductor results
        working-directory: conductor
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/images/ projects/process/ projects/art-generate.yaml projects/art-prompts.yaml ops/home-server/RENDER-BOX-STATUS
          if git diff --staged --quiet; then
            echo "No conductor-side changes."
          else
            git commit -m "chore: auto-generate project art [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Report generation outcome
        run: |
          echo "failed-job repair: ${{ steps.repair_failed.outcome }}"
          for step in "batch:${{ steps.consume.outcome }}" "requests:${{ steps.consume_requests.outcome }}"; do
            name="${step%%:*}"; outcome="${step#*:}"
            if [ "$outcome" = "success" ]; then
              echo "$name consume step succeeded."
            else
              echo "::warning::$name consume step did not fully succeed — the home render box may be offline, the direct media write may have failed, or some jobs timed out. Failed media writes remain retryable; verification fallbacks remain in projects/process/."
            fi
          done
