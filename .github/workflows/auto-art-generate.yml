name: Auto Art Generate

# Closes the autonomous art loop (art-generator-connect/t-012) so no one has to
# manually shepherd generated files. On a schedule (and on demand) this:
#   1. optionally refreshes projects/art-generate.yaml to only currently-missing
#      project icon/card/hero art
#   2. submits project-art and ad-hoc request lanes to the Kind Robots ArtJob queue
#   3. the home-box relay renders each job and writes Kind Robots-targeted files
#      directly to self-hosted media before completing the job
#   4. conductor-targeted results (and any direct-media verification fallback)
#      land in projects/process/ and are routed by distribute_images.py
#   5. commits only conductor metadata/assets; Kind Robots image binaries are no
#      longer checked out or committed by this workflow
#
# Box-down tolerance: if the home box is offline, jobs simply wait in the queue
# and the consume step times out. That step is allowed to fail without failing the
# whole run, so an offline box is a soft no-op rather than a red build.

on:
  schedule:
    - cron: "0 9 * * *" # daily ~2am Pacific; bump the cadence any time
  workflow_dispatch:
    inputs:
      limit:
        description: "Max entries to generate this run"
        default: "5"
        required: false
      timeout:
        description: "Seconds to wait per job before giving up"
        default: "300"
        required: false
      refresh_queue:
        description: "Rebuild art-generate.yaml from currently-missing project art first (self-draining). Set false to consume the committed queue as-is."
        default: "true"
        required: false

concurrency:
  group: auto-art-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: conductor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml Pillow # Pillow => proper .webp output for conductor/fallback files

      - name: Refresh queue to currently-missing project art
        if: ${{ (github.event.inputs.refresh_queue || 'true') != 'false' }}
        working-directory: conductor
        run: python scripts/queue_missing_project_art.py --limit ${{ github.event.inputs.limit || '5' }}

      - name: Submit + wait + verify project-art results
        id: consume
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
        run: |
          python scripts/consume_art_queue_to_media.py --live \
            --limit ${{ github.event.inputs.limit || '5' }} \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      # Drain the requests: block of art-prompts.yaml (ad-hoc / missing-image /
      # voice requests) through the same ArtJob queue. For Kind Robots targets,
      # the home relay writes the exact public/images destination to self-hosted
      # media and this consumer verifies the public URL before suppressing its
      # projects/process fallback.
      - name: Submit + wait + verify art requests
        id: consume_requests
        continue-on-error: true
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_MEDIA_ORIGIN: https://media.acrocatranch.com
        run: |
          python scripts/consume_art_requests_to_media.py --live \
            --limit ${{ github.event.inputs.limit || '5' }} \
            --timeout ${{ github.event.inputs.timeout || '300' }}

      # Normally this sees only conductor-owned assets. If the public media URL
      # did not verify after a supposedly successful relay job, the consumer keeps
      # a recoverable copy in projects/process/; without a kind_robots checkout the
      # distributor intentionally leaves that file there for investigation.
      - name: Route downloaded conductor and fallback images
        working-directory: conductor
        run: python scripts/distribute_images.py

      - name: Commit conductor results
        working-directory: conductor
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/images/ projects/process/ projects/art-generate.yaml projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "No conductor-side changes."
          else
            git commit -m "chore: auto-generate project art [skip ci]"
            # This job runs for ~an hour, so main almost always moves under it.
            # Rebase onto the latest main and retry, so a genuine render never
            # gets stranded on a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Report generation outcome
        run: |
          for step in "batch:${{ steps.consume.outcome }}" "requests:${{ steps.consume_requests.outcome }}"; do
            name="${step%%:*}"; outcome="${step#*:}"
            if [ "$outcome" = "success" ]; then
              echo "$name consume step succeeded."
            else
              echo "::warning::$name consume step did not fully succeed — the home render box may be offline, the direct media write may have failed, or some jobs timed out. Failed media writes remain retryable; verification fallbacks remain in projects/process/."
            fi
          done
