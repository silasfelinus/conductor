name: Coloring approved preflight

on:
  pull_request:
    paths:
      - 'projects/coloring-book/**'
      - 'scripts/coloring_approved_status.py'
      - '.github/workflows/coloring-approved-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'projects/coloring-book/**'
      - 'scripts/coloring_approved_status.py'
      - '.github/workflows/coloring-approved-preflight.yml'

permissions:
  contents: read

jobs:
  approved-design-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Analyze approved Monster Recast designs
        shell: bash
        run: |
          set -o pipefail
          python scripts/coloring_approved_status.py --check | tee approved-status.md
          {
            echo '## Monster Recast approved-design preflight'
            echo
            cat approved-status.md
          } >> "$GITHUB_STEP_SUMMARY"
