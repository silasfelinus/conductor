name: Audit Kind Robots Architecture References

on:
  push:
    branches:
      - agent/kind-robots-architecture-refs

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find active and historical architecture references
        run: |
          echo '=== composables ==='
          grep -RIn --exclude-dir=.git --exclude='*.sqlite' --exclude='*.png' --exclude='*.jpg' --exclude='*.webp' 'composables' . || true
          echo '=== app-wrapper references ==='
          grep -RIn --exclude-dir=.git --exclude='*.sqlite' -E 'app/(components|stores|pages|middleware|assets|utils)|app directory|app/ directory' . || true
          echo '=== root middleware references ==='
          grep -RIn --exclude-dir=.git --exclude='*.sqlite' -E 'middleware/navigation-access|server/middleware' . || true
