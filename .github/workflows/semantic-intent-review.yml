name: Scheduled Semantic Intent Review

# No paid model API and no fabricated audit. GitHub prepares source evidence;
# existing Conductor agent sessions perform the semantic judgment through
# the roadmap-intent-auditor role, with oversight tracking completed reports.
on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build a fresh evidence packet even when a review is current'
        type: boolean
        required: false
        default: false

concurrency:
  group: semantic-intent-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Verify available evidence
        run: python scripts/run_semantic_intent_review.py --check
      - name: Prepare evidence for existing Conductor agent
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE" == 'true' ]]; then args+=(--force); fi
          python scripts/run_semantic_intent_review.py "${args[@]}"
      - name: Summarize truthful status
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = Path("semantic-intent-attempt.json")
          result = json.loads(state.read_text()) if state.is_file() else {"status": "failed"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Semantic intent review: " + result["status"] + "\n\n")
              if result["status"] == "awaiting-agent":
                  summary.write(
                      "A source brief is attached as an artifact. It is **not an audit**. "
                      "The next Conductor `roadmap-intent-auditor` agent must review "
                      "the source evidence, then open and merge a substantive report PR. "
                      "Until then the review remains due. No model API credits were used.\n"
                  )
              elif result["status"] == "skipped":
                  summary.write("A completed report is recent; no packet needed.\n")
              else:
                  summary.write("Packet preparation failed; inspect the job logs.\n")
          PY
      - name: Upload source brief and attempt record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-intent-brief
          path: |
            semantic-intent-attempt.json
            semantic-intent-brief.md
          retention-days: 30
