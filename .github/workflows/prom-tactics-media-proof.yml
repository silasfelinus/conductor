name: Prom and Tactics Private Media Proof

# Fetch finished original artwork through the authenticated production ArtImage
# API and verify that the bytes decode. Never upload private image artifacts,
# write image bytes to this public repository, or treat DONE as curator approval.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prom-tactics-media-proof.yml"
      - "scripts/verify_prom_tactics_media.py"
      - "scripts/verify_tactics_runtime_media.py"
      - "scripts/prove_private_media_ledgers.py"
      - "tests/test_prove_private_media_ledgers.py"
      - "tests/test_tactics_runtime_media.py"
      - "tests/test_prom_tactics_media_verification.py"
      - "projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml"
      - "projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml"
      - "projects/every-villain-tactics/art/LAST-ORDER-DINER-ROUND-1.yaml"
      - "projects/every-villain-tactics/art/SUNKEN-STREET-ROUND-1.yaml"
      - "projects/every-villain-tactics/art/VALCOURT-LIBRARY-ROUND-1.yaml"
      - "projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml"
      - "projects/comet-city-academy/art/UNSTABLE-PRODUCTION-FAMILY-ROUND-1.yaml"
      - "projects/comet-city-academy/art/FRANCHISE-SAFE-RERENDERS-ROUND-1.yaml"
      - "projects/comet-city-academy/art/RUNTIME-REFILL-ROUND-1.yaml"
      - "projects/comet-city-academy/art/OCT-29-CAST-KREA2-ROUND-1.yaml"
      - "projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml"
  workflow_dispatch:
  schedule:
    - cron: "41 15 * * *"

concurrency:
  group: prom-tactics-private-media-proof
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-private-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KR_BASE_URL: https://kindrobots.org
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media verification dependencies
        run: pip install pyyaml pillow pytest
      - name: Unit-test safe receipt and image verification
        run: python -m pytest -q tests/test_prom_tactics_media_verification.py tests/test_tactics_runtime_media.py tests/test_prove_private_media_ledgers.py
      - name: Verify production API credential is configured
        run: |
          if [ -z "$KR_API_TOKEN" ]; then
            echo "::error::Production media token is unavailable; no private images fetched."
            exit 1
          fi
      - name: Verify and record twelve private Tactics telegraph downloads
        run: |
          set +e
          python scripts/verify_prom_tactics_media.py \
            projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml \
            --require-count 12 --write-evidence
          verify_status=$?
          bash scripts/checkpoint_art_state.sh "chore: checkpoint Tactics authenticated media proof [skip ci]"
          checkpoint_status=$?
          if [ "$checkpoint_status" -ne 0 ]; then exit "$checkpoint_status"; fi
          exit "$verify_status"
      - name: Verify Tactics game-media URL and private access policy
        run: |
          python scripts/verify_tactics_runtime_media.py \
            projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml \
            --require-count 12
      - name: Verify and checkpoint nineteen private canonical Prom paintings
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/comet-city-academy/art/UNSTABLE-PRODUCTION-FAMILY-ROUND-1.yaml:14 \
            --ledger projects/comet-city-academy/art/FRANCHISE-SAFE-RERENDERS-ROUND-1.yaml:5 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint nineteen priority Prom private game-media proofs [skip ci]"
      - name: Verify and checkpoint 172 original private Prom refill and cast paintings
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/comet-city-academy/art/RUNTIME-REFILL-ROUND-1.yaml:148 \
            --ledger projects/comet-city-academy/art/OCT-29-CAST-KREA2-ROUND-1.yaml:24 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint private Prom refill and October cast media proof [skip ci]"
      - name: Verify original Tactics diner, sunken street and library arena paintings
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/every-villain-tactics/art/LAST-ORDER-DINER-ROUND-1.yaml:1 \
            --ledger projects/every-villain-tactics/art/SUNKEN-STREET-ROUND-1.yaml:1 \
            --ledger projects/every-villain-tactics/art/VALCOURT-LIBRARY-ROUND-1.yaml:1 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint Tactics dedicated venue media proof [skip ci]"
      - name: Verify newest Tactics combat states and private game URLs
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml:12 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint Tactics combat pose media proof [skip ci]"
      - name: Verify all twelve Prom companion emotions and their private gameplay URLs
        run: |
          python scripts/prove_private_media_ledgers.py \
            --ledger projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml:12 \
            --write-evidence --require-private \
            --checkpoint-message "chore: checkpoint all Prom companion emotion media proof [skip ci]"
