name: Repair Failed ArtJobs

# This workflow is intentionally independent from the full render drain so a
# historical queue repair cannot sit behind unrelated long-running generations.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-failed-artjobs.yml"
      - "scripts/repair_failed_kindrobots_artjobs.py"
      - "scripts/repair_art_request_defaults.py"
  workflow_dispatch:

concurrency:
  group: repair-failed-kindrobots-artjobs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: conductor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repair dependencies
        run: python -m pip install pyyaml

      - name: Canonicalize committed art requests
        working-directory: conductor
        run: python scripts/repair_art_request_defaults.py --write

      - name: Repair and requeue failed Kind Robots ArtJobs
        working-directory: conductor
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          set -o pipefail
          {
            echo "Repair run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python scripts/repair_failed_kindrobots_artjobs.py --live
          } | tee ops/home-server/LAST-ART-REPAIR.log

      - name: Commit repair report and request migration
        working-directory: conductor
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/art-prompts.yaml ops/home-server/LAST-ART-REPAIR.log
          if git diff --staged --quiet; then
            echo "No repair-side changes."
          else
            git commit -m "chore: record failed ArtJob repair [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main…"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 3))
            done
          fi
