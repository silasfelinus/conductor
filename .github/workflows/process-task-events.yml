name: Process task events

on:
  push:
    branches:
      - main
    paths:
      - task-events/*.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conductor-task-events
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Process queued events
        run: python scripts/process_task_events.py

      - name: Validate roadmaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("projects").glob("*/roadmap.yaml")):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.get("tasks", []), list):
                  raise SystemExit(f"invalid roadmap: {path}")
          print("Roadmaps valid")
          PY

      - name: Commit processed state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "conductor-task-events[bot]"
          git config user.email "conductor-task-events[bot]@users.noreply.github.com"
          git add projects task-events LEARNING.yaml
          git commit -m "chore: process task events [skip ci]"
          git push origin HEAD:main
