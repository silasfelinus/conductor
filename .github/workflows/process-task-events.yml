name: Process task events

on:
  push:
    branches:
      - main
    paths:
      - task-events/*.yaml
      - .github/workflows/process-task-events.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposed roadmaps without touching main
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/validate_roadmaps.py

  process:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    # Only the writer is serialized. PR validation must not evict queued
    # main/merge task-event processing during high-volume agent activity.
    concurrency:
      group: conductor-task-events
      cancel-in-progress: false
    steps:
      - name: Check out current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh auth setup-git
          git init --quiet .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            '/projects/*/roadmap.yaml' \
            '/projects/*/HISTORY.md' \
            '/project-overrides.yaml' \
            '/task-events/*.yaml' \
            '/task-events/failed/*' \
            '/scripts/*.py' \
            '/LEARNING.yaml'
          git fetch --quiet --filter=blob:none --depth=2 origin main
          git checkout --quiet -B main FETCH_HEAD

      # Process, validate, and commit are one step so a non-fast-forward push can
      # replay the whole thing against fresh origin/main instead of committing on a
      # stale base and hoping the push lands. See conductor/challenge-center t-020
      # requirement 5: fetch main immediately before committing, never force-push,
      # retry exactly once on a clean race by re-running the processor against the
      # new main, and otherwise fail with the event left unconsumed on origin.
      - name: Process queued events and commit (one conflict retry)
        env:
          # The push below needs a usable credential in *this* step. The remote
          # URL baked in the checkout step was not reaching the push (git failed
          # with "could not read Username"), so construct an explicitly
          # tokenized push URL here from a token that is guaranteed present in
          # this step's env.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          had_error=0
          max_attempts=2

          push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "conductor-task-events[bot]"
          git config user.email "conductor-task-events[bot]@users.noreply.github.com"

          echo "Queued task events on current main:"
          find task-events -maxdepth 1 -type f -name '*.yaml' -not -name 'example.yaml' -print | sort

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt ${attempt}/${max_attempts}: processing against $(git rev-parse HEAD)"

            had_error=0
            if [ -f scripts/reject_ineligible_task_event_claims.py ]; then
              python3 scripts/reject_ineligible_task_event_claims.py
            else
              echo "Dependency-claim preflight is not present on checked-out main yet; PR test coverage validates the pending helper."
            fi
            # Hand-edited claims have left two `updated:` keys in one task, which
            # blocks every queued event; newest-timestamp-wins is lossless.
            if [ -f scripts/repair_duplicate_updated.py ]; then
              python3 scripts/repair_duplicate_updated.py
            fi
            # Expired claims stay visibly claimed forever unless reconciled.
            # Run in this serialized, fetch/retry-safe writer so a newer claim wins.
            python3 scripts/reconcile_stale_claims.py --apply
            python3 scripts/process_task_events.py || had_error=1
            # Existing serialized writer owns completion compaction too. A
            # declined archive retains the original and is reported separately.
            python3 scripts/compact_completed_roadmaps.py
            python3 scripts/validate_roadmaps.py

            if git diff --quiet && git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi

            roadmap_changed=0
            if git diff --name-only -- projects | grep -Eq '^projects/[^/]+/roadmap\.yaml$'; then
              roadmap_changed=1
            fi

            git add projects task-events LEARNING.yaml
            git commit -m "chore: process task events [skip ci]"

            # Fetch immediately before pushing so the fast-forward check is against
            # the freshest possible origin/main.
            git fetch --quiet origin main
            if git push --quiet "$push_url" HEAD:main; then
              echo "Pushed cleanly."

              # The processor commit deliberately carries [skip ci] so its task-event
              # cleanup does not recursively wake every push workflow. That also means
              # the path-triggered Kind Robots projection workflow will not start on
              # its own. Explicitly dispatch it after a successful roadmap mutation so
              # task lifecycle changes are projected immediately instead of waiting for
              # some unrelated later Conductor commit.
              if [ "$roadmap_changed" -eq 1 ]; then
                echo "Roadmap changed; dispatching Kind Robots projection sync."
                gh workflow run sync-kind-robots-projection.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main
                echo "Refreshing advisory agent context after canonical changes."
                gh workflow run refresh-status.yml --repo "$GITHUB_REPOSITORY" --ref main
              fi
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::origin/main still moved after ${max_attempts} attempts; leaving events in task-events/ for the next run." >&2
              exit 1
            fi

            echo "origin/main moved during processing; discarding this attempt's commit and replaying against the new main (no force-push)."
            git reset --hard origin/main
          done

          if [ "$had_error" -ne 0 ]; then
            echo "::error::One or more task events failed to apply; they remain in task-events/ for diagnosis." >&2
            exit 1
          fi

  daily-digest-sentinel:
    # The dedicated daily-digest and retry schedules can both disappear without
    # GitHub creating a queued or failed run. Use this workflow's independent
    # carriers too: task-event pushes and merged-PR close events still arrive
    # when schedule delivery goes missing, so they can recover an overdue digest
    # without adding another push-triggered workflow.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Recover a missing daily digest invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ensure_daily_digest.sh?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/ensure_daily_digest.sh
          bash /tmp/ensure_daily_digest.sh
