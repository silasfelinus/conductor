name: Process task events

on:
  push:
    branches:
      - main
    paths:
      - task-events/*.yaml
      - .github/workflows/process-task-events.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types:
      - closed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: conductor-task-events
  cancel-in-progress: false

jobs:
  process:
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh auth setup-git
          git init --quiet .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            '/projects/*/roadmap.yaml' \
            '/task-events/*.yaml' \
            '/scripts/*.py' \
            '/LEARNING.yaml'
          git fetch --quiet --filter=blob:none --depth=2 origin main
          git checkout --quiet -B main FETCH_HEAD

      # Process, validate, and commit are one step so a non-fast-forward push can
      # replay the whole thing against fresh origin/main instead of committing on a
      # stale base and hoping the push lands. See conductor/challenge-center t-020
      # requirement 5: fetch main immediately before committing, never force-push,
      # retry exactly once on a clean race by re-running the processor against the
      # new main, and otherwise fail with the event left unconsumed on origin.
      - name: Process queued events and commit (one conflict retry)
        env:
          # The push below needs a usable credential in *this* step. The remote
          # URL baked in the checkout step was not reaching the push (git failed
          # with "could not read Username"), so construct an explicitly
          # tokenized push URL here from a token that is guaranteed present in
          # this step's env.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          had_error=0
          max_attempts=2

          push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "conductor-task-events[bot]"
          git config user.email "conductor-task-events[bot]@users.noreply.github.com"

          echo "Queued task events on current main:"
          find task-events -maxdepth 1 -type f -name '*.yaml' -not -name 'example.yaml' -print | sort

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt ${attempt}/${max_attempts}: processing against $(git rev-parse HEAD)"

            had_error=0
            python3 scripts/process_task_events.py || had_error=1
            python3 scripts/validate_roadmaps.py

            if git diff --quiet && git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi

            roadmap_changed=0
            if git diff --name-only -- projects | grep -Eq '^projects/[^/]+/roadmap\.yaml$'; then
              roadmap_changed=1
            fi

            git add projects task-events LEARNING.yaml
            git commit -m "chore: process task events [skip ci]"

            # Fetch immediately before pushing so the fast-forward check is against
            # the freshest possible origin/main.
            git fetch --quiet origin main
            if git push --quiet "$push_url" HEAD:main; then
              echo "Pushed cleanly."

              # The processor commit deliberately carries [skip ci] so its task-event
              # cleanup does not recursively wake every push workflow. That also means
              # the path-triggered Kind Robots projection workflow will not start on
              # its own. Explicitly dispatch it after a successful roadmap mutation so
              # task lifecycle changes are projected immediately instead of waiting for
              # some unrelated later Conductor commit.
              if [ "$roadmap_changed" -eq 1 ]; then
                echo "Roadmap changed; dispatching Kind Robots projection sync."
                gh workflow run sync-kind-robots-projection.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main
              fi
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::origin/main still moved after ${max_attempts} attempts; leaving events in task-events/ for the next run." >&2
              exit 1
            fi

            echo "origin/main moved during processing; discarding this attempt's commit and replaying against the new main (no force-push)."
            git reset --hard origin/main
          done

          if [ "$had_error" -ne 0 ]; then
            echo "::error::One or more task events failed to apply; they remain in task-events/ for diagnosis." >&2
            exit 1
          fi
