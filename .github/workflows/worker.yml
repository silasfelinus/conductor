name: Worker Healthcheck

on:
  workflow_dispatch:

jobs:
  worker-healthcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run worker healthcheck
        run: python scripts/run_worker.py --dry-run
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
