name: Coloring Book ArtJobs

on:
  push:
    branches: [main]
    paths:
      - "projects/coloring-book/color-art-jobs.yaml"
      - "projects/coloring-book/sets/*/proposals.yaml"
      - "scripts/consume_coloring_book_color_art.py"
      - "scripts/consume_monster_recast_art.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum color proposals to generate this pass"
        default: "18"
        required: false
      timeout:
        description: "Seconds to wait per ArtJob"
        default: "600"
        required: false
      book:
        description: "Optional book slug: monster-recast, hollywood-recast, or kind-robots"
        default: ""
        required: false

concurrency:
  group: coloring-book-color-artjobs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml Pillow

      - name: Submit color proposal ArtJobs
        id: consume
        continue-on-error: true
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          BOOK_ARGS=()
          if [ -n "${{ github.event.inputs.book }}" ]; then
            BOOK_ARGS=(--book "${{ github.event.inputs.book }}")
          fi
          python scripts/consume_coloring_book_color_art.py --live \
            --limit ${{ github.event.inputs.limit || '18' }} \
            --timeout ${{ github.event.inputs.timeout || '600' }} \
            "${BOOK_ARGS[@]}"

      - name: Commit completed renders and queue progress
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/coloring-book/color-art-jobs.yaml
          for set in monster-recast hollywood-recast kind-robots; do
            dir="projects/coloring-book/sets/$set/generated/color-proposals-v1"
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          if git diff --staged --quiet; then
            echo "No coloring-book color-job changes to commit."
            exit 0
          fi
          git commit -m "art: advance 18-image coloring-book color batch [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main..."
            git pull --rebase --autostash origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report outcome
        run: |
          if [ "${{ steps.consume.outcome }}" = "success" ]; then
            echo "Coloring-book color proposal batch advanced successfully."
          else
            echo "::warning::One or more color proposal ArtJobs failed or timed out. Successful renders were still committed; failed entries remain pending."
          fi
