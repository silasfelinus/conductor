name: Coloring Book ArtJobs

on:
  schedule:
    # Daily. Matches the batch_policy worker_pass_size of 18 (half a book) per
    # run; book-order-then-slot means monster-recast drains first, then
    # hollywood-recast, then kind-robots, across successive daily runs. This
    # trigger was previously silent-dropped from this workflow at some point
    # after 2026-07-20 (last scheduled run: 2026-07-20T12:00Z), leaving all 3
    # books' color-proposal queues un-submitted until a manual dispatch
    # restarted them (Silas, 2026-07-25 — see TALKBACK.md).
    - cron: "0 11 * * *"
  push:
    branches: [main]
    paths:
      # Canonical queue changes may intentionally wake the regular batch runner.
      # Proposal-ledger edits do not: the Coloring Book Studio must be able to
      # save a prompt without silently launching up to eighteen unrelated jobs.
      # Workflow-definition changes are validated by PR CI and must not launch
      # a live production batch merely because this YAML was maintained.
      - "projects/coloring-book/color-art-jobs.yaml"
      - "scripts/consume_coloring_book_color_art.py"
      - "scripts/consume_monster_recast_art.py"
      - "scripts/render_retry.py"
      - "scripts/art_quality.py"
      - "tests/test_coloring_book_render_gate.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum color proposals to generate this pass"
        default: "18"
        required: false
      timeout:
        description: "Seconds to wait per ArtJob"
        default: "600"
        required: false
      book:
        description: "Optional book slug: monster-recast, hollywood-recast, or kind-robots"
        default: ""
        required: false

concurrency:
  group: coloring-book-color-artjobs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml Pillow

      - name: Verify render gate contracts
        run: python -m unittest discover -s tests -p "test_coloring_book_render_gate.py"

      - name: Submit and mechanically validate color proposal ArtJobs
        id: consume
        continue-on-error: true
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          COLOR_ART_MAX_RENDER_ATTEMPTS: "3"
        run: |
          BOOK_ARGS=()
          if [ -n "${{ github.event.inputs.book }}" ]; then
            BOOK_ARGS=(--book "${{ github.event.inputs.book }}")
          fi
          python scripts/consume_coloring_book_color_art.py --live \
            --limit ${{ github.event.inputs.limit || '18' }} \
            --timeout ${{ github.event.inputs.timeout || '600' }} \
            "${BOOK_ARGS[@]}"

      - name: Commit accepted renders, render rejections, and queue progress
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/coloring-book/color-art-jobs.yaml
          for set in monster-recast hollywood-recast kind-robots; do
            dir="projects/coloring-book/sets/$set/generated/color-proposals-v1"
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          if git diff --staged --quiet; then
            echo "No coloring-book color-job changes to commit."
            exit 0
          fi
          git commit -m "art: advance mechanically validated coloring-book batch [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main..."
            git pull --rebase --autostash origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report outcome
        run: |
          if [ "${{ steps.consume.outcome }}" = "success" ]; then
            echo "Coloring-book color proposal batch passed structural validation. Final art quality remains a human trainer-panel decision."
          else
            echo "::warning::One or more proposals failed, timed out, or were structurally rejected. Accepted renders and rejection evidence were still committed; retryable entries remain pending."
          fi
