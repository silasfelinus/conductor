name: One-shot Record Approvals and Dedupe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'maintenance/record-approvals-and-dedupe-t011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/record-approvals-and-dedupe-t011
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: pip install pyyaml

      - name: Record confirmed human approvals
        run: |
          python scripts/set_task_field.py conductor t-006 approved_by_human true
          python scripts/set_task_field.py humboldt-scoop-cms t-003 approved_by_human true
          python scripts/set_task_field.py mermaids-of-venice t-001 approved_by_human true

      - name: Remove the retroactive duplicate t-011 block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          path = Path('projects/conductor/roadmap.yaml')
          text = path.read_text()
          lines = text.splitlines(keepends=True)

          starts = []
          for index, line in enumerate(lines):
              match = re.match(r'^(?P<indent>\s*)-\s+id:\s*t-011\s*$', line.rstrip('\n'))
              if match:
                  starts.append((index, len(match.group('indent'))))

          candidates = []
          for start, indent in starts:
              end = len(lines)
              for index in range(start + 1, len(lines)):
                  line = lines[index]
                  match = re.match(r'^(?P<indent>\s*)-\s+id:\s*[^#\n]+', line)
                  if match and len(match.group('indent')) == indent:
                      end = index
                      break
              block = ''.join(lines[start:end])
              if 'Retroactive task.' in block:
                  candidates.append((start, end, block))

          if len(candidates) != 1:
              raise SystemExit(f'Expected one retroactive t-011 duplicate, found {len(candidates)}')

          start, end, _ = candidates[0]
          del lines[start:end]
          path.write_text(''.join(lines))

          data = yaml.safe_load(path.read_text())
          remaining = [task for task in data['tasks'] if str(task.get('id')) == 't-011']
          if len(remaining) != 1:
              raise SystemExit(f'Expected one canonical t-011 after cleanup, found {len(remaining)}')
          if 'Add Claude session startup sweep hook' not in remaining[0].get('title', ''):
              raise SystemExit('The remaining t-011 is not the intended canonical hook task')
          PY

      - name: Validate approvals and regenerate audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          checks = [
              ('projects/conductor/roadmap.yaml', 't-006'),
              ('projects/humboldt-scoop-cms/roadmap.yaml', 't-003'),
              ('projects/mermaids-of-venice/roadmap.yaml', 't-001'),
          ]
          for path, task_id in checks:
              data = yaml.safe_load(Path(path).read_text())
              matches = [task for task in data['tasks'] if str(task.get('id')) == task_id]
              if len(matches) != 1 or matches[0].get('approved_by_human') is not True:
                  raise SystemExit(f'{path}/{task_id}: approval validation failed')
          PY
          python scripts/audit_roadmaps.py --json ROADMAP-AUDIT.json --markdown ROADMAP-AUDIT.md
          grep -F 'Findings: **0 errors**' ROADMAP-AUDIT.md

      - name: Record maintenance decision and remove helper
        run: |
          cat > docs/MAINTENANCE-PASS-2026-07-13-APPROVALS.md <<'EOF'
          # Roadmap Maintenance — Human Approvals and Duplicate Cleanup

          Silas confirmed in session on 2026-07-13 that the three completed audited gates were approved:

          - `conductor/t-006`
          - `humboldt-scoop-cms/t-003`
          - `mermaids-of-venice/t-001`

          The later duplicate `conductor/t-011` block was removed rather than renumbered because it retroactively described the same SessionStart hook already represented by the earlier canonical `t-011`. Existing `t-012` dependency semantics remain unchanged.
          EOF
          rm .github/workflows/one-shot-record-approvals-dedupe.yml

      - name: Commit maintenance result
        run: |
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/conductor/roadmap.yaml projects/humboldt-scoop-cms/roadmap.yaml projects/mermaids-of-venice/roadmap.yaml ROADMAP-AUDIT.md ROADMAP-AUDIT.json docs/MAINTENANCE-PASS-2026-07-13-APPROVALS.md .github/workflows/one-shot-record-approvals-dedupe.yml
          git commit -m "chore: record approvals and remove duplicate task"
          git push origin HEAD:maintenance/record-approvals-and-dedupe-t011
