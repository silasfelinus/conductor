name: One-shot Record Approvals and Dedupe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'maintenance/record-approvals-and-dedupe-t011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/record-approvals-and-dedupe-t011
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record approvals and remove true duplicate
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          APPROVAL_NOTE = 'Approved by Silas in session on 2026-07-13.'

          def task_spans(text: str, task_id: str):
              lines = text.splitlines(keepends=True)
              offsets = []
              position = 0
              for line in lines:
                  offsets.append(position)
                  position += len(line)

              spans = []
              for index, line in enumerate(lines):
                  if line.strip() != f'- id: {task_id}':
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  end_index = len(lines)
                  for candidate in range(index + 1, len(lines)):
                      candidate_line = lines[candidate]
                      candidate_indent = len(candidate_line) - len(candidate_line.lstrip(' '))
                      if candidate_indent == indent and candidate_line.strip().startswith('- id: '):
                          end_index = candidate
                          break
                  start = offsets[index]
                  end = offsets[end_index] if end_index < len(lines) else len(text)
                  spans.append((start, end, text[start:end]))
              return spans

          def approve_unique_task(path: str, task_id: str):
              p = Path(path)
              text = p.read_text()
              spans = task_spans(text, task_id)
              if len(spans) != 1:
                  raise SystemExit(f'{path}: expected one {task_id}, found {len(spans)}')
              start, end, block = spans[0]
              if 'approved_by_human: false' in block:
                  block = block.replace('approved_by_human: false', 'approved_by_human: true', 1)
              elif 'approved_by_human: true' not in block:
                  raise SystemExit(f'{path}/{task_id}: no approval field found')

              if 'approval_note:' not in block:
                  lines = block.splitlines(keepends=True)
                  for index, line in enumerate(lines):
                      if 'approved_by_human: true' in line:
                          indent = line[: len(line) - len(line.lstrip(' '))]
                          lines.insert(index + 1, f'{indent}approval_note: "{APPROVAL_NOTE}"\n')
                          break
                  block = ''.join(lines)
              p.write_text(text[:start] + block + text[end:])

          approve_unique_task('projects/conductor/roadmap.yaml', 't-006')
          approve_unique_task('projects/humboldt-scoop-cms/roadmap.yaml', 't-003')
          approve_unique_task('projects/mermaids-of-venice/roadmap.yaml', 't-001')

          conductor_path = Path('projects/conductor/roadmap.yaml')
          conductor_text = conductor_path.read_text()
          duplicate_candidates = [
              span for span in task_spans(conductor_text, 't-011')
              if 'Retroactive task.' in span[2]
          ]
          if len(duplicate_candidates) == 1:
              start, end, _ = duplicate_candidates[0]
              conductor_path.write_text(conductor_text[:start] + conductor_text[end:])
          elif len(duplicate_candidates) > 1:
              raise SystemExit(f'Expected at most one retroactive t-011 duplicate, found {len(duplicate_candidates)}')

          checks = [
              ('projects/conductor/roadmap.yaml', 't-006'),
              ('projects/humboldt-scoop-cms/roadmap.yaml', 't-003'),
              ('projects/mermaids-of-venice/roadmap.yaml', 't-001'),
          ]
          for path, task_id in checks:
              data = yaml.safe_load(Path(path).read_text())
              matches = [task for task in data['tasks'] if task['id'] == task_id]
              if len(matches) != 1 or matches[0].get('approved_by_human') is not True:
                  raise SystemExit(f'{path}/{task_id}: approval validation failed')

          conductor = yaml.safe_load(conductor_path.read_text())
          if sum(task['id'] == 't-011' for task in conductor['tasks']) != 1:
              raise SystemExit('conductor: duplicate t-011 still present')
          PY

      - name: Regenerate roadmap audit and require zero errors
        run: |
          python scripts/audit_roadmaps.py --json ROADMAP-AUDIT.json --markdown ROADMAP-AUDIT.md
          grep -F 'Findings: **0 errors**' ROADMAP-AUDIT.md

      - name: Record maintenance decision and remove helper
        run: |
          cat > docs/MAINTENANCE-PASS-2026-07-13-APPROVALS.md <<'EOF'
          # Roadmap Maintenance — Human Approvals and Duplicate Cleanup

          Silas confirmed in session on 2026-07-13 that the three completed audited gates were approved:

          - `conductor/t-006`
          - `humboldt-scoop-cms/t-003`
          - `mermaids-of-venice/t-001`

          The later duplicate `conductor/t-011` block was removed rather than renumbered because it retroactively described the same SessionStart hook already represented by the earlier canonical `t-011`. Existing `t-012` dependency semantics remain unchanged.
          EOF
          rm .github/workflows/one-shot-record-approvals-dedupe.yml

      - name: Commit maintenance result
        run: |
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/conductor/roadmap.yaml projects/humboldt-scoop-cms/roadmap.yaml projects/mermaids-of-venice/roadmap.yaml ROADMAP-AUDIT.md ROADMAP-AUDIT.json docs/MAINTENANCE-PASS-2026-07-13-APPROVALS.md .github/workflows/one-shot-record-approvals-dedupe.yml
          git commit -m "chore: record approvals and remove duplicate task"
          git push origin HEAD:maintenance/record-approvals-and-dedupe-t011
