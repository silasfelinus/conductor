name: Submit Space Couch Serendipity Casino ArtJobs

# Dedicated owner for 20 original environment plates. This internal ArtJob
# queue is not a public image release. Submitted != rendered != delivered.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submit-space-couch-casinos.yml"
      - "scripts/submit_space_couch_casinos.py"
      - "tests/test_space_couch_casino_art.py"
      - "projects/game-of-captains/art/SERENDIPITY-CASINOS-20-ROUND-1.yaml"
  workflow_dispatch:

concurrency:
  group: submit-space-couch-casino-20
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KR_BASE_URL: https://kindrobots.org

    steps:
      - name: Check out casino art files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests
            projects/game-of-captains/art
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install art request dependencies
        run: python -m pip install pyyaml pillow

      - name: Verify exact venue prompts
        run: python -m unittest discover -s tests -p 'test_space_couch_casino_art.py'

      - name: Reconcile and submit any missing casino ArtJobs
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        run: |
          set -o pipefail
          python scripts/submit_space_couch_casinos.py --live

      - name: Checkpoint accepted ArtJob IDs
        if: always()
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/game-of-captains/art/SERENDIPITY-CASINOS-20-ROUND-1.yaml
          if git diff --staged --quiet; then
            echo "No new venue ArtJob IDs to record."
          else
            git commit -m "chore: checkpoint Space Couch casino ArtJobs [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git pull --rebase --autostash origin main || exit 1
              sleep "$attempt"
            done
            if [ "$pushed" != true ]; then
              echo "::error::ArtJob IDs not checkpointed; rerun reconciles remote queue."
              exit 1
            fi
          fi
