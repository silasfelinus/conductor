name: Shifting Desks art visual review
on:
  push:
    branches: [main]
    paths:
      - "projects/shifting-desks/art/KREA-IMG2IMG-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/KONTEXT-MASKED-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/SDXL-TARGETED-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/SDXL-MASKED-VAE-CORRECTION-PILOT-2.yaml"
      - "projects/shifting-desks/art/diagnose_targeted_edit.py"
  # ArtJob and ArtImage status checkpoints on main use [skip ci], so a push
  # filter alone cannot see completed Krea candidates. Capture after the
  # whole art sweep instead, even if unrelated queue cells fail.
  workflow_run:
    workflows: ["Auto Art Generate"]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/shifting-desks-art-visual-review.yml"
      - "projects/shifting-desks/art/build_review_sheets.py"
      - "projects/shifting-desks/art/build_recovery_sheets.py"
      - "tests/test_shifting_desks_private_pilot_capture.py"
      - "tests/test_shifting_desks_targeted_mask_diagnostics.py"
      - "projects/shifting-desks/art/ROUND-18.yaml"
      - "projects/shifting-desks/art/ROUND-19.yaml"
      - "projects/shifting-desks/art/MANUAL-CLASSIC-2026-11-17.json"
      - "scripts/verify_shifting_desks_manual_intake.py"
      - "tests/test_shifting_desks_manual_intake.py"
      - "projects/shifting-desks/art/SUBJECT-FIDELITY-PILOT-V2.yaml"
      - "projects/shifting-desks/art/SDXL-IMG2IMG-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/KREA-IMG2IMG-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/KONTEXT-MASKED-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/SDXL-TARGETED-CORRECTION-PILOT-1.yaml"
      - "projects/shifting-desks/art/SDXL-MASKED-VAE-CORRECTION-PILOT-2.yaml"
      - "projects/shifting-desks/art/check_request_queue.py"
      - "projects/shifting-desks/art/audit_live_artjobs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-evidence:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image review tooling
        run: pip install "Pillow>=10,<13" "PyYAML>=6,<7" pytest
      - name: Private pilot capture regression tests
        run: python -m pytest -q tests/test_shifting_desks_private_pilot_capture.py
      - name: Regression tests for manually transferred Classic files
        run: python -m pytest -q tests/test_shifting_desks_manual_intake.py
      - name: Verify served images against manual replacement SHA-256 evidence
        run: |
          python scripts/verify_shifting_desks_manual_intake.py \\
            --output "$RUNNER_TEMP/shifting-desks-manual-install.json"
      - name: Upload manual image installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-manual-install
          path: ${{ runner.temp }}/shifting-desks-manual-install.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate the isolated Western fidelity pilot (dry-run only)
        run: |
          python scripts/enqueue_art_requests.py \
            projects/shifting-desks/art/SUBJECT-FIDELITY-PILOT-V1.yaml
          python scripts/enqueue_art_requests.py \
            projects/shifting-desks/art/SUBJECT-FIDELITY-PILOT-V2.yaml

      - name: Audit live Classic/recovery ArtJobs (no submission)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/audit_live_artjobs.py \
            --out "$RUNNER_TEMP/shifting-desks-live-artjobs.json"

      - name: Upload live provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-live-artjobs
          path: ${{ runner.temp }}/shifting-desks-live-artjobs.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit pending Classic art requests in durable queue
        run: |
          python projects/shifting-desks/art/check_request_queue.py \
            --out "$RUNNER_TEMP/shifting-desks-classic-queue.json"
      - name: Upload Classic request diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-classic-request-queue
          path: ${{ runner.temp }}/shifting-desks-classic-queue.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture Classic replacements and private edit pilots V1-V7
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/build_recovery_sheets.py \
            --out "$RUNNER_TEMP/shifting-desks-current-recovery"

      - name: Diagnose V6 targeted SDXL masks and original-versus-result pixels
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/diagnose_targeted_edit.py \
            --out "$RUNNER_TEMP/shifting-desks-targeted-v6"
      - name: Upload V6 targeted mask / image-delta diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-targeted-v6-diagnostic
          path: ${{ runner.temp }}/shifting-desks-targeted-v6/
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnose V7 private masked-VAE pixel changes once delivered
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/diagnose_targeted_edit.py \
            --pilot-version 7 --out "$RUNNER_TEMP/shifting-desks-targeted-v7"
      - name: Upload V7 private image-delta and feather-mask evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-targeted-v7-diagnostic
          path: ${{ runner.temp }}/shifting-desks-targeted-v7/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Classic and all V1-V7 private pilot review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-current-recovery-review
          path: ${{ runner.temp }}/shifting-desks-current-recovery/
          if-no-files-found: error
          retention-days: 7

      - name: Audit accepted Classic links and check real media
        run: |
          python scripts/shifting_desks_art_readiness.py
          python projects/shifting-desks/encounters/link_art.py --probe

      - name: Download actual art and build contact sheets
        run: |
          python projects/shifting-desks/art/build_review_sheets.py \
            --out "$RUNNER_TEMP/shifting-desks-art-review"
      - name: Build focused Round 19 Classic art acceptance sheets
        run: python projects/shifting-desks/art/build_review_sheets.py --round 19 --out "$RUNNER_TEMP/shifting-desks-round19-review"
      - name: Upload Round 19 visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-round19-visual-review
          path: ${{ runner.temp }}/shifting-desks-round19-review/
          if-no-files-found: error
          retention-days: 14

      - name: Upload image evidence and prompt manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-visual-art-review
          path: ${{ runner.temp }}/shifting-desks-art-review/
          if-no-files-found: error
          retention-days: 7
      # Preserve the full visual evidence bundle even if queue integrity is broken.
      - name: Fail review if Classic request queue is missing or duplicated
        run: python projects/shifting-desks/art/check_request_queue.py --strict
