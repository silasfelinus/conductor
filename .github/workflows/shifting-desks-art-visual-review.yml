name: Shifting Desks art visual review
on:
  pull_request:
    paths:
      - ".github/workflows/shifting-desks-art-visual-review.yml"
      - "projects/shifting-desks/art/build_review_sheets.py"
      - "projects/shifting-desks/art/ROUND-18.yaml"
      - "projects/shifting-desks/art/check_request_queue.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image review tooling
        run: pip install "Pillow>=10,<13" "PyYAML>=6,<7"
      - name: Audit pending Classic art requests in durable queue
        run: |
          python projects/shifting-desks/art/check_request_queue.py \
            --out "$RUNNER_TEMP/shifting-desks-classic-queue.json"
      - name: Upload Classic request diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-classic-request-queue
          path: ${{ runner.temp }}/shifting-desks-classic-queue.json
          if-no-files-found: error
          retention-days: 7
      - name: Download actual art and build contact sheets
        run: |
          python projects/shifting-desks/art/build_review_sheets.py \
            --out "$RUNNER_TEMP/shifting-desks-art-review"
      - name: Upload image evidence and prompt manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-visual-art-review
          path: ${{ runner.temp }}/shifting-desks-art-review/
          if-no-files-found: error
          retention-days: 7
