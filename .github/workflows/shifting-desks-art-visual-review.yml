name: Shifting Desks art visual review
on:
  pull_request:
    paths:
      - ".github/workflows/shifting-desks-art-visual-review.yml"
      - "projects/shifting-desks/art/build_review_sheets.py"
      - "projects/shifting-desks/art/build_recovery_sheets.py"
      - "projects/shifting-desks/art/ROUND-18.yaml"
      - "projects/shifting-desks/art/check_request_queue.py"
      - "projects/shifting-desks/art/audit_live_artjobs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image review tooling
        run: pip install "Pillow>=10,<13" "PyYAML>=6,<7"
      - name: Validate the isolated Western fidelity pilot (dry-run only)
        run: |
          python scripts/enqueue_art_requests.py \
            projects/shifting-desks/art/SUBJECT-FIDELITY-PILOT-V1.yaml

      - name: Audit live Classic/recovery ArtJobs (no submission)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/audit_live_artjobs.py \
            --out "$RUNNER_TEMP/shifting-desks-live-artjobs.json"

      - name: Upload live provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-live-artjobs
          path: ${{ runner.temp }}/shifting-desks-live-artjobs.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit pending Classic art requests in durable queue
        run: |
          python projects/shifting-desks/art/check_request_queue.py \
            --out "$RUNNER_TEMP/shifting-desks-classic-queue.json"
      - name: Upload Classic request diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-classic-request-queue
          path: ${{ runner.temp }}/shifting-desks-classic-queue.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture 20 fresh Classic replacements and six private pilot images
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: |
          python projects/shifting-desks/art/build_recovery_sheets.py \
            --out "$RUNNER_TEMP/shifting-desks-current-recovery"

      - name: Upload fresh recovery and private pilot review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-current-recovery-review
          path: ${{ runner.temp }}/shifting-desks-current-recovery/
          if-no-files-found: error
          retention-days: 7

      - name: Download actual art and build contact sheets
        run: |
          python projects/shifting-desks/art/build_review_sheets.py \
            --out "$RUNNER_TEMP/shifting-desks-art-review"
      - name: Upload image evidence and prompt manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-visual-art-review
          path: ${{ runner.temp }}/shifting-desks-art-review/
          if-no-files-found: error
          retention-days: 7
