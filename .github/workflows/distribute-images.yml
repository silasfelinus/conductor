name: Distribute Images

# Auto-processes images dropped into projects/process/. Runs whenever a push to
# main touches that folder and routes conductor-owned files with
# scripts/distribute_images.py.
#
# Kind Robots-targeted ArtJobs now use the home relay's direct self-hosted media
# path. This workflow intentionally does NOT check out kind_robots or commit
# public/images binaries. A legacy/manual Kind Robots-target file remains in
# projects/process/ for a local operator to place rather than silently returning
# the repository to binary storage.
#
# Loop safety: the conductor commit is pushed with the default GITHUB_TOKEN,
# which does not trigger workflows. Even if re-triggered, an empty
# projects/process/ makes the run a no-op.

on:
  push:
    branches: [main]
    paths:
      - "projects/process/**"
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: conductor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Distribute conductor-owned images
        working-directory: conductor
        run: python scripts/distribute_images.py

      - name: Commit conductor results
        working-directory: conductor
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add projects/images/ projects/process/ projects/art-generate.yaml projects/art-prompts.yaml
          if git diff --staged --quiet; then
            echo "No conductor-side changes."
          else
            git commit -m "chore: distribute images from projects/process [skip ci]"
            git push
          fi

      - name: Report retained Kind Robots targets
        working-directory: conductor
        run: |
          count=$(find projects/process -maxdepth 1 -type f \
            \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
            | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count image file(s) remain in projects/process/. Kind Robots-targeted images must be generated through the direct-media ArtJob path or placed by a local operator; this workflow will not commit them into kind_robots/public/images."
          fi
