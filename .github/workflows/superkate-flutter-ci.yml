name: Superkate Flutter CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/superkate-services-calculator/**"
      - ".github/workflows/superkate-flutter-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/superkate-services-calculator/**"
      - ".github/workflows/superkate-flutter-ci.yml"

permissions:
  contents: read

concurrency:
  group: superkate-flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/superkate-services-calculator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  desktop-builds:
    name: Flutter desktop build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            enable_flag: linux-desktop
            build_command: flutter build linux --debug
          - target: windows
            os: windows-latest
            enable_flag: windows-desktop
            build_command: flutter build windows --debug
    defaults:
      run:
        working-directory: apps/superkate-services-calculator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.enable_flag }}

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build desktop target
        run: ${{ matrix.build_command }}
