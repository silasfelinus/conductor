name: Patch daily dream vibe links

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'worker/dream-cycle-vibe-links-20260731'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/dream-cycle-vibe-links-20260731
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Apply focused patch
        run: python scripts/_patch_daily_dream_vibe_links.py
      - name: Verify builder contract
        run: |
          python -m py_compile scripts/build_dream_records.py
          python -m pytest -q tests/test_build_dream_records.py
      - name: Commit patched files
        run: |
          git config user.name 'conductor-vibe-link-patch[bot]'
          git config user.email 'conductor-vibe-link-patch[bot]@users.noreply.github.com'
          git add scripts/build_dream_records.py tests/test_build_dream_records.py scripts/_patch_daily_dream_vibe_links.py .github/workflows/_patch-daily-dream-vibe-links.yml
          git commit -m 'fix(dream-cycle): link every asset to the main vibe'
          git push origin HEAD:worker/dream-cycle-vibe-links-20260731
