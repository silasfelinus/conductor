name: Finalize Dream Cycle Documentation Hygiene

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-dream-cycle-doc-hygiene-r8n2.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dream-cycle-doc-hygiene-r8n2
  cancel-in-progress: false

jobs:
  clean-project-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load and apply bounded cleanup payload
        run: |
          git fetch origin refs/heads/worker/dream-cycle-doc-hygiene-payload-r8n2:refs/remotes/origin/dream-cycle-doc-hygiene-payload-r8n2
          git show refs/remotes/origin/dream-cycle-doc-hygiene-payload-r8n2:.github/workflows/agent-dream-cycle-doc-hygiene-r8n2.yml > /tmp/dream-cycle-payload.yml
          python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/dream-cycle-payload.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in text[start:end].splitlines()
          )

          selection_start = code.index("selection_marker = '''")
          selection_end_text = "builder = builder.replace(selection_marker, selection_replacement, 1)"
          selection_end = code.index(selection_end_text, selection_start) + len(selection_end_text)
          selection_patch = '''selection_marker = (
              '        if status in ("parked", "vetoed", "built", "building"):\\n'
              '            continue\\n'
              '        if _data_block(text, "built-data"):\\n'
              '            continue  # already built'
          )
          selection_replacement = (
              '        if status in ("parked", "vetoed", "built", "building"):\\n'
              '            continue\\n'
              '        proposal = _data_block(text, "proposal-data")\\n'
              '        contract_errors = _canonical_proposal_errors(proposal)\\n'
              '        if contract_errors:\\n'
              '            reason = f"{p.name}: invalid canonical proposal — " + "; ".join(contract_errors)\\n'
              '            continue\\n'
              '        if _data_block(text, "built-data"):\\n'
              '            continue  # already built'
          )
          if selection_marker not in builder:
              raise SystemExit("eligible proposal selection marker changed")
          builder = builder.replace(selection_marker, selection_replacement, 1)'''
          code = code[:selection_start] + selection_patch + code[selection_end:]

          run_start = code.index("run_marker = '''")
          run_end_text = "builder = builder.replace(run_marker, run_replacement, 1)"
          run_end = code.index(run_end_text, run_start) + len(run_end_text)
          run_patch = '''run_marker = (
              '    if not proposal:\\n'
              '        message = f"{path.name}: no proposal-data block — cannot create objects."'
          )
          run_replacement = (
              '    contract_errors = _canonical_proposal_errors(proposal)\\n'
              '    if contract_errors:\\n'
              '        message = f"{path.name}: invalid canonical proposal — " + "; ".join(contract_errors)'
          )
          if run_marker not in builder:
              raise SystemExit("run_build proposal validation marker changed")
          builder = builder.replace(run_marker, run_replacement, 1)'''
          code = code[:run_start] + run_patch + code[run_end:]

          Path("/tmp/dream-cycle-doc-hygiene.py").write_text(code, encoding="utf-8")
          compile(code, "dream-cycle-doc-hygiene.py", "exec")
          PY
          python /tmp/dream-cycle-doc-hygiene.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          checker = Path("scripts/check_daily_dream_pipeline.py")
          text = checker.read_text(encoding="utf-8")
          marker_at = text.index("project_checks = (")
          guard_start = text.rfind("\n", 0, marker_at) + 1
          main_at = text.index("def main()", marker_at)
          main_start = text.rfind("\n", 0, main_at) + 1

          guard_lines = [
              "    project_checks = (",
              '        ("DESIGN-BRIEF.md", design_brief, ("exactly six assets", "sole daily dream object writer")),',
              '        ("CREATIVE-SEED-CONTRACT.md", seed_contract, ("seed_facets", "build_dream_proposal.py --brief")),',
              '        ("SHIPPED.md", shipped, ("built-data", "not a second ledger")),',
              '        ("api-surface.md", api_surface, ("not part of the current dated daily dream contract",)),',
              "    )",
              "    for label, surface, required in project_checks:",
              "        lowered = surface.casefold()",
              "        for phrase in required:",
              "            if phrase.casefold() not in lowered:",
              '                errors.append(f"{label} is missing current contract phrase: {phrase!r}")',
              "",
              "    stale_surfaces = {",
              '        "DESIGN-BRIEF.md": (design_brief, ("the 8-stage", "2–4", "3–6", "optional narrator")),',
              '        "idea template": (idea_template, ("status: building", "narrator: yes", "## characters")),',
              '        "seed contract": (seed_contract, ("creative_seeds:", "every build must document all three")),',
              '        "outline checker": (outline_checker, ("legacy/manual outlines follow", "characters-count", "narrator-missing")),',
              '        "builder": (builder, ("# 5. narrator", \'page_url = f"{kr_base_url}/daily-dream"\')),',
              '        "CLAUDE.md": (claude, ("the active `building` creation (type + next", "next queued outline")),',
              "    }",
              "    for label, (surface, forbidden) in stale_surfaces.items():",
              "        lowered = surface.casefold()",
              "        for phrase in forbidden:",
              "            if phrase.casefold() in lowered:",
              '                errors.append(f"{label} still exposes retired Daily Dream contract: {phrase!r}")',
              "",
              '    if "idea inventory" not in idea_template.casefold() or "proposal: false" not in idea_template:',
              '        errors.append("legacy Dream template must be explicitly non-buildable idea inventory")',
              '    if "def _canonical_proposal_errors" not in builder:',
              '        errors.append("object builder must enforce the exact six-asset input contract")',
              '    if "page_url = kr_base_url" not in builder.casefold():',
              '        errors.append("object builder must not emit the removed /daily-dream page URL")',
              '    t020_start = roadmap.find("  - id: t-020")',
              '    t020_end = roadmap.find("  - id: t-021", t020_start)',
              '    if t020_start < 0 or "status: done" not in roadmap[t020_start:t020_end]:',
              '        errors.append("roadmap t-020 must be closed after correcting the removed page reference")',
              '    t006_start = roadmap.find("  - id: t-006")',
              '    t006_end = roadmap.find("  - id: t-007", t006_start)',
              '    t006 = roadmap[t006_start:t006_end].casefold()',
              '    if "advance it exactly one stage" in t006 or "stage 3" in t006:',
              '        errors.append("roadmap t-006 still contains executable retired stage instructions")',
              "",
              "    return errors",
              "",
              "",
          ]
          guard = "\n".join(guard_lines)
          text = text[:guard_start] + guard + text[main_start:]
          compile(text, str(checker), "exec")
          checker.write_text(text, encoding="utf-8")

          required_assets = {"vibe", "location", "character", "reward_item", "reward_skill", "scenario"}

          def is_canonical(data):
              if not isinstance(data, dict):
                  return False
              facets = data.get("seed_facets")
              elements = facets.get("elements") if isinstance(facets, dict) else None
              if not isinstance(facets, dict) or int(facets.get("version") or 0) < 2:
                  return False
              if not isinstance(elements, dict) or not required_assets.issubset(elements):
                  return False
              if not isinstance(data.get("vibe"), dict):
                  return False
              if len(data.get("locations") or []) != 1:
                  return False
              if len(data.get("characters") or []) != 1:
                  return False
              if len(data.get("rewards") or []) != 2:
                  return False
              if len(data.get("scenarios") or []) != 1:
                  return False
              reward_types = {
                  str(row.get("reward_type", "")).upper()
                  for row in data.get("rewards", [])
                  if isinstance(row, dict)
              }
              return reward_types == {"ITEM", "SKILL"} and not data.get("narrator")

          demoted = []
          note = "- 2026-08-02 | retired | pre-v2 proposal demoted to idea inventory; not eligible for object creation"
          for path in sorted(Path("projects/dream-cycle/backlog").glob("*.md")):
              source = path.read_text(encoding="utf-8")
              front = re.match(r"^---\n(.*?)\n---\n", source, re.DOTALL)
              if not front:
                  continue
              header = front.group(1)
              if not re.search(r"(?mi)^type:\s*['\"]?dream['\"]?\s*$", header):
                  continue
              if not re.search(r"(?mi)^proposal:\s*true\s*$", header):
                  continue
              status = re.search(r"(?mi)^status:\s*['\"]?([a-z-]+)['\"]?\s*$", header)
              if not status or status.group(1).lower() not in {"outline", "approved"}:
                  continue
              block = re.search(r"<!--\s*proposal-data\s*\n(.*?)\n-->", source, re.DOTALL)
              try:
                  data = json.loads(block.group(1)) if block else None
              except json.JSONDecodeError:
                  data = None
              if is_canonical(data):
                  continue
              new_header, count = re.subn(
                  r"(?mi)^proposal:\s*true\s*$",
                  "proposal: false\nlegacy_contract: retired-pre-v2",
                  header,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"could not demote legacy proposal {path.name}")
              source = "---\n" + new_header + "\n---\n" + source[front.end():]
              if note not in source:
                  if "## Build log\n" in source:
                      source = source.replace("## Build log\n", "## Build log\n" + note + "\n", 1)
                  else:
                      source = source.rstrip() + "\n\n## Build log\n" + note + "\n"
              path.write_text(source, encoding="utf-8")
              demoted.append(path.name)
          print(f"demoted {len(demoted)} retired pre-v2 proposal(s) to idea inventory")

          tests_path = Path("tests/test_daily_dream_pipeline_contract.py")
          tests_source = tests_path.read_text(encoding="utf-8")
          tests_marker = "\ndef test_stale_project_brief_is_rejected"
          tests_start = tests_source.index(tests_marker)
          test_lines = [
              "def test_stale_project_brief_is_rejected(tmp_path):",
              "    root = _copy_contract(tmp_path)",
              "    brief = root / pipeline.DESIGN_BRIEF",
              '    brief.write_text(brief.read_text(encoding="utf-8") + "\\nThe 8-stage manual path returns.\\n", encoding="utf-8")',
              '    assert any("DESIGN-BRIEF.md" in error for error in pipeline.check_pipeline(root))',
              "",
              "",
              "def test_builder_cannot_accept_removed_page_or_narrator_path(tmp_path):",
              "    root = _copy_contract(tmp_path)",
              "    builder = root / pipeline.BUILDER",
              "    builder.write_text(",
              '        builder.read_text(encoding="utf-8")',
              '        .replace("PAGE_URL = KR_BASE_URL", \'PAGE_URL = f"{KR_BASE_URL}/daily-dream"\')',
              '        + \'\\n# 5. Narrator\\nPOST = "/api/bots"\\n\',',
              '        encoding="utf-8",',
              "    )",
              "    errors = pipeline.check_pipeline(root)",
              '    assert any("builder" in error.lower() for error in errors)',
              "",
              "",
              "def test_roadmap_cannot_reactivate_staged_dream_instructions(tmp_path):",
              "    root = _copy_contract(tmp_path)",
              "    roadmap = root / pipeline.ROADMAP",
              "    roadmap.write_text(",
              '        roadmap.read_text(encoding="utf-8").replace(',
              '            "CURRENT CONTRACT:", "advance it exactly ONE stage. CURRENT CONTRACT:"',
              "        ),",
              '        encoding="utf-8",',
              "    )",
              '    assert any("roadmap t-006" in error for error in pipeline.check_pipeline(root))',
          ]
          tests_source = tests_source[:tests_start] + "\n" + "\n".join(test_lines) + "\n"
          compile(tests_source, str(tests_path), "exec")
          tests_path.write_text(tests_source, encoding="utf-8")

          queue = Path("projects/art-prompts.yaml")
          queue_text = queue.read_text(encoding="utf-8")
          stale = "page_url: https://kind-robots.vercel.app/daily-dream"
          if stale not in queue_text:
              raise SystemExit("expected legacy Daily Dream queue URLs were not found")
          queue.write_text(
              queue_text.replace(stale, "page_url: https://kind-robots.vercel.app"),
              encoding="utf-8",
          )
          PY
      - name: Validate cleaned project contracts
        run: |
          python -m pip install --quiet pytest pyyaml
          python scripts/check_daily_dream_pipeline.py
          python scripts/check_dream_outlines.py
          python scripts/validate_roadmaps.py
          pytest -q \
            tests/test_daily_dream_pipeline_contract.py \
            tests/test_check_dream_outlines.py \
            tests/test_build_dream_*records.py \
            tests/test_daily_dream_bundle_art_queue.py \
            tests/test_build_dream_proposal.py \
            tests/test_build_digest.py \
            tests/test_build_digest_email_v2.py \
            tests/test_enrich_daily_dream_digest.py
          git diff --check
      - name: Commit cleanup and remove payload branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "dream-cycle-doc-hygiene[bot]"
          git config user.email "dream-cycle-doc-hygiene[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove stale Daily Dream project contracts"
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$AUTH" HEAD:main
          git push "$AUTH" --delete worker/dream-cycle-doc-hygiene-payload-r8n2
      - name: Report cleanup failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1583 --body "Post-merge Dream Cycle cleanup failed. Inspect run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
