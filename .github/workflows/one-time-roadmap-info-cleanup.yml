name: One-time Roadmap Informational Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-roadmap-info-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML tooling
        run: pip install pyyaml ruamel.yaml
      - name: Normalize informational roadmap findings
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML
          import re

          ROOT = Path('.')
          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 120

          goals = {
            'alexa-integration': 'Make Alexa a reliable and secure voice entry point into the Kind Robots ecosystem, with the defined voice flows working end to end.',
            'appmaker': 'Let a user turn an app idea into a working, maintainable project through AppMaker, from scaffold through a usable handoff.',
            'approval-portal': 'Provide a clear human-review surface for inspecting, approving, redirecting, or rejecting gated Conductor work without editing roadmap YAML by hand.',
            'art-generator-connect': 'Keep Kind Robots art generation reliably connected to its generation backends, with queueing, execution, and delivery working end to end.',
            'career-transition': 'Turn the career-transition research and planning into an actionable, evidence-backed path with clear next decisions and concrete follow-through.',
            'challenge-center': 'Provide one coherent place to discover, enter, track, and complete challenges, with progress and rewards reflected correctly across Kind Robots.',
            'coat-dance': 'Develop Coat Dance into its intended polished creative work, with the roadmap’s authored concept, assets, and delivery package complete.',
            'conductor': 'Keep Conductor a trustworthy coordination system of record: projects, priorities, task state, human gates, automation, and generated status must agree.',
            'conductor-app': 'Provide a usable application surface for Conductor so project state, tasks, gates, and progress can be understood and acted on without living in YAML.',
            'ecosystem-map': 'Maintain a clear, navigable map of the Kind Robots ecosystem so projects, services, dependencies, and ownership are understandable at a glance.',
            'engagement': 'Ship a coherent engagement loop that gives users useful reasons to return and interact without obscuring the underlying Kind Robots experiences.',
            'global-ui': 'Keep the shared Kind Robots interface visually coherent, accessible, responsive, and consistent across pages while preserving project-specific character.',
            'humboldt-impropriety-calendar': 'Develop the Humboldt Impropriety Calendar concept into a coherent, reviewable creative package while preserving its local voice and intended humor.',
            'humboldt-scoop': 'Deliver the original Humboldt Scoop experience as a complete, coherent representation of the business and its services.',
            'humboldt-scoop-cms': 'Keep Humboldt Scoop Solutions’ website maintainable through its CMS while accurately presenting services, leads, operations, and brand voice.',
            'kapowarr': 'Make Kapowarr a polished comic manager with reliable discovery, metadata, imports, downloads, and automation while preserving its clean image-first interface.',
            'kind-robots': 'Keep Kind Robots cohesive and delightful as its many tools, games, galleries, generators, and coordination surfaces grow into one dependable application.',
            'kindrobots-unraid': 'Run Kind Robots reliably on the Unraid/home infrastructure, with deployment, storage, networking, GPU services, and recovery procedures kept reproducible.',
            'media-watchlist': 'Provide a useful media watchlist that makes it easy to save, understand, revisit, and act on things the user wants to watch.',
            'mermaids-of-venice': 'Bring Mermaids of Venice to a complete, polished manuscript and supporting publication package while preserving its open-sharing intent.',
            'music-mentor': 'Provide practical singing and arrangement feedback from local audio analysis plus LLM reasoning, while keeping uploaded audio private to the browser.',
            'newsfeed': 'Provide a useful, readable Kind Robots newsfeed that surfaces relevant updates and routes readers into the parts of the site those updates describe.',
            'packmaker': 'Make creating and maintaining reusable Kind Robots packs straightforward, validated, and integrated with the objects and experiences that consume them.',
            'pinball-hero': 'Develop Pinball Hero into its intended playable, polished game experience with coherent mechanics, presentation, progression, and delivery.',
            'recipe-box': 'Develop Recipe Box into a useful, maintainable place to capture, organize, browse, and use recipes.',
            'serendipity': 'Deliver Serendipity as a delightful story-weaving experience that turns project choices and real tasks into narrative beats without feeling like a chore list.',
            'sketchy': 'Bring Sketchy to its intended finished product state, with its core creative interaction, presentation, and delivery polished and dependable.',
            'superkate-hairstyle-ai': 'Give Hair by Superkate a useful private Hair Studio for client-linked before/after hairstyle exploration, with reliable generation and a safe path to any future launch.',
            'superkate-services-calculator': 'Provide Hair by Superkate a dependable service calculator and client workflow that makes pricing, appointments, and customer follow-up simple.',
            'text-generation': 'Provide a dependable shared text-generation capability for Kind Robots, with clear model routing, controls, costs, and reusable output handling.',
            'wishmaster': 'Let users express a natural-language wish and turn it into a transparent, costed, structured plan or project without hiding consent, cost, or execution state.',
          }

          audit_text = Path('ROADMAP-AUDIT.md').read_text(encoding='utf-8')
          missing_goal = set(re.findall(r"\*\*MISSING_GOAL\*\* — `([^`]+)`", audit_text))
          approval_pairs = set(re.findall(r"\*\*APPROVAL_WITHOUT_GATE\*\* — `([^`]+)` / `([^`]+)`", audit_text))
          note_pairs = set(re.findall(r"\*\*NEEDS_HUMAN_NOTE_FORMAT\*\* — `([^`]+)` / `([^`]+)`", audit_text))

          unknown = missing_goal - goals.keys()
          if unknown:
            raise SystemExit(f'Missing authored goal text for: {sorted(unknown)}')

          touched = set()
          for path in sorted(Path('projects').glob('*/roadmap.yaml')):
            slug = path.parent.name
            if slug == '_template':
              continue
            data = yaml.load(path.read_text(encoding='utf-8'))
            changed = False

            if slug in missing_goal:
              data['goal'] = goals[slug]
              changed = True

            for task in data.get('tasks', []) or []:
              tid = str(task.get('id', ''))
              if (slug, tid) in approval_pairs:
                if task.get('approved_by_human') and not task.get('gate_human'):
                  del task['approved_by_human']
                  changed = True
              if (slug, tid) in note_pairs:
                note = str(task.get('note', '') or '')
                if 'FOR SILAS:' not in note:
                  task['note'] = 'FOR SILAS: ' + note
                  changed = True

            if changed:
              with path.open('w', encoding='utf-8') as f:
                yaml.dump(data, f)
              touched.add(slug)

          # Retired/paused/finished projects must not advertise immediately claimable work.
          # `waiting` means "dependency not yet satisfied", so lifecycle holds use `blocked`
          # instead. Otherwise a paused task whose dependencies are already done is immediately
          # flagged by the audit as WAITING_WITH_SATISFIED_DEPS.
          inactive = {
            'animation-studio': {'t-001': 'done', 't-002': 'done', 't-004': 'done'},
            'mona-salai': {'t-002': 'blocked', 't-003': 'blocked'},
            'music-mentor': {'t-009': 'blocked'},
            'serendipity': {'t-012': 'blocked'},
            'superkate-hairstyle-ai': {'t-019': 'blocked'},
            'wishmaster': {'t-003': 'blocked'},
          }
          stamp = '2026-08-29T23:59:00Z'
          for slug, changes in inactive.items():
            path = Path('projects') / slug / 'roadmap.yaml'
            data = yaml.load(path.read_text(encoding='utf-8'))
            by_id = {str(t.get('id')): t for t in (data.get('tasks', []) or [])}
            for tid, target in changes.items():
              task = by_id.get(tid)
              if not task:
                raise SystemExit(f'{slug}/{tid} not found')
              if task.get('status') != 'ready':
                raise SystemExit(f'{slug}/{tid} expected ready, found {task.get("status")}')
              task['status'] = target
              task['owner'] = None
              task['updated'] = stamp
              note = str(task.get('note', '') or '')
              if slug == 'animation-studio':
                suffix = 'CONSISTENCY CLOSE 2026-08-29: this retired project was superseded by animation-manager; closing the leftover ready task prevents retired work from resurfacing as claimable.'
              else:
                suffix = 'CONSISTENCY HOLD 2026-08-29: this project is not active. Re-arm this task to ready if and when the project is explicitly reactivated.'
              if suffix not in note:
                task['note'] = note.rstrip() + '\n\n' + suffix
            with path.open('w', encoding='utf-8') as f:
              yaml.dump(data, f)
            touched.add(slug)

          # Closing retired animation-studio/t-004 satisfies t-005's dependency list.
          # The project is retired, so t-005 is lifecycle-blocked rather than dependency-waiting.
          path = Path('projects/animation-studio/roadmap.yaml')
          data = yaml.load(path.read_text(encoding='utf-8'))
          by_id = {str(t.get('id')): t for t in (data.get('tasks', []) or [])}
          task = by_id.get('t-005')
          if not task:
            raise SystemExit('animation-studio/t-005 not found')
          if task.get('status') != 'waiting':
            raise SystemExit(f'animation-studio/t-005 expected waiting, found {task.get("status")}')
          task['status'] = 'blocked'
          task['owner'] = None
          task['updated'] = stamp
          note = str(task.get('note', '') or '')
          suffix = 'CONSISTENCY HOLD 2026-08-29: animation-studio is retired and superseded by animation-manager; keep this dependent task blocked rather than incorrectly dependency-waiting.'
          if suffix not in note:
            task['note'] = note.rstrip() + '\n\n' + suffix
          with path.open('w', encoding='utf-8') as f:
            yaml.dump(data, f)
          touched.add('animation-studio')

          # Prevent new projects from inheriting the same omission.
          template = Path('projects/_template/roadmap.yaml')
          text = template.read_text(encoding='utf-8')
          if '\ngoal:' not in text:
            marker = 'kind: software        # software | content | proposal\n'
            replacement = marker + 'goal: "REPLACE-ME — one-sentence definition of done for this project."\n'
            if marker not in text:
              raise SystemExit('Template insertion marker changed')
            template.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          print(f'Normalized {len(touched)} roadmaps: {sorted(touched)}')
          PY
      - name: Validate and regenerate audit
        run: |
          python scripts/validate_roadmaps.py
          python scripts/audit_roadmaps.py
      - name: Assert informational audit is clean
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('ROADMAP-AUDIT.md').read_text(encoding='utf-8')
          m = re.search(r'Findings: \*\*(\d+) errors\*\*, \*\*(\d+) warnings\*\*, \*\*(\d+) informational\*\*', text)
          if not m:
            raise SystemExit('Could not parse audit totals')
          totals = tuple(map(int, m.groups()))
          print('audit totals:', totals)
          if totals != (0, 0, 0):
            raise SystemExit(f'Expected a fully clean audit, got {totals}')
          PY
      - name: Remove one-shot workflow and persist cleanup
        run: |
          rm .github/workflows/one-time-roadmap-info-cleanup.yml
          git config user.name 'conductor-roadmap-cleanup[bot]'
          git config user.email 'conductor-roadmap-cleanup[bot]@users.noreply.github.com'
          git add projects ROADMAP-AUDIT.md .github/workflows/one-time-roadmap-info-cleanup.yml
          git commit -m 'chore: normalize roadmap consistency findings [skip ci]'
          git push origin HEAD:main
