name: Branch janitor

# Keeps the remote branch list clean: deletes claude/* and worker/* branches that
# are fully merged into main (or explicitly forced), and REPORTS unmerged stale
# branches without deleting them. Runs with GITHUB_TOKEN, which can delete refs —
# agent session credentials 403 on ref deletion, so this is the only reliable path.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset from the other conductor crons
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only — delete nothing"
        type: boolean
        default: false
      force_delete_branches:
        description: "Comma-separated branch names to delete regardless of merge state"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prune merged / superseded branches (report stranded)
        run: |
          python scripts/branch_janitor.py \
            ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }} \
            --force-delete "${{ github.event.inputs.force_delete_branches }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
