name: Render hostbuf sentinel

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostbuf-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sentinel dependencies
        run: python -m pip install PyYAML
      - name: Check recurring host-buffer read failure
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kindrobots.org
        run: python scripts/check_hostbuf_failure.py
