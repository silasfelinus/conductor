name: Hourly Conductor

# Runs every hour. Checks both repos (conductor + kind_robots) via GitHub API,
# scans local roadmaps for blockers, fetches open todos, and uses Claude to
# produce a brief actionable summary written to CONDUCTOR-REPORT.md.
#
# It also carries a second daily-digest watchdog pass (see the digest-watchdog
# job), because the dedicated watchdog is schedule-triggered and dies in the
# same GitHub scheduling outages it is supposed to cover.
#
# ANTHROPIC_API_KEY is OPT-IN (2026-09-04, Silas): the hourly Conductor Agent
# Routine already runs this assessment inside a Max-plan Claude session, so a
# scheduled run must not also spend API credits. The key reaches the job only
# on a manual workflow_dispatch with spend_api_credits=true; every scheduled
# run takes build_conductor_summary.py's rule-based fallback.
#
# Daily Dream creation deliberately does NOT happen here anymore. The morning
# daily-digest workflow owns one ordered cycle: author -> build -> Facets ->
# submit ArtJobs -> commit -> digest. Keeping the hourly assessment read-only
# prevents midnight/hourly runs from building a proposal before that sequence.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print report to log only; do not commit"
        required: false
        default: "false"
        type: string
      spend_api_credits:
        description: "Hand this run ANTHROPIC_API_KEY (Haiku summary). Off = rule-based summary."
        required: false
        default: false
        type: boolean

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  digest-watchdog:
    # A second carrier for the daily digest. daily-digest-retry.yml is the
    # dedicated watchdog, but it is schedule-triggered and therefore shares the
    # exact failure it guards against: on 2026-08-31 the digest and both of its
    # watchdog passes were undelivered together. This cron fires far more often,
    # so it catches the case where the dedicated passes never ran.
    #
    # Read-only with respect to the repo -- it only dispatches or re-runs a
    # workflow, so it does not violate this workflow's "hourly assessment stays
    # read-only" rule above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ensure today's daily digest ran
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: daily-digest.yml
          MAX_ATTEMPTS: "3"
        run: bash scripts/ensure_daily_digest.sh

  conductor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run conductor assessment
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python scripts/build_conductor_summary_report_only.py $FLAG
        env:
          ANTHROPIC_API_KEY: ${{ inputs.spend_api_credits == true && secrets.ANTHROPIC_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conductor-report
          path: CONDUCTOR-REPORT.md
          if-no-files-found: ignore

      - name: Commit conductor report
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add CONDUCTOR-REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: conductor report $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt}/3 lost a race; retrying."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to push conductor report after 3 attempts."
          exit 1
