name: Dead Air daily film production

# A scheduled attempt is not a completed film. It can queue/recover ArtJobs
# and leave an honest "rendering" ledger until a private 15s MP4 passes probes.
on:
  schedule:
    - cron: "0 18 * * *" # 10am PST / 11am PDT; PT date is computed in Python.
  push:
    branches: [main]
    paths:
      - "projects/dead-air/episodes/*.yaml"
      - ".github/workflows/dead-air-daily.yml"
  workflow_dispatch:

concurrency:
  group: conductor-dead-air-film
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install storyboard and audio dependencies
        run: |
          python -m pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Attempt oldest private unfinished commercial
        id: film
        shell: bash
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: ${{ vars.KR_BASE_URL || 'https://kindrobots.org' }}
        run: |
          set +e
          python scripts/dead_air_produce.py --daily
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 0 ]; then
            echo "## Dead Air: completed a private film" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = 3 ]; then
            echo "## Dead Air: still rendering / no unpublished episode ready" >> "$GITHUB_STEP_SUMMARY"
            echo "A successful attempt is NOT evidence of a finished video." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Dead Air: production blocked (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            echo "No completed video is claimed. Inspect this run and the durable ledger." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Persist production evidence before reporting any failure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f projects/dead-air/production-state.json ]; then
            echo "No updated private film ledger."
            exit 0
          fi
          git config user.name "kind-robots-bot"
          git config user.email "noreply@kindrobots.app"
          git add projects/dead-air/production-state.json
          if git diff --cached --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "dead-air: save private film render progress [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "::error::Could not commit durable ArtJob evidence."
          exit 1
      - name: Make unfinished or failed results explicit
        shell: bash
        run: |
          case "${{ steps.film.outputs.exit_code }}" in
            0) echo "::notice::A final private 15-second MP4 passed automatic probes." ;;
            3) echo "::warning::No film completed in this attempt; consult episode ledger." ;;
            *) echo "::error::Dead Air production failed; not a completed film."; exit 1 ;;
          esac
