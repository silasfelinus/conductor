name: One-time Oversight Audit Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-oversight-audit-refresh.yml

permissions:
  contents: write

concurrency:
  group: conductor-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate and regenerate audit
        run: |
          python scripts/validate_roadmaps.py
          python scripts/audit_roadmaps.py
      - name: Assert clean warnings and persist
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('ROADMAP-AUDIT.json', encoding='utf-8'))
          errors = report['summary']['errors']
          warnings = report['summary']['warnings']
          print(f'errors={errors} warnings={warnings}')
          if errors or warnings:
              raise SystemExit('Roadmap audit is not clean')
          PY
          rm .github/workflows/one-time-oversight-audit-refresh.yml
          git config user.name "conductor-bot"
          git config user.email "conductor-bot@users.noreply.github.com"
          git add ROADMAP-AUDIT.md ROADMAP-AUDIT.json .github/workflows/one-time-oversight-audit-refresh.yml
          git diff --staged --check
          git commit -m "chore: refresh clean roadmap audit [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
