name: Run Art Repair Now

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-art-repair-now.yml"

concurrency:
  group: run-art-repair-now
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/run-art-repair-now'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - id: existing-report
        name: Check for completed repair
        run: |
          if [ -f ops/home-server/LAST-ART-REPAIR.log ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing-report.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.existing-report.outputs.exists != 'true'
        name: Install repair dependencies
        run: python -m pip install pyyaml

      - if: steps.existing-report.outputs.exists != 'true'
        name: Canonicalize source queue
        run: python scripts/repair_art_request_defaults.py --write

      - if: steps.existing-report.outputs.exists != 'true'
        name: Repair and requeue failed ArtJobs
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
          KR_BASE_URL: https://kind-robots.vercel.app
        run: |
          set +e
          {
            echo "Repair run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python scripts/repair_failed_kindrobots_artjobs.py --live
          } 2>&1 | tee ops/home-server/LAST-ART-REPAIR.log
          STATUS=${PIPESTATUS[0]}
          echo "Exit status: $STATUS" | tee -a ops/home-server/LAST-ART-REPAIR.log
          cat ops/home-server/LAST-ART-REPAIR.log >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - if: steps.existing-report.outputs.exists != 'true'
        name: Upload repaired queue and report
        uses: actions/upload-artifact@v4
        with:
          name: art-repair-results
          path: |
            projects/art-prompts.yaml
            ops/home-server/LAST-ART-REPAIR.log
          if-no-files-found: error
          retention-days: 1

      - if: steps.existing-report.outputs.exists != 'true'
        name: Publish repaired queue and report to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          publish_file() {
            FILE="$1"
            MESSAGE="$2"
            CONTENT=$(base64 -w 0 "$FILE")
            SHA=$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f ref="$BRANCH" --jq .sha 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
                -f message="$MESSAGE" -f content="$CONTENT" \
                -f branch="$BRANCH" -f sha="$SHA" >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
                -f message="$MESSAGE" -f content="$CONTENT" \
                -f branch="$BRANCH" >/dev/null
            fi
          }

          publish_file ops/home-server/LAST-ART-REPAIR.log \
            "chore: record failed ArtJob repair"
          publish_file projects/art-prompts.yaml \
            "chore: canonicalize queued art paths and prompts"
