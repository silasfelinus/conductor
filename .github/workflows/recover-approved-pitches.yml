name: Recover historical approved pitches

on:
  push:
    branches:
      - main
    paths:
      - "pitches/*.md"
      - "pitches/daily/*.yaml"
      - "scripts/approved_pitch_recovery.py"
      - "tests/test_approved_pitch_recovery.py"
      - ".github/workflows/recover-approved-pitches.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: conductor-pitch-intake
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pytest
      - name: Verify legacy intake does not duplicate projects
        run: python -m pytest -q tests/test_approved_pitch_recovery.py
      - name: Recover only approved legacy records
        run: python scripts/approved_pitch_recovery.py --apply
      - name: Validate roadmaps
        run: python scripts/validate_roadmaps.py
      - name: Commit updates and dispatch projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "conductor-pitch-recovery[bot]"
          git config user.email "conductor-pitch-recovery[bot]@users.noreply.github.com"
          git add projects repos.yaml project-overrides.yaml CONTROL.md
          if git diff --cached --quiet; then
            echo "No new historical intake to commit."
            exit 0
          fi
          git commit -m "chore: backfill approved historical pitches [skip ci]"
          git fetch origin main
          git push origin HEAD:main
          gh workflow run sync-kind-robots-projection.yml --ref main
