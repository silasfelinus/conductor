name: One-shot Complete Challenge Center t-005 v3

on:
  push:
    branches:
      - worker/challenge-center-t-005-complete-v3

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/challenge-center-t-005-complete-v3
          fetch-depth: 0

      - name: Apply byte-preserving roadmap patch
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          roadmap = Path('projects/challenge-center/roadmap.yaml')
          text = roadmap.read_text()
          lines = text.splitlines()

          def bounds(task_id: str):
              start = next(i for i, line in enumerate(lines) if line == f'- id: {task_id}')
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('- id: ')), len(lines))
              return start, end

          def replace_field(start: int, end: int, field: str, value_lines: list[str]):
              prefix = f'  {field}:'
              index = next(i for i in range(start, end) if lines[i].startswith(prefix))
              field_end = index + 1
              while field_end < end and (lines[field_end].startswith('    ') or not lines[field_end].strip()):
                  field_end += 1
              lines[index:field_end] = value_lines
              return len(value_lines) - (field_end - index)

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat()

          start, end = bounds('t-005')
          status_index = next(i for i in range(start, end) if lines[i].startswith('  status:'))
          if lines[status_index] not in {'  status: claimed', '  status: done'}:
              raise SystemExit(f'Unexpected t-005 status: {lines[status_index]}')
          lines[status_index] = '  status: done'
          delta = replace_field(start, end, 'note', [
              '  note: "DONE (2026-07-12): Kind Robots PR #208 merged the Challenge Center browser on the existing /challenges content route. It adds division/status filters, fight-card styling, difficulty stars, entrant counts, per-challenge leader previews, and links into /challenges/[slug]. TypeScript and contract CI passed; the Vercel preview build completed successfully."'
          ])
          end += delta
          updated_index = next(i for i in range(start, end) if lines[i].startswith('  updated:'))
          lines[updated_index] = f"  updated: '{now}'"

          start, end = bounds('t-006')
          status_index = next(i for i in range(start, end) if lines[i].startswith('  status:'))
          if lines[status_index] not in {'  status: waiting', '  status: ready'}:
              raise SystemExit(f'Unexpected t-006 status: {lines[status_index]}')
          lines[status_index] = '  status: ready'
          depends_index = next(i for i in range(start, end) if lines[i].startswith('  depends_on:'))
          depends_end = depends_index + 1
          while depends_end < end and lines[depends_end].startswith('  - '):
              depends_end += 1
          lines[depends_index:depends_end] = [
              '  depends_on:',
              '  - t-004',
              '  - t-005',
          ]

          roadmap.write_text('\n'.join(lines) + '\n')

          learning = Path('LEARNING.yaml')
          ledger = learning.read_text()
          marker = '  project: challenge-center\n  task: t-005\n'
          if marker not in ledger:
              if not ledger.endswith('\n'):
                  ledger += '\n'
              ledger += '''- date: 2026-07-12
  project: challenge-center
  task: t-005
  kind: software
  stakes: reversible
  passes: 0
  outcome: done
  failure_category: null
  lesson: "Upgrade the existing project-front content route rather than creating a duplicate page; API-backed filters and lightweight leaderboard previews can turn a partial browser into the shipped arena without schema work."
'''
              learning.write_text(ledger)
          PY

      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-complete-challenge-t005-v3.yml
          git config user.name conductor-bot
          git config user.email conductor-bot@users.noreply.github.com
          git add projects/challenge-center/roadmap.yaml LEARNING.yaml .github/workflows/one-shot-complete-challenge-t005-v3.yml
          git commit -m "done: challenge-center/t-005"
          git push origin HEAD:worker/challenge-center-t-005-complete-v3
