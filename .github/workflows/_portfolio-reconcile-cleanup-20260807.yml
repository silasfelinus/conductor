name: One-shot portfolio reconciliation cleanup 2026-08-07

on:
  push:
    branches:
      - claude/portfolio-reconcile-20260807
    paths:
      - scripts/_portfolio_reconcile_cleanup_20260807.py
      - .github/workflows/_portfolio-reconcile-cleanup-20260807.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/portfolio-reconcile-20260807
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Apply warning cleanup
        run: python scripts/_portfolio_reconcile_cleanup_20260807.py
      - name: Validate portfolio
        run: |
          python scripts/validate_roadmaps.py
          pytest -q tests/test_next_ready_task.py tests/test_validate_roadmaps.py tests/test_build_status.py tests/test_current_project_lifecycle.py
          python scripts/build_status.py
          python scripts/audit_roadmaps.py
          python - <<'PY'
          import json
          report = json.load(open('ROADMAP-AUDIT.json', encoding='utf-8'))
          print('audit summary:', report['summary'])
          for item in report['findings']:
              if item['severity'] in {'error', 'warning'}:
                  print(item['severity'].upper(), item['code'], item['project'], item.get('task'), '-', item['message'])
          if report['summary']['errors'] or report['summary']['warnings']:
              raise SystemExit('roadmap audit still has errors/warnings')
          PY
      - name: Remove one-shot cleanup
        run: git rm scripts/_portfolio_reconcile_cleanup_20260807.py .github/workflows/_portfolio-reconcile-cleanup-20260807.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'portfolio: clean reconciliation audit warnings'
          git push origin HEAD:claude/portfolio-reconcile-20260807
