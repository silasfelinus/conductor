name: Project Dream Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyyaml
      - name: Run sync script
        env:
          KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(python scripts/sync_projects_to_dreams.py 2>&1)"
          status=$?
          echo "## Project Dream Sync" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$status"
