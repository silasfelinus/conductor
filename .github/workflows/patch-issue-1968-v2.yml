name: Patch issue 1968 v2

on:
  push:
    branches:
      - agent/issue-1968-ready-closeout-metadata
    paths:
      - '.github/workflows/patch-issue-1968-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1968-ready-closeout-metadata
          fetch-depth: 0

      - name: Patch ready closeout metadata semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/process_task_events.py')
          text = path.read_text()
          old = '        if target not in {"claimed", "review"}:\n            ops.append(("unset", "owner", None))\n'
          new = (
              '        if target not in {"claimed", "review"}:\n'
              '            ops.append(("unset", "owner", None))\n'
              '        if target == "ready":\n'
              '            ops.append(("unset", "claimed_by", None))\n'
              '            ops.append(("unset", "claimed_at", None))\n'
              '            implementation_pr = event.get("implementation_pr")\n'
              '            if implementation_pr is not None:\n'
              '                if not isinstance(implementation_pr, str) or not VERIFY_PR_RE.match(implementation_pr.strip()):\n'
              '                    raise ValueError(\n'
              '                        f"implementation_pr must look like owner/repo#number, got {implementation_pr!r}"\n'
              '                    )\n'
              '                ops.append(("set", "implementation_pr", implementation_pr.strip()))\n'
              '            elif not task.get("recurring"):\n'
              '                ops.append(("unset", "implementation_pr", None))\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install targeted Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Run targeted regression tests
        run: python -m pytest -q tests/test_ready_closeout_metadata.py tests/test_process_task_events.py

      - name: Commit source fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-issue-1968.yml .github/workflows/patch-issue-1968-v2.yml
          git add scripts/process_task_events.py tests/test_ready_closeout_metadata.py
          git commit -m 'fix(task-events): clear stale ready closeout metadata'
          git push origin HEAD:agent/issue-1968-ready-closeout-metadata
