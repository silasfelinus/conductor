name: Prom and Tactics ArtJob Fast Intake

# Bypass long generic art submission/render pipelines. Submit accepted Krea 2
# work promptly, record real ArtJob IDs and never block on rendered output.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prom-tactics-art-intake.yml"
      - "projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml"
      - "projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml"
      - "projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml"
      - "projects/comet-city-academy/art/OCT-29-CAST-KREA2-ROUND-1.yaml"
      - "projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: prom-tactics-art-intake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit-approved-private-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KR_BASE_URL: https://kindrobots.org
      KR_FALLBACK_BASE_URL: ${{ vars.KR_ART_API_BASE_URL }}
      KR_API_TOKEN: ${{ secrets.KR_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      # Use latest main receipt state, not an older push trigger's commit.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install art intake dependencies
        run: pip install pyyaml Pillow pytest
      - name: Verify real authenticated ArtJob API
        run: |
          if [ -z "$KR_API_TOKEN" ]; then
            echo "::error::KR_API_TOKEN is missing; submission cannot proceed."
            exit 1
          fi
          # Probe the configured production API and an optional explicit
          # repository-variable override; never hardcode a retired host.
          for origin in "$KR_BASE_URL" "$KR_FALLBACK_BASE_URL"; do
            [ -n "$origin" ] || continue
            status="$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "$origin/api/health/database" || true)"
            if [ "$status" = "200" ]; then
              echo "KR_BASE_URL=$origin" >> "$GITHUB_ENV"
              echo "::notice::Kind Robots ArtJob API healthy at $origin."
              exit 0
            fi
          done
          echo "::error::Neither approved Kind Robots API origin passed health; no jobs submitted."
          exit 1
      - name: Verify approved private art intake contracts
        run: |
          python -m pytest -q tests/test_evt_one_hit_crew_tells.py \
            tests/test_prom_oct29_art_ledger.py \
            tests/test_prom_tactics_art_intake.py \
            tests/test_prom_canon_outcome_corrections.py
      # This established fast-intake workflow already bypasses Auto Art Generate.
      # Submit the newest private Prom/Tactics game-art batches before the older
      # historical receipts so the 24 requested poses do not wait behind them.
      - name: Submit new private combat and recruit emotion ArtJobs
        id: priority-new-art
        continue-on-error: true
        run: |
          failures=0
          for ledger in \
            projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml \
            projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml; do
            python scripts/enqueue_art_requests.py "$ledger" --live || failures=1
          done
          bash scripts/checkpoint_art_state.sh \
            "chore: checkpoint Prom and Tactics priority art receipts [skip ci]" || failures=1
          exit "$failures"

      - name: Refresh new private combat and recruit emotion receipts
        if: steps.priority-new-art.outcome == 'success'
        continue-on-error: true
        run: |
          for ledger in \
            projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml \
            projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml; do
            python scripts/enqueue_art_requests.py "$ledger" --status
          done
          bash scripts/checkpoint_art_state.sh \
            "chore: refresh priority Prom and Tactics ArtImages [skip ci]"

      - name: Require durable ArtJob receipts for 24 priority paintings
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path("projects/every-villain-tactics/art/ONE-HIT-CREW-COMBAT-STATES-2026-11-22.yaml"),
              Path("projects/comet-city-academy/art/AUTHORED-RECRUITS-EMOTIONS-2026-11-22.yaml"),
          ]
          for path in paths:
              ledger = yaml.safe_load(path.read_text(encoding="utf-8"))
              subjects = ledger.get("subjects") or []
              missing = [
                  subject["key"] for subject in subjects
                  if type((subject.get("jobs") or {}).get("krea2")) is not int
              ]
              print(f"{path}: {len(subjects) - len(missing)}/{len(subjects)} ArtJob receipts")
              if len(subjects) != 12 or missing:
                  raise SystemExit(f"ArtJob acceptance incomplete: {path}: {missing}")
          PY
          if [ "${{ steps.priority-new-art.outcome }}" != "success" ]; then
            echo "::error::Priority new-art submission step failed."
            exit 1
          fi

      # The server deduplicates each deterministic requestKey. If an earlier
      # job was accepted but its workflow cancelled, this returns its same ID.
      # Checkpoint partial successes even if later cells fail.
      - name: Submit missing Tactics telegraphs and checkpoint ArtJob IDs
        id: tactics
        continue-on-error: true
        run: |
          set +e
          python scripts/enqueue_art_requests.py \
            projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml --live
          enqueue_status=$?
          bash scripts/checkpoint_art_state.sh \
            "chore: record Tactics one-hit ArtJob receipts [skip ci]"
          checkpoint_status=$?
          if [ "$enqueue_status" -ne 0 ] || [ "$checkpoint_status" -ne 0 ]; then
            echo "::error::Tactics submission incomplete; accepted job IDs checkpointed when possible."
            exit 1
          fi
      - name: Submit missing October Prom art and checkpoint ArtJob IDs
        id: prom
        continue-on-error: true
        run: |
          set +e
          python scripts/enqueue_art_requests.py \
            projects/comet-city-academy/art/OCT-29-CAST-KREA2-ROUND-1.yaml --live
          enqueue_status=$?
          bash scripts/checkpoint_art_state.sh \
            "chore: record October Prom ArtJob receipts [skip ci]"
          checkpoint_status=$?
          if [ "$enqueue_status" -ne 0 ] || [ "$checkpoint_status" -ne 0 ]; then
            echo "::error::Prom submission incomplete; accepted job IDs checkpointed when possible."
            exit 1
          fi
      - name: Refresh ArtJob status and delivered ArtImage receipts
        continue-on-error: true
        run: |
          set +e
          python scripts/enqueue_art_requests.py \
            projects/every-villain-tactics/art/ONE-HIT-CREW-TELEGRAPHS-2026-11-20.yaml --status
          python scripts/enqueue_art_requests.py \
            projects/comet-city-academy/art/OCT-29-CAST-KREA2-ROUND-1.yaml --status
          bash scripts/checkpoint_art_state.sh \
            "chore: refresh Prom and Tactics art receipt statuses [skip ci]"
      # A successful request count is not a completed ArtJob or approved art.
      # Require durable accepted IDs for each of the 36 distinct cells.
      - name: Require durable ArtJob IDs for all 36 cells
        if: always()
        run: |
          python scripts/verify_prom_tactics_art_intake.py --require-jobs
          if [ "${{ steps.tactics.outcome }}" != "success" ] || \
             [ "${{ steps.prom.outcome }}" != "success" ]; then
            echo "::error::One or more art submission phases failed."
            exit 1
          fi

      # This corrective round is opt-in to the generic sweep too, but the
      # dedicated intake submits the same stable requestKeys immediately.
      # ArtJob API deduplication makes either order safe; no duplicate renders.
      - name: Submit six canonical Prom outcome corrections
        id: canon
        continue-on-error: true
        run: |
          set +e
          python scripts/enqueue_art_requests.py \
            projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml --live
          enqueue_status=$?
          bash scripts/checkpoint_art_state.sh \
            "chore: record canonical Prom correction ArtJob receipts [skip ci]"
          checkpoint_status=$?
          if [ "$enqueue_status" -ne 0 ] || [ "$checkpoint_status" -ne 0 ]; then
            echo "::error::Canonical Prom intake incomplete; checkpoint any accepted IDs before retry."
            exit 1
          fi
      - name: Refresh canonical correction ArtImage receipts
        if: steps.canon.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/enqueue_art_requests.py \
            projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml --status
          bash scripts/checkpoint_art_state.sh \
            "chore: refresh canonical Prom correction image receipts [skip ci]"
      - name: Verify durable ArtJob acceptance for six corrections
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("projects/comet-city-academy/art/CANON-OUTCOME-CORRECTIONS-2026-11-22.yaml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8"))
          subjects = doc.get("subjects", [])
          accepted = [
              (row["key"], (row.get("jobs") or {}).get("krea2"))
              for row in subjects
          ]
          missing = [
              key for key, job_id in accepted
              if type(job_id) is not int or job_id <= 0
          ]
          print("Canonical correction receipts:", accepted)
          if len(subjects) != 6 or missing:
              raise SystemExit(
                  f"Only {len(subjects) - len(missing)}/6 corrective ArtJobs recorded; missing: {missing}"
              )
          PY
          if [ "${{ steps.canon.outcome }}" != "success" ]; then
            echo "::error::Corrective art submission phase failed."
            exit 1
          fi
