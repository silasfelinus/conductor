  note: 'Done. Voice art requests now submit to the real Kind Robots art API, THROUGH kind_robots per the
    art-generator-connect routing policy. Added src/art-submit.ts in silasfelinus/serendipity-voice: an
    authenticated client with three modes, default "conductor" = POST /api/conductor/art-request
    (mirrors scripts/request_art.py; queues into projects/art-prompts.yaml for a worker to generate),
    plus "queue" (POST /api/art/queue ArtJob) and "generate" (POST /api/art/generate sync A1111). Token
    sent under every alias the KR guards accept (X-KR-API-Token/x-admin-token/x-api-key/Bearer).
    voice-bridge became async and, when SERENDIPITY_ENABLE_ART + a token are set, submits and speaks the
    real outcome. Broadened the art parser for natural phrasing ("generate me an image of a fox", "make
    me a picture of a dragon", "draw a fox"). Fully gated: art off or no token stays draft-only. No KR
    code change needed. Verified with 119 tests + typecheck and live Alexa-event -> real POST
    /api/conductor/art-request against a mock KR. NOTE: the consumer that drains art-prompts.yaml requests
    into generated images is the remaining loop (art-generator-connect t-010/t-012); the voice producer
    is complete. Deploy/runbook: docs/physical-echo-runbook.md; go-live is the t-010 human gate.'
