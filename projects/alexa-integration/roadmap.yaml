project: alexa-integration
kind: software
notes_from_silas: >-
  Build the Alexa work as the Serendipity voice surface for local Amazon Echo
  devices. The stable user-facing contract is "Serendipity: <request>" — Alexa's
  actual invocation may be "ask Serendipity to..." or an opened Serendipity
  session, but the relay should route the request after the Serendipity prefix.
  When finished, it should support custom LLM chat, taking on a role as a
  Character, telling/continuing a story in a Dream, playing approved local music
  files, and creating/working on projects through safe draft/read paths. Project
  Dreams now have goal and waypoints fields; use them as the friendly voice/UI
  project state while keeping Conductor roadmap.yaml as the authoritative agent
  task queue. Prototype locally first. Do not publish the skill, expose a live
  endpoint, touch DNS/secrets/billing, or bypass human gates without explicit
  needs-human approval.
