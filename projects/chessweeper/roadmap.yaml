# Chessweeper: one three-mode chess / minesweeper / bouncing disc action-puzzle.
project: chessweeper
kind: software
autonomous: true
goal: >-
  Ship Chessweeper to a human-testable complete game in Kind Robots /play with three fully playable, visibly and mechanically distinct styles: Sugarbomb Kingdom (kawaii combo puzzle), Ashen Checkmate (gritty tactical survival) and Jackpot Apocalypse (neon casino pinball risk/reward). Shared legal chess, Minesweeper clues/mines, hazard discs, mouse/keyboard/touch, persistent progression and settings, at least four authored endings per world, achievements, a discoverable scrapbook, integrated tutorial sidebar, painted hero/highlight/art, complete QA and a final Playtest handoff. Public publication is separately gated.
notes_from_silas: |-
  Silas, 2026-11-17 PT: "hey computer can you make me uhh chess minesweeper and disc room in html5"; then "combine them"; then three redesign pitches with a very kawaii Lisa Frank bubblegum style, a Dark Souls gritty style, and a third chosen by the designer (Jackpot Apocalypse). "@GitHub add this to conductor, we expect playable version of all three styles, on the front end on /play".
  Rebuild this as a true three-way gameplay mashup. No three unrelated demos, no merely recolored CSS switch. Implement original art instead of copying branded visuals. Expected target /play/chessweeper; add a Play tab and project presentation in Kind Robots. Every published/release action remains a separate human approval.
