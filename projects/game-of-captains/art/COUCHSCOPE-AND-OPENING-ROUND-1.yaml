# Space Couch onboarding priority art (Silas, 2026-11-02 playtest notes).
# 1. The three opening missions (refugees, archive, bar) are the first stage every player sees, and their only
#    paintings predate the red-couch redesign, so the play page shows the drawn bridge filler. These are the
#    red-couch repaints for the same runtime keys.
# 2. The Couchscope reveal needs a painted plate per constellation (couchscope/sign-<id>, read by
#    components/gameOfCaptains/constellation-test.vue) instead of the generic star-dot drawing.
# 3. The new trolley-problem question (couchscope/trolley) needs its hero and three answer plates.
# Auto Art Generate submits on Conductor main and writes job ids back. Queued != rendered != wired: each DONE
# art_image_id still has to be added to kind_robots utils/gameOfCaptains/onboardingArt.ts (couchscope keys)
# or voyagePaintings.ts (mission keys) before the game shows it.
