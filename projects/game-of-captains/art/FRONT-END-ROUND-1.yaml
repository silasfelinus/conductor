  prompt_prose: View from the open rear doorway of an eccentric starship command bridge. The room has curved cream
    metal walls, exposed copper pipes, amber analog switches, a worn red captain's chair and a wide trapezoidal
    forward window. Through the window is a ringed teal planet at upper center and a violet-blue nebula streaked
    with stars. On the right side stands Captain Vale, a middle-aged brown-skinned woman with a shaved head in a
    charcoal command coat with a high burgundy collar and brass shoulder bars, one hand braced against the chair.
    At her right, Bosun Pell, a short stocky freckled red-skinned engineer in grey overalls with a metal prosthetic
    forearm, works on an open panel that releases a handful of orange sparks. Dr. Vela Sorn, a broad lilac-skinned
    alien with small pointed ears and a sea-green medical jacket, holds a white medical case. A small silver round
    robot with one blue eye and three thin legs watches the sparks. The lower-left foreground contains an unoccupied
    stretch of dark navy console and floor. Camera at eye level, looking toward the window.
