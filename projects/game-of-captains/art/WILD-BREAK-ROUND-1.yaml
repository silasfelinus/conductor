# Space Couch Wild Break (Silas, 2026-11-12): "there needs to be a wild break possible to avoid the
# horoscope, with at least 32 endings" and "whatever horoscope i get, there is no original art."
# The Couchscope now has a WILD BREAK exit: 13 branching scenes (4 x 2 x 4) reach 32 distinct endings, each
# needing its own painted plate. Scene keys: couchscope/wild/<scene>; ending keys: couchscope/wild-end/<ending>,
# read by kind_robots components/gameOfCaptains/wild-break.vue (story in utils/gameOfCaptains/wildBreak.ts).
# No legible text in any plate (curation-redo lesson); the captain is small or seen from behind so the plate
# fits all six captains. Queued != rendered != wired: each DONE art_image_id still has to be added to
# kind_robots utils/gameOfCaptains/onboardingArt.ts before the game shows it.
