# New original playbook, approved as high priority 2026-10-25 PT.
project: game-of-captains
kind: software
autonomous: true
goal: >-
  Build Space Couch, a premium art-first comedic science-fiction captain
  playbook, using stable game-of-captains slug and Play route. Select a captain
  and senior crew, command shipboard and 0-3-person away teams, resolve major
  intervention ethics dilemmas, experience twelve evolving star systems and
  thirty mission families, face eight distinctive run-randomized alien
  antagonists across a three-act voyage, and reach sixteen earned endings.
  Preserve Barkeep Vox, sentient Serendipity and Captain Fluke narrator canon.
  Playable console-like slice, rendered branching art, seeded adversarial
  whole-run QA, final subjective approval and separate outward-release gate.
notes_from_silas: |
  2026-10-26 PT: Silas renamed the game SPACE COUCH. The ship is a LONG RED COUCH
  protected by an invisible force shield and capable of unfolding temporary
  miniaturized holodecks, war rooms and other rooms BEHIND its backrest.
  This replaces all conventional starship bridge imagery, rewrites quest canon,
  and updates the Play/home/project presentation, Playbook Kit/Forge and art queue.
  Keep game-of-captains slug, Play URL, and existing saves intact. Rendered
  painterly art, project database title and adversarial verification are real
  completion gates. Temporary SVG does not complete the art task.
  2026-10-25 PT: Silas selected "This Means Warp" as the new display title.
  "Game of Captains" describes the genre only; retain game-of-captains
  as stable Conductor slug and /play/game-of-captains as compatibility
  URL to avoid breaking links, dashboard features or persisted saves.
  The game remains a captain-and-crew comedy sci-fi playbook inspired
  by Space Quest, Red Dwarf, Hitchhiker's Guide, Star Wars, Star Trek,
  Lower Decks, Barbarella and The Orville: away missions, ethical
  intervention, randomized persistent antagonist, destination-specific
  conclusions, Vox, sentient Serendipity and Fluke canon.
  Approved user-facing Play/highlight placement, art-first viewport
  console screens; full cast and rendered art remain required.
  The existing kind_robots PR #4185 is the original name's
  early playable slice, not full three-act completion. Coordinate with
  its pending review rather than editing another worker's branch.
  Master issue: https://github.com/silasfelinus/kind_robots/issues/4182
  Definitive new design brief: DESIGN-BRIEF.md
