# New original playbook, approved as high priority 2026-10-25 PT.
project: game-of-captains
kind: software
autonomous: true
goal: >-
  Deliver a funny but ethically consequential space-command playbook: captain and senior crew
  selection, ship/away missions with 0-3 assigned crew, twelve evolving stars/ports, unique
  intervention dilemmas, 30 missions, 40 encounter cards, eight seeded alien antagonists
  interfering throughout a three-act voyage, sixteen deeply earned endings and original
  character arcs. Reuse canon Vox, sentient Serendipity Space Bar and Captain Fluke
  Improbability Starcruiser without conflating narrator identities. Private AAA-like
  one-screen console experience, art delivered, seeded adversarial replay and final human
  design review; publication gated separately.
notes_from_silas: |
  2026-10-25 PT: Silas proposed a HIGH-priority comedy sci-fi space playbook influenced by
  Space Quest, Red Dwarf, Hitchhikers Guide, Star Wars, Star Trek, Lower Decks, Barbarella
  and The Orville. Player chooses captain and crew, runs space/away team missions and
  non-interference ethics scenarios, faces a randomized persistent alien antagonist and earns
  endings at varying destinations. Reuse established Barkeep Vox, Serendipity Space Bar and
  Captain Fluke. Master issue: https://github.com/silasfelinus/kind_robots/issues/4182.
  DESIGN-BRIEF.md explains verified continuity and original-story boundaries.
