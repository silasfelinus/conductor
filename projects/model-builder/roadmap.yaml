project: model-builder
kind: software

goal: >
  A reusable Kind Robots front end that turns any source record — Project, Character,
  Bot, Facet, Dream, Reward, or Scenario — into a resumable, human-gated build run:
  pick a recipe, generate fields and art, and commit upgraded or newly created records
  with full provenance. Marketing Deck is one recipe, not the root product.

notes_from_silas: |
  Build a reusable front-end Model Builder for Kind Robots schema records. Marketing Deck
  is one recipe, not the root product. A user selects a source model — Project, Character,
  Bot, Facet, Dream, Reward, or Scenario — then selects a recipe and individual outputs.

  The front end is a resumable, human-gated recipe runner. Each Build Item advances through
  PITCH, FIELDS_AND_PROMPTS, GENERATE_ASSETS, and COMMIT. Users can stop after any stage,
  edit results, rerun only stale stages, or resume later. Editing upstream work marks
  downstream work stale without deleting revision history.

  Support upgrading existing rows and creating related rows. New rows may be deferred until
  final commit or created early as private/inactive drafts after field approval when a durable
  ID is required. Final activation, relationship writes, and canonical asset promotion remain
  separate approvals.

  Reuse existing Kind Robots model APIs, generation specs, ArtImage/ArtCollection provenance,
  ExpressionMedia, LTX video, Hunyuan3D, and Comfy workflows. Components use modelBuilderStore
  and never call API routes directly. Provider credentials remain server-side. Generation may
  use Silas-owned team tokens with usage visible.

  No unattended publishing, deployment, printing, fabrication, customer contact, account
  creation, ad spend, paid provider use, or destructive canonical replacement.

