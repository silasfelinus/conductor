  - id: t-036
    milestone: m6
    title: "Add a lint/regression guard for GENERATE_ASSETS-style completion-write races in modelBuilderStore.ts"
    status: done
    passes: 0
    stakes: reversible
    owner: worker
    note: >
      Kaizen from t-029 (kind_robots PR #1114, 2026-07-28): a GENERATE_ASSETS render
      completion handler (generateItemAsset/pollAsyncArtJob/generateItemAssetAsync)
      held only its original item reference and unconditionally overwrote the stage
      status on completion, silently clobbering a concurrent upstream reopen's
      'stale' marker. Fixed ad hoc with finishGenerateAssets(item, next), which only
      writes if the stage is still 'in-progress'. This is now the third distinct
      "review/re-review gate silently bypassed" bug class found by manual read-through
      in modelBuilderStore.ts (after canApproveAssets and the batch-editor
      stage-approval-gate fixes) -- each one only caught because a cycle happened to
      read that exact code path. Add a repo-side static check (mirroring
      verifyModelBuilderLinkCoverage.ts's approach from t-032/t-035) that walks every
      async completion/write site touching a stage-status field in
      modelBuilderStore.ts and flags any that don't gate on the stage's current status
      before writing -- so this bug class is caught mechanically instead of requiring
      a full manual store re-read every burst cycle. Front-end/test-only change; no
      schema change expected.

      Provenance note: this task idea originated in a concurrent session's PR
      (conductor PR #1360) that collided with this session's own t-029 close-out
      (conductor PR #1362, merged first) -- both sessions independently reviewed the
      same kind_robots PR #1114 within the same minute. PR #1360's roadmap/pitch edits
      were superseded and closed unmerged, but this specific kaizen idea was salvaged
      here since it's a genuinely good, independent suggestion distinct from anything
      this session's own review proposed.

      PROGRESS 2026-07-28 (conductor scheduled Agent run, claude-conductor-agentrun-20260728T220700-mb-t036):
      implemented on kind_robots branch claude/confident-bardeen-oevtq7, kind_robots PR
      #1122 (open, CI running). Added utils/scripts/verifyModelBuilderCompletionGate.ts,
      mirroring verifyModelBuilderLinkCoverage.ts's regex-extraction approach: walks
      every async function in modelBuilderStore.ts, finds any item.stages.<KEY> = write
      after that function's own first await, and fails if it isn't wrapped (directly or
