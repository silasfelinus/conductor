      `loadSources()` is sound: it captures `requestedType` before the await and re-checks `state.sourceType !== requestedType` on both the success and catch paths before writing state, so a stale response from a fast tab-to-tab click cannot clobber a newer selection's sources or error -- this already covers the same race class as the fetchRuns()/other guarded loaders elsewhere in the store. `sourcesError` is set on both the explicit-empty-list case and the thrown-error case, and the template's Retry button correctly calls `store.loadSources()` directly (not `selectSourceType`, which has an early-return guard that would otherwise no-op on a same-tab retry after zero sources loaded -- but that guard checks `state.sources.length`, which is falsy on both an empty result and a failed fetch, so it never actually blocks the retry path; verified by tracing the boolean, not just reading it optimistically). `setOutputQuantity()` clamps correctly (`Math.floor(quantity) || 1` turns a NaN from a cleared/non-numeric input into 1, then `Math.max(1, Math.min(MAX_BATCH, ...))` bounds it), so typing outside the input's min=1/max=12 HTML attributes (which the browser does not strictly enforce on manual typing, only on the stepper arrows) cannot desync the stored value from the UI's stated bounds. No bug found in this lens either.

