ed16e99e1cddb4. Next lead for cycle 23: run-history, progress-matrix, and batch-editor components remain the least-recently-focused areas; also worth a pass over the other five source types'' titleField values (only subtitleField was audited by this cycle''s new guard) in case a similar stale/renamed-field mismatch exists there too. Cycle 23 (2026-08-20). Investigated both suggested leads and found no genuine bug. Lead (b): audited titleField/subtitleField for all 7 SOURCE_TYPES entries in modelBuilderRecipes.ts against prisma/schema.prisma -- utils/scripts/verifyModelBuilderSourceFieldGuard.ts already checks both fields for all 7 source types (broader scope than cycle 22''s note implied, not just Bot/Facet subtitle). Guard passes; independently hand-verified every titleField/subtitleField (Project.title/description, Character.name/class, Bot.name+BotType, Facet.title+taxonomy, Dream.title/dreamType, Reward.name/rewardType, Scenario.title/difficulty) against the schema and confirmed the list/index API routes use Prisma include (not select), so scalar fields pass through unmodified. Lead (a): read model-builder-run-history.vue, model-builder-progress-matrix.vue, and model-builder-batch-editor.vue in full against modelBuilderStore.ts and the runs/items server routes. Chased several candidate bugs to ground: run.items population on the runs-list endpoint (present via runInclude), selectedItemId staleness across run switches (component remounts on History toggle, so it can''t go stale), divergent new-run behavior between progress-matrix (resetRun() only) and run-history (resetRun() + goToStep(''source'')) (confirmed intentional -- selections are always fully reset when a source is re-picked), and whether isItemManualActionInFlight should also check autoBuildingItemId (no synchronous gap exists). batch-editor.vue''s itemStageSummary hardcodes /4 instead of BUILD_STAGES.length -- a style fragility, not a functional bug today, left alone per the no-nit-fixes rule. Ran all 53 non-selftest test:model-builder-* npm scripts as a baseline (fresh checkout needed npm ci with CYPRESS_INSTALL_BINARY=0) -- all pass, confirming no regression. git status --porcelain clean, no PR opened, no code changed. Suggested next lead for cycle 24: components/model-builder/model-builder-recipe-selector.vue is the least-guarded component (1 existing regression guard vs. 4-11 for its siblings) and hasn''t had the same cycle-by-cycle scrutiny -- worth a dedicated pass on store.selectRecipe()''s interaction with getOutputsForRecipe/getRecipesForSource in modelBuilderRecipes.ts, and whether switching recipes mid-selection correctly discards old output selections in every case, including recipes sharing output keys. Cycle 24 (2026-08-20). Investigated cycle 23''s lead: selectRecipe() itself is fine -- it always fully replaces state.selections with a freshly-built object from getOutputsForRecipe(key, state.sourceType), never merges, so a literal recipe-chip click always correctly discards old selections (moot for the shared-output-key case today since every OUTPUT_CATALOG key is unique to one recipe). The real staleness gap was elsewhere: resumeRun() and openRun() both have a branch that adopts a different run''s sourceType/recipeKey directly, bypassing selectSource()/selectRecipe() entirely, and neither touched state.selectedSource or state.selections -- leaving them stale (not merely absent) from whatever an earlier in-session selectSource() call had set. This was functional, not cosmetic: the header crumb nav''s Recipe step is gated only on Boolean(store.selectedSource), so it stayed clickable after opening/resuming a different run; clicking it rendered the new recipe''s outputs against the old selections object (every checkbox unchecked since output keys never overlap across recipes, selectedOutputCount still counting old leftover entries); and canStartRun only checks selectedSource && recipeKey && selectedOutputCount > 0, not whether those selection keys belong to the current recipe, so Start build run rendered enabled and silently no-opped (startRun()''s per-output lookup found nothing for the new recipe''s keys, itemsPayload ended up empty, no error shown). This is the same known fragility a prior cycle flagged in adaptRun''s own comment and partially fixed in model-builder-progress-matrix.vue (falls back to run.sourceSnapshot) -- the recipe-selector/crumb-nav consequence was missed. Fixed by clearing both state.selectedSource = null and state.selections = {} in all three adopt-a-different-run branches (resumeRun()''s else branch, both of openRun()''s cached/network-fetch branches); the already-active early-return branches are untouched since they don''t adopt a different run. Added utils/scripts/verifyModelBuilderStaleSelectionOnReopenGuard.ts + .test.ts asserting both resets stay present in all three branches, wired into package.json and contract-tests.yml. Verified: new guard selftest + contract pass, all 107 test:model-builder-* npm scripts pass (106 pre-existing + 1 new), vue-tsc --noEmit repo-wide clean, eslint/prettier clean on touched files (two pre-existing no-empty lint errors and one pre-existing prettier warning in modelBuilderStore.ts confirmed via git-stash to predate this change), git status --porcelain showed exactly the 5 intended files. kind_robots PR #1982: all CI checks green, squash-merged. No new lead surfaced yet for cycle 25 -- next cycle should do a fresh bug-hunt read of a not-recently-focused Model Builder surface (e.g. the five source types'' titleField values not yet audited by name, or the batch-editor/run-history pairing under concurrent multi-tab use). Re-armed to ready. Cycle 25 (2026-08-20). Re-audited lead (a): verifyModelBuilderSourceFieldGuard.ts''s findSourceFieldProblems() genuinely already checks both titleField and subtitleField for all 7 SOURCE_TYPES entries -- cycle 23''s claim holds, lead exhausted. Pursued lead (b): read model-builder-batch-editor.vue/model-builder-run-history.vue and the store''s batch/cancel/resume paths in depth. Found a real bug: autoBuildRun() (whole-run Auto-build all) and the four group batch operations (batchDraftField/batchSetField/batchApproveStage/batchAutoBuild) each tracked their own in-flight flag (state.autoBuilding vs state.batchingOutputKey) and never checked the other''s -- a user could click Auto-build all while a group batch action was still running for the same run (or the reverse), starting two independent sequential loops over the same run''s items that could interleave, with two different items ending up mid-draft/mid-generate/mid-commit at the same instant via two concurrent orchestration passes. Fixed by adding isRunOperationInFlight() to modelBuilderStore.ts (checked in autoBuildRun()''s entry guard), an explicit state.autoBuilding bail-out in all four batch functions, and disabling both UI surfaces'' buttons (model-builder-progress-matrix.vue''s Auto-build all, model-builder-batch-editor.vue''s six action buttons) on the other flag too. Added verifyModelBuilderAutoBuildBatchExclusionGuard.ts + .test.ts, wired into package.json and contract-tests.yml. Verified: new guard + all 109 test:model-builder-* npm scripts pass, the adjacent verifyModelBuilderBatchAnyInFlightGuard.ts unaffected, vue-tsc --noEmit repo-wide clean, eslint/prettier clean on touched files (pre-existing drift confirmed via git stash to predate this change), git status --porcelain scoped to exactly the 7 intended files. kind_robots PR #1985: all 34 CI checks green, squash-merged 48af5c0cd0e9bf6158d60fd5461713553c1f2d72. Next lead for cycle 26: a fresh end-to-end read of server/api/model-builder/items/[id]/commit.post.ts and server/api/model-builder/items/[id]/artifacts.post.ts -- these server routes haven''t had a dedicated cycle since roughly cycle 20, and this cycle''s investigation stayed mostly client-side. Re-armed to ready. Cycle 26 (2026-08-20). Fresh end-to-end read of server/api/model-builder/items/[id]/commit.post.ts and server/api/model-builder/items/[id]/artifacts.post.ts and their callees (stores/modelBuilderStore.ts, stores/helpers/modelBuilderFields.ts, server/api/model-builder/items/patch-policy.ts, server/api/model-builder/runs/index.ts, prisma/schema.prisma) -- no new functional bug found in either route''s own write path; both remain heavily fortified after 25 prior cycles. While cross-referencing which guards actually protect that call graph, found and fixed a real CI-wiring gap instead: package.json defined test:model-builder-approved-asset-guard, test:model-builder-cancelled-run-guard, and test:model-builder-item-patch-stage-guard (selftest + real-check, six scripts total) but contract-tests.yml never ran any of them -- all six pass locally and are not stale, they simply had zero CI enforcement. verifyModelBuilderItemPatchStageGuard.ts in particular covers prepareItemUpdate() in server/api/model-builder/runs/index.ts, the shared stage-editability gate commit.post.ts''s sibling PATCH routes rely on for the same review-gate-must-not-lie guarantee. Fixed by adding the six missing steps to contract-tests.yml, and added utils/scripts/verifyModelBuilderContractTestsCoverageGuard.ts + .test.ts, a meta-guard asserting every test:model-builder-* script in package.json has a matching npm run line in contract-tests.yml, so this exact class of drift can''t silently reoccur for any future guard; wired its own selftest + real-check into package.json and contract-tests.yml too. Verified: new guard''s selftest and real-check both pass (confirms zero missing after the fix), all 111 test:model-builder-* npm scripts pass individually, vue-tsc --noEmit repo-wide clean, eslint clean on the two new files, prettier clean on all four touched files (one --write pass needed on the newly-created test file only), git status --porcelain showed exactly the 4 intended files. kind_robots PR #1986: 32/33 CI checks green plus Build production image (an unrelated Docker publish job) still in flight when merged -- squash-merged 4ac2aed7de4e6041fa17ecddeb0ff6e087e5e008. Suggested next lead for cycle 27: in commit.post.ts, the final bookkeeping write (re-read stageStatuses, then prisma.modelBuildItem.update setting targetType/targetId/stageStatuses) sits outside the try/catch that resets idempotencyKey to null on failure. If that specific final write throws (DB blip etc.) after the primary side-effect (promote/update/create+link) already succeeded, the item is left permanently claimed (idempotencyKey stuck non-null) with targetType/targetId still null -- so every future "already committed" response reports target: null forever, orphaning the record the commit actually produced. A fix needs care not to reintroduce a duplicate-CREATE risk (resetting idempotencyKey outright would let a retry redo the primary write) -- likely shape: durably persist targetType/targetId in their own minimal write immediately after the primary write succeeds, separate from the slower stageStatuses re-read/merge/write, so a later failure in that second step can''t orphan the target record. Re-armed to ready.'
