    note: >
      Kaizen from t-029 (kind_robots PR #1114, 2026-07-28): a GENERATE_ASSETS render
      completion handler (generateItemAsset/pollAsyncArtJob/generateItemAssetAsync)
      held only its original item reference and unconditionally overwrote the stage
      status on completion, silently clobbering a concurrent upstream reopen's
      'stale' marker. Fixed ad hoc with finishGenerateAssets(item, next), which only
      writes if the stage is still 'in-progress'. This is now the third distinct
      "review/re-review gate silently bypassed" bug class found by manual read-through
      in modelBuilderStore.ts (after canApproveAssets and the batch-editor
      stage-approval-gate fixes) -- each one only caught because a cycle happened to
