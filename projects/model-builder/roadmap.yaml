    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Replace the narrow marketing-only contract with projects/model-builder/SPEC.md.
      Define SourceModel, Recipe, BuildRun, BuildItem, BuildStage, BuildArtifact,
      revision/provenance, usage, and final commit boundaries. Specify the four human
      gates: PITCH, FIELDS_AND_PROMPTS, GENERATE_ASSETS, and COMMIT. Define stale-stage
      invalidation, reruns, cancellation, retries, partial failure reporting, and resume.
      Cover existing-record upgrades plus new-model creation in DEFERRED and DRAFT_EARLY
      modes. The orchestrator tracks workflow only; it must not duplicate durable fields
      already owned by Character, Bot, Dream, Reward, Scenario, Facet, Project, ArtImage,
      ArtCollection, or ExpressionMedia.

