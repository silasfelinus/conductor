      verifyModelBuilderLinkCoverage.ts's approach from t-032/t-035) that walks every
      async completion/write site touching a stage-status field in
      modelBuilderStore.ts and flags any that don't gate on the stage's current status
      before writing -- so this bug class is caught mechanically instead of requiring
      a full manual store re-read every burst cycle. Front-end/test-only change; no
      schema change expected.

      Provenance note: this task idea originated in a concurrent session's PR
      (conductor PR #1360) that collided with this session's own t-029 close-out
      (conductor PR #1362, merged first) -- both sessions independently reviewed the
