    status: ready
    passes: 0
    stakes: reversible
    note: |-
      UI polish + upgrade for the model-builder front end now that the scaffold page is live at /model-builder. Steps: (1) generate final dashboard-tab art at public/images/dashboard-tabs/builder/model-builder.webp and tutorial art at public/images/tutorials/builder/model-builder.webp; (2) add a matching section for 'model-builder' under tutorialChannels.builder.sections in kind_robots/stores/helpers/tutorialCards.ts; (3) verify the PROJECT Dream liveUrl points at /model-builder (admin can run the Conductor 'Placements' button to backfill channelKey/tabKey/liveUrl); (4) evolve the placeholder scaffold page into the full interactive experience for this project.
