project: model-builder
kind: software

notes_from_silas: |
  Build a reusable front-end Model Builder for Kind Robots schema records. Marketing Deck
  is one recipe, not the root product. A user selects a source model — Project, Character,
  Bot, Facet, Dream, Reward, or Scenario — then selects a relevant recipe and individual
  outputs. Defaults should be helpful but editable: Project defaults to Marketing Deck;
  Character and Bot default to Character Deck; Reward defaults to Reward Deck; Facet,
  Dream, and Scenario default to Art Upgrade plus relationship-aware expansion options.

  The front end is a resumable, human-gated recipe runner. Each requested item advances
  through explicit stages: idea pitch; structured field proposals and art prompts; asset
  generation; and final create/update/link. Users can stop after any stage, edit results,
  rerun only stale stages, or finish later. Editing an upstream stage marks downstream
  work stale without deleting prior revisions.

  The builder must support both upgrading existing rows and creating new related rows.
  A Dream may request X Characters, Rewards, or Scenarios that fit its vibe; a Project may
  request a Manager Bot; a Scenario may request cast Characters or Rewards. New rows may
  be deferred until final commit or created early as private/inactive drafts after field
  approval when an ID is needed to attach assets. Final activation/promotion remains a
  separate gate.

  Character Deck options include portrait/avatar candidates, canonical avatar, icon,
  card and hero action shots, ExpressionMedia emotions/actions, optional reaction clips,
  and optional 3D-reference/model generation. Reward Deck adapts to rewardType: ITEM
  should offer a 3D-printable path; PET may optionally offer a figurine path; abstract
  rewards generally receive art upgrades instead. The existing Hunyuan3D Comfy endpoint
  is an input-image-to-model workflow and currently appears GLB-oriented. Do not label
  output as STL unless an audited conversion/export step actually produces STL.

  Reuse the existing Kind Robots generation specs, ArtImage/ArtCollection records,
  ExpressionMedia, model APIs, and Comfy endpoints. Components must use a Pinia store;
  they do not call API routes directly. Credentials stay server-side. Generation may use
  Silas-owned team tokens, with usage visible. No unattended publishing, deployment,
  printing, fabrication, account creation, ad spend, or destructive replacement.

