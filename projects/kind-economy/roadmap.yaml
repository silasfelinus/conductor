  - id: t-008
    milestone: m2
    title: "Write the immutable RevenueSplit ledger"
    status: done
    owner: worker
    updated: '2026-08-19T11:29:06Z'
    passes: 0
    stakes: reversible
    depends_on: [t-006, t-007]
    note: >
      One append-only row per paid spend: the spend it came from, gross cents, the costs
      taken off the top (payment-processing fee, model/GPU cost), and then the three net
      shares — platform, mission, creator — plus the resolved creator user id. Integer
      cents only, never floats. The three shares plus the off-the-top costs must sum
      EXACTLY to gross, with the rounding remainder assigned by a documented, tested rule
      rather than left to drift; a property test over many random amounts should assert
      the invariant holds. Rows are never edited or deleted — a correction is a new
      reversing row referencing the original, exactly like ManaTransaction's reversedById
      pattern.
      BASIS DECIDED (Silas, 2026-08-19): "Profit share should be net. Not gross." So the
      row records gross, then subtracts payment-processing fees and the actual model/GPU
      cost of the generation, and splits what remains three equal ways. Two things this
      makes non-optional: the ledger must capture real per-generation provider cost, not
      a guess (`ManaTransaction.costUsd` already exists and `chargeForGeneration` already
      threads `estCostUsd` — check whether that estimate is ever reconciled against the
      provider's actual billed cost, and if it is not, say so rather than quietly
      treating an estimate as truth); and a spend whose costs exceed its gross must
      produce a zero or negative-margin row that is handled explicitly, not a negative
      creator share. Keep the 1/3-1/3-1/3 ratio behind one named constant so a future
      change to the percentages is a one-line edit.
    claimed_by: claude-20260819T1027Z-kindecon-t008
    claimed_at: '2026-08-19T10:30:15Z'
