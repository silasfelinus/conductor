  - id: t-018
    milestone: m6
    title: "Establish the true current legal status of Save One Human"
    status: done
    owner: reviewer
    updated: '2026-08-19T00:00:00Z'
    passes: 1
    stakes: outward-facing
    gate_human: true
    approved_by_human: true
    note: >
      DONE 2026-08-19. Closed under CONTROL.md's human-gate clearance rule: Silas
      resolved this in-session ("Save one human is definitely disbanded... I finalized
      that around 2023-2024" and "that is moot, we are just going to go forward on all
      the things that can be done first"). Deliberately closed rather than parked,
      because audit_human_gates.py filters purely on status == needs-human and would
      otherwise resurface this in every session sweep forever — the exact stale-gate
      pattern CLAUDE.md documents.

      WHAT WAS ESTABLISHED, for the record:
      - DISSOLVED, finalized circa 2023-2024 (Silas's own account). Nothing to reinstate.
      - NEVER A 501(c)(3). Federal exemption was never applied for. The SaveOneHuman
        README's registration checklist marks only three of ten steps complete: name,
        articles of incorporation (form arts-pb.pdf, nonprofit PUBLIC BENEFIT
        corporation, $30, via northwestregisteredagent.com), and EIN. Never done: board,
        bylaws + conflict-of-interest policy, initial board actions, CT-1 with the CA AG,
        Statement of Information with the CA SOS, IRS Form 1023/1023-EZ, FTB Form 3500.
      - NO PUBLIC IRS RECORD, and there never was one. ProPublica Nonprofit Explorer,
        which mirrors the IRS Exempt Organizations Business Master File, returns
        total_results: 0 — the expected result for an entity that never received a
        determination letter, since the IRS only publishes organizations it recognized.
        The EIN is not published anywhere because the IRS does not publish EINs for
        non-exempt entities. The surviving public record is the CA SOS corporate filing.
      - The name is retired anyway. Silas, 2026-08-19: "when we restart, it will be a new
        name and new nonprofit. Kind robots is the future, save one human was the seed."
        So no future work depends on this entity's disposition at all.

      OPTIONAL, NON-BLOCKING, FOR SILAS WHENEVER HE FEELS LIKE IT — nothing waits on it
      and he does not believe there is an issue: a CA nonprofit corporation that never
      obtained FTB exemption accrues the $800 minimum franchise tax until a Certificate
      of Dissolution is filed, so 2020-2024 is a few years of theoretical exposure.
      California's remedy is FTB Form 3502, "Nonprofit Corporation Request for
      Pre-Dissolution Tax Abatement" (R&TC section 23156), which abates unpaid qualified
      taxes, interest, and penalties for a nonprofit certifying it never conducted
      business and holds no assets — and with zero revenue ever, Save One Human is the
      textbook case, so a competently handled dissolution very likely used it. If he ever
      wants certainty: check the dissolution paperwork for a 3502, or call the FTB
      nonprofit line at (916) 845-4171. Critically, a future entity would be a NEW
      corporation with a NEW EIN and inherits none of this either way.
      NOT LEGAL OR TAX ADVICE.

  - id: t-019
    milestone: m6
    title: "Assemble the fresh-incorporation checklist, when revenue justifies it"
    status: waiting
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-003, t-013]
    note: >
      DO NOT PICK THIS UP YET. Silas, 2026-08-19: "We don't need to think about 501.3 or
      whatever status until we have so much more under our belt and are legitimately
      taking in money as an entity from users." The trigger is revenue, not a date — the
      earlier January 1 target is withdrawn entirely, and this now depends_on t-013 (the
      first real dollar) precisely so it cannot become actionable before the platform is
      actually earning. If a session finds this pickable, that means live payments are
      working, which is the point.

      A NEW NAME AND A NEW ENTITY. Silas, 2026-08-19: "when we restart, it will be a new
      name and new nonprofit. Kind robots is the future, save one human was the seed."
      So this is not a Save One Human revival under any framing — that name is retired,
      the corporation is dissolved (t-018), and the future entity carries the Kind Robots
      identity. Name availability against the CA SOS register is its own early check.

      WHEN IT IS TIME: research and drafting only — no filing, no signing, no payment, no
      agent contact with any agency. Build the dated checklist: every form, its filing
      window, its fee, its dependencies, and which have long lead times (IRS
      determination letters historically run months). Draft what agents CAN draft (bylaws
      from a standard CA template, conflict-of-interest policy, initial board
      resolutions) into projects/kind-economy/entity/, clearly marked as unreviewed
      drafts requiring attorney review.

      LEARN FROM THE SEED RATHER THAN REPEATING IT. Incorporating and stopping is exactly
      what produced a public benefit corporation that was never exempt, never registered
      with the AG, and quietly accruing $800/year for doing nothing. Incorporation is the
      cheap, easy step; the exemption filings (IRS 1023/1023-EZ, FTB 3500) are the ones
      that actually matter. Treat those as the real milestones, the SOS filing as a
      prerequisite rather than an achievement, and do not file articles until the whole
      path is funded and scheduled. Note the sequencing trap too: FTB Form 3500A is the
      cheap route but requires an existing IRS determination letter, so federal exemption
      has to come first or the fuller Form 3500 is required.

