  - id: t-021
    milestone: m2
    title: "Self-attribution policy — can Silas earn creator share on his own assets"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-007]
    note: >
      FROM SILAS, 2026-08-19: "I'm kinda feeling like for assets I made, I would be able
      to earn creator share percent, but want that to feel honest, transparent, and
      fair." He is right on both counts and they pull against each other, which is why
      this is its own task rather than a footnote in t-007.
      The case FOR is strong and should not be apologised for: he made the assets, the
      creator share exists to reward exactly that, and carving himself out would mean the
      platform's most prolific creator is the only one who works for free — which would
      quietly distort every incentive the split is meant to create, and would make the
      numbers lie about what creator earnings actually look like at scale.
      The problem is that he is also the site admin, so on his own assets he receives the
      platform third AND the creator third — two thirds of net — and he sets the rules.
      Nothing about that is dishonest, but it is invisible, and invisible is what turns a
      fair arrangement into one that looks bad the first time someone graphs it.
      Design the policy so the answer is boring in public. At minimum: (1) admin-owned
      assets earn creator share on exactly the same terms as everyone else's, with no
      special multiplier and no exceptions; (2) every RevenueSplit row records the
      creator identity regardless of who it is, so admin earnings are never a separate
      untracked path; (3) the mission-share dashboard (t-010) and any public transparency
      surface break out admin-attributed creator earnings as their own visible line
      rather than folding them into "platform"; (4) write the plain sentence that
      explains it to a stranger who is inclined to assume the worst, and put it where a
      creator will actually see it — if that sentence cannot be written without wincing,
      the policy is wrong, not the sentence.
      Also decide the adjacent case: a creator running THEIR OWN object. Same principle
      should apply (you earn on your own work) but it opens a wash-trading shape once
      real payouts exist — someone could cycle paid mana through their own asset to
      convert platform credit into cash, losing only the platform and mission thirds. Cap
      it, flag it, or accept it knowingly, but do not discover it after t-015.

