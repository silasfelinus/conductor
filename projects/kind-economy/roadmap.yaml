  # --------------------------------------------------------------- m2 LEDGER
  - id: t-006
    milestone: m2
    title: "Make paid mana distinguishable from granted mana"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-001]
    note: >
      THE foundational blocker — nothing else in m2 is computable until this lands.
      Today User.mana is a single Int and maybeRefill() tops every user up to manaCap
      daily (CYCLE_REFILL) plus a 250-mana SIGNUP_BONUS, so purchased and granted mana
      are commingled and a spend cannot be attributed to either. Design and ship the
      minimum change that makes "this generation was paid for" a fact the server knows.
      Start with a written options comparison (paid/free sub-balances on User, versus
      FIFO ManaLot rows, versus a running paidManaPurchased/paidManaSpent counter pair
      with an explicit spend-order policy) before writing schema — the ManaTransaction
      ledger already records every grant and spend, so a backfill of historical paid
      balance may be derivable rather than lost. Must be additive/reversible: no
      migration that drops or rewrites existing mana balances, and existing behavior
      unchanged for users who never bought anything. Include a spend-order policy
      decision (free-first is friendlier to users; paid-first is friendlier to creators)
      and say plainly which one you chose and why.

  - id: t-007
    milestone: m2
    title: "Attribute each chargeable generation to the creator whose object seeded it"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-006]
    note: >
      applyMana()'s refId is free text and carries no creator identity, so "the creator
      of the web object that inspired the interaction" cannot be identified at spend
      time. First inventory which object types can seed a paid interaction and who owns
      each (Scenario, Bot, Character, Facet, Pitch, art/Media, packs — check what
      actually has a userId owner in prisma/schema.prisma and what the generation entry
      points actually receive). Then thread structured attribution — source type, source
      id, resolved creator user id — from the generation entry points through manaGate
      and chargeForGeneration onto the spend record. Define and document the fallback
      when there is no creator (a user generating from scratch, an admin/system object,
      a deleted account): the brief's assumption is that the creator share falls to the
      mission rather than to the platform, but confirm that in the design and state it
      in the note. Self-attribution (a creator running their own object) must be handled
      explicitly, not accidentally.

  - id: t-008
    milestone: m2
    title: "Write the immutable RevenueSplit ledger"
    status: waiting
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-006, t-007]
    note: >
      One append-only row per paid spend: the spend it came from, gross cents, the costs
      taken off the top (payment-processing fee, model/GPU cost), and then the three net
      shares — platform, mission, creator — plus the resolved creator user id. Integer
      cents only, never floats. The three shares plus the off-the-top costs must sum
      EXACTLY to gross, with the rounding remainder assigned by a documented, tested rule
      rather than left to drift; a property test over many random amounts should assert
      the invariant holds. Rows are never edited or deleted — a correction is a new
      reversing row referencing the original, exactly like ManaTransaction's reversedById
      pattern.
      BASIS DECIDED (Silas, 2026-08-19): "Profit share should be net. Not gross." So the
      row records gross, then subtracts payment-processing fees and the actual model/GPU
      cost of the generation, and splits what remains three equal ways. Two things this
      makes non-optional: the ledger must capture real per-generation provider cost, not
      a guess (`ManaTransaction.costUsd` already exists and `chargeForGeneration` already
      threads `estCostUsd` — check whether that estimate is ever reconciled against the
      provider's actual billed cost, and if it is not, say so rather than quietly
      treating an estimate as truth); and a spend whose costs exceed its gross must
      produce a zero or negative-margin row that is handled explicitly, not a negative
      creator share. Keep the 1/3-1/3-1/3 ratio behind one named constant so a future
      change to the percentages is a one-line edit.

