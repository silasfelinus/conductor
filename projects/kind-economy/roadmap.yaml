      the corporation is dissolved (t-018), and the future entity carries the Kind Robots
      identity. Name availability against the CA SOS register is its own early check.

      WHEN IT IS TIME: research and drafting only — no filing, no signing, no payment, no
      agent contact with any agency. Build the dated checklist: every form, its filing
      window, its fee, its dependencies, and which have long lead times (IRS
      determination letters historically run months). Draft what agents CAN draft (bylaws
      from a standard CA template, conflict-of-interest policy, initial board
      resolutions) into projects/kind-economy/entity/, clearly marked as unreviewed
      drafts requiring attorney review.

      LEARN FROM THE SEED RATHER THAN REPEATING IT. Incorporating and stopping is exactly
      what produced a public benefit corporation that was never exempt, never registered
      with the AG, and quietly accruing $800/year for doing nothing. Incorporation is the
      cheap, easy step; the exemption filings (IRS 1023/1023-EZ, FTB 3500) are the ones
      that actually matter. Treat those as the real milestones, the SOS filing as a
      prerequisite rather than an achievement, and do not file articles until the whole
      path is funded and scheduled. Note the sequencing trap too: FTB Form 3500A is the
      cheap route but requires an existing IRS determination letter, so federal exemption
      has to come first or the fuller Form 3500 is required.

