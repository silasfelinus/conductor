  - id: t-005
    milestone: m1
    title: "Decide how the mission third reaches AMF — structure first, mechanism second"
    status: done
    owner: worker
    updated: '2026-08-19T07:11:03Z'
    passes: 0
    stakes: reversible
    depends_on: [t-001]
    note: >
      RESCOPED 2026-08-19. Silas asked the right question: "can I take money and then
      give it directly to againstmalaria to be considered tax neutral? Is there a way we
      can automate that 1/3 so it is directly paid to our fundraiser to avoid any irs
      double dipping?" The answer determines the mechanism, so this task now covers the
      structure first and the plumbing second. Research and recommendation only — no
      account creation, no contact with AMF or any platform, no money moved.

      THE PROBLEM IS REAL, not hypothetical. Taking $100 and donating $33 does NOT net to
      zero by default. The $100 is gross receipts; the $33 is a separate charitable
      contribution whose deductibility depends entirely on entity type:
        - Sole proprietorship / single-member LLC: a charitable contribution is NOT a
          Schedule C business expense. It flows to the owner's Schedule A itemized
          deductions. If Silas takes the standard deduction — as most filers do — the
          deduction is worth NOTHING and he is taxed on the full amount. This is exactly
          the double-dip he is worried about and it is the current default.
        - Partnership / S-corp: same shape, passes through to the personal return.
        - C-corp: the corporation deducts directly, but capped at 10% of taxable income,
          with excess carried forward five years — and for tax years beginning after
          2025-12-31 there is ALSO a new 1% floor. Donating a third of revenue blows past
          10% immediately.

      THE STRUCTURAL FIX IS TO KEEP IT OUT OF GROSS RECEIPTS IN THE FIRST PLACE. Evaluate
      these three and recommend one primary and one fallback, writing findings to
      research/remittance-options.md:

      (A) MAKE THE MISSION THIRD THE CUSTOMER'S DONATION, NOT OURS — the strongest option
      and the direct answer to "automate that 1/3". Structure checkout so the customer's
      mission third goes to AMF as their own donation rather than passing through Kind
      Robots. It never becomes our revenue, so there is no deduction question at all; our
      gross receipts are two thirds, out of which the creator third is paid. The customer
      gets a deductible donation, which is a genuine selling point rather than fine print,
      and the claim "a third of what you pay buys nets" becomes literally true and
      independently verifiable instead of a promise.
      Mechanism to evaluate: a donation-platform API rather than Stripe Connect. Stripe
      Connect is almost certainly a dead end — AMF would have to be an onboarded Connect
      account — so rule it out explicitly and stop designing toward it. Every.org
      publishes a free no-platform-fee donation API with embeddable donate links,
      programmatic fundraiser creation, and partner webhooks for recording each donation,
      covering 1M+ 501(c)(3)s; the webhook is what would reconcile a donation back to the
      interaction that generated it. AMF is reachable: The Against Malaria Foundation
      (US) is a real 501(c)(3), EIN 20-3069841, registered in Kansas City MO, and
      donations from US donors are deductible. Verify it is actually listed and routable
      on whichever platform is chosen before recommending it.
      THE CATCH TO RESEARCH HONESTLY: soliciting or collecting donations on a charity's
      behalf is a commercial co-venture / charitable solicitation in many states and
      carries registration requirements. Routing through a platform that is itself the
      receiving charity (or its donor-advised fund) may handle most of that, but do not
      assume it — this is the part most likely to make option A more expensive than it
      looks, and it must be checked rather than waved through.

      (B) SECTION 162 BUSINESS EXPENSE INSTEAD OF SECTION 170 CHARITABLE CONTRIBUTION.
      If a payment to a charity carries a genuine return benefit commensurate with its
      value — sponsorship, advertising, logo placement — it can be an ordinary business
      expense with NO percentage ceiling, rather than a capped charitable contribution.
      This is a real distinction, not a loophole, but the code explicitly prohibits
      reclassifying what is really a gift as a business expense to dodge the limits, so it
      only works where the business return is actual. Fact-specific; flag for the CPA.

      (C) BASELINE, ALREADY WORKING: keep pointing donors out to againstmalaria.com/amibot
      for direct giving. Zero complication, zero reporting, and it is how the existing
      ~$840 was raised. Whatever else gets built, this stays.

      NOT LEGAL OR TAX ADVICE — general rules from public sources. The recommendation must
      say plainly that a CPA confirms the structure before anything is built on it, and
      must not present option A as settled merely because it is elegant.

      RESEARCH WRITTEN 2026-08-19 to projects/kind-economy/research/remittance-options.md.
      Recommendation: Option A (Every.org, not Stripe Connect — ruled out and explained
      why), specifically as a redirect to Every.org's own hosted AMF donate page rather
      than an embedded-in-checkout flow, because California's charitable-fundraising-
      platform law (effective 2024-06-12, Hawaii follows 2026-01-01) defines a covered
      platform broadly enough to plausibly reach an embedded donate-at-checkout flow —
      this is a real, more-concrete-than-expected finding beyond the seven commercial-
      co-venture states originally flagged, and CA/AMF are both confirmed live (AMF listed
      and routable at every.org/againstmalaria, EIN 20-3069841 matches Silas's records).
      Option C (existing againstmalaria.com/amibot link-out) stays live unconditionally as
      the zero-registration fallback. Option B (Section 162 sponsorship) is secondary, not
      primary. The redirect-vs-embedded registration question is NOT resolved here — it is
      the specific question for the CPA/attorney conversation, not a formality. No account
      created, no contact made with AMF/Every.org, no money moved, per task scope.

  # --------------------------------------------------------------- m2 LEDGER
    claimed_by: worker-2026-08-19T07:05:00Z-t005-amf-remittance
    claimed_at: '2026-08-19T07:08:01Z'
  - id: t-006
    milestone: m2
    title: "Split the paid token resource from free mana"
    status: done
    owner: worker
    updated: '2026-08-19T08:12:04Z'
    passes: 0
    stakes: reversible
    depends_on: [t-001]
    note: >
      THE foundational blocker — nothing else in m2 is computable until this lands.

      THE MODEL (Silas, 2026-08-19) is TWO DISTINCT RESOURCES, and this task exists
      because the code has only one:
        - MANA — given away freely. Grants limited access at lower queue priority.
          Never purchased, never withdrawable, and it never becomes tokens.
        - TOKENS — the paid resource actually used to generate interactions. "We only
          generate tokens when actual tokens are spent." Created only when real money
          is paid.
      Creator share is credited in TOKENS, from token spends only.

      WHAT THE CODE ACTUALLY HAS TODAY: one currency, `User.mana`, a single Int, fed by
      both paths. A Stripe top-up lands via `applyMana({ reason: 'PURCHASE' })`
      (server/api/stripe/webhook.post.ts handleManaTopup) and the free daily refill lands
      via `applyMana({ reason: 'CYCLE_REFILL' })` (server/utils/refill.ts) — same field,
      same balance, indistinguishable at spend time. There is NO token model in
      prisma/schema.prisma at all; the only `token` fields are auth/JWT unrelated to
      currency. So the paid resource does not exist as a separate thing yet, and today's
      "mana" is really the paid resource and the free resource wearing one name.

      THE JOB: introduce the split the model already assumes. Free mana stays mana. The
      purchased resource becomes tokens (or whatever it ends up called — naming is part
      of this task, since "mana" currently means both and renaming mid-flight is worse
      than deciding now). Then add the third state the payout model needs:
        - EARNED tokens — creator share credited from someone else's paid spend. The only
          balance that can ever be withdrawn as cash, and a real liability from the moment
          it is credited rather than when it is paid. Purchased tokens are deliberately
          NOT withdrawable: converting those back to cash is a refund, a Stripe operation
          with its own rules, not a creator withdrawal.

      WHY THE SPLIT IS THE SECURITY BOUNDARY, not just tidiness: in the two-resource
      model, free mana structurally cannot produce withdrawable value — there is no path
      from a giveaway to cash, so the abuse case is closed by the data model rather than
      by a runtime check somebody could forget. In today's single-balance code that
      guarantee does not exist: free refills and purchases sit in the same Int, so any
      creator-credit rule written against `User.mana` would credit giveaway balance
      exactly as readily as purchased balance. Build the split so the invariant is
      enforced by construction and cannot be reintroduced by a later caller.

      CONSTRAINTS: additive and reversible. No migration that drops or rewrites existing
      balances, and no behavior change for users who never bought anything. The
      ManaTransaction ledger already records every grant and spend with a `reason`, so
      historical paid balance may be derivable rather than lost — check before assuming a
      backfill is impossible. Also decide the lower-priority-queue behavior that free mana
      is supposed to buy ("ideally", per Silas), or explicitly defer it as its own task.
    claimed_by: worker-2026-08-19T07:20:00Z-t006-token-split
    claimed_at: '2026-08-19T07:18:46Z'
    implementation_pr: 'silasfelinus/kind_robots#1956'

