project: kind-economy
kind: software
goal: >
  Money actually moves correctly through Kind Robots: real Stripe payments land, every
  paid spend writes an auditable three-way split (platform / anti-malaria mission /
  creator), creators can see and eventually receive their share, the mission share
  reaches the Against Malaria fundraiser on a schedule, and the entity question —
  restart Save One Human or donate as a for-profit — is answered deliberately rather
  than by default.

notes_from_silas: >
  CREATED 2026-08-19 from Silas's session direction, transcribed from his own framing:
  "I started a non profit during pandemic, after searching for what was the most cost
  effective way to save one human life... I filed, and then completely failed to raise
  money... Kind Robots is its spiritual successor, intending to use AI to find and
  generate revenue for social good, starting with our fundraiser against malaria...
  I've raised $840 or so, virtually entirely from my own donations, as well as asking
  family members to donate in lieu of bday gifts. While my mission has remained focused,
  I have yet to rekindle the non-profit, or find out how to leverage kind robots so it
  generates funds. After years of development, I'm just now at the point of having a
  relatively big free site that can take in money, and a plan that involves a revenue
  share so people who create things with my tools using paid tokens will have their
  money split equally between site admin, the creator of the web objects that inspired
  the interaction, and our malaria fundraiser. I say this exists, but truly, we have not
  yet tested stripe, nor plugged in a consistent system where creators can develop front
  ends that will get them paid, or the backend automation to handle dispersal of payments
  (ideally in a way that sends malaria donations directly to the fundraiser and minimizes
  reporting and tax complications). This is a sign if any and vitally important tentpole
  to our site and my life trajectory... I will need a lot of assistance pulling this
  together, including filing paperwork to restart the non-profit, which I pegged for
  happening Jan 1, ish, to minimize extra paperwork and filing needs while we are still
  building infrastructure."

  STANDING RULES FOR THIS PROJECT, stricter than the repo default:
  - No live Stripe keys, no live products/prices, no real charge, and no payout of any
    kind without Silas's explicit per-action approval. Test mode is not implicitly
    approved either — ask.
  - No agent files, signs, submits, or pays for anything with a government agency, and
    no agent creates a Stripe, bank, or payment-processor account. Agents research,
    draft, and checklist; Silas files.
  - Nothing in this project is legal or tax advice. Where a task's output would function
    as advice, it must say so and name the professional who should confirm it.
  - The ledger is append-only. No task may add a code path that edits or deletes a
    settled split row.

  ENTITY DIRECTION (Silas, 2026-08-19), so no future session relitigates it:
  - Save One Human is dissolved and its name is retired. "When we restart, it will be a
    new name and new nonprofit. Kind robots is the future, save one human was the seed."
    Any m6 work is a fresh incorporation under the Kind Robots identity — never a
    revival, and never framed as one.
  - Nonprofit status is explicitly NOT a current concern: "We don't need to think about
    501.3 or whatever status until we have so much more under our belt and are
    legitimately taking in money as an entity from users." m6 is weighted 5, its tasks
    are `waiting` behind t-013 (the first real dollar), and the trigger is revenue, not
    a date. Do not surface it as pending work, do not propose reviving it early, and do
    not re-open t-018 — it is closed with its findings recorded.
  - The near-term shape is therefore settled by default: the platform operates
    for-profit and the mission share is donated directly to the Against Malaria
    Foundation. t-003 remains open only to confirm that formally with a CPA.

