    note: >
      DONE 2026-08-19 in the session that created this project. DESIGN-BRIEF.md audits
      kind_robots, conductor, and SaveOneHuman and records five verified gaps: (1) paid
      and free mana are indistinguishable because User.mana is one Int and maybeRefill()
      grants free mana into the same balance, so "paid usage" is not computable;
      (2) applyMana()'s refId is free text and carries no creator attribution;
      (3) no Stripe Connect / transfer_data / application_fee anywhere in the repo, so
      no payout mechanism exists; (4) the mission share has no route to the fundraiser
      (giving-page.vue links users out to againstmalaria.com/amibot); (5) the three-way
      split is already promised in live site copy (CREATOR_EARNINGS_MESSAGE on six
      tutorial channels) ahead of the mechanism. Also established the key strategic
      finding that reviving the nonprofit is NOT a prerequisite for the revenue share.

