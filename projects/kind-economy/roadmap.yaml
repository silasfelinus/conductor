  # -------------------------------------------- m5 FUNDRAISING & OUTREACH
  - id: t-022
    milestone: m5
    title: "Design the butterfly-themed public fundraising event"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    note: >
      FROM SILAS, 2026-08-19: "hosting a public event for fundraising, themed on
      butterflies." AMI is a horde of rainbow butterflies and malaria nets are the thing
      being funded, so the theme is not decoration — it is the pitch, and it should carry
      the actual argument (a net costs a few dollars; a life costs about $5,000; here is
      what your twenty bucks does).
      Planning and design only — no venue booked, no deposit paid, no date announced, no
      vendor contacted. Produce a written event plan: format and scale options (gallery
      night of AMI-generated art, community make-a-butterfly workshop, talk plus
      donation drive), venue candidates, rough budget, what the site's own generated art
      contributes, and what would have to be true for it to break even rather than cost
      more than it raises — a fundraiser that loses money is a donation with extra steps.
      THE CRITICAL DESIGN CONSTRAINT, and it is the same one that keeps the website
      simple: DO NOT TAKE CUSTODY OF DONATIONS. Point attendees at
      againstmalaria.com/amibot and let them give directly — QR codes on the wall, a
      laptop at the door. The moment Kind Robots collects money at an event and forwards
      it, it is soliciting charitable contributions on another organization's behalf, and
      California has registration rules for that which are wildly out of proportion to a
      small community event. Direct-to-AMF sidesteps the entire category. If Silas wants
      to sell something at the event (prints, merch), that is ordinary commerce and goes
      through the normal storefront — keep the two flows visibly separate.
      Escalate to needs-human before anything is booked, paid for, or publicly announced.

  - id: t-023
    milestone: m5
    title: "Design 'The Sift' — the two-bowl AI/non-AI donation experiment"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    note: >
      FROM SILAS, 2026-08-19: "doing an online sift, inspired by panhandlers with
      multiple bowls asking for who gives more money: Christian, Atheists, Muslims,
      etc... but for people who support ai and those who don't, with all the content for
      the non-ai side generated without ai."
      This is the best fundraising idea in the batch and also the easiest to get wrong,
      so design it carefully before building anything. What makes the panhandler version
      work is that it is funny, it costs the giver nothing extra, and both bowls buy the
      same sandwich. Keep all three properties.
      NON-NEGOTIABLES for the design: (1) BOTH BOWLS FUND MALARIA NETS. Identical
      destination, identical impact. The vote is expressive; the money is not
      conditional. If one side's donations did something different, it stops being a
      poll and becomes a hostage situation. (2) THE NON-AI SIDE MUST BE GENUINELY GOOD.
      Silas's own instinct here is the whole ballgame — the anti-AI case gets made in
      hand-written words and hand-made art, with no generated content anywhere near it,
      and it must be argued by someone who actually believes it rather than
      steelmanned-then-undercut. If the non-AI bowl is visibly the weaker exhibit, the
      whole thing reads as a rigged game and deserves to. Budget real effort (or a
      commission) for that side, and label its provenance as clearly as the AI side's.
      (3) NO MOCKERY IN EITHER DIRECTION, including in the results display. The running
      total is the joke; the people are not. (4) The AI side must be labelled AI, per
      t-024's disclosure rules.
      Deliverable is a design doc: the framing copy, how the two sides are presented,
      how the tally is displayed, how donations are attributed to a side when the money
      goes directly to AMF (this is the genuinely hard mechanical problem — direct-to-AMF
      giving means we may not be able to see who gave what, so the tally may need to be
      self-reported, or use two distinct AMF fundraiser links if AMF supports that;
      resolve it in the design, do not hand-wave it), and an honest section on how this
      could backfire.
      Outward-facing: escalate to needs-human before it goes live. It is a public
      statement about a live culture-war topic made in the name of a charity fundraiser,
      and that is Silas's call to make with his eyes open, not an agent's.

