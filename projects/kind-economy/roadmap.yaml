  # --------------------------------------------------------------- m2 LEDGER
  - id: t-006
    milestone: m2
    title: "Make paid mana distinguishable from granted mana"
    status: ready
    owner: null
    updated: '2026-08-19T00:00:00Z'
    passes: 0
    stakes: reversible
    depends_on: [t-001]
    note: >
      THE foundational blocker — nothing else in m2 is computable until this lands.
      Today User.mana is a single Int and maybeRefill() tops every user up to manaCap
      daily (CYCLE_REFILL) plus a 250-mana SIGNUP_BONUS, so purchased and granted mana
      are commingled and a spend cannot be attributed to either. Design and ship the
      minimum change that makes "this generation was paid for" a fact the server knows.
      Start with a written options comparison (paid/free sub-balances on User, versus
      FIFO ManaLot rows, versus a running paidManaPurchased/paidManaSpent counter pair
      with an explicit spend-order policy) before writing schema — the ManaTransaction
      ledger already records every grant and spend, so a backfill of historical paid
      balance may be derivable rather than lost. Must be additive/reversible: no
      migration that drops or rewrites existing mana balances, and existing behavior
      unchanged for users who never bought anything. Include a spend-order policy
      decision (free-first is friendlier to users; paid-first is friendlier to creators)
      and say plainly which one you chose and why.

