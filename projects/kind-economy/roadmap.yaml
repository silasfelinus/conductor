      obtained FTB exemption accrues the $800 minimum franchise tax until a Certificate
      of Dissolution is filed, so 2020-2024 is a few years of theoretical exposure.
      California's remedy is FTB Form 3502, "Nonprofit Corporation Request for
      Pre-Dissolution Tax Abatement" (R&TC section 23156), which abates unpaid qualified
