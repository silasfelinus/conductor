      AUDIT ALREADY DONE (2026-08-19). Good news first: coverage is much better than it
      looks from a naive grep. 25 generation endpoints are metered, via manaGate directly
      or through one of its wrappers — authAndGate (comfyGate.ts), authAndTextGate and
      withTextMana (textGate.ts), withArtMana (generationMana.ts), chargeForGeneration
