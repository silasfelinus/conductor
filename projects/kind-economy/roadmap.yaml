        which mirrors the IRS Exempt Organizations Business Master File, returns
        total_results: 0 — the expected result for an entity that never received a
        determination letter, since the IRS only publishes organizations it recognized.
        The EIN is not published anywhere because the IRS does not publish EINs for
        non-exempt entities. The surviving public record is the CA SOS corporate filing.
