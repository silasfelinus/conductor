    stakes: reversible
    note: >
      FROM SILAS, 2026-08-19: "any time a user (non admin and non-family) use our llm
      services or comfy, it should cost mana or tokens, and they should be prompted if
      it's a token purchase, obviously. If they are using the site with their own api
