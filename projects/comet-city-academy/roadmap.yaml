      ## Editorial diagnosis (2026-10-28 PT)
      This is a **focused implementing task** under [Prom of Doom master roadmap #4181](https://github.com/silasfelinus/kind_robots/issues/4181), not a replacement for the 30-day project or a claim that existing prose is absent.

      ### Verified code findings
      - `utils/cometAcademy/rules.ts`: `startingContacts()` returns **two classmates** at the start, `incidentsFor()` always produces **two** calls from the 12-case `NIGHT_DECK`, and `assignTeam()` / `resolveDispatch()` use only the selectable `StudentId` ally roster. The protagonist has no explicit field slot.
      - `pages/play/comet-city-academy.vue`: the 30-day mode (`flowVersion === 3`) shows **TRAINING SIMULATION / RUN TRAINING SIMULATIONS** in its real-night dispatch branches; the rich `realNightCase()` briefing is gated behind `flowVersion === 2 && day > 2`. The debrief similarly distinguishes only version 2 as 'Night debrief'. Correct this first, with regression tests.
      - `utils/cometAcademy/nightCases.ts` **does have** distinct authored briefings and honors/pass/partial/failed consequences for 12 cases; `utils/cometAcademy/missionTeams.ts` has character-specific reactions and special combination routes. Preserve them. At present, the bonus route is advertised before assignment and most cases ultimately resolve as grade prose plus a modifier, so secrets, tactics and callbacks are underpowered.
      - Canon [DESIGN-BRIEF.md](https://github.com/silasfelinus/conductor/blob/main/projects/comet-city-academy/DESIGN-BRIEF.md) calls for **36 distinct patrol/case families**. Don't report 36 as shipped.

      ### Required gameplay spine: player on patrol, not omniscient dispatcher
      1. **The protagonist is always a playable night asset.** Days 1-3: no followers initially, one mandatory personal patrol case in a chosen academy/town district, and meaningful first-person options. The first friend is earned via a daytime school dilemma or a patrol rescue; do not grant two roster slots at New Game. Save-migrate existing two-contact runs without loss. If night choice is refused, produce an authored non-dead-end consequence.
      2. Separate **day school** (classes, friendships, labs, discipline, rivalries, recruitment and rumor discovery) from **night hero work**. Every evening is explicitly after the daytime event, with the same place names and canonical map IDs.
      3. Progress in a **controlled authored ramp**, with active choice budget below the displayed opportunity count:
         - Days 1-3: 1 local patrol and 0 independent team assignments.
         - Days 4-7: 1-2 calls, generally player-led; optional friend teams only when recruited.
         - Days 8-14: 2-3 potential calls, up to 2 assignments.
         - Days 15-21: 3-4 potential calls, up to 3 assignments.
         - Days 22-28: 4-5 potential calls, up to 3 staffed assignments; some must be abandoned or deferred.
