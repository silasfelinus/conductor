      # Prom of Doom (Capes & Tassels series) | Master Completion Roadmap

      **ACTIVE / HIGH PRIORITY / AGENT-OWNED.** This is a long-lived umbrella issue, not a one-PR completion ticket. **The approved visible game name is Prom of Doom**; **Capes & Tassels** is the smaller series/lineage label, not the main title; **Comet City** names the setting. **Keep** Conductor slug `comet-city-academy`, Kind Robots Play deep link `/play/comet-city-academy`, and existing saves stable across the rebrand.

      ## Single canonical specification (updated October 25, 2026)

      **[Read the detailed Conductor design brief](https://github.com/silasfelinus/conductor/blob/main/projects/comet-city-academy/DESIGN-BRIEF.md)** and **[task-by-task roadmap](https://github.com/silasfelinus/conductor/blob/main/projects/comet-city-academy/roadmap.yaml)**. These override the earlier **21-day / three-seven-day-act / simulation-only** proposal. Source change: [Conductor #6644](https://github.com/silasfelinus/conductor/pull/6644).

      **Premise:** Play the **last thirty days before superhero graduation**. Choose one of six power sets, learn to be heroic, villainous or deliberately rogue, build an adult romantic/sidekick circle, and face a randomized mastermind trying to destroy Comet City by prom. Each meaningful action has a cost. First-time players start as student/sidekick; replaying a character may unlock an earned hero or villain persona after discovering that form in a prior campaign. Final design and separate release remain gated only after exhaustive agent work.

      **Day:** Explore campus and city using **two views of one geographic graph**: campus is mostly academy with **northwest town blocks**; town shows almost all Comet City with **southeast campus landmarks**. Day locations contain classes, errands, story cards, affinity/romance, follower recruitment, investigation and infirmary opportunities.

      **Night:** Command **1–3 available followers per mission** through training, then real patrol or clandestine work, with **hero, villain, rogue and shared** contract categories. Missed/failed missions have distinct consequences. Injured followers are unavailable until the following day's recovery unless the player spends a meaningful day action at the infirmary. The player also faces a direct encounter. Heroism and villainy come with hard choices, not merely color-coded quest rewards.

      **Randomization/pace:** 30 authored daily anchors, at least 60 unique location/event cards gated by weekly story band, 36 distinct patrol/case families, 24 geographically coherent sites, **eight** run-specific villains with different plots and clues, 12 substantive full-game endings. Narrative difficulty and stakes grow across weeks 1–4, with prom/graduation climax on days 29–30. No infinite padding and no generic swapped nouns.

