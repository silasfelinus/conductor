      ### Required gameplay spine: player on patrol, not omniscient dispatcher
      1. **The protagonist is always a playable night asset.** Days 1-3: no followers initially, one mandatory personal patrol case in a chosen academy/town district, and meaningful first-person options. The first friend is earned via a daytime school dilemma or a patrol rescue; do not grant two roster slots at New Game. Save-migrate existing two-contact runs without loss. If night choice is refused, produce an authored non-dead-end consequence.
      2. Separate **day school** (classes, friendships, labs, discipline, rivalries, recruitment and rumor discovery) from **night hero work**. Every evening is explicitly after the daytime event, with the same place names and canonical map IDs.
      3. Progress in a **controlled authored ramp**, with active choice budget below the displayed opportunity count:
         - Days 1-3: 1 local patrol and 0 independent team assignments.
         - Days 4-7: 1-2 calls, generally player-led; optional friend teams only when recruited.
         - Days 8-14: 2-3 potential calls, up to 2 assignments.
         - Days 15-21: 3-4 potential calls, up to 3 assignments.
         - Days 22-28: 4-5 potential calls, up to 3 staffed assignments; some must be abandoned or deferred.
         - Days 29-30: bespoke city emergency and prom finale, not repetitive dispatch board grinding.
         Roster, injury, villain pressure and school consequences

