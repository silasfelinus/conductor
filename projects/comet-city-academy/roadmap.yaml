  Dispatch-style training simulations assigning classmates and staff as volunteer heroes,
  draw school and Comet City location encounter cards, develop daily NPC interactions, reach
  prom without the world being blown up. Master issue:
  https://github.com/silasfelinus/kind_robots/issues/4181. New-project creative scope
  confirmation is soft and never blocks reversible building; DESIGN-BRIEF.md controls
  details.
