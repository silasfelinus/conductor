# New original playbook, approved as high priority 2026-10-25 PT.
project: comet-city-academy
kind: software
autonomous: true
goal: >-
  Deliver Prom of Doom, a Capes & Tassels series game: a thirty-day, day/night, single-screen
  superhero graduation RPG. Two geographically consistent campus/town maps,
  weekly gated authored and seeded encounters, hero/villain/rogue patrol cases,
  1-3-follower dispatch, romances and sidekick bonds including at least two
  fully consensual throuple routes, injuries and infirmary recovery, one of
  eight city-destruction villains per run, powers with unique mission solutions,
  Hero, Followers, Scrapbook and Settings pages, real save/load/card backs and
  twelve consequential endings. High-priority art-first Play experience with
  verified branching art, adversarial seeded tests and final human design review.
notes_from_silas: |
  2026-10-25 PT: Original prompt called for a hero/villain academy, powers,
  dispatch simulation, classmates, Comet City cards and a graduation threat.
  Latest same-day revision SUPERSEDES the old 21-day/three-week description:
  display title "Prom of Doom" (Capes & Tassels is the smaller series mark),
  ALL action takes place over the last thirty days before graduation, with
  campus/town day exploration and night patrol or villain/rogue dispatch.
  Campus map contains northwest town edge; town map contains southeast campus
  landmarks, both rendered from one geographically consistent site graph.
  Romanceable adult NPCs span gender/body types; partners can be field sidekicks,
  romances, both, with at least two negotiated throuple routes in full game.
  Recruitable followers receive large multi-emotion splash/portrait and injured
  art. A wounded follower misses the following day unless a daytime infirmary
  action heals them early. Hero, evil, rogue/shared missions are all playable.
  Run-selected antagonist attempts to destroy the city, with relevant plot
  variants. Full-screen image-led console has Main, both Maps, Dispatch,
  Followers, Hero, Scrapbook (villains/cinematics/ending variants/affinity),
  Settings (save/load, card backs), Finale and relationship views. Distinct
  scripted and random weekly events grow harder and deeper. Stable Conductor
  slug is comet-city-academy, stable existing Play URL /play/comet-city-academy.
  The seven-day original demo in kind_robots PR #4183 is a valid starting
  slice only, NOT the final calendar or canonical game shape. Preserve saved
  games through explicit versioning or First Week compatibility.
  Definitive content bible: DESIGN-BRIEF.md. Master issue:
  https://github.com/silasfelinus/kind_robots/issues/4181
  2026-10-26 PT: NEW identity evolution scope. Every one of the 48
  signature combinations defines a person with student/sidekick, hero,
  villain forms and differing powers and original questlines when playable
  as protagonist or encountered as antagonist. Bond/partner/consenting
  romance quests can open the shift; none is an obligatory romance gate.
  Every full run has a foreshadowed NPC heel turn, plus multiple active
  villain accomplices. Canon: IDENTITY-SYSTEM.md. New t-016/017/018.
  2026-10-26 PT (later): Silas replaced Form x Affinity with Origin
  (accident/mutant/tech/magic/alien/psychic) x Affinity (fire/air/earth/
  water/discipline/genius/birthright/social): 48 new people, each student/
  hero/villain persona with its own focus and six stats; old saves migrate.
  See IDENTITY-SYSTEM.md "Origin x Affinity".
