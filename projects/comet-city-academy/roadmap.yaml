      ## Character-direction editorial audit (2026-10-28 PT)
      Companion to [master roadmap #4181](https://github.com/silasfelinus/kind_robots/issues/4181). **Do not delete or arbitrarily rename the existing 48 real people**, their hero/villain forms, origin/affinity axes, story memory or existing cross-project guests.

      ### Verified starting point
      `utils/cometAcademy/identityArcs.json` defines **48 identities, exactly 6 origins × 8 affinities**, with original civilian biographies and student/hero/villain names. `identityArcs.ts` preserves story hooks. These are meaningful writing assets; preserve them. But the data lacks a formal morphology, silhouette, visual-comedy, metamorphosis or memorable signature-prop contract. Many powers are described as human-shaped people in suits; some already have *excellent* seeds (Corvin's feathers, Hattie's mineral plates, Asha's four arms, Kesh's silicon anatomy, Quillon's cloud body, Pellanor's drone/hive). The key is to make their *visual character* as distinct as their biographies.

      ### Approved flavor / cast anchors
      - **Dr. Frog:** unforgettable amphibian scientist with a genuinely amphibian body, bizarre chemistry, a plausible agenda, and rescue/heel/mentorship alternatives. Needs to matter in school by day and in a night mission.
      - **Granny Mayhem:** visibly older, formidable, impractical superhero gear, funny but neither incompetent nor an elderly stereotype. A powerful intergenerational civilian contact/ally/foil with her own moral code and a repeatable story arc.
      - **Zuzu Koala Assassin:** *already canon* as a dimensional guest in `guestIdentities.ts`. Preserve his other-world origin, oath, autonomy and possible Shogun Null turn. Make his silhouette, movement, temperament and choices conspicuous without treating him as a 49th native origin/affinity slot.
      - These exemplify the intended **tonal audacity**: immediate recognition from across a screen, strange bodies or equipment, distinctive motives and something surprising to say. The target is not 48 humans with different capes, nor random anatomy disconnected from the story.

      ### Map the actual identity axes before redesign
      Rows = origin; columns = affinity: **Fire, Air, Earth, Water, Discipline, Genius, Birthright, Social.** Names below refer to current *hero* identities; each cell offers an optional silhouette/art-direction pivot compatible with the existing bio, subject to consistent character design and editorial review.

      | Origin | Fire | Air | Earth | Water | Discipline | Genius | Birthright | Social |
