      This is a **focused implementing task** under [Prom of Doom master roadmap #4181](https://github.com/silasfelinus/kind_robots/issues/4181), not a replacement for the 30-day project or a claim that existing prose is absent.

      ### Verified code findings
      - `utils/cometAcademy/rules.ts`: `startingContacts()` returns **two classmates** at the start, `incidentsFor()` always produces **two** calls from the 12-case `NIGHT_DECK`, and `assignTeam()` / `resolveDispatch()` use only the selectable `StudentId` ally roster. The protagonist has no explicit field slot.
