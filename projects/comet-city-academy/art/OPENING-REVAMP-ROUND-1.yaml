  prompt_prose: 'Wide cinematic street-level view of a huge neon Comet City at violet dusk, an elevated monorail
    curving around downtown towers and hologram billboards. Foreground on a gritty apartment rooftop: four adult
    superhero academy friends, including a broad-shouldered Black woman in a white rescue jacket with orange energy
    gauntlets leaping over an air-conditioning unit, a plus-size brown-skinned woman in a teal jacket aiming a translucent
    shield toward the camera, a slim adult in red-and-black acrobatic gear tumbling across a clothesline, and a
    pale lavender-skinned dimensional exchange student with a glowing indigo cape balancing at the roof edge. A
    swarm of tiny silver nanomachines is eating a red streetcar far below, civilians run into a bakery for shelter,
    and a crumpled glitter-covered prom invitation whips through the foreground. Big exciting heroic poses and vivid
    facial expressions; clear downtown spatial depth; three-quarter low camera, city skyline framing action. Keep
    the LEFT THIRD DARK and relatively uncluttered for game title typography. The academy is distant and small,
    not the visual subject. No church, cathedral, cloister, castle or gothic towers. No writing or logos.'
