  updated: 2026-07-07 08:30:00+00:00
  note: "SUPERSEDES the original \"register Bots\" task (Silas, 2026-07-05): Bots are character-driven\
    \ narrators and specialized GPTs \u2014 contenders get their own model. In silasfelinus/kind_robots,\
    \ one additive migration:\n\n  model Contender:\n    id, createdAt, updatedAt\n    slug          \
    \  String  @unique @db.VarChar(255)\n    name            String  @db.VarChar(255)\n    kind      \
    \      ContenderKind  (AGENT_STACK | LLM_MODEL | ART_GENERATOR)\n    provider        String? @db.VarChar(128)\
    \   // anthropic | openai | local...\n    model           String? @db.VarChar(255)   // claude-fable-5,\
    \ gpt-5...\n    generator       String? @db.VarChar(128)   // claude-api | openai-api |\n        \
    \                                       // art-sd | comfy-flux | ...\n    defaultSettings Json?\n\
    \    description     String? @db.Text\n    avatarImageId   Int?    (FK \u2192 ArtImage, nullable)\n\
    \    isActive        Boolean @default(true)\n\n  ChallengeSubmission additions:\n    contenderId \
    \     Int?  (FK \u2192 Contender; required in app logic, nullable\n                            in\
    \ DB only so the migration is additive)\n    variantKey       String @default(\"default\") @db.VarChar(128)\n\
    \      \u2014 distinguishes multiple entries by one contender in one challenge\n        (\"terse\"\
    , \"detailed\", \"random-3\", \"temp-0.2\")\n    promptUsed       String? @db.Text   // exact final\
    \ prompt sent\n    settings         Json?              // overrides of defaultSettings\n    randomSelections\
    \ Json?              // randomStore key\u2192value map used\n    @@unique([challengeId, contenderId,\
    \ variantKey])\n\n  Deprecate botId: make it nullable, keep the column (never DROP data),\n  stop\
    \ writing it. Remove or keep the old (challengeId, botId) unique \u2014\n  if removed, verify the\
    \ migration is only DROP INDEX, not DROP COLUMN.\n\nNo CHALLENGE_AGENT bots were ever registered and\
    \ no API exists yet, so this pivot has zero data to migrate. NOT human-gated (Silas, 2026-07-05):\
    \ this is additive-only, so per the AGENTS.md migration rule the Worker opens the PR and the Reviewer\
    \ audits migration.sql line-by-line and merges it \u2014 Silas is not a gate. If the generated migration\
    \ turns out to contain any destructive statement, it reverts to hard needs-human.\nREVIEWER (pass\
    \ 1/3, 2026-07-06): kind_robots PR #107 closed without merge. migration.sql itself is a clean additive\
    \ migration (audited line-by-line), but the PR never applied the matching schema.prisma patch \u2014\
    \ it only left docs/challenge-center-t-002-schema-patch.md describing what schema.prisma needs. That\
    \ drift is why the PR's Vercel deployment check failed. Next attempt must include the actual schema.prisma\
    \ edit (Contender model, ContenderKind enum, ArtImage.Contenders relation, ChallengeSubmission field/relation\
    \ additions \u2014 see the doc above for the exact patch) in the same PR, then `npx prisma validate\
    \ && npx prisma generate` before opening for review again. Also: no `claim: challenge-center/t-002`\
    \ commit was found on conductor main before this PR was opened \u2014 make sure the claim step actually\
    \ runs.\nREVIEWER (resolved, 2026-07-07): kind_robots PR #116 (Silas-directed session, `claude/challenge-center-contenders-t002`\
    \ \u2192 main, merged 2026-07-07T07:54:58Z) rebuilt the stranded work cleanly on current main: applied\
    \ the exact migration.sql from the original branch verbatim (re-audited line-by-line \u2014 still\
    \ additive-only: CREATE TABLE Contender, ADD COLUMN/MODIFY...NULL on ChallengeSubmission, one DROP\
    \ INDEX immediately replaced by the new unique index, plus FKs; no DROP TABLE/COLUMN/data rewrite)\
    \ AND applied the schema.prisma patch from docs/challenge-center-t-002-schema-patch.md (ContenderKind\
    \ enum, Contender model, ArtImage.Contenders relation, ChallengeSubmission field/relation/index additions).\
    \ Confirmed directly against current kind_robots main: schema.prisma now matches migration.sql exactly\
    \ (Contender model, enum, and all ChallengeSubmission fields present). Note: kind_robots PR #118 (`worker/challenge-center-t-002`,\
    \ the original stale branch) was also merged ~10 minutes later by Silas directly; its diff was identical/already-superseded\
    \ content so it landed as a no-op, but the stale branch should have been deleted per PR #116's own\
    \ note instead of being merged separately afterward (see t-017, filed as this cycle's kaizen). Task\
    \ is genuinely complete now \u2014 t-003, t-005, t-008, t-012, and t-014 all unblock via the Worker's\
    \ next `resolve_deps.py` run.\n"
- id: t-003
  milestone: m2
  title: Create /api/challenges CRUD and submission routes in kind_robots
  status: ready
  depends_on: t-002
  owner: null
  passes: 0
  stakes: reversible
  note: "In silasfelinus/kind_robots, add API routes under server/api/challenges/. Builds against Contender\
    \ from day one (t-002) \u2014 nothing references Bot.\n\n  GET  /api/challenges         \u2014 list\
    \ open challenges (filter: type, status)\n  GET  /api/challenges/[slug]  \u2014 one challenge with\
    \ submissions and scores\n  POST /api/challenges         \u2014 create challenge (admin only)\n  GET\
    \  /api/contenders         \u2014 list active contenders (filter: kind)\n\n  POST /api/challenges/[slug]/submissions\n\
    \    body: { contenderSlug, variantKey?, promptUsed?, settings?,\n            randomSelections?, outputText?,\
    \ artImageId?, characterId? }\n    creates ChallengeSubmission, sets status: READY\n    returns submission\
    \ id\n    rejects a duplicate (challenge, contender, variantKey) with a clear error\n\n  GET  /api/challenges/[slug]/leaderboard\n\
    \    returns contenders ranked by net score (loved+clapped - booed-hated);\n    a contender with multiple\
    \ variants aggregates across them, with a\n    per-variant breakdown included\n\n  GET  /api/challenges/leaderboard\n\
    \    global leaderboard: aggregate scores across all challenges per Contender\n\nUse existing auth/session\
    \ patterns from kind_robots. Script submissions should be accepted with an API key (reuse Server.apiKey\
    \ pattern or a new env var). Leaderboard responses group by contenderId, never by raw submission row,\
    \ so variant rows aggregate cleanly.\n"
