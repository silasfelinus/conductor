- id: t-020
  milestone: m4
  title: Make task-event roadmap mutations surgical, formatting-preserving, and conflict-safe
  status: claimed
  owner: worker
  passes: 0
  stakes: reversible
  updated: '2026-07-14T23:06:04Z'
  note: "Context: scripts/process_task_events.py currently rewrites complete authoritative YAML files\
    \ with PyYAML safe_dump. A one-task state change therefore produced hundreds of unrelated changed\
    \ lines, escaped readable Unicode, changed block and quote styles, and created unnecessary merge-conflict\
    \ risk. The bridge must remain connector-safe without treating an entire roadmap as disposable generated\
    \ output.\n\nRequired implementation:\n  1. Parse the complete roadmap for structural validation,\
    \ but mutate only the requested task fields and the dependency statuses that resolve as a direct consequence\
    \ of that event.\n  2. Preserve every byte outside the intended YAML nodes. Do not reserialize notes_from_silas,\
    \ unrelated tasks, comments, blank lines, key ordering, quote style, Unicode, or multiline block style.\n\
    \  3. Preserve the existing key order and local formatting of the target task wherever possible. A\
    \ status-only event must create a status-sized diff, not a file-sized diff.\n  4. Append to LEARNING.yaml\
    \ without reformatting existing records. Duplicate task/outcome learning entries must remain idempotent.\n\
    \  5. Make the workflow conflict-safe: fetch current main immediately before committing, never force-push,\
    \ retry one clean non-fast-forward race by replaying the still-pending event on current main, and\
    \ otherwise fail with the event left intact.\n  6. Make processing atomic. Invalid events, resolver\
    \ failures, validation failures, or unresolved push conflicts must not leave a partial roadmap or\
    \ ledger commit.\n  7. Keep successfully processed events removable and failed events inspectable.\
    \ Re-running after success must be a no-op.\n\nRegression coverage:\n  - Use a checked-in fixture\
    \ copied from the real Challenge Center roadmap, including long notes, Unicode arrows and em dashes,\
    \ quoted values, block scalars, and dependency lists.\n  - A claim event may change only status, owner,\
    \ updated, and the consumed event file. Assert all unrelated source lines are byte-identical.\n  -\
    \ A done event may change only the target task, directly unblocked dependents, one append-only learning\
    \ record, and the consumed event file.\n  - An invalid transition must produce zero authoritative-file\
    \ diff and leave the event in place.\n  - A second run after success must produce zero diff and no\
    \ duplicate learning record.\n  - Add a test that fails if an event causes broad roadmap churn, escaped\
    \ Unicode, or conversion of literal blocks into folded/quoted strings.\n\nImplementation guidance:\
    \ a targeted source-span patcher is preferred. A round-trip YAML library is acceptable only if the\
    \ byte-preservation tests above pass. Do not call yaml.safe_dump on authoritative roadmap or learning\
    \ files.\n\nDefinition of done: the full task-event test suite passes in CI; processing representative\
    \ claim and done fixtures produces a minimal expected diff; both output files parse with yaml.safe_load;\
    \ documentation explains the atomic retry behavior; and no unrelated roadmap text changes.\n\nADDENDUM\
    \ (Claude, 2026-07-14, found while closing t-008): scripts/resolve_deps.py (main(), around the yaml.safe_dump\
    \ call) has the identical defect \u2014 running it after t-008 closed turned a two-task status flip\
    \ (t-009, t-015: waiting -> ready) into a 940-line diff of the same kind (escaped Unicode, flow-style\
    \ reindentation, changed quoting) across the whole challenge-center roadmap. Worked around this cycle\
    \ by reverting and reapplying the same edits with set_task_field.py (26-line diff) instead of running\
    \ resolve_deps.py for real. In scope for this task: extend whatever surgical patcher t-020 builds\
    \ to resolve_deps.py's dependency-unblock writes too, not just process_task_events.py's event-driven\
    \ ones \u2014 both call the same unsafe dump-the-whole-file pattern and should share one safe write\
    \ path.\n"
