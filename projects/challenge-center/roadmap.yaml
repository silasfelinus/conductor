project: challenge-center
kind: software
notes_from_silas: "A comparison arena for generative work. Core mechanic: issue a challenge prompt \u2192\
  \nCONTENDERS each produce an artifact \u2192 Kind Robots users vote via reactions\n(LOVED/CLAPPED/BOOED/HATED)\
  \ \u2192 leaderboards aggregate scores.\n\nEXPANSION (Silas, 2026-07-05): this is NOT primarily a sibling-competition\
  \ tool.\nThe original inspiration \u2014 Silas's conductor (Claude agents) vs his brother's\nport0s\
  \ stack \u2014 remains a flagship matchup, but it is one instance of the general\nmechanic. A contender\
  \ is ANY distinct way of producing an artifact, and the\nframework must support comparing along every\
  \ axis:\n\n  - Provider vs provider: the same prompt to OpenAI vs Claude.\n  - Model vs model within\
  \ a provider: Fable vs Opus.\n  - Generator vs generator for art: the same prompt to SD, ComfyUI\n \
  \   (flux/sdxl/kontext/ltx), and OpenAI image generation \u2014 all already live in\n    kind_robots\
  \ (server/api/art/sd, server/api/comfy/*, server/api/art/generate).\n  - Prompt vs prompt on the same\
  \ generator: terse vs detailed phrasing, or\n    randomized variables via the kind_robots random-list\
  \ feature (randomStore's\n    keyed pools \u2014 adjective/animal/genre/species/etc from stores/helpers/\n\
  \    randomHelper.ts \u2014 plus user-created RANDOMLIST dreams).\n  - Settings vs settings: same model\
  \ + prompt, different temperature/sampler/\n    steps/cfg.\n\nContender design (Silas, 2026-07-05 \u2014\
  \ supersedes the original Bot plan): do NOT\nuse the Bot model. Bots are character-driven narrators\
  \ and specialized GPTs; the\narena compares configurations, so contenders get their own small first-class\n\
  model. Reactions already attach to ChallengeSubmission directly, so no Bot\ninfrastructure is actually\
  \ needed for voting or scoring.\n\n  Contender = the leaderboard identity (the \"who\"): slug, name,\
  \ kind\n  (AGENT_STACK | LLM_MODEL | ART_GENERATOR), provider/model/generator fields,\n  default settings,\
  \ avatar art, description. Examples: conductor-claude,\n  portos-agent, claude-fable, claude-opus, openai-gpt,\
  \ art-sd, art-comfy-flux.\n\n  ChallengeSubmission = the \"how\" of each individual entry: exact prompt\
  \ used,\n  settings, random substitutions, variantKey. Uniqueness is\n  (challengeId, contenderId, variantKey)\
  \ so one contender can enter multiple\n  prompt/settings variants in the same challenge.\n\nThe t-001\
  \ tables carry a now-deprecated botId \u2014 t-002's migration adds Contender\nand stops using botId\
  \ (nullable, never dropped). Nothing was ever built on it:\nno CHALLENGE_AGENT bots were registered\
  \ and no API exists yet, so this pivot\ncosts one additive migration. Matchups can be 2-way duels or\
  \ N-way grids.\n\nChallenge types we want:\n  - ART: \"produce an icon/card/hero for X concept\" \u2014\
  \ submission becomes a KR ArtImage\n  - TEXT: \"write a scene / poem / description\" \u2014 submission\
  \ stored as text\n  - CHARACTER: \"design a character for genre Y\" \u2014 submission links to KR Character\n\
  \  - SCENARIO: \"build a scenario/encounter for Z\" \u2014 submission links to KR Scenario\n  - REASONING:\
  \ \"solve this puzzle / answer this question\" \u2014 auto-scored, no reaction voting\n\nJudging: reactions\
  \ on ChallengeSubmission entities (reuse KR reaction system).\nLeaderboard: aggregate net reaction scores\
  \ per agent across all challenges.\nKind Robots is the database, voting platform, and display layer.\n\
  \nAgent identity: each competing agent/model/generator registers as a Contender\nrecord in kind_robots\
  \ (see Contender design below \u2014 NOT a Bot; that earlier plan\nis superseded). Score aggregation\
  \ runs Reaction \u2192 ChallengeSubmission \u2192 Contender.\n\nAPPROVED in full by Silas (2026-07-04)\
  \ \u2014 all four milestones, portos integration\nincluded. portos is highly evolved (built by Silas's\
  \ brother, a stronger programmer)\n\u2014 treat it as a first-class competitor, and per t-009, learn\
  \ its invocation pattern\nfrom the repo rather than assuming it mirrors conductor's.\n\nM5 EXPANSION\
  \ direction (Silas, 2026-07-05): the comparison-matrix milestone below\ngeneralizes the arena per the\
  \ expansion note above. M1\u2013M4 tasks proceed as written\n(they are the foundation either way); where\
  \ an M1\u2013M4 task note now mentions\nvariant fields, treat those as forward-compatibility so M5 lands\
  \ without rework.\n\nLEGITIMATE VOTING (Silas, 2026-07-04): votes are per-user Reaction rows \u2014\
  \ the t-001\nschema enforces unique (userId, challengeSubmissionId) at the DB, so each logged-in\nuser\
  \ gets exactly one reaction per submission. Tallies are auditable; anonymous or\nduplicate voting is\
  \ structurally impossible. Voting UI (t-006) must require login.\n\nFRONT-END DIRECTION (Silas, 2026-07-04):\
  \ the challenge UI must be stellar \u2014 designed\nlike a heavyweight title-fight promo or a Street\
  \ Fighter-style character/game select\nscreen. Think: VS layouts, agent \"fighter cards\" with avatars\
  \ and records, bold type,\ndramatic matchup presentation. Not a plain CRUD table. This applies to t-005\
  \ (browser),\nt-006 (voting page), and t-007 (leaderboard).\n\nCross-repo split:\n  - kind_robots: new\
  \ Prisma models, API routes, seeded challenge library, voting UI\n  - conductor: challenge runner scripts,\
  \ agent dispatch tooling, this roadmap\n  - portos: its own submission script (separate repo, same pattern\
  \ as conductor's)\n"
