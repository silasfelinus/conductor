project: challenge-center
kind: software

notes_from_silas: |
  A comparison arena for generative work. Core mechanic: issue a challenge prompt →
  CONTENDERS each produce an artifact → Kind Robots users vote via reactions
  (LOVED/CLAPPED/BOOED/HATED) → leaderboards aggregate scores.

  EXPANSION (Silas, 2026-07-05): this is NOT primarily a sibling-competition tool.
  The original inspiration — Silas's conductor (Claude agents) vs his brother's
  port0s stack — remains a flagship matchup, but it is one instance of the general
  mechanic. A contender is ANY distinct way of producing an artifact, and the
  framework must support comparing along every axis:

    - Provider vs provider: the same prompt to OpenAI vs Claude.
    - Model vs model within a provider: Fable vs Opus.
    - Generator vs generator for art: the same prompt to SD, ComfyUI
      (flux/sdxl/kontext/ltx), and OpenAI image generation — all already live in
      kind_robots (server/api/art/sd, server/api/comfy/*, server/api/art/generate).
    - Prompt vs prompt on the same generator: terse vs detailed phrasing, or
      randomized variables via the kind_robots random-list feature (randomStore's
      keyed pools — adjective/animal/genre/species/etc from stores/helpers/
      randomHelper.ts — plus user-created RANDOMLIST dreams).
    - Settings vs settings: same model + prompt, different temperature/sampler/
      steps/cfg.

  Contender design: the Bot record stays the leaderboard identity (the "who" —
  conductor-claude, portos-agent, claude-fable, claude-opus, openai-gpt, art-sd,
  art-comfy-flux, art-openai...), reusing Bot→Reaction infrastructure and the
  fighter-card UI. The "how" of each individual entry (exact prompt used, settings,
  random substitutions, variant label) lives on the ChallengeSubmission. The current
  unique (challengeId, botId) allows one submission per bot per challenge — the
  expansion adds a variantKey so one bot can enter multiple prompt/settings variants
  in the same challenge (see t-011). Matchups can be 2-way duels or N-way grids.

  Challenge types we want:
    - ART: "produce an icon/card/hero for X concept" — submission becomes a KR ArtImage
    - TEXT: "write a scene / poem / description" — submission stored as text
    - CHARACTER: "design a character for genre Y" — submission links to KR Character
    - SCENARIO: "build a scenario/encounter for Z" — submission links to KR Scenario
    - REASONING: "solve this puzzle / answer this question" — auto-scored, no reaction voting

  Judging: reactions on ChallengeSubmission entities (reuse KR reaction system).
  Leaderboard: aggregate net reaction scores per agent across all challenges.
  Kind Robots is the database, voting platform, and display layer.

  Agent identity: each competing agent registers as a Bot record in kind_robots so
  reaction aggregation can use existing Bot→Reaction infrastructure.

  APPROVED in full by Silas (2026-07-04) — all four milestones, portos integration
  included. portos is highly evolved (built by Silas's brother, a stronger programmer)
  — treat it as a first-class competitor, and per t-009, learn its invocation pattern
  from the repo rather than assuming it mirrors conductor's.

  M5 EXPANSION direction (Silas, 2026-07-05): the comparison-matrix milestone below
  generalizes the arena per the expansion note above. M1–M4 tasks proceed as written
  (they are the foundation either way); where an M1–M4 task note now mentions
  variant fields, treat those as forward-compatibility so M5 lands without rework.

  LEGITIMATE VOTING (Silas, 2026-07-04): votes are per-user Reaction rows — the t-001
  schema enforces unique (userId, challengeSubmissionId) at the DB, so each logged-in
  user gets exactly one reaction per submission. Tallies are auditable; anonymous or
  duplicate voting is structurally impossible. Voting UI (t-006) must require login.

  FRONT-END DIRECTION (Silas, 2026-07-04): the challenge UI must be stellar — designed
  like a heavyweight title-fight promo or a Street Fighter-style character/game select
  screen. Think: VS layouts, agent "fighter cards" with avatars and records, bold type,
  dramatic matchup presentation. Not a plain CRUD table. This applies to t-005 (browser),
  t-006 (voting page), and t-007 (leaderboard).

  Cross-repo split:
    - kind_robots: new Prisma models, API routes, seeded challenge library, voting UI
    - conductor: challenge runner scripts, agent dispatch tooling, this roadmap
    - portos: its own submission script (separate repo, same pattern as conductor's)

milestones:
  - id: m1
    title: "Schema & data foundation in kind_robots"
    weight: 25
    status: not-started

  - id: m2
    title: "API layer and challenge library"
    weight: 25
    status: not-started

  - id: m3
    title: "Voting UI and leaderboard in kind_robots"
    weight: 25
    status: not-started

  - id: m4
    title: "Agent integration and runner automation"
    weight: 25
    status: not-started

  - id: m5
    title: "Comparison matrix: providers, models, generators, prompt variants"
    weight: 25
    status: not-started

tasks:
  # ── M1: Schema ─────────────────────────────────────────────────────────────────────

  - id: t-001
    milestone: m1
    title: "Add Challenge and ChallengeSubmission Prisma models to kind_robots"
    status: done
    owner: worker
    passes: 0
    stakes: irreversible
    gate_human: true
    approved_by_human: true
    updated: 2026-07-05T00:00:00Z
    note: >
      Complete: kind_robots PR #87 merged 2026-07-04 (Vercel deploy succeeded), which
      ran the additive migration (Challenge + ChallengeSubmission tables,
      CHALLENGE_SUBMISSION reaction category, nullable Reaction FK, DB-enforced unique
      (userId, challengeSubmissionId)). Unblocks t-002 (Bot registration) and t-003
      (API routes) once the Worker's next cycle runs resolve_deps.py.

  - id: t-002
    milestone: m1
    title: "Register conductor and port0s as Bot records in kind_robots"
    status: ready
    depends_on: t-001
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Create Bot records in kind_robots (via seed script or API) for each competing agent:
        - slug: "conductor-claude", name: "Conductor (Claude)", BotType: "CHALLENGE_AGENT",
          designer: "silasfelinus", description: "Claude-powered agent from silasfelinus/conductor"
        - slug: "portos-agent", name: "Port0s", BotType: "CHALLENGE_AGENT",
          designer: "silasfelinus", description: "Agent from silasfelinus/portos"

      Write the seed as scripts/seed_challenge_bots.ts (or .py) in kind_robots.
      These Bot records become the identity anchor for all leaderboard aggregation.
      Make the seed script idempotent and easy to extend — t-012 (M5) adds a roster
      of provider/model/generator contender Bots through the same script.

  # ── M2: API & challenge library ──────────────────────────────────────────────────

  - id: t-003
    milestone: m2
    title: "Create /api/challenges CRUD and submission routes in kind_robots"
    status: ready
    depends_on: t-001
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/kind_robots, add API routes under server/api/challenges/:

        GET  /api/challenges         — list open challenges (filter: type, status)
        GET  /api/challenges/[slug]  — one challenge with submissions and scores
        POST /api/challenges         — create challenge (admin only)

        POST /api/challenges/[slug]/submissions
          body: { botSlug, agentModel?, outputText?, artImageId?, characterId? }
          creates ChallengeSubmission, sets status: READY
          returns submission id

        GET  /api/challenges/[slug]/leaderboard
          returns agents ranked by net score (loved+clapped - booed-hated) on their
          submission for this challenge

        GET  /api/challenges/leaderboard
          global leaderboard: aggregate scores across all challenges per Bot

      Use existing auth/session patterns from kind_robots. Bot submissions should
      be accepted with an API key (reuse Server.apiKey pattern or a new env var).

      FORWARD-COMPAT (M5): accept optional fields in the submission body now —
      { variantKey?, generator?, settings?, promptUsed?, randomSelections? } —
      validating but ignoring any the schema can't store yet, so t-011's migration
      doesn't force an API-shape change. Leaderboard responses should group by
      botId (identity), never by submission row, so variant rows aggregate cleanly.

  - id: t-004
    milestone: m2
    title: "Seed 10 initial challenges in kind_robots"
    status: waiting
    depends_on: t-003
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Write and run a seed script (scripts/seed_challenges.ts) that creates 10 challenges
      covering at least 3 types. Suggested starting set:

      ART (3):
        - "Design an icon for a neon-lit ramen bar in a cyberpunk city" (difficulty 2)
        - "Paint a hero banner for a cozy magical library that exists between dimensions" (3)
        - "Create a card-art portrait of a shipwrecked robot building a raft from circuit boards" (3)

      TEXT (3):
        - "Write the opening paragraph of a noir detective story set on a generation ship" (2)
        - "Describe the smell, sound, and feel of a forest after it rains on an alien planet" (2)
        - "Write a villain's internal monologue the moment they realize they've already lost" (3)

      CHARACTER (2):
        - "Design a character: a retired circus acrobat who now teaches quantum mechanics" (2)
        - "Design a character: the last living ambassador to a civilization that vanished" (3)

      REASONING (2):
        - "You have 3 jars: 8L, 5L, 3L. Starting with the 8L full, measure exactly 4L." (2)
        - "A message arrives in a dead language. The only key is a recipe. Decode the intent." (4)

      Each challenge must have a clear promptText (sent verbatim to agents), judgeNotes
      (what voters should weigh), and status: OPEN.

  # ── M3: Voting UI ────────────────────────────────────────────────────────────────

  - id: t-005
    milestone: m3
    title: "Build /challenges browser page in kind_robots"
    status: waiting
    depends_on: t-003
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/kind_robots, add pages/challenges/index.vue (or equivalent Nuxt route).
      Show challenge cards: title, type badge, difficulty stars, open/closed status,
      submission count, top-ranked agent preview.
      Filter by type (ART/TEXT/CHARACTER/etc) and status (OPEN/JUDGING/CLOSED).
      Link to /challenges/[slug] for the detail view.
      Reuse existing Kind Robots card/grid component patterns.
      DESIGN DIRECTION (Silas): heavyweight fight-promo / Street Fighter select-screen
      aesthetic — see notes_from_silas. Challenge cards read like fight matchups.

  - id: t-006
    milestone: m3
    title: "Build /challenges/[slug] voting page in kind_robots"
    status: waiting
    depends_on: t-004, t-005
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Challenge detail page. Show the challenge prompt and judgeNotes at top.
      Below: all submissions side by side (or stacked on mobile).
      Each submission card shows: agent name/avatar (from Bot), the output (art image
      or text block), and reaction buttons (LOVED/CLAPPED/BOOED/HATED) using the
      existing KR Reaction component — category: CHALLENGE_SUBMISSION.
      Voting requires a logged-in user; the DB enforces one reaction per user per
      submission (unique userId+challengeSubmissionId), so tallies are legitimate.
      Show net score and current rank on each card once scored.
      For ART challenges, render the ArtImage thumbnail.
      For TEXT challenges, render the outputText with a read-more expander.
      For CHARACTER challenges, render the Character card.
      DESIGN DIRECTION (Silas): this is the VS screen — submissions face off side by side
      like a title bout, agent avatars as fighter portraits. See notes_from_silas.
      Design the layout for N contenders, not exactly two: a duel renders as the classic
      VS split, 3+ renders as a select-screen grid. M5 matchups (model-vs-model,
      generator-vs-generator, prompt-variant grids) reuse this page unchanged.

  - id: t-007
    milestone: m3
    title: "Build leaderboard page in kind_robots"
    status: waiting
    depends_on: t-006
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Add /challenges/leaderboard page. Two views:
        - Global: top agents by total net score across all challenges (table/podium)
        - Per-type: filter to ART/TEXT/CHARACTER etc., show rankings for that type
      Agent row shows: Bot avatar, name, challenges attempted, challenges won,
      total score, win rate.
      Also show on each /challenges/[slug] page: a mini leaderboard for that challenge.
      Link back to /challenges browser.
      DESIGN DIRECTION (Silas): championship presentation — podium, belts, win records,
      fighter cards. See notes_from_silas.

  # ── M4: Agent integration ────────────────────────────────────────────────────────

  - id: t-008
    milestone: m4
    title: "Write scripts/challenge_submit.py in conductor"
    status: waiting
    depends_on: t-003
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/conductor, write scripts/challenge_submit.py.
      Usage: python scripts/challenge_submit.py <challenge-slug> [--bot conductor-claude]
      Steps:
        1. Fetch challenge from KR API (GET /api/challenges/<slug>)
        2. Print promptText to stdout / pipe to agent
        3. Accept agent output via stdin or --output flag
        4. POST to /api/challenges/<slug>/submissions with bot slug + output
        5. Print submission id and current leaderboard standing
      Reads KR_API_TOKEN and KR_BASE_URL from env.
      This becomes the bridge between conductor agent runs and the challenge system.

  - id: t-009
    milestone: m4
    title: "Write challenge submission script in silasfelinus/portos"
    status: waiting
    depends_on: t-008
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/portos, add a challenge submission script mirroring the conductor one.
      Usage: (whatever invocation pattern portos uses) challenge_submit <challenge-slug>
      Steps:
        1. Fetch challenge from KR API (GET /api/challenges/<slug>)
        2. Pass promptText to the portos agent
        3. Collect agent output
        4. POST to /api/challenges/<slug>/submissions with botSlug "portos-agent" + output
        5. Return submission id
      Reads KR_API_TOKEN and KR_BASE_URL from env (same vars as conductor).
      Worker should look at silasfelinus/portos to understand its agent invocation pattern
      before writing this — don't assume it matches conductor's.

  - id: t-010
    milestone: m4
    title: "Build auto-runner: dispatch active challenges to all registered agents"
    status: waiting
    depends_on: t-008, t-009
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/conductor, write scripts/challenge_runner.py.
      Usage: python scripts/challenge_runner.py [--challenge <slug>] [--all]
      Steps:
        1. Fetch open challenges from KR API
        2. For each challenge, skip if conductor-claude already has a submission
        3. Build the challenge prompt (from promptText + any system context)
        4. Call the conductor agent (via Claude API or existing agent invocation pattern)
        5. Submit the output via challenge_submit.py
        6. Print summary: challenges attempted, submissions created
      This lets conductor auto-participate in challenges without manual intervention.
      Designed to run on a schedule (e.g. nightly cron via AGENTS.md todo mechanism).

  # ── M5: Comparison matrix ────────────────────────────────────────────────────────
  # Generalizes the arena beyond agent-vs-agent: providers, models, generators,
  # prompt variants, and settings all become comparable contenders. See the
  # EXPANSION note in notes_from_silas (2026-07-05).

  - id: t-011
    milestone: m5
    title: "Schema: add submission variant fields and relax one-per-bot constraint"
    status: waiting
    depends_on: t-003
    owner: null
    passes: 0
    stakes: irreversible
    gate_human: true
    note: >
      In silasfelinus/kind_robots, extend ChallengeSubmission with an additive
      migration (same care as t-001 — every statement ADD/CREATE, no DROP of data):

        variantKey       String  @default("default") @db.VarChar(128)
          — distinguishes multiple entries by the same Bot in one challenge
            (e.g. "terse", "detailed", "random-seed-3", "temp-0.2")
        generator        String? @db.VarChar(128)
          — which pipeline produced it: claude-api | openai-api | art-sd |
            comfy-flux | comfy-sdxl | comfy-kontext | ...
        promptUsed       String? @db.Text
          — the exact final prompt sent (post variant edits / random substitution);
            Challenge.promptText stays the canonical base prompt
        settings         Json?
          — temperature/sampler/steps/cfg or whatever the generator took
        randomSelections Json?
          — the randomStore key→value substitutions used, so a variant is
            reproducible and displayable ("species: axolotl, mood: wistful")

      Replace @@unique([challengeId, botId]) with
      @@unique([challengeId, botId, variantKey]). Existing rows keep working via
      the "default" value; MySQL allows this as DROP INDEX + ADD UNIQUE INDEX with
      no data loss, but the Worker must verify the generated migration contains no
      destructive statement beyond the index swap.

      gate_human because this is a prod DB migration, same protocol as t-001:
      Worker opens the PR, Reviewer audits migration.sql line-by-line, Silas's
      merge click completes the task.

  - id: t-012
    milestone: m5
    title: "Seed contender Bot roster: providers, models, and art generators"
    status: waiting
    depends_on: t-002
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Extend the t-002 seed script with contender Bots (BotType: CHALLENGE_AGENT)
      so leaderboards can rank identities beyond the two agent stacks. Starting
      roster — text/reasoning: "claude-fable", "claude-opus", "openai-gpt";
      art: "art-sd", "art-comfy-flux", "art-comfy-sdxl", "art-openai".
      Each gets a name, designer: "silasfelinus", and a description naming the
      exact backend it fronts. Keep the script idempotent (upsert by slug).
      These are the fighter cards for M5 matchups — avatar art can come later
      through the normal ART-PROMPTS pipeline.

  - id: t-013
    milestone: m5
    title: "Matchup runner: dispatch one challenge across a contender matrix"
    status: waiting
    depends_on: t-010, t-011, t-012
    owner: null
    passes: 0
    stakes: reversible
    note: >
      In silasfelinus/conductor, write scripts/challenge_matchup.py — the
      generalization of t-010's runner. Input: a challenge slug plus a matchup
      spec (inline JSON or a YAML file):

        contenders:
          - { bot: claude-fable,  generator: claude-api, model: claude-fable-5 }
          - { bot: claude-opus,   generator: claude-api, model: claude-opus-4-8 }
          - { bot: openai-gpt,    generator: openai-api, model: gpt-5 }
          - { bot: conductor-claude, variantKey: detailed, promptSuffix: "..." }

      For each contender: build the final prompt (base promptText + any variant
      edits), call the right backend (Claude API, OpenAI API, or a kind_robots
      art endpoint for ART challenges), and POST the submission with the t-011
      variant fields filled in (variantKey, generator, settings, promptUsed).
      ART challenge outputs go through the existing kind_robots art save path so
      the submission gets a real artImageId. Print a matchup summary table.
      Reads KR_API_TOKEN, KR_BASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY from env;
      skip (with a clear note) any contender whose key/backend is unavailable.

  - id: t-014
    milestone: m5
    title: "Prompt-variant generator using kind_robots random lists"
    status: waiting
    depends_on: t-011
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Support "same generator, different prompts" matchups where the difference is
      randomized variables. In silasfelinus/kind_robots, add a server util (and a
      small API route, e.g. POST /api/challenges/variants) that takes a base prompt
      containing placeholder keys and a variant count N, and returns N concrete
      prompts by substituting from the random pools in stores/helpers/
      randomHelper.ts (adjective, animal, backstory, class, color, genre,
      honorific, inventory, item, material, name, noun, personality, quirk, skill,
      species, verb) and, when a placeholder names one, a user RANDOMLIST dream.
      Each returned variant includes the key→value map so the caller can store it
      as randomSelections on the submission (t-011) — variants must be auditable
      and reproducible, not mystery rolls.
      The conductor matchup runner (t-013) consumes this to enter one bot N times
      with variantKey "random-1"..."random-N".

  - id: t-015
    milestone: m5
    title: "Faceted leaderboards: rank by model, generator, and prompt strategy"
    status: waiting
    depends_on: t-007, t-011
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Extend the t-007 leaderboard (page + API) with facets beyond per-Bot:
        - per-generator: SD vs Comfy vs OpenAI images across all ART challenges
        - per-model: aggregate submissions by agentModel (Fable vs Opus vs GPT)
        - per-variant within a challenge: on /challenges/[slug], when one bot has
          multiple variantKeys, show which prompt variant won and surface its
          promptUsed / randomSelections so the comparison teaches something
      Facet data comes from the t-011 fields; grouping is a query-level change,
      not new schema. Keep the championship presentation — a generator facet is
      just a different weight class.

  - id: t-016
    milestone: m5
    title: "Write docs/comparison-axes.md summarizing the five M5 comparison axes"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Kaizen from the Reviewer's M5-expansion merge (conductor PR #188): t-011 through
      t-015 each restate pieces of the comparison-axes design inline (provider vs
      provider, model vs model, generator vs generator, prompt vs prompt via random
      substitution, settings vs settings) and the contender split (Bot = leaderboard
      identity, ChallengeSubmission = the "how": variantKey/generator/promptUsed/
      settings/randomSelections). Write projects/challenge-center/docs/comparison-axes.md
      as the one canonical reference doc — pull the axis list and contender-design
      paragraph from notes_from_silas verbatim, then a short table mapping each axis to
      the task(s) that implement it (t-011 schema, t-012 roster, t-013 runner, t-014
      variants, t-015 leaderboards). Future task notes and PR reviews should check
      against this doc instead of re-deriving the design from scattered task notes.
