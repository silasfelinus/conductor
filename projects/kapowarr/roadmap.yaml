  - id: t-015
    milestone: m2
    title: "Bound the external-client connectivity-test retry/backoff with a timeout"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: >
      Kaizen from t-013 (silasfelinus/Kapowarr#2): the Settings page's existing
      "Test" button for external download clients (POST /api/externalclients/test,
      backed by ExternalClients.test() -> each client's classmethod test(), which
      uses the shared Session class) has no timeout of its own -- against a
      genuinely unreachable client it waits out Session's full retry cycle (5
      retries with exponential backoff, observed to take 90+ seconds live during
      t-013's testing) before reporting failure. t-013 fixed this for the new
      health-check endpoint with a bounded per-call timeout run in a thread pool
      (see backend/internals/health.py's HEALTH_CHECK_TIMEOUT / _run_bounded);
      apply the same or a similar bound to the interactive Test button's request
      path so a user testing a dead client isn't stuck waiting minute-plus for a
      spinner. Same cross-repo boundary as other kapowarr code tasks --
      implementation belongs in silasfelinus/Kapowarr, not this repo.
    claimed_by: conductor-sweep-20260815-2350
    claimed_at: '2026-08-15T23:26:58Z'
    updated: '2026-08-15T23:33:46Z'
    implementation_pr: 'silasfelinus/Kapowarr#6'

  - id: t-016
    milestone: m2
    title: "Bound send_notification()'s per-service thread fan-out with a worker pool"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: >
      Kaizen from t-012 (silasfelinus/Kapowarr#5): send_notification() fires one
      plain threading.Thread per matching, enabled notification service per event
      (backend/implementations/notifications.py), each of which itself spins up a
      one-worker ThreadPoolExecutor to bound the actual HTTP call. Fine at today's
      scale (a handful of services, downloads aren't that frequent), but a library
      with many enabled services and frequent concurrent downloads could accumulate
      many short-lived threads at once with no cap. Replace the per-call Thread +
      one-off ThreadPoolExecutor with a small shared, bounded worker pool (reusing
      the ThreadPoolExecutor + future.result(timeout=NOTIFICATION_REQUEST_TIMEOUT)
      pattern that already exists, just not sized/shared across calls). Same
      cross-repo boundary as other kapowarr code tasks -- implementation belongs in
      silasfelinus/Kapowarr, not this repo.
    claimed_by: conductor-sweep-20260815-2350
    claimed_at: '2026-08-15T23:33:49Z'
    updated: '2026-08-15T23:39:11Z'
    implementation_pr: 'silasfelinus/Kapowarr#7'

