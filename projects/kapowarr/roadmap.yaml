notes_from_silas: 'Higher-than-average priority. Aggregation is the primary product goal; multi-user support
  and deep reader polish are intentionally secondary for now. After live hardening the existing SABnzbd/Newznab
  path, expand the -arr acquisition fabric (Torznab/Prowlarr/Jackett and torrent lifecycle), then prioritize
  weekly release lists, story arcs/read lists, GetComics discovery/recommendations, metadata-provider
  resilience, and additional sources. Do not run recurring upstream-fork monitoring; inspect upstream
  deliberately when a concrete integration or sync task calls for it.


  Keep Conductor and Kind Robots project state synchronized; treat missing Project/conductorSlug or milestone
  projection as a bug to investigate rather than silently continuing.'
