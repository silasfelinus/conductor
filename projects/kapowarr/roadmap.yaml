    DownloadHandler (31 tests) -- previously zero coverage for either module. Covers success/canceled/
    permanently-failed/shutdown/stalled/seeding-once cases for the external (torrent+NZB) download polling
    state machine, queue management (_process_queue, set_queue_location, duplicate-add short-circuit),
