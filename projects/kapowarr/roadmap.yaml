project: kapowarr
kind: software

notes_from_silas: |
  Evolve Silas's personal Kapowarr fork (silasfelinus/Kapowarr) into a more
  comfortable -arr-style comic manager while preserving clear credit to the
  original project. All implementation work belongs in repositories owned by
  silasfelinus; upstream Casvt/Kapowarr is reference-only unless Silas explicitly
  asks otherwise.

  Higher-than-average priority. Start with small personality/QoL wins, then build
  the larger Usenet/NZB path deliberately. Keep Conductor and Kind Robots project
  state synchronized; treat missing Project/conductorSlug or milestone projection
  as a bug to investigate rather than silently continuing.

