- id: t-035
  milestone: m5
  title: Add NZBGet as a second Usenet download client
  status: done
  owner: reviewer
  passes: 0
  stakes: reversible
  note: 'Shipped in silasfelinus/Kapowarr#83 (squash 41019cb4e327bfb7699efcad836b6d1394e05c3d). The Usenet seam had exactly one implementation, so an NZBGet user had no way to route acquisitions through their existing setup. NZBGet now sits beside SABnzbd as a peer client, picked up automatically by the existing get_subclasses(BaseExternalClient) registry; no frontend change was needed because the add/edit client form is driven entirely by the options API. Four API differences from SABnzbd shaped the implementation, each documented at the call site and covered by tests: (1) JSON-RPC 1.1 over POST /jsonrpc with positional params and HTTP basic auth, replies carrying no `jsonrpc` member -- a client validating one would reject every response; credentials are username/password rather than an API key, and an instance with no credentials at all still connects. (2) A job stays in the QUEUE through post-processing (par repair, unpack, move, scripts are ordinary listgroups statuses) and reaches history only when finished, so history is TERMINAL -- the opposite of SABnzbd, meaning an unrecognised history status must fail rather than await a resolution that will never come. (3) There is no per-group download rate at all (firm negative, verified against source: DownloadRate exists only on the global `status` command), so an actively downloading group borrows the instance-wide figure and everything else reports 0; progress and size stay exact and the user docs state the caveat. (4) 64-bit byte counts arrive split into unsigned 32-bit Lo/Hi halves, preferred over the lossy ...MB field so a download over 4GiB isn''t wrong by exactly 2**32. Two judgement calls worth knowing: history statuses are matched on their PREFIX/ rather than an enumerated list (NZBGet adds suffixes between versions), and only SUCCESS/* plus WARNING/SCRIPT are importable -- WARNING/PASSWORD, /DAMAGED and friends mean the archive was never unpacked into usable form, so importing them would import a broken or encrypted file as if it were the comic. And delete_download maps onto NZBGet''s own conditional disk handling rather than onto a flag, because it already does what each caller wants: GroupFinalDelete/HistoryFinalDelete clean disk for a cancelled/failed job, while for a successful one HistoryFinalDelete erases the record and leaves DestDir untouched for Kapowarr to import from. Field names, status vocabularies and the append/editqueue parameter orders were taken from NZBGet''s published API docs cross-checked against its implementation (daemon/remote/XmlRpc.cpp, daemon/queue/DownloadInfo.cpp, daemon/queue/HistoryCoordinator.cpp) rather than from memory -- several documented details are wrong (APPEND.md''s prose argument list omits Content entirely; its Python example passes 10 of 11 arguments). Verified: 535 backend tests pass (42 new), 41 frontend tests pass, flake8/isort clean on both new files (pre-existing findings on external_clients.py/definitions.py confirmed via git-stash: 21 on main vs 22 with this change, the addition being the same deliberate registration-import F401 the three existing client imports already carry; isort was already failing on external_clients.py before this change). All 7 Kapowarr CI checks green including the Python 3.8 matrix job. Not verified: no live NZBGet instance was reachable from this sandbox, so the wire behaviour is exercised against representative fixtures only. SABnzbd.py carries the identical caveat in its own module docstring and NZBGet.py states it too. Recommended kaizen (also in the PR): a short ''verify against a live client'' checklist in AGENT_WORKFLOW_NOTES.md, since both Usenet clients now share this unverified-wire-behaviour gap.'
