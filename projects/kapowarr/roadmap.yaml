    status: done
    owner: null
    passes: 0
    stakes: reversible
    note: 'Audit written at projects/kapowarr/docs/t-005-arr-qol-audit.md, grounded in a read-only inspection of the live silasfelinus/Kapowarr source (queue.js, view_volume.js, settings_download_clients.js, root_folders.py, status.html, history.html). Found queue reorder/delete/blocklist, per-issue/per-volume search, download-client test-connection, and multi-root-folder support already mature -- no action needed there. Concrete gaps: no notification/webhook system at all (t-012 created), no health-check/system-warnings panel (t-013 created). Import lists and a calendar view were considered and deliberately not turned into tasks (see doc for reasoning) to keep follow-ups scoped to real friction rather than speculative new surface.'
