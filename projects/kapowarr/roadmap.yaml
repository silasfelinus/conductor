- id: t-027
  milestone: m6
  title: Add weekly release and pull-list workflows
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  note: 'Weekly comic-release and pull-list workflow, built as a v1: a pluggable WeeklyReleaseSource abstraction (backend/base/definitions.py + backend/features/pull_list.py registry, mirroring the existing SearchSource pattern), one concrete GetComics-backed source (backend/implementations/weekly_releases.py), cross-referencing against monitored library volumes by title (match_releases_to_library()), a weekly scheduled task (WeeklyPullListCheck, 7-day interval, auto-gets a Run button on the Tasks page), a new pull_list_entries table (fresh-install schema + migration 47), and a read-only GET /api/pulllist endpoint plus a new /activity/pull-list UI page with Refresh and Check Now. 27 new tests (fixture-based HTML parsing, title-matching, DB persistence). Deliberately deferred: ComicVine-ID matching (title-only for now), one-click download from a match, a second release source, and notification-system wiring -- listed as kaizen candidates in the PR body. Built by an isolated background agent (no local git access to the shared Kapowarr checkout by design) that pushed via the GitHub API (create_branch + push_files) against a *stale* snapshot of main taken before kapowarr/t-026 (Torznab) had merged concurrently. This silently reverted the `import frontend.torznab` line in frontend/ui.py that registers the /torznab-indexers* settings routes -- a real regression that would have broken t-026s just-merged feature. Caught by diffing the PR against current main before merging (not trusting the agents self-report), fixed with a follow-up commit restoring the import line, re-verified all 7 checks green on the corrected commit, then squash-merged as 4b752b6. No migration-slot collision with t-026 (it never touches db_migration.py). Kaizen for next cycle: when a background agent must push via the GitHub content API instead of git (sandbox/isolation constraints), it should re-fetch each touched files *current* remote content immediately before constructing its patch/push, not rely on a snapshot taken at task-start -- otherwise any file a concurrent PR also touches is at risk of a silent revert.'
