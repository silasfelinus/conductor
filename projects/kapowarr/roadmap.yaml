- id: t-007
  milestone: m2
  title: Implement SABnzbd download-client support
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  note: 'Implemented and merged silasfelinus/Kapowarr#26 (squash 973ad03), per the seam mapped in t-006''s
    design doc. Added DownloadType.USENET and a SABnzbd(BaseExternalClient) peer to qBittorrent/Transmission
    (connection test, submission, queue+history status polling, cancellation), registered it in ExternalClients.get_client_types(),
    and added NZBDownload(ExternalDownload, BaseDirectDownload) modeled on TorrentDownload. download_queue.py''s
    shared external-download polling loop was extracted into __run_external_download(); the new __run_usenet_download()
    always uses PostProcessorTorrentsComplete since Usenet never seeds (torrent behavior unchanged). Real
    constraint found during implementation, corrected vs. the design doc''s assumption: SABnzbd has no
    per-job arbitrary target-folder parameter (submits under a fixed ''kapowarr'' category instead, folder
    mapped in SABnzbd''s own settings), and doesn''t expose a completed download''s folder until its history
    reports ''Completed'' -- NZBDownload.update_status() picks that up from SABnzbd.get_download()''s
    ''storage'' key rather than assuming zero polling changes. Verified by reading the code (not assumed):
    the settings UI and /externalclients* API routes are already fully client-type-registry- driven, so
    SABnzbd needed zero UI/route changes to become selectable/configurable. mypy -p backend clean, isort
    clean on touched files, python -m unittest discover: 96/96 passing (25 new: 14 client unit tests against
    mocked SABnzbd API responses, 11 NZBDownload tests). SABnzbd''s exact JSON field names are documented
    from its long-stable public API but not live-verified (no reachable instance in this sandbox) -- flagged
    in the module docstring for first real use. NZBDownload exists and is unit-tested but has no caller
    yet -- wiring a real search result into it is t-008 (NZB indexer ingestion), not this task.

    '
