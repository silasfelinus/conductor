- id: t-064
  milestone: m8
  title: Make ComicVine's system-events instrumentation a provider-declared opt-in
  status: ready
  owner: null
  passes: 0
  stakes: reversible
  note: |
    Kaizen from t-061 (Kapowarr PR #91). t-061 removed the hardcoded provider names from
    the metadata search path -- the fan-out, the registry's lazy imports, and the "is it
    configured" check are all table-driven or contract-driven now. One hardcoded name
    survives, in the same class t-061 otherwise generalized:

    MetadataProviderRegistry.register() (backend/features/metadata.py) still reads
    `if provider_id == 'comicvine': provider = cls._instrument_comicvine(provider)`, and
    _instrument_comicvine() wraps a fixed list of four operation names with
    begin_comicvine_operation/finish_comicvine_operation, catching ComicVine's own
    exception types by name to classify the outcome (rate_limit / invalid_key /
    not_found / other_error).

    So a third metadata provider is measurable only by editing the registry, which is
    exactly the shape t-061 just deleted from the search path. It was deliberately left
    out of t-061's scope because it is a different concern (telemetry, not fan-out) and
    folding it in would have widened that diff.

    Scope: let a provider declare that it wants its operations instrumented (e.g. an
    `instrument_operations` class attribute defaulting to False, so nothing changes for
    providers that do not ask), and have register() consult that instead of the provider
    id. The outcome classification is the harder half: the current
    rate_limit/invalid_key/not_found buckets are ComicVine exception types. Either map
    them through the provider (a per-provider exception-to-outcome table, with
    unavailable_errors from t-061 as the obvious precedent) or keep the buckets generic
    and let unrecognized exceptions fall to other_error -- decide which and say why in
    the PR. tests/Tbackend/system_events.py exercises _instrument_comicvine directly and
    is the regression net; the counters it asserts must not change for ComicVine.
