    but the download_queue table/SELECT only has source_type -- on a real sqlite3.Row this raised an uncaught
    IndexError, killing the queue-restore loop mid-iteration on every server restart where a queued link
    had gone broken, silently dropping every row after it. Fixed (one-line) and locked in with a regression
    test verified to fail pre-fix and pass post-fix. Full suite 193/193 (128 pre-existing + 65 new), mypy
    clean, isort clean. Merged silasfelinus/Kapowarr#29 (squash 6f79c1e) -- all 7 checks green, mergeable_state:
