  note: 'Shipped in silasfelinus/Kapowarr#85 (squash 935656141eb202068e7a5bf63315b12b0f780e66). Upstream issue #154. New backend/features/archive_integrity.py verifies a completed download before post-processing imports it: ZIP via ZipFile.testzip() (the same CRC pass features/backups.py already runs on backup archives; encrypted members skip the CRC pass, which raises rather than reporting, and are judged on names as pack_normalization._archive_members already does), RAR via `rar t` with -p- -- not optional, since without it a header-encrypted archive blocks on an interactive password prompt run_rar gives the subprocess no stdin to answer, hanging post-processing indefinitely (exit 3 corrupt, 11 wrong-password treated as unverifiable rather than damaged, 0/1 pass, anything else unreadable). Dispatch is on magic bytes rather than extension, so the mislabelled .cbz-that-is-really-a-RAR case rename_with_proper_extension exists to fix cannot fool it. THE GOVERNING DESIGN BIAS is asymmetric on purpose and worth carrying forward: a missed corrupt file sits in the library until a user deletes it, but a false positive blocklists a good release, deletes it, and steers every future search away from it -- so anything unprovable passes. 7z/tar/epub report UNSUPPORTED (nothing in this codebase can open them, so there is no basis to call one corrupt) and UNSUPPORTED is explicitly not a failure; an unexpected exception reports UNSUPPORTED rather than condemning, since a raise inside post-processing would abandon a download mid-pipeline. The ''no pages'' test is INVERTED for the same reason: the obvious allowlist rule (''pass only if a member has a known image extension'') would condemn a comic whose pages are .bmp/.tiff/.avif/.jxl, none of which are in FileConstants.IMAGE_EXTENSIONS -- so an archive is EMPTY only when every member is provably not a page. There is a regression test for exactly that false positive. FAILURE ROUTING: a failing download runs a new actions_integrity_failed INSTEAD of actions_success (same shape as the perm-failed path, under a new BlocklistReason.DOWNLOAD_CORRUPT / ID 5 -- the link worked, what it served did not). Instead-of rather than after is the entire point: add_file_to_database never runs, so the file is never registered, so the issue stays wanted and the next auto_search finds a different release. Blocklisting alone would stop the bad link being repicked while leaving the corrupt file as the issue''s file. Off switch: PublicSettingsValues.verify_downloaded_archives, default True. DELIBERATELY NOT COVERED, both documented in code as follow-ups rather than silently skipped: (1) PostProcessorTorrentsCopy is opted out via verify_integrity_on_success=False, because copy_file_torrent has already imported by the time its success() runs -- gating there would blocklist and delete the seeding copy while leaving the imported one; gating its seeding() needs an answer for what to do with a torrent still being seeded, which is more than an integrity check should decide. (2) Folder-shaped torrent payloads pass unchecked (download.files[0] is still the folder at gate time; a directory reports UNSUPPORTED). Both are worth their own task. VERIFIED: 572 backend tests pass (37 new, 535 before), including the repo''s first corrupt-archive fixtures -- _corrupt_payload locates the first member''s data via its local file header and flips only those bytes, leaving headers and the central directory intact, so the archive still opens and still lists its pages and only the CRC disagrees; the test asserts that precondition explicitly because it is exactly the state every existing check in the codebase reads as healthy. flake8/isort clean on both new files (post_processing.py''s isort failure confirmed via git-stash to predate this change); Python 3.8 syntax checked against the CI matrix floor. All 3 Kapowarr CI workflows green before merge. NOT VERIFIED: no live download was run end-to-end; the RAR path is exercised against mocked run_rar fixtures the same way tests/Tbackend/comic_reader.py does, since the bundled rar binary is not runnable in the sandbox.'
