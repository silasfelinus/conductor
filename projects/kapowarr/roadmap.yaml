- id: t-021
  milestone: m2
  title: Make library import continuous, paced, and observable
  status: done
  passes: 0
  stakes: reversible
  note: 'User-prioritized before SAB/NZB work: evolve the existing manual library importer for a 4500+
    volume collection. Preserve Review Scan, add an explicit unattended mode that can check all root-folder
    candidates without repeated confirmation, pace ComicVine conservatively, stop disguising ComicVine
    throttling as a missing match, keep unmatched folders available for review, and expose visible checked/imported/review/remaining
    progress. First slice is implemented in silasfelinus/Kapowarr#13; follow-up confidence scoring and
    durable restart persistence can build on the same conveyor after live use.



    Implemented and merged silasfelinus/Kapowarr#13 (squash 5c4d5f5). The existing review importer now
    surfaces ComicVine throttling instead of converting it to a missing match; Continuous Auto-Import
    snapshots the unimported folder queue once, processes it one folder at a time with conservative ComicVine
    pacing and cooldown, auto-imports the current best match without renaming, leaves unmatched folders
    for review, and exposes checked/imported/review/remaining progress through the existing background-task
    API. The importer page reconnects to a running task after navigation. PR and post-merge Python 3.8-3.12
    matrices, docs, and container builds all passed; main published ghcr.io/silasfelinus/kapowarr:latest
    and sha-5c4d5f5 with digest sha256:bc810d0645f82016304533d4013cd742643f611f41141eb04398387c70452b9a.
    Follow-up confidence-margin policy and durable task persistence across container restarts remain explicit
    future refinements after live-library testing.


    Projection resync verification after merging the task-event dispatcher fix. No implementation state
    changed; this repeat done transition is intentionally idempotent and exists to exercise the full task-event
    processor -> explicit Kind Robots projection workflow path on the already-completed importer task.


    Follow-up confidence hardening shipped in silasfelinus/Kapowarr#14. Continuous Auto-Import now uses
    the existing filename-evidence score but only imports unattended when the best ComicVine candidate
    scores at least 4/5 and leads the runner-up by at least 2 points. Exact ties, one-point leads, and
    weak single candidates stay untouched in the needs-review bucket, while Review Scan keeps the historical
    best-guess behavior. PR and post-merge Python 3.8-3.12 tests, docs, and container builds passed. Main
    d38b08e published ghcr.io/silasfelinus/kapowarr:latest and sha-d38b08e with digest sha256:653bbb5c5d83f848dfdff12dc97ad9f8403e203169b470b0fbdfcdeecc3142e6.


    Live-library calibration after 1,153/9,222 folders in about 10 hours (751 volumes imported; 642 folders
    held for review) shipped in silasfelinus/Kapowarr#15, merged as e7b2cfb51c05e8a0d6bb84bb062fb903edc513ad.
    Continuous Auto-Import keeps the 4/5 filename-evidence floor, now accepts a one-point lead while exact
    ties remain for review, and paces ComicVine by a 20-second minimum between search starts so API/import
    processing time overlaps the cooldown. Progress now reports tied, weak-score, and no-candidate review
    holds for future calibration. PR exact-head Python 3.8-3.12, docs, and container checks passed; post-merge
    main Python 3.8-3.12, docs, and GHCR publish also passed. Published ghcr.io/silasfelinus/kapowarr:latest
    digest sha256:977c4bed856a7203387eef671b14c28a6afc5093bc7ddc598d82d7d8715d80d5.


    Live-control follow-up shipped in silasfelinus/Kapowarr#16, merged as 3ba5294a399795329b886c426b0154733638b4bf.
    Continuous Library Import can now be manually stopped at a safe folder boundary, including responsive
    cancellation during ComicVine cooldowns. While it is still running, Review Holds exposes accumulated
    tied, weak, and no-candidate groups in the normal editable import table using ComicVine results already
    fetched by the conveyor, so opening review does not duplicate searches. The background progress poll
    no longer steals the page after Run in Background or while reviewing. Exact-head and post-merge Python
    3.8-3.12, docs, and container checks passed. Published ghcr.io/silasfelinus/kapowarr:latest and ghcr.io/silasfelinus/kapowarr:sha-3ba5294
    with digest sha256:3cfc9fedf643c05842eb32a522a22aa931b0ab5b363cf6947429e382d4ab50c2. Active task and
    review state remains process-memory only and does not survive a container restart; durable importer
    job persistence remains separate future work.


    Durable Continuous Library Import persistence shipped in silasfelinus/Kapowarr#17, merged as c2295f4b4c6035682c883cfffc4b03cabaa655d1.
    Jobs now persist an ordered folder snapshot and per-folder pending/processing/done/review checkpoints
    in Kapowarr''s SQLite database, including imported-volume counters and held review rows. A user Stop
    Import is a durable pause that stays paused across restarts and resumes on the next explicit Continuous
    Auto-Import start; an application/container interruption leaves the job running and Kapowarr auto-requeues
    it on startup, resetting only an in-flight processing folder to pending. Completed and review checkpoints
    are kept, and durable held rows reconcile against the canonical files table after manual imports.
    Unexpected worker errors persist as paused with the error to avoid restart loops. The only crash window
    is after import_library commits but before the folder checkpoint writes: that one folder can replay,
    but already-recorded files are filtered from the rescan, so library state stays safe while the persisted
    imported counter may undercount that crash-window work. Exact-head and post-merge Python 3.8-3.12
    tests, docs, and container builds passed. GHCR latest and sha-c2295f4 were published at digest sha256:11a7af9ca32b63e298cf1dcfb62c2573a68f05795926307199d62425fb5bbd15.


    Review-match postmortem diagnostics shipped in silasfelinus/Kapowarr#18, merged as f18c05c2b08eca11d445f51aa4180c6a3f8e9631.
    Continuous Auto-Import now records zero-extra-request JSONL diagnostics beside Kapowarr.db for each
    held filename group, including parsed filename evidence, current score/margin thresholds, best/runner-up
    scores, ranked viable candidates, and up to 25 raw ComicVine search results annotated with viable
    scores. Existing pre-#18 holds do not have full candidate history and require paced re-search to backfill.
    Exact-head and post-merge Python 3.8-3.12, docs, and container checks passed. Published ghcr.io/silasfelinus/kapowarr:latest
    digest sha256:af641768dbf7833836926170e29993b062480c96a977bdbba543eddbc744aca6.


    Postmortem-driven false-review cleanup shipped in silasfelinus/Kapowarr#19, merged as 33d3ffd00e1e93f2be49684c28cda6996c090ecc.
    Analysis of 1,265 review-postmortem groups found 523 (41.3%) were artifact-only cover.jpg/folder.jpg
    groups. Continuous Auto-Import now ignores cover-classified images and hidden cache paths while preserving
    page-image comics, prunes historical artifact rows when Review Holds reconciles, and uses safe folder-local
    series.json or compatible metadata.json ComicVine IDs when the filename or same-folder evidence agrees.
    Organizer folders do not blindly propagate their metadata to differently named child/peer series.
    The existing continuous 4/5 score floor and one-point margin remain unchanged for groups without trusted
    local metadata. Exact-head and post-merge Python 3.8-3.12, docs, and container checks passed. Published
    ghcr.io/silasfelinus/kapowarr:latest and :sha-33d3ffd at digest sha256:3449b61c5cdec7a8719d9075640c0490be250dffec4c0d724a37ac84c5d75996.
    Existing real pre-#19 review holds are not automatically re-matched by this change; artifact rows
    are pruned immediately and local metadata applies prospectively as pending folders are processed.


    Library Import review UX shipped in silasfelinus/Kapowarr#20, merged as 8d849724e7c9d7fe2afbfa411b971cf2e13f34cf.
    Review rows now collapse by Kapowarr''s existing volume group_number so a proposed volume appears
    once while its underlying issue/file rows remain hidden and synchronized for the existing per-file
    import payload. Groups without any proposed ComicVine match default to unchecked and disabled; assigning
    a manual group match makes them importable and selected. Select All operates only on visible matched
    volume groups. A Show matched only toggle filters the review table without deleting holds, and grouped
    rows expose an expandable file list when individual issues need inspection. Matching thresholds and
    backend import policy are unchanged. Exact-head and post-merge Python 3.8-3.12 checks passed, docs
    passed, and the production container published ghcr.io/silasfelinus/kapowarr:latest and ghcr.io/silasfelinus/kapowarr:sha-8d84972
    at digest sha256:beadf34f7da7774a5595cc75a71498fd7efce0490860d4c2becf1a8d02582ad5.


    Kapowarr#23 shipped a serialized Reset & Re-evaluate All Holds workflow. It cooperatively stops an
    active continuous import, retires stale paused review jobs, rescans current unimported filesystem
    paths, creates a fresh durable job ID, and restarts the current cvinfo/whole-run/artifact-aware matcher
    without touching already imported files or the append-only postmortem log.


    Follow-up UI repair shipped in silasfelinus/Kapowarr#24, merged as e0f890dd285f953de60db43d87c9c5953ec52eb5.
    Reset & Re-evaluate All Holds is now directly available on the main Library Import screen. A background
    Continuous Auto-Import exposes View Progress, Review Holds, Stop Import, and Reset & Re-evaluate controls
    on that same screen, and Review Scan / Continuous start buttons are disabled while the continuous
    conveyor is active so two importers cannot collide. The older synchronous Review Scan loader now has
    Back to Import Options and blocks overlapping scans until its server request settles; it is intentionally
    not labeled as cancellable because the synchronous backend has no cancellation token. Exact-head and
    post-merge Python 3.8-3.12, docs, and container checks passed. GHCR latest and sha-e0f890d were published
    at digest sha256:1d0c812a29f8bcb43ad555944266cc8580d5c1beea5b49ce9eb5822427e3d865.


    User-reported live follow-up after #24: Reset & Re-evaluate can leave the browser on the intermediate
    "Scanning current unimported folders..." state until a refresh. Investigating the reset-to-continuous
    async handoff; this done event is an idempotent trace marker only and does not claim implementation
    completion.


    Live reset-handoff repair shipped in silasfelinus/Kapowarr#25, merged as 8e0ccf480c8e4cf6b025f24d9adaa8e7e8113d5a.
    Root cause: Reset & Re-evaluate waited for the recheck task to disappear, then fired startContinuousImport
    asynchronously and immediately released its reset UI state without confirming that the browser had
    attached to the newly created continuous_library_import task. The UI now waits up to 15 seconds for
    that task to become visible, explicitly attaches the normal progress poller before finishing the reset
    flow, and disables Continuous-only Review/Stop/Background controls while the snapshot rebuild itself
    is running. PR and post-merge Python 3.8-3.12 tests, docs, and container builds all passed. GHCR latest
    and sha-8e0ccf4 were published at digest sha256:259e1032e96d590abfc8d212fbc76fca72e79fc1ab174dc30b5f287b07fb4da9.


    Adjacent live-use follow-ups shipped after the continuous importer work. silasfelinus/Kapowarr#31
    (merge 0c8ed204) keeps large Volumes galleries responsive by revealing the first 50 entries immediately
    and hydrating the remainder in browser-idle batches while preserving complete Mass Edit semantics.
    silasfelinus/Kapowarr#32 (merge 206c63f9) adds the first built-in comic-reader slice: authenticated
    issue/page endpoints, CBZ/ZIP and loose-image reading without permanent extraction, natural page ordering,
    responsive swipe/keyboard/page-fit UI, and Read actions on downloaded issues. Both exact PR heads
    passed Python 3.8-3.12, docs, and container workflows before merge. CBR/RAR, PDF, and remembered reading
    position remain explicit reader follow-ups.


    Adjacent comic-reader follow-up shipped in silasfelinus/Kapowarr#33, squash 779c2c47648ab0cb4ecd9373a23098efa5a4370b.
    The built-in reader now supports issue-linked PDF files in addition to CBZ/ZIP and loose images. PDFs
    are streamed only through an authenticated issue-derived endpoint with Flask conditional responses
    left intact for HTTP range/206 behavior, then embedded in the existing responsive reader using the
    browser-native PDF renderer. Image/CBZ page mode remains preferred when both forms are linked. Exact
    PR head 5c0fb22d passed Python 3.8-3.12, docs, and container workflows before squash merge. CBR/RAR
    remains the next reader-format follow-up.'
