    title: "SHAPE — fork identity, personality, and architecture"
    weight: 25
    status: not-started

  - id: m2
    title: "BUILD — QoL and Usenet/NZB support"
    weight: 50
    status: not-started

  - id: m3
    title: "POLISH & SHIP — tests, migration safety, and sync integrity"
    weight: 25
    status: not-started

