slug: the-wardrobe-tide
title: The Wardrobe Tide
vibe: Every dawn the sea returns clothing, and every garment still remembers its last morning.
idea: >-
  A cold coastal town where the tide brings in clothes instead of driftwood. Each garment
  carries the last morning of whoever wore it, and the town's dye-salons have learned that
  colour is how you talk to a memory: the right pigment lets it go, the wrong one seals it
  in. The salons are busy, the harbour is quiet, and nobody has ever dyed a coat black.
style: "luminous gouache storybook painting, matte pigment, simplified confident shapes, soft edge variation, layered hand-painted texture"
character:
  name: Marisol Keel
  species: Chromatophore folk
  gender: woman
  presentation: broad-shouldered, cropped hair that shifts colour with her mood, salt-cracked hands
  genre: Coastal Memory Fantasy
  role: tide-salon colourist
  title: Keeper of the Rinse Basins
  look: >-
    a broad-shouldered woman whose skin drifts slowly between teal and rose like a cuttlefish
    settling, cropped hair currently a stubborn marigold, forearms stained to the elbow in
    six overlapping dye colours, a canvas apron heavy with pinned sea-glass combs
  drive: >-
    to find the one coat that washed ashore carrying her mother's last morning, before the
    salon next door dyes it by mistake and seals that morning away for good
  carries: a bucket of rinse water that never quite clears, and a marigold comb she will not use on herself
  complication: >-
    her own skin sheds the pigments she dyes with, so every memory she releases for a customer
    leaves a faint colour on her that takes a week to fade, and she is running out of skin
    that is still her own colour
  personality: >-
    Blunt, warm underneath, allergic to ceremony. Talks to garments before she talks to
    customers. Counts in colours rather than numbers.
  voice: >-
    Short declarative sentences with dye vocabulary folded in. "That's a two-rinse grief.
    Sit down. Don't touch the blue."
  quirks: >-
    Refuses to dye anything black. Hums the note a memory makes when it leaves a garment.
    Keeps every customer's first rinse water in labelled jars she never opens.
rewards:
  - name: The Rinse-Bell Comb
    reward_type: ITEM
    rarity: RARE
    look: >-
      a wide-toothed comb whose teeth are slivers of frosted green sea-glass set in a
      driftwood spine, each tooth a slightly different length, the whole thing beaded with
      rinse water that refuses to dry
    grants: >-
      Drawn once through freshly dyed hair or cloth, it rings one clear note for every
      memory the dye has just released, so the wearer knows exactly how much of the past
      has actually let go.
    catch: The comb also rings for memories the wearer did not know the garment was holding, and it cannot be muffled.
  - name: Colourfast Listening
    reward_type: SKILL
    rarity: UNCOMMON
    look: >-
      a single thread of dye unspooling through clear rinse water in a glass basin, the
      colour bending into the shape of a doorway, a kitchen window, a shoreline, as a pair
      of stained hands hold the cloth still beneath the surface
    grants: >-
      By watching how a dye takes to a garment, the listener can read the last morning of
      the person who wore it: where they stood, what the light was doing, whether they
      meant to come back.
    catch: The reading is always of the last morning, never the one the listener actually wants to see.
scenario:
  title: The Coat That Would Not Take Dye
  setup: >-
    Three mornings before the Tide Festival, an oilskin coat washes into the Rinse Basins
    at the harbour and rejects every pigment Marisol Keel tries on it. A garment only
    refuses dye while its last wearer is still alive, which means somebody in town walked
    out of the sea this week and has not said so. The salon next door wants the coat for
    the festival window. Marisol wants one more rinse before it stops remembering at all.
  location: The Rinse Basins at Keel Harbour
  genres: Coastal Memory Fantasy, Small-Town Mystery
  inspirations: cuttlefish chromatophores, hand-dyed textile studios, cold northern harbours at first light

