slug: the-borrowed-weather
title: The Borrowed Weather
vibe: A mountain town rents its weather from the valleys below by the hour, and the bill always comes due.
idea: >-
  Too high for weather of its own, the town of Skarrow leases it: an hour of the fishing
  valley's fog for the morning market, forty minutes of orchard sun for the school run,
  a borrowed storm on the night before harvest so the fields believe they are lower down.
  The brokers who haul weather up the pass in sealed clay jars are the only trade in town,
  and every jar that breaks on the road is somebody else's afternoon gone missing.
style: "layered paper-cut collage, visible paper fibers, simplified cut shapes, physical layer shadows, tactile depth, hand-cut irregular edges"
character:
  name: Pell Hawthorne-Sike
  species: Human
  gender: girl
  presentation: fourteen, wind-burned cheeks, oversized broker's coat with a jar-harness sewn into the lining
  genre: Alpine Trade Fantasy
  role: apprentice weather-broker
  title: Youngest Jar-Runner on the Pass
  look: >-
    a wind-burned fourteen-year-old in a broker's coat two sizes too big, six sealed clay
    jars strapped across her chest in a leather harness, each jar sweating a different
    weather at its seams, a wisp of borrowed fog leaking from one cracked lid, snow on her
    boots and orchard blossom caught in her hair at the same time
  drive: >-
    to haul a whole day's weather up the pass in one run, unbroken, the way her mother
    could, before the town council gives the family route to the brokers from the low road
  carries: a jar-harness, a lid-wax stick, and a ledger of which valley is owed what
  complication: >-
    she has started keeping the last inch of every borrowed weather for herself, a
    thumbnail of somebody else's sun in a jar under her bed, and the valleys are beginning
    to notice their afternoons coming back short
  personality: >-
    Fast, proud, secretly homesick for weather she has never had. Bargains like an adult
    and sulks like a kid. Talks to jars.
  voice: >-
    Quick and transactional, softening only about the sky. "Forty minutes of sun, that's
    two jars and I carry them, not you. Careful, that one's still raining."
  quirks: >-
    Labels jars with the smell of the weather instead of the valley. Cannot sleep in
    silence and keeps a jar of distant thunder cracked open at night. Refuses to sell fog.
rewards:
  - name: The Hourglass Barometer
    reward_type: ITEM
    rarity: RARE
    look: >-
      a squat brass hourglass whose two glass bulbs hold miniature weather instead of sand,
      a slow blizzard in the top bulb sifting down into a tiny sunlit meadow in the bottom,
      the brass frame engraved with worn valley names, a leather strap for hanging it from
      a harness
    grants: >-
      Turned over, it shows exactly how many minutes of a borrowed weather remain before
      it drains back down the pass to its owner, so a broker can promise an honest hour.
    catch: The barometer measures only rented weather; a sky that belongs to you shows nothing at all.
  - name: Cloud Credit
    reward_type: SKILL
    rarity: UNCOMMON
    look: >-
      a sealed clay jar held up against a bare blue sky, and from its mouth a single
      cut-paper cloud unfolding into the empty air, the cloud's shadow already falling on
      the mountain path below before the cloud itself has fully formed
    grants: >-
      The practitioner can release a weather she has not yet paid for, on credit against a
      future haul, buying a town an hour of rain it needs today.
    catch: Every hour taken on credit is owed back with interest in weather, and the valleys collect in storms.
scenario:
  title: The Blizzard Nobody Ordered
  setup: >-
    On the morning of Skarrow's harvest fair a blizzard arrives that no broker sold, no
    jar carried and no valley admits to lending. It is the wrong season, the wrong
    altitude and the wrong colour of snow. Pell Hawthorne-Sike recognises it: it is the
    sum of every last inch she kept back, returned all at once, and it is falling on
    the one day the whole town is outdoors. She has six empty jars and a barometer that
    reads nothing, because this weather belongs to her.
  location: the harvest fair on Skarrow's high meadow
  genres: Alpine Trade Fantasy, Coming-of-Age Weather Story
  inspirations: mountain trading passes, apothecary jars, paper-cut dioramas, the smell of weather before it arrives

