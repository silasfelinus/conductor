slug: tom-tomtum
title: Tom Tomtum and the Long Quiet
vibe: A rock gnome monk who learned more in one loud night than in fifty quiet years finally goes out to see the world.
idea: >-
  Silas's D&D character, written up as a Kind Robots object set (2026-09-06). Tom Tomtum
  is a third-level rock gnome monk with glasses, ADHD, a kama sickle, a pan flute he plays
  only so well, and a giant, very old turtle companion named DeeDum who talks to him and,
  as far as anyone else can tell, to no one else. He spent fifty years as a novice at a
  contemplative monastery before one night of pillagers taught him more than sixteen
  hours a day of silence ever had, and everyone agreed his path led out the gate.
designer: silasfelinus
creation_source: HYBRID
facets: [high-fantasy]
style: "luminous gouache storybook painting, matte pigment, simplified confident shapes, soft edge variation, layered hand-painted texture"

locations:
  - title: The Monastery of the Long Quiet
    known_for: >-
      The Monastery of the Long Quiet is known for keeping sixteen hours of silence every
      day and for measuring a novice's progress in stillness rather than in years.
    local_rule: >-
      Speech is permitted for eight hours a day, and the bell that ends them is the last
      sound anyone makes until morning.
    best_scene: >-
      Fifty years of quiet ended in a single night when pillagers came up the terrace
      steps and a small gnome ran screaming down them with a sickle in his hand.
    art_direction: >-
      a mountain monastery of pale stone terraces stacked up a hazy slope, a wide
      meditation terrace with rows of worn cushions, a single bronze bell under a wooden
      roof, prayer banners hanging still in windless air

characters:
  - name: Tom Tomtum
    species: Rock Gnome
    gender: man
    class: Monk
    level: 3
    alignment: Chaotic Good
    genre: High Fantasy
    role: wandering monk and late bloomer
    title: Novice of the Long Quiet
    honorific: the Distractible
    presentation: >-
      a small wiry rock gnome in his fifties with round brass-rimmed spectacles, a
      threadbare monastery robe, a kama sickle at his belt and a pan flute on a cord
    art_prompt: >-
      a small rock gnome man in his fifties with round brass spectacles and a threadbare
      monastery robe, sitting cross-legged in an attempted meditation pose on the broad
      mossy shell of a very old giant turtle, his eyes open and his whole head turned to
      follow a single bright butterfly fluttering just above him, a kama sickle at his
      belt and a pan flute on a cord around his neck, the turtle's ancient patient face
      looking straight ahead, a sunlit monastery terrace and mountain haze behind them
    drive: >-
      to learn from the loud world what fifty years of silence could not teach him, and to
      prove that a monk who cannot sit still can still be a monk
    carries: >-
      a kama sickle he once ran screaming at a brigand with, a pan flute he plays only so
      well, and a pair of spectacles he is forever pushing back up his nose
    complication: >-
      fifty years at the Monastery of the Long Quiet earned him a third level and a kind,
      unanimous request to go find his path somewhere noisier
    backstory: >-
      Tom Tomtum spent fifty years as a novice at the Monastery of the Long Quiet, a
      contemplative order that keeps sixteen hours of silence a day and measures progress
      in stillness. He was terrible at it. His mind wandered, his knee bounced, and every
      butterfly that crossed the meditation terrace took him with it. His teachers were
      kind and patient, and it slowly became clear to everyone that he was a poor fit for
      their training. Then pillagers came for the monastery one night, and Tom, who had
      never once finished a full hour of sitting, ran screaming down the terrace steps at
      a brigand with his kama in hand. The monastery was saved, and Tom was instrumental
      in saving it. He learned more in that one loud night than in fifty years of quiet,
      and he and his teachers agreed, without a hard feeling between them, that his path
      led out the gate. He walks it now at third level beside a giant, very old turtle
      named DeeDum, whom he talks to constantly and who, as far as anyone else can tell,
      never answers.
    quirks: >-
      Pushes his spectacles up his nose before every sentence. Loses the thread of any
      conversation to a passing butterfly, bird or interesting rock. Plays a pan flute
      only so well, and knows it. Talks to his turtle DeeDum as though she answers, and
      waits for her replies.
    personality: >-
      Warm, restless, and cheerfully aware of his own limits. Fifty years among
      contemplatives left him with real patience for other people and none at all for
      himself. He is braver than he thinks and calmer than he looks, but only in the
      moments that matter.
    voice: >-
      Bright, quick, and prone to trailing off mid-thought. Starts strong, gets
      sidetracked, and circles back with an apology. Addresses DeeDum aloud and relays
      her answers as if everyone heard them.
    sample_response: >-
      Right, so, the plan is we go in quiet, the way the abbot taught me, and then we, oh,
      hold on, is that a swallowtail? Sorry. Sorry. DeeDum says to stop apologizing. She
      says we go in loud. She is usually right.
    achievements: >-
      Instrumental in saving the Monastery of the Long Quiet from pillagers. Completed
      fifty years of novitiate. Reached third level.
    might: COMMON
    grace: RARE
    wits: UNCOMMON
    charm: UNCOMMON
    empathy: RARE
    luck: EPIC
    facets: [gnome, monk, chaotic-good, adventurous]

  - name: DeeDum
    species: Giant Turtle
    gender: female
    class: Companion
    alignment: True Neutral
    genre: High Fantasy
    role: companion and confidante
    title: The Old One Who Carries
    honorific: the Unhurried
    presentation: >-
      an enormous ancient turtle with a moss-greened domed shell, a wrinkled leathery
      neck, and dark unblinking eyes that have seen a great deal
    look: >-
      an enormous very old turtle with a high moss-greened domed shell, deep growth rings
      on every scute, a wrinkled leathery neck and calm dark eyes, resting on a sunlit
      stone terrace with mountain haze behind her
    drive: >-
      to carry Tom Tomtum wherever he is going, at exactly the pace he needs and never
      the pace he wants
    carries: Tom Tomtum, mostly, and the patience of several centuries
    complication: >-
      she talks to Tom constantly, no one else has ever heard her say a word, and she has
      never once explained the difference
    backstory: >-
      DeeDum is a very old female turtle of enormous size and no recorded origin. She was
      already ancient when she arrived at the Monastery of the Long Quiet, and she
      outlasted three abbots there without anyone learning where she came from. When Tom
      Tomtum left the monastery she left with him, or possibly he left with her. Tom
      talks to her constantly and reports her replies faithfully. No one else has ever
      heard her speak, and she has never explained the difference.
    quirks: >-
      Answers only Tom, and only in his hearing. Stops walking when she disagrees with
      the route. Eats slowly enough to end arguments.
    personality: >-
      Patient past the point of reason, dry, and fond of Tom in the way of someone who
      has decided to see how this turns out. She has a very long memory and a very short
      list of things she considers urgent.
    voice: >-
      As reported by Tom: short, dry, and unhurried, with pauses long enough to make a
      point. She never raises her voice, because as far as anyone else can tell she has
      none.
    sample_response: >-
      You ran at him screaming, Tom. That was the lesson. It was never going to be the
      sitting.
    might: RARE
    grace: COMMON
    wits: LEGENDARY
    charm: RARE
    empathy: LEGENDARY
    luck: UNCOMMON
    facets: [patient, mentor, true-neutral]

