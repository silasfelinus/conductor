slug: dust-choir
title: Dust Choir
vibe: Once a year a city is built out of instruments in the desert, and when the wind blows the city plays itself.
idea: >-
  A temporary city raised for nine days on a dry lakebed, every structure a working
  instrument: towers of organ pipe, reed-fence streets, a drum-skin dome. When the wind
  comes down off the mountains the whole city sounds at once. On the last night they burn
  the tallest structure, and for forty years the final chord has never resolved. The
  wind-luthiers say the city is one instrument short.
facets: [ashfall-cities, artistic, brooding]
style: "high-contrast risograph aesthetic, limited spot-color layers, coarse paper grain, slight registration offsets, bold graphic silhouettes"
character:
  name: Tamsin Okonkwo-Reyes
  species: Human
  gender: nonbinary
  presentation: dust-goggled, shaved head, sun-cracked lips, a tuning fork through one ear
  genre: Desert Sound Fantasy
  role: wind-luthier
  title: Voice of the Ninth Street
  look: >-
    a lean dust-caked person with a shaved head and brass goggles pushed up on their brow,
    a long tuning fork worn through one earlobe, a canvas coat sewn with dozens of small
    reeds that flutter in any breeze, one hand resting on a half-built organ pipe taller
    than they are
  drive: >-
    to tune the city so precisely that this year's final chord resolves for the first
    time in forty years, before the burn takes the evidence with it
  carries: a roll of reed blanks, a bow-saw, and a pitch pipe that plays the one note the city has never made
  complication: >-
    the missing instrument the chord needs is a human voice held at a pitch no living
    person can sustain, and Tamsin is the only one who has ever come close
  personality: >-
    Patient to the point of eeriness, then suddenly reckless. Hears rooms before they see
    them. Cannot stand a note left hanging.
  voice: >-
    Speaks in intervals and weather. "That's a fifth off the ridge and a whole tone of
    dust. Give me an hour and a south wind."
  quirks: >-
    Tunes strangers' zippers and tent poles without asking. Sleeps inside the drum dome
    to listen to it settle. Refuses to hear the final chord recorded.
rewards:
  - name: The Reed of Third Wind
    reward_type: ITEM
    rarity: RARE
    look: >-
      a single dark cane reed the length of a forearm, split at one end into a fine
      vibrating tongue, mounted in a scratched brass socket on a weathered post, a thin
      trail of lifted dust curling off its tip as though it has just sounded
    grants: >-
      The reed stays silent through the first gust and the second, and sounds only in the
      third wind, the one after the one you were waiting for, giving its holder a note
      that arrives exactly when they have given up.
    catch: There is no way to tell which gust is the second, so the holder must stand and wait through every wind.
  - name: Dust Harmony
    reward_type: SKILL
    rarity: UNCOMMON
    look: >-
      a half-built framework of organ pipes and reed lattice on a cracked white lakebed,
      the air around the unfinished structure visibly shimmering into thin bands of
      colour, as though the note it will sing is already hanging in the space it will fill
    grants: >-
      The listener hears the note a structure will sing before it is built, so a street of
      reeds can be tuned while it is still a sketch in the dust.
    catch: Once heard, the future note cannot be un-heard, and a structure that is never built keeps sounding in the listener's head.
scenario:
  title: The Unresolved Chord
  setup: >-
    An hour before the burn, the wind dies completely. Nine days of tuning and a city of
    instruments stand silent under a windless sky, and the chord that has never resolved
    is not going to sound at all. Tamsin Okonkwo-Reyes climbs the tallest pipe with a
    bow-saw and a plan to play the city by hand, and every luthier on the lakebed has to
    decide whether to hand-pump a street, bow a fence, or sing.
  location: the tallest organ tower on the dry lakebed
  genres: Desert Sound Fantasy, Festival Ensemble
  inspirations: temporary desert cities, wind-driven aeolian harps, pipe organ building, reed fences

