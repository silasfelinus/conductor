slug: the-gravity-circus
title: The Gravity Circus
vibe: Gravity in the Lean Valley tilts a few degrees every night, and the circus is the only thing that keeps up.
idea: >-
  A travelling circus that has parked for a season in a valley where down is not a fixed
  direction. Every night the floor of the world leans a little further, and every morning
  the acrobats, glasswalkers and fire jugglers recalibrate their acts to the new slope. The
  town's children learn to walk on the lean before they learn to read. Everybody is waiting
  for the night the valley turns fully sideways.
style: "tactile stop-motion miniature aesthetic, sculpted clay and felt surfaces, handmade imperfections, practical miniature lighting, shallow depth of field"
character:
  name: Odalys Ferrante-Quill
  species: Kestrel-kin
  gender: nonbinary
  presentation: hollow-boned and wiry, russet feather-crest, barefoot on broken glass by choice
  genre: Physical Circus Fantasy
  role: glasswalker and partner acrobat
  title: Second Catcher of the Lean Line
  look: >-
    a wiry hollow-boned figure with a russet kestrel crest instead of hair, bare feet
    resting easily on a bed of broken bottle glass, chalked hands, a patched velvet
    leotard the colour of old brass, a spirit level strapped to one forearm like a watch
  drive: >-
    to walk the Lean Line on the night gravity turns fully sideways, the one crossing no
    performer in the circus's history has finished standing up
  carries: a coil of frayed catching rope and a spirit level that has never once read true
  complication: >-
    kestrel-kin bones are light enough to fly a little, and every night the lean grows, the
    floor pulls less and the sky pulls more, so their greatest act may be the night they
    simply do not come back down
  personality: >-
    Dry, exacting, generous with credit and stingy with fear. Treats the audience like a
    second partner who has not learned the choreography yet.
  voice: >-
    Counts everything out loud in fours. "Glass, breath, lean, step. Again. You're fine.
    The floor is the one that's moving."
  quirks: >-
    Recalibrates their spirit level every dawn even though it never agrees with the valley.
    Sleeps standing against the tent's uphill pole. Names each night's slope like a
    weather front.
rewards:
  - name: The Plumb-Bob Lantern
    reward_type: ITEM
    rarity: RARE
    look: >-
      a small brass lantern hanging from a heavy chain, its flame burning steadily inside
      scratched amber glass, the whole lantern hanging at a visible tilt from the hook it
      is clipped to, the chain taut in a direction the floor beneath it does not agree with
    grants: >-
      The lantern always hangs toward tomorrow night's gravity rather than tonight's, so
      whoever carries it knows a full day early which way the world is about to lean.
    catch: On the night gravity turns sideways the lantern hangs straight out, and nobody knows what it will point at the night after.
  - name: Counterlean
    reward_type: SKILL
    rarity: UNCOMMON
    look: >-
      a tilted tent interior seen from the ringside, rows of felt benches and hanging
      trapeze bars all slumped to one side, and in the centre of frame a single pair of
      chalked bare feet planted at a different angle from everything else, casting the
      only upright shadow in the ring
    grants: >-
      The practitioner leans against a gravity that has not arrived yet, standing at
      tomorrow's angle so that when the valley tilts mid-performance they are the only
      steady thing in a sliding crowd.
    catch: Until the lean actually arrives, the practitioner looks like the one person in the room who is about to fall.
scenario:
  title: The Night the Big Top Slid
  setup: >-
    Halfway through the closing show the valley leans past every mark on the tent's
    uphill pole, and the stakes let go. The big top begins to slide downslope with two
    hundred people inside it and the ring turning into a wall. Odalys Ferrante-Quill is
    already on the Lean Line, forty feet up, holding the only rope that still runs
    uphill. The audience has to be walked out along the ridgepole, in the dark, in fours.
  location: the big top at the bottom of the Lean Valley
  genres: Physical Circus Fantasy, Disaster Ensemble
  inspirations: glasswalking and partner acrobatics, tilting-room illusions, canvas tents in mountain wind

