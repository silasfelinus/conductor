slug: ferrywake
title: Ferrywake
vibe: Every crossing of the Wake takes exactly as long as the story told aboard, and the far bank waits.
idea: >-
  The river Wake cannot be measured in distance. A ferry crossing lasts precisely as long
  as the tale its passengers tell on the way, no shorter and no longer, and a boat that
  falls silent mid-river simply stops. The ferry-tellers who work the crossing are part
  boatman, part bard and part hostage negotiator, because the far bank moves closer with
  every good sentence and recedes with every bad one.
facets: [birdfolk, calm, caring]
style: "stained-glass mosaic aesthetic, strong leaded contours, jewel-tone translucent panes, fractured colored light, geometric shape language"
character:
  name: Ambrose Quillfeather
  species: Heron-folk
  gender: man
  presentation: tall, grey-plumed, long-necked, a patched oilcloth cloak, an oar worn smooth as bone
  genre: River Folk Fantasy
  role: ferry-teller of the Wake
  title: Keeper of the Short Crossing
  look: >-
    a tall grey heron-folk man with a long feathered neck and a patient yellow eye,
    standing at the stern of a flat river ferry with a long oar worn pale as bone, a
    patched oilcloth cloak pinned with dozens of small brass story-tokens, river mist
    curling at knee height and the far bank glowing behind him in fractured coloured light
  drive: >-
    to finish the one story he has been telling across the Wake for eleven years, a
    crossing so long the passengers who began it have grandchildren, before the river
    decides it has heard enough and lets the boat stop
  carries: a bone-pale oar and a pouch of brass story-tokens, one per crossing survived
  complication: >-
    heron-folk cannot lie, so every story he tells is true, and the eleven-year crossing
    is his own life told at exactly the speed he is living it
  personality: >-
    Unhurried, dry, kind in the way of someone who has watched a lot of people panic in
    boats. Never repeats a sentence. Treats silence as a hazard.
  voice: >-
    Long, level sentences that always leave a hook at the end. "We're about a chapter from
    the bank. Somebody tell me what happened to your sister, and make it interesting."
  quirks: >-
    Stands on one leg while rowing. Refuses to carry anyone who says they have no stories.
    Keeps the ferry's old lantern lit through the day so the far bank can see him coming.
rewards:
  - name: The Short-Story Oar
    reward_type: ITEM
    rarity: RARE
    look: >-
      a single long ferry oar of pale weathered ash, its blade carved with a spiral of tiny
      scenes that read like a page when the light catches them, the grip wrapped in
      river-stained red cord, resting across two mooring posts above dark still water
    grants: >-
      Each pull of this oar tells one complete tiny story on the teller's behalf, so a
      crossing can be finished in a dozen strokes when nobody aboard has a word left.
    catch: The oar's stories are short and it has told most of them; each crossing the boat lands a little less far from where it began.
  - name: Cliffhanger Mooring
    reward_type: SKILL
    rarity: UNCOMMON
    look: >-
      a flat river ferry held motionless in the exact middle of a wide dark river, mist
      on both sides, a mooring rope stretched taut from the bow into open water and
      tied to nothing visible, the far bank a thin bright line of coloured glass
    grants: >-
      By ending a sentence at exactly the right unfinished moment, the practitioner can
      hold the ferry still in mid-river until the next sentence arrives, safe from both banks.
    catch: The mooring holds only while everyone aboard genuinely wants to know what happens next.
scenario:
  title: The Crossing With No Ending
  setup: >-
    A passenger boards Ambrose Quillfeather's ferry and begins a story with no ending at
    all, one that circles back to its own first line, and the Wake takes it seriously:
    the far bank stops approaching and starts, very slowly, to recede. The other
    passengers realise the crossing will last exactly as long as this story does, which
    is forever, and that the only way off is to interrupt a stranger's tale with a better
    one before the lantern oil runs out.
  location: mid-river on the Wake, just past the point of no return
  genres: River Folk Fantasy, Storytelling Ensemble
  inspirations: chain-ferries, Scheherazade, herons standing in shallows, stained-glass river windows

