    title: Make the Cypress prod-deploy-wait step tolerant of rapid successive merges
    status: review
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-07-15T17:14:33Z'
    note: 'IMPLEMENTED 2026-07-15 (claude-burst-2026-07-15-1705): kind_robots PR #294 (branch claude/keen-fermat-wx9tho). Implemented suggested fix (a): the deploy-wait step in .github/workflows/cypress.yml now checks whether TARGET_SHA is a git ancestor of the live commit whenever the exact-match check fails, treating a superseding commit (one that already contains TARGET_SHA''s changes) as a live deploy instead of timing out. The shallow checkout is only deepened (git fetch --depth=200 origin main) when this ancestry check is actually needed, so the common exact-match path is unaffected. Verified: YAML parses; the new bash ancestry logic was tested against two isolated scratch git repos mirroring the shallow-checkout CI environment -- one simulating a genuinely superseding commit (accepted) and one simulating a sibling-branch commit that does NOT contain TARGET_SHA (correctly rejected). No live-CI verification possible without an actual merge-burst race; the next rapid-merge session will confirm end-to-end. Awaiting PR #294 CI before merge.'
