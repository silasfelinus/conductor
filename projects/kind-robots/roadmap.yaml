      verifyWorkflowPaths.ts heuristic only flags `run:`-step tokens ending in
      a known extension (ts/tsx/js/mjs/cjs/py/sql/sh/json/yml/yaml/prisma), so
      an extension-less path reference (e.g. `git diff --quiet -- stores/fallback`)
