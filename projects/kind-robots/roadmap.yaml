  - id: t-008
    milestone: m4
    title: "Design brief: private-but-shared content and per-user project sharing"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: >
      From Silas's 2026-07-05 session direction (digital store relaunch). Two related
      needs: (1) PRIVATE-BUT-SHARED CONTENT — content owned by one user (e.g. Silas's
      private packmaker DLC packs) that specific other users, or purchasers, can be
      granted access to. Today content is roughly public-or-private; DLC unlocks and
      pack previews need a middle state. (2) PROJECT SHARING — a user can grant
      another user viewing or admin rights to certain areas/projects. Write
      projects/kind-robots/SHARING-SPEC.md covering: the grant model (who/what/level),
      which existing models need visibility fields vs a new grant table, API surface,
      and how storefront entitlements plug in (a purchase IS a grant). Schema changes
      to the shared backend go through a pitch per BOUNDARY.md — this task is the
      design, not the migration. Silas framed the packmaker DLC slice as a deliberate
      low-stakes security test of exactly this infrastructure; see packmaker/roadmap
      and digital-storefront t-017.

      DONE 2026-07-16 (autonomous hourly cycle): wrote
      projects/kind-robots/SHARING-SPEC.md. Grounded in the actual kind_robots
      schema (grep-verified: no Grant/Permission/Share/ACL model exists today,
      visibility is a repeated isPublic boolean across ~20 models, closest
      structural precedent is UserRelation). Proposes one generalized Grant
      model (subjectType/subjectId polymorphic, not one table per content
      type) covering both project-sharing and content-unlock cases, a shared
      canView() helper to replace ~140 duplicated per-route ownership checks,
      an illustrative API surface, and how a storefront purchase becomes a
      Grant row (source: PURCHASE) — directly unblocking digital-storefront
      t-017's entitlement design. No schema change, no migration, no route
      code — design only, per BOUNDARY.md; the actual Prisma migration is a
      separate future pitch. Left three open questions for Silas in the doc
      (ADMIN sub-permissions, revoke-vs-refund interaction, and whether to
      pre-add an unused PACK enum value now vs. deferring to whichever pitch
      adds packmaker's Pack model).
