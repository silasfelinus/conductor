      ANSWERED 2026-07-26 (Silas ran `setx KR_API_TOKEN '...'` then
      immediately `python3 scripts/reconcile_expressions.py --apply` in the
      same PowerShell window and got "--apply requires KR_API_TOKEN"):
      classic Windows `setx` gotcha — `setx` writes the value to the registry
      for *future* processes, but it does NOT update the environment of the
      PowerShell session it was run in. The window that ran `setx` still has
      the old (unset) environment; only a *new* terminal window opened after
      the `setx` call will see it. Two ways to fix:
      1. Close and reopen PowerShell (a fresh window), then just run
         `python3 scripts/reconcile_expressions.py --apply` directly — no
         need to set anything again, `setx` already persisted it.
      2. Or, without opening a new window, set it for just the current
         session: `$env:KR_API_TOKEN = '...'` (PowerShell) then run the
         script in that same window — this doesn't persist for next time,
         but works immediately.
      Either way should clear the error. Once the numbers look sane, set
      status: done here.

