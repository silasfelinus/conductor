- id: t-102
  milestone: m6
  title: "Decide and implement whether the home showcase should server-render"
  status: ready
  passes: 0
  stakes: reversible
  owner: null
  note: >-
    Split off t-078's remaining-work item 3, which didn't fit that task's scope. Right now
    home-page.vue fetches the whole home showcase (hero + all six rails + the projects strip)
    from a single homeShowcaseStore.load() call inside onMounted, so the front page's first
    paint is always a skeleton -- there is no SSR path for any of it.


    Scope: decide whether to move that fetch to run during SSR (e.g. via useAsyncData wrapping
    homeShowcaseStore.load, or an equivalent), and implement it if so. performFetch already
    resolves relative URLs to absolute ones under import.meta.server (see stores/utils.ts's
    resolveRequestUrl), which suggests the store is not fundamentally hostile to SSR, but this
    has not been exercised for this endpoint and the whole page's layout depends on the same
    fetch, so a naive change risks a hydration mismatch (stale skeleton state briefly disagreeing
    with server-rendered markup) across every rail, not just the hero.


    Verification should cover: vue-tsc/eslint clean as usual, but also an actual check for
    hydration warnings (dev server console, or a component test that mounts server then
    hydrates client) rather than relying on vue-tsc/eslint alone -- neither catches a hydration
    mismatch. If SSR genuinely isn't worth the risk for this page, it is also a legitimate
    outcome to record that decision and its reasoning here and close the task without a code
    change; either way, do not leave this open on "should" without concluding it.
  updated: '2026-09-14T11:41:29Z'


