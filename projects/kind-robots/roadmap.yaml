      job runs on that PR, which today already happens. What's missing is a
      cheap, targeted CI step that specifically diffs new/changed
      `.exec(`/`.match(` call sites in a PR against the guard patterns
      documented in t-027's note (optional chaining + `??`, `if (!match)`
      early-return, default-valued destructuring, or a post-truthy-check `!`
      assertion) and fails with a clear, specific message pointing at the
      unguarded line — rather than relying on vue-tsc's generic TS2345 error,
      which is correct but not self-explanatory to a first-time contributor.
      t-030's note already flagged that a similarly-shaped heuristic (bare
      path-token detection) has real false-positive risk and needs careful
      design — this task should scope narrowly (new/changed lines only, via
      git diff against origin/main, not a whole-repo scan) and treat a
      reasonable false-positive rate as acceptable given vue-tsc is still the
      backstop. Small and mechanical if scoped to diff-only; escalate to
      needs-human if the false-positive rate in practice turns out too high
      to be useful.

