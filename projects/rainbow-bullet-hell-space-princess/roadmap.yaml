# Rainbow Bullet Hell Space Princess — new standalone Arcade campaign, Silas 2026-10-11 PT.
project: rainbow-bullet-hell-space-princess
kind: software
autonomous: true
goal: >-
  Ship a lavish, complete original side-scrolling bullet-shmup campaign in the
  Kind Robots Arcade: pink and pastel-rainbow future-tech oceanic space opera,
  1–4 simultaneous browser players with local and online co-op, fair readable
  but demanding combat, at least eight authored multi-phase stages, distinct
  branching routes, eight end-stage bosses and a final boss, sea-life-inspired
  enemy fleet, varied upgradable weapons, shields, pickups, limited supers,
  foreground/midground/background parallax, animation, cinematic opening,
  interludes, multiple endings, and save/continue/leaderboard integration.
  No runtime LLM. Accept only after measured end-to-end gameplay, 1/2/3/4
  player soak, art and accessibility review, and Silas's hands-on verdict.
notes_from_silas: |
  2026-10-11 PT: "a gorgeous bullet shmup inspired by gracious, Darius,
  and r-type, with a focus on gorgeously lavish visuals, fair but challenging
  combat, and a friendly pink and pastel rainbow aesthetic. Rainbow Bullet
  Hell Space Princess. Up to four players simultaneous webgame. Intro and
  cut scenes, ship enemies modeled after sea life (seahorses, jellyfish,
  mantis shrimp, sharks, dolphins, etc) but with a future tech design.
  Powerups, shields, multi-level background scrolling, animations, limited
  super power attacks. as much gameplay, bosses, powerups, and levels as
  any of the aforementioned games at their best. Start and end sequences."

  Interpret "gracious" as Gradius, alongside Darius and R-Type. Use their
  genre benchmarks, not proprietary sprites, enemies, shots, music, names,
  stage routes or level layouts. This must not turn into a five-minute
  survival-wave veneer: build authored stage content, route choices and
  full campaign length. Visual softness is not difficulty softness.
  Build private /admin/rainbow-bullet-hell-space-princess with discoverable
  Admin tab, then gate a public /play entry and Arcade cabinet until approved.
  Existing Arcade rendering/audio/input/score code should be reused where
  fitting, while player and campaign state remain independently owned.
  Internal art and reversible code may begin without creative sign-off;
  public publication, production deployment and final taste acceptance
  remain human gates.
