# Rainbow Bullet Hell Space Princess — new standalone Arcade campaign, Silas 2026-10-11 PT.
project: rainbow-bullet-hell-space-princess
kind: software
autonomous: true
goal: >-
  Ship a lavish, complete original side-scrolling bullet-shmup campaign in the
  Kind Robots Arcade: pink and pastel-rainbow future-tech oceanic space opera,
  1–4 simultaneous local browser players (no online co-op), fair readable
  but demanding combat, at least eight authored multi-phase stages, distinct
  branching routes, eight end-stage bosses and a final boss, sea-life-inspired
  enemy fleet, varied upgradable weapons, shields, pickups, limited supers,
  foreground/midground/background parallax, animation, cinematic opening,
  interludes, multiple endings, and save/continue/leaderboard integration.
  No online rooms, matchmaking, network sync, or multiplayer servers. No runtime LLM.
  Accept only after measured end-to-end gameplay, local 1/2/3/4
  player soak, art and accessibility review, and Silas's hands-on verdict.
notes_from_silas: |
  2026-11-19 PT (latest direction): Online co-op is dropped as too server intensive and beyond scope. Local 1–4-player co-op remains mandatory. Do not build online rooms, matchmaking, network synchronization or host recovery; these are not playtest-readiness blockers. Task t-006 is canceled by this decision.

  2026-10-23 PT, later the same night (verbatim): "Ok, so I want you to do ditch the dog and cats theme…actually,
  just the dogs part. They can be cats and have a special princess kitty power or whatever, that's cool. But keep
  the villains to be the bioecology space animals, and we can develop plot as we go (but having a turn when the
  princesses realize they are supporting the colonizers, and they can choose to attack the empire or stay the
  course for the Motherland". The DOGS are withdrawn; C.A.T.S., cat co-pilots and the doodle look stay. Plot
  spine: PLOT-MOTHERLAND.md. Tasks t-039..t-041.

  2026-10-23 PT (verbatim): "Space princess design. This should have the joyous innocence of an 80's Lisa
  frank inspired artist making doodles in her trapper keeper. A very talented artist. But with the mind of a
  child: the good team is "C.A.T.S.", the villains are DOGS." Decided the same evening: the princesses keep
  their identities and lead C.A.T.S. (cat ships, cat co-pilots); the DOGS command the hypnotized sea fleet
  (bosses get DOG commanders, the Crown Voice becomes King Rufus); the opening is recut from new-style art.
  Full direction: DOODLE-DIRECTION.md. Tasks t-035..t-038.

  2026-10-22 PT (verbatim, after asking Save the Plumber and Ghost Trail to aim for Super
  Mario Bros 3 / Super Mario World depth): "rainbow space princess should have the same
  consideration. games should have memory, recognize progress, etc. So we need open world
  maps, save states, etc. And probably upgrades to pixel expectations and other factors.
  they need an upgrade." For a shooter the matching reference is Star Fox 64: a branching
  route map whose paths open from in-stage conditions, per-stage medals, and persistent
  progress, plus a Palace Hangar that keeps earned upgrades. Shared bar:
  projects/kr-arcade/GEN2-STANDARD.md. Milestone m6 carries it.

  2026-10-11 PT: "a gorgeous bullet shmup inspired by gracious, Darius,
  and r-type, with a focus on gorgeously lavish visuals, fair but challenging
  combat, and a friendly pink and pastel rainbow aesthetic. Rainbow Bullet
  Hell Space Princess. Up to four players simultaneous webgame. Intro and
  cut scenes, ship enemies modeled after sea life (seahorses, jellyfish,
  mantis shrimp, sharks, dolphins, etc) but with a future tech design.
  Powerups, shields, multi-level background scrolling, animations, limited
  super power attacks. as much gameplay, bosses, powerups, and levels as
  any of the aforementioned games at their best. Start and end sequences."

  Interpret "gracious" as Gradius, alongside Darius and R-Type. Use their
  genre benchmarks, not proprietary sprites, enemies, shots, music, names,
  stage routes or level layouts. This must not turn into a five-minute
  survival-wave veneer: build authored stage content, route choices and
  full campaign length. Visual softness is not difficulty softness.
  Build private /admin/rainbow-bullet-hell-space-princess with discoverable
  Admin tab, then gate a public /play entry and Arcade cabinet until approved.
  Existing Arcade rendering/audio/input/score code should be reused where
  fitting, while player and campaign state remain independently owned.
  Internal art and reversible code may begin without creative sign-off;
  public publication, production deployment and final taste acceptance
  remain human gates.
