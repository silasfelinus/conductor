# a fifth of the longer edge) and a "whole creature, nothing touches the edge" line. Ships carry their CAST-QA colour
# and silhouette lock, and Solenne's two pictures carry a skin and hair lock. Same engine and settings as set 1.
# Review the finished cells with the same contact-sheet pass, flip the matching entry in DOODLE-SET-1-REVIEW.yaml to
# keep, then re-run scripts/export_rainbow_doodle_art.py. The exporter takes the latest finished render per asset.
