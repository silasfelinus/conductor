#   keep   the doodle render ships under public/rainbow-princess-art/doodle/<same path>
#   (Silas, 2026-11-05 PT: Fever Dream is the default look, kind_robots#4765.)
#   fever  the doodle render is held back. The CLASSIC sprite ships in its place, given a neon "fever" treatment
