    prompt_prose: >-
      One enormous pearl-armoured manta spacecraft seen from the left side,
      flying toward the left. It has a broad flattened shell of overlapping
      pearlescent oyster plates, two swept turquoise manta wings lined with
      luminous pink pearls, six small articulated fin thrusters, and a
      single large iridescent blue eye under a curved golden brow. Pink
      bioluminescent crescents run down both wings; the underside is deep
      indigo with aquamarine vent lights. Fierce but sympathetic face.
      The entire creature-shaped mechanical ship is visible, compact and
      centred with generous empty margin around every tip of the wings
      and tail. Flat even pure bright green studio background, no scenery,
      no ground shadow. Rich polished western animation linework, glossy
      airbrush shading, saturated neon coral pink, aquamarine, violet and
      pale gold, a delightful retro school-folder sticker illustration.
