    prompt_prose: >-
      One massive otherworldly jellyfish-like mechanical spacecraft facing
      left in side profile, a living guardian of drowned space lighthouses.
      Its translucent bell-shaped helmet has layered violet glass and six
      round luminous gold pearls suspended along its lower rim. Behind
      the glass is a cobalt-blue expressive eye. Four articulated indigo
      and rose-gold metal tendrils curve below the body, and two long
      ribbon fins trail behind it like flowing sea grass. Tiny pearl
      bubbles hang near its mouth but never obscure the silhouette.
      Mysterious and protective, not cruel. The complete body and all
      tendrils fit comfortably inside the view, with broad empty
      margins on every side. Flat even pure bright green background,
      no stars, no ocean, no scenery. Crisp confident western cartoon
      outlines with radiant neon airbrushed pink, periwinkle, cyan and
      gold shading, glossy vintage school-folder sticker aesthetic.
