# have been great for this kind of work in the past." Five Illustrious-family checkpoints already installed on the
# render box x nine FRONT-END subjects (title key art, the four pilot-select portraits, Lilt-7's comms bust, one
# player ship, one enemy, one stage plate) = 45 private ArtJobs. Every lane gets the SAME tag prompt, prefix, suffix,
# negative, seed, sampler (euler_ancestral), steps (28) and CFG (5) -- a setting inside every candidate's
# author-recommended range -- so only the checkpoint varies. The winner becomes the house lane for every later round.
