# Rainbow Space Princess Generation 2 art, round 2 (t-011 / t-028; ROUTE-MAP.md section 7; kr-arcade GEN2-STANDARD.md
# sections 5 and 6.4): separate parallax planes for the four alternate-route stages. GEN2-ROUND-1 kept one flattened
# Krea 2 backdrop per alt (X1 Kelp Nebula 251319, X3 Sunken Lighthouse 251320, X2 Coral Comet 251321, X4 Mirror Shoal
# 251322), and ROUTE-MAP.md says an alt does not count as finished until it has sky / far / mid / near plates rendered
# separately, never one picture cut apart. Four planes per alt (the "at least four parallax planes" bar), two routes:
#   krea2   - txt2img in the house scenery lane (review 2026-10-22: Krea 2 is the Rainbow lane for scenery).
#   kontext - each plane lifted out of that alt's kept backdrop (the ART-ROUND-14 foreground-strip recipe), so the
#             layers share the keeper's shapes and colours.
# Sky plates are full and opaque. Far, mid and near plates sit on flat solid magenta for keying (the round-14
# convention: all 16 S01-S08 strips keyed cleanly on magenta). Pilots and craft stay in their own Kontext/house lanes;
# this round is scenery only. Test tiling and drift speeds in the real cabinet at 390/768/1440 before wiring.
# auto_submit: true. Private.
