# Rainbow Space Princess opening music video, clips round 1 (t-034, 2026-10-23 PT). Silas: "We can use a real
# animation at the beginning, maybe a 15 second high energy thrash metal music video." Nine WAN 2.2 first/last-frame
# clips (the A14B pair, which moves; first-frame-only 5B barely does, see zuzu-pinball T019-CROC-CLIPS.yaml), each
# pinned to one approved still at both ends so every frame stays on model (CAST-QA.md): four story beats, the four
# pilots' super cut-ins for the fast cuts, and the four ships over the palace as the title hit. kind_robots
# utils/arcade/games/rainbowOpening.ts holds the shot list and beat grid; conductor scripts/export_rainbow_opening.py
# cuts the delivered clips (or the still, with a punch-in, for any clip not yet rendered) to the ACE-Step thrash
# track and ships public/rainbow-princess-video/opening.{webm,mp4}. Submit/refresh with
# scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
