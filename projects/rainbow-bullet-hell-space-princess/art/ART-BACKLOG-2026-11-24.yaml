# Rainbow Space Princess art backlog, 2026-11-24 PT: the presentation reviewer's P-04, P-07, P-12, P-14 and P-19
# (REVIEW-ROUND-1-2026-11-23.md). P-07: an s09 finale card, sky, far, mid and foreground strip (the Crown heart and
# its prism corridors) in both looks, so the finale stops reusing Act VIII. P-04: a painted sky (drifting slowly) and
# far and mid planes for every main Act in both looks. P-12: B02 phases 2 and 3 redrawn from the phase-1 sprite as
# damage states. P-14: Fever Dream twins of the X1-X4 detour planes. P-19: a Fever Dream Solenne portrait from her
# identity lock 246032 (CAST-QA). Lesson from DOODLE-STAGE-DEPTH-PLANES-2026-11-22: Kontext planes made from Act cards
# kept the cards' ships, which read as enemies, and one carried a watermark; so every new main-Act plane here is a
# text-only Krea 2 render of pure scenery, with craft, creatures and lettering in the negative prompt. Kontext is used
# only where the source is itself pure scenery (the shipped detour planes), a sprite (B02) or a pilot lock.
# Private. auto_submit: true. Queued is not rendered: every keeper is reviewed at full size before it ships.
