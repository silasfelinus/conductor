# Rainbow Space Princess animation backlog, 2026-11-24 PT (presentation critic P-01, P-03, P-07; Silas: "submit it
# all now"). Framed idle loops (green matte, 0.2 margin, first frame = last) for every enemy, guardian, player ship
# and boss phase without one (spiral, relay, coral and skimmer stay stills after three failed takes; B02 phases 2-3
# wait for their P-12 redraw); one-shot motion for the six ending plates; a Fever Dream S09 card. Private.
round: rainbow-anim-backlog-2026-11-24
project_slug: rainbow-bullet-hell-space-princess
designer: Rainbow Space Princess art bay
is_public: false
is_mature: false
cast_loras: false
priority: 1000
auto_submit: true
lanes:
- key: wan-mp4
