# Memory Dungeon art, round 1 (memory-dungeon t-013 art pipeline + t-019 concept screens + t-018 starter-region art).
# Purpose: the first production art ledger for the RPG mode of the existing /play/memory game -- an original,
# wacky-high-fantasy narrative roguelite where exploration happens on a persistent overworld of discovery tiles
# and combat is the memory card-matching board. Silas 2026-10-22 PT: a persistent explorable overworld of discovery
# tiles; the starter region (Briar Camp, with the Rootbound Vault dungeon, per t-018 / kind_robots PR #4044) is being
# built now on a clean SVG placeholder underlay (public/memory-dungeon/briar-camp.svg, 800x800) that needs real
# painted art.
# Sources: projects/memory-dungeon/{DESIGN-BRIEF.md, WORLD-AND-EXPLORATION.md, STARTER-REGION-DESIGN.md,
# COMBAT-PATTERNS.md, CONCEPT-SCREENS.md, roadmap.yaml t-009/t-011/t-013/t-018/t-019}, plus the authored Briar Camp
# site list in kind_robots utils/memoryDungeonWorld.ts (PR #4044 head) and the layout of its SVG underlay.
# Contents (92 subjects x 2 lanes = 184 cells):
#   5 full-screen concept screens (t-019: overworld explorer, nested match battle with a sword mask + bullseye,
#     treasure/choice cut-in, minefield clue vault, character creator) -- UI implied by physical props, PROPOSED
#     VISUAL DIRECTION, never to be presented as live gameplay;
#   2 Briar Camp overworld maps (a square 1024 straight-down underlay laid out to match the SVG: camp west, road
#     east-west, river down the east third with a plank bridge, creek along the south, merchant hut and root
#     vault arch to the north, thorn gate at the east edge; plus a wide three-quarter overview), 3 Rootbound Vault
#     plates, 10 Briar Camp discovery-tile cut-ins (one per authored site in memoryDungeonWorld.ts), 8 biome plates
#     for later regions (STARTER-REGION-DESIGN.md site atlas);
#   13 recurring-cast portraits (Pip x4, Brass Knight x3, Vesper x3, the Index x3 -- non-canon example cast) and
#     8 selectable player avatars (waist-up, consistent three-quarter pose, flat parchment backdrop; four women,
#     four men, ages young adult to elderly, varied bodies, ethnicities, one orc, one wheelchair user, one
#     prosthetic arm);
#   24 vertical-slice room records (8 encounter, 8 wandering monster, 8 treasure) + 1 guardian;
#   11 weapon/tool hero objects (COMBAT-PATTERNS.md + STARTER-REGION-DESIGN.md earned tools + the Bramble Chime);
#   3 match-card back designs + 1 face-down overworld map tile; 3 first-region ending vignettes.
# Invented names (not in the docs; working fiction, non-canon): Three Witness Statues (truth-teller gate),
#   the Sneezecap Swarm (Sneeze-Worthy Hollow monster), the Crown of Kept Receipts (cursed relic), the Deep Bloom
#   Reliquary (B4 secret treasure), the Litigious Chest (negotiating treasure), the Twin Reliquaries (tampered
#   treasure difference room), the Glyph Wheel Door (sequence lock), the Fungus Physician's look, the Ford
#   Caretaker's look, Mosswick's look. "Bloom Orchard" is the region name behind Thorn Gate in memoryDungeonWorld.ts,
#   painted here as the docs' Backwards Orchard.
# Prompt contract: positive description only (every surface bare and unmarked, deserted scenes), house style in the
#   shared lane suffix. Lanes: Krea 2 and Z-Image Turbo, both prose, both carry the same suffix.
# auto_submit: true -> scripts/sweep_art_ledgers.py submits and refreshes this ledger on every Auto Art Generate run.
# Queued is not rendered; rendered is not shipped. Private (is_public: false); nothing here is canon or released.
round: memory-dungeon-art-1
project_slug: memory-dungeon
designer: Memory Dungeon art bay
is_public: false
is_mature: false
cast_loras: false
auto_submit: true
