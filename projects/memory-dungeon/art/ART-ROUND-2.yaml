# Memory Dungeon art, round 2 (memory-dungeon t-039, Playbook Forge upgrade, 2026-10-27).
# Purpose: queue the 23 pictures that the Forge round-1 PRs added to the game with no ledger entry:
#   12 House epilogues (kind_robots PR #4331, utils/memoryDungeon/houseEpilogues.ts, house/epilogues/<id>.webp);
#    3 House guardian combat plates (PR #4333, utils/memoryDungeon/rooms.ts COMBAT_ROOMS hearth-guard, collector
