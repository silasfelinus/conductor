#    8 World One side-quest plates (PR #4335, utils/memoryDungeon/briarQuests.ts, briar/quests/<id>.webp).
# Prompts are copied word for word from each source's artPrompt, which already ends with the game's style line,
#   so the single Krea 2 lane (the game's artLanes[0]) carries no suffix. The Index Collector prompt is the
#   literal rewrite landing in kind_robots with the round-2 wrapper cleanup ("in armor of overlapping stiff paper
#   sheets" in place of a simile).
# `asset` is the runtime path under kind_robots public/ (export with scripts/export_round_art.py).
# auto_submit: true -> scripts/sweep_art_ledgers.py submits and refreshes this ledger on every Auto Art Generate run.
