# 2026-10-22 PT: Silas-directed evolution of the existing /play/memory game.
project: memory-dungeon
kind: software
autonomous: true
goal: >-
  Evolve the existing Kind Robots Memory Dungeon at /play/memory into a
  replayable art-led narrative roguelite RPG with persistent explored overworld,
  geographically anchored procedural dungeons and Edgeworlds, character creation,
  independently chosen difficulty and depth, an authored intro, seeded
  procedural encounter/monster/treasure piles, spatial weapon shapes that
  change how memory-matching combat works, fair logic minigames and riddles,
  consequential choices, recurrent characters, recruitable and evolving
  companions, run-specific upgrades, save/resume and cross-run Chronicle
  discoveries. Preserve Classic Match and the existing game route/links.
  Finish only after adversarial seeded playtests, meaningful endings,
  balance/accessibility QA and Silas's subjective gameplay verdict.
notes_from_silas: |
  CURRENT CANON, 2026-10-30: Twelve overworlds, not sixteen. Four
  protagonist-focused original/twisted pairs (e01–e08), then four linked,
  increasingly unstable memory-collision maps (e09–e12). Return to the
  protagonist, Morrow, playable Char, and Vesper; recover lost map pieces
  and resolve approximately 32 authored core endings plus variable epilogues.
  World Four may kill Char; World Five sends Scylla into her pre-escape past.
  World Seven is Vesper's childhood Hoshimori, World Eight its grotesque
  yōkai nightmare; Pip's own ledger story remains intact.
  Follow WRITERS-ROOM.md for progressive plot/map/scene details.
  The exact previous long roadmap, task evidence and Silas quotations are
  preserved verbatim in archive/roadmap-2026-10-30-pre-12-world-slim.yaml.
  Do not claim planned maps or art are delivered. Keep Classic Match intact.
  Final public release and subjective creative approval remain human-gated.

