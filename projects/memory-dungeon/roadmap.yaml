# 2026-10-22 PT: Silas-directed evolution of the existing /play/memory game.
project: memory-dungeon
kind: software
autonomous: true
goal: >-
  Evolve the existing Kind Robots Memory Dungeon at /play/memory into a
  replayable art-led narrative roguelite RPG with persistent explored overworld,
  geographically anchored procedural dungeons and Edgeworlds, character creation,
  independently chosen difficulty and depth, an authored intro, seeded
  procedural encounter/monster/treasure piles, spatial weapon shapes that
  change how memory-matching combat works, fair logic minigames and riddles,
  consequential choices, recurrent characters, recruitable and evolving
  companions, run-specific upgrades, save/resume and cross-run Chronicle
  discoveries. Preserve Classic Match and the existing game route/links.
  Finish only after adversarial seeded playtests, meaningful endings,
  balance/accessibility QA and Silas's subjective gameplay verdict.
notes_from_silas: |
  2026-10-22 PT: "New project: an evolution of memory dungeon. Add to conductor
  projects, high priority. Should not need a new front end: we need the
  current memory dungeon to exist as a link from the new front end.
  This will be a full rpg. Create a character, choose a difficulty
  level/dungeon depth. Experience intro. Dive into a dungeon crawler
  where all combat is decided by a memory game. We use the basic memory
  match, but add automate exploration through procedural dungeons,
  complete with riddle challenge rooms, wandering monsters, treasure
  hordes, and other unexpected surprises. Each level is a series of
  draws from piles, encounter, wandering monster, and treasure. We
  can discover other companions through this experience who will
  support us, evolve down experience levels to learn skills, and
  wrapped in a memory match where your memory is your sharpest weapon.
  Your biggest job will be taking this idea into something with a
  solid and fun gameplay loop: explore dungeon, random encounter,
  difficult decisions, etc. recurring characters, hard decisions,
  and an interesting story should be priorities, but also including
  a roguelike experience. The runs should have memory, and future
  runs can discover new combos that will help."

  Later in the same session: "if someone is given a tool that uncovers
  two at a time, how does their play change. We can use larger boards
  and give people weapons that carve out different shapes on the x by y
  grid. So one sword might be two vertical., a hammer might be three
  diagonal, etc. we can do larger boards, and maybe ask different
  challenges. This can truly change the game. Mini games can call
  back to other experiences. Memory can be part of the challenge,
  but other logic puzzles are good too."

  Latest direction (2026-10-22 PT): the large tiled screen is not always
  a memory-matching board. It is a persistent explorable geographic overworld,
  where revealed squares are encounters, treasure, locations, monster spawns
  and terrain. Some discovered terrain elements matched in sequence open secret
  areas. The inner memory combat board is entered FROM an overworld encounter.
  Geographic landmarks remain in fixed positions; procedurally expanding
  themed underworlds and strange Edgeworlds attach to those authored anchors.
  This is a special dungeon within a still-unwritten wacky fantasy world:
  no invented fixed cosmology/canon, only modular worldbuilder-ready systems.
  The *same route* may receive an entirely new art-led **video game** interior
  appearance, with original visual-game concept art for the overworld, combat,
  surprise treasure, puzzle vault and character creation. Separate versioned
  World/Character/Expedition/Chronicle saves are mandatory. Refer to
  WORLD-AND-EXPLORATION.md as latest binding creative direction.

  Design calls: preserve the existing Kind Robots /play/memory entry,
  existing matching engine and Classic Match mode. Build an RPG mode
  into the same page. The 2026-10-21 seven-project focus and previously protected arcade four
  retain their stable tie-breaker order; HIGH-priority Memory Dungeon follows
  those eleven, ahead of ordinary backlog. Reversible design, engine and
  internal art may proceed without waiting for subjective feedback.
  Production deployment and external release remain separately gated.
  See DESIGN-BRIEF.md and COMBAT-PATTERNS.md.

  2026-10-23 PT: Silas explicitly prioritizes Memory Dungeon delivery
  **within this project** in this sequence: (1) all 64 Briar map
  locations playable and individually meaningful (t-021), (2) House
  That Remembers 36-room dungeon including alternate Warden outcomes
  (t-022), (3) the Morrow photograph Chronicle and spoiler-safe
  timeline (t-023), (4) traceable character, map, scene and ending
  ArtJobs with delivered image verification (t-030). The roadmap
  task list is ordered to enforce this priority for sequential
  Conductor selection, not merely tagged as urgent. Chronicle and
  art setup may proceed in parallel on the existing stable map and
  prologue foundations; t-022 retains its map dependency. The first
  world should be produced in small tested and merged batches,
  preserving existing location IDs, Classic Match and saved runs.
  Do not change other projects' previously established relative
  priorities or imply external publication approval.

  2026-10-23 PT: Canon locked for the 16-realm Memory Dungeon isekai:
  an adult real-world protagonist trades bodies and life with fey changeling
  Morrow; 32 discovered photographs show Morrow's unstable, then improving,
  life as a data researcher and ultimately parenthood. The final ethical
  dilemma concerns reclaiming one's body without casually erasing Morrow's
  children and relationships. Twin mermaid princesses Scylla and Charybdis
  (Char) are identical by merfolk identity despite coloration differences,
  sturdy in build, proper versus authentically goth, both quick-witted and
  chaotic. Oren remains perpetually masked, axe-bearing and logistically
  brilliant. Dark Grimm atmosphere with warmth, wit, Fables/Fable/Alice/
  She-Ra inspirations, but original prose and world. See SIXTEEN-REALM-
  PRODUCTION.md and BRIAR-MARCHES-FIRST-WORLD.md; these override obsolete
  provisional named-cast and linear-depth examples, without breaking saves.
