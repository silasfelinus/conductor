  title: Storybook — a world unfolds from the open book
  asset: images/storybook/dashboard-highlight
  size: 1216x768
  seed: 1027401
  prompt_prose: A large open storybook lies on a wooden table in warm lamplight, seen from a slightly raised three-quarter
    angle. From its two pages a paper-craft world rises like a pop-up book, a winding blue river, a castle on a
    green hill, a striped lighthouse, a small sailing ship and a dark pine forest, all joined by glowing golden
    dotted paths that split into three branches toward different horizons. A fan of illustrated playing tiles lies
    across the table in front of the book, each tile painted with one picture, a knight, a dragon, a fox, a moon,
    a key and a small robot. A friendly small round copper robot with glowing teal eyes stands at the right edge
    of the book and places one tile onto the left page with a slim hand. Tiny paper stars float above the pages.
