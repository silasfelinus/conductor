- key: sb-home-feature-02-family-table
  lane: krea2
  entity: home-feature
  title: Storybook — a family builds a story together
  asset: images/storybook/dashboard-highlight-alt
  size: 1216x768
  seed: 1027402
  prompt_prose: A cozy evening kitchen with a round wooden table under a warm hanging lamp. A smiling grandmother
    with silver hair in a bun and a cardigan sits beside a curious ten-year-old with curly hair and a yellow sweater.
    Together they lay illustrated tiles in a row along a long sheet of paper on the table, each tile painted with
    one picture, a dragon, a lantern, a door and a sailing ship. Above the row of tiles, the story they are making
    rises into the air as glowing translucent painted scenes, a dragon circling a castle tower, a sailing ship on
    moonlit waves and a lantern-lit forest path that forks in two directions. A small round copper robot with glowing
    teal eyes sits on the table edge holding an open book and reading aloud. Both faces are fully visible and lit
    by the golden glow of the floating scenes.
