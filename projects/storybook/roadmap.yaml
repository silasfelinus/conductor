  title: "Art for the four mode cards"
  status: claimed
  passes: 0
  stakes: reversible
  note: >-
    The Mode slot is the one card on the Table with no artwork -- MODE_CARDS in
    utils/storybookTableDecks.ts carries an icon and a word, because the four modes are
    concepts rather than records and nothing in the library depicts them. Silas noticed it
    immediately (2026-09-13: "the mode section is missing art for the selections, i hope they
    are queued and not appearing because our art server is currently down") and chose to have
    real art authored rather than reuse something or leave them typographic.

    Four images, through the normal narrative art profile: open-ended (a story with no last
    page), episodic (a plot thread across a set run of scenes), structured (one life told in
    chapters), taskmaster (a quest built from real work). Attach each to its MODE_CARDS entry
    as imagePath, the same field every other card on the Table resolves art from.

    THEY MUST BE TEXT-FREE AND DEPICT THE MODE. This project already learned that once: the
    narrator-voice and structure cards used to be full-bleed getTutorialHeroPath() images --
    tutorial channel banners with STORIES / CHARACTERS / LOCATIONS set in large type across
    them -- which labelled "Cinematic" with a picture that said STORIES and put generated
    typography on screen against the art guidelines. The header comment in
    components/storybook/storybook-visual-setup.vue records it. Do not reuse a banner for its
    dimensions.

    Waits on the art server, which Silas was repairing on 2026-09-13. Not a blocker for
    anything else: the icons hold the slots and the Table works without them.

    Cycle 1 (2026-09-16T23:3xZ, scheduled Conductor session): browser connectivity is no
    longer the blocker (AGENTS.md's 2026-09-16 update -- this environment's Playwright+proxy
    recipe was verified working against example.com and kindrobots.org earlier the same
    day), but t-031's other documented blocker (no test-login/E2E-auth mechanism for an
    authenticated /model-builder click-through) is unrelated to this task and untouched
    here. For t-049 specifically: read MODE_CARDS in utils/storybookTableDecks.ts and
    narrativeIngredientArtwork()/resolveEntityArtwork() in utils/artImageSrc.ts -- imagePath
    is a plain optional string field on NarrativeIngredientOption, the card renders
    aspect-[2/3] (narrative-ingredient-card.vue), so a static 768x1152 image is the right
    shape. Wrote four prompts (one per mode, text-free, following the storybook
    NARRATIVE_ART_PROFILES entry: krea2, steps 4, cfg 1, euler/simple, the shared style
    directive and negative prompt) and enqueued them live via POST /api/art/enqueue
    (priority defaults to 100, above bulk): open-ended=job 26351, episodic=job 26352,
    structured=job 26353, taskmaster=job 26354, all projectSlug storybook / designer
    storybook-auto-director / isPublic true. All four are still PENDING, never claimed by
    the relay after 10+ minutes. GET /api/art/queue/stats confirms why: this is a systemic
    render-backend capacity issue, not a bug in this task -- queueDepth PENDING=1861,
