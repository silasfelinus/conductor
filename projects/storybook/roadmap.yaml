    scripts/generate_davinci_endings.py) against the PRODUCTION database, which needs
    someone/something with real DB write access -- this sandbox only has the app's
    admin API token, not database credentials. Two things worth checking first, since
    either changes the fix: (1) has this seed ever been run against production at all,
    or (2) did it run once and then get wiped/orphaned by the deckId-NOT-NULL migration
