    Chased three concrete hypotheses, ruled out all three with reasoning:

    1. kr-chat-window.vue's visibleStreamingText: traced the marker-hiding logic (`[STORY_STATE]` suffix stripping) through the no-newline-yet edge case (`lastIndexOf('\n') === -1`) and the exact-prefix-match edge case. Both resolve correctly -- the empty-string case when only a partial marker has streamed so far is intentional, not an off-by-one.

    2. narrative-cast-card.vue's dual drag input (native HTML5 drag for mouse via the whole card's `draggable="true"`, custom pointer-event drag for touch/pen via the dedicated "⋮⋮" button, gated by `pointerType === 'mouse'` early-return): traced the dragend-always-fires-after-drop HTML5 spec guarantee to confirm narrative-role-assigner.vue's `@drag-cancel="cancelDrag"` firing after a SUCCESSFUL native drop (dragend fires after drop per spec) is a harmless redundant no-op, not a state-clobbering race -- dropRole() already reset draggingSlug/dragOverRole to null before dragend's own cancelDrag() call arrives, and resetting null to null is inert. Also checked whether a touch gesture could trigger both input paths simultaneously (native drag ancestor + pointer-event button) -- mainstream mobile browsers do not fire native HTML5 drag events from touch input at all, which is consistent with why this codebase built the separate pointer-drag system in the first place; not a live conflict.

    3. narrativeRoles.ts's castLineWithRole(): its docstring's worked example reads differently ordered from the literal template-string concatenation at first glance, which looked like a swapped-argument bug. Traced against its own dedicated contract test (utils/scripts/verifyNarrativeRoles.ts) and the real call site (stores/storybookStore.ts:577, `castLineWithRole(ingredientDescription(member), member.title, member.roleKey)`): the `description` parameter is the FULL "Title — flavor text" line, not bare flavor text, so `${description} [${role.label}] ${title} ${role.promptDescriptor}` produces the intended "Title — flavor text [Role] Title is the role..." shape and the `lead.startsWith(AMI)` contract assertion already exercises exactly this. No bug -- my own first read misjudged the parameter's meaning before checking the call site and test together.

