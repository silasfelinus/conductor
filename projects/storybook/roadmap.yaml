- id: t-010
  milestone: m4
  title: Polish and upgrade Storybook front-end surface
  status: ready
  passes: 0
  stakes: reversible
  note: 'Recurring storybook/t-010 bug-hunt cycle (conductor scheduled Agent run, session sched-conductor-sb-t010-20260817T092738Z, worktree-isolated background agent). Fresh read of storybookStore.ts, storybookLibraryHelper.ts, all storybook components/pages, and shared narrative helpers, cross-checked against all 12 prior verifyStorybook* guards. Found a new, real bug distinct from all prior cycles: openStory() in storybookLibraryHelper.ts unconditionally re-cloned the found session and called resumeNarrativeArtJobs() again even when the requested id was already the live, active session. Two of the three real callers (storybook-library-page.vue''s onMounted() and its route.query.story watcher) already guard this at the call site (from an earlier t-010 cycle), but a third caller -- the "Resume"/"Open" button on the current story''s own card in the Recent Stories panel, visible and clickable while that story is actively playing because upsert() archives the live session into the library on every mutation -- had no such guard and fell through to the unprotected resume. For a beat whose art enqueue is still mid-flight (status ''queueing'', no jobId yet), a second resumeNarrativeArtJobs() call independently finds no existing job and submits a second one, billing two illustrations for one beat. Fix: openStory() now returns early (no-op) when the requested id already matches the live session''s id, protecting every caller at the single choke point instead of relying on each call site to remember its own guard. Added the 13th guard, verifyStorybookActiveStoryResumeGuard.ts + dedicated storybook-active-story-resume-contract.yml, matching the established per-guard-workflow convention. Verified: new guard fails pre-fix / passes post-fix (git-stash round-trip, plus a throwaway behavioral script confirming setSessionCalls/resumeCalls go from 1/1 to 0/0); all 12 pre-existing verifyStorybook* guards pass (no regression); eslint clean; prettier --check clean on new files (pre-existing unrelated formatting drift on storybookLibraryHelper.ts confirmed via git-stash to predate this change); vue-tsc --noEmit repo-wide clean; git status --porcelain showed exactly the 3 intended files. kind_robots PR #1928: all 26 checks green, mergeable_state clean, squash-merged f233cf3. Rearmed to ready per recurring-task convention -- t-010 never reaches done. Next cycle (conductor scheduled Agent run, session 2026-08-18T122908Z-storybook-t010-cron, worktree-isolated background agent, foreground-verified). Fresh read of storybook-page.vue, storybook-library-page.vue and the shared narrative helpers, cross-checked against all 13 prior verifyStorybook* guards. Found a new, real bug: storybook-page.vue''s seedFromQuery() treats `?scenario=`/`?location=`/`?character=`/`?facet=`/`?reward=` as one-shot deep-link ingredients -- it consumes each into the setup draft then strips it via its own router.replace() so a reload/bookmark/share never silently re-adds it. content/storybook.md mounts storybook-library-page.vue as the parent of <StorybookPage/>, so both components'' onMounted() run in the same synchronous tick; storybook-library-page.vue''s own onMounted() calls updateStoryQuery() whenever a session is already active with no ?story= yet (exactly the case of arriving at a deep link like /storybook?character=<slug> while a prior session is still in localStorage). router.replace() resolves asynchronously, so updateStoryQuery() still sees the stale unstripped query key and re-includes it in its own (later, winning) navigation -- resurrecting an ingredient key seedFromQuery() had just consumed. Fix: updateStoryQuery() now strips the same SEED_QUERY_KEYS set on every query rewrite it makes, closing the race regardless of mount order. Added the 14th guard, verifyStorybookSeedQueryRaceGuard.mjs + dedicated storybook-seed-query-race-contract.yml. The background agent opened kind_robots PR #1933 but its own CI run caught a real, separate issue -- the repo''s capture-group-guards contract failed because the new guard indexed a regex-match capture group (constDeclarationMatch[1]) right after only an assert.ok() truthiness check, which that contract requires to be guarded syntactically at the point of use (optional chaining + nullish fallback), not just asserted earlier in the file. The agent''s own final message ended in a stuck/garbled "waiting for background notification" pattern instead of a real report (the same failure shape flagged in today''s model-builder/t-029 cycle-8 TALKBACK entry), so the foreground session pulled ground truth directly from GitHub MCP instead of trusting it, found the real failing check via get_job_logs, and pushed a one-line fix (constDeclarationMatch?.[1]?.matchAll(...) ?? []) directly to the PR branch via the GitHub API. Unrecognized at the time: the background agent, working from its own isolated worktree clone, was independently diagnosing and fixing the identical CI failure concurrently, and misread the foreground''s API-pushed commit (authored under the shared repo-owner git identity) as an unrelated "automated CI-remediation process." It adopted that commit via a hard-reset rather than pushing a conflicting duplicate -- the right call -- then both the agent and the foreground session separately called the merge endpoint; GitHub''s merge is idempotent so only one merge actually happened (same resulting sha both sides observed), but this is a real coordination gap distinct from the documented shared-local-directory race: isolation:worktree prevented a local git-state collision, but did not prevent two uncoordinated actors from both acting on the same *remote* PR at once. No harm resulted this time; noted in root TALKBACK.md as a pattern worth a future guardrail (a background agent should not independently continue driving a PR that its dispatching session has since started touching directly). Verified: all 27 required checks green post-fix (all 13 pre-existing verifyStorybook* guards, TypeScript, layout-contract, contract verifiers including the capture-group-guards check itself, GitGuardian); one non-required check ("Narrative Art Milestone Contract") stalled `queued` past a GitHub Actions runner-queue delay unrelated to this change (mergeable_state read "unstable", not "blocked", confirming it is not a required check -- matching the cycle-6 non-required-deploy-check precedent) and the agent separately cleared it with a cancel+rerun. kind_robots PR #1933 squash-merged b770613. Rearmed to ready per recurring-task convention -- t-010 never reaches done. Next cycle (conductor scheduled Agent run, session 20260818T2133Z-storybook-t010-b7gbb9, worktree-isolated background agent, foreground-verified). Fresh read of storybookStore.ts, storybookLibraryHelper.ts, narrativeArtJobsHelper.ts, narrativeArtJobs.ts, storybook-page.vue, storybook-library-page.vue, narrative-art-status.vue, cross-checked against all 14 prior verifyStorybook* guards. Found a new, real bug: remapDuplicate() in storybookLibraryHelper.ts (used by duplicateStory()) only carried a beat''s illustration forward onto a duplicated story when its art status was ''done'' -- every other status (''queueing'', ''queued'', ''rendering'', ''failed'', ''cancelled'') was dropped to undefined. The Duplicate button is enabled the moment isWeaving() goes false, well before that beat''s background art job actually resolves, so duplicating a story while its most recent illustration was still in flight or had previously failed silently and permanently lost that beat''s illustration state on the copy -- no image, no busy indicator, no retry affordance, ever. Fix: carry the art state forward (rekeyed to the duplicate''s own session/beat ids) for every status except ''queueing'' (the one genuine danger case with no jobId assigned yet, where rekeying would send the duplicate''s later recovery GET looking for a job filed under the original''s ids and submit a second real job). jobId is cleared only once ''done''; every other carried-over status keeps its real jobId so resume() polls the existing job directly with no re-submission risk. Added the 15th guard, verifyStorybookDuplicateArtCarryoverGuard.mjs + storybook-duplicate-art-carryover-contract.yml, and updated verifyStorybookSessionLibrary.mjs''s literal-shape assertions to match the corrected code shape (they had locked in the old buggy shape verbatim). The delegated background agent''s first final message stalled on an unresolved ''waiting for a provisioning monitor'' non-report -- same documented failure shape as prior cycles -- so the foreground session resumed it once via SendMessage with an explicit instruction to stop waiting and run verification synchronously; it then finished cleanly. Verified: new guard fails pre-fix / passes post-fix (git-stash round-trip); all 14 pre-existing verifyStorybook* guards pass; eslint clean; prettier --check clean on the new file (pre-existing unrelated formatting drift on two touched files confirmed via git-stash to predate this change, left untouched); vue-tsc --noEmit repo-wide clean; git status --porcelain showed exactly the 4 intended files. Verified independently before trusting the agent''s report: pulled PR #1943''s actual diff stat (4 files, +138/-4, matches exactly) and all 29 check runs (100% success, no failures/cancellations/pending) via GitHub MCP. kind_robots PR #1943 all checks green, mergeable_state clean, squash-merged 6ebb6012e66ae61d2ed5b59235f378128c05ae59. Rearmed to ready per recurring-task convention -- t-010 never reaches done. Next cycle (conductor scheduled Agent run, session 20260819T042900Z-storybook-t010-sched, worktree-isolated background agent, foreground-verified). Fresh read of storybookStore.ts, storybookLibraryHelper.ts, narrativeArtJobsHelper.ts, narrativeArtJobs.ts, storybook-page.vue, storybook-library-page.vue, narrative-art-status.vue, narrative-role-assigner.vue, cross-checked against all 15 prior verifyStorybook* guards. Found a new, real bug: two arm-then-confirm destructive controls -- storybook-page.vue''s "New story" button (newStoryArmed) and storybook-library-page.vue''s "Restart" button (restartArmed) -- had no concept of which session they were armed for. v-if="store.session" keeps the toolbar visible across every session-identity change (a session still exists, just a different one), and several ordinary actions swap the active session out from under an armed-but-unconfirmed button without ever running the confirm handler that resets it: clicking the library page''s own "New story" while the studio page''s "New story" is armed, or opening/duplicating/restarting a story while "Restart" is armed. A single click that looked like a fresh, first-press affordance instead fired the destructive action immediately, with no confirmation ever given for the story actually on screen. Fix: both components now reset their arm ref inside a watch() on the active session''s id, so any session-identity change clears a stale arm before the reader can land on it -- storybook-library-page.vue''s existing session-id watcher now also resets restartArmed.value = false; storybook-page.vue gained a new watcher (plus watch import) resetting newStoryArmed.value = false. Added the 16th guard, verifyStorybookConfirmArmScopeGuard.mjs + storybook-confirm-arm-scope-contract.yml, matching the established per-guard-workflow convention. Verified: new guard fails pre-fix / passes post-fix (git-stash round-trip); all 15 pre-existing verifyStorybook* guards pass, no regression; eslint clean on touched files; prettier --check clean on the two new files (pre-existing, unrelated formatting drift on both touched .vue files confirmed via git-stash to predate this change, left untouched); vue-tsc --noEmit repo-wide clean; git status --porcelain showed exactly the 4 intended files. Verified independently before trusting the agent''s report: pulled PR #1953''s actual diff stat (4 files, +182/-1, matches exactly) and confirmed merged: true via GitHub MCP. kind_robots PR #1953 all 30 checks green, mergeable_state clean, squash-merged 9d4b5cec891d026943a83edae48c7651689eb557. Kaizen note: suggested next lead (cycle 18) -- narrative-response-composer.vue''s @keydown.enter.exact.prevent="submit()" does not check event.isComposing, so during IME composition (Japanese/Chinese/Korean input) the Enter press used to confirm composed text is hijacked into submitting the story response prematurely with an unfinished composition -- an unexplored internationalization dimension distinct from all 16 existing guards, worth investigating for cycle 18. Rearmed to ready per recurring-task convention -- t-010 never reaches done.'
