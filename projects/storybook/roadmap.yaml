project: storybook
kind: software
goal: >
  Ship the collaborative Storybook experience as a polished story-first product: guided and
  limited-visibility play, reusable story state/artifacts, the in-progress casting/setup
  redesign, and a responsive front end that has been visually accepted on phone/tablet/desktop.
notes_from_silas: 'Build the collaborative storytelling experience layer on top of the existing Kind Robots models. Support guided adventure and limited-visibility collaboration modes with async-first play, branching choices, custom inputs, rewards, inventory, and reusable story state. Boundaries with Da Vinci (see projects/davinci/docs/storybook-boundary-comparison.md): no shared run/session tables, no columns added to Life* models — shared behavior only through existing Kind Robots models (Bot, Chat, Character, Dream, Scenario, ArtCollection, Milestone) or extracted pure utilities. Respect this when designing the session schema.'
