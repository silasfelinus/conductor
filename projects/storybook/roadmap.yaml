her no-op. taskmasterStore.ts's saveToLocalStorage() was the ONE unguarded localStorage writer left in the narrative family: storybookStore.ts's persist(), storybookLibraryHelper.ts's persistLibrary(), and persistedNarrativeArtJobsHelper.ts's writeLocalStorage() all already swallow a failed write with an explicit private-browsing/quota comment, and verifyNarrativeArtPersistence.mjs's own header calls the two stores "byte-for-byte the same shape." A setItem throwing QuotaExceededError -- routine once a long quest's beats have grown the serialized session, immediate in a Safari private window -- propagated out of all ten call sites. Traced each rather than asserting the class: (a) updateBeatArt() is the art-job update callback invoked from narrativeArtJobsHelper's `void poll(...)`/`void submit(...)`, neither of which catches, so the throw both became an unhandled rejection AND killed that beat's poll loop -- the illustration then never resolved and never reached 'failed', so NarrativeArtStatus (retry only renders on 'failed') offered no retry affordance; this is the sharpest one. (b) answerCurrentBeat(), prepareQuest(), startQuest() and resetSession() are all reached from taskmaster-page.vue with no .catch(), so the throw surfaced as an unhandled rejection instead of the store's own errorMessage. (c) weaveBeat()'s call IS inside its own try/catch -- but only reached after active.beats.push(beat) had already committed the beat in memory, so it returned false and showed a raw browser quota string for a beat that had in fact been woven, and skipped that beat's requestBeatArt(). Fixed by wrapping saveToLocalStorage()'s body in try/catch, mirroring persist()'s shape exactly. Also added the matching lockstep assertion over BOTH stores' writers to verifyNarrativeArtPersistence.mjs so neither can silently drift back to unguarded -- narrative-art-persistence-contract.yml runs on every PR with no path filter, so it is CI-enforced. Verified the new assertion actually catches the