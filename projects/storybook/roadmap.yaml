    Found a real one in chatStore.ts instead. storybookStore.ts and
    taskmasterStore.ts each call chatStore.generateText() from their own
    weaveBeat(), and both derived streamingText from chatStore.pendingText --
    a SINGLE module-level singleton (pendingChatId) shared across every
    generateText() caller in the app, not scoped per caller. Neither store
    cancels its in-flight weaveBeat() on navigation (no AbortController, and
    Pinia store state outlives the unmounted page component), so a reader who
    leaves Storybook mid-scene and answers a Taskmaster beat before
    Storybook's call resolves can have Taskmaster's generateText() overwrite
    the shared pendingChatId -- returning to Storybook while its own call is
    still streaming shows Taskmaster's prose under Storybook's placeholder.
    Worse, whichever call's finally runs first unconditionally nulls
    pendingChatId, which can blank a still-streaming sibling call's
    streamingText back to empty even though it has live text arriving. Traced
    pendingChatId/pendingChat/pendingText's origin to a 2026-07-18 TALKBACK
    entry (exposed for the old serendipityStore, now taskmasterStore after
    the rename) -- Storybook's later reuse of the same singleton for an
    unrelated product is what turned a single-caller convenience into a
    cross-product race.

    Fixed: added an onChatId hook to generateText(), fired synchronously with
    the newly created chat id, and chatText(id) -- a read scoped to that
    specific chat, independent of the singleton. Both stores now track their
    own weavingChatId (reset to null before each call and in its finally) and
    read streamingText through chatText() instead of pendingText. Added
    verifyNarrativeStreamingTextIsolationGuard.mjs (+ dedicated contract
    workflow), confirmed it fails against the old shared-singleton shape and
    passes against the fix. kind_robots#2054.

