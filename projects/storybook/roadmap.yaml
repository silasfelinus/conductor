project: storybook
kind: software
goal: >
  Ship Storybook as one stylish, card-driven storymaker with many endings: element cards
  chosen from a hand onto a storyboard, a bounded turn loop where each move is an offered
  option, a custom action, or a play from the hero's character sheet, deterministic resolution
  into per-deck ending sets (genre decks alongside the 1,024-ending Life deck), and a per-account
  collection of adventures and endings -- visually accepted on phone/tablet/desktop.
notes_from_silas: 'Build the collaborative storytelling experience layer on top of the existing Kind Robots models. Support guided adventure and limited-visibility collaboration modes with async-first play, branching choices, custom inputs, rewards, inventory, and reusable story state. 2026-09-09, superseding the Da Vinci separation clause that stood here from 2026-07-02: "merge the projects, and kill any reference that says we should separate them. we care about having a solid *single* interface that is a stylish and effective storymaker with many endings. Whatever has been done should be merged." Da Vinci is now the `life` shape of Storybook (kind_robots PR #2549) — one route, one setup screen, one library. Nothing forbids a shared session table or a column on a Life* model any more; judge such a change on its merits like any other. 2026-09-12, after round 1 of the storymaker mockups: "since the narrators actually exist as bot Narrators, they provide the general voice, but how they deliver it can still be adjusted"; "Stories should be able to be selected as open-ended (endless mode), episodic (scenario based), structured (da Vinci mode), and taskmaster (we should work taskmaster into this project as well, removing the taskmaster route when done)"; "All selections before the story begins should be card hand based" -- clarified as "that doesn''t count reasonable settings, start story, etc. I just meant all the flavor bits, including mode select, narrator, etc." So: mode and narrator become cards, typed input and settings and actions stay ordinary controls, the four modes replace the four shapes with length demoted to a dial, and Taskmaster is absorbed as the fourth mode. Full spec in docs/storymaker-redesign.md Part B; the Storybook/Taskmaster boundary doc that called the split permanent is superseded (t-043). 2026-09-13, STANDING: "I don''t know why anything is waiting on mockups. That was supposed to be a one-off to give some general direction, not a permanent requirement to lead to anything. we just want things functional at this point. we can tweak what it looks like afterwards. We should not be waiting for mockups (which you were already given) to complete anything moving forward on roadmaps." A mockup, a screenshot or a design pass is DIRECTION, never a dependency. No task in this project -- or any project -- may be filed blocked on one. Screens ship functional on the engine that exists and are polished in place afterwards.'
