  - id: t-020
    milestone: m5
    title: "Ghost Trail finish: sound, HUD, balance, device QA and >=60-minute playtest"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-019
    note: >-
      Replace placeholder sounds with authored ambience/combat/music; playtest boss tells,
      attack cooldown, save/resume and secrets, verify DPR/pixel/HD, phone/tablet/desktop
      and keyboard/gamepad/touch. Log actual unfamiliar-player run durations; target
      >=60 minutes for first successful clear without artificial waiting. Confirm no
      static farming and proper leaderboards; do not call done on estimates alone.

      2026-10-10: unblocked -- all six stages, six bosses, save/resume, ending and NG+ are in. Zuzu's walk was sped up (1.3 -> 1.7 px/tick) at Silas's request; jump distance unchanged because every gap is tuned to it. Bot sweep (endless lives, 2 seeds x 16 acts): 29/32 clear, the misses are pilot limits in two boss fights and one katana-vs-monk standoff. Bot clear times run 80-480 s per act -- these are NOT human times. Remaining here: authored sound/music, device/input QA, and the human timed playtest (>=60 min first clear) -- only a person can supply the latter; do not call it done on bot estimates.

      2026-10-11: Silas's playtest notes acted on (silasfelinus/kind_robots#3488, #3490): checkpoints at least every 1400 px plus a boss-gate checkpoint, an in-game CONTINUE from the last checkpoint, and saves that resume at the checkpoint ("checkpoints that don't send the player back to the beginning of the stage"); the iai cut reworked into a lunge + great crescent that cuts shots out of the air ("needs to have something going for it"); a vertical camera and the first vertical act, THE BELL STAIR ("do we have a vertical level yet?"); and authored sound -- a chiptune theme per world, boss and finale themes, the ending theme and Ghost Trail's own SFX, through a new cabinet music path. Sound was checked structurally only (no ear test). In progress: a Storm Crow Pass cliff climb + lightning hazard, River Croc as a ferry ally, the Abbey's optional rescue. Still open: device/input QA and the human timed playtest.

      2026-10-11 later: River Croc, the abbey rescue, Storm Crow lightning and THE CLIFF ROAD shipped (kind_robots#3496, #3497); the campaign is 18 acts and 21 relics. Remaining here: device/input QA and the human timed playtest.
    updated: '2026-10-11T05:00:00Z'

