    status: ready
    passes: 0
    stakes: reversible
    depends_on: t-038
    note: >-
      Reviewer kaizen after kind_robots#3581: existing deterministic game tests inject frames directly.
      Exercise the real ArcadeCabinet input routing for 2-4 seats, keyboard/gamepad/touch as supported,
      and the solo twin-stick versus multi-seat aim contract. Verify menu selection, distinct seat
      motion and partner revival with consumer-generated frames, including disconnect/reconnect or
      absent secondary input. Use a bounded browser fixture with actual consumers and game renderer
      at phone/tablet/desktop widths. Keep staged scenarios explicit and avoid claiming live deployment
      or human pacing from fixtures. Fix only a reproduced scoped consumer problem; preserve tests,
