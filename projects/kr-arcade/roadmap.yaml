# Kind Robots Arcade -- scaffolded 2026-10-06 via intake.py from Silas's in-session brief.
# Scope came straight from Silas, so there is no separate "confirm scope" gate: the
# design brief records his direction verbatim. Two phases: a finite launch (m1+m2,
# project status `active`), then a continuous game factory (m3) once launch ships.
project: kr-arcade
kind: software
goal: "A free in-browser Kind Robots arcade on its own Arcade tab in the Projects channel: classic-cabinet front end, attract-mode intro splashes, three-initial leaderboards, and original Kind Robots games riffing on golden-age classics with rising difficulty, then a standing game factory that keeps adding cabinets."

notes_from_silas: |
  Silas, 2026-10-06 (verbatim): "new project for conductor, that will fit into our daily
  pitches. Some daily pitches can be kind robots themed arcade games. playable on a special
  arcade tab in our Projects section, and needing an independent front end that evokes a
  classic arcade setup, users can play kind robots themed arcade games reminiscent of old
  games. favorites personally were: joust, guantlet 2, mario bros, pinball. robotron, the
  logging game, that bubble in the sink game, pacman. I want achievable games, with
  leaderboards, incremental challenge, intro splash, classic retro looking style, stylish
  arcade cabinet frames, and playable in browser, for free. in general, once the main page
  is created (an arcade cabinet front end, leaderboard, at least two games), then this will
  become a regular "make this when you don't have another task duty, like our screensaver
  project). create the project, submit initial art job requests to make it (our cabinet
  should evoke classic cabinets, but also reminiscent of our logo style)."

  Agents: DESIGN-BRIEF.md is the spec (cabinet look, engine-kit contract, leaderboard,
  per-game checklist). games.yaml is the build queue. Riff on mechanics only -- never the
  original games' names, sprites, sounds or level layouts.

milestones:
  - id: m1
    title: "SHAPE — design brief, game catalog, cabinet art"
    weight: 15
    status: done

  - id: m2
    title: "LAUNCH — Arcade tab, cabinet front end, leaderboard, two games"
    weight: 55
    status: done

  - id: m3
    title: "GAME FACTORY — one new cabinet per fallback cycle"
    weight: 30
    status: done

  - id: m4
    title: "DISPLAY — resolution system and player-selectable render styles (pixel, HD, more)"
    weight: 10
    status: done

  - id: m5
    title: "GHOST TRAIL — 60–90 minute cinematic action campaign"
    weight: 50
    status: in-progress

  - id: m6
    title: "16-BIT GLOW-UP — every cabinet upgraded from the Atari look to the Super NES bar"
    weight: 40
    status: in-progress

