    title: "LAUNCH — Arcade tab, cabinet front end, leaderboard, two games"
    weight: 55
    status: done

  - id: m3
    title: "GAME FACTORY — one new cabinet per fallback cycle"
    weight: 30
    status: done

  - id: m4
    title: "DISPLAY — resolution system and player-selectable render styles (pixel, HD, more)"
    weight: 10
    status: done

  - id: m5
    title: "GHOST TRAIL — 60–90 minute cinematic action campaign"
    weight: 50
    status: in-progress

  - id: m6
    title: "16-BIT GLOW-UP — every cabinet upgraded from the Atari look to the Super NES bar"
    weight: 40
    status: done

  - id: m7
    title: "DEPTH PASS — Pipe Pals and Prize Show Panic grow into full campaigns"
    weight: 60
    status: done

  - id: m8
    title: "CABINET DEPTH PASS — every other cabinet grows from a thin riff into a full campaign"
    weight: 100
    status: in-progress
  - id: m9
    title: "GHOST TRAIL GEN 2 — SMW-depth Bell Road overworld, memory, layered stages, N64-bar animation"
    weight: 60
    status: in-progress

  - id: m10
    title: "DISPLAY QUALITY — responsive viewport and render budgets across game genres"
    weight: 20
    status: in-progress
  - id: m11
    title: "SHARE READY — a publicly shared cabinet link lands well for a first-time visitor"
    weight: 25
    status: in-progress

  - id: m12
    title: "SUPERKATE'S SPECTRUM — complete bubble-puzzle story campaign and high-priority art"
    weight: 80
    status: in-progress

