  - slug: zuzu-ghost-trail
    title: "Zuzu: Ghost Trail"
    riffs_on: Ghosts 'n Goblins (1985)
    status: building
    task: t-009
    shipped_in: [silasfelinus/kind_robots#3293, silasfelinus/kind_robots#3297]
    slices_done: [one stage + poncho/armor rule, throwables + pickups]
    phase: factory
    effort: large
    source: "catalog (was Bolt Knight); Silas, 2026-10-06: \"our ghosts and goblin game should also be zuzu themed\""
    hook: >-
      Zuzu, the koala ronin, walks a haunted weird-west trail where the world is thin: a ghost town,
      a bone yard, a drowned watering hole and a mission bell tower. He throws kunai and his
      boomerang straw kasa at restless spirits, bone hyenas and storm crows. The first hit knocks his
      poncho and kasa off, leaving him in his tunic; a second sends him back to the last checkpoint.
    challenge: >-
      Each stage adds tougher spirits, collapsing boardwalks and rope bridges, and ends in a boss from
      the thin places (a tentacle at the end of the trail). Pick up the poncho to armor up again, and
      new throwables (kunai, the kasa, a short iai cut) along the way.
    look: >-
      Zuzu's canon, not the Kind Robots logo style: short and stocky, rust-brown poncho with orange
      zigzag trim, conical straw kasa, katana across his back with the hilt over his right shoulder,
      always serious (projects/comic-creator/issues/zuzu-koala-assassin-01/CAST-PICKS.md). A dusty
      ochre and moon-blue palette with a gritty tone and cartoonish deaths. bannedTerms apply to the
      title art and every word in the game (VIDEO-GUARDRAILS.md). Share the palette and Zuzu's pixel
      silhouette with zuzu-showdown's sprite work where it helps.
    slices: [one stage + poncho/armor rule, throwables + pickups, bosses, stage progression]

