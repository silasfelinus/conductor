# Kind Robots Arcade -- game queue. The build order is the list order.
#
# status: queued | building | shipped
# source: catalog (Silas's 2026-10-06 favourites) or pitches/<stem>.md (an approved
#         daily pitch with `target: kr-arcade` -- insert those ahead of the first
#         queued catalog game).
# Riff on MECHANICS only: never the original's name, characters, sprites, sounds or
# level layouts. Generated art carries no lettering; titles are drawn in the pixel font.
games:
  - slug: butterfly-blaster
    title: Butterfly Blaster
    riffs_on: Asteroids (1979)
    status: shipped
    shipped_in: silasfelinus/kind_robots#3265
    phase: launch
    task: t-010
    effort: small
    source: "Silas, 2026-10-06: an Asteroids riff with rainbow butterflies killing mosquitoes, a la our malaria project"
    hook: >-
      A rainbow butterfly drifts and wraps around a starry night sky, firing sparkles at buzzing
      mosquito swarms that split into smaller swarms and then single mosquitoes, while AMI drops
      bed nets that shield you, tying every cleared wave to the Against Malaria fundraiser.
    challenge: >-
      More and faster swarms each wave; a big malaria cloud "saucer" that hunts the player from wave 3;
      the bed-net shield gets rarer; every wave cleared counts as a village protected.
