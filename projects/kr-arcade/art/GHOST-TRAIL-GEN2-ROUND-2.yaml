# Zuzu: Ghost Trail Generation 2 art, round 2 (kr-arcade t-162; GEN2-STANDARD.md sections 5-6; CAMPAIGN-BLUEPRINT.md
# art pipeline step 3). Step one of the pose-to-pose atlas: white-ground KEY POSES that GHOST-TRAIL-GEN2-CLIPS-1 will
# animate with WAN 2.2 first/last-frame clips (the zuzu-pinball T019 croc recipe), then cut, matte and pack per action.
# ZUZU: Flux Kontext re-poses of his locked current look, ArtImage 242395 (comic-creator ANGLES-ZUZU r17-zuzu-subtle-
# front-1: white ground, kasa, rust poncho with orange zigzag, one katana with the hilt over his RIGHT shoulder),
# padded white to square so every pose shares one camera and scale. All poses face RIGHT, so his right shoulder (and
# the hilt) is nearest the viewer. NEVER mirror a Zuzu frame: a flip moves the katana to the wrong shoulder; left-
# facing frames come from a later Kontext pass, not a flip. Two seeds per pose. Action coverage (blueprint: idle 6,
# walk 8, jump 3, fall 2, attack 5, throw 4, crouch 2, hit 4, poncho-loss 6, death 8): each WAN clip runs between two
# keys below (idle->idle loop; walk contact->passing; jump crouch->rise; fall rise->fall; throw windup->release;
# cut draw->slash; hit idle->hit; poncho-loss hit->tear->exposed idle; death exposed hit->kneel->down). The exposed set
# (first hit tears off poncho and kasa: dark tunic, orange sash, bare head; heroArt.ts) has its own idle, walk and hit.
# No character LoRA: Silas excluded the 2D games from the cast-LoRA default (cast-loras/zuzu-koala-assassin.yaml).
# ENEMIES: one white-ground KEY design for each of the four mockup foes (foeArt.ts: spectral bone coyote 'hyena',
# hooded grave ghost 'spirit', storm crow, skeleton gunslinger) in Arthemy and Z-Image. Their telegraph/attack/defeat
# poses are a Kontext round from whichever key Silas or the reviewer picks (same croc recipe), so they are NOT queued
# blind here. Enemies face LEFT (toward Zuzu); mirroring an enemy is fine. auto_submit: true. Private.
round: ghost-trail-gen2-2
project_slug: kr-arcade
designer: Kind Robots Arcade
is_public: false
is_mature: false
cast_loras: false
auto_submit: true
