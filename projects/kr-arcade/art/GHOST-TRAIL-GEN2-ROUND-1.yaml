# Zuzu: Ghost Trail Generation 2 art, round 1 (kr-arcade m9; projects/kr-arcade/GEN2-STANDARD.md). Silas 2026-10-22 PT:
# Ghost Trail too should aim for Super Mario Bros 3 / Super Mario World depth with open world maps and save states.
# The Bell Road overworld map, five regional maps for the six-stage Act I, a haunted-house level type and a secret
# shrine zone. Maps carry empty clearings for code-drawn node markers. Character-free on purpose: Zuzu canon
# (koala, kasa, rust poncho, katana over right shoulder) stays in the sprite atlases. auto_submit: true. Private.
# Review 2026-10-22: Z-Image is the overworld-map lane (it reads 'map' literally); Arthemy turns maps into
# character vignettes. Future map rounds: Z-Image only.
