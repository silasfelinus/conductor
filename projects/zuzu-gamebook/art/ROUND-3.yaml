# Zuzu Gamebook art round 3 (zuzu-gamebook t-006): rerolls of round 2's rejects, each prompt changed for its failure.
# Human faces (crawlspace, Quiet Draw) -> object/animal-only still lifes, human/face negatives. Fluorescent store -> 1870s
# timber store with oil lamp, electric-light negatives. Literal reads (flint, kasa and bandage drew crows and mummies) ->
# plain descriptions without the trigger words, creature negatives. Stray ghosts in empty scenes -> "(empty room/street)"
# plus ghost/hooded-figure negatives. Nuns with feral otters -> Kontext cleanup of 243330. Concrete bunker -> outdoors.
# Canon: worlds/zuzu, VIDEO-GUARDRAILS.md. Prompts pre-checked against kind_robots artPromptContract.
# Indexed in worlds/zuzu/assets/ledger-part-05.json; keep that shard in step when outputs land.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status; --lane). Private.
