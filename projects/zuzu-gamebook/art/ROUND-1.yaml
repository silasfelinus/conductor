# Zuzu Gamebook art round 1 (zuzu-gamebook t-005/t-006). Silas, 2026-10-09: "the images are currently low poly
# filler, and we already have extensively made art that could be repurposed." Fifteen of the twenty-one sections
# now use vetted Zuzu intro music-video keyframes (KR music video 12; comic-creator MV-FIXES.yaml) and the
# abbess Kontext seed; the manifest is kind_robots utils/zuzuGamebook/art.ts. This ledger fills the six plates no
# existing render covers: the poster wall, the abbess in the crypt, and four endings.
# House lane and canon tags from comic-creator VIDEO-GUARDRAILS.md (bannedTerms and literal-word traps honoured:
# no 'human', 'people', 'english lettering', 'mother', 'muzzle', 'duster', 'squat'). The abbess crypt plate is a
# Kontext re-staging of her approved front (242559), the recipe that made the s11 mission-gate keyframe (242738).
# Indexed in the shared Zuzu world registry (worlds/zuzu/assets/ledger-part-05.json); keep that shard
# in step when this ledger gains outputs.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status; --lane). Private.
