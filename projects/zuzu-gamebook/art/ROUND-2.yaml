# Zuzu Gamebook art round 2 (zuzu-gamebook t-006). Silas, 2026-10-09: "the art queue is basically empty, and I crave
# content ... queue new art, not old". New plates the book needs next, nothing re-rendered:
#   A. the mission as a welcome before a threat (Silas: the abbess welcomes, feeds and houses Zuzu first), incl. two Kontext
#      restagings of the locked abbess front (242559);
#   B. more road and Hollow Bell locations for the ~400-section book; C. Zuzu action and consequence plates;
#   D. character-sheet figures restaged from the worlds/zuzu locked cast ArtImages; E. inventory and power motifs;
#   F. the hero splash; G. a third try at the wall of names (Kontext on the street plate 242685); H. the croc as a foe.
# Canon and prompt traps: worlds/zuzu, VIDEO-GUARDRAILS.md. Prompts pre-checked against kind_robots
# server/utils/artPromptContract.ts. Add this ledger to worlds/zuzu/assets (ledger-part-05) once outputs land.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status; --lane). Private.
