# Zuzu Gamebook art round 11 (zuzu-gamebook t-006): the 13 sections round 10 could not land, plus a1-gun-road
# (still a Kontext plate). Every one has failed three or four times with figures in it, so every prompt is now a
# close still life of the object that carries the moment: no rooms, corridors or doorways (those drew stray
# silhouettes and bodies), no faces. House lane only, three seeds each, scene light tag (ART-DIRECTION.md
# "Prompt wording"). Keepers go to kind_robots sectionArt.ts. Indexed in worlds/zuzu/assets/ledger-part-05.json.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
