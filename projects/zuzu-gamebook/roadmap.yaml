  - id: t-004
    milestone: m1
    title: Book One graph and all authored scenes (~400 numbered sections)
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      Expand the initial 20-scene, six-ending preview from kind_robots#3355 to a full book. The Bell That Never Rang. Build original branching scenarios that echo
      watering hole, wounded coyote, Hollow Bell, fennec siblings, apples,
      missing-child posters and corrupted mission without rewriting BOOK-ONE.md.
      Write ~400 unique sections (Silas 2026-10-09: "we should have many more chapters";
      Fighting Fantasy's standard is 400, the Sorcery! books 456-800), 10-14 endings with
      genuinely different outcomes and multiple routes through each main act. Grow it an
      act at a time, each act a shippable PR that keeps the graph and state tests green.
      Track routes, flags and alternate endings. No endless choice loops or unknowable
      fails. Pure static bundle.
      PACING (Silas 2026-10-09): the abbess must not open by attacking. The mission act
      starts as a welcome: she greets Zuzu and the children, offers food, beds and work,
      and the kindness is real-seeming for several sections (meals, chores, a night's
      rest, the other nuns, the cobwebbed playground). Suspicion builds from clues
      (posters, absent footprints, a locked door, a child who stops appearing) and Mercy
      or Sense checks before any confrontation. Fighting her is a late consequence of
      what Zuzu uncovers, and some routes never fight her at all.
