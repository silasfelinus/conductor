# Zuzu Gamebook: a standalone branching RPG, sibling to kr-adventures but not its preset reader.
# Canon: start at the shared Zuzu world registry, worlds/zuzu/README.md (canon order, locked cast
# ArtImages, canonical character/item profiles, art ledger inventory); DESIGN-BRIEF.md "Canon" says how.
# Implementation: silasfelinus/kind_robots /play/zuzu-gamebook, stores/zuzuGamebookStore.ts,
# utils/zuzuGamebook/; illustrated section art via durable ArtJobs.
project: zuzu-gamebook
kind: software
autonomous: true
goal: >-
  An original, image-led Zuzu: Koala Assassin gamebook at /play/zuzu-gamebook.
  Play an illustrated, complete, replayable Weird West adventure through choices,
  authored skill challenges, turn-based combat, condition/flag branches,
  persistent health, powers, equipment and inventory, with dice animation, a
  detailed character sheet, at least eight meaningfully different endings,
  save/resume and no LLM at play time. Finished only after comprehensive
  graph/balance tests, accessible phone/tablet/desktop visual review and Silas's verdict.
notes_from_silas: |
  2026-10-07: "new project for conductor/kind robots. We already have a request for
  choose your own adventure preset storylines, this is an extension, but should
  be a new project. A Zuzu Koala Assassin branching narrative adventure, patterned
  after Steve Jackson's Sorcery, Lone wolf, Grey Star, and the fighting fantasy
  series. So this would be set in the Zuzu world and starring him, hitting similar
  beats that we've discussed in the zuzu comic, videos, and zuzu's lair projects.
  Sections should have images based on setting and consquences of adventures,
  skill checks, a combat system, and multiple good and bad endings. Using the
  classic books as a general guide for complexity and rules systems, but using our
  own design, dice rolling animation, pass fail conditions, hit points, inventory,
  special powers, a character sheet, etc.

  This should appear as a new page on our /play directory, and updated as much
  as possible by conductor agents working independently. they are given authority
  to submit art to the generator to evolve this project, and we'll need a front
  end website with a high quality image focused conscious design"

  2026-10-09: "our zuzu gamebook project can use a definite upgrade to the art before
  anything else. we have a decent skeleton of a project, though the storylines could
  be more developed (the abbess starts and immediately attacks, rather than welcoming
  you into the mission, offering you food, etc). but the images are currently low poly
  filler, and we already have extensively made art that could be repurposed." And:
  "we should have many more chapters if we only have 21 scenes. what's the average
  number of sections in a fighting fantasy book, or the ur classic sorcery?"
  (Fighting Fantasy: 400 sections as standard; Sorcery!: 456, 515, 460 and 800;
  Lone Wolf / Grey Star: 350. Book One's target moved from 80-120 to ~400.)

  2026-10-09: "great, now please note and align this project with our new central zuzu
  worldbuilding hub" (worlds/zuzu). The brief and art direction now start from the hub, use its
  locked cast references and canonical character/item profiles, and the gamebook's art ledger is
  part of the hub's inventory (assets/ledger-part-05.json).

  2026-10-09: "let's expand [the new Zuzu worldbook], then develop" the gamebook. The
  WORLD-GUIDE gained a proposed gazetteer (Zuzu's code, survival, Land 1 places, the
  convent's signs, relics of the lost humans, factions, motifs); Book One grew from 20
  to 68 sections and 6 to 8 endings on top of it (kind_robots, zuzu-gamebook t-004).

  2026-10-10: "keep expanding the gamebook, submit artjob requests as needed. We want a full and
  immersive experience, with branching choices, interesting moral dilemas, etc. This is something
  that should be outlined first to allow a rich narrative experience. then we'll build out the
  sections. The world of Zuzu is vast, it's rife with moral dillemas, cosmic horrors, magic, people
  in desperation, and rare glimpses of honor and beauty. this is a dark horror world, but he has the
  choice to rise above it." -> BOOK-ONE-OUTLINE.md (nine acts, Honor/Taint, 13 endings) is the
  build plan; acts are built against it in order.

  Agent mandate: autonomously write/refine narrative, engine, UI, prompt manifests,
  playtests and balance; independently enqueue task-scoped images through durable
  ArtJobs and verify actual delivered assets before listing them as complete.
  Generated internal art is approved; publishing, external posting, expense,
  secrets and production deployment are NOT pre-approved.
  Separate project from kr-adventures: share stateless utilities if useful,
  do not hijack its preset-hero stories or duplicate its routes.
