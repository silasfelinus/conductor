    weight: 35
    status: not-started
  - id: m4
    title: EXPERIENCE — cinematic reader, inventory, animation and accessibility
    weight: 15
    status: not-started
  - id: m5
    title: POLISH & SHIP — coverage, balance, device verdict and ongoing chapters
    weight: 10
    status: not-started
