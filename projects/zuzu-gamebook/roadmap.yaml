  - id: t-006
    milestone: m3
    title: Independently enqueue and review gamebook illustrations in batches
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: [t-005]
    note: >-
      Art generation explicitly pre-authorized for internal project use.
      Use the durable /api/art/enqueue ArtJob pipeline with stable idempotency
      and canonical series/character settings; check DONE AND reachable delivered
      URLs, verify Zuzu costume and the banned-terms guardrails. Round 1 (art/ROUND-1.yaml)
      covered the preview's gaps; each new act from t-004 gets its plates the same way,
      reusing vetted comic/MV renders first (search the worlds/zuzu ledger inventory), prompting
      from the registry's locked cast ArtImages, and adding each new ledger to the registry's
      inventory (assets/ledger-part-05.json or a new part) plus any exported plate to
      assets/repository-media.json in the same PR; tests/test_zuzu_world_inventory.py enforces it. Lessons: "poster" is refused by the KR prompt
      contract; "smoking blade" draws a cigarette; empty scenes need "(no characters:1.4)"
      plus figure/person negatives. Begin with cover,
      hero, first ten scene plates, dice/character-sheet motifs and consequence
      plates, then continue in book-sized batches. Do not incur paid external spend.
      ROUNDS 2026-10-10: ROUND-4 (34 jobs, Acts I-IV plates) and ROUND-5 (30 jobs, Acts V-IX
      plates incl. one Kontext restaging of the locked Abbess front) queued; each plate has a
      stand-in key in kind_robots art.ts until its keeper is reviewed and exported.
      ONE PLATE PER SECTION (Silas 2026-10-10: "if we have 400 sections, we have 400 pieces of
      art"; "some are shown horizontally and some vertically, left right top bottom, for variety"):
      ROUND-6 queues 302 jobs (151 Act I-IV sections x 2 seeds, mixed wide/tall/square); keepers
      are keyed by section id in art.ts and the page lays tall plates beside the text, wide
      ones above or below. ROUND-7 queues the other 436 (Acts V-IX and the 12 endings without
      their own plate): every one of the 375 sections now has its own plate in the queue.
      REVIEW 2026-10-10: round 4 kept 8/17 plates, round 5 kept 8/15 (the 16 replace stand-ins); round 6's
      first 46 sections kept 21 (kind_robots utils/zuzuGamebook/sectionArt.ts, scenes/sections/). Lesson: the
      {ZUZU} token without 'solo' drew a second small koala beside or on Zuzu in most renders; the 268 still
      pending Zuzu jobs were edited in place to add '(only one koala:1.3)' and second-koala negatives.
      Rejected Zuzu sections get rerolls once round 7 drains.
      REVIEW 2 (12:50): round 6 batch two kept 45 of 77 sections (58%, up from 46%) - 66 per-section plates
      live. Second lesson: when {ZUZU} and the fennec children share a prompt the model fuses them (a fennec
      in Zuzu's poncho and sash, a koala with fox ears); the 70 still-pending mixed-cast jobs were edited to add
      '(two separate characters:1.3), (different species:1.2)' and fusion negatives.
      REVIEW 3 (14:05): round 6 finished (302/302; last batch kept 16/28), round 7 first 66 sections kept 39
      (59%): 121 per-section plates live. Places, objects and non-Zuzu cast (nuns, Mags, Pell, Pip) render well;
      most rejects are scenes pairing Zuzu with anyone (fusion into his poncho/sash, mouse-faced Zuzu). Plan for
      the ROUND-8 rerolls: Kontext-restage the locked Zuzu front (242395) for Zuzu scenes instead of txt2img.
      REVIEW 4 (15:35): round 7 next 111 sections kept 65 (59%): 186 per-section plates live. Alone, Zuzu now
      renders well; non-Zuzu cast (Vane, Mags, Pell, Hollis, the nuns) is reliable. New fusion seen: the fennec
      sister merging with the nuns (a fennec in a habit), so the rerolls separate her from the otters too.
      REVIEW 5 (16:10): round 7 next 13 sections kept 6: 192 per-section plates live (198 of 375 sections with
      their own art, counting the 6 exact round 4-5 plates). ROUND-8 queued (294 jobs, ids 36071-36370) for the 147
      sections rounds 6-7 left without a plate: Zuzu scenes get one Kontext restage of 242395 padded to the plate
      shape plus one fresh house seed, the rest two fresh house seeds with the fusion / sister-not-a-nun /
      human-faced-nun / mouse-faced-Zuzu fixes. enqueue_art_requests now honours a subject's `lane`, and its
      pre-submit gate refuses negated parentheticals: '(no characters:1.3)' is now '(empty scene:1.3), uninhabited'.
      Round 7 still has ~56 jobs pending (30 sections); review those and round 8 as they land.
      REVIEW 6 (18:05): round 7 finished (436/436); its last 29 sections kept 15: 207 per-section plates live
      (213 of 375 sections with their own art). Rejects were again Zuzu-with-company (riders, a second small
      koala, mouse/fox/elephant-headed Zuzu, the fennec in his costume) plus two human-face renders and one
      reading as a hanging. The 14 rejected sections were appended to ROUND-8 (322 jobs, last id 36398).
      Round 8 had not started rendering at 18:00 (290 pending), so the Kontext-vs-house verdict waits.
      REVIEW 7 (19:45): round 8's first 25 renders (Act I opening): 11 kept, 218 per-section plates live (224 of
      375 with their own art). Early lane read for Zuzu scenes: Kontext 8 keeps of 13 renders, house 2 of 6;
      where both rendered each won twice and both failed twice. Kontext keeps Zuzu exactly on model every time
      and never fuses or adds a second koala; its misses are scenes left on a black void (the padded white source
      reads as empty) and a rat-faced coyote. House misses are the usual second koala / costume fusion / riders.
      So far Kontext leads: round 9 should restage Zuzu scenes with Kontext and spell out the whole setting
      (ground, sky, light) so it fills the frame. The 6 house seeds made redundant by Kontext keepers were
      cancelled (ArtJobs 36091, 36093, 36095, 36099, 36101, 36103). Queue is healthy, not stalled (no stale RUNNING), but slow: ~40
      renders/hour, so round 8's last ~290 jobs land over the next ~7 hours.
      KONTEXT PROMPT FIX (20:00, Silas: "why start with 'place this exact koala in a new scene'? That means a lot
      to krea in ways we don't want"). The lane is Flux Kontext dev, but it shares the T5 encoder, which reads the
      prompt as a picture description: "white background" and "replace ... background" drew black voids,
      "dark atmosphere, heavy shadows" muddied the colour, "only one koala" and "she never wears his hat, poncho or
      sword" put koalas and his costume into the frame. Rule for every Kontext prompt from here on: describe only
      what is in the picture (the scene, the koala's outfit, each other character, light matched to the scene,
      "Western comic book illustration with clean ink lines, rich natural color and a fully drawn setting"), with
      no instructions, meta words or negations. The 87 still-pending round-8 Kontext jobs were edited in place to
      this wording; 10 had already been claimed and render with the old prompt.
