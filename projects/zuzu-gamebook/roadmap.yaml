  - id: t-004
    milestone: m1
    title: Book One graph and all authored scenes (~400 numbered sections)
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      PLAN 2026-10-10: build against BOOK-ONE-OUTLINE.md (nine acts with budgets, act entry/exit
      contracts, dilemma catalogue, Honor/Taint tallies, flag registry, 13 endings, art plan).
      PROGRESS 2026-10-10: Acts I-IV written to budget as act modules (kind_robots
      utils/zuzuGamebook/acts/act1-4.ts, 128 new sections, book at 196); Acts V-IX in progress
      (wave 2, same contracts; done the same day: 375 sections, 13 endings, kind_robots#3437).
      Engine: reroutes of checked choices via #success/#failure,
      maxTaint gate for the best ending.
      PROGRESS 2026-10-09: 68 sections / 8 endings across six acts that follow Book One's
      chapters (utils/zuzuGamebook/book.ts), the mission rewritten welcome-first, clues
      paying off as roll bonuses, flag-gated choices with disabled hints, scene effects,
      and a 6000-walk seeded exploration test. Next increments: deepen each act toward
      ~400 (side encounters per WORLD-GUIDE gazetteer, Dustwater, a novice ally route,
      more consequence plates), then the later acts' plates via t-006.
      Expand the initial 20-scene, six-ending preview from kind_robots#3355 to a full book. The Bell That Never Rang. Build original branching scenarios that echo
      watering hole, wounded coyote, Hollow Bell, fennec siblings, apples,
      missing-child posters and corrupted mission without rewriting BOOK-ONE.md.
      Write ~400 unique sections (Silas 2026-10-09: "we should have many more chapters";
      Fighting Fantasy's standard is 400, the Sorcery! books 456-800), 10-14 endings with
      genuinely different outcomes and multiple routes through each main act. Grow it an
      act at a time, each act a shippable PR that keeps the graph and state tests green.
      Track routes, flags and alternate endings. No endless choice loops or unknowable
      fails. Pure static bundle.
      PACING (Silas 2026-10-09): the abbess must not open by attacking. The mission act
      starts as a welcome: she greets Zuzu and the children, offers food, beds and work,
      and the kindness is real-seeming for several sections (meals, chores, a night's
      rest, the other nuns, the cobwebbed playground). Suspicion builds from clues
      (posters, absent footprints, a locked door, a child who stops appearing) and Mercy
      or Sense checks before any confrontation. Fighting her is a late consequence of
      what Zuzu uncovers, and some routes never fight her at all.
      WORLD HUB (2026-10-09): name characters, items and places as the worlds/zuzu canonical
      profiles do (Coyote Vagrant, Fennec Sister and Toddler, the Abbess, River Croc; Apples for
      the Road, the Drifter's Bandage, the Sister's Dagger; kasa and katana are worn, not carried).
      No Showdown-only fighters, no Old Komodo, no legacy KR filler lore. A new named character or
      place meant to outlive this book is proposed to Book One / the registry first.
