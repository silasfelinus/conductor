  label: "The Ruler Is Hooked"
  prompt: >
    Create a vibrant and engaging landscape scene that captures the essence of "The Ruler Is Hooked," a fishing and kingdom-management game. The focal point is a regal, stylized fishing rod, adorned with intricate designs, casting a line into a shimmering lake surrounded by lush greenery and distant mountains. In the foreground, various small creatures and characters interact with the fishing line, showcasing the playful interruptions that can reshape the shore. The setting is bathed in warm, golden sunlight, enhancing the inviting atmosphere, while the color palette features rich greens, blues, and hints of gold to signify prosperity. The texture of the fishing rod and the surface of the water should be detailed, conveying a sense of depth and realism. This artwork should be rendered in a digital painting style, ensuring a polished and captivating visual experience. no readable text, no logo, no watermark, no collage.

# ── Newsfeed / showcase stand-in art, batch 2 (kind-robots home redesign, 2026-08-28)
