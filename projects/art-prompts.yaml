# art-prompts.yaml — Image queue for Conductor project assets and Kind Robots missing-image requests
#
# Project assets use `images:` and are pruned automatically when matching files
# exist in this repo's projects/images/ folder.
#
# Inspiration images use `inspirations:`. Pruned automatically when matching files
# exist in the kind_robots repo at ../kind_robots/public/images/artcollections/.
#
# Site-wide missing-image reports use `requests:`. Kind Robots writes those
# requests here when an admin sees a missing image. Requests should be removed
# once the image has been generated and committed to the target repo.
#
# Project image variants:
#   icon  — square 1:1 (256×256 min). Used in nav, sidebar, card headers, favicons.
#   card  — portrait 2:3 (512×768 min). Shown on the workspace project card.
#   hero  — landscape 16:9 (1280×720 min). Shown as a banner/header in project view.
#
# Prompt standard:
#   Write for modern OpenAI image generation, not legacy flat placeholders.
#   Kind Robots represents a consortium of projects aimed at multi-genre,
#   cross-dimensional experiences. When a scene includes people, characters,
#   teams, families, players, operators, or companions, represent a diverse array
#   across genders, races, ages, body sizes, body shapes, presentation styles,
#   and species. Mix humans, robots, animal-like beings, fantasy creatures, and
#   original nonhuman companions when it fits the asset.
#   Do this naturally and respectfully, without tokenism or stereotypes.
#   Icons should read instantly at small sizes: premium app-icon polish, strong silhouette.
#   Cards should feel like professional portrait key art for a polished product.
#   Heroes should feel like studio-quality game/product illustration with cinematic depth.
#   Always avoid readable text, logos, watermarks, contact sheets, and collages.
#
# Workflow:
#   1. Copy the generator prompt from ART-PROMPTS.md into ChatGPT.
#   2. Paste one batch of up to ten entries from this file.
#   3. Generate exactly one unique image per entry with the listed aspect ratio.
#   4. Export as .webp at the minimum size listed.
#   5. Save to the image_path listed below.
#   6. Run `python scripts/build_workspace.py` to refresh the workspace.
#
# Status values: pending

images:
  - project: packmaker
    icon:
      image_path: projects/images/packmaker-icon.webp
      size: "256x256"
      status: pending
      prompt: >
        Premium app icon for Packmaker, a glowing treasure chest opening into neatly
        arranged content cards — a tiny landscape, a masked character, a spellbook, a
        medal — crisp app-icon polish with a strong silhouette, no text, no logo,
        no watermark, no collage, square composition
    card:
      image_path: projects/images/packmaker-card.webp
      size: "512x768"
      status: pending
      prompt: >
        Professional portrait card illustration for Packmaker, a workshop where a
        diverse crew of humans, robots, and inventive companions assembles themed
        content packs on a luminous conveyor — location dioramas, character figures,
        genre tomes, and reward tokens being boxed into elegant collector cases,
        cinematic key-art staging, tactile detail, no readable text, no logos,
        no watermark, portrait composition
    hero:
      image_path: projects/images/packmaker-hero.webp
      size: "1280x720"
      status: pending
      prompt: >
        Studio-quality widescreen hero illustration for Packmaker, a grand pack-forging
        atelier with two showcase display cases — one radiating heroic super-powered
        energy, one swirling with arcane magic — while diverse makers and small robot
        artisans generate locations, characters, genres, and rewards along glowing
        pipeline rails, layered depth and cinematic lighting, rich but uncluttered,
        no readable text, no logos, no watermark, landscape composition
  - project: ruler-hooked
    icon:
      image_path: projects/images/ruler-hooked-icon.webp
      size: "256x256"
      status: pending
      prompt: >
        Premium app icon for The Ruler is Hooked, a goofy cartoon monarch seen from
        behind slouched happily on a throne-turned-fishing-chair at a lake's edge,
        oversized crown tilted, fishing rod arcing out over sparkling water with the
        line making a heart-shaped loop, tiny castle silhouette in the distance,
        bold storybook-cartoon shapes with a Monkey Island wink, instantly readable
        silhouette at small sizes, no readable text, no logos, no watermark,
        square composition
    card:
      image_path: projects/images/ruler-hooked-card.webp
      size: "512x768"
      status: pending
      prompt: >
        Portrait key art for The Ruler is Hooked, a cartoony fishing/kingdom
        simulator: a contented ruler of any gender perched on the grassy bank of a
        beautiful lake behind their castle, rod in hand, while a comically sinister
        warlock land developer with blueprints and a serene druid preservationist
        with sprouting staff lean into frame from either side awaiting a decision,
        half the scene lush nature and half drifting toward whimsical overdevelopment,
        exaggerated good-and-evil archetypes with wry warmth, Treasure Planet and
        She-Ra energy, painterly storybook lighting, no readable text, no logos,
        no watermark, portrait composition
    hero:
      image_path: projects/images/ruler-hooked-hero.webp
      size: "1280x720"
      status: pending
      prompt: >
        Studio-quality widescreen hero illustration for The Ruler is Hooked: a wide
        layered storybook landscape composited from distinct regions — castle grounds,
        village edge, treeline, far shore, sky — each region caught mid-transformation
        between thriving druid-kept wilderness and goofy warlock real-estate sprawl,
        while in the foreground the happily oblivious ruler fishes from a small dock,
        a royal messenger waving an urgent scroll behind them, diverse quirky
        townsfolk and creatures dotting the mid-ground, cartoony exaggerated
        good-versus-evil staging with nuanced wry details, cinematic depth and warm
        lighting, rich but uncluttered, no readable text, no logos, no watermark,
        landscape composition
  - project: ecosystem-map
    icon:
      image_path: projects/images/ecosystem-map-icon.webp
      size: "256x256"
      status: pending
      prompt: >
        Premium app icon for Ecosystem Map, a luminous constellation of project nodes
        connected by clean glowing paths around a central compass-like robot eye,
        crisp readable silhouette, elegant systems-map symbolism, no text, no logo,
        no watermark, no collage, square composition
    card:
      image_path: projects/images/ecosystem-map-card.webp
      size: "512x768"
      status: pending
      prompt: >
        Professional portrait card illustration for Ecosystem Map, a calm map-room
        command table where diverse humans, robots, and creature collaborators align
        project cards, bot portraits, image folders, and narrator threads into one
        coherent blueprint, premium product key art, cinematic lighting, no readable
        text, no logos, no watermark, portrait composition
    hero:
      image_path: projects/images/ecosystem-map-hero.webp
      size: "1280x720"
      status: pending
      prompt: >
        Studio-quality widescreen hero illustration for Ecosystem Map, a grand Kind
        Robots architecture atlas where portals to many project worlds are connected
        by shared rails for Dreams, Bots, ArtCollections, narrator threads, and menus,
        with a composed manager-bot guide tracing reuse paths across the network,
        layered cinematic depth, rich but uncluttered, no readable text, no logos,
        no watermark, landscape composition
