# Silas: "I need more default art if we don't have an image to go with the
# article. At least 20-40 more in a variety of krea2 styles. We've got a couple
# days of art in the queue, but this is low priority. I just want more variety
# and freshness."
#
# Forty stand-ins, default-09 through default-48, each in a DIFFERENT medium --
# that variety is the whole point, so do not collapse them toward one house look
# when repairing prompts. The pool these join is now shared by the newsfeed AND
# every home-page rail card with no art of its own
# (kind_robots utils/defaultArtPool.ts), so subjects are deliberately evocative
# rather than news-specific.
#
# LOW PRIORITY by Silas's own instruction: these are filler behind the daily
# dream and project art already queued. Once they land, run
# `npm run audit:default-art -- --write` in kind_robots to promote the ones
# actually being served into READY_DEFAULT_ART -- listing a name before its file
# exists puts an empty plate back on the card.
