project: sketchy
kind: software
notes_from_silas: 'Sketchy is a web app that gives drawing assignments adjusted for the user''s skill
  level,

  then uses AI to judge the submitted result and offer the next assignment. Free users get

  a limited number of critique/generation requests per day or period; paid users get higher

  token/request limits. The token/background economy should align with Kind Robots rather

  than creating a separate economy.


  Product direction: keep the interface friendly, minimalist, and encouraging. The AI judge

  should critique constructively, identify skill growth, and recommend specific next studies;

  it should not be a cruel art-school goblin unless explicitly themed that way.

  '
