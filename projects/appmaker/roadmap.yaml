l bugs beyond the still-blocked art/admin steps. Found and fixed two: (a) appmaker-page.vue''s refresh() had no request-sequencing guard across its three call sites (onMounted, manual Refresh, createApp()''s post-create refresh), so a stale in-flight response could silently overwrite fresh fleet/pending state with stale data -- added a monotonic refreshToken so a stale response is dropped instead of applied; (b) conductorStore.fetchProjects(force=true) checked pending.value before the force bypass, so a force call made while any other fetch was already in flight silently no-op''d instead of fetching fresh data -- several call sites across the app (appmaker-page.vue, conductor-pitch-manager.vue, conductor-overview-gallery-page.vue, taskmaster-sample-tasks.vue, conductor-admin-data.client.ts) pass force: true and depend on it actually refreshing. Fixed by sharing the in-flight promise so a concurrent caller awaits real completion instead of a false no-op. Also added client-side slug validation mirroring the server''s SLUG_RE, with an inline error and disabled submit instead of only surfacing invalid input after a round trip. kind_robots PR #1135 merged. Verified via npx vue-tsc --noEmit (npm run test), eslint, and prettier --check on both files (2 pre-existing eslint errors in conductorStore.ts at lines 82/214 confirmed unrelated via git stash); all kind_robots PR checks green. Steps (1) dashboard-tab/tutorial art and (3) the liveUrl admin Placements backfill remain blocked exactly as before -- kept ready.'
