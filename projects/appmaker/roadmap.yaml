- id: t-015
  milestone: m4
  title: Build the squash-graduation executor (conductor script + kind_robots endpoint) that consumes graduate-request Todos
  status: needs-human
  passes: 0
  stakes: irreversible
  gate_human: true
  note: |-
    Split off t-010's 2026-09-17 close-out (kind_robots#2802): that PR shipped only
    the request-filing half -- an admin-only POST /api/appmaker/graduate-request
    that validates the target installation/repo and files a "Graduate app
    '<slug>' to its own repo" Todo, without pushing anything to GitHub. This task
    is the actual mechanism: mint an installation token for the AppRepo's
    installationId, build a single commit (blob -> tree -> commit -> ref-update
    via the Git Data API -- NOT server/utils/appmakerGithub.ts's existing
    pushScaffoldBranchAndOpenPr, which does one Contents-API PUT per file and is
    the wrong shape for a squash push into a brand-new/empty repo) containing the
    apps/<slug>/ tree, push it to the target owner/repo, then open a second,
    separate PR in THIS (conductor) repo removing apps/<slug>/ from the monorepo.
    Both the target-repo push and the monorepo-removal PR are real, irreversible
    writes to repositories a bug here can't cleanly undo -- gate_human: true per
    appmaker/t-010's original design note (section 5c), which this task inherits
    unchanged.
    Consumes: open Todos matching `Graduate app '<slug>' to its own repo`
    (category AGENT, filed by graduate-request.post.ts) -- read the AppRepo row
    via the Todo's description for the target owner/repo/installation, and the
    'do not create another' idempotency note in the same Todo.
    Open design question carried from t-010's original research (not yet
    resolved by Silas): whether the target repo's initial commit needs a
    'default_branch' to exist first (an empty GitHub repo has no ref to build a
    tree on top of) -- appmakerGithub.ts's pushScaffoldBranchAndOpenPr assumes an
    existing branch/ref to fork from, which a genuinely empty target repo won't
    have. Confirm GitHub's Git Data API behavior for an empty repo (does creating
    the first blob/tree/commit let you create the initial ref directly, or does
    the repo need an initial commit via the regular Contents API first) before
    implementing.

    Built the squash-graduation executor:
    readConductorAppTree()/squashPushAppToRepo()/openConductorAppRemovalPr() in
    appmakerGithub.ts, wired into admin-only Todo-gated POST /api/appmaker/graduate-execute.
    Verified: new guard self-test + contract, all existing appmaker guard scripts, eslint,
    prettier, and a full vue-tsc --noEmit all pass clean. Not invoked against any real
    installation -- both writes are real, irreversible external-repo mutations (hard rule 2:
    drafts not live actions at this stakes level), and there is no open graduation Todo to
    test against in this sandbox anyway. PR: silasfelinus/kind_robots#3002 (open, CI
    running). Will merge the code (reversible -- it only adds an admin-gated endpoint, does
    not touch any live repo by itself) once green, then close this task at needs-human for
    Silas to review the mechanism and approve/trigger the first real graduation.

    FOR SILAS: The squash-graduation executor is built and merged -- silasfelinus/kind_robots#3002 (commit c1219a0). What it does: POST /api/appmaker/graduate-execute (admin-only) reads apps/<slug>/'s tree out of this conductor repo, pushes it as a single commit onto the target repo's default branch via the granted GitHub installation's token (handles both an empty and a non-empty target repo), then opens a PR in conductor removing apps/<slug>/. It only runs when an OPEN 'Graduate app <slug> to its own repo' Todo exists, and marks that Todo done only after the removal PR opens.

    TO APPROVE: this endpoint has NOT been run against any real repo -- there is no live graduation Todo to test it against, and both writes (the target-repo push, the removal PR) are irreversible per this task's own gate_human. Please review server/utils/appmakerGithub.ts's three new functions (readConductorAppTree, squashPushAppToRepo, openConductorAppRemovalPr) and server/api/appmaker/graduate-execute.post.ts in kind_robots#3002, then either: (a) file a real graduate-request for an app you want to actually graduate and let a future cycle call the new endpoint and watch it closely, or (b) ask for a dry-run mode (log-only, no writes) to be added first if you'd rather validate the push/removal logic before a live run. Setting approved_by_human: true and status: done unblocks nothing further downstream (t-015 has no listed dependents), so this is purely 'is the mechanism trustworthy enough to point at a real repo.'

    GATE TRIAGE 2026-09-30 (session 20260930T0600Z-gate-triage, requested by Silas in
    session): Legitimate: an irreversible production or external-repo action. Option (b), a
    dry-run mode, is ordinary reversible work, so it was filed as appmaker/t-016 (ready)
    instead of waiting on Silas to ask for it.
