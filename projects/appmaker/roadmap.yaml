- id: t-015
  milestone: m4
  title: Build the squash-graduation executor (conductor script + kind_robots endpoint) that consumes graduate-request Todos
  status: ready
  passes: 0
  stakes: irreversible
  gate_human: true
  note: |-
    Split off t-010's 2026-09-17 close-out (kind_robots#2802): that PR shipped only
    the request-filing half -- an admin-only POST /api/appmaker/graduate-request
    that validates the target installation/repo and files a "Graduate app
    '<slug>' to its own repo" Todo, without pushing anything to GitHub. This task
    is the actual mechanism: mint an installation token for the AppRepo's
    installationId, build a single commit (blob -> tree -> commit -> ref-update
    via the Git Data API -- NOT server/utils/appmakerGithub.ts's existing
    pushScaffoldBranchAndOpenPr, which does one Contents-API PUT per file and is
    the wrong shape for a squash push into a brand-new/empty repo) containing the
    apps/<slug>/ tree, push it to the target owner/repo, then open a second,
    separate PR in THIS (conductor) repo removing apps/<slug>/ from the monorepo.
    Both the target-repo push and the monorepo-removal PR are real, irreversible
    writes to repositories a bug here can't cleanly undo -- gate_human: true per
    appmaker/t-010's original design note (section 5c), which this task inherits
    unchanged.
    Consumes: open Todos matching `Graduate app '<slug>' to its own repo`
    (category AGENT, filed by graduate-request.post.ts) -- read the AppRepo row
    via the Todo's description for the target owner/repo/installation, and the
    'do not create another' idempotency note in the same Todo.
    Open design question carried from t-010's original research (not yet
    resolved by Silas): whether the target repo's initial commit needs a
    'default_branch' to exist first (an empty GitHub repo has no ref to build a
    tree on top of) -- appmakerGithub.ts's pushScaffoldBranchAndOpenPr assumes an
    existing branch/ref to fork from, which a genuinely empty target repo won't
    have. Confirm GitHub's Git Data API behavior for an empty repo (does creating
    the first blob/tree/commit let you create the initial ref directly, or does
    the repo need an initial commit via the regular Contents API first) before
    implementing.
  updated: '2026-09-17T16:00:00Z'
