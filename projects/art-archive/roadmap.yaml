    title: "Implement idempotent private+mature ArtImage and folder-ArtCollection import"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-004
    note: >
      Reconcile scanner entries into ArtImage records with isPublic=false and
      isMature=true every time, never inferred from Resource metadata. Create or
      reuse a private+mature folder ArtCollection based on the image's immediate
      parent folder. Use parentFolder/full relative path to disambiguate repeated
      folder names. Re-scans must not duplicate existing content. A missing or
      unresolved checkpoint/LoRA never blocks image import; retain its raw
      metadata for later reconciliation.

  - id: t-006
    milestone: m2
    title: "Build confidence-ranked matching from legacy metadata to active checkpoint and LoRA Resources"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-004
    note: >
      Match only active Resources with compatible types. Prefer embedded ids,
      then exact localPath/name/customLabel and normalized basename matches,
      then parsed A1111/Comfy model and LoRA names/hashes. Folder/file-name clues
      and fuzzy matching are suggestions only. Return candidates with evidence
      and confidence; never let a Resource's maturity flag alter ArtImage
      privacy. Unmatched embedded names/hashes/tokens feed the missing-Resource
      backlog rather than being discarded.

