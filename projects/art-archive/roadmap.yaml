      Implemented matchArchiveResources() in server/utils/artArchiveResourceMatch.ts on
      kind_robots claude/eager-bohr-v8dejz. Tiered matching: embedded hash > exact name >
      normalized basename > folder/file-name substring suggestion; a tier is only consulted
      once every tier above it found nothing, and a same-tier tie returns all candidates
      rather than an arbitrary pick. Unmatched evidence retained per checkpoint/LoRA slot for
      t-021's backlog. JPEG/WebP return no evidence (t-004 has no structured fields for those
      formats). Never reads isMature/isPublic -- enforced by a self-test source scan, not just
      a comment. Also wired t-005's already-shipped verifyArtArchiveImporter.mjs into CI
