  - id: t-006
    milestone: m2
    title: "Build confidence-ranked matching from legacy metadata to active checkpoint and LoRA Resources"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    depends_on: t-004
    note: >-
      Match only active Resources with compatible types. Prefer embedded ids,
      then exact localPath/name/customLabel and normalized basename matches,
      then parsed A1111/Comfy model and LoRA names/hashes. Folder/file-name clues
      and fuzzy matching are suggestions only. Return candidates with evidence
      and confidence; never let a Resource's maturity flag alter ArtImage
      privacy. Unmatched embedded names/hashes/tokens feed the missing-Resource
      backlog rather than being discarded.

      Implemented matchArchiveResources() in server/utils/artArchiveResourceMatch.ts on
      kind_robots claude/eager-bohr-v8dejz. Tiered matching: embedded hash > exact name >
      normalized basename > folder/file-name substring suggestion; a tier is only consulted
      once every tier above it found nothing, and a same-tier tie returns all candidates
      rather than an arbitrary pick. Unmatched evidence retained per checkpoint/LoRA slot for
      t-021's backlog. JPEG/WebP return no evidence (t-004 has no structured fields for those
      formats). Never reads isMature/isPublic -- enforced by a self-test source scan, not just
      a comment. Also wired t-005's already-shipped verifyArtArchiveImporter.mjs into CI
      (existed since kind_robots#2818 but nothing ran it). Verified: eslint clean, self-test
      (verifyArtArchiveResourceMatch.test.ts) covers hash/exact/basename/suggested tiers,
      ambiguous ties, CHECKPOINT/LORA pool separation, unmatched backlog retention,
      unsupported-format short-circuit, and the isMature/isPublic structural invariant. vue-
      tsc running; PR opens once clean.

      Merged kind_robots#2819. All 49 CI checks green (including the new resource-match self-
