# Art Archive - legacy AI-art ingestion and curation
# Created from Silas's 2026-09-17 direction.

project: art-archive
kind: software
goal: "Continuously reconcile a large legacy AI-art filesystem into private, mature Kind Robots ArtImages with trustworthy resource provenance and an admin-only curation and regeneration workspace."

notes_from_silas: |
  This is the migration and curation home for a large collection of AI art made
  before the current Kind Robots infrastructure existed.

  The source is a dedicated media-server folder that may contain arbitrarily
  deep subfolders. New images and folders will continue to be dropped into it.

  Every imported image starts private and mature in Kind Robots: isPublic=false
  and isMature=true. Resource matching is provenance only. A safe/SFW Resource
  match must never cause an imported ArtImage to become public or non-mature.

  The image's immediate parent folder determines its folder-derived
  ArtCollection. Nested paths are allowed. Folder collections are also private
  and mature. Custom ArtCollections may be added independently.

  Repeated scans must be idempotent and remember prior work. The admin UI needs
  processed/unprocessed filtering, folder and collection browsing, safe move and
  delete operations, manual collection assignment, metadata editing, resource
  correction, 1-5 ratings, and drag/drop action presets such as "regenerate
  with this additional LoRA".

  Prefer exact/deterministic metadata and Resource matches. Smart/fuzzy matching
  may suggest candidates, but ambiguous matches must remain reviewable instead
  of being silently attached.

  Production archive storage is already mounted read/write from
  /mnt/user/pc/kindrobots/private to /app/private, with PRIVATE_PATH=/app/private.
  The first batch of files is present now and more will be added over time.

  Missing checkpoints and LoRAs are expected. Import must continue when a model
  cannot be resolved, preserving the raw embedded name/hash/token evidence and
  producing a deduplicated backlog of Resources to locate and add later.

