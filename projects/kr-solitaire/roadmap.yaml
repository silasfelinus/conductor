# Kind Robots Solitaire — built in kind_robots, free-to-play (no LLM in the player path).
# Cross-repo software project: this roadmap owns task state; implementation ships in silasfelinus/kind_robots.
# Architecture and guardrails live in DESIGN-BRIEF.md. Read it before claiming anything.
project: kr-solitaire
kind: software
goal: A visitor plays Klondike solitaire (draw 1 and draw 3) in the browser using a hand-designed 52-card
  Kind Robots deck and Kind Robots card backs, with undo, hints, auto-complete, saved stats and a daily
  deal, checked at phone, tablet and desktop widths and accepted by Silas. No LLM and no account required.
notes_from_silas: "2026-10-02 pitch: \"a solitaire game using our cards for backing, plus specially designed\
  \ kind robots\n  52 card deck.\" Free-to-play push: this is playable by anyone at zero token cost. Image\
  \ generation is\n  plentiful, so the deck is real art: 52 faces plus backs, produced by sessions ahead\
  \ of time.\n  Hard rules: no LLM in the player path; the game rules are pure code with tests; art is\n\
  \  pre-generated and committed. Agent picks, each a one-line edit if Silas disagrees: Klondike first\n\
  \  (Spider, FreeCell and Pyramid are later); four suits of robots rather than hearts and spades only;\n\
  \  the \"cards for backing\" are the existing Kind Robots card art used as selectable card backs.\n"
