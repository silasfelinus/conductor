project: butterfly-gallery
kind: software
goal: "Ship /butterfly-gallery as a private, mature-aware Kind Robots art-curation experience: a fast drag/drop sorter staged as an animated rainbow-butterfly gallery room, while leaving ingestion/provenance ownership in art-archive."

notes_from_silas: |
  Butterfly Gallery is a SEPARATE project from art-archive.

  art-archive owns ingesting the legacy filesystem, reconciling files into
  private/mature ArtImages, recovering checkpoint/LoRA provenance, and exposing
  the private-art source. butterfly-gallery consumes those ArtImages; it does
  not own scanning, archive reconciliation, or Resource matching.

  The intended route is /butterfly-gallery. It belongs in the Kind Robots Plan
  channel under Projects. The page itself is an admin/private curation surface
  and must remain compatible with the app's mature-content visibility rules.

  The visual premise is an animated gallery sorting room. On first entry a
  ceiling trapdoor opens and framed pictures tumble into a pile. Rainbow
  butterflies, the Kind Robots mascot, carry pictures around with varying levels
  of success: some tow frames on strings, some work in pairs, some struggle
  alone. After the intro, the page settles into a calm working state.

  The steady-state composition has a painting pile at bottom/center, one selected
  image in a prominent central frame, customizable drag/drop bins on the left
  and right, and a peekaboo opening/window where butterflies pass in the
  background. The whimsy must never slow down the actual sorting workflow.

  Drag/drop is primary theater, not the only control. Every action must have a
  click/tap and keyboard-accessible fallback. Intro motion is non-looping,
  skippable, session-aware, and respects prefers-reduced-motion.

  Build functional behavior first, then static art direction, then motion. Do
  not block useful curation work on final animation assets.

  MOTION ASSET HOLD (2026-09-18, Silas relaying Moseley): butterfly animation
  rendering is cancelled for now. Generated clips are not useful until the exact
  production dimensions for the butterfly background/compositing surface are
  known. Keep the existing storyboard/shot list as planning references, but do
  not generate or catalog reusable butterfly motion assets until those dimensions
  are locked.

  MOTION DIRECTION UPDATE (2026-09-19, superseding the earlier same-day
  procedural-butterfly note): Butterfly Gallery has its own illustrated mascot
  reference at /images/butterfly-gallery/gallery-butterfly-start.png. It remains
  recognizably in the same rainbow-butterfly universe as Butterfly Scouts but has
  more personality for close-up/perched behavior. Use that illustrated butterfly
  as the visual source for BOTH the left foreground loop and the smaller runway
  carry/tow animations. Do not force the procedural Butterfly Scouts DOM/CSS
  renderer into this feature.

  The approved static assets are now installed and served by the media server at
  /images/butterfly-gallery. Animation jobs may now be submitted using the exact
  production runway/background image and target crop/dimensions as the first
  frame/reference. For runway animations, use runway-background.png as the static
  scene and gallery-butterfly-start.png as the butterfly reference, adding blank
  portrait/frame props for carry/tow behavior. For the lower-right robot loop, use
  robot-sift-start.png plus the exact lower-right production crop. The existing
  blank-state CSS loop may remain unless visual review later prefers generated
  motion.

  RENDER PRIORITY OVERRIDE (2026-09-19, Silas): the art queue still has a large
  backlog from prior work. Butterfly Gallery ANIMATION jobs may be submitted now
  but MUST use the lowest ArtJob priority band, priority 0. The queue is ordered
  by priority descending, so these jobs intentionally sit behind priority-100,
  priority-200, and other elevated work. Do not promote them merely because the
  Butterfly Gallery project itself is high priority for agent work.

  Keep butterfly-gallery HIGH priority until complete and order it immediately
  ahead of art-archive for agent pickup. Art generated for this project uses
  ArtJob priority 200, matching Daily Dream art and outranking the Resource/LoRA
  preview refill lane.

