project: butterfly-gallery
kind: software
goal: "Ship /butterfly-gallery as a private, mature-aware Kind Robots art-curation experience: a fast drag/drop sorter staged as an animated rainbow-butterfly gallery room, while leaving ingestion/provenance ownership in art-archive."

notes_from_silas: |
  Butterfly Gallery is a SEPARATE project from art-archive.

  art-archive owns ingesting the legacy filesystem, reconciling files into
  private/mature ArtImages, recovering checkpoint/LoRA provenance, and exposing
  the private-art source. butterfly-gallery consumes those ArtImages; it does
  not own scanning, archive reconciliation, or Resource matching.

  The intended route is /butterfly-gallery. It belongs in the Kind Robots Plan
  channel under Projects. The page itself is an admin/private curation surface
  and must remain compatible with the app's mature-content visibility rules.

  The visual premise is an animated gallery sorting room. On first entry a
  ceiling trapdoor opens and framed pictures tumble into a pile. Rainbow
  butterflies, the Kind Robots mascot, carry pictures around with varying levels
  of success: some tow frames on strings, some work in pairs, some struggle
  alone. After the intro, the page settles into a calm working state.

  The steady-state composition has a painting pile at bottom/center, one selected
  image in a prominent central frame, customizable drag/drop bins on the left
  and right, and a peekaboo opening/window where butterflies pass in the
  background. The whimsy must never slow down the actual sorting workflow.

  Drag/drop is primary theater, not the only control. Every action must have a
  click/tap and keyboard-accessible fallback. Intro motion is non-looping,
  skippable, session-aware, and respects prefers-reduced-motion.

  Build functional behavior first, then static art direction, then motion. Do
  not block useful curation work on final animation assets.

  Keep butterfly-gallery HIGH priority until complete and order it immediately
  ahead of art-archive for agent pickup. Art generated for this project uses
  ArtJob priority 200, matching Daily Dream art and outranking the Resource/LoRA
  preview refill lane.

