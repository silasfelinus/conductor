# Tarot Studio — user-directed extension of Kind Oracle, 2026-11-20 PT
project: tarot-studio
kind: software
goal: >-
  Build a private admin tarot production studio for SuperKate, Kind Robots and Zuzu: 78 cards and deck backs, editable prompts and model settings, verified ArtJob provenance, review, filtering and printer-ready exports. Finish the private decks and accessible workflow; printing, commerce, paid fulfillment and publication require separate human authorization.
notes_from_silas: |
  Recover and reuse Kind Oracle, don't replace it. The first product is a private SuperKate deck.
  Other decks include Kind Robots and Zuzu, with space for more. Every card's prompt,
  checkpoint, LoRAs and review status must be adjustable in the admin bible.
  Filter by deck, checkpoint, rank, suit and major/minor arcana.
  Future Kind Robots deck: sell in the accessible giftshop, first by paid order +
  admin fulfillment email, later by printer API auto fulfillment.
# Playtest-readiness requirements: docs/agents/main-game-standard.md (project acceptance ownership).
