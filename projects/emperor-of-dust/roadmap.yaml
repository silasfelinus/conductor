# Zuzu-world prequel: the emperor's one hundred days.
project: emperor-of-dust
kind: software
autonomous: true
goal: >-
  Deliver a map-led, 100-day original wasteland dispatch/strategy game in
  the Zuzu universe before Book One: 100 authored daily incident sets,
  zero-to-three follower assignments, skill odds and consequential moral
  choices, injury and permanent death, Prosperity-funded recruiting,
  consumable Support Hoard, Popularity, multi-faction tension and wars,
  hidden low-resource recovery questlines and multiple endings. Begin
  in Admin; full Play launch requires explicit publication approval.
notes_from_silas: |
  2026-10-11 PT: Inspired by This Is the Police and Dispatch, play the
  emperor governing the Zuzu wasteland before Zuzu appears. Dispatch
  0–3 limited followers, sometimes probability, often moral dilemmas.
  Bad choices or missions can injure or kill helpers. Script exactly 100
  days. Prosperity buys recruitment; support hoard raises success odds;
  bad results lower popularity and hoard. Poor outcomes create hidden
  easier but darker questlines and change factions. Hollow Bell has a
  genial pragmatic mayor, Storm Crows connive, hyena raiders are punk,
  swamp witches request defense while concealing their deeper malice.
  Young Komodo can advise. Bible first, filler Admin frontend.
