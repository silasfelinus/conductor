      roughly quadratically with days). decodeBook allows 3 MB, but autosave plus three manual
      slots (each a whole book) can approach the ~5 MB localStorage quota. Options: store dawn
      snapshots without the accumulated reports (rebuild them from the current run on rewind),
      or delta-encode dawns. Must keep the SYSTEMS-V03 save rules: validated saves, never
      overwrite unreadable data, rewind to any dawn. Add a contract test bounding a full run's
      encoded size.

      Merged kind_robots#3934 as 5ce02a7f64557d9e2d55c0393ce24a73e9430d83 (21/21 checks). v4
      save format packs each dawn's accumulated lists as shared-prefix + tail; full 50-day
      books 680-952 KB -> 92-116 KB (~8x); v3 books/slots migrate on read; tampered packing
      rejected. Contract bounds a full book under 250 KB and proves packed rewinds equal full
      rewinds at dawns 1/2/17/33/50. Caveat: during a deploy an old-code tab would read a v4
      autosave as unreadable.
