# Zuzu-world prequel: the emperor's fifty days (v0.3 fortress redesign, 2026-10-18 PT).
project: emperor-of-dust
kind: software
autonomous: true
goal: >-
  Deliver an art-led, 50-day wasteland ruler game in the Zuzu universe before
  Book One (SYSTEMS-V03.md): a Fortress with throne room audiences, quest
  room, barracks, market and map room; quests lasting 1-3 game days with
  1-4 of 20 named followers who carry secret skills, weaknesses, hidden
  allegiances and one unique ability; brass currency, 5 local and 10
  kingdom factions, act-end map changes, Young Komodo's Day 40 betrayal and
  an Act V hideout, injury and rare death, romance and multiple endings.
  Begin in Admin; full Play launch requires explicit publication approval.
notes_from_silas: |
  2026-10-20 PT, style: "For writing style notes: we want crisp stark prose. Stephen King or
  his son Joe Hill, lone wolf and cub". Same day, direction: accelerate development; all paths
  interesting and unique, engaging conflicts and teetering influences, an engaging visual-novel
  style (but more verbose) where the reader is often asked to make choices that question
  morality; wide leniency on art submissions and rerolls. Writing contract:
  projects/emperor-of-dust/SCENE-WRITING-GUIDE.md ("Prose style" section governs).
  2026-10-18 PT (later): "given the nature of passing and failing quests, we should have
  a robust load/save system, and allow the player the option to rewind to previous days
  (though random events will stay random, another pass will not create the same events
  necessarily)". Spec: SYSTEMS-V03.md "Saves, load and rewind". Silas approved every
  v0.3 design call (brass, five stats, factions, Komodo's motive): "love everything,
  especially brass. all approved".
  2026-10-18 PT redesign (supersedes the Horde, hour clock and 100-day/100-follower
  scale below; full spec projects/emperor-of-dust/SYSTEMS-V03.md):
  Sovereign Tower is the flow reference, not a style to copy: scripted and
  randomized elements on a day cycle, quests taking 1+ days, named followers with
  unique designs, romanceable characters, injury and death, moral and flavor
  choices, a world map, kingdom and local factions, a straightforward coin system,
  art-driven interactions with stylish simple text and a speed-up text stream.
  Remove the Horde. Followers have stats, secret skills and weaknesses revealed
  when relevant and remembered across games, one fully unique ability, faction
  modifiers, an origin that may hide a different allegiance, an illustrated mode
  (happy, excited, sad, angry, neutral) and a portrait mode (neutral, injured,
  dead). Track game days, not hours: quests take 1-3 days with 1-4 followers and
  expire, possibly with consequences. Fortress view: throne room (daily
  encounters, recruiting, wasteland issues opening new paths, solutions gated by
  money, allegiances or faction-support thresholds), map room (factions, taxes,
  affinity), barracks (talk to followers, upgradeable capacity), market (items
  for stat bonuses or powers), quest room (assign, then Finish; animated
  day/night; next morning shows results, with quest-specific responses in the
  throne room and barracks). 4-6 local fortress factions, 8-12 location/race
  kingdom factions. NPCs get illustrated reactions, no portraits for small
  choices. 50 days and 20 followers to begin. Young Komodo is the advisor, not
  romanceable, and betrays the emperor at Day 40+, starting the final act along
  with kingdom-wide war and unleashed cosmic horrors. The map changes about every
  10 days (factions taking territory, wipe-outs, new locations). The final act
  moves from the fortress to a hideout with revolutionaries whose location
  depends on the factions supported. Money must not be dollars or gold (v0.3
  proposes brass).
  2026-10-12 PT clarification (supersedes the 2026-10-11 Support Hoard idea):
  The Horde is a headcount that grows/shrinks through events, recruitment and loss.
  Named followers command portions of this Horde on missions, not a support-token
  currency. Author 100 recruitable leaders with personality, faction ties and
  Might/Diplomacy/Ingenuity. Three initial artworks per leader: healthy portrait,
  injured portrait, larger splash; optional additional emotion/scene variants
  as warranted up to 20 per character. Injuries should be fairly common and
  take X full days to heal; permanent character death must be rare. Use a
  pausable day clock and 1–5h outward road time plus mission and return travel.
  Draw mostly straight paths from Emperor's Tower at the top center.
  Every day 1–100 has three prewritten reports (two truths and a lie),
  Young Komodo gives imperfect hints. Persist awarded Items of Power between
  runs, only one or two equipped per run; the Eye of the Elder Crow highlights
  the lie. Include Mole Revolutionaries, enemies of the swamp witches,
  who seek the emperor's overthrow but can eventually be won over.
  Full spec: projects/emperor-of-dust/SYSTEMS-V02.md.
  2026-10-11 PT: Inspired by This Is the Police and Dispatch, play the
  emperor governing the Zuzu wasteland before Zuzu appears. Dispatch
  0–3 limited followers, sometimes probability, often moral dilemmas.
  Bad choices or missions can injure or kill helpers. Script exactly 100
  days. Prosperity buys recruitment; support hoard raises success odds;
  bad results lower popularity and Horde strength (earlier token interpretation superseded). Poor outcomes create hidden
  easier but darker questlines and change factions. Hollow Bell has a
  genial pragmatic mayor, Storm Crows connive, hyena raiders are punk,
  swamp witches request defense while concealing their deeper malice.
  Young Komodo can advise. Bible first, filler Admin frontend.
