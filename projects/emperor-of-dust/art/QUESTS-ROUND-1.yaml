# Emperor of Dust quest art, round 1 (t-029, Silas 2026-10-19 PT: "there should be images for all
# choices and outcomes. Each quest should have an image to present it and then at the day's close,
# we should see full displays with the image and outcome for each quest").
# Three images per quest, generated from the authored quest text (scratchpad generator; titles,
# summaries and success/failure lines as of kind_robots main 29f1bef): a notice image that presents
# the quest on the board and in its detail card, and a success and a failure scene for the dawn
# report (triumph shows success, partial shows failure). Notices are listed first so they render
# first. Exports go to kind_robots public/emperor-of-dust/quests/<asset>.webp and into QUEST_ART;
# until then the game crops Silas's painted map around the quest's region.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Review 2026-10-20 (t-029): `approved` lists the 228 renders reviewed on contact sheets and exported to kind_robots
# (questArt.ts QUEST_ART, 960x548 WebP) in kind_robots#3915. q-d42-cave-forage is held back (`rejected`); its -v2
# rerolls drop the crow-roost region tags and were still queued behind the art backlog (`pending`). Until
# they are approved and exported, that quest shows the painted-map crop.
# Review 2026-10-21 (t-033): the -v2 rerolls dropped the crows but none shows the cave (an empty campsite, two
# foragers eating at an open-air fire, a pot on a bare slope), so all three are `rejected` and rerolled as -v3
# with the cave as the framing shot. The quest keeps the painted-map crop until a -v3 set is approved.
