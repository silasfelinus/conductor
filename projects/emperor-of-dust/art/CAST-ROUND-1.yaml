# Emperor of Dust cast art, round 1 (emperor-of-dust t-012): the design lock.
# Silas approved all cast art on 2026-10-19 ("All art approved"). The 246 images are 20 followers x 8
# (five illustrated moods, three portraits) plus 17 NPCs x 5 moods plus Young Komodo's betrayal image.
# This round renders ONE image per character, the illustrated neutral mood, at two seeds. A keeper is
# picked per character, and round 2 derives that character's other moods and portraits from it by
# sdxl-img2img on the same checkpoint, so species, costume and palette hold across all eight images
# (the zuzu-shifting-lands t-029 method; Silas: "arthemy was the default for a reason").
# Design tags come from FOLLOWERS-V03.md and NPCS-V03.md, plus FOLLOWERS-PILOT-01.md for F001, F002,
# F004, F005 and F008 (2026-10-19 species swaps applied).
# cast_loras is off: the series' auto LoRAs would put Zuzu's LoRA on Kiyo ("koala") and the fennec
# toddler's on any "toddler" line. Only the Abbess carries one, her canon zkaabbess (4595, 0.8).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Review 2026-10-19: keepers chosen for 24 characters (see `keepers`). Thirteen missed the brief
# (Kiyo, Flint, Pip, Lumen, Sable, the Envoy, Mara, Vane, Oriel, Ferro, Ottoline, Granny Umber,
# Jinx) and get a c/d reroll with weighted design tags and targeted negatives.
# Review 2 (2026-10-19): ten rerolls kept (see `keepers`); Flint (sauropod neck), Lumen (still a
# dog) and Granny Umber (a cat) get e/f rerolls with stronger species tags.
round: emperor-cast-1
project_slug: emperor-of-dust
designer: Comic Studio
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    weathered, grimy, dramatic lighting
  suffix: ash-grey sky, kiln ochre and tarnished brass palette, salvage, dusty, wasteland
  steps: 30
  cfg: 5
  sampler: euler_ancestral
