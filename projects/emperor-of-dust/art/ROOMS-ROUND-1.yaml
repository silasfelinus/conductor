# Emperor of Dust room backdrops, round 1 (frontend art-direction pass, 2026-10-19 PT).
# Silas asked to close the gap between the shipped fortress UI and the painted drafts
# (concepts/painted-screens.webp, painted-fortress-cutaway.webp). Those drafts are art-led:
# each room is a full painted scene with the interface laid over it. These six backdrops are
# that scene layer, one per room, at two seeds each, on the cast's house checkpoint so the
# rooms and the 246 cast images share one palette. Scenes keep the centre-left open and the
# right third quiet, because the room panels sit there. No text in the art: every name,
# number and label stays live HTML.
# The map room's table map is NOT rendered here: the map room shows Silas's painted canon map
# (concepts/painted-wasteland-canon.webp) with live pins over it.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# `keepers` names the seed exported to kind_robots public/emperor-of-dust/rooms/<room>.webp.
round: emperor-rooms-1
project_slug: emperor-of-dust
designer: Comic Studio
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    weathered, dramatic lighting, painterly background art, scenery, wide establishing shot
  suffix: kiln ochre, deep crimson and tarnished brass palette, warm candlelight against dusty gold haze, salvage,
    wasteland fortress, every surface bare and unmarked
  steps: 30
  cfg: 5
  sampler: euler_ancestral
