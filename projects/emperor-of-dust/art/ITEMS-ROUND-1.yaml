# Emperor of Dust market item icons, round 1 (t-024 follow-up, 2026-10-20 PT).
# kind_robots#3936 shipped 30 market items with placeholder glyphs; ITEM_ART in
# utils/emperorOfDust/fortress/items.ts switches an item to public/emperor-of-dust/items/<id>.webp
# once a keeper is exported. One seed per item; reroll rejects as -v2 subjects. Square icons, a single object,
# no text, the cast's house checkpoint and palette so items sit with the rooms and portraits.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
round: emperor-items-1
project_slug: emperor-of-dust
designer: Comic Studio
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    weathered, dramatic lighting, still life, single object, centered, item icon, object focus
  suffix: kiln ochre, deep crimson and tarnished brass palette, warm candlelight, dark plain background, salvage,
    wasteland
  steps: 30
  cfg: 5
  sampler: euler_ancestral
