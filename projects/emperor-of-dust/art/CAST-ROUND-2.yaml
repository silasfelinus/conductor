# Emperor of Dust cast art, round 2 (emperor-of-dust t-012): every other image, from the keepers.
# Each round-1 keeper (CAST-ROUND-1.yaml `keepers`) is repainted on the same Arthemy checkpoint by
# sdxl-img2img: four illustrated moods (denoise 0.6), and for followers three portraits from a bust
# crop of the keeper (neutral 0.35, injured 0.5, dead/memorial 0.6); Young Komodo also gets his
# betrayal image (0.7). Keepers and these renders together make the 246 approved images.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Spot-check 2026-10-19: at denoise 0.6 the moods are on-model but too subtle (sad/excited barely move),
# and injured/dead portraits show no bandages or frame. `-v2` subjects probe stronger settings on
# Rook and Ash (moods 0.72 with weighted emotion tags; injured 0.65; memorial 0.78).
# `approved` lists the renders reviewed and exported to kind_robots (castArt.ts).
# v2 settings adopted for every character after the Rook/Ash probe (2026-10-19): moods 0.72 with
# weighted emotion tags, injured 0.65 with weighted bandages, memorial 0.78 with a weighted brass
# frame and sepia. The -v2 cells replace the 0.6 renders; neutral portraits keep v1.
round: emperor-cast-2
project_slug: emperor-of-dust
designer: Comic Studio
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: house-i2i
  label: Arthemy Western Art v3.0 img2img from the round-1 keeper
