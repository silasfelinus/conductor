# Emperor of Dust market item icons, round 2 (2026-11-19 PT, emperor-of-dust/t-033). Contact-sheet curation of
# ITEMS-ROUND-1 kept 6 of 30. The round-1 lane suffix "warm candlelight" put a lit candle into almost every icon, so
# 24 came back as a candle in a dish instead of the item. Same lane and asset paths; the suffix now asks for rim light,
# the negative names candles, flames and second objects, and each prompt says the item is the only object. Fresh seeds.
# Curate on a contact sheet, export keepers with scripts/export_round_art.py --only, add ids to ITEM_ART. auto_submit.
round: emperor-items-2
project_slug: emperor-of-dust
designer: Comic Studio
is_public: false
is_mature: false
cast_loras: false
auto_submit: true
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    weathered, dramatic lighting, still life, single object, centered, item icon, object focus
  suffix: kiln ochre, deep crimson and tarnished brass palette, warm rim light, dark plain background, salvage,
    wasteland
  steps: 30
  cfg: 5
  sampler: euler_ancestral
