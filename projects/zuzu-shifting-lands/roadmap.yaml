# Zuzu: Shifting Lands — 5-land experiential board-game project
project: zuzu-shifting-lands
kind: software
autonomous: true
goal: >-
  Deliver an image-led, replayable Zuzu expedition at /play/zuzu-shifting-lands
  (Zuzu Play placement per the 2026-10-13 direction; /admin/zuzu-shifting-lands
  remains the owner preview),
  with five shifting lands, three encounters per land, five major trials,
  seeded selection from fixed-cast illustrated authored encounter pools,
  cross-project Zuzu Character/Facet/Scenario/Reward/ArtImage reuse, interactive
  board-grid travel, consequences, companions, skills, equipment, save/resume,
  card fronts/backs, physical draw/discard decks, deal/flip/reveal animations,
  sound and accessible mobile/tablet/desktop acceptance. Polish and play
  acceptance by Silas, and human authorization before outward public publication,
  stay gated.
notes_from_silas: |
  2026-10-09 PT: A new, independent Armello-style experiential digital board
  game. Zuzu travels through five mutable lands starting in the wasteland;
  roughly three location encounters per land, discovering companions,
  enemies, rewards, skills and loot, passing or failing skill checks. Every land
  ends in a major boss/challenge if Zuzu survives. The board uses a card-based
  grid that shows the world and where Zuzu has traveled.
  LATEST 2026-10-09 CREATIVE OVERRIDE: Each Shifting Lands encounter card
  pre-authors its species, occupation, cast, scene, choices and specific art.
  No separate species x job random draw in gameplay. Titles remain evocative,
  with species communicated by illustration. Locations hold 2+ good/bad/mixed
  authored possibilities; a seeded run persists the chosen card and rolls
  two-dice outcomes for 2+ meaningful player choices. Flip must rest in a
  readable face-up state using KR effects. Add custom Zuzu encounter and
  boss backs. See encounters/IMPLEMENTATION-ORDER.md. Other projects may
  still use FacetProfile taxonomies, and species never implies morality.

  Zuzu is an outsider who behaves according to Edo-era samurai conventions
  within a hazy-boundaried weird-west frontier. Locations can move/change
  causally. Storm Crows are magical cave-dwelling witches; gorillas are
  possible high-level encounters with occult conditions. Reuse and tag the
  many existing Zuzu Characters/Scenarios/Rewards/Facet cards, LoRAs and
  artwork. Do not duplicate image/resource records; integrate with the
  central world registry. The Abbess's ritual agenda and the mystery of former humanity are
  intentional public-repository worldbuilding spoilers; Silas authorized
  documenting them openly on GitHub.
  Technical UI source of truth: projects/zuzu-shifting-lands/BOARD-CARD-ARCHITECTURE.md.
  Agents must reuse existing Kind Robots card components first.
  Agents are authorized to build reversible code and internal art drafts
  without another scope-confirmation wait. Internal generation must still
  respect actual resource, mana, rights and privacy restrictions.
  2026-10-18 PT (iPad, after playing Three Cups on the Table): "Zuzu shifting
  lands feels like it's lost some polish since we've been working on Shifting
  Desks. The writing feels stilted. We should be presenting it in second person,
  the zuzu lines are stilted (and will make it so we can't let players
  eventually run the same quest with different characters). The layout feels
  cluttered, takes up extra screens when we should just have a single page
  display with all relevant info. It's ok to have a new tab for journal or
  character sheet, but generally we want all info to be on one page. ... the
  challenge is three cups on the table, and the picture only shows a mouse and an
  empty table. ... Our shifting desks game has 24 random encounters for each
  level, five levels. I want an assessment of what shifting lands has, and aim
  for that level of complexity or better. We've also done work with simplifying
  and clarifying skill checks. While desks is more about weirdness and oddities,
  the world of zuzu should be about making tough decisions and facing the
  consequences of sacrifice and doing good in a world that doesn't always
  reward it." Assessment: DEPTH-ASSESSMENT-2026-10-18.md; tasks t-030..t-035.
