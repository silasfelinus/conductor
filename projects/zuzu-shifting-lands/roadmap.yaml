# Zuzu: Shifting Lands — 5-land experiential board-game project
project: zuzu-shifting-lands
kind: software
autonomous: true
goal: >-
  Deliver an image-led, replayable Zuzu expedition at /admin/zuzu-shifting-lands
  during the private preview; the public /play route launches separately,
  with five shifting lands, three encounters per land, five major trials,
  seeded reproducible species×occupation×disposition encounter composition,
  cross-project Zuzu Character/Facet/Scenario/Reward/ArtImage reuse, interactive
  board-grid travel, consequences, companions, skills, equipment, save/resume,
  card fronts/backs, physical draw/discard decks, deal/flip/reveal animations,
  sound and accessible mobile/tablet/desktop acceptance. Private admin preview
  first, human authorization before outward public publication.
notes_from_silas: |
  2026-10-09 PT: A new, independent Armello-style experiential digital board
  game. Zuzu travels through five mutable lands starting in the wasteland;
  roughly three location encounters per land, discovering companions,
  enemies, rewards, skills and loot, passing or failing skill checks. Every land
  ends in a major boss/challenge if Zuzu survives. The board uses a card-based
  grid that shows the world and where Zuzu has traveled.
  Species and class/occupation/role facets MUST be separate. In the first land
  (the Homestead), rabbits and otters may be randomized into farmer,
  caretaker, convent or other roles, with good/bad dispositions and motives
  independent of species. Character = named individual, Facet species =
  possible reusable participant template. Animal morphology remains readable;
  animals may have humanoid or metaphorical features.
  Zuzu is an outsider who behaves according to Edo-era samurai conventions
  within a hazy-boundaried weird-west frontier. Locations can move/change
  causally. Storm Crows are magical cave-dwelling witches; gorillas are
  possible high-level encounters with occult conditions. Reuse and tag the
  many existing Zuzu Characters/Scenarios/Rewards/Facet cards, LoRAs and
  artwork. Do not duplicate image/resource records; integrate with the
  central world registry. The Abbess's ritual agenda and the mystery of former humanity are
  intentional public-repository worldbuilding spoilers; Silas authorized
  documenting them openly on GitHub.
  Technical UI source of truth: projects/zuzu-shifting-lands/BOARD-CARD-ARCHITECTURE.md.
  Agents must reuse existing Kind Robots card components first.
  Agents are authorized to build reversible code and internal art drafts
  without another scope-confirmation wait. Internal generation must still
  respect actual resource, mana, rights and privacy restrictions.
