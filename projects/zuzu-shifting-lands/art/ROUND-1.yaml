# Zuzu: Shifting Lands art round 1 (zuzu-shifting-lands t-023 + t-026). Silas, 2026-10-11: "keep working on
# future upgrades, 23 and 26." One bespoke card illustration per authored encounter (12 Homestead for t-023, 36
# later-land for t-026) plus the four later major trials, two seeds each, in the Zuzu Gamebook house lane so the
# cards sit beside the gamebook plates the board already reuses. Prompts follow each card's fixed cast in
# encounters/*.json (species, occupation, costume, props; never reassigned) and its authored pronouns.
# One figure per card where the cast allows: the house lane draws single figures best (zuzu-gamebook rounds 9-11),
# and Zuzu stays out of frame (no LoRAs; his LoRA fuses with any second character, gamebook ROUND-12): each card is
# what Zuzu sees. Picks are recorded under `verdict`; a keeper is exported to kind_robots
# public/shifting-lands/cards/<card>.webp (never under /images, which Alexandria mounts over) and listed in
# utils/shiftingLands/sceneArt.ts BESPOKE_ART.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
