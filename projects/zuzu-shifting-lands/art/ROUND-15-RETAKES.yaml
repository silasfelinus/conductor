# Shifting Lands art round 15 (2026-11-14 PT, t-053): re-render of 11 plates rejected from ROUND-11 and ROUND-9.
# Lessons: a nun's veil hides the animal head unless the ears and muzzle are named; "cave folk", "farmer and wife",
# "young boy", "miner" and "children" came back human; a chalked board and an open deed carried writing. Every figure
# now names its species and visible features; papers are folded or bare. Two takes each.
# Delivery: cards -> public/shifting-lands/cards + the own card's `art` + BESPOKE_CARDS; endings ->
# public/shifting-lands/endings + SHIPPED_PERSONAL_ENDING_PLATES. priority 1000. auto_submit: true. Private.
