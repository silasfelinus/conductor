- key: shifting-lands-15-retakes-a-sisters-purse-at-the-fence-a
  entity: scenery
  title: A Sister's Purse at the Fence - own card (brother-peddler) (take 1)
  size: 1344x768
  seed: 55001
  task: t-053
  prompt_prose: 'A poor border farm at late afternoon, split-rail fence and a weathered farmhouse. An elderly sheep
    nun sits on a grey mule by the fence: her woolly white face, long sheep muzzle and floppy ears show plainly
    out of a grey veil, and she holds out a small leather purse with a serene smile. Facing her, seen from beside,
    a hare in a black frock coat with a tin bell at his neck hesitates, one paw half raised, his long ears up. Long
    amber light, a quiet bargain. Every figure in the scene is an anthropomorphic animal in worn frontier clothes,
    with animal heads, fur and tails.'
  card: a-sisters-purse-at-the-fence
