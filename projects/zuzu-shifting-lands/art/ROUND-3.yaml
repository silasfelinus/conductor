# Zuzu: Shifting Lands art round 3 (zuzu-shifting-lands t-029): the 22 consequence plates that missed twice
# in ROUND-2 (fresh seed, then a reroll with prompt fixes). Silas, 2026-10-13: "Are there still 22 missing? Find
# a solution." Text alone could not hold these: the lane kept painting the mole mason as a fox/rat, the boar as a
# feral herd, the washed-out bridge intact, the Verge door shut. So each one now starts from its card's approved
# ROUND-1 painting (source_image_id) and is repainted on the SAME Arthemy house checkpoint via sdxl-img2img: the
# keeper holds the species, costume and setting, the prompt moves the moment to the consequence. Not Kontext:
# Silas dropped the Flux lane for these plates on 2026-10-10 ("arthemy was the default for a reason").
# Three strengths per outcome (denoise 0.5 / 0.65 / 0.8: stay close to the card -> let the scene change), 66
# subjects; review picks at most one keeper per outcome. Keepers export to kind_robots
# public/shifting-lands/outcomes/<outcome>.webp and BESPOKE_OUTCOMES like ROUND-2.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
round: shifting-lands-3
project_slug: zuzu-shifting-lands
designer: Comic Studio
is_public: false
