# Zuzu: Shifting Lands art round 2 (zuzu-shifting-lands t-028): consequence plates. Silas, 2026-10-13: "when we
# make a choice between the two paths, we need to see a real display and new art showing the consequence of our
# action ... definitely needed for immersion and to really pay off the experience." One painting per authored
# OUTCOME: every choice of the 48 encounters (192) and of the five major trials (30), success and failure, 222
# subjects at one seed each; misses reroll as sl2r2-*. Same Arthemy house lane, frame and rules as ROUND-1: the
# fixed cast keeps its species/occupation/costume (identity tags copied from each card's ROUND-1 keeper), Zuzu stays
# out of frame (each plate is what Zuzu sees), one or two figures, injury implied and non-graphic, no lettering.
# Success and failure of a choice must read differently at a glance. Picks go under `verdict` ('keep: ...');
# scripts/export_shifting_lands_cards.py writes a keeper's `outcome` to kind_robots
# public/shifting-lands/outcomes/<card>--<choice>--<success|failure>.webp, listed in
# utils/shiftingLands/sceneArt.ts BESPOKE_OUTCOMES (kind_robots#3611 renders the consequence moment and falls back
# to the card art until a plate lands). The homestead trial has no ROUND-1 subject: its Abbess follows the otter
# convent cast and the comic-creator Abbess turnaround; children are kept out of every homestead plate.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
