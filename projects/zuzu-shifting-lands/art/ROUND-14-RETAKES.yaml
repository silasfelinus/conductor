  prompt_prose: Inside a dim frontier trading post. Nailed above the counter is a blank sheet of paper with a charcoal
    sketch of a one-eyed coyote's face and nothing else on it, every surface around it bare and unmarked. A thin
    opossum father in a patched coat studies the sketch, three small opossum kits clustered calmly at his legs,
    their pink noses and grey fur plain. Behind the counter a badger storekeeper in an apron wipes a jar. In the
    foreground, seen from behind, a coyote in a battered hat and green coat waits. Lamplight and dust. Every figure
    in the scene is an anthropomorphic animal in worn frontier clothes, with animal heads, fur and tails.
