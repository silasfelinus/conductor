# Shifting Lands ending plates, round 1 (2026-11-12 PT). Main-game standard item 6
# (docs/agents/main-game-standard.md): every ending has its own painted plate. Silas, 2026-11-11 PT: "If there is
# unmade art it should definitely be added to the pipeline." Today every finished journey shows the one shared
# /zuzu-gamebook/scenes/zuzu-alone.webp (kind_robots components/shifting-lands-journey-board.vue, ending reader).
# One subject per ending title the journey can close on (kind_robots 7ad1136):
#   10 mark endings, utils/shiftingLands/endingsV6.ts ENDINGS (key = EndingKind);
#    2 V7 retitles, utils/shiftingLands/endingsV7.ts: "The Debt Carried Open" (debt-carried-open) and
#      "A Road Wide Enough for Everyone" (road-wide-enough);
#    7 moral constellations, utils/shiftingLands/endingsConstellationsV7.ts (key = constellation id).
# The displayed title decides the plate: constellation title first, then the V7 retitle, then the mark ending.
# Shifting Lands is getting a character creator, so NO plate shows Zuzu or any protagonist: each paints the place
# and the people the ending leaves behind. Every role is given a species (ROUND-6/7 lesson: un-speciesed roles
# come back human), books and receipts are blank (pseudo-text lesson), Krea 2 prose lane as ROUND-6/7.
# Delivery: keepers export to kind_robots public/shifting-lands/endings/<id>.webp (asset below, under the game's
# existing public/shifting-lands/ root); the game PR maps ending title -> id and replaces the shared plate.
# priority 60 (game art ahead of the priority-1 backlog). auto_submit: true. Private.
