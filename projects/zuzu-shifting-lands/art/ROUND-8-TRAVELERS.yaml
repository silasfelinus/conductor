# Shifting Lands art round 8 (2026-11-12 PT): traveler portraits for the t-052 character creator. Silas, 2026-11-11
# PT: "Shifting lands should let us design a character and adjust stats ... obv zuzu should be one of the playable
# characters. As should Jeffery Mittens." The main-game standard (docs/agents/main-game-standard.md) queues character
# portraits in an auto_submit conductor ledger.
# kind_robots components/shifting-lands-character-creator.vue shows a portrait card per traveler, and the character
# rail and ending plate reuse it (utils/shiftingLands/characters.ts characterPortrait). Zuzu keeps his shipped plate
# (/zuzu-gamebook/scenes/zuzu-alone.webp). Jeffery Mittens and the fennec siblings use their gamebook scenes today
# (looter.webp, siblings.webp); these give them a dedicated traveler card. Custom travelers show the shared road plate
# (/zuzu-gamebook/scenes/shifting-road.webp) until their species portrait ships.
# Same Krea 2 prose lane and all-animal tail as ROUND-6/7 (prose lanes send no negative prompt). Every figure is given
# a species; nobody is described with the words the guardrails filter. Jeffery Mittens and the fennec siblings are
# children: calm, dignified portraits, no peril, no weapons raised (WORLD-GUIDE "Guardrails"). Custom species
# portraits are generic travelers, NOT canon characters: the koala wears no straw kasa and carries no sword, so it is
# never read as Zuzu; the coyote has both hands and no eyepatch, so it is never read as the vagrant.
# Curate: species right, one figure (two for the siblings), waist-up, no lettering, no extra limbs; mark keepers
# verdict: 'keep: ...'.
# Delivery (each step is required; a DONE render alone shows nothing in the game):
#   1. export each keeper to kind_robots public/shifting-lands/portraits/<asset>.webp (about 4:3, 1152x896);
#   2. kind_robots PR: for a species keeper, add its id to SHIPPED_SPECIES_PORTRAITS in
#      utils/shiftingLands/characters.ts; for jeffery-mittens / fennec-siblings, point that premade's `portrait` at
#      /shifting-lands/portraits/<asset>.webp. Portrait and blurb are presentation (characterFromSnapshot ignores
#      them), so existing V10 saves keep loading and pick up the new plate.
# priority: 1 (background). auto_submit: true. Private.
