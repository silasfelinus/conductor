  prompt_prose: Dusk on a rocky frontier trail. A skinny young raccoon with grey fur, a black mask and bright wary
    eyes stands half-turned toward the viewer, chin up, proud and a little defensive. He wears a long brown coat
    far too big for him over a grey-green vest and a dirty off-white shirt with rolled sleeves, a faded jackal-hide
    rag tied round one arm, and a string of four pairs of small boots hung round his neck by their laces. One paw
    is raised, black to the wrist like a mitten. His black-and-grey ringed tail curls behind him. Calm, quietly
    hopeful mood. Every figure in the scene is an anthropomorphic animal in worn frontier clothes, with animal heads,
    fur and tails.
