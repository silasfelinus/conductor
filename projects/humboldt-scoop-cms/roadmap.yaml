# Humboldt Scoop Solutions — unified product roadmap
# Historical project key retained for continuity: humboldt-scoop-cms.
# The original humboldt-scoop site project is finished. This roadmap owns all
# ongoing HSS work through web portals, field operations, mobile apps, and stores.
# Progress % = done weight (+ half for in-progress) / total weight.

project: humboldt-scoop-cms
kind: software

notes_from_silas: |
  2026-08-17 direction: this is the ONE continuing Humboldt Scoop Solutions
  project. The original humboldt-scoop project is finished; it successfully
  delivered the working public-facing site foundation. Do not create separate
  projects for the website, CMS, admin portal, worker portal, customer portal,
  Android app, or iOS app. They are surfaces of the same service and share the
  same customer/business data.

  The historical "CMS" slug is retained so task history and projection joins do
  not break, but its scope is now the whole product from today's website through
  production Android/iOS apps available in their stores.

  Admin/business-management and scooper/worker are NOT mutually-exclusive roles.
  Model them as independent capabilities. A person can be admin-only,
  scooper-only, or both. Customer access is a separate audience; authorized
  representatives are limited delegates of a customer account.

  Keep the system self-hostable and avoid paid API services except by explicit
  exception. Deterministic routing stays non-LLM. Real customer data, production
  credentials, payment-mode changes, destructive migrations, and outward-facing
  store publication remain explicit launch gates rather than being implied by
  ordinary development approval.

  Canonical implementation repository: silasfelinus/humboldtscoopsolutions.
  Conductor stores coordination/history only. Never implement against the old
  code copies under projects/humboldt-scoop*; salvage useful archaeology into
  the canonical repository instead.

