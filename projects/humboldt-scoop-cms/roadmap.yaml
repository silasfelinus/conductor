# Humboldt Scoop CMS — Customer Management Software
# New build. This is a starter roadmap — Silas, edit freely.
# Progress % = done weight (+ half for in-progress) / total weight.

project: humboldt-scoop-cms
kind: software

notes_from_silas: |
  Customer-management software for the Humboldt Scoop service. Starter roadmap —
  I'll refine. Think: customers, their pets/yards, recurring service schedules,
  visit logs, billing, and a customer route maker that produces a mapped route for
  a selected number of customer/user records. Pick a stack that's simple to self-host.
  Do NOT wire real payment, customer data, addresses, or map-provider billing without
  flagging me (needs-human). Build with seed/dummy data only until I say otherwise.

  Route planning should use deterministic routing/optimization rather than an LLM.
  Android is the first field-client target, while Linux and iOS compatibility remain
  goals. Approved AI features may use team-owned LLM tokens, with keys server-side.

