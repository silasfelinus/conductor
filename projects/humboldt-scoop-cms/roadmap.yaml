- id: t-043
  milestone: m11
  title: Build the Poopstakes drawing (10 winners/month Nov-Jan, once per household and per customer)
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  depends_on: t-040
  note: >-
    The rules are on the site and in the Service Agreement (HSS_Config::POOPSTAKES_*), but nothing draws winners or enforces "each household and each customer can win only once". Entries are the poopstakes checkbox on wp_hss_quote_requests. Needs a winners table keyed on a household (normalised service address) and a customer/email, and an admin screen that draws up to POOPSTAKES_WINNERS_PER_MONTH eligible entrants in an eligible month and records the prize (2 weeks of free weekly cleanup, or 30 minutes of unusual cleanup). Must be usable before November 2026. Also open (smaller, see docs/BACKLOG.md): asking existing customers to re-accept a newer agreement VERSION.

    Implemented and merged silasfelinus/humboldtscoopsolutions#89: new
    wp_hss_poopstakes_winners table (schema 2.17.0) and HSS_Poopstakes class, drawing up to
    POOPSTAKES_WINNERS_PER_MONTH winners a month for the Nov/Dec/Jan season, excluding any
    email or household that has ever won (not just this month). Household key: the quote
    form has no address field, so household_key_for_quote() uses the best available tier --
    the customer's primary property address once they've signed up, else a normalized phone
    number, else the email itself -- and records which tier was used. New 'Poopstakes' admin
    screen draws winners for an eligible month and lets an admin record which of the two
    prizes a winner got, email them, and mark it fulfilled. Also corrected
    site/tools/schema-dry-run.sh's EXPECTED_TABLES (stale at 12 against 15 real tables
    before this PR's 16th) and removed the now-shipped bullet from docs/BACKLOG.md. Verified
    via php -l on every changed file, a new site/tests/poopstakes-test.php (pure-function
    checks plus structural schema/wiring checks), and the full existing site/tests/*.php +
    *.sh suite -- all green, no regressions. Could not exercise draw()/eligible_entrants()
    end-to-end (needs $wpdb/WordPress) or run schema-dry-run.sh itself (needs the Alexandria
    MariaDB/Docker environment); flagged in the PR for a live smoke test before the first
    real November draw.
  updated: '2026-09-26T22:06:40Z'
  implementation_pr: 'silasfelinus/humboldtscoopsolutions#89'

