# Humboldt Scoop CMS — Customer Management Software
# New build. This is a starter roadmap — Silas, edit freely.
# Progress % = done weight (+ half for in-progress) / total weight.

project: humboldt-scoop-cms
kind: software

notes_from_silas: |
  Customer-management software for the Humboldt Scoop service. Starter roadmap —
  I'll refine. Think: customers, their pets/yards, recurring service schedules,
  visit logs, billing, and a customer route maker. The route maker must let the team
  choose a number or filtered set of customers, optimize their visit order, and show
  the result as a mapped route with an ordered stop list.

  Android is the first field-client target. Preserve a path to Linux and iOS instead
  of welding business logic to Android-only APIs. Pick a stack that's simple to
  self-host. Do NOT wire real payment, mapping credentials, or customer data without
  flagging me (needs-human). Build with seed/dummy data only until I say otherwise.

  Route optimization should be deterministic where practical; an LLM is not a routing
  engine. If AI is useful for an internal planning helper, this is a single tool for me
  and my team and may use our Silas-owned tokens, with all provider credentials kept
  server-side and usage visible.

