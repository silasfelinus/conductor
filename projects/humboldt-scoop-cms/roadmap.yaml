    note: 'Implemented and merged silasfelinus/humboldtscoopsolutions#75 (squash 94259a2) via an isolated background worker agent. Evolves the Flutter field client from worker-only into a role-aware app shell: Worker (unchanged, t-024 offline queue untouched) + Admin (new, read-only over existing admin-gated endpoints: today routes, customer list/detail) + Customer (new) toolsets in one app/one login -- a dual-capability staff member gets both toolsets from one /me resolution, no second login. New customer-facing auth surface on the CMS (none existed before): wp_hss_customer_tokens table (schema 2.14.0), customerAuth.ts/customerScope.ts mirroring the staff bearer-token contract via a structurally separate table/resolve path (a customer token can never satisfy a staff capability check or vice versa), GET /customer/me, GET /customer/visits(+/:id) (404 not 403 for another customers visit; customer-safe field shape), POST /customer/requests (writes to the pre-existing wp_hss_change_requests table -- zero new admin surface needed), admin-gated POST /customers/:id/app-token for issuance. Tests include the required cross-customer-isolation cases (customer A vs B visit, both list and by-id, both directions) -- 111/111 CMS tests pass, tsc clean. No Flutter toolchain in sandbox (standing limitation, t-021/t-023/t-024 precedent) -- hand-reviewed carefully, new Flutter unit tests written but unrun; merged on hand-verification alone matching prior precedent. Verified merge myself via GitHub MCP before closing: PR #75 state=closed/merged=true, 26 files +2315/-76, matches PR description, no unexpected reverted lines. Filed 4 follow-up tasks (t-036..t-039) for explicitly deferred scope: admin write actions on phone, token list/revoke UI, WP admin-side issuance UI, and customer self-registration.'
