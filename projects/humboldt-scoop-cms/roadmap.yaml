  - id: t-022
    milestone: m9
    title: "Finish advertised commerce promises: referrals, free first visit, deodorization"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: 'Implemented and merged in silasfelinus/humboldtscoopsolutions#56 (squash 03f4787). Deodorizing: checkbox on the plan-confirm screen (skipped for Yard Restoration) -> portal.js payload -> HSS_Rest::checkout() adds it as a second recurring Stripe line item (per-visit price x visits/month, since billing is flat monthly regardless of visit count) -> subscription metadata -> webhook persists it to the deodorizing column and now sums every line item into amount_cents, not just the first. Free first visit: HSS_Config::FREE_FIRST_VISIT was a boolean nothing read; now checkout() applies a subscription_data[trial_period_days] (new FREE_FIRST_VISIT_TRIAL_DAYS constant) deferring the first invoice ~one billing cycle -- Yard Restoration uses mode=payment with no subscription_data at all, so it never consumes the free visit by construction, not extra bookkeeping. Referral: registration form gained a Referred by field, HSS_Customers::register() stores it, and on the referred customers first paid-invoice webhook, HSS_Rest::maybe_credit_referral() resolves it to an existing linked customer by exact email match and credits their Stripe balance via a new HSS_Stripe::create_customer_balance_credit(); a new referral_credited_at column (additive migration, schema 2.8.0) guards against double-crediting. Anything automation cannot resolve stays visible via a new Referred by column on the admin Customers page instead of the previous "not yet automated" dead end. Found and fixed a real pre-existing bug along the way: register()s customer insert referenced a city column that does not exist on wp_hss_customers (city belongs to a property, not a customer) -- $wpdb->insert() does not validate column names, so MySQL rejected the whole statement and every self-registration was silently failing to create its customer row (phone, and now referred_by, would have been lost the same way), invisible because get_or_create() papered over it with a bare fallback row on first dashboard visit. No .github/workflows exist in this repo; verified locally -- php -l clean on all 7 touched files, full existing test suite green, new site/tests/commerce-promises-test.php (26 checks) added. No live Stripe testing was possible (no test-mode secret key in this sandbox); flagged for a real test-mode smoke test before the production rollout gate (humboldt-scoop-cms/t-028).'
    claimed_by: 20260817T184300Z-hss-t022
    claimed_at: '2026-08-17T18:43:10Z'
    updated: '2026-08-17T18:51:48Z'
    implementation_pr: 'silasfelinus/humboldtscoopsolutions#56'

