# Cthulhuquarium full asset queue — cthulhuquarium/t-005 + t-015.
# engine: krea2 explicitly on every entry. krea2 came back online 2026-08-24 once
# Silas remounted the model share on the LAN IP (t-033), and a side-by-side against
# flux/schnell on the same prompt was decisively better for this project's look --
# flux rendered a near-black frame, krea2 a readable creature. Explicit anyway, so a
# future default change cannot silently swap the house style.
# Fish prompts are the CARD register straight from the bible; in-tank sprites need a
# second pass with different lighting (cthulhuquarium docs/asset-pipeline.md).
batch:
  entries:
