# Tzaddikim blacklist — people who must never be nominated, suggested, or imported.
#
# Silas, 2026-09-30: "we should also have a blacklist section, so we don't get
# problematics like ghandi, mother teresa, thomas jefferson, etc."
#
# These are figures commonly held up as moral exemplars whose documented record
# includes serious harm (enslavement, abuse, atrocity, bigotry, fraud) that the
# gallery's "controversy / objections" panel cannot honestly contain. Being
# listed here is an editorial call for this playful gallery, not a verdict on
# anyone's whole life.
#
# Enforced by scripts/build_tzaddik_discovery.py (docket validation + dedup) and,
# in kind_robots, by utils/tzaddikBlacklist.ts (submission, import, and model
# discovery routes). Keep the two lists in sync; tests/test_tzaddik_blacklist.py
# checks parity against a kind_robots checkout when one is present.
#
# Matching is on the normalized name and every alias (case-, accent-, and
# punctuation-insensitive). Add aliases for common spellings.
