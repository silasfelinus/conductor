# Tzaddik Gallery — playful pop-culture gallery of "just people"
# Created from Silas's 2026-09-26 direction.

project: tzaddik-gallery
kind: software
goal: "Ship an entertaining, sourced Kind Robots gallery of 36 living 'just people' plus a historical archive, community submissions/reactions, Wikipedia-backed provenance, transparent objections, international coverage, and a daily human-vetted discovery roster of 10 living + 10 deceased candidates."

notes_from_silas: |
  This is a silly pop-culture database and entertainment feature, not a Jewish
  religious project. The name borrows the folklore/concept of 36 righteous or
  just people sustaining the world, but being Jewish or Hasidic is NOT a
  requirement, expectation, ranking factor, or implication.

  Present the current gallery as a playful list of 36 living "just people"
  keeping the world running. Include a separate explanation tab, a historical
  gallery for past/deceased tzaddik, and the current living gallery.

  Kind Robots users should be able to submit new candidates and react to
  submissions with upvotes/downvotes using the site's normal identity/auth
  patterns.

  Wikipedia is the default source for biographical facts and images. Store the
  source URL and source/image provenance. Admin/editor overrides are allowed,
  but overrides must be explicit rather than silently replacing provenance.

  Every person detail view should include a "controversy / objections" section
  so the gallery does not turn admiration into hagiography. Summaries should be
  factual, sourced, and proportionate: document meaningful objections or
  contested facts without manufacturing false balance.

  Historical examples from Silas: Dolly Parton, Steve Irwin, Fred Rogers,
  Martin Luther King Jr., and Stanislav Petrov, the Soviet officer who judged a
  1983 missile-warning alert to be false rather than escalating it.

  Initial living suggestions attributed to Silasfelinus / userId=1:
  - Cassandra Peterson / Elvira
  - Greta Thunberg

  One explicit editorial goal is to escape an American-centric candidate pool.
  Research should deliberately seek people from multiple regions, languages,
  disciplines, and kinds of public service. This is an educational opportunity
  as much as a joke.

  Add a Daily Tzaddik discovery lane, analogous to Daily Dream: each Pacific
  day, prepare a filled docket of 10 living and 10 deceased suggestions with a
  concise sourced bio, inclusion pitch, Wikipedia/Wikimedia provenance, and
  meaningful objections/controversies. These are suggestions for Silas to vet,
  never automatic additions. Prefer fresh international discovery over repeating
  familiar US/UK names. Once the finite gallery build is accepted, this daily
  discovery lane is the project's ongoing/continuous reason to stay alive.

