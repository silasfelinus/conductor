    note: >-
      Kaizen from t-005 (silasfelinus/kind_robots#3060): server/api/reactions/index.post.ts's
      getContentOwnerId declares `const modelMap: Record<string, {findUnique: (args: any) =>
      ...}>` across three lines, with an `eslint-disable-next-line @typescript-eslint/no-explicit-any`
      comment directly above it. Because the type is wrapped across multiple lines, the actual
      `any` usage lands two lines below the comment it was meant to cover, so ESLint reports
      both "Unexpected any" AND "Unused eslint-disable directive" on the same block. Confirmed
      pre-existing on main (not introduced by t-005) via `npx eslint` against the committed
      file before t-005's own changes landed. Fix: either reformat the disable comment onto the
      line that actually has the `any` (e.g. `eslint-disable-line` on the closing brace line, or
      restructure the type to fit one line) or give the map a real (non-`any`) callable type.
      Small, mechanical, one file.
    claimed_by: claude-2026-09-27T00-00-00-tzaddik-t022
