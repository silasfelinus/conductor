# Kind Pinball -- Williams-quality pinball in the Kind Robots Arcade (Silas, 2026-10-07).
# Split out of kr-arcade (games.yaml `kind-pinball`, shipped there 2026-10-06 in four factory slices).
# Brief: DESIGN-BRIEF.md. Code: kind_robots utils/arcade/games/kindPinball.ts (and the shared pinball
# engine t-003 splits out of it). Riff rule: mechanics and polish from the reference machines only.
project: kind-pinball
kind: software
goal: >-
  ONE pinball table in the Kind Robots Arcade -- AMI Village Rescue -- that is as good as any Pinball FX3
  table: truly fun, complex and high quality. A real 3D table (perspective camera, physical ball, PBR
  chrome, plastics, ramps and lit inserts) with weighty FX3-class ball feel, a deep shot map, an animated
  dot-matrix display, signature toys, a mode ladder, multiball and a wizard mode, sound and music, and a
  hidden sub-table the player discovers through play that leads back to the main table. One leaderboard.
  Done only when Silas plays it on desktop and touch and judges it as good as any FX3 table.

notes_from_silas: |
  2026-10-07, verbatim: "Make kind pinball in arcade its own project. I want it, zuzu-lair, arcade, and the
  zuzu fighting game to be our high priority projects.

  Pinball needs a signifant style and quality improvement. As good as a rom for a Williams machine. Lots of
  improvements, but a few style passes would do w9nders. Different levels, multiple ramps, a REAL quality
  game. Addams family, terminator, Godzilla, and anything from pinball fx3 should be the models"

  2026-10-07, answering t-002, verbatim: "one leaderboard, a sub-table to be discovered, leading back to
  the original. the fx3 quality reset is important and should be followed, it was a new agent with a
  better eye on quality. we want quality. this project finishes when it's a truly fun, complex, and
  quality table . if there are adjustments to that roadmap, aim for that. it should be as good as any
  pinball fx3 table, that's our standard."

  What that means for agents: ONE table (no Tables 2/3, no table select). "Levels" = a hidden sub-table
  discovered through play that returns the ball to the main table. One leaderboard (the existing
  kind-pinball board). FX3-QUALITY-BLUEPRINT.md is the governing plan. The bar is "as good as any Pinball
  FX3 table": fun, complex, quality -- never "it has 3D meshes" or "the tasks are done".

  2026-10-09, after playing, with a screenshot of the hall's Kind Pinball beside a Pinball FX3 table,
  verbatim: "play is fine so far, table physics feel good, but I definitely expect a more elaborate
  visual design. pinball fx3 was listed as our gold standard, including shots from the current build and
  from a randomly selected pinballfx3 table to highlight discrepancies. To start, we should have splash
  background filler instead of blank screen. we should have different views to follow the ball or
  flipper. multiple flippers. a table that isn't just 1 screen length."

  What that means for agents: the screenshot was the hall's 2D cabinet; the 3D table (t-004 onward) was
  still an unlisted preview (?game=kind-pinball-3d), so it must reach the hall (t-024). Milestone m5 is
  his four asks on the 3D table: fill the screen (t-020), camera views that follow the ball (t-021), a
  table longer than one screen (t-022) and more flippers (t-023). The FX3 reference he chose (a Marvel
  table) has a lit room around the machine, sculpted toys, wire ramps everywhere and a dynamic camera.

  2026-10-10, after playing the 3D table in the hall, verbatim: "the game "works" but the ball following
  animation is awkward and bad, let's stick to a singular from the flippers perspective, unless the user
  hits a bonus area, and then it's a single pan to or from the location. following the ball all the time
  is nauseating. i appreciate the improvements to design, and the table is much more complex, great, but
  we can still move beyond the windows 3.1 graphic quality. I'm including mockups for our other planned
  pinball game, so you can see where we are aiming for quality."

  What that means for agents: the camera is one fixed view from the flippers, never following the ball;
  the only moves are one eased pan to a bonus area (the Ridge, the hidden room) when the ball gets there
  and one pan back. t-021's view modes go. The quality bar is his mockups for the next table
  (mockups/quality-bar-2026-10-10-*.webp): a densely painted, illustrated playfield; sculpted, lit
  toys and scenery everywhere; chrome wireform ramps; warm practical lighting (lanterns, candles, GI);
  a carved, painted cabinet. Milestone m6 is that look. Judge every screenshot against those images,
  not against the previous build.

  2026-10-10, later, with the "Kind Pinball Visual Studies" zip and two ornate full-table mockups, verbatim:
  "here's the new mockup and info for kind robots pinball, with one caveat. we don't want the croc, that's
  obviously a bleed from the zuzu pinball game, it should be replaced with some sort of multiball collector
  that sends packages to needy families"

  What that means for agents: the studies are saved as mockups/visual-study-2026-10-10-0*.png (the two
  ornate mockups came inline only). They set the direction for m6: "a miniature living world, not a
  diagram of pinball"; a sculpted AMI toy with butterfly wings; two elevated ramp systems in clear
  plastic on curved chrome rails, with posts, shadows and visible returns; the Ridge as a real upper
  flipper platform; tiny lit houses, the delivery drone and lantern bumpers (HOPE, CARE, AMI); bright
  inserts and distinct shot mouths that stay legible over rich art ("spectacle must never hide the ball
  or the shot mouths"); one flipper-facing camera that moves only at a secured ball transfer. The
  ornate mockups' palette: a night village in warm amber and violet, wooden boardwalks and bridges,
  waterfalls and a river, blossom trees, a central butterfly medallion ringed by inserts. NEVER a
  crocodile or any other Zuzu-table creature: in its place is a multiball collector that ships care
  packages to families in need (t-031). Per-task acceptance detail and the review matrix are in
  AMI-VISUAL-DIRECTION-2026-10-10.md (conductor#5887); Silas sending the studies, with only the
  crocodile caveat, settles that they are the direction.

