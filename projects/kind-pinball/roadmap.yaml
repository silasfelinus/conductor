      The first big visible jump, done on the existing file so it ships fast. Add an amber dot-matrix
      display band (score, ball, mode, banners), a lit, art-directed playfield (wood/dark base, lane guides,
      GI lamps along the rails, blinking arrow inserts for each shot), chrome rails and wireform ramps with
