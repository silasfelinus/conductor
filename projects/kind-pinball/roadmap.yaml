# Kind Pinball -- Williams-quality pinball in the Kind Robots Arcade (Silas, 2026-10-07).
# Split out of kr-arcade (games.yaml `kind-pinball`, shipped there 2026-10-06 in four factory slices).
# Brief: DESIGN-BRIEF.md. Code: kind_robots utils/arcade/games/kindPinball.ts (and the shared pinball
# engine t-003 splits out of it). Riff rule: mechanics and polish from the reference machines only.
project: kind-pinball
kind: software
goal: >-
  ONE pinball table in the Kind Robots Arcade -- AMI Village Rescue -- that is as good as any Pinball FX3
  table: truly fun, complex and high quality. A real 3D table (perspective camera, physical ball, PBR
  chrome, plastics, ramps and lit inserts) with weighty FX3-class ball feel, a deep shot map, an animated
  dot-matrix display, signature toys, a mode ladder, multiball and a wizard mode, sound and music, and a
  hidden sub-table the player discovers through play that leads back to the main table. One leaderboard.
  Done only when Silas plays it on desktop and touch and judges it as good as any FX3 table.

notes_from_silas: |
  2026-10-07, verbatim: "Make kind pinball in arcade its own project. I want it, zuzu-lair, arcade, and the
  zuzu fighting game to be our high priority projects.

  Pinball needs a signifant style and quality improvement. As good as a rom for a Williams machine. Lots of
  improvements, but a few style passes would do w9nders. Different levels, multiple ramps, a REAL quality
  game. Addams family, terminator, Godzilla, and anything from pinball fx3 should be the models"

  2026-10-07, answering t-002, verbatim: "one leaderboard, a sub-table to be discovered, leading back to
  the original. the fx3 quality reset is important and should be followed, it was a new agent with a
  better eye on quality. we want quality. this project finishes when it's a truly fun, complex, and
  quality table . if there are adjustments to that roadmap, aim for that. it should be as good as any
  pinball fx3 table, that's our standard."

  What that means for agents: ONE table (no Tables 2/3, no table select). "Levels" = a hidden sub-table
  discovered through play that returns the ball to the main table. One leaderboard (the existing
  kind-pinball board). FX3-QUALITY-BLUEPRINT.md is the governing plan. The bar is "as good as any Pinball
  FX3 table": fun, complex, quality -- never "it has 3D meshes" or "the tasks are done".

