    claimed_by: 2026-10-07T04:45:00Z-kp-t003
    claimed_at: '2026-10-07T04:39:47Z'
    updated: '2026-10-07T05:08:43Z'
    implementation_pr: 'silasfelinus/kind_robots#3311'

  - id: t-004
    milestone: m2
    title: "Engine split: shared pinball engine + table definitions"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      Move kindPinball.ts into utils/arcade/pinball/: physics.ts (ball, segments, circles, flippers,
      substeps), table.ts (a TableDef: walls, ramps as paths, orbits, bumpers, targets, scoops, inserts,
      lamps, theme colours), rules.ts (a per-table rules object driven by shot events), dmd.ts and
      render.ts. kindPinball.ts becomes Table 1's definition plus its rules. Contract-test the physics
      (no tunnelling at MAX_SPEED, a flipper cradle holds, a post pass works) and every shot's entry
      condition. Do this before the second table, not before t-003.

  - id: t-005
    milestone: m2
    title: "Physics feel: cradle, post pass, flipper power curve, tilt bob, kickback, spinner, drops"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      Make the ball feel heavy and true. Use a flipper strength curve: a full-power stroke vs a tap, more
      power near the base. Allow a live catch and a cradle (holding a flipper up stops the ball), and a post
      pass. Rolling friction and spin approximation. A tilt bob: the nudge adds sway, two warnings, then
      TILT (flippers die, no bonus). Add a left outlane kickback lit by a target bank, a 3-bank of drop
      targets, and a spinner on an orbit. Check: tests for cradle/post-pass/tilt, plus a 10-minute
      demo-pilot soak with no stuck balls.

  - id: t-006
    milestone: m2
    title: "DMD animation system + score display"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      A real DMD layer: a 128x32-style dot grid drawn in amber with dot bloom. A big score font, and a
      scene queue that plays short frame animations: skill shot, lock, multiball, jackpot, super jackpot,
      mode intro and total, wizard mode, extra ball, tilt, bonus count, and a match animation at game end.
      The animations are drawn procedurally from shapes and pixel text, not bitmaps.

  - id: t-007
    milestone: m2
    title: "Table 1 rules depth: skill shot, combos, lock + multiball jackpots, village map, wizard mode, match"
    status: waiting
    depends_on: [t-003]
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      Rebuild AMI Village Rescue's rules to reference depth. Skill shot: the plunger lets you hit a lit top
      lane. Combos: ramp to orbit to ramp, with a growing value. Ball lock: three locks start AMI multiball;
      the ramps light JACKPOT and a super jackpot follows. Village map (the mansion-grid idea): the scoop
      awards one of 12 lit villages, and modes light different shot arrows, Godzilla-style. Lighting all 12
      starts the "Malaria-Free" wizard mode (all shots lit, a big total). Also an extra ball, a bonus count
      with a multiplier, and a match at game end. Every rule gets a DMD scene (t-006) and arrow inserts
      (t-003). Contract-test the rules as a pure state machine driven by shot events.

