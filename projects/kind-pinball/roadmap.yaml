      the right ramp, add a LEFT ramp and LEFT/RIGHT orbits (loops) whose arrows light when they pay.
      Verify: npm run test:arcade-engine, typecheck, Playwright screenshots at phone/tablet/desktop.

      Shipped 2026-10-07 in silasfelinus/kind_robots#3311: 128x32 DMD
