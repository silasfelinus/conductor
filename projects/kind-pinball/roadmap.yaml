    passes: 0
    stakes: reversible
    note: >-
      Tune the Rapier table until the ball feels heavy and controllable rather than arcade-floaty.
      Servo/motor flippers must support a full-power stroke, tap, live catch, cradle and post pass without
      coordinate-triggered velocity cheats. Add sling/pop impulses, rolling/spin tuning, left outlane
      kickback, spinner, three drop targets and a tilt bob with two warnings then TILT. Acceptance:
      500 max-speed post impacts with zero tunnelling; reproducible cradle and post-pass tests; ramp
      threshold tests; and a ten-minute three-ball demo-pilot soak with no permanent stuck ball.

      Merged as kind_robots#3353: motor flippers (20 ms coil stroke, partial taps) with
      vertical-faced convex-hull bats; physics at 240 Hz on a shared clock; sling kicks on
      real hits; left outlane kickback (lit each ball, relit by the A-M-I bank) firing through
      one-way orbit deflectors; tilt bob with two warnings then TILT; animated drop targets;
      per-ball ball search; ramp covers and straight inlane returns. Acceptance tests pass:
      tap vs stroke, 5 s cradle, live catch, full flips 3.5-7 m/s on the playfield, post pass
      across a timing window, 500 max-speed post shots with no tunnelling, ramp thresholds,
      and a 10-minute three-ball soak with no stuck ball.
