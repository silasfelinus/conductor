# New original digital strategy CCG. Display title intentionally provisional.
project: slime-city
kind: software
autonomous: true
goal: >-
  Develop an image-first Slime City digital collectible-card battle game
  using a rectangular grid of square cells and orthogonal movement.
  CLASH is the canonical/default format (Silas, 2026-11-06 PT; see
  notes_from_silas); the earlier three-format comparison (8x8 Stratego-style
  concealed armies, 12x6 turn-based football-lane deployments, 14x6 timed
  real-time waves) is complete and those modes are legacy. Build six distinct
  crew identities including genetically engineered catgirls, punk
  bloodfairies and cybernetic ogres, sharing five school colors and
  four card types. Anchor experimentation in a vivid seven-district
  city map. Later expand faction campaigns, earned Meat/card economy,
  deck building, persistent challenges, multiplayer, artwork and
  replay-verified combat, retaining separate human creative and release gates.
notes_from_silas: |
  2026-11-06 PT (latest direction; overrides the initial three-format competition):
  CLASH is the canonical/default Slime City format. BLACKOUT, BLOODRUSH,
  MEATBALL and other modes are legacy and must be presented only in a
  deliberately secondary legacy selector, not as equal headline modes.
  Gameplay playtests, card/board art priority, menus, and rewards must
  treat Clash as the main product. Keep the six crew identities and the
  shared mercenary pool; preserve legacy modes without letting their UI
  dominate the Clash battlefield. The human review gate is not reached:
  faction differentiation, encounter art, campaign writing and adversarial
  Clash QA remain open. Master issue: kind_robots#4535.

  2026-10-29 PT: New Conductor project, working name Slime City.
  Collectible digital card battles inspired by chess, strategy,
  Warmachine, Hearthstone, Magic: The Gathering, Cards and Tankards
  and SolForge. Color factions: RED random chaos, BLUE traps,
  PURPLE fast horde, two additional colors, and a dedicated cybernetic
  ogre faction. Pentagonal coliseum; hidden placement now, later reveal
  and movement; each move or 72-degree turn costs an action point.
  At the end of a full round all revealed creatures attack in all
  five printed directions, with directional block. Example rat attacks
  1 in all five directions with zero block; centurion deals 2 in front
  and blocks the first point of incoming damage on all sides.
  Win by returning the flag to base, defeating the neutral giant
  monster, or eliminating the enemy force. Highly colorful, grungy,
  post-apocalyptic fantasy megacity with goblins, ogres, vampires,
  cybernetics and absurdly over-the-top comic violence. AAA single-screen
  interface with illustrated city overworld: CPU fights, Meat currency,
  Meat card shop, campaign with a unique faction story, card collection,
  user challenges, Meat-bought random encounters, daily/weekly/permanent
  challenges, rewards and cards of CREATURE/SPELL/TRAP/EQUIPMENT types.
  Final name is not yet chosen. Do not confuse a design brief or image
  prompts with working mechanics, submitted jobs or finished illustrations.
  Assumptions and test rules live in DESIGN-BRIEF.md and may be revised.
  2026-10-30 PT OVERRIDES THE PENTAGON DESIGN ABOVE: Simplify combat to
  a rectangular board of square cells with orthogonal moves; no
  cumbersome facing/directional block. Genetically engineered
  catgirls and punk bloodfairies each get a real unique team, alongside
  the cybernetic ogres. Do NOT choose Stratego versus a football-like
  lane battlefield or real time versus turns yet. Develop teams,
  an explorable city overworld and distinctive special cards, and
  give Silas several playable, comparable proof-of-concept modes
  at varying field sizes and tempos. Keep prototypes for hands-on
  evaluation before final combat rules are locked.
