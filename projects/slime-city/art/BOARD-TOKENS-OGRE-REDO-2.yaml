# Board tokens ogre redo 2 (2026-11-08 PT). Silas, 2026-11-08 PT: "we've still got a lot of orcs
# that look like shrek in their character token in game." The Ironjaw Chrome Ogre and Picket Line Troll
# tokens were prompted as green, round-faced ogres, which Krea paints as a familiar movie ogre. These 45
# re-render every Ironjaw ogre creature (14; Foundry Lion is a crane-built lion and keeps its token)
# and the troll mercenary in all three moods. Each keeps the card's props and mood text, drops "green"
# and "mossy", and names a distinct non-green skin, an angular heavy-browed industrial face, a riveted
# chrome lower jaw and small bolted ears close to the skull, in positive terms only (Krea paints what
# a negation names). Same runtime assets as rounds 6/8/redo 1, so each keeper replaces its token key in
# kind_robots utils/slimeCity/artManifest.ts SLIME_CITY_ART.tokens when wired. auto_submit.
