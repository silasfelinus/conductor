# Slime City ANARKISS, round 2: card and evolution art (2026-11-11 PT; slime-city/t-052). Silas, 2026-11-10 PT:
# "Rebrand for riot squad, become Anarkiss: anarchy circus performing rocky horror crew. Anarkissed." The crew
# poster and Saint Kaboom boss portraits shipped in ANARKISS-ROUND-1.yaml; this round repaints the 40 Riot cards
# under their Anarkiss names (kind_robots "Slime City: Anarkiss card names and flavor (t-052)") and the 62 crafted
# L2/L3 evolution stages from EVOLUTIONS-RIOT-KREA.yaml as Anarkiss performers. Silas, 2026-11-11 PT: "All art can
# be generated at high priority." An original glam midnight-musical anarchy circus: no borrowed characters, songs,
# names or catchphrases. One crew palette (hot magenta, gold sequin, black lace, stage-light teal); a real visual
# scene per card, positive terms only, and nothing written in the image. Same runtime assets
# ('slime-city/cards/<cardId>' and 'slime-city/evolutions/<cardId>@2|@3|@3b'), so each keeper replaces the
# pre-Anarkiss id in kind_robots utils/slimeCity/artManifest.ts. Adults only. auto_submit.
round: slime-city-anarkiss-cards-2
project_slug: slime-city
designer: Slime City ANARKISS cards and evolutions, round 2
is_public: true
is_mature: false
cast_loras: false
priority: 1000
auto_submit: true
lanes:
- key: krea2-card
  label: Krea 2 Slime City Anarkiss card paintings
  engine: krea2
  prompt: prose
  suffix: Grown-up glam anarchy circus performers in black lace, fishnets, hot magenta and gold sequins under stage-light
    teal beams, in a junkyard big top among the ruins of a megacity. Western adult-animation gouache painting, mature
    playful postapocalyptic fantasy, crisp thick black ink contours, vibrant high-contrast gouache shading, expressive
    acting and distinctive costumes, saturated colored rim-lighting, tall portrait framing with one continuous full-bleed
    vertical scene. Every character is a clearly adult grown-up. Every surface is bare and unmarked.
