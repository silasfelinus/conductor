# Board tokens round 8 (2026-11-04 PT, slime-city/t-022): the 86 creatures round 6 did not cover,
# each x 3 moods (fierce, guard, hurt) = 258 portraits. Batches: Gene Riot Catgirls and Punk
# Bloodfairies (22), Ironjaw Chrome Ogres and Riot Saints (22), Undertow Intelligence and Meat
# Exchange (22), the 20 neutral mercenaries. With round 6's 24 starters, every one of the 110
# creature cards has a token. Looks are hand-written from each card's art prompt; every mood names
# visible props, because round 6 showed Krea ignores "a pained wince" without them. Fairies are
# described with grown-woman faces (round 6's "tiny adult" Bloodsprite read as a child), ogres lead
# with chrome and furnace features, swarms and vehicles get one readable face, and the suffix paints
# edge to edge (round 6's "square frame" came back as a white mat). Kind Robots reads the renders
# from utils/slimeCity/artManifest.ts SLIME_CITY_ART.tokens['<cardId>/<mood>']. Private, auto_submit.
