# Slime City evolution art, Catgirls (wave 2), Krea 2 escalation redo (2026-11-08 PT).
# Replaces the Flux Kontext dev round EVOLUTIONS-CATGIRLS-2.yaml. Silas, 2026-11-08: "Flux dev is a slow generator,
# and we're getting a lot of the same looking images three times over. We shouldn't use it for the main gen,
# but we also need a much larger and fun escalation between evolution 1 and evolution 3."
# Kontext edited each card's level-1 painting and kept its composition, so L1/L2/L3 read as one picture.
# This round is Krea 2 text-to-image (the house Slime City engine, 8 steps), one render per stage instead of
# two seeds, and each prompt is written per card on the ladder in CLASH-EVOLUTION-PLAN.md section 4:
# Silas, 2026-11-08: "these gens evolutions are supposed to look bigger and more impressive. They might tell
# a story." So the hero grows in the frame at every step (L2 a low-angle hero shot filling the frame; L3 the
# biggest thing in the scene), and one story thread from the L1 painting grows at L2 and pays off at L3.
# L2 = powered up (new signature gear, bigger venue); L3/L3b = legendary, over the top (scale, swarms,
# material change, mythic form, a city-sized signature, the district reacting, a finale palette).
# Identity carries over through a per-card look anchor that opens both prompts. Same runtime assets
# ('<cardId>@2' | '@3' | '@3b'), so a keeper is wired as SLIME_CITY_ART.evolutions[...]. auto_submit: true.
