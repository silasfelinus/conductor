  prompt_prose: 'A sweeping dusk panorama of Slime City, a ridiculous post-apocalyptic megacity of leaning towers,
    rusted water tanks and tangled neon signs, all built around a vast glowing lake of radioactive green slime.
    Six rival crews eye each other from rooftops across the skyline: a catgirl gang on a cracked laboratory, a tiny
    punk fairy band on a stack of speakers, chrome-jawed lizard workers on a smoking foundry, demolition saints
    lighting fireworks, frog-skinned spies rising from a storm drain and gold-toothed butchers counting coins on
