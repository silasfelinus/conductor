# Ironjaw lizard people, round 2 (2026-11-11 PT, slime-city/t-044 + the remaining art of t-054). Silas, 2026-11-10 PT:
# Ironjaw "is supposed to be the overall bioexperiment lab rat tmntrpg feel" -- mutant lizards who broke out of a
# sealed bio-lab's reptile wing, grew up in the sewers and took over the foundry (kind_robots#4949). Silas, 2026-11-11
# PT: "All art can be generated at high priority." Round 1 repainted the crew poster, the 15 creature cards and their
# tokens. This round queues what still shows ogres or has no art:
#  * every Ironjaw L2/L3/L3b evolution stage. EVOLUTIONS-IRONJAW-KREA.yaml painted them as ogres (curation held them
#    back, kind_robots#4986); each stage keeps that file's story ladder and swaps in the card's species and scale
#    colour from IRONJAW-LIZARDS-ROUND-1.yaml. Picket Line Komodo (Picket Line Troll L2/L3 were rejected as a green
#    troll) is here too. Union Lunch Lady, Spare Rivet Shower, Shift Bonus Plates and Cold-Weld Patch have evolution
#    stages in kind_robots utils/slimeCity/evolutions/ironjaw.ts but no ledger row anywhere; their ladders follow the
#    arc comments in that file. Foundry Lion stays a crane-built lion with a gecko rider.
#  * the Ironjaw spells, traps and equipment whose wired card art shows ogres (their prompts in
#    CREWS-DISTRICTS-CARDS-ROUND-1, BLACKOUT-STORY-ROUND-2, GUTTER-CROWN-*, ROUND-5-REDO-1 and SLIME-CITY-CURATION-REDO-1
#    name ogres; the four Comfy clash renders 264927/264942/264943/264947 were prompted for the ogre-era foundry crew
#    and are repainted too, so curation can compare). Shock Plate, Hydraulic Lockjaw, Forklift Chock and Slag Spill
#    show only a trap and its victim, so they keep their art; Spare Rivet Shower, Shift Bonus Plates and Cold-Weld
#    Patch are already re-queued as lizards in SLIME-CITY-CURATION-REDO-3.yaml.
#  * Forewoman Rivet 'ready': FACTION-IDENTITY-ROUND-1 rendered it, but it was rejected for a misspelled painted sign
#    (kind_robots#5017) and falls back to the crew poster. Same lizard, a scene with nothing written in it. Her
#    hit/gloat/beaten portraits are wired and stay.
# Every Ironjaw figure is a named lizard species and scale colour (positive terms only), a lab-mutant scene, and
# nothing in the scene carries writing. Same runtime assets, so a keeper replaces the ogre id or fallback in
# kind_robots utils/slimeCity/artManifest.ts (SLIME_CITY_ART.cards[...], .evolutions['<cardId>@2|@3|@3b'],
# .bosses['ironjaw/ready']). auto_submit.
