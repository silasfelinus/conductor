# Slime City art round 4: a board per district per mode, plus the card back.
# Silas, 2026-11-01: "those game boards definitely need art" / "Yes for all boards. Each team game has a different board, yes?"
# Until now there were 3 boards (one per mode, round 1) shared by every district, and their prompts came back as
# perspective street scenes. These are flat top-down floors sized to the grid: BLACKOUT 10x6 -> 1344x768,
# BLOODRUSH 14x6 -> 1536x640. No painted grid: kind_robots draws the grid over the art (sc-board-floor).
# MEATBALL is retired (Kind Robots #4607), so no gridiron floors. Card back feeds the deal flip in SlimeCityHand.
# Wiring: kind_robots utils/slimeCity/artManifest.ts boards['<district>-<mode>'] (falls back to boards[mode]).
# Queued != rendered != wired. Job ids and ArtImage ids are written back by the Auto Art Generate sweep.
