# Board tokens (Silas, 2026-11-02): "we need custom tokens for all cards on the board.
# Images with reaction faces would probably work." One square head-and-shoulders portrait
# per creature and mood, keyed slime-city/tokens/<cardId>/<mood>. First round: the 24
# starter-deck creatures x 3 moods, each look hand-written from that creature's card art so
# the token reads as the same character. Kind Robots reads them from
# utils/slimeCity/artManifest.ts SLIME_CITY_ART.tokens['<cardId>/<mood>'] and falls back
# to the card art with a reaction badge until they land. Remaining 86 creatures: t-022.
