# Slime City evolution art, Catgirls pilot (2026-11-08 PT; CLASH-EVOLUTION-PLAN.md sections 4 and 8).
# Silas: "We should have fresh art on the evolutions, not just frame effects" and "New art for both, high
# priority." The pilot is the full 20-card Catgirls Solo Clash deck plus the deck-builder Second Pounce Rig: the
# eleven crafted cards (utils/slimeCity/evolutions/catgirls.ts in kind_robots) and the ten hand-built twists
# (clashTwists.ts) each get a level-2 and a level-3 painting, the same character or scene transformed by its story
# arc. The three choose-one level threes also get a painting for their second option ('<cardId>@3b'). Flux Kontext edits the card's wired
# level-1 ArtImage (SLIME_CITY_ART.cards) so face, fur, outfit and style carry over; each prompt names only the
# story change, written by hand per card and level. Two seeds per stage for curation. Keepers are wired as
# SLIME_CITY_ART.evolutions['<cardId>@2' | '@3' | '@3b']; until then a level shows the card's own art.
# auto_submit: true.
