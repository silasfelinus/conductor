# Slime City occult Meat Exchange, round 1 (2026-11-11 PT, slime-city/t-053). Silas, 2026-11-10 PT: the Meat
# Exchange is "Lovecraftian, dark, occult and weird", not gangster bros; 2026-11-11: "All art can be generated at
# high priority." kind_robots#5000 recast the founders' flavor, #5015 retitled the 63 evolution stages as occult rites
# and the t-053 roster PR renamed 39 of the 40 cards (titles here are the final names). This round repaints
# all 40 Exchange cards and all 63 Exchange evolution stages in the drowned-chapel identity: butcher-priests,
# ossuaries, bells, tentacles and the Thing That Hungers beneath Crown Market, playful-weird rather than gory. One
# shared eldritch palette (drowned teal, bone ivory, raw-meat crimson, candle gold) rides in the lane suffixes; each
# prompt is a hand-written visible moment in positive terms only, with a per-card look anchor carried into its
# evolution stages. The crew poster and boss moods are already queued in FACTION-IDENTITY-ROUND-1.yaml and are not
# repeated. Same runtime
# assets (slime-city/cards/<id>, slime-city/evolutions/<id>@2|@3|@3b), so each keeper replaces the current id in
# kind_robots utils/slimeCity/artManifest.ts. auto_submit; jobs/art are left for the sweep.
