# Playbook Kit: the shared frame for every Kind Robots story game (Silas, 2026-10-26 PT).
# Code lives in kind_robots (utils/playbookKit, components/playbook-kit, /admin/playbook-kit);
# recipe in kind_robots docs/playbook-kit/README.md. New playbooks start with
# `python scripts/new_playbook.py` here and `npm run playbook:new` there.
project: playbook-kit
kind: software
autonomous: true
goal: >-
  One shared frame and complexity budget for every Kind Robots story game
  (playbook). New playbooks start consistent and small (Vignette tier) and grow
  only when earned; existing playbooks (Emperor of Dust, Zuzu: Shifting Lands,
  Shifting Desks, Prom of Doom, This Means Warp, Ecotone) converge on the same
  one-screen shell, settings, title trailer, scrapbook of cinematic moments,
  cast, factions, secrets and endings without losing their own engines.
notes_from_silas: |
  2026-10-26 PT, Silas: "Create a consistent framework so I can iterate
  development on new playbooks. In the manner of emperor of dust, shifting
  lands, shifting desks, prom of doom, this means warp, Ecotone, create a
  consistent framework, front end consistently single screen, settings,
  scrapbook of cinematic moments, followers, villains, endings, etc, trailer,
  factions, different revealed moments, romances, etc. needs to be smart
  about how many complexities to allow."
milestones:
  - id: m1
    title: "FRAMEWORK - spec, budget, shell, scaffold"
    weight: 15
    status: done
  - id: m2
    title: "ADOPTION - each existing playbook declares a spec and mounts the shell"
    weight: 35
    status: not-started
  - id: m3
    title: "STUDIO - kit playbooks in the Story Atlas, rendered reference art"
    weight: 15
    status: not-started
  - id: m4
    title: "FORGE - idea-to-project admin console with live gen-time forecasts"
    weight: 35
    status: in-progress
