schema_version: 1
mode: ready
variant: color
description: Canonical color-proposal ArtJob queue for the three 36-image coloring books. Black-and-white conversion
  begins only after a color composition is accepted.
batch_policy:
  worker_pass_size: 18
  submission_order: book-order-then-slot
  meaning: One pass may prepare, submit, retrieve, or review up to 18 color proposals. Do not spend a pass writing
    one to six isolated prompts when a full half-book batch is available.
defaults:
  target_repo: silasfelinus/conductor
  size: 1024x1536
  engine: krea2
  output_version: color-proposals-v1
status_meanings:
  pending: ready to submit as a color ArtJob
  done: render landed and passed the structural gate; awaiting human review in the ArtJob trainer panel
  approved: a human accepted this color master; no new color ArtJob is required
