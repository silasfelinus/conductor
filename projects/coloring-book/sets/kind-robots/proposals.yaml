- slot: 1
  id: kr-001
  title: The Logo Workshop
  prompt:
    text: 'Full-page illustrated variation on the canonical Kind Robots logo supplied by Silas. Preserve the recognizable
      central mascot/emblem silhouette and joyful rainbow identity, but transform it into a lively workshop scene:
      the emblem becomes a friendly robot maker surrounded by tiny helper bots, gears, paintbrushes, stars, and
      rainbow butterflies. Clean bold contours, crisp bounded color, generous negative space, playful and iconic
      rather than a collage. No readable words; use the attached logo and kind_robots/public/images/kindtitle.webp
      as visual references.'
    ref: null
  inspirations:
  - path: kind_robots:public/images/kindtitle.webp
    kind: canonical-logo-reference
  - path: user-attachment:kind-robots-logo
    kind: human-provided-logo-reference
  accepted:
    color: null
    bw: null
  final:
    color: null
    bw: null
  notes:
  - Use a reference-capable refinement pass if the first text-only render does not preserve the canonical emblem
    strongly enough.
