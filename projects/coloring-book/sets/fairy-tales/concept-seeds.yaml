set: fairy-tales
title: Fractured Fairy Tales
status: independent
queue_state: do-not-schedule
updated: '2026-10-06'
notes: >
  Silas-driven set inside the paused coloring-book project. No roadmap task, art-job queue,
  modeler request, or publishing step; agents preserve this file and do not schedule from it.
  Not listed in ../catalog.yaml until Silas makes it a production book.

shared_direction:
  audience: teen-and-adult
  rating: approximately-PG-13 (provisional; Silas to confirm)
  tone: committed, sincere reversals of familiar tales; dark-whimsical, never mean-spirited
  production_pair:
    - colored graphic master
    - faithful black-and-white coloring-page conversion
  source_material: public-domain folk tales (Grimm, Perrault, Andersen, English folk tales)
  avoid:
    - any studio's character designs, costumes, color keys, or signature staging
    - studio logos or title lettering
    - generated text inside the image
    - gore or explicit content
    - collages, contact sheets, or multi-panel outputs

# status values: seed | exploring | accepted-color | accepted-bw | accepted-pair | final-pair | deferred
pages:
  - id: ft-001
    working_title: Bear Patrol
    source_tale: null  # Silas to name; the visual reads as a bears tale turned police procedural
    status: seed
    description: >
      A stitched teddy-bear police officer (peaked cap with a bow and a bear-head badge, star
      badge, paw-print shoulder patch, duty belt with pouches and handcuffs, a scowl of total
      authority) hauls a hulking, patched-up thug bear along by his spiked collar and chain. The
      thug has a torn ear with a ring, anchor and spiderweb tattoos, stuffing bursting from his
      seams, a skull-bear charm on a chain, and a sullen underbite. The setting is wet cobblestones
      in a gothic old town of spires and towers, with a wrought-iron gas lamp and a spiked iron fence.
      A lost button-eyed teddy head lies in the foreground corner as the case's evidence.
    files:
      color: null
      bw: null  # exists untracked on Ferngrotto; file as generated/bw/ft-001-bear-patrol.webp
    notes: []

  - id: ft-002
    working_title: The Candy Hostess
    source_tale: Hansel and Gretel
    status: seed
    description: >
      The witch is recast as the town's most adored showwoman. She stands on a gilded
      candy-cane balcony in a candy factory, with a towering pink beehive studded with sweets,
      candy-cane cat-eye glasses, a purple gown with pink ruffles, a ruffled apron with sticky pink
      stains and a gingerbread charm, and a striped candy-cane staff hung with a ring of keys. She
      offers a tray of cupcakes with one skull sweet on it. Below, cheering children in chef hats
      and caps reach up to her, alongside living gingerbread, lollipop, and ice-cream creatures.
      Furnace-like ovens glow behind riveted doors and candy jars line the shelves. On the wall, a
      gallery of gilt portraits of solemn children is the sly hint of what the tale is really about.
    files:
      color: null  # exists untracked on Ferngrotto; file as generated/color/ft-002-candy-hostess.webp
      bw: null
    notes: []
