set: monster-recast
version: 1
trim_size: 8.5x11
orientation: portrait
illustrated_interior_pages: 28
print_plan:
  one_sided: true
  illustration_side: right-hand
  backing_page: blank or character quote
  bleed: none for interiors
  safe_margin_inches: 0.375
  target_resolution: 2550x3300

concept_art_rules:
  - Generate full-color source art before line-art conversion.
  - Preserve the character's approved silhouette, wardrobe, motifs, and originality guardrails.
  - Use the style named in characters.yaml as a starting direction, not a rigid house style.
  - Generate at least three materially different candidates per character before selection.
  - No franchise names, studio logos, actor likenesses, signature props, or copied movie compositions.

coloring_conversion_prompt: >
  Convert the selected original character artwork into a premium adult-and-family coloring book page,
  portrait 8.5x11 composition, bold clean black contour lines on pure white, closed colorable regions,
  varied region sizes, expressive face preserved, costume details simplified but distinctive, background
  reduced to a few large decorative shapes, no gray, no shading, no halftone, no color, no text, no border,
  no solid black areas larger than a small accent, printable line weight, generous safe margins.

