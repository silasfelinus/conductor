stage_two_rules:
  - Everything physically present in approved/ is approved as a stage-two working base.
  - A working base may be color, black-and-white, or a complete pair; it is not automatically a final page.
  - Evolve the accepted composition instead of regenerating it from scratch.
  - Preserve pose, anatomy, body type, scars, age, creature structure, perspective, contact points, and the visual hook.
  - Use STYLE-GUIDE.md: serious theatrical camp, thick black contours, bounded color, organized high detail, no collage.
  - Record source asset, revision prompt, model or workflow, seed or job metadata, and output path.
  - Keep publishing, POD accounts or listings, spend, storefront release, and public Character release out of scope.

remaining_checklist:
  inventory_reconciliation:
    - Map every approved file to a canonical concept id and working title.
    - Record stage-two-working-base status and whether each concept has color, BW, or a pair.
    - Surface filename drift and duplicates without mutating binary assets.
    - Refresh README and preflight counts after the manifest agrees with the directory.
  counterpart_work:
    - Identify the eight BW-only concepts that need colored masters.
    - Identify the one color-only concept that needs faithful line-art conversion.
    - Audit the nine complete pairs for composition, anatomy, and identity divergence.
  exploration:
    - Keep the durable unapproved-art-jobs.yaml queue active for unrepresented concepts.
    - Route failed objective checks to rejected/ and leave their jobs pending.
    - Use vision curation against approved/ as the quality bar before promotion.

captain_hook_addition:
  canonical_candidate_id: mr-035
  working_title: The Ticking Captain
  source_lineage: Captain Hook and haunted pirate-villain folklore
  status: proposed-for-canonical-manifests
  recast: >
    A formidable older adult woman pirate captain with a weathered, broad,
    physically credible body and an original articulated prosthetic hook-hand.
    She is pursued across impossible seas by a vast clockwork marine predator
    whose brass gill plates tick like a ship chronometer.
  body_direction: >
    Mature, scarred, sea-hardened, powerful, and elegant without being slimmed
    into a pinup. The prosthesis is functional, intricate, and visibly used.
  framing: >
    Low storm-deck angle as the captain braces at the wheel, catches a snapping
    rigging line with the hook, and stares down the luminous outline of the
    ticking predator beneath the waves.
  horror_engine: >
    Inescapable ticking, a time curse tied to the sea, a predator visible below
    the hull, failing rigging, and the captain's certainty that it always finds her.
  camp_engine: >
    She remains impeccably theatrical and furious that destiny keeps arriving
    off schedule while the entire ship counts down around her.
  visual_hook: >
    The prosthetic opens into a nested compass-and-chronometer claw whose hands
    point directly toward the predator.
  originalization_hook: >
    Create a new captain identity, ship, costume system, prosthetic mechanism,
    time curse, and marine species. Do not use Disney-specific likeness,
    mustache, red-coat design, feathered hat, crocodile design, typography,
    supporting characters, or exact scene recreation.
  integration_needed:
    - Add the concept to homage-concepts.yaml and increment concept_count.
    - Add a canonical scene prompt to art-modeler-request.yaml.
    - Add paired pending color and BW jobs to unapproved-art-jobs.yaml.
    - Include it in later ranking and originality review; do not auto-select it for the book.

completion_definition:
  - approved/ and approved/manifest.yaml agree at the per-file level.
  - Captain Hook lineage is represented in canonical concept and generation manifests.
  - Missing counterpart work is explicitly recorded and queued.
  - Existing approved bases can enter stage-two revision without waiting for unrelated exploration.
  - Roadmap tasks t-007, t-013, and t-015 remain the authoritative execution queue.
