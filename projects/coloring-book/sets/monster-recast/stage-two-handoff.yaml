set: monster-recast
source_issue: 414
migrated_at: '2026-07-17'
status: active-project-handoff
purpose: >
  Keep Monster Recast stage-two production inside the coloring-book project
  and its roadmap instead of relying on a standalone GitHub issue that the
  Conductor Worker does not select.

workflow_ownership:
  exploration:
    roadmap_task: t-007
    scope: >
      Finish paired first-pass color and black-and-white studies for concepts
      not represented in approved/, using unapproved-art-jobs.yaml and the
      quality/curation pipeline. Exploration must not replace accepted bases.
  selection_and_refinement:
    roadmap_task: t-013
    scope: >
      Reconcile every approved asset to a canonical concept, verify filename
      drift and duplicates, preserve accepted compositions, repair weak or
      divergent pairs, and record production metadata.
  coloring_conversion:
    roadmap_task: t-015
    scope: >
      Produce faithful missing counterparts and final print-ready line art
      from selected colored masters without redesigning the accepted scene.
  packaging:
    roadmap_task: t-016
    scope: >
      Assemble the final digital and print-ready package only after selection,
      Character creation, and coloring conversion are complete.

