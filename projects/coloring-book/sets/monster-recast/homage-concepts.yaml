set: monster-recast
version: 2
status: concept-pool
commercial_status: needs-originalization
concept_count: 34
selection_target: 28-32 solo concepts plus 4-6 duo or ensemble pages
creative_direction: CREATIVE-DIRECTION.md

concepts:
  - id: mr-001
    working_title: The Perfect Woman
    source_lineage: Frankenstein's monster laboratory activation
    recast: Woman Doctor Frankenstein and her hunchbacked assistant Ivorian create a statuesque Amazonian woman.
    body_direction: The creation is extremely tall, broad-shouldered, heavily muscled, scarred, and magnificent rather than delicate or bridal.
    framing: Low, wide laboratory tableau from the foot of the slab as the creation rises through lightning; doctor and assistant flank her like proud artists unveiling a masterpiece.
    horror_engine: Surgical seams, electrical apparatus, impossible strength, first breath after death.
    camp_engine: The doctor is triumphantly presenting her scientifically perfected woman while Ivorian fusses with absurdly oversized switches.
    sensuality: Monumental nude-implied anatomy obscured by straps, smoke, cables, foreground machinery, and a strategically placed sheet.
    visual_hook: The creation opens her eyes and flexes hard enough to bend the restraint frame.
    originalization_hook: Build a new laboratory dynasty, original facial structure, quilted surgical seam map, heart-voltmeter apparatus, and distinct doctor/assistant designs; never make her the Bride.

  - id: mr-002
    working_title: Sweet Dreams, Darling
    source_lineage: Freddy Krueger dream killer
    recast: An adult woman burn survivor who uses dangerous glamour as part of her predatory dream persona.
    body_direction: Slightly voluptuous and athletic, visibly burned across face, scalp, neck, chest, and arms; scars are not airbrushed away.
    framing: Bedroom-threshold shot from mattress height, one hip forward, burned face close to the light, bladed hand emerging from dream shadow.
    horror_engine: Severe healed burns, intimate invasion, impossible dream geography, sharp silhouette.
    camp_engine: She poses like a lethal perfume advertisement and knows exactly how unsettling the contradiction is.
    sensuality: Dangerous adult confidence, body-conscious knitwear, bare scarred shoulder, no explicit nudity.
    visual_hook: Her reflection in a vanity mirror is smiling before she is.
    originalization_hook: Replace the familiar hat, striped sweater, glove construction, and facial pattern with a scorched lounge singer silhouette and an original articulated dream instrument.

  - id: mr-003
    working_title: Broadcast Giant
    source_lineage: The Ring television emergence
    recast: A gigantic muscular young adult man with short wet black hair emerges impossibly large from a television.
    body_direction: Heroically muscled but pallid, damp, bruised, and uncanny rather than a clean superhero body.
    framing: Floor-level forced perspective; television in the foreground, his shoulders and torso filling the entire classroom-sized room as furniture bends around the scale error.
    horror_engine: Impossible scale, direct stare, wet footprints on vertical surfaces, body too large for architecture.
    camp_engine: The melodramatic entrance is so oversized that a normal television becomes a tiny accessory.
    sensuality: Clinging wet shirt or bare shoulders, adult physique, no explicit exposure.
    visual_hook: One huge hand rests casually on the television frame while the rest of him appears miles larger behind it.
    originalization_hook: Use original broadcast mythology, different hair length, signal scars, geometric static tattoos, and a transformed room rather than copying a specific crawling pose.

  - id: mr-004
    working_title: Masking Up at Moon Lake
    source_lineage: Jason Voorhees lakeside slasher
    recast: A disfigured adult woman killer puts on a hockey-like protective mask while skinny dippers scramble behind her.
    body_direction: Solid, powerful, broad-backed, work-hardened body; facial damage visible before the mask covers it.
    framing: Three-quarter mask-on ritual in the foreground; panicked adult swimmers in the background are obscured by towels, reeds, coolers, inner tubes, and crossed limbs.
    horror_engine: Calm ritual, scarred face, looming physical strength, weapon just outside the frame.
    camp_engine: Elaborate tasteful obstruction of every naughty bit becomes a visual farce without weakening her menace.
    sensuality: Implied adult nudity among swimmers; killer remains practical and intimidating rather than pinup-styled.
    visual_hook: The mask aligns with her face at the exact instant the swimmers notice her.
    originalization_hook: Design a unique lake-rescue mask, distinct scars, original workwear, and different weapon language; do not reproduce the famous hockey mask.

  - id: mr-005
    working_title: Moon-Torn
    source_lineage: The Wolf Man and she-wolf transformation cinema
    recast: A ferocious adult she-wolf at full power.
    body_direction: Enormous thighs, shoulders, claws, muzzle, and textured fur; clothes are torn by transformation, not arranged as lingerie.
    framing: Extreme low-angle howl with a gigantic cratered moon filling nearly the entire page behind her.
    horror_engine: Predatory anatomy, saliva, claws, ripped fabric, overwhelming moon.
    camp_engine: The moon is impossibly excessive, like the universe itself supplied a spotlight.
    sensuality: Raw physical power and exposed transformed musculature, strategically covered by fur and tatters.
    visual_hook: Her claws break the frame edge while the moon's texture echoes her fur.
    originalization_hook: Preserve primal transformation but use an original crescent mane, asymmetrical fur pattern, urban rooftop setting, and distinct moon curse.

  - id: mr-006
    working_title: Screwhead
    source_lineage: Pinhead and ritual pain-dimension horror
    recast: A severe adult woman with screws embedded across her body and face.
    body_direction: Tall, muscular, architectural body with scarred flesh and deliberate geometric hardware.
    framing: Centered, nearly religious frontal portrait holding an original mechanical sphere that opens into nested metal petals.
    horror_engine: Screws entering skin, ritual stillness, impossible device, clinical gaze.
    camp_engine: Her hardware is arranged with the precision of couture tailoring, and she regards the viewer like an underdressed guest.
    sensuality: Structured leather and exposed scar patterns without explicit anatomy.
    visual_hook: The sphere's metal petals echo the screw pattern radiating across her body.
    originalization_hook: No pins, puzzle cube, grid-cut head, or copied leather costume; use screws, a petaled sphere, asymmetrical scar geometry, and original cosmology.

  - id: mr-007
    working_title: Pound Foolish
    source_lineage: Pennywise and demonic carnival horror
    recast: A gigantic curvy, Botticellian, zaftig clown woman who embodies an entire demonic carnival.
    body_direction: Vast soft body, powerful arms, huge hips, abundance and scale; never slim her into an acrobat.
    framing: View from the foot of an ordinary bedroom toward a closet that recedes impossibly far; Pound Foolish fills most of the closet-carnival dimension.
    horror_engine: Closet becomes endless midway tent, face too large for the room, bedroom perspective stretched beyond reason.
    camp_engine: A cosmic carnival diva is trying to make a grand entrance through a closet meant for sweaters.
    sensuality: Plunging but theatrical carnival bodice, luxuriant curves, no explicit exposure.
    visual_hook: Her skirts, tent stripes, balloons, and body appear to be different parts of the same living carnival.
    originalization_hook: Keep the established six-armed cosmic ringmaster design; avoid familiar clown makeup, costume details, sewer imagery, and specific family lineage.

  - id: mr-008
    working_title: The Little Game Mistress
    source_lineage: Jigsaw's tricycle doll
    recast: A thin female mechanical doll in a dapper tuxedo with more animation and personality.
    body_direction: Deliberately narrow, angular puppet body; this is one page where thinness serves the mechanical silhouette.
    framing: Low hallway angle as she brakes a tiny wheeled vehicle and turns sharply toward the viewer.
    horror_engine: Painted doll face, stiff joints, direct invitation to play, long institutional hallway.
    camp_engine: Immaculate tuxedo, patent shoes, and a tiny vehicle treated like a dramatic sports car.
    sensuality: None required; dapper theatricality carries the gender play.
    visual_hook: One painted eyebrow is raised as if she is genuinely enjoying the rules explanation.
    originalization_hook: Replace spiral cheeks, exact tricycle, face shape, and tuxedo details with an original game-host automaton and different wheeled device.

  - id: mr-009
    working_title: Draculina and Her Three Husbands
    source_lineage: Dracula and 1970s Hammer vampire cinema
    recast: A commanding mature vampire woman surrounded by three well-built, beautiful, slightly zombified husbands.
    body_direction: Draculina is tall, mature, lush, and authoritative; husbands vary between muscular, lean, and broad rather than matching bodybuilder clones.
    framing: Saturated 1970s bedroom or crypt-lounge family portrait, Draculina central and upright while the husbands recline, kneel, and hover around her.
    horror_engine: Bloodless husbands, predatory matriarch, candlelit crypt, hypnotic eyes.
    camp_engine: The arrangement resembles an outrageously decadent household portrait commissioned by the vampire herself.
    sensuality: Hammer-style adult cleavage, open shirts, bare chests, velvet, jewelry, and possessive posing without explicit nudity.
    visual_hook: Each husband bears a different bite mark and a slightly different expression of adoration or vacancy.
    originalization_hook: Create an original vampire court, wardrobe, castle interiors, and husband biographies; do not copy actors, costumes, or poster layouts.

  - id: mr-010
    working_title: The Madam in the Hat
    source_lineage: The Babadook
    recast: A severe adult woman undertaker-governess apparition rather than a sexualized monster.
    body_direction: Extremely tall, narrow, angular, and old-fashioned, with a body that seems folded from black paper.
    framing: Doorway silhouette seen from a child's low viewpoint; hat and fingers cut sharp shapes into the room.
    horror_engine: Unnatural limbs, flat-black silhouette, grief-haunted domestic space, face glimpsed only in fragments.
    camp_engine: Her mourning outfit is absurdly overdesigned, as if terror arrived dressed for opening night.
    sensuality: None; visual charisma comes from silhouette and severity.
    visual_hook: Her coat shadow contains a second, smiling profile that her body does not.
    originalization_hook: Test whether the image can move beyond the source silhouette using a fan-shaped mourning hat, paper-theatre anatomy, and original grief mythology.

  - id: mr-011
    working_title: The Alien King
    source_lineage: Queen xenomorph and biomechanical alien horror
    recast: A masculinized extraterrestrial hive king.
    body_direction: Broad upper carriage, narrow armored waist, ceremonial crest, long powerful limbs, visibly nonhuman reproductive biology.
    framing: Low throne composition in an egg chamber, king leaning forward with courtly menace while attendants remain abstract silhouettes.
    horror_engine: Unreadable anatomy, acid-like drool, egg chamber, predatory stillness.
    camp_engine: He carries himself like an impossibly severe monarch posing for an official coronation portrait.
    sensuality: Sleek adult masculine body language expressed through alien armor, not human anatomy.
    visual_hook: His crest opens like a dark crown only when he faces the viewer.
    originalization_hook: Replace the familiar elongated skull, ribbed black body, inner jaws, and industrial nest with a radial crown, mineral exoskeleton, lantern throat, and new hive ecology.

  - id: mr-012
    working_title: Hush, Darling
    source_lineage: Dead Silence ventriloquist dummy poster
    recast: A female ventriloquist dummy in the close face-and-finger composition.
    body_direction: Delicate but visibly carved adult female doll face, lacquer cracks, old-fashioned coiffure, articulated jaw.
    framing: Extreme poster-like close-up, one wooden finger pressed to painted lips, glossy eyes dominating the page.
    horror_engine: Dead stillness, direct eye contact, finger too close to the viewer, mouth seam beginning to open.
    camp_engine: Her expression carries the smallest hint that she is enjoying the theatrical command to be quiet.
    sensuality: Glamorous doll makeup and coiffure only; no body emphasis needed.
    visual_hook: The finger belongs to a different wood grain than the face, suggesting she assembled herself.
    originalization_hook: Preserve the strong close-up grammar but design a completely new doll face, finger joints, hair, costume collar, crack map, and title treatment.

  - id: mr-013
    working_title: Ansel Bell
    source_lineage: Annabelle haunted doll
    recast: A beautiful antique boy doll whose Sunday-best innocence feels profoundly wrong.
    body_direction: Child doll proportions, never sexualized; porcelain boy with pageboy hair, sailor-inspired formalwear, and too-perfect posture.
    framing: Clean nursery portrait from slightly below chair height, doll centered in a rocking chair while the room subtly leans toward him.
    horror_engine: Unmoving face, asymmetrical eyes, impossible room geometry, signs that toys have arranged themselves.
    camp_engine: He is dressed with absurd ceremonial perfection for an empty nursery tea appointment.
    sensuality: None.
    visual_hook: Every toy animal faces the viewer except the doll, whose eyes do.
    originalization_hook: New porcelain sculpt, outfit, chair, nursery architecture, and haunting rules; avoid recognizable commercial doll features.

  - id: mr-014
    working_title: Ghostface Gets Ready
    source_lineage: Ghostface slasher iconography
    recast: An adult woman killer fully clothed in a bubble bath, shaving one comically stubbly leg with her knife.
    body_direction: Average adult body, robe or slasher garment soaked and bunched safely around her; one exposed leg has very short visible stubble, not heavy hair.
    framing: Three-quarter bathtub glamour pose, one leg raised out of bubbles, mask turned toward the viewer, knife used as an absurd razor.
    horror_engine: Real knife, masked intruder, phone off hook, bathroom door open into darkness.
    camp_engine: A classic beauty-prep pose performed with slasher seriousness and the least appropriate shaving tool possible.
    sensuality: Tastefully covered adult bathtub pinup; exposed leg, bubbles, wet fabric, no explicit anatomy.
    visual_hook: A tiny strip of perfectly shaved skin contrasts with the remaining comic stubble.
    originalization_hook: Commercial version needs an original elongated scream mask and robe architecture; preserve bathtub gag and phone-call staging rather than exact costume.

  - id: mr-015
    working_title: Unraveled on the Red Carpet
    source_lineage: Classic mummy movies
    recast: A glamorous adult woman mummy making a red-carpet entrance.
    body_direction: Strong curving body under layered wraps; age and decay visible in hands and face without making her a fashion model in clean bandages.
    framing: Mid-stride premiere shot as someone behind her accidentally steps on the end of a wrapping ribbon and she begins unraveling across the carpet.
    horror_engine: Ancient body beneath loosening wraps, dead eyes, curse symbols, paparazzi becoming statues.
    camp_engine: Wardrobe malfunction played as supernatural red-carpet catastrophe.
    sensuality: Strategically layered wraps and jewelry; accidental exposure always blocked by trophy, handbag, photographer, or overlapping ribbon.
    visual_hook: The trailing bandage winds through paparazzi like a living serpent.
    originalization_hook: Original royal identity, wrap pattern, jewelry, curse, and premiere setting; avoid copied sarcophagus masks or named pharaohs.

  - id: mr-016
    working_title: Creature in Drag
    source_lineage: Creature from the Black Lagoon
    recast: A fundamentally monstrous amphibious creature performing aquatic drag rather than becoming a conventionally human fish woman.
    body_direction: Broad amphibious torso, heavy fins, webbed claws, gills, scales, and creature face preserved.
    framing: Dressing-room mirror shot as the creature adjusts a seaweed boa and shell crown before stepping onstage.
    horror_engine: Wet practical-creature texture, claws, gills, black water visible behind the mirror.
    camp_engine: The drag preparation is completely earnest, with pearls hanging from every fin and tiny fish assisting backstage.
    sensuality: Creature glamour, fin-framed hips, pearls, and pose without humanizing the anatomy.
    visual_hook: The mirror reflection shows the creature already performing before the real creature is ready.
    originalization_hook: Use a new river ecology, body ridges, shell couture, and stage mythology; no copied lagoon head shape or costume.

  - id: mr-017
    working_title: Trophy Queen
    source_lineage: The Predator
    recast: A visibly feminine adult alien hunter whose face remains intense, frightening, and fully nonhuman.
    body_direction: Extremely athletic, powerful, scarred, broad-shouldered, with mandibles and alien musculature preserved.
    framing: Low jungle-canopy perch or trophy-room stance, helmet lifted in one hand as she turns her bare mandibles toward the viewer.
    horror_engine: Mandibles, camouflage shimmer, weapons, trophy silhouettes, stalking posture.
    camp_engine: Her armor has the confidence and visual control of high fashion without becoming decorative nonsense.
    sensuality: Exposed armored midriff, thighs, muscle, and posture; no softening of face or threat.
    visual_hook: Braided trophy cords form a dramatic cape behind her.
    originalization_hook: New alien species, mandible geometry, armor system, camouflage effect, weapon set, and honor code; avoid copied helmet and netting.

  - id: mr-018
    working_title: Doctor Feast
    source_lineage: Hannibal Lecter upright gurney transfer
    recast: A mature adult woman psychiatrist and cannibal, masked and restrained upright inside her cage.
    body_direction: Late-middle-aged woman, composed face, longer graying hair, physically ordinary but radiating control.
    framing: Symmetrical frontal transfer shot through cage bars, upright gurney and restraint mask unmistakable as the dramatic focus.
    horror_engine: Intelligent gaze, restraint apparatus, cage, implication that everyone nearby is less safe than she appears.
    camp_engine: She looks impeccably dignified despite the absurd quantity of restraints.
    sensuality: None needed beyond mature charisma and close eye contact.
    visual_hook: One loose strand of hair is the only uncontrolled line in the entire composition.
    originalization_hook: Use an original psychiatrist, mask design, restraint frame, institution, and costume; no actor likeness or copied mask architecture.

  - id: mr-019
    working_title: Countess Vermin
    source_lineage: Nosferatu
    recast: An absolutely ugly, gaunt adult female vampire.
    body_direction: Bald or sparsely haired, ratlike, skeletal, long-nailed, stooped, ancient, and genuinely repulsive rather than gothic-pretty.
    framing: Side-lit window or coffin-rise composition with huge claw shadow stretching up the wall.
    horror_engine: Starved anatomy, rodent teeth, corpse skin, plague atmosphere, enormous shadow.
    camp_engine: She wears one tiny piece of exquisite jewelry with the solemn vanity of a grand duchess.
    sensuality: None; the gender swap is carried by identity, jewelry, posture, and title rather than prettification.
    visual_hook: Her shadow is voluptuous and glamorous while her real body is skeletal.
    originalization_hook: Draw from public-domain vampire folklore and expressionist shadow language while creating a new face, costume, setting, and plague mythology.

  - id: mr-020
    working_title: Fly Girl Summer
    source_lineage: The Fly
    recast: A conventionally curvy adult woman in a classic cheesecake swimsuit pose with the detailed head of a giant fly.
    body_direction: Hourglass human body with natural freckles, moles, stretch detail, and suggested vitiligo patches; fully insectoid head, compound eyes, mouthparts, and antennae.
    framing: Bright mid-century swimsuit pinup on a laboratory beach set, one hand on hip, fly head turned coyly toward camera.
    horror_engine: Hyper-detailed insect head, twitching mouthparts, compound-eye reflections, subtle extra joints.
    camp_engine: The most conventional cheesecake pose in the book is attached to the least conventionally romantic head imaginable.
    sensuality: Adult one-piece or high-waisted two-piece swimsuit, confident pinup pose, body details left human and imperfect.
    visual_hook: Compound eyes reflect hundreds of tiny admiring photographers.
    originalization_hook: Build an original teleportation accident, insect species, swimsuit design, body markings, laboratory resort, and personality.

  - id: mr-021
    working_title: The Invisible Exhibitionist
    source_lineage: The Invisible Man
    recast: An adult invisible woman appears to flash the viewer.
    body_direction: Body defined entirely by negative space, lingerie edges, stockings, heels, gloves, jewelry, and the open trenchcoat.
    framing: Direct frontal doorway pose, trenchcoat thrown open with theatrical flourish; revealing lingerie implies form without exposing visible anatomy because the body is literally absent.
    horror_engine: Empty space where a person should be, floating smile suggested by lipstick, footsteps approaching independently.
    camp_engine: The classic flasher gesture becomes an impossible visual joke because there is nothing visible to censor.
    sensuality: Adult lingerie, garters, stockings, heels, open coat; playful and suggestive, not explicit.
    visual_hook: The wallpaper pattern is visibly distorted through her invisible body, proving she occupies the space.
    originalization_hook: Avoid bandaged-head disguise and familiar trench styling; use a new invisibility accident, accessories, coat silhouette, and warped-light effect.

  - id: mr-022
    working_title: Prom King Ascendant
    source_lineage: Carrie prom catastrophe
    recast: A young trans man at his school prom, drenched in a non-graphic dark ceremonial fluid, standing as the only unharmed face in a destroyed gym.
    body_direction: Late-teen boy, age-appropriate formalwear, chest binder not visible or fetishized, face recognizably masculine and emotionally transformed.
    framing: Low center-aisle shot after the telekinetic event; crowned prom king stands perfectly still beneath twisted decorations and collapsed bleachers.
    horror_engine: Ruined gym, smoke, electrical sparks, one hand under distant rubble, telekinetic debris held in the air.
    camp_engine: The cheap plastic crown remains perfectly centered while the entire gym has been demolished around him.
    sensuality: None; this page is about identity, humiliation, rage, and supernatural control.
    visual_hook: Every broken banner letter has fallen except the letters spelling KING.
    originalization_hook: New school, new humiliation mechanism, new fluid, original suit and powers; avoid copied bucket, dress, pose, and actor likeness.

  - id: mr-023
    working_title: Babs O'Blob
    source_lineage: The Blob
    recast: A voluptuous sentient mass whose body can become any shape and who treats the scene like a star entrance.
    body_direction: Huge amorphous body with many possible curves, folds, arms, and faces; not merely a woman wearing a blob dress.
    framing: Theatre-curtain entrance where the blob body becomes both performer and sweeping train across the stage.
    horror_engine: Absorption, faces briefly visible inside translucent mass, architecture bending under her volume.
    camp_engine: She pauses to pose while accidentally engulfing the orchestra pit and apologizes with several hands.
    sensuality: Fluid adult curves suggested through shape and pose, no explicit anatomy.
    visual_hook: Her body forms its own red carpet and velvet curtains simultaneously.
    originalization_hook: Keep established Babs character but intensify scale, star persona, translucent internal props, and stage-specific visual joke.

  - id: mr-024
    working_title: Madame Phantasm
    source_lineage: The Phantom of the Opera
    recast: A commanding adult woman composer and subterranean opera phantom.
    body_direction: Tall, angular, mature, severe, with visible facial difference beneath an original multi-part mask system.
    framing: Grand staircase or organ-balcony descent as she conducts chandeliers and masks around her.
    horror_engine: Hidden theatre, facial disfigurement, obsessive control, masks singing independently.
    camp_engine: She treats the entire opera house as a wearable accessory and every entrance as the final act.
    sensuality: Adult gothic glamour, fitted conductor gown, gloves, exposed damaged cheek if desired; never reduced to a pretty half-mask model.
    visual_hook: Several masks orbit her face, each displaying a different emotion she refuses to show.
    originalization_hook: Use the established original character design; avoid the plain white half-mask, copied costume, actor likenesses, and famous chandelier composition.

  - id: mr-025
    working_title: Little Miss Omen
    source_lineage: Damien from The Omen
    recast: A malevolent young girl in a precise London private-school pageboy look.
    body_direction: Child character, never sexualized; immaculate coat, shorts or skirt-trouser school uniform variation, blunt pageboy hair, unreadable smile.
    framing: Vintage poster portrait from child eye level, girl centered while long dark triangular shadows point toward her from architecture, trees, and adults.
    horror_engine: Calm grin, environmental accidents implied at frame edges, treacherous shadows, animals recoiling.
    camp_engine: She looks delighted by the elaborate visual conspiracy surrounding her and almost proud of the hidden symbol.
    sensuality: None.
    visual_hook: The number 666 is hidden once in negative space, once in shadow intersections, and once in decorative ironwork without becoming obvious typography.
    originalization_hook: New child, school, family, coat design, symbols, and supernatural lineage; use 1970s occult-poster geometry without copying the original poster.

  - id: mr-026
    working_title: Madam Satan
    source_lineage: Satan in classic occult cinema and folklore
    recast: Satan herself as a woman, not a demoness, succubus, bride, or subordinate devil.
    body_direction: Mature, physically commanding, beautiful or ugly by choice, with a human face that can barely contain ancient nonhuman authority.
    framing: Formal reception or contract-signing scene at the end of a long banquet table, camera low enough that she owns the entire room.
    horror_engine: Absolute confidence, impossible shadow, subtle horns or hoof clues, contracts writing themselves, guests realizing too late who hosts them.
    camp_engine: She is charming, delighted, socially perfect, and having the best evening of anyone present.
    sensuality: Elegant adult allure, immaculate tailoring, deep neckline or severe suit by design; never generic red lingerie.
    visual_hook: Her shadow contains every traditional Satan shape at once while her visible body remains almost human.
    originalization_hook: Create an original cosmology and visual identity; no goat body, succubus clichés, branded occult symbols, or copied film Satan.

  - id: mr-027
    working_title: Half Possessed
    source_lineage: The Exorcist possession scene
    recast: A teenage boy caught exactly halfway between himself and the possessing entity.
    body_direction: Age-appropriate thin or average teen body, face split by expression rather than literal clean halves; no sexualization.
    framing: Bedside three-quarter view as he levitates unevenly, one hand gripping the mattress like a frightened boy while the other casts an impossible claw shadow.
    horror_engine: Partial facial transformation, room cold enough to frost, levitation, furniture straining toward him.
    camp_engine: His school tie, blanket, and religious objects all point in contradictory directions as gravity argues with itself.
    sensuality: None.
    visual_hook: One eye is terrified and human while the other looks directly at the viewer with adult amusement.
    originalization_hook: New boy, entity, room, symptoms, ritual objects, and family context; avoid copied makeup, nightwear, poses, and dialogue references.

  - id: mr-028
    working_title: Backward Boy
    source_lineage: The Grudge and Japanese onryo crawling imagery
    recast: A pale young adult man descending a staircase in an impossible backward bridge-walk.
    body_direction: Lanky, long-limbed adult body, short-to-medium wet black hair, joints bending believably but disturbingly.
    framing: Camera at the foot of the stairs as his face hangs upside down toward the viewer while his body descends backward above it.
    horror_engine: Bone-twisting pose, wet hair, domestic staircase, throat sound implied through vibrating banister.
    camp_engine: His neat black trousers and tucked shirt remain absurdly formal despite the impossible locomotion.
    sensuality: None beyond the unsettling physicality of an adult body.
    visual_hook: His shadow walks normally down the stairs while his body does not.
    originalization_hook: Use a new haunting, house, clothing, face, sound motif, and staircase architecture; avoid a specific franchise ghost design.

  - id: mr-029
    working_title: Madame Close-Shave
    source_lineage: Sweeney Todd and murderous barber melodrama
    recast: A severe older woman barber with theatrical elegance and genuine menace.
    body_direction: Strong forearms, mature face, silver-streaked hair, practical posture, not a youthful pinup.
    framing: View from the customer's chair with her razor crossing the foreground and her face reflected in several salon mirrors.
    horror_engine: Razor proximity, locked shop, red-stained rinse water, reflections that move independently.
    camp_engine: She is appalled by the customer's split ends even while clearly planning something much worse.
    sensuality: Mature charisma, rolled sleeves, fitted waistcoat, close personal distance; no explicit content.
    visual_hook: Every mirror shows a different proposed haircut and a different possible fate.
    originalization_hook: Original barber, shop, tools, motive, costume, and mirror mythology; avoid copied character names and production design.

  - id: mr-030
    working_title: Honeyed Hook
    source_lineage: Candyman urban-legend horror
    recast: A mature Black woman urban legend with a hook and a living cloud of bees.
    body_direction: Tall, elegant, full-bodied, middle-aged, visibly scarred, regal rather than waifish.
    framing: Mirror-facing portrait in an abandoned luxury apartment, viewer positioned as the person who has just spoken her name.
    horror_engine: Hook, bees emerging from coat seams and mouth shadow, mirror invocation, intimate proximity.
    camp_engine: She appears with the poise of a celebrity answering a deeply predictable invitation.
    sensuality: Mature glamour, dramatic coat, throat and shoulders framed by bees; no explicit content.
    visual_hook: Honey slowly forms a second smiling face on the mirror beside her.
    originalization_hook: Must become a distinct original legend with new name, history, hook construction, insect symbolism, and setting; avoid actor likeness, coat copy, and specific myth details.

  - id: mr-031
    working_title: The Tall Woman
    source_lineage: The Tall Man and Phantasm's flying spheres
    recast: An unnaturally tall older woman mortician commanding lethal silver spheres.
    body_direction: Extremely tall, narrow but physically imposing, mature face, severe shoulders, long hands.
    framing: Funeral-home corridor shot from floor level as she walks toward the viewer and silver spheres hover at different depths.
    horror_engine: Impossible height, mortuary stillness, floating metal devices, doorways too small for her.
    camp_engine: She is dressed like the most formidable funeral director in history and regards the spheres as unruly pets.
    sensuality: None; age, authority, and silhouette are the attraction.
    visual_hook: One sphere reflects her as normal height while every other reflection stretches her farther.
    originalization_hook: Create original mortician, sphere geometry and behavior, funeral home, costume, and dimensional mythology.

  - id: mr-032
    working_title: The Shape at Home
    source_lineage: Michael Myers and suburban slasher cinema
    recast: A middle-aged adult woman killer whose femininity is incidental to her terrifying stillness.
    body_direction: Average-to-broad body, strong hands, practical work clothes, unglamorous and physically credible.
    framing: Long-lens view through backyard laundry; she stands motionless between white sheets while a domestic kitchen glows behind her.
    horror_engine: Blank original mask, total stillness, suburban normality, knife silhouette glimpsed only through fabric.
    camp_engine: One sheet is printed with cheerful seasonal pumpkins, making the composition look almost like a home-decor advertisement.
    sensuality: None.
    visual_hook: Each moving sheet reveals a different part of her, but she never appears to move between openings.
    originalization_hook: Design a completely new blank mask, workwear, weapon silhouette, suburb, and seasonal ritual; do not copy the famous mask or jumpsuit.

  - id: mr-033
    working_title: The Hallway Boys
    source_lineage: The Shining twins and haunted hotel cinema
    recast: Two eerily polite young boys replacing the famous twin girls.
    body_direction: Child characters, never sexualized; one stocky and one slight, coordinated but not identical.
    framing: Symmetrical hotel corridor with the boys holding hands beneath a vanishing-point chandelier; carpet pattern turns into directional arrows toward them.
    horror_engine: Perfect stillness, impossible symmetry, elevator glow, shadows suggesting unseen adults.
    camp_engine: Their pageboy suits are so meticulously coordinated that they resemble terrifying junior hotel managers.
    sensuality: None.
    visual_hook: One boy smiles while the other boy's shadow smiles.
    originalization_hook: New hotel, boys, clothing, carpet, history, and haunting; avoid exact blue dresses, corridor design, and quoted poses.

  - id: mr-034
    working_title: Mother of the Patch
    source_lineage: Pumpkinhead and summoned rural vengeance monsters
    recast: A towering female harvest demon summoned from a pumpkin patch.
    body_direction: Skeletal but visibly maternal body architecture, long arms, powerful haunches, rootlike spine, no human glamour.
    framing: Ground-level patch view as she rises behind a grieving summoner, moonlight shining through riblike vine structures.
    horror_engine: Huge rural creature, vengeance ritual, root anatomy, elongated claws, pumpkins opening like eyes.
    camp_engine: Her silhouette resembles an impossibly severe farm widow in a vast vine bonnet.
    sensuality: None; femininity comes through presence, title, anatomy, and maternal vengeance rather than costume.
    visual_hook: The pumpkin patch vines form a cradle beneath one claw and a gallows beneath the other.
    originalization_hook: Build an original harvest demon, summoning rules, anatomy, rural setting, and motive; avoid copied head shape and film creature details.

