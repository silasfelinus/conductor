concepts:
  - id: hr2-001
    working_title: Highland Heatwave
    source_lineage: >
      Internal reference to the iconic subway-grate breeze glamour scene associated with
      The Seven Year Itch; not a request for an actor likeness or exact still recreation.
    recast: >
      A large, jolly, deeply bearded adult Scotsman receives the glamorous windblown-star reveal.
    body_direction: >
      Strong round body, large frame, magnificent full beard, joyful face, confident posture.
      Treat him as genuinely charismatic and desirable rather than as the butt of the joke.
    costume_direction: >
      Original formal Highland eveningwear: richly patterned kilt, waistcoat, polished boots,
      dress sporran, hose, flashes, and distinctive accessories. Do not copy a specific historical
      costume or substitute a white dress.
    scene: >
      Nighttime city street over a large ventilation grate. A powerful upward breeze lifts and
      fans the kilt into a dramatic sculptural shape while the sporran, layered folds, stance,
      and camera angle keep the figure completely covered. He beams and embraces the moment.
    composition: >
      Bold low three-quarter view with the grate and wind ribbons forming leading lines toward
      the figure. One hand may hold his hat or beard while the other opens theatrically into the
      breeze. Surrounding pedestrians react with admiration and surprise, not disgust.
    transformation_requirements:
      - original face and beard design
      - new city architecture and street furniture
      - materially different camera distance and body pose
      - original Highland costume system and palette
      - no copied actor expression, dress silhouette, or exact film framing
    coloring_hooks:
      - tartan sections
      - beard locks
      - carved sporran details
      - paving stones and grate geometry
      - wind ribbons and flying leaves
      - shop windows and nighttime lights
    status: seed-only
