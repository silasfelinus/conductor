    inclusive imaginary movie studio where overlooked performers become the unmistakable stars. Arrange a powerful
    older Black rocket mechanic, a plus-size South Asian musical diva, a wheelchair-using stunt driver, an elderly
    East Asian dancer, a glamorous trans noir detective, a broad-shouldered Indigenous western hero, and several
    eccentric practical-effects robots across one coherent Art Deco backlot premiere. Cameras, painted flats,
