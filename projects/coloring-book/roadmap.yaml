  stakes: reversible
  note: >-
    Kaizen from t-022 cycle 85 (2026-09-27): projects/coloring-book/T022-HISTORY.md
    already existed from an earlier archival round, so scripts/archive_recurring_task_note.py
    refused outright ("already exists -- refusing to overwrite an existing archive") even
    though the live note had legitimately grown back past check_roadmap_note_size.py's
    50,000-byte threshold since that first archival (~95KB this cycle, having started
    fresh at a short pointer after cycle 23's archival). Worked around it by hand this
    cycle: appended a second `<!-- note:begin t-022-round2 -->...<!-- note:end -->`
    marked block to the existing history file, verified the round-trip byte-for-byte
    before touching roadmap.yaml, then replaced the live note with a fresh pointer using
    the same set_task_field_text(..., force=True, force_block=">-") call the script
    itself uses. That manual replay is exactly the kind of one-off the script's own
    docstring says it exists to generalize away from (it cites interface-vision/t-104's
    hand-archival as the precedent it automated) -- the same gap will recur for t-022
    and any other long-running recurring task every time its live note regrows past
    threshold. Fix: extend archive_recurring_task_note.py so that when
    <TASK-ID>-HISTORY.md already exists, it appends a new numbered/dated
    `<!-- note:begin {task_id}-round{N} -->...<!-- note:end -->` block after the
    existing content (auto-incrementing N by scanning existing markers) instead of
    exiting, keeping the same byte-for-byte round-trip verification before rewriting
    roadmap.yaml. Verify with a new test in tests/test_archive_recurring_task_note.py
    (or wherever the existing test for this script lives) covering both the first-round
    (current, unchanged) and second-round (new) paths, plus a live-ish exercise against
    a scratch copy of T022-HISTORY.md's actual two-round shape from this cycle.

