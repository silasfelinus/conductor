-007 (clearly real, multi-hue) from a genuine duotone/sepia wash without needing a book-specific carve-out. A plausible direction: also measure hue diversity within the *colorful* (>= COLORFUL_PIXEL_SATURATION) band and only flag the low-sat-band concentration when the colorful band is ALSO low-diversity (a real duotone wash is single-hue at every saturation level, not just the low-sat one) -- but verify against the corpus rather than assuming this is sufficient. finalize-pair has no --force bypass for this check by design, so mr-007 (and mr-013, if it turns out to be a false positive too) stay stuck at accepted-but-not-finalized until this is resolved one way or the other: either the guard is recalibrated and they finalize cleanly, or the recalibration confirms the reject is correct and they need a fresh render instead. Verify with `python -m pytest tests/ -k art_quality` (or the equivalent test file, if one exists for this module) plus a live finalize-pair --live retry on both mr-007 and mr-013 once the fix lands.

