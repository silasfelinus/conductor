 the LoRA branch specifically. This run had no LoRA node at all and still produced noise, so the fault is UPSTREAM OF THE LORA BRANCH and shared by every kontext call. t-079's own note had already flagged this possibility from the coloring-book sighting; this test confirms it rather than leaving it as an inference from two projects' anecdotes. THE EXACT MODEL CHAIN, read from job 21693's stored payload so the next session does not have to re-derive it:
      unet_name:  flux1-kontext-dev-Q5_K_M.gguf     <- GGUF-quantised Kontext dev
      vae_name:   ae.safetensors
      clip_name1: t5-v1_1-xxl-encoder-Q5_K_S.gguf   <- GGUF-quantised T5 text encoder
