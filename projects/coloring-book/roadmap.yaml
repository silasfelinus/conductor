- id: t-039
  milestone: m4
  title: "Investigate: Kontext BW-derivation renders pure corrupted noise (mr-016, mr-020) -- resembles ai-art-academy/t-079"
  status: needs-human
  stakes: reversible
  note: >-
    Kaizen from t-022's 2026-09-11 pass. `manage_coloring_book_production.py`'s `generate-bw` always calls the art-enqueue endpoint with `"engine": "kontext"` (image-to-image line-art derivation from an accepted color master, no LoRA fields set). Two Monster Recast accepts left in-flight from the prior pass (mr-016 job 21667, mr-020 job 21668) both landed as pure corrupted color noise -- not line art, not a bad rendering of the source scene, just static -- and both were mechanically rejected by `art_quality.assess_file` with byte-identical statistics (mean_saturation=0.17, colorful_fraction=0.35, white_fraction=0.00) despite being derived from two completely different source color images. That identical-statistics result across different inputs points at the render backend itself, not per-image content. Rejected candidates saved at `projects/coloring-book/sets/monster-recast/generated/bw/rejected/mechanical/ mr-016-bw-20260911T003011Z.webp` and `mr-020-bw-20260911T003019Z.webp`. This resembles `ai-art-academy/t-079` ("Kontext LoRA arm renders pure corrupted noise instead of a real image", still `needs-human`/unresolved) -- same `kontext` engine family, same "every render comes back as uniform noise regardless of input" symptom -- but is NOT confirmed to be the identical bug: t-079's request body sets `loraName`/`loraStrength` (implicating the LoRA branch specifically), while this book's BW-derivation body has no LoRA fields at all, just a plain kontext image-to-image call. So either (a) the LoRA branch and the plain kontext branch share a broken component (e.g. a VAEDecode step, per t-079's own hypothesis), or (b) this is a second, separate kontext-engine defect. Both need the same backend/relay-side investigation this sandbox cannot do directly (no access to the ComfyUI node graph or relay process) -- compare the plain kontext workflow graph this book's BW derivation emits against a known-working kontext call (e.g. this same script's `accept-color`/mechanical-check