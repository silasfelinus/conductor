      manaGate in 13 endpoints, 1 mana = $0.001 peg) but the PURCHASE side is
      stubbed — no Stripe webhook credits mana, credit-purchase.vue is a fake
      alert, and manaGate's commit() skips the ManaTransaction ledger (filed as
      kind-robots/t-012). Recommendations: free tier = existing daily refill (no
      new counter), 25 mana per generated page (~20 free pages/day), coloring
      already-available pages always free, 4 free sampler pages per launch set,
      sets as one-time unlocks riding storefront t-017 / kind-robots t-008
      entitlements, show "N pages remaining today" never raw mana, paid
      generation behind a default-off flag until ai-art-academy/t-011 resolves
      FLUX licensing. Original spec:
