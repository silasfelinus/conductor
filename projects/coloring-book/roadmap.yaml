project: coloring-book
kind: software
goal: 'A kind_robots coloring-book app and production pipeline: develop themed books through proposal ledgers, color accepted
  paired masters in the app, and prepare complete digital and print-ready packages for the storefront.'
notes_from_silas: 'Canonical book order and scope, clarified 2026-07-17: book 1 is Monster Recast, book 2 is Hollywood Recast
  (never “Hollywood Recast 2”), and book 3 is Kind Robots. Each book tracks exactly 36 interior illustration proposals and
  begins with a complete set of 36 COLOR design prompts. Prompt writing, ArtJob submission, render retrieval, and same-stage
  review advance in batches of up to 18 images (half a book), not 1-6. Design iterations are color-first. Early BW studies
  may be retained as inspiration, but a faithful BW coloring-page counterpart is generated only after its color composition
  is accepted. Each proposal ultimately finishes as one confirmed final color file and one faithful final BW file. Covers
  are separate. Accepted is not final. Use MR, HWR, and KR prefixes. Internal art generation and curation are authorized;
  publishing, POD accounts/listings, spend, and public Character release remain human-gated.'
