  owner: worker
  passes: 0
  note: >-
    Discovered during t-022 cycle 7 (2026-09-14): after fixing mr-025's prompt-contract
    HTTP 422 (its source prompt said "occult-poster portrait", and "poster" alone trips
    the art API's format-vocabulary check -- see the same cycle's mr-025 prompt fix in
    art-modeler-request.yaml), the fresh render cleanly passed t-044's saturation gate
    (mean_saturation=0.2812, colorful_fraction=0.3496 -- both inside the calibrated
    real-color range of 0.20-0.60 / 0.43-0.95) yet is visually a single-hue sepia/olive
    ink wash, not the house style's flat cel-shaded multi-color palette. A pixel hue
    histogram (100x150 downsample, saturation>0.1 pixels, via colorsys.rgb_to_hsv)
    confirmed it mechanically: 80.7% of sampled pixels cluster in a ~30-90 degree
    yellow/olive/sepia band with no other hue family represented at all. t-044's
    saturation/colorful_fraction pair measures "is there color", not "is there more
    than one hue" -- so it cannot distinguish a real multi-color composition from a
    uniformly tinted monochrome one, which is exactly the same fundamental defect
    mr-025 was rejected for on 2026-09-09, just re-slipping past the newer gate under
    a different statistical signature.

    Scope: add a hue-diversity/dominant-hue-concentration signal to
    art_quality.assess()'s "color" variant, calibrated the same way t-044 was --
    against the full corpus of genuine color-stage files (approved/ +
    generated/color-proposals-v1/ across all three books) to find a threshold that
    rejects a uniform sepia/duotone wash without false-positivng on a legitimately
    single-hue-dominant scene (e.g. a mostly-green forest or mostly-red room that is
    still a real multi-color composition, just with one dominant family). This needs
    real calibration data, not a guessed threshold -- same discipline t-044 used.

    Also worth a companion pass while in this area: `art-modeler-request.yaml` has at
    least one other prompt using the now-blocked word "poster" (mr-012, line ~175,
    "Extreme close-up poster composition") -- mr-012 is already `approved` so nothing
