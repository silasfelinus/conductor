project: coloring-book
kind: software
goal: 'A kind_robots coloring-book app and production pipeline: develop themed books through proposal ledgers, color
  accepted paired masters in the app, and prepare complete digital and print-ready packages for the storefront.'
notes_from_silas: 'Canonical book order and scope, clarified 2026-07-17: book 1 is Monster Recast, book 2 is Hollywood
  Recast (never “Hollywood Recast 2”), and book 3 is Kind Robots. Each book tracks exactly 36 interior illustration
  proposals; each proposal is intended to finish as one confirmed final-draft color file and one faithful confirmed
  final-draft black-and-white file. Covers are separate. The proposal ledger must retain the proposed prompt, inspirations
  and candidates, accepted working color/BW files, and final color/BW files. Accepted is not the same as final.
  Use MR, HWR, and KR prefixes; the old shared HR shorthand is ambiguous. Keep production moving in small batches
  without making unrelated exploration block accepted work. Art generation and internal curation are authorized;
  publishing, POD accounts/listings, spend, and public Character release remain human-gated.'
