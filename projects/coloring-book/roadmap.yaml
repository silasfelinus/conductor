project: coloring-book
kind: software
goal: >
  A kind_robots coloring book app: color AI-generated pages like any coloring book,
  browse themed sets, and generate new pages with the Kontext network — with the same
  pages feeding print-on-demand physical books through the digital storefront.
waypoints:
  - Open a coloring page and fill sections with your palette.
  - Browse the launch sets — Kind Robots and Monster Recast.
  - Generate a page of your own from a prompt or an image.
  - Save and export your colored creations.
  - Meet the Monster Recast cast as Kind Robots Characters.
  - Find the digital and printed books in the gift shop.
notes_from_silas: >
  New project 2026-07-10, formalizing ideas that started under other names: the
  mural-design WonderLab coloring page is the tech seed, and this relates to
  digital-storefront (and the archived Humboldt Impropriety Society coloring
  book/calendar inspiration — NOT revived). I want a front-end coloring book app
  of AI-generated coloring pages, plus Kontext and/or a coloring-book LoRA so users
  can generate their own. Coloring book sets and tokens beyond a free tier must use
  the existing KR economy. Art generation for sets and app assets is authorized.
  The first two digital books are Kind Robots and Monster Recast (slug:
  monster-recast), which replaces the earlier generic monster-drag plan. Monster
  Recast is an original gallery of gender-swapped and drag-reimagined Hollywood
  monster archetypes. First lock original names, bios, designs, varied concept-art
  prompts, and Kind Robots Character seed data; then generate concept art, select
  the strongest original designs, create Character entries, and convert the winners
  into a 28-page physical/digital coloring book. Once the package is complete, pause
  outward publishing and POD work until the coloring app and storefront are ready.
