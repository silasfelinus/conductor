- id: t-031
  milestone: m4
  title: Audit other art-consumption scripts for t-022's unlocked-entry duplicate-submission bug
  status: done
  passes: 0
  stakes: reversible
  updated: '2026-07-28T03:33:00Z'
  note: |-
