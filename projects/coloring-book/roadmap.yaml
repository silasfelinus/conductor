  status: needs-human
  stakes: reversible
  note: >-
    Kaizen from t-022's 2026-09-11 pass. `manage_coloring_book_production.py`'s `generate-bw` always calls the art-enqueue endpoint with `"engine": "kontext"` (image-to-image line-art derivation from an accepted color master, no LoRA fields set). Two Monster Recast accepts left in-flight from the prior pass (mr-016 job 21667, mr-020 job 21668) both landed as pure corrupted color noise -- not line art, not a bad rendering of the source scene, just static -- and both were mechanically rejected by `art_quality.assess_file` with byte-identical statistics (mean_saturation=0.17, colorful_fraction=0.35, white_fraction=0.00) despite being derived from two completely different source color images. That identical-statistics result across different inputs points at the render backend itself, not per-image content. Rejected candidates saved at `projects/coloring-book/sets/monster-recast/generated/bw/rejected/mechanical/ mr-016-bw-20260911T003011Z.webp` and `mr-020-bw-20260911T003019Z.webp`. This resembles `ai-art-academy/t-079` ("Kontext LoRA arm renders pure corrupted noise instead of a real image", still `needs-human`/unresolved) -- same `kontext` engine family, same "every render comes back as uniform noise regardless of input" symptom -- but is NOT confirmed to be the identical bug: t-079's request body sets `loraName`/`loraStrength` (implicating the LoRA branch specifically), while this book's BW-derivation body has no LoRA fields at all, just a plain kontext image-to-image call. So either (a) the LoRA branch and the plain kontext branch share a broken component (e.g. a VAEDecode step, per t-079's own hypothesis), or (b) this is a second, separate kontext-engine defect. Both need the same backend/relay-side investigation this sandbox cannot do directly (no access to the ComfyUI node graph or relay process) -- compare the plain kontext workflow graph this book's BW derivation emits against a known-working kontext call (e.g. this same script's `accept-color`/mechanical-check path, which only downloads an already-rendered image and never calls enqueue) to see whether the corruption is upstream of both branches or specific to each. FOR SILAS: two systemic corrupted-noise signals now exist across two projects on the same `kontext` engine family (ai-art-academy/t-079 and this task). Worth having whoever has backend/relay access (ComfyUI workflow graph, or the relay's `buildKontextWorkflow`) look at both together rather than separately, since a shared root cause would explain both with one fix. TO APPROVE: no roadmap action needed from Silas to unblock other work -- this is a soft gate (agents keep working elsewhere; coloring-book's `t-022` is simply not re-attempting any `generate-bw` calls until this clears). What unblocks when it's fixed: `t-022` can resume BW derivation for mr-016, mr-020, and the other in-progress Monster Recast accepts. REPRODUCED 2026-09-11 BY DIRECT TEST, and the result rules out the leading hypothesis. Silas gave a session admin art-job access ("You have the ability to create art job requests through the admin key, make the Kontext test yourself"), so this no longer needed to wait on him. THE TEST: ArtJob 21693, enqueued through POST /api/art/enqueue with `"engine": "kontext"` and NO LoRA fields of any kind -- the same plain image-to-image branch `manage_coloring_book_production.py`'s `generate-bw` uses. Source was a known-good 1024x1024 plate (cthulhuquarium-fish-lamplight-angler.webp, a clean Victorian trade-card illustration), prompt asked for black and white line art on a pure white background, steps 20, guidance 2.5, denoise 1. The job took roughly 25 minutes, completed DONE with no error, and produced ArtImage 23785: a valid, well-formed 1024x1024 PNG of PURE MULTICOLOURED STATIC. No line art, no recognisable subject, no white background -- the identical failure mr-016 and mr-020 showed. WHAT THIS RULES OUT. ai-art-academy/t-079's leading hypothesis was GGUF + LoraLoaderModelOnly: that the corruption lived in the LoRA branch specifically. This run had no LoRA node at all and still produced noise, so the fault is UPSTREAM OF THE LORA BRANCH and shared by every kontext call. t-079's own note had already flagged this possibility from the coloring-book sighting; this test confirms it rather than leaving it as an inference from two projects' anecdotes. THE EXACT MODEL CHAIN, read from job 21693's stored payload so the next session does not have to re-derive it:
      unet_name:  flux1-kontext-dev-Q5_K_M.gguf     <- GGUF-quantised Kontext dev
      vae_name:   ae.safetensors
      clip_name1: t5-v1_1-xxl-encoder-Q5_K_S.gguf   <- GGUF-quantised T5 text encoder
      clip_name2: clip_l.safetensors
      type:       flux
    Two separately GGUF-quantised components in one graph (the UNet and the T5 encoder). The remaining suspects, in the order worth testing: (1) the Q5_K_M Kontext UNet itself being a bad or mismatched quant, (2) a VAE mismatch -- ae.safetensors decoding latents the quantised UNet did not produce in the expected space, (3) the ComfyUI/GGUF-node version on the relay having regressed against these files. The decisive next test remains the one t-079 proposed and this run did not perform: enqueue the same plain kontext call against a NON-GGUF Kontext checkpoint. If that renders correctly, the quantised UNet is the fault; if it also renders noise, look at the VAE and the relay's node versions. That test needs a non-GGUF checkpoint present on the relay, which is why it is not done here. SECOND, INDEPENDENT BUG FOUND -- THE QUALITY GUARD IS BLIND TO THIS. `art_quality.assess_file(path, "color")` returned ok=True with reasons=[] on the noise image: mean_saturation 0.2202, colorful_fraction 0.4868, white_fraction 0.0, luma_std 0.1153. Static is saturated and busy, so it reads as a perfectly healthy colour image by these statistics. The earlier coloring-book rejections happened under the `bw` variant, whose thresholds caught it by accident -- white_fraction 0.00 fails a line-art check but means nothing for colour work. CONSEQUENCE: any colour art generated through a broken kontext path can pass the mechanical gate and be accepted as good. That is a wider exposure than this task, and it should be fixed whether or not the kontext corruption is: a noise detector (spatial autocorrelation, or a high-frequency-energy threshold -- static has almost no low-frequency structure) belongs in art_quality.py for every variant, not just bw. STATUS: this task stays needs-human ONLY for relay access to run the non-GGUF comparison. Everything that could be established from an agent session now has been. coloring-book/t-022's `generate-bw` should continue to hold rather than burn more jobs on a