- id: t-035
  milestone: m4
  title: Record a fresh submission's new ArtJob id so a missing-credential semantic-gate failure is recoverable too
  status: done
  passes: 0
  stakes: reversible
  owner: worker
  updated: '2026-07-28T17:22:00Z'
  note: >
    KAIZEN (from PR #1327, t-032, 2026-07-28): t-032 fixed consume_coloring_book_color_art.py
    so a *recovery* attempt (an entry whose semantic_gate_error already names a stuck job id)
    that fails validate_candidate() solely because ANTHROPIC_API_KEY is missing no longer
    overwrites that job-id reference -- a future pass with real credentials can still recover
    the already-completed render instead of submitting a duplicate. The 14 monster-recast
    entries currently in fresh_submission_blocked (mr-001, mr-005 through mr-015, mr-017,
    mr-018 as of 2026-07-28) have the identical underlying risk on the *other* branch of the
    same loop: a fresh submission calls enqueue() and waits for the new ArtJob to complete,
    but if validate_candidate() then fails on the same missing-credential error, the new job's
    id is never written into semantic_gate_error (record_semantic_gate_error() just stores
    str(error), which is "ANTHROPIC_API_KEY is required..." with no job id in it) -- so
    referenced_job_id() can never find it, and there is no way for any future pass, credentialed
    or not, to recover that already-rendered image; only a genuinely fresh resubmission is
    possible for these 14, which duplicates render-backend work for images that likely already
    completed. Fix: when a fresh enqueue()'s resulting validate_candidate() call fails, include
    the new ArtJob's id in the recorded semantic_gate_error (matching the "job N timed out"
    text format referenced_job_id() already parses) so it becomes recoverable via the same
    recover_timed_out_job() path t-032 just hardened, instead of only degrading to a fresh
    resubmission. Add regression coverage mirroring t-032's tests.

    DONE 2026-07-28: record_semantic_gate_error() now takes an optional job_id and stamps
    "job N: <message>" onto the stored semantic_gate_error whenever the message doesn't
    already carry a "job N" reference (so a recovery-path message that already names its
    job, e.g. the wait_for_job() timeout text, is never double-stamped). main()'s fresh-
    submission branch tracks the newly enqueued job's id in a submitted_job_id variable
    (mirroring the existing stuck_job_id tracking for the recovery branch) and passes it
    through on the record_semantic_gate_error() call in the except handler. enqueue()
    failing outright (no ArtJob ever created, e.g. mr-018's HTTP 500) leaves
    submitted_job_id unset, so that case is correctly left unstamped -- only a fresh
    submission whose ArtJob actually completed and rendered, then failed verification,
    gets a recoverable reference. Added 3 regression tests: two unit tests on
    record_semantic_gate_error() (stamps when missing, does not double-stamp when
    present) and one main()-level integration test mirroring t-032's
    test_live_recovery_blocked_by_missing_semantic_credential_preserves_job_reference,
    covering the fresh-submission path instead of the recovery path. Full suite:
    705 passed, 1 pre-existing failure (test_committed_ledger_schema_conformance,
    already tracked as hard needs-human at conductor/t-090, unrelated to this change --
    confirmed unaffected with `git stash`), 1 skipped.

    Reviewer merge 2026-07-28: PR #1346 merged as b23ce46. CI 24/25 green (only the
    known conductor/t-090 schema check red, unrelated). t-036 (the PR's kaizen
    suggestion) is already `ready` in this roadmap, so no new task filed.
