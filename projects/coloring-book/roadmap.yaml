- id: t-049
  milestone: m4
  title: "manage_coloring_book_production.py's generate-bw is unsafe to run concurrently across proposal ids in the same book set"
  status: done
  stakes: reversible
  owner: worker
  passes: 0
  note: >-
    Kaizen from t-022's 2026-09-27 cycle 75. The script loads the whole
    color-art-jobs.yaml once per process invocation into an in-memory dict and writes
    that same in-memory snapshot back to disk at several points during a single
    generate-bw/accept-bw/finalize-pair run. Running two invocations concurrently
    against different proposal ids in the same book (observed: monster-recast mr-002
    and hollywood-recast hwr-002, started a few seconds apart) is unsafe: the slower
    process's later write is based on a snapshot taken before the faster process's
    changes existed, so it silently overwrites the faster process's already-persisted
    bw_status: done (and any accept-bw/finalize-pair fields already applied) back to
    an earlier state, with no error or warning. Reproduced live this cycle -- mr-002's
    finalized state was reverted to bw_status: running by hwr-002's later write, and
    had to be manually recovered by re-running generate-bw (idempotent given an
    existing DONE job id) once the concurrent process had exited. No data was
    permanently lost only because the rendered file and server-side ArtJob/ArtImage
    survived independently of the YAML bookkeeping -- a less careful recovery could
    have re-submitted a duplicate render job instead.
    TO FIX: either (a) add a simple lockfile (e.g. color-art-jobs.yaml.lock) that the
    script acquires for its whole runtime and refuses to proceed if already held, or
    (b) change the write path to re-read-modify-write only the specific book/proposal
    entry being touched rather than the whole loaded snapshot, or (c) at minimum, add
    a prominent docstring/README warning that concurrent invocations against the same
    book must never run in parallel, so a future session doesn't rediscover this by
    losing bookkeeping again. (a) is the smallest, safest fix given how this script is
    actually invoked (short-lived one-shot CLI calls, not a long-running service).
  claimed_by: claude-scheduled-20260927T0851Z-cb-t049
  claimed_at: '2026-09-27T09:01:06Z'
  updated: '2026-09-27T09:32:58Z'

