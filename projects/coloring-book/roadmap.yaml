project: coloring-book
kind: software
goal: >
  A kind_robots coloring book app: color AI-generated pages like any coloring book,
  browse themed sets, and generate new pages with the Kontext network — with the same
  pages feeding print-on-demand physical books through the digital storefront.
waypoints:
  - Open a coloring page and fill sections with your palette.
  - Browse the launch sets — Kind Robots and Spooktacular Monster Drag Party.
  - Generate a page of your own from a prompt or an image.
  - Save and export your colored creations.
  - Find the printed books in the gift shop.
notes_from_silas: >
  New project 2026-07-10, formalizing ideas that started under other names: the
  mural-design WonderLab coloring page is the tech seed, and this relates to
  digital-storefront (and the archived Humboldt Impropriety Society coloring
  book/calendar inspiration — NOT revived; launch sets are the two named below).
  I want a front-end coloring book app of AI-generated coloring pages. Normal
  coloring-book-app uses, PLUS leveraging AI so users can use the kind robots
  kontext and/or a coloring book lora to generate their own pages. Coloring book
  sets and tokens for generator use beyond a free tier will have to be included.
  Art assets generated in the background are authorized — multiple coloring book
  sets and whatever the app/front end needs. This deserves a tab in the art channel.
  First two digital coloring books: "Kind Robots" and "Spooktacular Monster Drag
  Party". Feel free to use kind robots art assets to generate coloring pages.
  Whatever pages we create should be part of the digital storefront project —
  including a print-on-demand service selling physical coloring books.
