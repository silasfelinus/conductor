schema_version: 1
project: coloring-book
purpose: Canonical source-asset and print-layout readiness for the three Coloring Book titles.
requirements:
  interior_slots: 36
  source_orientation: portrait
  source_aspect_ratio: '2:3'
  source_pixel_size: 1024x1536
  print_interior_variant: bw
  archive_color_masters: true
  final_cover_source_required: true
  source_ready_definition: All 36 final color/BW pairs exist and the final front-cover source exists.
  package_ready_definition: Source assets are ready, print layout fields are complete, and exported package files exist.
books:
- order: 1
  slug: monster-recast
  title: Monster Recast
  ledger_path: projects/coloring-book/sets/monster-recast/proposals.yaml
  cover_queue_path: projects/coloring-book/cover-art-jobs.yaml
  package_directory: projects/coloring-book/packages/monster-recast
  layout:
    # Filled 2026-09-11 from Silas's decision: "when it comes time for printing,
    # we'll use amazons print services, same as I did with my novel, no future
    # decisions about that needed." Values are NOT invented here -- they are
    # transcribed from this project's own KDP-verified spec in
    # docs/generation-pipeline.md section 4 (checked against KDP help topics
    # G201834340 / GVBQ3CMEQW3W2VL6), which settled on 8.5x11 no-bleed interiors
    # long before a printer was chosen. Choosing Amazon ratifies that spec.
    trim_width_inches: 8.5
    trim_height_inches: 11.0
    # No-bleed interiors: coloring art running off the page edge is actively
    # worse for the user, and no-bleed avoids the looser trim tolerances and the
    # 8.625x11.25 layout. Art box ~7.5x9.75in centred with >=0.5in margins on a
    # 2550x3300 canvas at 300 DPI.
    bleed_inches: 0.0
    binding: perfect-bound
    paper: white
    interior_color_mode: bw
    cover_color_mode: color
    printer_template: kdp-paperback-8.5x11
    # KDP counts every page in the interior PDF, blanks included, and the count
    # drives spine width on the cover wrap -- so blanks must be present in the
    # file rather than implied.
    page_count_includes_blanks: true
    # KDP does not print on the inside of paperback covers.
    inside_cover_printing: false
    # KDP places the ISBN barcode bottom-right on the back cover; the cover wrap
    # must leave that area clear of art that matters.
    barcode_area_reserved: true
  exports:
    ordered_interior_manifest: projects/coloring-book/packages/monster-recast/interiors.yaml
    interior_pdf: null
    cover_wrap_pdf: null
    source_archive: null
