notes:
- The existing 1024x1536 images are source assets, not a chosen physical trim size.
- Do not crop or scale to a printer template until trim, bleed, binding, paper, and printer are selected.
- The final cover source is portrait front art only; a complete cover-wrap PDF still needs typography, spine, back cover, barcode area, bleed, and template alignment.
