project: marketing-deck
kind: software
notes_from_silas: |
  Build a reusable system that takes a Kind Robots model and produces a selectable
  marketing set. Humboldt Scoop Solutions is the first example and the parent business
  project. The repo/project labeled humboldt-scoop-cms is the customer-management system,
  not the parent marketing subject, though its app design and workflow are inputs.

  Deliverables should be individually selectable: business card, existing-logo usage or
  optional logo concepts, lawn sign, banner, flyer, website mockups, app mockups, photo
  shoot ideas, static ad posters, video commercial pitch and optional Comfy execution,
  and a week-by-week launch schedule including where to join and how much to post.

  Android is the first client target. Keep the architecture compatible with Linux and iOS.
  This is an internal tool for me and my team, so approved AI work may use team-owned LLM
  tokens under my accounts. Keep keys server-side, record generation cost/provenance, and
  never publish, spend, print, contact customers, or launch anything unattended.

