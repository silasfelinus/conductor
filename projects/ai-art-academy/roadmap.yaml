    retry_context: >
      pass 1 failed (quality): PR #1145's `section()` helper in
      scripts/validate_academy_curriculum_candidates.py builds its regex as
      `rf"^##\s+{heading_pattern}\s*$\n(?P<body>.*?)(?=^##\s+|\Z)"` where
      heading_pattern is itself an alternation (e.g. `"Artists? for historical
      study|Artists?|Historical artists?"`). Spliced in unparenthesized, `|`
      has the lowest precedence, so the regex actually compiles as three
      independent top-level alternatives instead of one grouped heading match
      -- the shorter alternatives (e.g. plain `Artists?`) match first and don't
      include the `body` named group, so `match.group("body")` is `None` and
      `.strip()` raises AttributeError. Confirmed locally: 3 of 6 new pytest
      cases fail, including the primary happy-path
      test_complete_sensitive_candidate_passes; both `Python test suite` and
      the PR's own new `Validate changed Academy curriculum candidates` CI
      check are red for this reason (see PR #1145 review comment for the full
      repro and traceback). Do differently: wrap heading_pattern in a
      non-capturing group when splicing it into the outer pattern, e.g.
      `rf"^##\s+(?:{heading_pattern})\s*$\n(?P<body>.*?)(?=^##\s+|\Z)"`, then
      re-run the full local test suite (not just eyeball the regex) before
      re-pushing -- every section() call site with a multi-alternative
      heading_pattern (artist/policy/remix/checklist sections) has the same
      bug.
