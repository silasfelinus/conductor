      `uploadStore.activeTarget` is an app-lifetime Pinia singleton, and
      every current caller of `uploadStore.setTarget()`
      (`art-maker.vue`, `add-bot.vue`, `add-character.vue`,
      `add-reward.vue`, `add-scenario.vue`, `dream-manager.vue`,
      `academy-manager.vue` as of this cycle) sets a target on mount/tab-open
      but none call `uploadStore.clearTarget()` on unmount. Any consumer that
      does NOT defensively re-set its own target on (re-)entry -- unlike the
      fix in this cycle -- can still silently inherit a stale target left by
      whichever of those pages the user visited last in the same session,
      including a stale target's custom `applyImage` callback firing against
      the wrong model. Add `onUnmounted(() => uploadStore.clearTarget())` (or
      equivalent) to each of the listed consumers, closing the pattern at its
      root instead of requiring every future consumer to re-derive the same
      defensive fix independently. Verify no consumer relies on its target
      surviving past its own unmount (e.g. a background upload continuing
      after navigation) before adding the clear -- if one does, scope that
      consumer out with a one-line note explaining why.
