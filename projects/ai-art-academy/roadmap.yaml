  - id: t-011
    milestone: m2
    title: Decide the commercial-licensing posture for FLUX-dev/Kontext LoRAs
    status: done
    approved_by_human: true
    owner: null
    passes: 0
    stakes: reversible
    updated: '2026-07-10T20:00:00Z'
    note: >
      DECIDED by Silas in-session 2026-07-10 (recorded by Reviewer per the
      human-gate clearance rule). Ruling: no paid generation on
      non-commercially-licensed weights, ever. When monetization arrives, use
      only license-clean or officially supported engines. Concretely:
      (1) FLUX.1 schnell (Apache 2.0) is approved for paid TEXT-TO-IMAGE on our
      own servers — Silas asked "can't I use schnell instead?" and the answer is
      yes for t2i. (2) Kontext-style REMIX/EDIT has no schnell equivalent
      (Kontext dev is non-commercial), so paid remixing must route through an
      officially supported endpoint: BFL's Kontext pro/max API, fal/Replicate
      licensed hosting, or OpenAI images (whose terms allow commercial use of
      outputs). (3) Free-tier/educational/internal generation continues
      unchanged on the current stack, including dev-based LoRAs. Economy work
      (coloring-book t-008) should design token pricing around per-image
      licensed-API costs. Dev-based weights and dev-trained LoRAs stay excluded
      from every paid path.

