project: ai-art-academy
kind: software
autonomous: true
goal: >
  Teach people the history of art — movements, styles, and public-domain creators —
  and let them remix a starter image or their own upload in any style they learn
  about, powered by the Kind Robots Kontext network.
notes_from_silas: >
  New project 2026-07-10. Adjacent to sketchy (which teaches drawing): AI Art Academy
  teaches the history of art, art styles, and creators. ONLY publicly available art and
  dead artists — we don't rip off real creators. Users choose a starter image or upload
  their own, then remix in a learned style via our kontext network. The groundwork is
  kind_robots components/art/art-styler.vue — that becomes the new front end for this
  project with a much bigger scope (plain art-styling stays as an option inside the
  Academy). One task must track down publicly available LoRAs that communicate styles;
  if kontext isn't best due to LoRA availability versus model knowledge, agents may
  recommend another engine (see DESIGN-BRIEF.md: recommendation is Kontext-first,
  prompt-mode for famous dead artists, LoRAs where evaluation shows they win).
  This is the TEST RUN of the autonomous project initiative: Claude has full reign over
  this project and art-styler.vue. Art generation via our backend is fully supported and
  pre-approved. Escalate only actual human gates. Keep the project running even without
  my input — when there's nothing to do, do a style pass, upgrade the roadmap, or
  generate more art inspirations (never-idle rule, AGENTS.md).
milestones:
  - id: m1
    title: Design brief, policy, and model strategy
    weight: 15
    status: done
  - id: m2
    title: Style registry and LoRA/knowledge evaluation
    weight: 20
    status: in-progress
  - id: m3
    title: Curriculum content (movements, styles, artists)
    weight: 20
    status: done
  - id: m4
    title: Academy front end in kind_robots (art-styler evolution)
    weight: 30
    status: done
  - id: m5
    title: Project art and inspiration assets
    weight: 5
    status: done
  - id: m6
    title: Continuous improvement loop
    weight: 10
    status: in-progress
