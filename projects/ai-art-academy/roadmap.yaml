      portraits that could source a Harlem Renaissance Academy lesson --
      documented in `docs/curriculum-candidates/harlem-renaissance.md`'s new
      "Research update" section: W.E.B. Du Bois, Roland Hayes, James Weldon
      Johnson, and Countee Cullen, all painted in 1925 by Winold Reiss (d. 1953)
      for Survey Graphic's "Harlem: Mecca of the New Negro" issue and Alain
      Locke's "The New Negro" anthology, all confirmed CC0 on the Smithsonian
      National Portrait Gallery's own object pages.

      What it contains: none of the movement's own artists discussed in the
      candidate (Aaron Douglas, Meta Warrick Fuller, Archibald Motley, Augusta
      Savage) clear PUBLIC-DOMAIN-POLICY.md's 1956 death-date cutoff -- all four
      died 1958 or later -- so none of their own work can ever be a display
      example under current policy. Reiss clears the policy technically (died
      1953, works published 1925), but he was not a Harlem Renaissance artist --
      he was a white, German-American illustrator commissioned to portray the
      movement's Black cultural figures for a magazine audience. The candidate's
      own promotion checklist requires "a Black cultural-history reviewer checks
      the framing" before promotion, which is a judgment call outside what an
      autonomous agent pass should decide unilaterally.

      TO APPROVE: read `docs/curriculum-candidates/harlem-renaissance.md`'s
