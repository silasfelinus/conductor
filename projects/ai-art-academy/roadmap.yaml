      Reiss works as historical-context display images only, with the
      generation-style preset staying artist-anchor-free as already drafted, (b)
      hold the candidate at historical-curriculum-only with no display images
      until a rights-clear work by an actual movement participant is found, or
      (c) something else. Set `status: done` here with a note recording the
      decision once made.

      What unblocks when he does: a future ai-art-academy/t-010 curriculum-depth
      cycle promotes the candidate into `curriculum-outline.md` (or documents
      why it stays historical-only) following whichever path Silas picks.

