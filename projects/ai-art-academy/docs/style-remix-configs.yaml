# Style Remix Configs — AI Art Academy (task t-004)
#
# Records the WINNING remix config per style after A/B'ing prompt-only Kontext
# instruction vs LoRA (where docs/style-lora-registry.md documents a LoRA
# candidate), using kind_robots' live production path: POST /api/art/enqueue
# {engine:"kontext", promptString, sourceImageBase64, loraName?, loraStrength?}
# -> buildKontextWorkflow (server/api/comfy/kontext/utils/workflow.ts), the
# exact code path art-styler.vue's Remix Studio hits (not a hand-rolled
# duplicate graph), so results reflect what a real user would see.
#
# Scope (per t-004's task note): the ORIGINAL 16 target styles from
# style-lora-registry.md's "Coverage summary" (8 LoRA-backed + 8 prompt-mode),
# plus the 2 bonus LoRA-backed styles (Van Gogh, Pop Art) where capacity
# allowed. Newer curriculum movements (northern-renaissance, rococo,
# symbolism, precisionism, etc.) are explicitly out of scope for this pass.
#
# Fixed test image (same source used for every remix job below):
#   subject: "A small friendly robot with round glowing eyes sitting on a
#     wooden windowsill beside a potted green plant, soft warm daylight
#     through the window, simple cozy room background, photographic, medium
#     shot, no text, no watermark"
#   generation: engine=krea2 (Krea 2 Turbo), seed=424242, KR ArtJob 2604,
#     ArtImage 12777. Evidence thumbnail: t-004-remix-evidence/_reference.webp
#   remix seed: 909090 for every kontext job below.
#
# ============================================================================
# REAL FINDING (2026-07-27, this session) -- Kontext LoRA loading is broken in
# production for every naming convention this session could construct, so
# EVERY style below ships mode: prompt for now, including the 4 styles whose
# LoRA files are actually present on the relay.
# ============================================================================
# t-037 (merged 2026-07-26) wired a LoraLoaderModelOnly node into
# buildKontextWorkflow but explicitly flagged it as NOT YET VERIFIED against a
# live render. This session ran that verification and it fails: every kontext
# job with a non-empty loraName 400s at the relay's ComfyUI with
#   {'61': {'errors': [{'type': 'value_not_in_list', 'message': 'Value not in
#     list', 'details': "lora_name: '<value>' not in (list of length 2096)",
#     ...}], 'class_type': 'LoraLoaderModelOnly'}}
# Four independent naming conventions were tried and ALL rejected the same way:
#   1. the registry's own HF repo name, e.g. "UmeAiRT/FLUX.1-dev-LoRA-Impressionism"
#      (ArtJob 2603, pre-existing on the relay before this session -- same error)
#   2. the Resource table's `localPath` under the Kontext/ category, e.g.
#      "Kontext/SFW/impressionist.safetensors" (ArtJob 2609)
#   3. the Resource table's `localPath` under the FLUX/ category -- the EXACT
#      string kind_robots' own production art-styler.vue BUILTIN_STYLES sends
#      today for these same 4 styles, e.g. "FLUX/impressionist.safetensors"
#      (ArtJob 2611, forward slash) and "FLUX\impressionist.safetensors"
#      (backslash, matching the relay's Windows client id "Silas-PC-prompt-...")
#   4. the bare filename with no folder prefix, "impressionist.safetensors"
#      (ArtJob 2620)
# GET /api/resources confirms 47 Kontext-native LoRA files ARE cataloged
# (localPath entries under `Kontext/SFW/`, matching the Owen777-style pack
# already documented for oil-painting/sumi-e/van-gogh/pop-art in
# style-lora-registry.md), so the files plausibly exist somewhere on the
# relay's disk -- but none of the 4 name conventions this session could derive
# from the KR database matches what ComfyUI's local `models/loras` folder scan
# actually returns. This session has no way to read that scan's raw output
# directly (ComfyUI's own /object_info lives on the relay's private
# Tailscale-only network, reachable only from Silas's browser via
# stores/serverStore.ts's fetchComfyObjectInfo, not from this sandbox). This
# means BUILTIN_STYLES' own loraPath values are LIKELY ALSO BROKEN in
# production today, not just this task's registry-derived guesses -- worth an
# urgent, narrowly-scoped follow-up task (see roadmap note) rather than
# guessing a 5th naming convention blind and burning more relay time.
# Every style below is therefore `mode: prompt` for this pass; `loraPath`/
# `loraTrigger`/`loraWeight` fields are still recorded wherever a LoRA
# candidate is documented, so a follow-up A/B can re-run instantly once the
# naming bug is fixed.
