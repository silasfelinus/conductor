  - id: t-012
    milestone: m4
    title: "Auto-supersede the prior WORKING build when Animation Manager promotes a new one"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Kaizen from t-005's review (kind_robots PR #590): stores/animationManagerStore.ts's
      promoteAttempt() sets the chosen build's status to WORKING but does not call
      componentStore's existing linkSupersededAnimationAttempt() against the effect's
      previous WORKING build (if any), so "promote" can leave more than one WORKING attempt
      for the same catalog effect. Wire promoteAttempt() to look up the prior WORKING attempt
      for that slug (componentStore.allComponents filtered via listAnimationAttempts, status
      WORKING, excluding the one being promoted) and call linkSupersededAnimationAttempt on it
      before/after setting the new status, so promoting always leaves exactly one WORKING
      attempt per effect. Verify with a focused addition to
      utils/scripts/verifyAnimationComponentAttempts.ts or a small new store-level test if one
      exists; full vue-tsc + eslint as usual.
