project: animation-manager
kind: software
autonomous: true

goal: >
  A durable creative pipeline that researches surprising passive desktop animations,
  pitches them before implementation, ships the strongest candidates into Kind Robots,
  and improves or retires builds over time using real user Reactions.

notes_from_silas: |
  Create surprising and new opening desktop wallpapers. Every animation must work as a
  passive experience with no interaction required. Optional interactions are encouraged
  when they deepen the surprise without blocking the page: bubbles can be popped, a cursor
  may leave a wake, and clicks may create harmless flourishes while the underlying click
  still works.

  Treat this as an evolving Animation Manager program, not a pile of unrelated effects.
  Research modern screensavers and browser animation techniques, keep a queue of planned
  animation pitches, build new effects, polish old ones, and track multiple attempts over
  time with Kind Robots Reactions so the best versions rise and weak experiments can be
  improved or retired.

  A new animation should be registered once and then automatically appear in Screen FX,
  explicit startup preferences, and the random opening animation pool when eligible.
  Front-load the project with pitches, then ship the first new addition end-to-end.

