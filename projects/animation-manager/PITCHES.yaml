      - system returns to stable balance after perturbation

  - id: tiny-weather-front
    title: Tiny Weather Front
    status: pitched
    priority: 12
    surprise: >
      Miniature localized weather cells cross the screen independently — rain beneath one
      cloud, sunlight through another, a rare pocket tornado carrying leaves.
    passive_loop: Cells form, merge, dissipate, and cast subtle light changes across their own regions.
    optional_interaction: Pointer pressure bends a front; click seeds one short-lived warm updraft.
    technique: Layered particle emitters driven by a shared coarse pressure map.
    reduced_motion: Fewer cells, no tornado, and slower precipitation.
    performance_risk: Multiple emitters can multiply particle count; share pools and cap active cells.
    novelty: Spatially varied weather rather than uniform full-screen rain or snow.
    acceptance:
      - multiple weather types coexist without visual clutter
      - effect remains passive and transparent
