  - id: ant-farm-excavation
    title: Ant Farm Excavation
    status: pitched
    priority: 13
    surprise: >
      A cross-section sand column, like a childhood ant farm, where a small colony of
      tiny robot ants continuously digs new tunnels, abandons old ones to slow collapse,
      and occasionally uncovers a buried trinket half-visible in the sand.
    passive_loop: >
      Ants path along existing tunnels and dig new branches at their tips; unused
      tunnel segments slowly narrow and cave in behind them, so the whole network
      is always mid-reshape rather than settling into a final maze.
    optional_interaction: >
      Pointer acts as a vibration source that redirects nearby ants toward it; click
      drops one grain-pile obstacle that the colony routes around and eventually digs through.
    technique: >
      Grid-based sand cells (dug/undug/filled) with simple ant agents doing biased
      random-walk digging, rendered as a coarse heightfield with a few sand-grain
      sprites for collapse events.
    reduced_motion: Four slow ants, no collapse events, no obstacle drops, static tunnel shading.
    performance_risk: >
      Per-cell simulation cost at high resolution; use a small fixed grid and cap
      simultaneous active tunnels.
    novelty: >
      Agent-driven excavation and tunnel decay reads as a living underground process,
      distinct from magnetic-sand-garden's raked surface patterns and from any
      digging-free effect already shipped.
    acceptance:
      - at least two tunnels are visibly under construction or collapse at any time
      - excavated trinkets appear at most once per minute and do not repeat consecutively

  - id: marble-run-contraption
    title: Marble Run Contraption
    status: pitched
    priority: 14
    surprise: >
      A perpetual Rube Goldberg machine of wooden chutes, tiny bells, seesaws, and
      pinwheels ferries a handful of marbles in an endless loop, each one triggering
      a small cascade of catches, taps, and releases along the way.
    passive_loop: >
      Marbles roll down fixed track segments, tip seesaw catches, spin pinwheels,
      and ring bells on contact, then rise back to the top via a slow bucket-elevator
      so the same handful of marbles recirculates without ever running out.
    optional_interaction: >
      Pointer nudges one lever arm, briefly redirecting the next marble onto an
      alternate branch; click drops one extra marble into the top hopper for a
      few seconds of denser traffic before it settles back to baseline.
    technique: >
      Segment-based track graph (arcs, ramps, seesaws, catch-and-release gates) with
      simple per-marble position-along-track state rather than full rigid-body physics;
      contact events at fixed trigger points drive bell/pinwheel/seesaw animations.
    reduced_motion: One marble on a short two-segment loop, no bell/pinwheel flourishes, slow elevator only.
    performance_risk: >
      Many simultaneous contact-triggered animations can pile up; pool trigger effects
      and cap concurrent marbles in flight.
    novelty: >
      A fixed kinetic-toy circuit driven by track-position state and discrete contact
      events, distinct from clockwork-greenhouse's organic growth timelines, celestial-mobile's
      free-hanging balance physics, and ant-farm-excavation's grid-based digging simulation.
    acceptance:
      - at least one full marble circuit (drop to elevator return) is visible within thirty seconds
      - contact-triggered flourishes (bell/pinwheel/seesaw) never desync from the marble that caused them
      - underlying page clicks remain functional through the click interaction

  - id: strandbeest-migration
    title: Strandbeest Migration
    status: pitched
    priority: 15
    surprise: >
      A herd of wind-powered wire-legged walker sculptures ambles across a dune
      horizon, wind gusts visibly quickening or slowing their gait as they cross
      the screen and loop back for another pass.
    passive_loop: >
      Each walker cycles a fixed multi-bar leg-linkage gait driven by a shared
      crank phase offset per leg pair; a slow ambient wind value (sine plus light
      noise) scales stride length and speed, and walkers drift along a parallax
      dune baseline before wrapping to a fresh silhouette on re-entry.
    optional_interaction: >
      Pointer acts as a local wind gust that visibly speeds up nearby walkers'
      gait and lightly tilts their stride direction; click spawns one new walker
      at the horizon that joins the herd's migration.
    technique: >
      Precomputed multi-bar linkage leg curves (classic Jansen-linkage joint
      coordinates) driven by a shared crank angle per walker, rendered as simple
      stroked struts and joints; walker body position advances along a parallax
      dune baseline rather than a fixed track.
    reduced_motion: Two walkers, slow fixed gait with no wind variance, no gust interaction, no spawning.
    performance_risk: >
      Many simultaneous walkers each recomputing joint linkage per frame; cap
      the herd size and precompute a lookup table of joint positions per
      crank-angle step instead of solving the linkage live every frame.
    novelty: >
      Wind-driven linkage-based leg locomotion across a horizon is distinct from
      marble-run-contraption's fixed track-position circuit, ant-farm-excavation's
      grid-based digging simulation, and celestial-mobile's free-hanging balance
      physics — no existing pitch or shipped effect uses procedural leg-linkage
      walking.
    acceptance:
      - at least three walkers are visible ambling across the screen at any time during normal (non-reduced-motion) play
      - the wind gust interaction visibly changes at least one walker's gait speed within one second of pointer movement
      - a walker that exits one edge re-enters from the opposite edge without a visible teleport pop (fade or off-screen buffer)

  - id: shadow-puppet-theater
    title: Shadow Puppet Theater
    status: pitched
    priority: 16
    surprise: >
      A backlit paper screen where jointed shadow-puppet cutouts (a bird, a boat, a
      lantern-bearer) perform a short wordless vignette that subtly reshuffles its
      blocking and lighting angle each time it loops, so it never plays identically twice.
    passive_loop: >
      A rod-puppet cast cycles through 2-3 short vignettes (a bird released from a cage,
      a boat crossing choppy water, a lantern-bearer climbing a hill) with joint-driven
      walk/flight cycles; the backlight position drifts slowly over the course of a loop,
      subtly changing every puppet's cast-shadow angle and softness.
    optional_interaction: >
      Pointer position casts a soft hand-shadow silhouette that "joins" the scene without
      disrupting the puppets; click advances early to the next vignette in the rotation.
    technique: >
      Cached silhouette Path2D cutouts with per-joint rotation (a handful of rigid bones
      per puppet), rendered against a soft radial backlight gradient that itself animates
      position over the loop.
    reduced_motion: One puppet performing a single slow gesture loop, fixed backlight, no hand-shadow, no vignette switching.
    performance_risk: >
      Multiple jointed puppets with soft shadow-blur gradients per frame; precompute
      silhouette paths once and cap concurrent puppets to the active vignette's cast.
    novelty: >
      Backlit rod-puppetry with joint-driven blocking and a slow-drifting light source is
      distinct from every shipped/pitched entry -- no existing effect uses articulated
      shadow-theater staging or narrative vignette rotation.
    acceptance:
      - at least one full vignette (start pose to resolution pose) completes within twenty seconds
      - backlight drift is visible across a loop without ever fully silhouette-flattening or washing out a puppet
      - hand-shadow interaction never blocks or offsets the actual page pointer
