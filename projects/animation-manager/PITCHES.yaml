      shadow-theater staging or narrative vignette rotation.
    acceptance:
      - at least one full vignette (start pose to resolution pose) completes within twenty seconds
      - backlight drift is visible across a loop without ever fully silhouette-flattening or washing out a puppet
      - hand-shadow interaction never blocks or offsets the actual page pointer

  - id: kintsugi-weather
    title: Kintsugi Weather
    status: pitched
    priority: 17
    surprise: >
      Hairline fractures quietly travel through a transparent porcelain-like surface, then
      repair themselves with warm gold seams before fading back into an unbroken glaze.
    passive_loop: >
      Small stress lines nucleate at sparse edge points, branch across a bounded local region,
      pause, and then heal from root to tip as luminous seams chase the crack geometry. Healed
      seams cool and dissolve before the next fracture begins elsewhere, creating a slow cycle
      of breakage, repair, and renewal without covering the whole desktop.
    optional_interaction: >
      Pointer warmth accelerates healing near the cursor. A click introduces one short-lived
      hairline crack at that location while allowing the underlying page click to continue.
    technique: >
      Canvas 2D or SVG path graph with deterministic branching segments, cached crack
      geometry, animated stroke-dash offsets for the repair pass, and soft additive gold
      gradients.
    reduced_motion: >
      One static repaired seam with a very slow gold-temperature shift; no new cracks,
      branching, pointer acceleration, or click-created fractures.
    performance_risk: >
      Unbounded recursive branching and blur-heavy gold strokes could increase draw cost. Cap
      graph depth and active crack count, cache path geometry, and use a small fixed blur
      radius.
    novelty: >
      The core loop is visible damage followed by kintsugi-style repair. It is distinct from
      stained-glass-rain's persistent polygon panes, ink-oracle's fluid diffusion, and
      magnetic-sand-garden's granular rearrangement; none of the existing pitches uses a
      fracture-and-heal lifecycle or repair as the visual payoff.
    acceptance:
      - a complete crack-to-gold-repair-to-clear cycle finishes within thirty seconds
      - no more than two crack systems are active simultaneously
      - gold seams remain readable on light and dark themes without obscuring page content
      - reduced-motion mode creates no new fractures
      - pointer and click interactions never block underlying page input

  - id: tapestry-loom
    title: Tapestry Loom
    status: pitched
    priority: 18
    surprise: >
      A hand loom's shuttle glides steadily back and forth across taut warp threads, and with
      every pass a fresh row of colored weft thread appears, slowly building a woven motif.
      Once the tapestry completes, it unravels from the top down -- threads visibly retracting
      and coiling onto a small bobbin -- leaving bare warp for the loom to begin weaving an
      entirely new pattern in a different palette.
    passive_loop: >
      Fixed vertical warp threads form the background. A shuttle icon interpolates left-right
      along the current row, depositing a weft segment that alternates over/under adjacent
      warp threads to fake woven texture. Every few passes advances a deterministic pattern
      state machine (stripes, then chevron, then diamond) rather than random color choice.
      Once the full row count for the current motif is reached, the tapestry holds briefly,
      then unravels top-down row by row with an eased retraction toward a bobbin icon,
      returning to bare warp before the next motif and palette begin.
    optional_interaction: >
      Hovering the pointer near the loom slows the shuttle, as though the visitor is watching
      closely, and highlights the full run of whichever row's thread sits under the cursor
      across the tapestry. A click plucks the nearest weft thread, sending a brief visual
      twang ripple across its row without triggering unraveling or blocking the underlying
      page click.
    technique: >
      Canvas 2D. Warp is a static set of vertical line segments computed once per resize. Weft
      rows are horizontal path segments with a per-column vertical offset alternated by parity
      to simulate over/under weave, drawn into a single offscreen buffer that grows by one row
      per pass rather than redrawing history every frame. The shuttle is one small sprite
      eased along x per row. Unraveling reverses the row list with a short retraction tween
      per row instead of an instant clear.
    reduced_motion: >
      A single static completed tapestry in one motif and palette, no shuttle motion, no
      unraveling, and no pointer slow-down or highlight response -- only a very slow color-
      temperature drift across the existing threads.
    performance_risk: >
      Warp/weft counts scale with viewport width and could grow unbounded on wide displays.
      Cap warp column count and rows-per-motif to fixed maximums regardless of viewport size,
      and draw into a single reusable offscreen buffer rather than allocating a new canvas
      layer per row.
    novelty: >
      The core loop is additive weaving followed by a full unravel-and-rebuild in a new
      pattern, driven by a deterministic motif state machine rather than physics or growth.
      This is distinct from clockwork-greenhouse's organic growth state machine (no weaving,
      no thread), marble-run-contraption's fixed physical track (no fabric, no accumulation-
      then-reset lifecycle), and kintsugi-weather's fracture-and-heal cycle (repair of
      existing damage, not progressive construction and full unraveling of a pattern). No
      existing pitch uses a textile/loom motif or an additive-then-fully-reset weave cycle.
    acceptance:
      - a complete weave-to-unravel-to-new-motif cycle finishes within forty-five seconds
      - row count and motif progression are state-driven and deterministic, not randomized per frame
      - reduced-motion mode shows one static completed tapestry with no shuttle or unraveling motion
      - pointer hover slow-down, row highlight, and click-pluck ripple never block underlying page input
      - thread palette remains readable on both light and dark themes

  - id: hourglass-cascade
    title: Hourglass Cascade
    status: pitched
    priority: 19
    surprise: >
      A glass hourglass sits center-stage, individual grains streaming from the top bulb
      through the neck and piling into a growing cone in the bottom bulb, each grain settling
      with a small believable bounce and occasional micro-avalanche as the pile steepens past
      its angle of repose. Once the top bulb empties, the whole hourglass slowly rotates a
      half-turn, and the cycle restarts with grains falling the other way -- the piled cone
      now becoming the source.
    passive_loop: >
      A fixed glass silhouette (two bulbs joined by a neck) never moves except during the
      flip. Grains are lightweight point/short-line sprites spawned at the neck at a steady
      low rate, falling under simple gravity with a narrow horizontal jitter, and settling
      into a height map for the receiving bulb's pile rather than being simulated as full
      rigid bodies. Whenever a column's height map exceeds its neighbors' by more than the
      angle-of-repose threshold, a small run of grains slides sideways to level it, producing
      an occasional visible slump instead of a perfectly smooth cone. When the source bulb's
      grain count reaches zero, the hourglass eases through a half-rotation flip and the two
      bulbs' roles swap.
    optional_interaction: >
      Hovering the pointer over the neck narrows the stream slightly, as though a visitor
      pinched the flow, and widens again on pointer-out -- a small acknowledgment with no
      lasting state change. A click on the glass triggers an early flip (with the same eased
      half-rotation), but only once per completed pour to avoid turning the piece into a toy
      that fights its own passive cadence.
    technique: >
      Canvas 2D. The glass silhouette is a static clipped path computed once per resize. Each
      bulb's settled pile is stored as a 1D height-map array (one value per horizontal bin,
      not per-grain history) redrawn as a filled polygon each frame, so pile rendering cost
      stays flat regardless of how many grains have fallen. In-flight grains are a small
      bounded pool (falling only until they hit the height map, then removed and folded into
      it) rather than an ever-growing particle list. The flip is a CSS/canvas-transform
      rotation on the whole hourglass group, swapping which height-map array is "receiving"
      once the animation settles.
    reduced_motion: >
      A single static hourglass frozen mid-pour (one bulb roughly two-thirds full, the other
      filling), no grain motion, no avalanches, and no flip -- only a very slow, subtle glass-
      tint drift to confirm the piece is still alive rather than a dead screenshot.
    performance_risk: >
      An unbounded in-flight grain pool or per-grain history (rather than a folded height map)
      would grow memory and per-frame draw cost over a long-running session. Bound the in-
      flight pool to a small fixed maximum and always fold settled grains into the height-map
      array immediately, so steady-state cost depends only on the fixed bin count, never on
      total elapsed grains poured.
    novelty: >
      The core loop is bounded gravity-fed accumulation into a self-leveling pile followed by
      a full role-swap flip, distinct from every existing pitch: magnetic-sand-garden
      continuously combs a static sand bed with a flow field and never accumulates or empties
      it; ant-farm- excavation is agent-driven tunnel digging through a fixed sand column, not
      falling grains piling under gravity; marble-run-contraption moves discrete objects along
      a fixed physical track with no accumulation or pile state; tapestry-loom is additive-
      then-fully-unraveled construction of a woven pattern, not gravity accumulation with a
      flip-triggered role swap. No existing pitch uses falling-grain accumulation, angle-of-
      repose pile leveling, or a physical flip-to-reverse mechanic.
    acceptance:
      - a complete top-to-bottom pour and half-turn flip cycle finishes within ninety seconds
      - pile leveling only triggers visible slumps past a fixed angle-of-repose threshold, never a fully smooth cone every frame
      - reduced-motion mode shows one static mid-pour hourglass with no grain motion, avalanches, or flip
      - pointer hover-narrow and click-triggered early flip never block underlying page input, and click-flip is rate-limited to once per completed pour
      - in-flight grain count and height-map bin count stay fixed regardless of viewport size or elapsed session time

  - id: geode-bloom
    title: Geode Bloom
    status: pitched
    priority: 20
    surprise: >
      A dark hollow geode cross-section fills the desktop; faceted crystal clusters nucleate
      in the cavity, grow outward along fixed lattice directions until they catch the light,
      then slowly recede facet-by-facet to free room for the next formation elsewhere.
    passive_loop: >
      Two to four clusters are mid-formation at any time. Each nucleates from a seed point,
      accretes new hexagonal facets one at a time along fixed lattice directions until it
      reaches a capped size, holds briefly at full bloom, then recedes facet-by-facet in
      reverse order before a fresh cluster nucleates elsewhere in the cavity.
    optional_interaction: >
      Pointer proximity acts as a faint light source, brightening the glint on nearby facets
      without altering growth. A click plants a new nucleation seed near the cursor when the
      concurrent-cluster cap allows it; the underlying page click still fires.
    technique: >
      Canvas 2D. Facet geometry is precomputed per cluster from a seeded hexagonal lattice
      (deterministic PRNG per nucleation), cached as Path2D per facet. Growth and recession
      advance on frame-timestamp deltas, not frame count, one facet transition at a time
      rather than continuous geometry rebuilds.
    reduced_motion: >
      Freeze at a static, fully bloomed geode arrangement with nucleation, growth, and
      recession cycling disabled; keep only a slow ambient facet-glint shimmer. Pointer light-
      follow and click-to-seed are both disabled.
    performance_risk: >
      Unbounded facet count from continuous nucleation. Cap concurrent clusters at 4 and
      facets per cluster at 12, cache each facet's Path2D once at nucleation instead of
      rebuilding geometry per frame, and cap device-pixel ratio.
    novelty: >
      No existing pitch uses lattice-constrained faceted mineral growth. Distinct from
      kintsugi-weather (fractures that repair with gold seams -- this pitch never fractures,
      only grows and recedes additively), impossible-terrarium (disagreeing gravity-pocket
      rooms, not crystal accretion), and clockwork-greenhouse (organic mechanical-plant phase
      state machine, not hexagonal lattice geometry).
    acceptance:
      - passive loop is complete without interaction
      - underlying clicks remain functional
      - startup and clipped Screen FX surfaces both render
      - no resource leaks across repeated mounts
      - concurrent cluster cap and per-cluster facet cap hold under continuous nucleation

  - id: candlelit-reliquary
    title: Candlelit Reliquary
    status: pitched
    priority: 21
    surprise: >
      A row of slender tapers burns on a stone ledge, each flame guttering slightly in an
      unseen draft. Melted wax beads at the rim and drips down the candle body in slow,
      irregular runs, pooling on the ledge below into a growing, lumpy accretion. Once a taper
      burns down to a stub its flame gutters out and a fresh full-height taper silently rises
      in its place, while the wax pool beneath it slowly softens and subsides back toward a
      thin sheet over many cycles, keeping the ledge from ever fully clogging.
    passive_loop: >
      Three to five candles burn independently on staggered timers. Each candle's flame is a
      small billboard sprite with wick-anchored flicker (procedural noise, not physically
      simulated combustion). Wax runs are seeded at the rim at a slow, irregular rate and
      follow a fixed vertical path down the candle's silhouette with slight per-run horizontal
      drift, each run finishing by depositing into a 1D height-map array for that candle's
      ledge segment -- the same "accumulate into a height map, don't keep every particle"
      approach as the existing grain/pile pattern, but the deposit softens and decays the
      height map slightly on every frame rather than only leveling past a repose threshold, so
      the pool visibly grows on drip events and visibly (slowly) relaxes between them. When a
      candle's remaining- height timer reaches zero, the flame gutters (a brief non-looping
      snuff animation), the stub fades, and a fresh full taper eases up from the base over
      about two seconds before the flame relights.
    optional_interaction: >
      Pointer proximity to a flame bends it gently away, as if from displaced air, springing
      back once the pointer moves off -- no lasting state change. A click on a candle forces
      an immediate wax run from that candle's current rim position (rate- limited to one
      forced run per candle per relight cycle), letting a visitor nudge the pooling forward
      without being able to spam it into an oversized accretion.
    technique: >
      Canvas 2D. Candle bodies are static tapered-rectangle paths redrawn only on
      height/relight changes, not every frame. Flames are billboard sprites driven by a small
      flicker noise function. Wax runs are short-lived falling primitives (a bounded pool,
      same discipline as existing grain/leaf systems elsewhere in the catalog) that terminate
      by writing into a per-candle height-map array, which is what actually gets rendered as
      the pool -- so render cost stays flat regardless of how many runs have occurred. The
      relight taper-rise is a simple eased height interpolation on the candle body, not a
      particle effect.
    reduced_motion: >
      A single static frame of all candles mid-burn at varied heights with modest wax pools
      already in place, flames rendered as a fixed glow shape with no flicker, no drips, and
      no relight cycle -- only a very slow, subtle flame-glow brightness drift to confirm the
      piece is alive.
    performance_risk: >
      Unbounded wax-run particle count under a long uptime. Cap concurrent in-flight runs
      across all candles (shared small pool, same bound as the hourglass-cascade grain pool),
      store pooled wax purely as per-candle height-map arrays rather than per-drip geometry
      history, and cap flame flicker and wax-run spawn rate independent of viewport size or
      elapsed session time.
    novelty: >
      The core loop is continuous viscous-drip accumulation into a softening, self- decaying
      pool paired with a stub-to-fresh-taper relight cycle, distinct from every existing
      pitch. Hourglass-cascade accumulates discrete dry grains into a pile that only levels
      past an angle-of-repose threshold and never softens or decays between events; geode-
      bloom grows faceted crystal lattice geometry outward and recedes facet-by-facet, not a
      viscous pool that slumps continuously; kintsugi-weather repairs existing fractures
      rather than depositing new material; tapestry-loom additively constructs then fully
      unravels a woven pattern, with no pooling or decay dynamic at all. No existing pitch
      uses continuous soft-material drip accumulation with passive decay, or a burn-
      down/relight replacement cycle.
    acceptance:
      - each candle's flame flickers continuously without requiring interaction
      - a full burn-down-to-relight cycle per candle completes within the design's target duration and never leaves a candle stuck at zero height
      - wax pool height visibly grows on drip events and visibly relaxes between them, never resetting instantly and never growing without bound
      - pointer flame-bend and click-triggered forced drip never block underlying page input, and the forced-drip click is rate-limited to once per candle relight cycle
      - concurrent wax-run pool size and per-candle height-map bin count stay fixed regardless of viewport size or elapsed session time
