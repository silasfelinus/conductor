id: moire-weave-engine
title: Moiré Weave Engine
status: pitched
priority: 0
surprise: >
  Two nearly ordinary translucent line screens overlap across the desktop, but their tiny
  difference in spacing and angle produces enormous dark-and-light interference bands that
  appear to swell, bend, split, and travel through the surface. The visible shapes are not
  drawn directly at all: they emerge from the beat pattern between the two fine gratings, so
  a barely perceptible rotation can make a room-sized wave seem to pass through the page.
passive_loop: >
  Pre-render two bounded line-grating textures with slightly different spatial frequencies.
  One remains almost fixed while the other drifts through a long, slow phase orbit combining
  a few degrees of rotation, sub-line-width translation, and a tiny breathing scale offset.
  Those relative transforms continuously reorganize the emergent moire bands into broad
  waves, knots, and expanding cells. After several minutes the phase orbit closes without a
  visible reset, then begins again with a new deterministic grating-angle pair chosen from a
  small fixed palette so the next cycle has a different interference topology.
optional_interaction: >
  Pointer movement gently biases the moving grating's phase toward the pointer, making the
  nearest interference bands bow around it while the autonomous phase orbit continues. A
  click advances to the next fixed grating-angle pair through a short crossfade, rate-limited
  so repeated clicks cannot thrash texture creation; pointer and click listeners remain
  passive and never prevent the underlying page action.
technique: >
  Canvas 2D or CSS-composited offscreen canvases. Build each fine grating once into a capped-
  DPR offscreen texture, then draw the two textures each frame using only affine transforms
  and alpha/composite operations. Motion is timestamp-driven and surface-sized through a
  ResizeObserver. No per-line objects, particle simulation, growing history, or per-frame
  texture regeneration is required; a phase cycle changes only the transform matrix until a
  bounded palette swap occurs.
reduced_motion: >
  Freeze rotation and translation on one calm interference composition, keep the two screens
  at lower contrast, and allow only an extremely slow opacity breathing cycle. Pointer phase
  bending and click-triggered palette changes are disabled while reduced motion is active.
performance_risk: >
  Very fine gratings can alias, shimmer, or become expensive at high device-pixel ratios.
  Cap DPR and grating resolution independently of viewport density, choose line periods above
  the empirically stable minimum, pre-render both textures only on resize or palette change,
  and clamp transform deltas so no high-frequency temporal flicker appears. Keep exactly two
  active textures plus one temporary crossfade texture, regardless of uptime.
novelty: >
  The core visual signal is spatial-frequency beating between two superimposed periodic
  fields: the large moving shapes are emergent interference bands, not simulated entities or
  explicitly drawn geometry. Kaleidoscope Bloom multiplies one simulated wedge through
  rotational and reflective symmetry, so every visible copy is a deliberate transform of the
  same motif rather than a frequency-beat artifact. Soap Film Membrane maps a continuously
  simulated thickness field into thin-film color, with no overlaid gratings. Harmonograph
  Sand Table traces one explicit damped parametric curve, and Stained Glass Rain uses discrete
  refractive fragments. No existing pitch uses moire interference, near-frequency grating
  superposition, or phase-only affine motion as the passive loop itself.
acceptance:
  - broad interference bands visibly travel, split, and reform for at least five minutes without requiring interaction or exposing a hard reset
  - the effect's large shapes are produced by superimposed grating interference rather than explicit band geometry or a particle simulation
  - pointer phase bending and click-triggered palette changes remain optional, rate-limited, and never block underlying page input
  - reduced-motion mode removes grating translation and rotation and avoids temporal shimmer while retaining a coherent static composition
  - active texture count, grating resolution, and per-frame work remain bounded regardless of viewport size or elapsed session time
