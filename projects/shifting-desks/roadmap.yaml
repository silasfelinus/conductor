      **Project:** `/play/shifting-desks` in Kind Robots. **Status:** ACTIVE BUILD / QUALITY, **not** awaiting human approval. **Priority:** finish outstanding art and the first-clear reward loop, then iterate on game quality until independently tested and polished. This is the durable, single **completion-tracking issue** for Shifting Desks; keep it current instead of opening competing full-roadmap issues.

