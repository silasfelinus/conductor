# Shifting Desks: darkly comic image-card office-dystopia adventure (Silas, 2026-10-12 PT).
# Modeled on zuzu-shifting-lands (card board, authored location pools, flip, seeded draw)
# and zuzu-gamebook (authored depth, character sheet, endings), in an original non-Zuzu world.
# Creative deliverables: DESIGN-BRIEF.md (engine, rules, guardrails), PITCHES.md (directions
# for Silas), encounters/ (schema, validator, ORIENTATION-12.json first department pack).
# Runtime: silasfelinus/kind_robots, public front page /play/shifting-desks (Silas, 2026-10-12 PT).
project: shifting-desks
kind: software
autonomous: true
goal: >-
  A darkly comic, illustrated card adventure at /play/shifting-desks. The player
  navigates a paranoid, ever-reorganizing office hellscape across five departments
  of three locations each (pools of fully authored illustrated encounter cards) plus
  a boss review per department. Every choice costs something (the no-clean-wins
  contract) across Composure, Clearance, Suspicion, Successors and Forms, with
  secret-society and mutation cards, deathtraps, psych tests, giant cockroaches,
  nuclear-capable toys, callbacks to classic works and at least ten distinct
  endings. Deterministic, seeded and saveable, with no LLM at play time. Ready for human playtests only after balance simulation, accessible
  phone/tablet/desktop review, delivered artwork and verified playable flows.
  Silas's subjective fun verdict and any broader promotion follow afterward.
notes_from_silas: |
  2026-10-12 PT: "I have a new conductor project. It should be modeled after the Zuzu
  shifting lands and Zuzu gamebook, ideally picking the best ideas from each. My
  inspiration is bureaucracy games like the paranoia rpg (especially Paranoia, my first
  ever rpg, it holds such a dear space in my heart), the text adventures Bureaucracy and
  Hitchhikers Guide to the Galaxy, and movies like Brazil, Office Space, games like papers
  please, fallout (especially the vault tests), portal, and other dystopian office
  adventures.

  This will be a darkly comic image card based experiential game system, where the user
  must navigate a complicated paranoid office hellscape.

  And...that's where my pitch starts, but I want some more pitches on where to go from
  there. In any case, I expect the output layout to use the shifting sands format, the
  user will be given a series of morally questionable choices with no right answer,
  forced to impossibly difficult sacrifices, and unexpected moments of comedy. Giant
  cockroaches, deathtraps, weird psychological tests, nuclear bomb capable children's
  toys, mutant powers, secret organizations, and callbacks to classic works optional but
  appreciated"

  2026-10-12 PT, answering t-002's choices: spine = "Combination of synthesis with vault
  test facility. I liked them best"; party mode = "Not at all"; emphasis = "Secret
  societies & traitors, Paperwork & psych tests". Title: "Weirdly. I confirmed shifting
  desks but it didn't get confirmed." The title is Shifting Desks (confirmed).

  2026-10-12 PT: "Give us a real, front end, non admin front page, since I expect we will
  get to front end user facing before anyone else looks at my site (I'm currently the
  only user)". This overrides the admin-preview-first default for this project: the
  playable game lives at public /play/shifting-desks with a Projects tab, and grows there. Applied in DESIGN-BRIEF.md "Decided world" and PITCHES.md
  "Decision".

  2026-10-20 PT: "And since this is our dark comedy bureaucracy adventure novel game, we
  should make sure we're properly setting tone. So far so good. In later levels, things
  might get more cronenbergian. I loved the giant cockroach appearance in the first act.
  Great tone." Applied as the per-floor tone ladder in ART-DIRECTION.md and DESIGN-BRIEF.md
  "Tone guardrails" (t-033).

  2026-10-12 PT: "priority: front end interaction. not in admin, in play. that means it
  needs to be up to standard for a five minute, multi stage expeirence demo." And: "all
  stations need an image. to be clear. we are making a demo, so i;s cool, but final result
  needs an image, and text is easy, so we should always have the prompt". Every station
  (card, review, location, department arrival, job title, society, mutation) carries an
  image prompt from the moment it is authored; validate_pack.py enforces it.

  2026-10-23 PT (first human full clear): The game ends with a text-heavy
  Employee of the Month dossier and four Exceptional test scores. Owner demands
  visual celebration for EVERY completed run: unique ending hero images, earned
  achievement/milestone cards, a first-clear Personnel Archive, visually
  differentiated locked/unlocked/progress states, ending gallery, persistent
  run-history souvenirs, useful print cards and entertaining mixed test results.
  Prioritize a playable reward/gallery first slice NOW alongside art delivery;
  the pending r13-r15 art review remains open. Scores must stay truthful, with
  humorous institutional evaluations and counterbalancing commentary instead
  of inventing mechanical stat penalties. No auto-promotion or deployment.

  Agent mandate (AGENTS.md defaults for new projects): scope gate t-002 is SOFT and runs
  in parallel; build immediately. Internal generated art is pre-approved. Public /play,
  publishing, spend, secrets and production deploys are NOT pre-approved. Homage, never
  copied IP (DESIGN-BRIEF "IP guardrails"). PG-13 darkly comic register (DESIGN-BRIEF
  "Tone guardrails").
