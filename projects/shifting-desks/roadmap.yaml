# Shifting Desks: darkly comic image-card office-dystopia adventure (Silas, 2026-10-12 PT).
# Modeled on zuzu-shifting-lands (card board, authored location pools, flip, seeded draw)
# and zuzu-gamebook (authored depth, character sheet, endings), in an original non-Zuzu world.
# Creative deliverables: DESIGN-BRIEF.md (engine, rules, guardrails), PITCHES.md (directions
# for Silas), encounters/ (schema, validator, ORIENTATION-12.json first department pack).
# Runtime: silasfelinus/kind_robots, admin preview /admin/shifting-desks first.
project: shifting-desks
kind: software
autonomous: true
goal: >-
  A darkly comic, illustrated card adventure at /play/shifting-desks. The player
  navigates a paranoid, ever-reorganizing office hellscape across five departments
  of three locations each (pools of fully authored illustrated encounter cards) plus
  a boss review per department. Every choice costs something (the no-clean-wins
  contract) across Composure, Clearance, Suspicion, Successors and Forms, with
  secret-society and mutation cards, deathtraps, psych tests, giant cockroaches,
  nuclear-capable toys, callbacks to classic works and at least ten distinct
  endings. Deterministic, seeded and saveable, with no LLM at play time. Finished only
  after balance simulation, accessible phone/tablet/desktop review and Silas's
  verdict that it is genuinely funny and fun.
notes_from_silas: |
  2026-10-12 PT: "I have a new conductor project. It should be modeled after the Zuzu
  shifting lands and Zuzu gamebook, ideally picking the best ideas from each. My
  inspiration is bureaucracy games like the paranoia rpg (especially Paranoia, my first
  ever rpg, it holds such a dear space in my heart), the text adventures Bureaucracy and
  Hitchhikers Guide to the Galaxy, and movies like Brazil, Office Space, games like papers
  please, fallout (especially the vault tests), portal, and other dystopian office
  adventures.

  This will be a darkly comic image card based experiential game system, where the user
  must navigate a complicated paranoid office hellscape.

  And...that's where my pitch starts, but I want some more pitches on where to go from
  there. In any case, I expect the output layout to use the shifting sands format, the
  user will be given a series of morally questionable choices with no right answer,
  forced to impossibly difficult sacrifices, and unexpected moments of comedy. Giant
  cockroaches, deathtraps, weird psychological tests, nuclear bomb capable children's
  toys, mutant powers, secret organizations, and callbacks to classic works optional but
  appreciated"

  2026-10-12 PT, answering t-002's choices: spine = "Combination of synthesis with vault
  test facility. I liked them best"; party mode = "Not at all"; emphasis = "Secret
  societies & traitors, Paperwork & psych tests". Title left unanswered, so the working
  title "Shifting Desks" stands. Applied in DESIGN-BRIEF.md "Decided world" and PITCHES.md
  "Decision".

  Agent mandate (AGENTS.md defaults for new projects): scope gate t-002 is SOFT and runs
  in parallel; build immediately. Internal generated art is pre-approved. Public /play,
  publishing, spend, secrets and production deploys are NOT pre-approved. Homage, never
  copied IP (DESIGN-BRIEF "IP guardrails"). PG-13 darkly comic register (DESIGN-BRIEF
  "Tone guardrails").
