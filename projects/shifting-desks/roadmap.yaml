      # Shifting Desks: roadmap to completion

      **Project:** `/play/shifting-desks` in Kind Robots. **Status:** ACTIVE BUILD / QUALITY, **not** awaiting human approval. **Priority:** finish outstanding art and the first-clear reward loop, then iterate on game quality until independently tested and polished. This is the durable, single **completion-tracking issue** for Shifting Desks; keep it current instead of opening competing full-roadmap issues.

      **Authoritative working sources:** [Conductor roadmap](https://github.com/silasfelinus/conductor/blob/main/projects/shifting-desks/roadmap.yaml), [design brief](https://github.com/silasfelinus/conductor/blob/main/projects/shifting-desks/DESIGN-BRIEF.md), [art direction](https://github.com/silasfelinus/conductor/blob/main/projects/shifting-desks/ART-DIRECTION.md), [project steering](https://github.com/silasfelinus/conductor/blob/main/CONTROL.md), [runtime route](https://github.com/silasfelinus/kind_robots/blob/main/pages/play/shifting-desks.vue), [game engine](https://github.com/silasfelinus/kind_robots/blob/main/utils/shiftingDesks/rules.ts). Conductor's detailed task statuses take precedence over any stale checklist in this issue. When an agent is assigned Shifting Desks, read this issue and only the linked source sections relevant to their task; post major shared changes, verified evidence and links to merged PRs here. Do not flood agent prompts with the whole design bible.

      ## Non-negotiable finish line

      A **complete, genuinely fun, illustrated, console-quality one-screen game**, not a web-form demo. Player can replay five deeply distinctive departments (3 locations each, presently 24 authored cards/department), make difficult no-clean-win decisions, discover every authored ending (currently **11**), acquire mutations/society entanglements, earn real persistent visual rewards, and keep a satisfying collectible personnel archive. Every art-facing beat should use coherent, reviewed images rather than permanent blank or generic placeholders. The last release candidate must survive adversarial simulations, browser playthroughs, accessibility/device testing, hostile save/data tests, and editorial/mocked player reviews. No outstanding actionable art, text, design, balance, or UI polish work may remain before the **Human Gate** transition.

      A green PR is not proof of an Alexandria deployment or of a good player experience. Verify source, published image, actual self-hosted deployment (when authorized), and real-device/browser acceptance separately. Human approval controls final design signoff and wider promotion; do not bypass existing [Conductor t-020](https://github.com/silasfelinus/conductor/blob/main/projects/shifting-desks/roadmap.yaml) or other actual human gates.

