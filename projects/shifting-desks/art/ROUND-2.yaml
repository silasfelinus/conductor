# Shifting Desks art round 2 (shifting-desks t-015, widened to both shipped departments): every card
# face in Orientation and Records that round 1 did not already queue -- 9 Orientation encounters, all 12
# Records encounters, and the two department boss cards (23 subjects). Style rules live in
# ../ART-DIRECTION.md; each prompt is the card's art.brief from encounters/<PACK>-12.json rewritten into
# the house prompt order (subject, setting, second-look detail, lead colors, house style tail).
#
# Queue: each subject is one row in projects/art-prompts.yaml `requests:` (id = request_id, lane
# art-round-2). The auto-art-generate workflow submits it to Kind Robots as a krea2 ArtJob and the home
# relay writes the render to the self-hosted media host at media_url. Copy the request row's
# `last_art_job_id` here as art_job_id, and the ArtImage id as art_image_id, once the job finishes.
#
# Status values: requested -> rendered (ArtJob done, ArtImage id known) -> delivered (media_url answers
# 200 to `curl -s -o /dev/null -w '%{http_code}'`). Never mark a subject delivered before that check
# passes; only then set the card's art.art_ref in the encounter pack. `verdict` is keep / reroll / reject
# with a reason, after review against ART-DIRECTION.md.
#
# Generated internal art is pre-approved (AGENTS.md "Generated art is pre-approved"). Krea 2 on the
# self-hosted render box: no paid third-party spend, nothing published.
