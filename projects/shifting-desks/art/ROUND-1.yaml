# Shifting Desks art round 1 (shifting-desks t-005): the two card backs and three Orientation style-test
# faces that set the look for every later card. Style rules live in ../ART-DIRECTION.md.
#
# Queue: each subject is one row in projects/art-prompts.yaml `requests:` (id = request_id). The
# auto-art-generate workflow (every 6h) submits it to Kind Robots as a krea2 ArtJob and the home relay
# writes the render straight to the self-hosted media host at media_url. The consumer records the job
# number on the request row as `last_art_job_id`; copy it here as art_job_id, and the ArtImage id as
# art_image_id, once the job finishes.
#
# Status values: requested (row queued, nothing rendered yet) -> rendered (ArtJob done, ArtImage id known)
# -> delivered (media_url answers 200 to `curl -s -o /dev/null -w '%{http_code}'`). Never mark a subject
# delivered before that check passes. `verdict` is keep / reroll / reject with a reason, after review
# against ART-DIRECTION.md (palette, halftone, single readable scene, no lettering, original designs).
#
# Generated internal art is pre-approved (AGENTS.md "Generated art is pre-approved"). Krea 2 on the
# self-hosted render box: no paid third-party spend, nothing published.
