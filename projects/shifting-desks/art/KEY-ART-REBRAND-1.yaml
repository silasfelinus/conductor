# complicated game, and deserves both a highlight image and front end that doesn't look sterile ... New art should
# be submitted"). Three wide compositions, two seeds each, for the front door, the share card and the adverts.
# Name-agnostic (the title is pending), text-free, positive-only prompts per ART-DIRECTION.md. The tone ladder
# is the point: sunny campus on top, the building quietly becoming a body at the bottom. Generated art is
# pre-approved (AGENTS.md). auto_submit.
