# New tactical playbook project; first campaign: Prom of Doom: Crossfire.
project: every-villain-tactics
kind: software
autonomous: true
goal: >-
  Build an AAA-console-feeling browser tactical squad game with visible move previews,
  correct line of sight and hit odds, cover, abilities, animated illustrated cards
  and tactical AI. First campaign has six authored Comet City missions, each with
  opening, triggered and closing conversation trees. Reuse all 48 permanent
  Prom of Doom identities and artwork; write four distinct role perspectives
  per hero and a bespoke fixed-cast six-mission personal path for each. Ship a
  shareable save/load level and cinematic editor, adversarial tests, verified art,
  and separate human design and public publishing gates.
notes_from_silas: |
  2026-10-28 PT: A tactical squad movement shooter with XCOM 2, Advance Wars
  and Divinity 2 inspiration but an immersive browser console feel. Unit cards
  flip, strike, react to damage or die. Before a move show new position LOS and
  attack success percentage. Six levels increase in complexity and carry
  mid-fight events plus bespoke openings and finales. Editor creates and shares
  maps and opening/triggered/closing cinematic conversation trees.
  Each of Prom of Doom's 48 identities has written hero, villain, henchman and
  sidekick storylines. Each also has an exclusive preset squad/cast path with
  unique six-stage dialogue. Everyone is a villain in someone else's story.
  Existing Prom of Doom codenames stay permanent across roles, and its 30-day
  game and saved runs remain untouched. First campaign is Prom of Doom: Crossfire.
  Master issue: https://github.com/silasfelinus/kind_robots/issues/4407
  2026-10-29 PT second expansion: In addition to 48 permanent superhero
  identities, each signature now owns one unique power-specific starting
  mission and one villain-owned lair tactical level. The villain commands
  one unique powered four-HP-benchmark second-in-command distinct from
  the existing one-hit named henchman species and minor species captain.
  Do not use another of the 48 heroes as that second-in-command: those
  heroes remain dramatic foil rivals. Cross-match any hero's origin opener
  with any selected villain's lair. Keep the 6-mission story campaign,
  fixed 48 personal routes, and production gates intact. Full authored
  48x3 slate is in Prom of Doom POWER-OPENINGS-LAIRS-AND-LIEUTENANTS.md.
  2026-10-29 PT: Require a cinematic splash / New / Continue split into story and
  one-shot battles, Settings and a progress Scrapbook. The generic campaign may
  pair any hero against any hero-villain, while each of the 48 identities also
  receives its own scripted foil matchup with exclusive scenes and ending.
  Add one-hit burrowing bunny men, teleporting imps and haunted toys as lackey
  types; each hero has an individual active ability and differentiated attack
  range, movement, tank/support role. Give combat rounds deterministic points
  for no knockouts, no damage and secrets, persisted into the Scrapbook.
  Priority venues: college quad with a huge central fountain, cramped science
  lab, and a City Plaza picnic one-shot ambushed by bunny men.
  Do not present prototype map presets as finished authored scenarios/art.
