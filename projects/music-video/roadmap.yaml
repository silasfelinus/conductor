# Music Video — Suno-inspired music video creator, built in kind_robots on our ComfyUI.
# Cross-repo software project: this roadmap owns task state; the implementation ships as an
# admin page, store and endpoints in silasfelinus/kind_robots (same pattern as music-mentor and
# scene-animator). Architecture, the timeline-document schema and the evidence behind every
# decision live in DESIGN-BRIEF.md. Read it before claiming anything.
project: music-video
kind: software
goal: "An admin gives a pitch plus optional length, genre, BPM and mood, gets structured lyrics and a Comfy-generated song, edits the lyrics, places scene changes on a beat grid, generates or uploads an image per scene, and exports one MP4 with the song, all rendered through the existing ArtJob queue and ComfyUI, checked at phone, tablet and desktop widths and accepted by Silas."

notes_from_silas: |
  2026-10-01 pitch: "a music video creator. similar to and inspired by suno. we should be able to
  give it a pitch, optional settings like length of time, genre, beats, and have it create lyrics,
  also edit lyrics, set when to change scenes, add or upload images for each scene beat, and
  compile everything. this should use our comfy as the backend."

  Decided with Silas in session, 2026-10-01:
  - The song is generated on Comfy from day one (not upload-only). An admin audio upload still
    exists as a fallback lane so everything else can be built and tested before the render box
    has an audio model and an audio-capable relay.
  - First release is admin-only, like Scene Animator. Opening it to signed-in users is t-019.

  Agent picks, each a one-line edit if Silas disagrees: slug music-video; priority slot just behind
  the top-10 band; compile in the browser (WebCodecs) instead of a relay ffmpeg job; MP3 song
  output.

  Hard rules for this project: ArtJob is the only generation queue (no second queue or renderer);
  scene prompts follow the contract of the engine that renders them: the Krea 2 contract in
  ART-PROMPTS.md by default (concrete nouns first, no negations, no art-direction jargon), or the
  comic house lane's tag contract when a video borrows a Comic Studio series' style (t-025, for
  Zuzu: Koala Assassin); cloud sessions cannot reach Comfy, so audio work is verified
  structurally until t-012 puts a real render on the box. kind_robots PRs use branch
  worker/music-video-t-0NN and a title starting music-video/t-0NN:, and merge the kind_robots side
  before the conductor side when a task has companion PRs (AGENTS.md, Cross-repo tasks).

