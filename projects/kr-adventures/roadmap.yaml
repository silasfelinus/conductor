# Kind Robots Adventures — built in kind_robots, free-to-play (no LLM in the player path).
# Cross-repo software project: this roadmap owns task state; implementation ships in silasfelinus/kind_robots.
# Architecture and guardrails live in DESIGN-BRIEF.md. Read it before claiming anything.
project: kr-adventures
kind: software
goal: A visitor opens Kind Robots, picks a pre-written choose-your-own-adventure book that begins from
  an existing Kind Robots scenario, plays as its preset hero through a fully authored branching story
  with art on every page and several endings, with no LLM at read time and no account required, checked
  at phone, tablet and desktop widths and accepted by Silas.
notes_from_silas: "2026-10-02 pitch: \"pre-written choose your own adventure stories that start from our\
  \ scenarios, with\n  a preset main character, but have fully complete pre-written branching storylines\
  \ and art.\"\n  Free-to-play push: free tokens are spent at authoring time so the read-time cost is\
  \ zero.\n  This is the opposite of Storymaker's live LLM narrator: every page is authored, reviewed\
  \ and\n  committed. Hard rules: no LLM in the reader path; every node has art; every branch resolves\
  \ to a\n  reachable ending (a validator proves it); adventures are authored by sessions as static JSON\n\
  \  bundles. Agent picks, each a one-line edit if Silas disagrees: books of roughly 40 to 60 nodes with\n\
  \  4 to 6 endings; one preset hero per book, borrowed from existing characters; first three books\n\
  \  authored to prove the pipeline before scaling.\n"
