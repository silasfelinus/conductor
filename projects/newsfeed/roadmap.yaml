project: newsfeed
kind: software

notes_from_silas: |
  Build a modular, programmable newsfeed for the Kind Robots user homepage.
  Replace the current settings-first homepage with useful feed content and move settings
  into its own dedicated section. Ship a functional MVP quickly: curated recommended feeds
  first, customization second, polish after the core loop works.

  Recommended starter feeds should include AI news, activism, malaria activism,
  AI gaming advances, AI model creation, and developer tips. Modularity is a core value:
  feed definitions, source adapters, filtering, ordering, and presentation should be
  separable rather than welded into one giant component.

  Take inspiration from Ground News: users should be able to see and adjust how much
  political viewpoint diversity enters their feed. Keep political perspective as optional,
  transparent metadata and a pluggable ranking dimension. Never infer the user's politics
  from unrelated behavior, and keep factual reliability separate from political bias.

