project: serendipity
kind: software
notes_from_silas: "Serendipity is the fun one: a story-weaving experience inside kind_robots.\nThe Serendipity\
  \ bot uses our task-manager systems to weave a narrative around\na theme the user picks (dream vibes,\
  \ locations, genres). The user is the\nprotagonist of a colorful, engaging story \u2014 and the questions\
  \ the story asks\nthem quietly advance the real honey-dos and human-gated tasks of a project.\nBuild\
  \ on existing infrastructure: chat streams, Bots, Dreams (LOCATION/GENRE\ndream types), Todos (HONEYDO\
  \ category), and the conductor roadmap task gates.\nThis project has write access to develop the Serendipity\
  \ component in\nkind_robots. Delight first: the story should feel like a gift, not a chore list.\n"
