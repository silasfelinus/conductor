# Hidden Robots — free-to-play, built in kind_robots. Architecture in DESIGN-BRIEF.md.
project: hidden-robots
kind: software
goal: Twenty big, busy, hand-composed scenes (a night market, a robot orchestra, a flooded library) with
  a find-list of small characters and objects tucked inside, where sessions look at each finished image
  and annotate the hit boxes. Tap to find, count down the list, earn a stamp per scene.
notes_from_silas: '2026-10-02: approved from the daily pitch docket ("I like all proposals"). Free-to-play:
  no LLM at runtime; sessions pre-author content and art.

  '
