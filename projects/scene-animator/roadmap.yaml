  - id: t-005
    title: "FOR SILAS: confirm the admin Scene Animator surface to close out this finished project"
    status: needs-human
    passes: 0
    stakes: reversible
    note: >-
      FOR SILAS: all 4 roadmap tasks across all three milestones (shape, build, polish/
      ship) are done -- nothing agent-actionable remains in the queue. Reconciled
      2026-09-07 (scheduled Agent sweep) per AGENTS.md's rule that a user-facing
      software project isn't `finished` on task count alone. This one is scoped
      intentionally as internal/admin-only (per t-002's own note), so the bar is lighter
      than a public-facing surface, but the same closing step still applies: you should
      look at it once before it's marked done.
      What I could verify from this sandbox: `https://kindrobots.org/admin/scene-animator`
      returns 200 with real SSR markup (confirmed live "Scene Animator" content in the
      response, not the bare SPA shell). What I could NOT verify: actual layout,
      spacing, or a real folder-to-video batch run (that needs real source media and the
      Comfy video pipeline, not a sandbox check).
      TO APPROVE: open /admin/scene-animator yourself, and if you have a moment, run one
      real batch against real source folders. If it looks and works right, set
      `approved_by_human: true` and flip project-overrides.yaml's scene-animator entry to
      `status: finished`. If something needs fixing first, note what and I'll file it as
      a fresh `ready` task.
      What unblocks when you do: nothing else is waiting on this -- it's the project's
      own closing step, and it also clears a currently-failing CI assertion
      (`test_current_project_lifecycle.py`) that flags any `active` project sitting with
      zero open tasks.

      Silas tested the Scene Animator surface on 2026-09-08 and rejected the closeout: the UI reports "Scene Animator source root is unavailable: /app/animate" and the animator does not work. Reopen this acceptance task for repair. Treat the observed production source-root failure as the concrete bug to fix before asking for acceptance again.

      Root cause confirmed: the Scene Animator application expects /app/animate, but the deployment definition mounted only the public image tree. The implementation branch adds the missing dedicated read-only animate bind, documents the DockerMan production mapping, and adds a source-level deployment contract verifier. Production remains blocked on applying the equivalent saved Unraid template mount before the acceptance test can pass.

      FOR SILAS: The repository-side Scene Animator fix is merged as silasfelinus/kind_robots#2546 (squash ef8397343d8cd74344399469acf75270ffa74a74). Root cause was the production container contract: the app resolves /app/animate, but only the public image tree was mounted. The repo now declares ANIMATE_PATH=/app/animate plus a dedicated read-only host bind from /mnt/user/pc/kindrobots/animate, documents the mapping, and includes a deployment-contract verifier. All exact-head PR workflows completed successfully, including TypeScript, Layout, Schema Migration Parity, and Contract Tests. TO APPROVE / COMPLETE: on Alexandria, add the equivalent saved DockerMan template path mapping Host /mnt/user/pc/kindrobots/animate -> Container /app/animate as Read Only, then recreate/update KindRobots through the normal guarded deployment path and re-test /admin/scene-animator. This is a physical-host configuration gate; no further GitHub code change can make the currently running container see an unmounted host directory. Once the health endpoint reports the source available and one real batch works, this acceptance task can close and the scene-animator project can be marked finished.

      BLOCKED 2026-09-11: Silas attempted this confirmation and could not -- /admin/scene-
      animator reports "Scene Animator source root is unavailable: /app/animate", so the
      surface cannot be visually confirmed while the feature cannot run at all. This is
      environment/deployment, not code: sceneAnimator.ts resolves its root from ANIMATE_PATH
      (or an IMAGES_PATH-derived fallback) and 503s when that path is not mounted in the
      container. Filed t-006 for that, and this task now waits on it. Do not re-present this
      for confirmation until Scene Animator actually lists folders in production -- presenting
