project: scene-animator
kind: software

goal: >
  An admin-only Kind Robots workflow that turns folders of still scene images into short
  generated videos automatically using the existing Comfy video pipeline, with durable
  progress, safe resume/deduplication, maturity controls, presets, and a browsable result
  gallery.

notes_from_silas: |
  Give the tool a folder of still images and make each scene alive without writing a unique
  motion prompt for every image. Reuse Kind Robots' general video generation infrastructure
  and presets. The operator chooses the source folder, desired clip duration, and maturity
  setting; the system remembers progress and exposes a gallery. This belongs on an admin
  surface in Kind Robots. Source stills may live on the existing media server in a dedicated
  sibling tree such as kindrobots/animate rather than kindrobots/images.

