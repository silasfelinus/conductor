    weight: 50
    status: not-started

  - id: m3
    title: "POLISH & SHIP — gallery, recovery, and operator UX"
    weight: 30
    status: not-started

tasks:
  - id: t-001
    milestone: m1
    title: "Build the resumable Scene Animator MVP in Kind Robots"
    status: claimed
    owner: worker
    passes: 0
    stakes: reversible
    note: >
      Implement the first useful end-to-end slice. Reuse /api/video/generate ->
      /api/art/enqueue -> ArtJob -> kr-relay and utils/videoPresets.ts; do not create a
      parallel render queue. Add an admin Scene Animator surface that can discover folders
      and still images from a dedicated animation source root, choose engine/preset/duration
      and maturity, enqueue every unprocessed source with one neutral scene-preserving motion
      prompt, reconstruct progress from durable ArtJobs after refresh/restart, and show the
      resulting clips as a gallery. Source identity + render settings must produce a stable
      dedupe key so Resume never silently duplicates completed/active jobs.
