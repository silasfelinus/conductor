    note: >
      The build task t-015 specced but deliberately left unfiled. t-013 landed the
      play loop (create run / record choice / resolve) and t-008 seeded all 1024
      endings, but nothing generated the chapter prose, choice text, or effect
      deltas a player actually reads -- the project was flipped `finished` on
