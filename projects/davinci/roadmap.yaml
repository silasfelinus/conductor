ld keep auditing for further concrete, verifiable gaps (e.g. focus management after chapter transitions, remaining kr-panel/kr-stat wrapper consistency) or attempt the still-outstanding cross-width visual verification this task''s own note calls for. Rearmed to ready for a follow-up slice. Slice 8 (conductor scheduled Agent run, session 20260818T2201Z-davinci-t021-b7gbb9, worktree-isolated background agent, foreground-verified). Read the full slice history and every existing verifyDaVinci* guard (7 prior) before starting. Found: the narration-error callout (v-else-if="narrationError") had no role or aria-live semantics at all -- slice 2 fixed this exact block''s color-tone opacity drift (verifyDaVinciNarrationErrorToneGuard.ts) without touching its missing ARIA semantics, leaving this gap behind. Every other warning/error-toned callout in the app carries role="alert", including this file''s own top-of-page errorMessage callout a few lines above and academy-manager.vue''s managerError block (identical tinted-callout + retry-button shape). Fixed by adding role="alert" to the div. Added the 8th guard, verifyDaVinciNarrationErrorRoleGuard.ts + selftest, wired into package.json and contract-tests.yml. Considered the outstanding phone/tablet/desktop rendered-preview verification this task''s note also calls for, but confirmed via AGENTS.md''s documented Vercel-preview-retirement section that real pixel-level pre-merge verification isn''t possible in this sandbox (unchanged from every prior slice''s precedent) -- continued the concrete-gap audit instead. Verified: new guard fails pre-fix/passes post-fix (git-stash round-trip); all 7 prior verifyDaVinci* guards + selftests still pass; test:davinci-narration (12/12) still passes; test:layout-contract holds with no new violations; eslint clean; prettier --check clean; vue-tsc --noEmit repo-wide exit 0; git status --porcelain showed exactly the 5 intended files. Verified independently before trusting the agent''s report: pulled PR #1944''s actual diff stat (5 files, +196/-1, matches exactly) and all required check runs green via GitHub MCP (only the standard non-required Build production image job still in flight at merge time, matching every prior slice''s precedent). kind_robots PR #1944 squash-merged 689a8910ea0f6e8988f0d4b9aacfe9913fd86f6e. REMAINING: outstanding cross-width visual verification still unaddressed by any slice (documented as not possible in this sandbox); next slice should continue the concrete-gap audit or revisit whether a manual/CI-driven screenshot path (e.g. the responsive-layout-audit workflow) can cover davinci specifically. Rearmed to ready for a follow-up slice. Slice 9 (conductor scheduled Agent run, session 20260819T172718Z-davinci-t021-sched, worktree-isolated background agent; a first dispatch died mid-run from a connection error after pushing its commit but before opening the PR, so a second worktree-isolated agent picked up the stranded branch, independently verified the diff rather than trusting the first agent''s unseen report, and finished the close-out). Found: choosing an option, retrying a failed narration, or switching to the curated pool all click a button that lives inside the narrating/narrationError/currentChapter v-if/v-else-if chain, which then unmounts along with the clicked button -- nothing moved focus afterward, so the browser dropped it to <body> and a keyboard/screen-reader user had to re-discover the new chapter from the top of the page after every single choice, the core interaction loop of this product. Mirrors model-builder-manager.vue''s own documented fix for the identical focus-loss shape (confirmed real via direct read of model-builder-manager.vue:84-85). Fixed by wrapping the swapping blocks in a persistent ref="chapterRegion" tabindex="-1" container and adding a watch() on the trio of refs the v-if chain switches on that, when the DOM patch was triggered by a click inside the region (checked via document.activeElement before Vue''s pre-flush patches the new branch in), restores focus to the region in nextTick(). Added the 9th guard, verifyDaVinciChapterFocusGuard.ts + selftest, wired into package.json and contract-tests.yml. Verified: new guard fails pre-fix / passes post-fix via a git-checkout-parent round-trip against the real component (not synthetic fixtures) -- 5 expected errors pre-fix, clean pass post-fix; guard''s own selftest (6 regression fixtures + fixed fixture) passed; all 8 prior verifyDaVinci* guards + selftests still pass individually; test:davinci-narration (12/12) still passes; test:layout-contract holds with no new violations; eslint clean on touched/new files; prettier --check clean on new and touched files (davinci-page.vue, package.json, contract-tests.yml), no pre-existing drift found; vue-tsc --noEmit repo-wide exit 0; git status --porcelain showed exactly the 5 intended files. 32/33 kind_robots CI checks green before merge (only the standard non-required "Build production image" deploy job still in flight, matching every prior slice''s merge-when-unstable precedent). kind_robots PR #1969 squash-merged 54e4d501c6ac79a92499359a9748590a67820c98. REMAINING: the outstanding cross-width visual verification remains unaddressed (documented as not possible in this sandbox, unchanged from every prior slice). Concrete next lead found while reading further: the OUTER phase state (loading/start/playing/ending) also switches via a v-if/v-else-if chain with no persistent wrapper -- the playing block (which now contains chapterRegion) is where "See your ending" lives, and resolveLife() on success sets phase to ''ending'' (unmounting the entire playing block, chapterRegion included, and losing focus again -- the identical shape slice 9 just fixed one level down); startLife() (start->playing) and playAgain() (ending->start) carry the same risk. Next slice should audit the outer phase switch with the same wrap-and-watch treatment. Rearmed to ready for a follow-up slice. Slice 10 (conductor scheduled Agent run, session sched-conductor-davinci-t021-20260820T0527Z): fixed the outer phase-switch focus loss flagged by slice 9''s own note above. Wrapped the whole outer logged-out/loading/start/playing/ending v-if/v-else-if chain in a persistent phaseRegion (tabindex="-1"), mirroring model-builder-manager.vue''s mainContent and this file''s own chapterRegion, plus a watch(phase, ...) that restores focus to it when the transition originated from an in-region click. This catches a case the narrower chapterRegion fix (slice 9) can''t: resolveLife''s "See your ending" button lives inside chapterRegion, but its phase transition unmounts the entire playing block, chapterRegion included, so only a persistent wrapper one level up survives that transition to receive focus. Added the 10th guard, verifyDaVinciPhaseFocusGuard.ts + selftest, wired into package.json and contract-tests.yml alongside the nine existing guards. Verified: new guard fails pre-fix / passes post-fix via git-stash round-trip against the real component; all 9 prior verifyDaVinci* guards + selftests still pass; test:davinci-narration (16/16) still passes; test:layout-contract holds with no new violations; eslint clean; prettier --check clean (after one --write pass to reindent the newly-wrapped block, confirmed content-identical via git diff --ignore-all-space); vue-tsc --noEmit repo-wide exit 0; git status --porcelain showed exactly the 5 intended files. All required kind_robots CI checks green before merge (34 total, only the standard non-required "Build production image" deploy job still in flight, matching every prior slice''s merge-when-unstable precedent). kind_robots PR #1980 squash-merged a36e04ad. REMAINING: the outstanding cross-width visual verification remains unaddressed (documented as not possible pre-merge in this sandbox, unchanged from every prior slice); next slice should keep auditing for further concrete, verifiable gaps (e.g. remaining kr-panel/kr-stat wrapper consistency for the dimension grid) or attempt that outstanding verification. Rearmed to ready for a follow-up slice. Slice 11 (conductor scheduled Agent run, session sched-conductor-davinci-t021-20260821T052849Z): followed up on slice 10''s own lead ("kr-panel/kr-stat wrapper consistency for the dimension grid"). Ran utils/scripts/codemods/kr_panel_codemod.py --root . (dry-run, whole repo) and confirmed zero candidate substitutions anywhere in components/conductor/davinci-page.vue -- the dimension-pill wrapper divs use dynamic :class bindings (dimensionPillClass()/dimensionValueClass()) for per-item tone, not a static class= sequence the mechanical codemod can safely rewrite, and their border/bg values already follow the same status-tint formula (border-{status}/40 + bg-{status}/10) documented for .kr-note elsewhere in the design system -- so this lead was speculative, not a real gap. Re-read the entire template (all v-if/v-else-if phase and chapter blocks, the resolve/ending panel, the endings-on-record list, every button and NarrativeArtStatus usage) against the same focus-loss/aria-grouping/status-tone patterns the prior 10 slices fixed; found no further concrete, verifiable gap of that shape -- phaseRegion and chapterRegion already cover every phase/chapter transition, the dimension grid already has role="group"/aria-label plus 3-way tone, narration error/resuming/narrating states already have their own guards. The one clean kr_panel_codemod.py candidate the dry-run did surface (components/pages/mermaids-page.vue L152) is out of this task''s scope (not a Da Vinci file) and left for whichever task owns that general kr-panel audit sweep (interface-vision). REMAINING (unchanged from every prior slice): the outstanding cross-width visual verification is still not possible in this sandbox. Releasing the claim without a code change this slice -- re-armed to ready; a future slice should look for a genuinely new interaction gap (e.g. as Da Vinci narration content evolves) rather than re-checking this same speculative lead. Slice 12 (conductor scheduled Agent run, session sched-conductor-davinci-t021-20260822T152725). Re-read the full component per slice 11''s own note (which found no further gap after exhausting the accessibility/tone/focus-audit ground the first 10 slices covered) asking for "a genuinely new interaction gap" rather than re-checking prior ground. Found one: a real correctness bug rather than another a11y gap. narrateChapter() is called from resumeRun(), startLife(), and chooseOption(), with no protection against a prior call''s response landing after a newer one. "Abandon this life" is only disabled by submitting, which chooseOption() already clears before its own post-choice narrateChapter() call begins -- so a player can abandon a run while its narration request is still in flight, then immediately start (or resume) a different run before the old response resolves. Without a guard, that stale response would silently overwrite aiChapter/narratorName with the abandoned run''s chapter, and requestChapterArt() would then attach the abandoned run''s art job to the NEW run''s id (run.value.id has already moved on by the time the stale response lands) via POST /api/davinci/runs/{id}/art -- corrupting the new run''s persisted art, not just a stale UI flash. Fixed with a monotonic request ticket around narrateChapter(), matching the identical pattern already established elsewhere in kind_robots for this exact class of bug (stores/modelBuilderStore.ts''s fetchRunsRequestId / loadSources'' requestedType): capture a ticket per call, discard any response whose ticket no longer matches the latest one. Added verifyDaVinciNarrateStaleResponseGuard.ts + selftest following this project''s narrow-textual-checker convention, wired into package.json and contract-tests.yml alongside the ten existing davinci guards. Verified: new guard fails pre-fix / passes post-fix (git-stash round-trip); all ten prior verifyDaVinci* guards + selftests still pass; test:davinci-narration still passes; eslint clean; prettier --check clean; vue-tsc --noEmit repo-wide exit 0; git status --porcelain showed exactly the 5 intended files (reverted an incidental prisma generate regen diff before committing). kind_robots PR #2028: all required CI checks green before merge (mergeable_state reached unstable with only the non-required "Build production image" deploy job still in flight, matching every prior slice''s merge-when-unstable precedent), squash-merged b59b01b3. REMAINING: the outstanding cross-width visual verification remains unaddressed (documented as not possible pre-merge in this sandbox, unchanged from every prior slice); twelve slices in, the concrete-gap categories found so far (accessibility, tone, focus, controls-consistency, and now a stale-response race) suggest the next slice should either look for another correctness-class bug (not just a11y) or attempt that outstanding verification path. Rearmed to ready for a follow-up slice. Slice 13 (conductor scheduled Agent run, session sched-conductor-davinci-t021-20260822T222803Z): followed slice 12''s own lead ("another correctness-class bug, not just a11y") rather than the outstanding cross-width visual verification. Found: updateChapterArt()/updateEndingArt() are passed as callbacks to narrativeArtJobsHelper''s enqueue()/retry(), which polls for up to 10 minutes (5s interval x 120 attempts) and has no concept of "is this run still active" -- nothing cancels the poll on abandon/restart (its timers live in a module-level Map keyed by dedupeKey, independent of this component''s refs). A player who abandons a run and starts or resumes a different one before an old art job resolves would have the stale callback fire against the new run''s state: chapterArt is keyed only by chapter number (which resets to 1 for every new run), so the stale result silently overwrote the new run''s own chapter art, and persistLifeRunArt() reads run.value.id at call time -- attaching the abandoned run''s illustration to the new run''s LifeRunArt row server-side. Worse for endingArt (a single slot): requestEndingArt() no-ops once endingArt.value is already set, so a leaked stale value would also silently suppress the new run''s own ending illustration from ever being requested. Same shape as slice 12''s narrateChapter() requestId ticket, applied to the art-attachment path -- the run''s own id doubles as the ticket. Both update functions now take a runId parameter and discard any result once run.value.id no longer matches it; requestChapterArt()/requestEndingArt()/retryCurrentChapterArt()/retryEndingArt() capture and thread runId through. Added the 12th guard, verifyDaVinciArtRunGuard.ts + selftest, wired into package.json and contract-tests.yml. Verified: new guard fails pre-fix / passes post-fix (git-stash round-trip); all 11 prior verifyDaVinci* guards + selftests still pass; test:davinci-narration still passes; test:layout-contract holds with no new violations (one unrelated pre-existing baseline improvement elsewhere, untouched by this PR); eslint clean; prettier --check clean; vue-tsc --noEmit repo-wide exit 0; git status --porcelain showed exactly the 5 intended files (reverted an incidental prisma generate regen diff before committing). kind_robots PR #2031: all 38 check runs green before merge, mergeable_state clean, diff (454/-7, 5 files) matched the report exactly, squash-merged a7af260d. REMAINING: the outstanding cross-width visual verification remains unaddressed (documented as not possible pre-merge in this sandbox, unchanged from every prior slice); thirteen slices in, every fix so far was found by static reading alone -- next slice should either try scripting an actual reproduction of one of these async-race bugs (mock a slow-resolving art job, abandon mid-poll, assert no cross-run leakage) instead of continuing purely static audits, or keep auditing for a new correctness-class bug. Rearmed to ready for a follow-up slice. Slice 14 (conductor scheduled Agent run, session claude-scheduled-20260823T112900Z-dv-t021): per slice 13''s own recommendation, tried scripting/tracing an actual async-race reproduction instead of another purely static audit, and found a new correctness bug in the same "long-lived async callback + component state" family as slices 12/13. Root cause: a chapter or ending art job''s in-flight state (queueing/queued/rendering, or failed/cancelled with its retry button showing) lives only in davinci-page.vue''s setup-scoped chapterArt/endingArt refs -- persistLifeRunArt() only POSTs a LifeRunArt row once a poll sees status: ''done'', so hydrateArtFromRun() (which rebuilds those refs purely from the server''s LifeRunArt rows on every resumeRun()) can only ever restore terminal art. A page reload or any other remount while a job was still in flight silently dropped it: no busy indicator, no retry button, and nothing left holding its dedupeKey/jobId to reconnect polling, even though the backend job could still be running or could already have finished with an ArtImage never attached to the run. Twin of slice 13''s art-run bug: that one guarded against a stale result overwriting the wrong run; this one guards against an in-flight result for the same run never being tracked again after a remount. Fix mirrors storybookStore.ts''s existing resumeNarrativeArtJobs() pattern: updateChapterArt()/updateEndingArt() now call a new persistArtJobs() on every transition (caches chapterArt/endingArt to a new ART_JOBS_STORAGE_KEY localStorage entry, best-effort try/catch); a new resumePendingArtJobs(runId) is called in resumeRun() right after hydrateArtFromRun(), seeding any cached non-terminal-hydrated entries back in and calling narrativeArtJobs.resume() to reconnect polling; playAgain() clears the new key alongside the existing active-run-id key. New guard: verifyDaVinciArtResumeGuard.ts + .test.ts, wired into package.json and contract-tests.yml following the established 13-guard pattern. Verified: guard fail (pre-fix, git stash)/pass (post-fix) round-trip; selftest 7/7 synthetic regressions individually caught; all 12 prior verifyDaVinci* guards + selftests still pass; test:davinci-narration passes; eslint clean; prettier clean; vue-tsc --noEmit repo-wide shows only the same single pre-existing unrelated baseline error (server/api/reactions/index.post.ts, confirmed identical via git stash before/after); test:layout-contract holds, 0 new violations; git status --porcelain showed only the 5 intended files before commit. Opened kind_robots#2046 (worker/davinci-t021), all 38 checks green, mergeable_state clean, squash-merged fda825c7. Client-only change (one Vue component + a new localStorage key), fully additive, easy single-commit revert if needed. Flag for a future slice: resumePendingArtJobs() runs unconditionally in resumeRun(), including the same-session resolveLife()->resumeRun(sameRunId) path, not just page-reload -- a deliberate simplicity tradeoff (harmless redundant resume() call for an already-tracked job), not scoped to the reload path only. Kaizen: if Da Vinci or another narrative surface adds a third/fourth long-lived async job type, consider promoting narrativeArtJobsHelper''s resume/cache pattern (now duplicated between storybookStore.ts and davinci-page.vue) into a shared composable (e.g. usePersistedNarrativeArtJobs(storageKey, runId)) rather than hand-rolling it a third time. Rearmed to ready for a follow-up slice.'
