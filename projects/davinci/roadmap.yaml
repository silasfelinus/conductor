      swing or the 3-chapter minimum-before-ending need adjusting so a run has real room
      for reversal instead of being effectively decided in chapter 1-2.


      DONE (conductor scheduled sweep, 2026-08-15, kind_robots PR #1897). This sandbox
      cannot authenticate as a live user against the OpenAI-backed narration endpoint,
      so substituted a Monte Carlo simulation of 20k+ runs against the actual
      production constants and effect distribution (each choice touches 2-3 of the 10
      dimensions per davinciNarration.ts's own system prompt, deltas uniform over
      [-2,-1,1,2]) to directly answer the task's question. Findings: the +-2 swing is
      NOT the driver of early lock-in -- DAVINCI_PASS_VALUE is 1, so any single nonzero
      positive touch already crosses the pass threshold whether the max swing is 1 or
      2; left NARRATION_EFFECT_MIN/MAX unchanged. The real lever is chapter count: at
      the original chapter-3 gate, an average of 4.2/10 dimensions had never been
      touched by any choice at all (guaranteed-fail, not a player decision); at chapter
      6 that drops to ~1.8/10 untouched on average. Raised MIN_CHAPTERS_BEFORE_ENDING
