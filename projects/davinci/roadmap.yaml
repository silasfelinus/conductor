project: davinci
kind: software
goal: >
  Ship a genuinely playable, visually coherent Da Vinci life simulator that has been
  tested on phone, tablet, and desktop, uses art throughout the run, and has verified
  art coverage for all 1,024 deterministic endings before the project is called finished.
notes_from_silas: |
  Da Vinci is a life simulator app/game/webgame: a branching life narrative with pass/fail victory conditions and 1024 achievements/endpoints. It integrates with Kind Robots characters, Dreams, Chat, generated art collections, and the existing milestone system. Focus development on milestone/achievement/ending generation first, so narrative generation has concrete targets. This may later share pieces with Storybook, but do not merge it prematurely.

milestones:
  - id: m1
    title: "SHAPE — endpoint framework and design brief"
    weight: 25
    status: done

  - id: m2
    title: "BUILD — life run, choice, and ending engine"
    weight: 35
    status: done

  - id: m3
    title: "INTEGRATE — milestones, Dreams, characters, Chat, and art collections"
    weight: 25
    status: done

  - id: m4
    title: "POLISH — ending reveal, achievement gallery, and Storybook alignment"
    weight: 15
    status: done
  - id: m5
    title: "VERIFY — playtest the real experience across devices"
    weight: 20
    status: in-progress

  - id: m6
    title: "ART & POLISH — coherent styling, run art, and all 1,024 ending assets"
    weight: 30
    status: not-started

