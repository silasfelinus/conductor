tion-error callout used bg-warning/5 -- half the canonical opacity, and the sole outlier against every other border-warning/40 callout in the app (12 other files all use bg-warning/10). Fixed the opacity token, added verifyDaVinciNarrationErrorToneGuard.ts + selftest following the same narrow-textual-checker convention, wired into package.json and contract-tests.yml alongside the dimension-tone guard. Verified: new guard + selftest pass, dimension-tone guard + selftest still pass, test:davinci-narration (26 checks) still passes, test:layout-contract holds with no new violations, eslint/prettier clean, vue-tsc --noEmit repo-wide exit 0, git status --porcelain showed exactly the 5 intended files. CONFIRMED 2026-08-14 (conductor scheduled Agent run, reconciliation sweep): kind_robots PR #1854 (Slice 2) merged. Task was left at status: claimed after merge instead of re-arming to ready per its own note -- correcting that drift here. Next slice should continue the concrete-gap audit rather than starting a reskin. Slice 3 (kind_robots PR #1866, merged 2026-08-13 23:24 -- reconciled here 2026-08-15 after this drift went undetected through the 2026-08-14 reconciliation sweep above, which only re-confirmed Slice 2/PR #1854 and missed that #1866 had already landed the day before): the "See your ending" resolve panel was a standalone v-if, not part of the v-if/v-else-if chain that switches between the narrating/narrationError/currentChapter states above it (`!narrating && (canEndRun || !currentChapter)`). narrateChapter() clears aiChapter (making currentChapter null) before the request that can then fail, so during a narration failure `!currentChapter` was also true -- the resolve panel rendered stacked underneath the narration-error retry panel, showing "See your ending" / "Your chapters are told" at the same time as "Try again" / "Play the written chapters instead", even at chapter 1 with zero recorded choices. Fixed by excluding narrationError from the condition: `!narrating