project: davinci
kind: software
notes_from_silas: |
  Da Vinci is a life simulator app/game/webgame: a branching life narrative with pass/fail victory conditions and 1024 achievements/endpoints. It integrates with Kind Robots characters, Dreams, Chat, generated art collections, and the existing milestone system. Focus development on milestone/achievement/ending generation first, so narrative generation has concrete targets. This may later share pieces with Storymaker, but do not merge it prematurely.

