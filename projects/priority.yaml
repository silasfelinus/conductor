# Which project leads when multiple have ready tasks. Top of list wins.
# Scheduled operational commitments preempt this project queue through select_role.py;
# in particular, Daily Dream / daily-digest health is handled before ordinary worker
# pickup because it is expected to deliver every day.
#
# As of 2026-08-25, Silas explicitly set Mandarin Tutor and Cthulhuquarium as the two
# top non-continuous projects. Mandarin Tutor leads, with Cthulhuquarium immediately
# behind it. This supersedes the 2026-08-24 Cthulhuquarium -> Kapowarr pair.
# Finite active projects otherwise outrank continuous projects. Paused, finished, and
# retired projects are historical records and do not belong in the selectable queue.
# Continuous programs are fallback work; dream-cycle's ordinary maintenance task stays
# last because the actual Daily Dream production/digest workflow has its own schedule.
#
# Kapowarr remains the next finite project after the top pair. Kind Economy remains an
# important tentpole and retains its `priority: urgent` semantic override, but this file
# is the actual deterministic worker pickup order. The top pair is protected by
# tests/test_project_priority_contract.py so agents cannot silently reorder it.
# Rainbow Butterflies was added 2026-08-28 at Silas's requested middle priority: important
# mission work, but intentionally behind the current top build queue and Kind Robots core.
