kind: software
autonomous: true
goal: >
  Use otherwise-idle Conductor capacity to maintain one deterministic six-asset Daily
  Dream proposal-to-builder-to-digest pipeline, while coordinating delegated non-dream
  creation types without creating a second source of truth.
notes_from_silas: >
  Original direction: keep inventing useful site content when nothing higher-priority is
  ready and leave accessible files Silas can steer. Current implementation translates that
  into one dated six-asset Daily Dream lane plus delegated scheduler cards for other
  creation types. PIPELINE.md is authoritative; legacy larger Dream outlines are idea
  inventory.
