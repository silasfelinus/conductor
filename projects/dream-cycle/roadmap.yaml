      (3) else promote the top queued outline (approved > outline, then priority,
      then oldest) to building and run stage 1; (4) at ship: verify the full
      checklist, mark built, write the SHIPPED.md ledger entry, and replenish the
      backlog if under 5 buildable outlines. One dream building at a time, ever.
