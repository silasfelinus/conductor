project: dream-cycle
kind: software
autonomous: true
goal: >
  When nothing better is ready anywhere, conductor makes something for the site —
  one creation at a time, roughly one per day, art included. Creation types are
  pluggable playbooks: complete dreams (location + vibe, characters, rewards,
  scenarios, optional narrator with expressions/topics/threads), coloring-book
  production days, and future day-sized types — all driven from a human-steerable
  backlog of outline files.
notes_from_silas: >
  New project 2026-07-10, from my session direction: I want to test a new option
  for conductor sweeps — if there isn't anything better to do, the agent develops
  new ideas for the site, one dream at a time. A dream is a location and a vibe,
  each with characters, rewards, and scenarios; a dream can also have a bot
  narrator, and a narrator has expressions, topics, and threads. Each idea should
  take about a day to build out including all the art generation. Keep accessible
  files that list out further ideas so there's a backlog of outlines for future
  developments, with the ability for me to leave notes in the files. We have all
  the pieces — this project is the infrastructure tightening around them.
  UPDATE (same day): the idler needs to handle multiple types of creations, not
  just dreams. One type is dream building; another is "spend today drafting and
  making a coloring book." First coloring book: Monster Recast (Hollywood recast —
  gender-bending Hollywood movie monsters), already outlined in
  projects/coloring-book/sets/monster-recast/.
milestones:
  - id: m1
    title: SHAPE — design brief and backlog format
    weight: 15
    status: in-progress
  - id: m2
    title: TIGHTEN — API audit, loop contract, per-type playbooks
    weight: 30
    status: not-started
  - id: m3
    title: BACKLOG — seed and sustain the outline runway
    weight: 15
    status: not-started
  - id: m4
    title: CREATION FACTORY — the recurring one-creation-at-a-time build loop
    weight: 30
    status: not-started
  - id: m5
    title: POLISH — project art and loop refinement
    weight: 10
    status: not-started
