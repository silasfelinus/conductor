  - id: t-016
    milestone: m4
    title: Make build_dream_records.py atomic (roll back partial builds on intermittent DB failure)
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-07-16T21:00:00Z'
    note: >
      Found 2026-07-16 while building sound-cannery live (Silas: DB back but with
      intermittent downtimes). build_dream_records.py:run_build only left a proposal
      UNBUILT when EVERY call failed; on a PARTIAL failure (an intermittent 503
      mid-sequence) it still called record_built() — shipping an incomplete dream
      flagged built (missing characters/rewards/etc.), never retried, with orphaned
      rows. Fix: the build is now ATOMIC. kr_call records each created row's id +
      delete_base; on ANY failure run_build calls rollback_created() to DELETE every
      row that landed this run (newest-first, all seven models have DELETE endpoints)
      and leaves the proposal unbuilt, so the next sweep retries clean — no orphans,
      no duplicate dreams. tests/test_build_dream_records.py drives run_build with a
      scripted fake http_json: full success marks built + never rolls back; partial
      failure rolls back exactly the created rows and stays unbuilt; total failure
      undoes nothing. Verified live: repeated attempts during the current DB write
      outage (reads 200, writes 503) all bailed cleanly with 0 rollbacks and 0 files
      changed. The actual sound-cannery build will complete on the next stable window
      via the hourly sweep, now safe to run unattended.
  - id: t-017
    milestone: m4
    title: Fix the two bugs that blocked every daily-dream build; ship the first dream live
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-07-17T18:30:00Z'
    note: >
      Once the DB came back (2026-07-17), building live surfaced two bugs the
      intermittent 503s had masked — neither had EVER let a proposal build (every
      backlog proposal was unbuilt): (1) PitchSheet.extraData is a String
      @db.LongText column but build_dream_records.py sent it as a raw JSON object,
      so POST /api/sheets/by-dream 400'd "Invalid prisma.pitchSheet.create()" on
      every sheet — now json.dumps()'d; (2) dream slugs are globally unique and two
      same-titled elements (comet-market's world + a location both "The Comet
      Market") collided 409 — now each dream POSTs an explicit slug de-duplicated
      within the build (uniq_slug). With both fixed, comet-market built end-to-end
      (Done: 32/32 — 10 Dreams + PitchSheets + 3 Characters + Bot + 2 Rewards + 2
      Scenarios + relations, all designer "dream-cycle"; 9 art requests queued;
      slug the-comet-market-2 confirms the dedup; sheet extraData verified as a
      parseable JSON string tagged dreamCycle=comet-market). Companion kind_robots
      fix needed for the /daily-dream page to render these: daily-dream-page.vue
      metaOf() only accepts object extraData — must JSON.parse the string (filed
      separately). Cleaned up two earlier partial-build orphan sets from timed-out
      foreground runs (deleted via the model DELETE endpoints); root cause was the
      2-min tool timeout killing the sync build before rollback — builds now run
      detached in the background.
