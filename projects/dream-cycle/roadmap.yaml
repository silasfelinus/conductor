    note: >
      Filed 2026-07-25 (ai-art-academy/t-010 lane 2, roadmap-accuracy cycle,
      while spot-checking the shared art-queue relay's live health). A fresh
      `GET /api/art/queue/stats` (authenticated) showed the relay is not fully
      down (RUNNING: 1, DONE: 1438 in the last 24h) but its `recentFailed` list
      includes three exhausted-retry jobs from 2026-07-24 21:37-21:47 UTC, all
      the same error: "Kind Robots media job imagePath must begin with
      public/images/" (job ids 2219/2220/2221 — Friendly Bartender,
      Dr. Eliza Dolittle's Ring, Bag of Mushrooms reward-item art). Pulled each
      job's full payload directly: `imagePath: "public/rewards/favor/*.webp"`,
      `targetRepo: "silasfelinus/kind_robots"`. That path is CORRECT, not
      malformed — confirmed `public/rewards/` (favor/item/pet/power/skill) is a
      real, separate top-level directory in the kind_robots repo, sibling to
      `public/images/`, not nested under it (there is no `public/images/rewards/`).
      `projects/art-prompts.yaml` has 18 existing entries using this exact
      `public/rewards/<type>/<slug>.webp` convention (e.g. line ~532
      `kind-robots-friendly-bartender-image-2e3cf8c7`), matching the header note
      in `scripts/dream_slug_image_cleanup.py` ("Reward image folders
      (/rewards/<type>/... vs the component's /images/rewards/...)") — this is
      the project's own established, intentional path convention for reward art,
      not a caller bug.

      Root cause is in `ops/home-server/relay_media_agent.py`'s
      `direct_media_relative()` (~line 82): it hard-requires
      `parts[:2] == ("public", "images")` and raises `ValueError` otherwise, so
      any `public/rewards/...` job reaches the relay, fails validation, retries
      3x, and lands in FAILED — the daily-dream reward-art pipeline (t-018's
      output) silently loses its art with no successful fallback path, distinct
      from the already-documented "relay never claims the job" backlog signature
      lane 3 has tracked since 2026-07-18 (this is a claimed-then-hard-rejected
      job, not an unclaimed one).

      NOT fixed inline this cycle (out of lane 2's docs-only scope, and the fix
      is not as simple as widening the validator's accepted prefix): `media_root()`
      resolves everything under the single `KR_MEDIA_IMAGES_DIR`/`KR_LOCAL_IMAGES_DIR`
      env var, which points at the physical folder backing `public/images/` on
      Silas's home-server box. Naively accepting `public/rewards/...` and
      stripping it the same way `write_direct_media()` does for `images/...`
      would write the file under `<KR_MEDIA_IMAGES_DIR>/rewards/...` —
      i.e. inside `public/images/rewards/...` on the box, NOT the real sibling
      `public/rewards/...` the job actually requested — silently landing the
      generated art in the wrong folder while the job reports success. A correct
      fix needs either a second root env var (e.g. `KR_MEDIA_REWARDS_DIR`) or a
      single "public root" env var with `images`/`rewards` as two recognized
      subpaths under it, wired through `media_root()`/`write_direct_media()`, and
      updated/added test coverage alongside the existing
      `tests/test_media_direct.py` cases (`test_relay_maps_legacy_kindrobots_paths`,
      `test_relay_rejects_unsafe_kindrobots_paths` — note the latter explicitly
      expects unrecognized public/* roots like `public/assets/...` to keep
      raising, so this needs to whitelist `rewards` specifically, not loosen the
      check generally). Needs Silas's read on his box's actual folder layout
      before landing, since a wrong guess fails silently (job succeeds, file
      lands in the wrong place) rather than loudly.

      FIXED 2026-07-29 (conductor burst-mode cycle,
      claude-conductor-burst-20260729T121718Z-dc-t019): landed the second-root
      fix this note called for, and found the situation had actually gotten
      worse since filing — a since-merged, unrelated PR (#1399, 2026-07-28) had
      added `ops/home-server/relay_media_agent.py`'s `normalize_kindrobots_image_path()`
      with a `public/rewards/...` → `public/images/rewards/...` rewrite, plus a
      matching `tests/test_media_rewards.py` that locked that behavior in as
      correct (test named `test_relay_uses_configured_image_root_without_sibling_mapping`).
      That "fix" silenced the `ValueError` but is still wrong: it writes reward
      art physically under the images root instead of the real sibling
      `public/rewards/` directory, so the job now reports success while the art
      lands somewhere the app never reads from — a silent-wrong-location failure,
      strictly worse than the original loud rejection this task documented.
      Re-confirmed against the live `/home/user/kind_robots` checkout before
      touching anything: `public/rewards/favor/playground-guy.webp` and 9 other
      real files exist there; `public/images/rewards/` does not exist at all.
      Implemented the actual fix: added `KR_MEDIA_REWARDS_DIR`/`KR_LOCAL_REWARDS_DIR`
      as a second, independent root (mirroring the existing images env-var
      pattern); `normalize_kindrobots_image_path()` now canonicalizes
      `rewards/...`/`public/rewards/...` to `public/rewards/...` (not folded into
      images); `direct_media_target()` accepts either `public/images/...` or
      `public/rewards/...` and returns the matching kind; `media_root(kind)` is
      parametrized and raises a clear `RuntimeError` naming the missing env var
      per kind instead of guessing a path. This does not require knowing Silas's
      box layout in advance — it needs no guess at all, since a reward job now
      fails loudly and stays retryable until `KR_MEDIA_REWARDS_DIR` is set on the
      home-server box, instead of silently succeeding into the wrong folder.
      Corrected `tests/test_media_rewards.py`'s now-provably-wrong assertions
      (renamed the misleading "without_sibling_mapping" test) and added coverage
      for: the true sibling-root canonicalization/write path, the distinct
      literal-`public/images/rewards/...` case staying under the images root
      unchanged, and the loud-failure-when-unconfigured behavior. Verified via
      `pytest tests/test_media_rewards.py tests/test_media_direct.py
      tests/test_relay_completion_provenance.py` (43 passed) and
      `python3 -m py_compile` on both changed files. No kind_robots-repo changes
