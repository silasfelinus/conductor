  note: >
    Kaizen from PR #3390 (conductor sweep, 2026-09-01): daily-dream-prose-repair.yml
    was discarding an entire batch (13+ good repairs) whenever a single bundle came
    back as an empty Claude completion, which #3390 fixed by making atomicity
    per-bundle instead of per-batch -- a failed bundle is now left untouched,
    recorded in `failed_bundles`, and simply retried next run. That's the right fix
    for a transient flake, but nothing yet distinguishes "flaky, will succeed
    eventually" from "this specific bundle's content reliably triggers an empty
    completion" (e.g. a content-policy edge case in its own proposal text) -- such a
    bundle would now retry silently forever, once per scheduled run, with nobody
    ever told. Track consecutive failure counts per bundle (day/title) across runs
    -- e.g. a small state file alongside the backlog, or a count embedded in the
    audit -- and once a bundle hits some small threshold (3-5 consecutive failed
    runs), stop auto-retrying and surface it explicitly (a needs-human note, or at
    minimum a distinct stderr/receipt marker a human sweep would notice) rather than
    let it recur unnoticed indefinitely.
- id: t-026
  milestone: m5
  title: Character Facets were never applied - digest reported complete over an empty record
  status: done
  owner: null
  passes: 0
  stakes: reversible
  updated: '2026-09-02T01:30:00Z'
  implementation_pr: 'silasfelinus/kind_robots#2314'
  depends_on: [t-018]
  note: >
    FILED WRONG, THEN CORRECTED. This task first read "facets per dream have drifted past
    the 1-2 the seed spec asks for", from Silas asking "are we really making four facets
    per dream? That was not on spec". I could not measure the count from the public API
    and said so, but I framed the whole thing as a count question. It was not.
    Silas supplied the missing evidence himself: "I just don't get the facets added as
    part of my daily digest, so there is a discrepancy ... While I don't have an issue
    with four facets in one day, ten generations for dream is ok ... mostly I want parity
    between what is being made and what is being reported in my daily dream updates and
    my front end dashboard." His digest showed the real numbers -- the vibe carries 4 seed
    facets and the whole bundle spans about 11 distinct ones -- and he is fine with that.
    The count was never the problem. The reporting was.
    THE ACTUAL BUG. PUT /api/characters/:id/facets read `assignments` or `facetIds` and
    nothing else. This script sends `{facetIds: [], facetKeys: [...]}` because slugs are
    the durable address (ids go stale when catalog rows merge or are deleted), so the body
    normalized to zero assignments -- and the handler's unconditional deleteMany still ran.
    It cleared the Character's Facets, created nothing, and answered success with an empty
    catalog. Every one of the 36 built bundles recorded status "complete" with errors []
    over a Character carrying no Facets. Confirmed on production: GET
    /api/characters/3320/facets returns data: [] for a bundle that requested six, while
    the same bundle's Dream (4), Rewards and Scenario all carry theirs.
    THE TESTS WERE PROTECTING IT. tests/test_apply_daily_dream_facets.py stubbed _put to
    return `{"success": true, "data": []}` -- the exact response the broken endpoint gave
    -- and asserted status == "complete" against it. The suite encoded the bug. Fixed, plus
    a case that a target attaching nothing is now partial with an error, and one that
    --dry-run still trusts the request it never sent.
    FIXED IN THREE PLACES, because one would have left a half-truth:
    (1) kind_robots#2314 makes the Character route resolve facetKeys, mirroring the Reward
    route that already did, and does the same for Bots, which carried the identical latent
    defect. verifyFacetSelectionRoutes.ts guards all six Facet-bearing models and fails on
    the pre-fix route (verified by reverting it).
    (2) apply_daily_dream_facets.py no longer treats a 200 as proof. A target whose
    response attaches nothing is an error and the bundle is partial, so "complete" means
    complete.
    (3) build_digest_email_v2.py prints what actually landed -- "23 Facet link(s) across 6
    record(s); nothing attached to character", amber rather than green, with a per-record
    breakdown -- instead of the bare word "complete". The data was always in `targets`; it
    was simply never shown. That is the parity Silas asked for: on the kelp-ink-transfer
    bundle the new line names the empty Character on sight.
    The count question is settled and needs no work: 4 seed facets on the vibe, ~11 across
    the bundle, and Silas has said explicitly that is fine.
    REPAIRED 2026-09-02, on Silas's word: "Characters (and anything else us8ng facets)
    should be repaired if missing." A read-only live sweep first, so "anything else" was
    measured rather than assumed -- of 216 recorded targets, Characters were 36/36 empty
    and every other element was 0/36. Then apply_daily_dream_facets.py --force, then an
    independent re-audit: 216/216 targets present, 1045 live Facet links, zero empty, zero
    short of what was requested. scripts/check_live_facet_coverage.py keeps it that way
    and is in the session sweep; its tests cover the failing shapes, not just the passing
    one, because the guard this replaces had only ever passed.
