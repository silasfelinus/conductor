- id: t-028
  milestone: m5
  title: Add a local conditional-instruction pre-check to Daily Dream art_prompt authoring
  status: ready
  owner: null
  passes: 0
  stakes: reversible
  updated: '2026-09-10T19:31:38Z'
  note: >
    workflow-medic finding, 2026-09-10: daily-digest.yml failed 2 runs in a row
    (#101, #102) because the-drowned-compact/t-2026-09-09's Split Vow reward item
    carried an art_prompt with a conditional clause ("...a hairline vein of blue
    light running along the fracture only when both halves touch"). The Kind
    Robots prompt contract rejects this at ArtJob submission time with HTTP 422
    [conditional-instruction] "only when" -- diffusion models render the words,
    they cannot evaluate a condition -- so the request sat stuck in
    projects/art-prompts.yaml re-failing every digest run until a human/session
    noticed and hand-edited the prompt (done this session; ArtJob 21681 now
    queued). scripts/dream_prose_quality.py's build-time creative contract has no
    check for this rule at all, unlike scripts/build_ruler_hooked_art_queue.py
    (~line 1224), which already scans its own queue for the same
    conditional-instruction shape before submission. Fix: give dream-cycle's
    art_prompt authoring (wherever build_dream_records.py assembles the "Look:"
    text into a submittable prompt) the same pre-submission regex/heuristic scan
    -- flag "only when", "if X then", "whenever", and similar conditional
    phrasing -- and either reject/re-author the prompt before it's queued, or at
    minimum fail loudly at build time instead of silently at submit time two
    digest runs later. Reversible, no schema changes; a good candidate to share
    logic with build_ruler_hooked_art_queue.py's existing check rather than
    duplicating the regex a third time.
- id: t-029
  milestone: m5
  title: Seed the AGE/BUILD/HAIR/ORIGIN embodiment Facets into the live catalog
  status: done
  owner: null
  passes: 0
  stakes: outward-facing
  updated: '2026-09-15T09:13:15Z'
  note: >-
    GATE CLEARED 2026-09-15 ~08:15: Silas reviewed the vocabulary via the dry
    run on Alexandria and ran `npm run seed:embodiment:apply` against
    production -- "Wrote 82/82 embodiment Facet(s)." Both halves are now live:
    kind_robots#2749 (schema + rows) and conductor#4399 (the planner that draws
    them) are merged, so the next daily dream seeds a real body rather than
    leaving `look` unconstrained.

    ONE CORRECTION STILL PENDING, and it needs a second `--apply`, not a code
    change on this side. kind_robots#2752 fixes five HAIR entries that were
    correctly scoped `any` but whose art prompts had been written for a human
    head ("an unlined young face", "one temple fully white", "pale lashes and
    brows matching", "dark at the scalp"). On a creature-bodied day those five
    were 5 of 11 drawable entries, and artPrompt reaches Krea 2 verbatim, so
    about half of all creature hair draws would have asked it to paint a temple
    or a brow onto an animal. This is the walrus problem arriving through a
    channel the scope filter cannot see: the filter asks whether an entry may
    sit on a body, never whether its prose secretly assumes a different one.
    The same PR widens dyed colour to non-humans (both dye entries were
    humanoid-only, so a creature day's sole dyed option was a raised crest),
    taking the creature-day hair pool 11 -> 13 and saturated-colour options
    2 -> 4 -- which matters because saturated hair colour measured at 0.0%
    across all 98 prior characters and is the axis this feature most exists
    for.

    No titles or slugs change in #2752, so re-running
    `npm run seed:embodiment:apply` after it merges UPDATES the 82 existing
    rows in place (the upsert already writes artPrompt and the scope metadata)
    rather than creating a second set. Until then the live rows carry the
    human-headed prompts; the blast radius is at most a few odd creature
    renders, not a broken pipeline.

    THEN re-measure, which is the only thing that proves this worked. The whole
    feature is real only if the seeds reach `look`, which is what Krea 2 sees;
    a Facet linked to a record but absent from `look` changes no pixel and is
    the mirror image of t-026's six-week silent no-op. Re-run the measurement
    below over the next ~20 built characters and confirm the zeros move.

    ORIGINAL FILING FOLLOWS.

    Silas, 2026-09-15: "there are lots of factors that could be switched. Hair
    color, style, age, gender presentation, body shape, size, racial background,
    default emotional state ... It would be great if we could utilize something
    so there is more diversity automatically roled when creating characters
    without such guidance."

    ROOT CAUSE, measured rather than asserted. The seed plan drew genre,
    creature, occupation and personality and nothing about the body, so `look`
    was authored under no constraint and converged. Across all 98 characters
    this pipeline had produced: saturated hair colour 0.0%, long hair 0.0%, hair
    mentioned at all 23.5%, explicit age 14.3%, human skin tone 9.2%, any stated
    affect 14.3%, she/her 39.8% vs he/him 9.2% (they/them 3.1%), "coat" 38.8%,
    "patched" 25.5%. Every axis the plan rolled came out varied; every axis it
    did not roll collapsed to one value.

    SHIPPED: silasfelinus/kind_robots#2749 (4 taxonomies + 82 curated rows +
    store/art-prompt wiring) and silasfelinus/conductor#4399 (the planner draws
    one GENDER/AGE/BUILD/HAIR and two ORIGIN for the character every day, plus a
    rolled `body` of humanoid|creature that makes the anatomy scope filter
    correct instead of guessing).

    WHAT ONLY SILAS CAN DO, and why this is a gate rather than a session task:
    `npm run seed:embodiment:apply` writes 82 rows to the PRODUCTION Facet
    catalog. They become live creative vocabulary the moment they land -- every
    generator that draws Facets starts using them, not only Daily Dream -- and
    ORIGIN in particular is identity vocabulary that should be read by a human
    before it is seeded, not applied on a session's own initiative. The seed
    script is dry by default and idempotent by slug, so the apply is safe to
    run and safe to re-run; it is the REVIEW that needs a human, not the
    mechanics. Suggested: skim utils/seeds/facetEmbodimentValues.ts (especially
    the 30 ORIGIN entries and the anti-stereotype rule in its header), then run
    the dry form, then --apply.

    UNTIL THEN the pipeline degrades cleanly and correctly: the live API 400s on
    an unknown taxonomy, build_dream_proposal falls back to its built-in pools,
    and no phantom taxonomy is reported as seeded. GENDER already draws real
    catalog rows today because its 15 rows predate this work and were simply
    never drawn. So dreams get more diverse immediately and MUCH more diverse
    once this gate clears.

    AFTER the apply, re-measure. The whole feature is only real if it reaches
    `look`, which is what Krea 2 sees -- a Facet linked to a record but absent
    from `look` changes no pixel, the mirror image of t-026's six-week silent
    no-op. Re-run the same measurement over the next ~20 built characters and
    confirm the zeros move.

    CLOSED 2026-09-15. Gate satisfied end to end and VERIFIED AGAINST THE LIVE CATALOG
    rather than against the terminal output, which was the right call: the second apply's
    git pull reported 'Already up to date' and fetched only a worker/ branch, which looked
    like the checkout had missed the correction. Querying /api/facets?taxonomy=HAIR settled
    it -- 24 rows live, all five corrected art prompts present ('Dark hair or fur...', 'one
    side of the head gone fully white', 'the finer hair around the eyes', 'Dark at the
    roots'), and both dye entries carrying scope 'any'. The checkout had in fact already
    been refreshed to current main by the deploy script before the pull ran. Full chain
    live: kind_robots#2749 (4 taxonomies + 82 rows), kind_robots#2752 (art-prompt
    correction), conductor#4399 (the planner), conductor#4404 (reconciliation). A live
    --brief now reports catalog_source 'live' with no fallbacks and draws all five axes from
    real rows -- for 2026-09-17: body creature, gender Neutrois, age Young and
    Overqualified, build Long and Angular, hair One Streak Deliberate, origin Anatolian
    Plateau Village + Baltic Timber Port. Follow-up t-030 carries the only thing that can
    actually prove this worked: re-measuring look.
  approved_by_human: true
  implementation_pr: 'silasfelinus/kind_robots#2752'
- id: t-030
  milestone: m5
  title: Re-measure character embodiment coverage now that the axes are seeded
  status: ready
  owner: null
  passes: 0
  stakes: reversible
  updated: '2026-09-15T09:30:00Z'
  note: >
    The proof step for t-029. Seeding the axes is not the same as the axes
    reaching the rendered image, and the difference is invisible from the
    pipeline end -- a Facet linked to a record but absent from `look` changes
    no pixel while still reporting `status: complete` with `errors: []`. That
    is exactly how t-026 went six weeks over a Character holding no Facets,
    and check_live_facet_coverage.py only catches the LINK half. Nothing
    checks whether the seeded body actually reached the prose Krea 2 reads.

    WAIT FOR ~20 NEW CHARACTERS built after 2026-09-15 before running this;
    a smaller sample cannot distinguish a real move from noise on axes whose
    baseline was 0.

    THE BASELINE, measured across all 98 characters authored before the axes
    existed: saturated hair colour 0.0%, long hair 0.0%, hair mentioned at all
    23.5%, explicit age 14.3%, human skin tone 9.2%, any stated affect 14.3%,
    she/her 39.8% vs he/him 9.2% vs they/them 3.1%, "coat" 38.8%, "patched"
    25.5%.

    METHOD: extract `characters[].look` from each proposal's proposal-data
    block under projects/dream-cycle/backlog/, then count the same axes. The
    original pass used plain regex families over the lowercased text (build
    words, hair words, saturated-colour words, age words, pronouns, skin-tone
    words, affect words) -- reproduce those rather than inventing new
    categories, or the comparison is meaningless.

    WHAT A PASS LOOKS LIKE: gender roughly even rather than 4.3:1; age stated
    far more often than 14.3% since AGE is now drawn every single day; hair
    mentioned on nearly every character; saturated colour clearly above zero.
    Build and origin should show up as visible description rather than as
    labels.

    WHAT A FAILURE LOOKS LIKE, and it is the likely one: the Facet LINKS are
    all correct and `look` still reads like the old house style. That means
    the brief's "express them, do not list them" instruction is being honoured
    as "ignore them", and the fix is in the authoring contract
    (_embodiment_instructions in build_dream_proposal_core.py), not in the
    catalog. Do not conclude the feature works from the Facet links alone --
    that is the precise mistake t-026 made.

    ALSO WORTH CHECKING while the data is open: whether `look` has started
    reading like a character sheet ("a 60-year-old broad-built feminine
    character with long silver hair"). That is the opposite failure from the
    rut and would mean the seeds are landing but the prose is not absorbing
    them. Both failures are authoring-contract fixes.
- id: t-031
  milestone: null
  title: Guard against workflow-behavior contract drift when an intentional failure policy changes
  status: ready
  owner: null
  passes: 0
  stakes: reversible
  updated: '2026-09-16T22:05:00Z'
  note: >
    Kaizen from conductor#4519 (dream-cycle/t-006, merged 2026-09-16): removing
    daily-digest.yml's "Fail after digest if Daily Dream cycle failed" step (to
    make sidecar problems warning-only) left tests/test_daily_digest_resilience.py
    asserting the OLD behavior (that exact step must exist and gate on it) while
    tests/test_daily_digest_schedule.py's new test asserted the opposite. Both
    passed independently at HEAD before the change and only conflicted once one
    of them was touched -- a full pytest run caught it this time, but nothing
    stops two workflow-behavior contracts from silently asserting opposite
    policies if a future change only edits one of them and CI happens to run a
    filtered subset. Add either a single shared assertion helper both tests call
    (so a policy change can only be made in one place) or a lightweight
    cross-check test that fails if the two files' daily-digest.yml assertions
    ever disagree about whether the post-email failure step exists. Scope this to
    daily-digest.yml's contract tests specifically; a repo-wide version of this
    guard is out of scope for one kaizen task.
