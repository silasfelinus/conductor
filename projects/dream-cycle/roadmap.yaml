project: dream-cycle
kind: software
autonomous: true
goal: >
  When nothing better is ready anywhere, conductor develops the site itself — one
  dream at a time. Each dream ships complete: a location with a vibe, characters,
  rewards, scenarios, optional bot narrator (expressions, topics, threads), and
  all art — in roughly a day, from a human-steerable backlog of outline files.
waypoints:
  - Browse the backlog of dream outlines and see what's coming.
  - Watch the active dream's build log fill in stage by stage.
  - Leave a note in any outline file to steer or veto it.
  - Visit a shipped dream on the site — location, cast, rewards, scenarios, narrator.
  - Check SHIPPED.md for the ledger of every dream built so far.
notes_from_silas: >
  New project 2026-07-10, from my session direction: I want to test a new option
  for conductor sweeps — if there isn't anything better to do, the agent develops
  new ideas for the site, one dream at a time. A dream is a location and a vibe,
  each with characters, rewards, and scenarios; a dream can also have a bot
  narrator, and a narrator has expressions, topics, and threads. Each idea should
  take about a day to build out including all the art generation. Keep accessible
  files that list out further ideas so there's a backlog of outlines for future
  developments, with the ability for me to leave notes in the files. We have all
  the pieces — this project is the infrastructure tightening around them.
milestones:
  - id: m1
    title: SHAPE — design brief and backlog format
    weight: 15
    status: in-progress
  - id: m2
    title: TIGHTEN — dream spec, API audit, build playbook
    weight: 30
    status: not-started
  - id: m3
    title: BACKLOG — seed and sustain the outline runway
    weight: 15
    status: not-started
  - id: m4
    title: DREAM FACTORY — the recurring one-dream-at-a-time build loop
    weight: 30
    status: not-started
  - id: m5
    title: POLISH — project art and loop refinement
    weight: 10
    status: not-started
