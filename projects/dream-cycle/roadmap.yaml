    title: 'Creation-a-day: advance the active creation build one stage'
    status: waiting
    recurring: true
    owner: null
    passes: 0
    stakes: reversible
    updated: '2026-07-10T00:00:00Z'
    depends_on: t-004
    note: >
      THE idle-fallback loop (recurring — re-arms to ready after every cycle,
      never reaches done, doesn't count toward milestones). Because dream-cycle
      sits LAST in projects/priority.yaml, this task is only picked when no other
      active project has ready work — that's the "nothing better to do" contract.
      Each cycle: (1) scan every backlog file for new Notes from Silas and
      frontmatter flips, fold them in first; (2) if a creation is status:
      building, advance it exactly ONE stage per its type's playbook in specs/
      and append its Build log; (3) else promote the top queued outline
      (approved > outline, then priority, then oldest created — types without a
      specs/ playbook wait, they don't block) to building and run its first
      stage; (4) at ship: verify the playbook checklist, mark built, write the
      SHIPPED.md ledger entry, and replenish the backlog if under 5 buildable
      outlines. One creation building at a time, ever. Delegating types
      (coloring-book) advance their home project's tasks and update both records;
      never double-claim a home task the Worker is already actively building —
      pick the next queued creation instead.
