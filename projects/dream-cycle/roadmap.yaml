    depends_on: t-004
    note: >
      THE idle-fallback loop (recurring — re-arms to ready after every cycle,
      never reaches done, doesn't count toward milestones). Because dream-cycle
      sits LAST in projects/priority.yaml, this task is only picked when no other
      active project has ready work — that's the "nothing better to do" contract.
      Each cycle: (1) scan every backlog file for new Notes from Silas and
      frontmatter flips, fold them in first; (2) if a dream is status: building,
