      FOR SILAS: on the home-server relay box, set `KR_MEDIA_REWARDS_DIR` (or
      `KR_LOCAL_REWARDS_DIR`) to the local folder that backs kind_robots'
      `public/rewards/` directory — the same way `KR_MEDIA_IMAGES_DIR` already
