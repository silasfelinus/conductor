d_identity.py) plus a full-catalog regression test wired into daily-dream-contract.yml, opened the PR with the real collision still present so CI surfaced the authoritative affected set, then repaired it: fetched each collided ID live from the Kind Robots API and confirmed by title/slug/description that Boundary Day (canopy-permit-office) and The Silk Bargain (the-tally-of-small-suns) are the genuine current owners of those six-row bundles -- their content, facets, and prose match exactly. Fault Line Follies (08-16) and The Deep Shift/kelp-ink-transfer (08-21) had lost their original live rows to an earlier remaster/revision pass that cross-assigned another proposals content onto their entity IDs, with no trace of where their real originals went. Reset both stale bundles to status: outline and removed their now-false built-data block so they stop claiming another dreams live content; they now fall inside check_daily_dream_pipeline.pys existing poisoned unbuilt guard (too old for the automatic builder to touch) rather than being silently rebuildable-as-corrupted. Verification: audit_dream_record_identity.py --strict clean (0 collisions), full Python test suite (1437 passed, 1 skipped), check_daily_dream_pipeline.py and check_dream_outlines.py both clean, all 24 PR checks green. Rearming recurring maintenance. Silas explicitly approved repairing the two Daily Dream bundles reset by the record-identity collision guard. Rebuild Fault Line Follies and The Deep Shift onto fresh canonical rows, preserve their current authored prose/facets, reuse existing remastered art where safe, and verify unique live ownership before rearming the recurring task. Daily Dream catalog repair completed successfully. Prose repair audited and rewrote 33 built bundles with 0 prose complaints remaining. Record-identity repair preserved all 12 rightful Boundary Day / The Silk Bargain owner rows, rebuilt Fault Line Follies onto Dream 5694/5695 + Character 3314 + Rewards 2876/2877 + Scenario 2195, and rebuilt The Deep Shift onto fresh technical slug deep-shift-kelphold with Dream 5718/5719 + Character 3320 + Rewards 2900/2901 + Scenario 2201. Production Daily Dream Identity Rebuild run 33346358206 completed green; strict identity audit reports 0 collisions, strict prose audit reports 0 flagged bundles, pipeline check reports healthy, and 0 new ArtJobs were created. Durable evidence commit eebfde863 records the completed receipt. Re-arm this recurring maintenance task. RAN (conductor scheduled Agent run, session claude-scheduled-20260903T-dc-t006): flagged stale by select_role.py (no RAN/NO-OP marker or updated bump since 2026-08-31, 3 days). Read PIPELINE.md's current contract. build_dream_proposal.py --check --fetch: docket holds 1 unbuilt proposal, below the 5-day TARGET_BUFFER_DAYS buffer -- authoring is correctly paused per the docket-not-calendar contract (2026-08-31 change), no hand- authoring due. check_daily_dream_pipeline.py, check_dream_outlines.py, audit_dream_record_identity.py --strict (0 collisions), and dream_prose_quality.py --strict all clean. Checked the last 6 daily-digest.yml runs (2026-08-28 through 2026-09-02): 3 consecutive failures on 2026-09-01 (run 84 scheduled + runs 83/85 workflow_dispatch retries), then a clean scheduled success on 2026-09-02 (run 86). Root- caused rather than assumed benign: pulled full job logs for run 84 -- the 'Author today's next Daily Dream proposal' step (author_dream_proposal.py, LLM-backed) failed both its attempts with 'rejected: completion was not valid JSON: no JSON object in the completion', a transient LLM completion malformation, not a code regression. Every downstream step in the same run (build, Facet attachment, ArtJob submission -- 6/6 queued, evidence commit, digest email) succeeded independently against the older already-staged 2026-08-31-nightfall-pasture proposal; the job only shows red because the top-level gate step correctly surfaces the authoring sub-failure for visibility even though d