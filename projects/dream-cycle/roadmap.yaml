r PR CI, Security Audit, task-event processing, Kind Robots TypeScript, Entity Art Manager, Contract Tests, Layout, and all other triggered Kind Robots checks passed. Durable art jobs must carry both their filesystem destination and their entity attachment target through the queue; entity row slug uniqueness is not enough to guarantee art request/path uniqueness, so the producer now disambiguates those identities separately before enqueue. Root-caused the 2026-08-08 digest's 0/6 previous-bundle art: canonical dream-cycle ArtJobs shared priority 100 with manual Daily Dream and Art Trainer redo work, while Kind Robots claims priority DESC then ID ASC and only applies model affinity within the winning priority tier. Prepared a focused Conductor change reserving priority 200 for canonical/nightly dream-cycle art while preserving unrelated queue behavior. Also verified the digest constructs Kind Robots URLs correctly; Brevo rewrites hrefs to its sendibt2 click-tracking domain after payload generation. Merged silasfelinus/conductor#1915 after all final-head checks completed successfully. Canonical/nightly dream-cycle ArtJobs now use reserved priority 200 above the shared priority-100 interactive/trainer tier; the daily digest runs 30 minutes after the hourly builder and retry watchdog offsets remain aligned. Verified the digest itself emits kind-robots.vercel.app links; received sendibt2 hrefs are Brevo click-tracking rewrites rather than a Conductor URL-generation defect. This event intentionally omits updated so the processor stamps current time, correcting an earlier review event that accidentally carried a future timestamp. Silas reported the 2026-08-09 Daily Dream digest still showed no art for the current proposal and previous completed bundle. Investigating the pre-ArtJob staging queue and digest queue-state reporting. Root cause confirmed: built Daily Dream art requests were staged at the tail of projects/art-prompts.yaml and the auto-art workflow drained generic 