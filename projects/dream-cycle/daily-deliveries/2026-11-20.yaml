- slug: guessable-url-aliases
  title: Guessable contact, help and shop URLs reach real pages
  target: interface-vision
  roadmap_task: t-144
  kind: front-door
  summary: Eleven URLs a first-time visitor might type, such as /contact, /help and /gallery, returned 404; each
    now redirects to the matching About, Art, Sanctuary or Giving page.
  status: shipped
  pull_request: https://github.com/silasfelinus/kind_robots/pull/5416
  checks_url: https://github.com/silasfelinus/kind_robots/actions/runs/44715055903
  checks: passed
  merge_sha: 80196ac9ed4a836461033233232b773471d4d8c8
  verification: Live curl showed 404 for all eleven before the change; verifyFrontDoorRoutes.test.ts checks each
    target is a real tab or page and no alias shadows one. Live redirects not yet re-checked after deploy.
  art:
    status: not-required
  preview_url: https://kindrobots.org/contact
