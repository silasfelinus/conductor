    pages could share Welcome to Kind Robots; the fallback is now guarded per route.
  status: shipped
  pull_request: https://github.com/silasfelinus/kind_robots/pull/5416
  checks_url: https://github.com/silasfelinus/kind_robots/actions/runs/44715055903
  checks: passed
  merge_sha: 80196ac9ed4a836461033233232b773471d4d8c8
  verification: verifySharePreview.test.ts forbids the bare pageStore.subtitle fallback and requires the describesPath
    guard.
  art:
    status: not-required
  preview_url: https://kindrobots.org/
