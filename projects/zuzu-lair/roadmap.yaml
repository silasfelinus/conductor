# Zuzu's Lair -- a quick-time animated adventure starring Zuzu (Silas, 2026-10-06).
# Scaffolded via intake.py; brief in DESIGN-BRIEF.md; chapter graphs in chapters/<nn-slug>/SCENES.yaml.
project: zuzu-lair
kind: software
goal: >-
  A free browser quick-time adventure on Kind Robots starring Zuzu the koala ronin: an opening
  animation, timed moments that branch into success or death animations, and a closing animation, with
  sound, flash assist, optional on-screen buttons, difficulty and a leaderboard -- chapter 1 accepted by
  Silas and playable publicly.

notes_from_silas: |
  2026-10-06, verbatim: "And finally this one will need its own independent project: dragons lair. This
  will use a quick time system, with our animation creator making multiple paths depending on buttons
  pressed in time or not. This can use our character zuzu as we already have some work done with the
  characters, create first and last animations that then branch into success and death animations. Will
  need sound, optional on screen button and flash assist, etc."

  2026-10-06, answering t-002, verbatim: "Yes on dry gulch. Dragons lair had pretty cartoonishly
  violent deaths, I'd aim for that level. We have 2-5 second clips that we can generate, so that should
  be the sweet spot for what a death animation runs to. Yes on arcade cabinet, yes on growing each
  chapter."

