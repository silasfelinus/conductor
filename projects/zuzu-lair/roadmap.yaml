    title: "kind_robots: pure QTE engine + contract test (utils/zuzuLair/)"
    status: claimed
    owner: worker
    passes: 0
    stakes: reversible
    depends_on: [t-003]
    note: >-
      Framework-free TypeScript, no DOM: scene-graph types mirroring SCENES.yaml (ported as a typed TS
      module), a pure reducer for the run (node, clip time, window open/closed, lives, score, deaths,
      continues), input judging (right button inside the window -> success; wrong button or timeout ->
      death; early presses before the window are ignored on Assist, count as wrong on Classic), scoring
      (earlier in the window = more points, no-death and time bonuses), and difficulty (Classic window vs
      Classic + assist_extra). Contract test under utils/scripts/ run by tsx in contract-tests.yml, like
      verifyArcadeEngine.test.ts: walks a full perfect run, a run with every death, timeout and wrong
      button, continue after game over, and validates the graph (every target id exists, no orphan nodes,
      windows inside clip length).
