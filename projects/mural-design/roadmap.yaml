project: mural-design
kind: content
goal: >
  Iterate toward the perfect hand-paintable mural design for Silas's fence update,
  then turn the chosen concept into a practical grid, palette, paint plan, and
  companion WonderLab coloring tool for testing color assignments before painting.
waypoints:
  - Capture the current preferred direction and constraints.
  - Generate a fence-only coloring-page asset set from the first-draft mural image.
  - Build a WonderLab coloring page that lets fence sections be assigned by reusable color id.
  - Select and refine a final mural composition and color assignment set.
  - Produce a flat-color palette, grid plan, and execution checklist for repainting.
notes_from_silas: >
  This is one of Silas's most heartfelt projects: update the fence mural that became
  a Pokestop. Continue iterating on designs until the right mural emerges. The core
  direction is a refreshed Catbus on the right, a secret Totoro-like spirit in an ivy
  portal on the left, normal-sized hidden soot sprites, rainbow butterflies, Kind
  Robots-style robots, and stylized greenery with a slightly alien landscape feel.

  The mural must remain achievable for a non-expert painter using a grid. Prefer flat
  single-color sections, thick black outlines, minimal shading, strong silhouettes,
  and clear paintable shapes. Avoid overcomplicated detail and avoid the giant soot
  sprite direction; small hidden sprites work better.

  Silas uploaded current and first-draft image files in the project root. Future design
  and comparison work should use the current image as the physical fence baseline and
  the first-draft image as the rough design/color reference to improve.

  Palette update from Silas, 2026-07-07: choose specific non-sun-fading exterior colors
  from the PPG Voice of Color deck. The palette needs three greens for leaves
  (yellowish green, true green-green, and blueish green), thick black linework,
  off-white for random beings and Totoro's belly, yellow for Catbus eyes, orange for
  Catbus skin, brown for Catbus secondary color, robin blue/teal for Catbus windows,
  purple and violet for butterfly accents, and gray for robot parts plus Totoro body.
  The background was brick red, but should move closer to purple, magenta, or wine-red
  if the foreground colors can still pop. Favor an overall blueish tint to account for
  outdoor sun-fading limits.

  Product direction from Silas, 2026-07-09: build a front-end page under the Kind Robots
  wonder key / WonderLab that uses projects/mural-design/firstdraft.jpg as the source
  reference, turns the painted fence into a coloring-page layer, lets each fillable
  mural section be assigned by color id, and supports setting or globally swapping color
  ids. The surrounding environment must remain colored; only the actual fence and
  anything painted on it changes color, including the fence background.
