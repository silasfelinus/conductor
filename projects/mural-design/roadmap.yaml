project: mural-design
kind: content
goal: >
  Iterate toward the perfect hand-paintable mural design for Silas's fence update,
  then turn the chosen concept into a practical grid, palette, and paint plan.
waypoints:
  - Capture the current preferred direction and constraints.
  - Generate focused design variations through the art pipeline.
  - Select and refine a final mural composition.
  - Produce a flat-color palette, grid plan, and execution checklist for repainting.
notes_from_silas: >
  This is one of Silas's most heartfelt projects: update the fence mural that became
  a Pokestop. Continue iterating on designs until the right mural emerges. The core
  direction is a refreshed Catbus on the right, a secret Totoro-like spirit in an ivy
  portal on the left, normal-sized hidden soot sprites, rainbow butterflies, Kind
  Robots-style robots, and stylized greenery with a slightly alien landscape feel.

  The mural must remain achievable for a non-expert painter using a grid. Prefer flat
  single-color sections, thick black outlines, minimal shading, strong silhouettes,
  and clear paintable shapes. Avoid overcomplicated detail and avoid the giant soot
  sprite direction; small hidden sprites work better.
