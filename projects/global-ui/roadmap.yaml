    design observable and giving humans + AI a shared token/class vocabulary to iterate in. Companion
    recommendation to Silas: adopt code-native design (DaisyUI tokens + this gallery + screenshot-driven
    iteration) as the primary path; Canva for marketing art only; Figma optional/later.

