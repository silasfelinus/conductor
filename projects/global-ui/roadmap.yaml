  depends_on: t-011
  updated: '2026-07-06T00:00:00Z'
  note: 'The style plan (t-011) only pays off once components adopt it. Incrementally migrate existing
    panels/cards/pages to the shared .kr-* classes and the surface rules. IMPORTANT FINDING (2026-07-06):
    most high-traffic surfaces are intentionally bespoke, NOT generic panels — the workspace header is a
    translucent bg-base-100/95 + backdrop-blur chrome, login-page is glassmorphism (bg-base-100/88 +
    backdrop-blur-xl + gradient border + rounded-4xl), and the "generic" panels are mostly dashed-border
    empty-states. Do NOT force these onto .kr-panel; that regresses crafted UI. Scope real migration to
    (a) genuinely-generic solid panels and (b) status-callout usages (see t-013). This work needs human
    eyes in a preview deploy per surface — the dev sandbox has no DB, so most data-heavy pages cannot be
    visually verified here. Do it in small reversible passes, screenshotting /ui and the touched views.

    '
