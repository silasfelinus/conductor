- id: t-024
  milestone: m5
  title: Guard the misleading done/totalTasks fallback in conductor-overview-gallery-page.vue's itemFromProjectRecord()
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  note: >
    Kaizen from t-019 (Worker, autonomous hourly conductor cycle, 2026-07-17,
    kind_robots PR #354). t-019 surfaced item.done/item.totalTasks as a
    "N/M done" badge on the top-level project gallery cards. For non-admin
    users, galleryItems falls back to itemFromProjectRecord() when a DB
    Project row has no matching conductorStore entry by conductorSlug --
    that fallback approximates done/totalTasks from DB Todo counts
    (done: record.status === 'DONE' ? 1 : 0, totalTasks: record._count
    ?.Todos ?? 0), NOT real conductor task counts. The existing
    v-if="item.totalTasks" guard hides the badge when that yields 0, but if
    a project has any Todos at all it will render a plausible-looking but
    wrong ratio (e.g. "1/3 done" meaning something entirely unrelated to
    conductor tasks). Either compute a real fallback from a lighter
    conductor summary, or make the badge conditional on the item actually
    having conductor-sourced counts (e.g. a boolean flag set only in
    itemFromProject(), not itemFromProjectRecord()) so the fallback path
    never shows a task-count badge at all.

    RAN 2026-07-18 (conductor-burst rotation): implemented the second option.
    Added `hasConductorTaskCounts: boolean` to ProjectGalleryItem -- `true`
    from itemFromProject(), `false` from itemFromProjectRecord()'s literal
    fallback object (the branch that reuses itemFromProject() when a
    matching conductor project exists still returns `true`, correctly).
    Gated the badge in all three grid/card view modes on
    `item.hasConductorTaskCounts && item.totalTasks`, and replaced the
    previously-unguarded raw `{{ item.done }}/{{ item.totalTasks }}` in the
    list view with a `—` placeholder when the counts aren't
    conductor-sourced. kind_robots PR #382 (branch claude/keen-fermat-szlzfe):
    eslint clean, full-project `vue-tsc --noEmit` reports 0 errors. Could not
    visually verify the four gallery view modes against a preview deploy
    (sandbox has no DB) -- flagged in the PR body as remaining verification.
  claimed_by: claude-conductor-burst-20260718-t024
  claimed_at: '2026-07-18T03:12:23Z'
  updated: '2026-07-18T03:12:23Z'
