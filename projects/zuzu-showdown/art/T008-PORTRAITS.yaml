# zuzu-showdown t-008: portraits for the four fighters with locked canon art, re-posed with Flux Kontext from
# each one's approved front reference so they stay on model: a select-screen bust (square), a VS-screen
# half-body slam (tall), a victory portrait (fighters.yaml victory_poses) and a beaten portrait. The Siblings'
# beaten portrait is the sister shielding her brother, never hurt (fighters.yaml children_rules); every child is
# always fully dressed in their rags. The Coyote's right hand is gone in the game (a knife lashed to the bandaged
# stump), so his prompts say so. The other four fighters get theirs once T012-REFERENCES.yaml's seeds are picked.
# No lettering. Then pixelize them to sit with the sprites (t-008 note). Generated art is pre-approved.
# Sources: Zuzu 242395, the Coyote 242401, the Abbess 242513, the sister 242128 (fighters.yaml references).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
