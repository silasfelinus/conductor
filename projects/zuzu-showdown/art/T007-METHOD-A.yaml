# zuzu-showdown t-007, method A: pose-locked generation. Flux Kontext re-poses Zuzu's reference build
# (A7, ArtImage 242193; Silas: "a7 profile right is where we want him"), mirrored so he faces right like
# every P1 sprite, into the 15 bake-off frames: idle (4), walk (6) and standing HP, the draw-cut (5).
# One fixed seed across every frame. The backend has no pose-ControlNet workflow yet (filed as an
# engineering task), so the pose lives in each frame's prompt, not a skeleton.
# Post-process: scripts in projects/zuzu-showdown/tools/ (key the off-white background, crop, scale to 72 px,
# quantize to a shared ~24-colour palette). Submit/refresh with scripts/enqueue_art_requests.py
# (dry run by default; --live; --status). Private.
# post_mirror (lane default, per-subject override) is read only by tools/method_a_process.py: Kontext turned
# the first frames back to face left despite the prompt, so they are mirrored after download.
