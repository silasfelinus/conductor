# zuzu-showdown t-032: design references for Jeffery Mittens, the young raccoon looter of Hollow Bell (the
# gamebook's Act II "Boots"; spared, he scouts for the jackals of the dry well in Act IV). Silas, 2026-10-13
# PT, made him a main character of the Zuzu world and a Showdown fighter. Flux Kontext re-poses his gamebook
# plates into a full-body profile facing right, the view the rigs are cut from, and keeps his look: grey fur,
# black mask, ringed tail, grey-green vest over a dirty rolled-sleeve shirt, a brown coat too big for him,
# a string of boots tied round his neck by their laces, a little kitchen knife. Pick one and cut his parts
# sheet from it (next). Prompts never say "human" or "people" (bannedTerms). Generated art is pre-approved.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
