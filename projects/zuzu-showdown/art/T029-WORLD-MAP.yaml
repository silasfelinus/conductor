    watering hole in the center of the plain, a green swamp beside it, a mountain range and a red rock canyon in
    the north east, rolling sand dunes in the south east, a ruined stone arch with bones in the eastern badlands,
    a small frontier town with a bell tower in the west, an adobe mission on a hill in the south west, a lone apple
    tree in the north west, a dark starry rift at the far east edge, dotted trails between the places, coffee stains,
    worn edges
