# zuzu-showdown t-029: the wasteland map. One painted map of the Shifting Lands for the character select
# (each side's home pinned on it) and Story mode's travel between fights (a red route drawn across it,
# Indiana Jones style). Silas, 2026-10-10: "a map of the wasteland and their location ... a lot can be
# extrapolated or create what is needed." The geography is extrapolated in kind_robots
# utils/zuzuShowdown/worldMap.ts (PLACES): Hollow Bell and the Lone Apple Tree in the west, the Mission on
# its hill to the south-west, the Watering Hole mid-plain with the mire beside it, Storm Canyon in the
# north-east, the Bone Yard in the eastern badlands, the Dunes to the south-east, the Thin Place at the
# eastern edge. The prompt asks for those landmarks in those places; the game draws the labels and pins,
# so the map itself carries no lettering. Pick the seed whose landmarks sit closest, then tune PLACES to
# it. House lane, three seeds. Submit/refresh with scripts/enqueue_art_requests.py (dry run by default;
# --live; --status). Private. Generated art is pre-approved.
# 2026-10-11: all three house-lane seeds (245002-245004) came back as a landscape scene with a figure
# lying on a parchment, not a map seen from above, so none shipped. The krea2-map lane re-renders them
# from a literal overhead prose prompt; tools/world_map.py ships from that lane.
# SHIPPED 2026-10-11: wasteland-map-3 [krea2-map] (245027), kind_robots#3507, with PLACES/HOMES pinned to
# its landmarks. All three krea2 seeds came back as true overhead maps; seed 3's rift reads best as the Thin Place.
series: zuzu-showdown
project_slug: zuzu-showdown
designer: Zuzu Showdown
is_public: false
