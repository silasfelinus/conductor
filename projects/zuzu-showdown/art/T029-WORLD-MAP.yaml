  prompt_prose: An antique hand-drawn treasure map of a weird west wasteland, seen straight down from above, the
    aged parchment filling the whole frame edge to edge. Ink and sepia watercolor cartography in a flat, even light.
    A winding blue river runs from the top edge to the bottom edge, left of center. A round watering hole sits in
    the middle of the plain with a small green swamp just beside it. A red rock canyon cuts through mountains in
    the upper right. Rolling sand dunes fill the lower right. A ruined stone arch ringed with bleached bones stands
    in the right-hand badlands. A tiny frontier town with a bell tower sits on the left. An adobe mission crowns
    a hill in the lower left. A single apple tree stands alone in the upper left. At the far right edge the parchment
    darkens into a starry violet rift. Dotted trails link every place. Coffee stains and worn, torn edges. Every
    surface bare and unmarked.
