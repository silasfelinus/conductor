    hyena, dog, wolf, bird, cattle, character, anthro, creature, lowres, worst quality, blurry, jpeg artifacts,
    frame, border, vignette, skull, bones
  prompt_tags: scenery, no humans, wide panorama, side view, wide shot, landscape, empty, desolate, night, deep
    red and black sky, embers drifting, firelight glow on the horizon, dark broken badlands, a few stars, smoke
