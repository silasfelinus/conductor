# zuzu-showdown t-009, last batch in the house lane: the Bone Yard (the Hyena Matriarch's, night: the ancient
# ribcage over a bonfire), the Thin Place (the boss's: the sky tearing, a lone door), and the Dunes' midground (a
# half-buried stagecoach; pale sand alone would key away against white). The Dunes' backdrop wants a long golden
# sun, so it renders in the daylight lane (T009E-DUNES-DAY.yaml). No animal words (the first batch's lesson): the
# hyena silhouettes and the floating debris are code. The Bone Yard's midground is the brief's fossil ribcage, so
# only its negative allows bones. Submit/refresh with scripts/enqueue_art_requests.py. Private.
series: zuzu-showdown
project_slug: zuzu-showdown
designer: Zuzu Showdown
is_public: false
is_mature: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author's settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    gritty, dark atmosphere, high contrast, heavy shadows, muted earthy palette, desaturated, weathered
  suffix: western, dusty, dramatic lighting, gritty
  steps: 30
  cfg: 5
  sampler: euler_ancestral
subjects:
