# zuzu-showdown t-012/t-013/t-021: design references for the four fighters with no approved art yet, and the
# boss. Each fighter gets three seeds of a full-body profile facing right in the house look (the round-10 cast
# lane and prompt pattern, CAST-PICKS.md), the same view the Abbess and sister rigs were cut from; the picked
# seed is the source for their Kontext rig parts sheet (T012/T013-*-PARTS.yaml, next), so a seed that drifts
# from fighters.yaml `look` is simply not picked. The boss, The Thing Behind the Door, is drawn on the Thin
# Place stage from cut-out layers: the torn starry door with its eye, a lone tentacle, a grasping tentacle and
# the eye close up, two seeds each. Generated art is pre-approved (t-008 note).
# Word traps (fighters.yaml): never "duster" (use long riding coat); Old Komodo leads with "komodo dragon,
# giant monitor lizard, scaled reptile" and negates koala.
# Komodo seeds 1-3 (243502-243505) drew "monitor" as computer monitors, on a desert scene, with a slim female
# body; seeds 4-6 keep the required lead words and negate the computer, the scenery and the body shape.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
series: zuzu-showdown
project_slug: zuzu-showdown
designer: Zuzu Showdown
is_public: false
is_mature: false
