# zuzu-showdown t-009: stage layers for the first two stages (Hollow Bell, the Watering Hole), in the house
# lane. Each stage is a wide backdrop (sky and the distant land, scrolling slowest) and a midground (the town,
# the pond) drawn on a plain white background so tools/stage.py can key it into a transparent parallax layer.
# The floor strip and the moving parts (smoke, tumbleweeds, the swaying bell, heat shimmer, glints, vultures)
# are hand pixel or code. No lettering: the Hollow Bell arch board is blank and the game letters it in the
# pixel font. 1536x640 is the wide SDXL bucket; three seeds each to pick from.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
series: zuzu-showdown
project_slug: zuzu-showdown
designer: Zuzu Showdown
is_public: false
is_mature: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author's settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    gritty, dark atmosphere, high contrast, heavy shadows, muted earthy palette, desaturated, weathered
  suffix: western, dusty, dramatic lighting, gritty
  steps: 30
  cfg: 5
  sampler: euler_ancestral
