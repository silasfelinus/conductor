# zuzu-showdown t-021: arcade endings. Each fighter's ending is two pixelized stills and a line or two
# (roadmap t-021), shown after The Thing Behind the Door falls: the door slams shut and the stage drops back to
# an ordinary moonlit desert (fighters.yaml boss.defeat). Re-posed with Flux Kontext from the same canon sources
# as their portraits (T008-PORTRAITS) so they stay on model, now set in a place instead of on a dark ground.
# Children rules hold: the Siblings are together, safe, fully dressed; the toddler's own pose (243484) is
# stitched in beside his sister as in the portrait rerolls. The Coyote's right hand is gone (a knife lashed to the
# stump). The Swamp Witch is always fully robed. No lettering; the ending lines are drawn by the game.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Generated art is pre-approved (Silas, 2026-10-10: "submit anything else that is needed").
