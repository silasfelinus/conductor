# zuzu-showdown t-009: the Bone Yard's midground again. All three T009D "ribcage of an ancient giant beast" renders
# drew the whole beast (a skeletal lizard, alive-looking): naming the beast summoned it, the same lesson as the
# first batch's cow skull. These ask for the ribs alone, as ruins, and the negative bans every creature word and
# body part. Three seeds. Submit/refresh with scripts/enqueue_art_requests.py. Private.
# Second try (seeds 4-6): seeds 1-3 asked for ribs "like the arches of a ruined cathedral" and drew stone
# cathedral ruins instead (243171, an arch over a campfire, is the fallback). These ask for the bones plainly
# and ban cathedrals, stone and architecture.
