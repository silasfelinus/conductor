# zuzu-showdown t-009, second batch: layers for the Mission (the Abbess, moon-blue night), the Lone Apple Tree (the
# Siblings, noon) and Storm Canyon (Storm Crow), in the house lane. Same recipe as T009-STAGES.yaml: a wide backdrop
# and a midground on plain white for tools/stage.py to key. Two backdrop seeds and three midground seeds each.
# Lesson from the first batch: a "bleached cow skull" in the pond prompt brought a whole longhorn into every render,
# so these prompts name no animal or animal part and the negative bans them (the nuns, apples, crows and the
# merry-go-round's turning are hand pixel or code). No lettering.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
series: zuzu-showdown
project_slug: zuzu-showdown
designer: Zuzu Showdown
is_public: false
is_mature: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author's settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    gritty, dark atmosphere, high contrast, heavy shadows, muted earthy palette, desaturated, weathered
  suffix: western, dusty, dramatic lighting, gritty
  steps: 30
  cfg: 5
  sampler: euler_ancestral
subjects:
- key: ms-backdrop-1
  entity: the-mission
  title: Mission backdrop (seed 1)
  size: 1536x640
  seed: 909401
  negative: text, letters, words, sign text, watermark, signature, logo, humans, people, person, animals, animal,
    skull, bones, cattle, cow, bird, character, anthro, creature, lowres, worst quality, blurry, jpeg artifacts,
    frame, border, vignette
  prompt_tags: scenery, no humans, wide panorama, side view, wide shot, landscape, empty, desolate, night, moonlit
    desert, full moon high in a deep blue night sky, thin silver clouds, cold moon-blue light, distant dark hills
    on a low horizon, flat empty desert floor
