# zuzu-showdown t-028: design references for the Swamp Witch, the Thing Behind the Door's avatar (fighters.yaml
# swamp-witch). She began as a happy accident: the house-lane boss seeds drifted into a figure on a coil of
# tentacles (243510, 243511) and a grey wet face with the door's yellow slit eye (243512, 243513), and Silas
# (2026-10-10) made her a fighter. Flux Kontext re-poses those seeds into a full-body profile facing right, the
# view the rigs are cut from, and robes her: she is always fully covered by the ragged shawl, gaunt and eerie,
# never glamorous. Seed 243508 is not used. Prompts never say "human" or "people" (bannedTerms). Pick one and cut
# her parts sheet from it (next). Generated art is pre-approved (t-008 note).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
