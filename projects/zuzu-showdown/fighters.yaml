boss:
  slug: thing-behind-the-door
  name: The Thing Behind the Door
  playable: false
  stage: the-thin-place
  look: >-
    The convent's tentacled horror (BOOK-ONE.md cast): dark and cosmic, half through a portal, never
    fully seen. A torn door of starry dark hangs over the stage; one vast eye, tentacles and teeth come
    through it.
  phases:
    - "Phase 1: tentacles slam and sweep from the portal; the eye fires a beam you dodge through."
    - "Phase 2 (below 50%): the door widens; grasping tentacles try command grabs; minor portals open at the floor."
    - "Phase 3 (below 20%): the eye comes close enough to hit directly; hits to the eye do double."
  defeat: The door slams shut, and the stage drops back to an ordinary moonlit desert.
  lines: "No words. The tentacles leave diegetic marks only; the screen shows the challenger's line alone."
