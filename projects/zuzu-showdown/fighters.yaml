# Zuzu Showdown -- roster data (v1, 2026-10-06)
#
# The source of truth for every fighter's kit. The kind_robots engine ports this into typed
# fighter modules (utils/zuzuShowdown/fighters/<slug>.ts) and refines the frame data there;
# when a number changes in the engine, update it here in the same PR so the two never drift.
#
# Canon and look: projects/comic-creator/issues/zuzu-koala-assassin-01/ (CAST-PICKS.md,
# VIDEO-GUARDRAILS.md). bannedTerms apply to every name, line and prompt in this file.
#
# Notation (Street Fighter numpad-free shorthand):
#   QCF  down, down-forward, forward      QCB  down, down-back, back
#   DP   forward, down, down-forward      HCB  forward ... back (half circle)
#   360  full circle                      [b]f charge back 45f, then forward
#   [d]u charge down 45f, then up         dd   down, down
#   P / K any punch / kick, LP HP LK HK specific button, D dodge
# triangle: which side of the Strike / Grab / Guard triangle the move is on.
# speed: fast <= 5f startup, medium 6-12f, slow >= 13f (starting values; the engine tunes).
# Damage is out of the default 1000 health, before scaling.

defaults:
  health: 1000
  meter_bars: 3
  normals:
    # Starting frame-data template; each fighter scales it with walk_speed/reach notes below.
    stand_LP: {startup: 4, damage: 30, chain: [LK, HP, HK]}
    stand_LK: {startup: 5, damage: 35, chain: [HP, HK]}
    stand_HP: {startup: 8, damage: 70, chain: [HK], cancel: special}
    stand_HK: {startup: 10, damage: 80, cancel: special}
    crouch_LP: {startup: 4, damage: 25, hits: low-or-mid}
    crouch_LK: {startup: 5, damage: 30, hits: low}
    crouch_HP: {startup: 7, damage: 70, note: anti-air}
    crouch_HK: {startup: 9, damage: 80, hits: low, note: "launcher (jump-cancel into an air chain)"}
    jump_LP: {startup: 4, damage: 35, note: "flying punch, light"}
    jump_HP: {startup: 7, damage: 75, note: "flying punch, heavy; air-combo finisher knocks down"}
    jump_LK: {startup: 4, damage: 35, note: "flying kick, light; cross-up on most fighters"}
    jump_HK: {startup: 7, damage: 80, note: "flying kick, heavy"}
    throw: {input: "LP+LK close", damage: 120, triangle: grab}
  dodge:
    forward: "roll through, strike/projectile-invulnerable frames 3-14, grabbable recovery 15-22"
    back: "sidestep back, invulnerable 2-10, grabbable recovery 11-18"
  combo_breaker: {cost: 2, note: "knocks the attacker back; not during a super"}

# Rule for every fighter: against the Siblings, any move flagged `fling_vs_siblings: true`
# swaps its bite/stab/swallow/roll animation for the sister being thrown clear (same damage).

fighters:
