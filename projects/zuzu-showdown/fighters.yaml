      - name: Falling Leaf
        input: DP+P
        triangle: strike
        speed: fast
        damage: 110
        description: Rising cut, invulnerable on startup with HP. The anti-air reversal.
      - name: Kasa Toss
        input: QCB+P
        triangle: strike
        speed: medium
        damage: "50 out, 40 back"
        description: Throws his straw kasa as a boomerang; it hits going out and coming back. Bareheaded until it returns (and he can't toss again).
      - name: Poncho Veil
        input: QCB+K
        triangle: guard
        speed: fast
        damage: 100
        description: Parry stance behind the poncho. Catches a strike and answers with one cut; whiffs and is wide open against a grab.
      - name: Descending Cut
        input: "QCF+P in the air"
        triangle: strike
        speed: medium
        damage: 80
        description: Drops diagonally with a downward slash; an overhead on landing.
    supers:
      - level: 1
        name: Thousand-Mile Step
        input: QCF QCF+P
        damage: 280
        description: Dashes through the opponent, freezes with his back to them, sheathes; they fall on the click.
      - level: 3
        name: Hat to the Dead
        input: QCB QCB+HP
        damage: 420
        description: >-
          Eye-strip cutaway (SF1) of Zuzu's narrowed eyes under the brim, then black. One white slash
          line crosses the screen. Lights up: he is already sheathing, and lifts the kasa off his head.
    intro: Steps out of heat shimmer, thumb resting on the scabbard mouth.
    taunt: Slowly sets his kasa straight with one finger. Doesn't look at you.
    victory_poses:
      - Sheathes the katana with a click and takes the kasa off to the fallen.
      - Turns his back and walks off-screen without looking back.
    perfect_pose: Never drew. Brushes dust off the poncho and walks away.
    ko_pose: Drops to one knee, then forward; the kasa rolls away on its brim and spins down.
    vs_siblings_win: Leaves a strip of dried food within the sister's reach and walks away (Book One ch. 3).

