# Zuzu Showdown -- a 2D pixel-art fighting game in the world of Zuzu: Koala Assassin (Silas, 2026-10-06).
# Scaffolded via intake.py; brief in DESIGN-BRIEF.md; roster in fighters.yaml; lines in matchups.yaml.
# Code lives in kind_robots (utils/zuzuShowdown/, components/zuzu-showdown/, /play/zuzu-showdown).
project: zuzu-showdown
kind: software
goal: >-
  A free browser 2D pixel-art fighting game on Kind Robots in the world of Zuzu: Koala Assassin --
  eight fighters (Zuzu, Coyote Vagrant, the Abbess, the Siblings, Storm Crow, River Croc and two more)
  with motion-input specials, a Level 1 and a Level 3 super each, chain combos and launchers, a
  strike/grab/guard triangle, life bars and a three-bar meter, animated parallax stages, matchup-specific
  pre- and post-fight lines, victory and KO poses, Arcade (with a boss), Versus and Training modes, on
  keyboard, gamepad and touch -- accepted by Silas and listed in the Arcade hall.

notes_from_silas: |
  2026-10-06, verbatim: "new arcade game project, this will be another distinct project, possibly our
  largest yet: I want a 2d fighting game styled like street fighter/skullgirls/marvel v capcom, in the
  world of Zuzu Koala Assassin. Characters should include Zuzu, Coyote Vagrant, The Abbess, the
  Siblings, Storm Crow, the River Croc, and a couple others. We'll need special moves per character,
  styled like street fighter or mortal kombat, a combo system, and some sort of paper rock scissors level
  of strategy. moving background animations, pixelly art graphics, punch, kick, dodge, flying kick,
  flying punch animations, plus special moves, victory and death poses, taunt screens before and after,
  customized lines per each matchup (aim for 8 starting fighters), life bars, special meter, unique
  super attacks."

  2026-10-06, answering t-002, verbatim: "Love the two additions, tentacle monster is the perfect boss.
  Sibling rules are great."

  2026-10-07, answering t-002, verbatim: "He should be without his hand. Yes on knockout tone, this is a
  lighter game than the mature comic. More street fighter than mortal kombat. Zuzu Showdown works for
  me. Sounds good on defraying online for later"

