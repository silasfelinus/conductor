  # ---------------------------------------------------------------- m2 ENGINE
  - id: t-003
    milestone: m2
    title: "kind_robots: deterministic fight sim core + contract test (utils/zuzuShowdown/)"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: >-
      Framework-free TypeScript, no DOM, see DESIGN-BRIEF.md "Engine architecture". A fixed 60 Hz step
      `step(state, p1Input, p2Input) -> state` over plain serializable state with integer/fixed-point
      math (no Math.random -- a seeded PRNG in state). Fighter data types (animations as per-frame
      hitbox/hurtbox/pushbox lists, cancel windows, properties), pushbox separation and corners, walking,
      jumping (up/forward/back arcs), crouching, blocking high/low (hold back), hit and block stun,
      hitstop, knockdown and wake-up, throws and throw tech, rounds (best of three, 99 s timer, KO, time
      over, double KO), and a state hash. Two placeholder fighters (rectangles with real boxes and the
      default normals from fighters.yaml) so the sim is exercised. Contract test under utils/scripts/,
      run by tsx in contract-tests.yml like verifyArcadeEngine.test.ts: walk/jump/block/throw cases,
      round flow, and a determinism replay (one input log run twice, equal hashes at every frame).

      2026-10-07: implemented in silasfelinus/kind_robots#3291 (utils/zuzuShowdown/ sim core,
      placeholders, verifyZuzuShowdownSim.test.ts with 30 checks incl. determinism replay).

      2026-10-07: merged silasfelinus/kind_robots#3291 with all 30 CI checks green.
