  # ---------------------------------------------------------------------------
  # m5 COMPREHENSION — added 2026-09-19 from Silas's reopening request.
  #
  # Verbatim ask: "i want an evolution of the mandarin project. we curently have a pretty
  # good flashcard system. like, really developed. And I want something eventually closer
  # to duolingo, but I don't want to recreate duolingo, as that is both insistent and
  # focused on interactions, notifications, nudges, etc. I want something that actually
  # trains people to learn mandarin. My interest is academic and I REALLY love learning how
  # the symbols represent different ideas. Like, how shuo (speak) and teach have the same
  # pinyin. I want a tutorial page for each of the words that we teach, and a system where
  # we only show flashcards after showing the instruction that shows the pinyin plus what
  # each aspect represents, with historical info. We should also add a point system, which
  # may require a user upgrade to the schema."
  #
  # Two design decisions Silas made in the same session, when asked:
  #   * The learn-before-drill gate is SOFT. Un-lessoned cards sort to the back of the study
  #     queue and the card offers "Learn this first", but nothing ever blocks a drill. He
  #     explicitly did not want the hard gate (a fresh account facing an empty deck) or
  #     per-deck gating flags.
  #   * Points reward LESSON COMPREHENSION + RECALL, weighted by SRS difficulty, so
  #     re-drilling an easy card earns almost nothing and real recall of a lapsed card earns
  #     a lot. He explicitly did NOT select daily streaks / daily point targets -- that is
  #     the Duolingo nagging mechanic his own request rules out -- and did not select the
  #     phonetic-series completion bonus (filed as t-025, waiting, not ready).
  #
  # Note on the example in the ask: 说 shuō (speak) and 教 jiāo/jiào (teach) do not in fact
  # share a pinyin reading, so the request should not be implemented as a homophone feature
  # alone. The structural pattern Silas is describing is the PHONETIC SERIES -- families of
  # characters built on a shared sound component, e.g. 青 qīng giving 请 qǐng, 清 qīng,
  # 情 qíng, 晴 qíng, or 兑 duì giving 说 shuō and 税 shuì. That relationship is already in
  # every card's `components` array as `role: 'phonetic'` (sourced from Make Me a Hanzi's
  # etymology.phonetic) and has never been surfaced or grouped. It is the highest-value
  # academic payoff available from data the project already holds, so t-022 makes it a
  # first-class part of every lesson and t-024 turns it into a browsable index. Lessons also
  # surface true homophone groups separately, so the "same pinyin" observation is answered
  # honestly rather than conflated with the sound-component relationship.

  - id: t-022
    milestone: m5
    title: "Teach the word first: per-word lesson pages with pinyin anatomy, component roles, and phonetic series"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      The component/etymology data m2 already fetches (Make Me a Hanzi decomposition,
      etymology.semantic / etymology.phonetic, dictionary radical, IDS leaves) is currently
      buried behind a `<details>` labelled "Parts & history" that only opens AFTER the learner
      has been drilled. Silas's request inverts that: instruction first, flashcard second.

      Build `utils/mandarinLesson.ts` as a pure derivation over a MandarinCard plus the rest of
      the catalog, producing: (1) pinyin anatomy per syllable -- initial, final, tone number,
      tone contour, and the third-tone sandhi already computed by
      `parsePinyinToneTargets`; (2) per-character component roles saying what each piece
      CONTRIBUTES (semantic field, sound clue, indexing radical, structural leaf, or explicitly
      unresolved), reusing the honest "the source makes no claim here" fallbacks
      `server/utils/mandarinCharacterData.ts` already writes rather than inventing mnemonics;
      (3) the character's phonetic series -- other catalog cards sharing the same
      `role: 'phonetic'` glyph, which is the 青 → 请/清/情/晴 relationship Silas actually means;
      (4) true homophone groups, same pinyin syllable with and without tone, kept visually and
      structurally distinct from (3); and (5) the existing history string with its source line.

      Ship it at `/play/mandarin/learn/<key>`. This requires moving `pages/play/mandarin.vue`
      to `pages/play/mandarin/index.vue` -- the URL is unchanged, but Nuxt makes a sibling
      `mandarin.vue` a parent route needing `<NuxtPage />` the moment a `mandarin/` directory
      exists. `utils/projectPlacements.ts` and `content/channels/plan/mandarin.md` reference
      the route string, not the file, so neither needs touching.

      No schema and no writes in this task -- it is pure derivation plus a read-only page, so
      it is verifiable by self-test without a database. Gating and points are t-023.
      Add `utils/scripts/verifyMandarinLesson.test.ts` in the established pure-function style
      (see verifyMandarinSrs.test.ts) and wire it into contract-tests.yml alongside the other
      mandarin self-tests.

  - id: t-023
    milestone: m5
    title: "Soft-gate drilling on comprehension and add the Mandarin point ledger"
    status: done
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-022
    note: >-
      Silas chose the SOFT gate explicitly: un-lessoned cards sort to the back of the study
      queue and the study card offers "Learn this first" with a link to t-022's lesson page,
      but a learner who insists can still drill. Nothing blocks mid-session, and a fresh
      account must never face an empty deck.

      Schema, additive, following every other Mandarin model's established pattern -- plain
      `userId` scalar, no relation added to the already-crowded User model, no native Json
      column: `MandarinLessonProgress` (userId, cardKey, viewedAt, completedAt, unique on
      userId+cardKey) and `MandarinPointEvent` (append-only ledger: userId, cardKey, reason,
      amount, balanceAfter, refType/refId, mirroring KarmaTransaction's shape) plus
      `MandarinLearnerProfile` (userId unique, totalPoints, lessonsCompleted, cardsLearned) as
      the denormalized current-state summary derived from the ledger, exactly as
      MandarinCardProgress summarizes MandarinReviewEvent.

      Silas said the point system "may require a user upgrade to the schema" -- the upgrade
      belongs in this per-domain profile row, NOT in a new User column. `User` already carries
      questPoints, karma, mana, tokens and earnedTokens; a sixth global balance for one study
      surface would be the wrong place, would collide with the kind-economy ledgers, and would
      not be reversible.

      Award rules, per Silas's selection (lesson comprehension + recall, nothing else):
      points for completing a lesson, and points for a recall rating WEIGHTED BY SRS
      DIFFICULTY, so re-drilling a card at a long interval earns near zero and genuinely
      recalling a lapsed card earns a lot. Deliberately NOT in scope: daily streaks, daily
      point targets, notifications, or any nudge mechanic -- Silas ruled those out by name in
      the reopening request ("insistent and focused on interactions, notifications, nudges").

      DONE 2026-09-19. Shipped the SOFT gate (cards whose lesson has been read sort to the
      front of the study queue; unread cards sort to the back and carry a 'Learn this one
      first' prompt, but Reveal answer stays live and the partition is a no-op for a learner
      with no completed lessons, so a fresh account never faces an empty deck) and the point
      ledger. server/utils/mandarinPoints.ts is pure and owns all the arithmetic: a lesson
      read through pays 10 once per card ever (re-completion is idempotent and pays nothing);
      a recall pays base(rating) x dueFactor x lapseFactor x maturityFactor, with hard > good
      > easy because effortful recall is where the learning is, and 'again' paying 0 with
      nothing ever deducted. dueFactor is the anti-grinding rule -- a review is scored against
      how much of its scheduled interval actually elapsed, computed from the card's state
      BEFORE the upsert, so re-drilling an easy card pays the 1-point floor while the same
      card actually due pays full value, and a late review caps at 1 rather than rewarding
      neglect. Schema is additive and per-domain (MandarinLessonProgress, MandarinPointEvent
      append-only ledger, MandarinLearnerProfile summary), all on the plain userId ownership
      scalar: the 'user upgrade' Silas asked about is deliberately NOT a sixth balance column
      on User alongside questPoints/karma/mana/tokens/earnedTokens. Streaks, daily targets and
      nudges were ruled out by name and MandarinLearnerProfile carries no streak or last-
      active field on purpose. Verified: vue-tsc exit 0; new test:mandarin-points self-test
      wired into contract-tests.yml covering the grinding exploit, the lapsed-card payoff, the
      neglect cap and clock-skew edges; Replay migrations on MariaDB green in CI against a
      real database; schema-migration-parity, no-prisma-json-cast and migration-drift-check
