project: mandarin-tutor
kind: software

goal: >
  A visual Mandarin learning system in Kind Robots that teaches vocabulary, pronunciation,
  character structure, and trustworthy character history together: image-backed flashcards,
  component-aware explanations, audio, curated study sets, custom/requested words, durable
  art generation, and measurable progression toward official Mandarin proficiency tests.

notes_from_silas: |
  Mandarin learning has been very slow with available resources. The most useful teaching
  pattern is seeing the pieces that make up characters and what those pieces contribute,
  then expanding outward into the whole word. Build an image-based flashcard trainer under
  Play > Mandarin. Each word/card should show simplified Hanzi, pronunciation, translation,
  optional character/component breakdown, and the history of how the written form developed.
  Requested words should create a translation card and an appropriate Krea 2 image request.
  Provide useful built-in sets, user-created sets, and at least 500 word or word-segment cards.
  Every lexical card needs a pronunciation guide and audio. Beginner categories such as
  numbers, animals, family, food, colors, time, places, and common actions should be covered
  broadly. Include a dedicated gambling/casino vocabulary set for Silas's work. Future scope
  should map the curriculum against official Mandarin proficiency tests and support iOS and
  Android clients after the web product is established.
  The catalog also needs an admin curation surface in the same spirit as Coloring Book and
  Cthulhuquarium: browse/search words, sort and filter categories, inspect provenance/media,
  and submit corrections. Keep this deliberately simpler than Coloring Book's edition model:
  one canonical card identity, source data left immutable underneath, and admin overrides plus
  an audit trail rather than multiplying editions of the same word. Treat this as the next
  high-priority Mandarin slice immediately after the tutor-facing requested-word loop.

