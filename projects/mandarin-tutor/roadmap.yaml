      The component/etymology data m2 already fetches (Make Me a Hanzi decomposition, etymology.semantic / etymology.phonetic, dictionary radical, IDS leaves) is currently buried behind a `<details>` labelled "Parts & history" that only opens AFTER the learner has been drilled.

