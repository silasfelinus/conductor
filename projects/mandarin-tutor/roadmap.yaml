      migration for a MandarinCustomSet-shaped table keyed on userId, GET/POST endpoints
      under /api/mandarin/sets, and store wiring that treats localStorage as first-load
      cache/offline fallback rather than the record of truth. artJobs can ride the same
      migration and endpoints or a lighter sibling table -- small integer job-id map keyed
      per user/cardKey. This is the concrete blocker for m4's "portable learning state"
      milestone, not auth, media, or curriculum logic (all three already confirmed
      portable in t-012's audit). DONE 2026-08-26. Merged silasfelinus/kind_robots#2121
