project: digital-storefront
kind: software
goal: >
  Finish the agreed Kind Robots storefront: every catalog item owned by this project is
  actually visible/orderable or intentionally delegated to its owning project, Stripe
  checkout/webhook/fulfillment paths work end-to-end, and the storefront passes a
  responsive visual/layout review before it is marked finished.
notes_from_silas: >
  REWRITTEN 2026-07-05 from my session direction. The store is ACTIVE again. We have
  Stripe — this is now the digital giftshop that replaces or expands the site's current
  gift shop, built in kind_robots. The v1 catalog is fixed (I chose it, no more
  concept-picking loop): (1) Mermaids of Venice PDF, available immediately once I supply
  the file — it terrifies me, but it's technically a third printing; (2) Kind Robots
  logo on whatever print-on-demand item is orderable first, with waypoints toward
  gallery coordination and an automated user-art swag pipeline; (3) monthly supporter
  subscription; (4) one-time mana top-ups at reasonable levels; (5) an Against Malaria
  giving page that urges users to donate DIRECTLY at https://againstmalaria.com/amibot;
  (6) an example digital website unlock — two DLC packs of generated content built by
  the new packmaker project (working names Uncanny Valor / Arcane Whimsy). HARD RULES
  unchanged: no live Stripe products/prices/webhooks in production, no POD account
  creation, no publishing, no spend without my explicit approval. Old m1/m2 research
  tasks (t-001..t-007) are kept below as history; old waiting tasks t-003/t-004/t-005
  from the concept-picking pipeline were superseded by this direction and removed.
