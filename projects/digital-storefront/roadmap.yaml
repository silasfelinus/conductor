- id: t-031
  milestone: m4
  title: "kind_robots: wire checkout.post.ts's general multi-item cart flow to actually fulfil (Order/OrderItem/Entitlement/PrintJob) whatever it sells"
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  depends_on: t-030
  note: >
    Kaizen from t-030 (kind_robots PR #1004, merged 2026-07-26). The general
    multi-item cart checkout (`server/api/stripe/checkout.post.ts` --
    corrected 2026-08-05 per t-036; this note originally said
    `server/api/store/checkout.post.ts`, which does not exist) sets Stripe
    session `metadata.kind: 'giftshop_checkout'`, which the webhook's
    `handleProductPurchase` dispatch doesn't match against any branch -- so a
    cart purchase of a `print`/`shirt`/`sticker`/`mug` today succeeds at
    Stripe but never creates an `Order`, `OrderItem`, `Entitlement`, or (for
    POD items) a `PrintJob`. Only the single-item, dedicated-route flows
    (`topup.post.ts`, the new `pod-checkout.post.ts`) get real fulfillment
    today; the shared cart checkout is decorative past the Stripe redirect.
    Wire the general checkout's webhook branch to create the same
    Order/OrderItem/Entitlement/PrintJob rows per line item that the
    dedicated routes already create, reusing `handleProductPurchase`'s
    per-product-type branching rather than duplicating it. Reversible,
    Stripe test-mode only, no live payment/vendor action.

    DONE 2026-07-26 (claude-conductor-scheduled-20260726T083600Z-ds-t031): research first
    (before writing code) surfaced two real complications the note above didn't anticipate:
    (1) `handleProductPurchase` is a single-Product-per-session handler keyed on
    `metadata.productSlug` -- a multi-item cart session needs a materially different shape,
    since Stripe Checkout Sessions carry one flat `metadata` object at the *session* level but
    multiple line items. Confirmed via the Stripe SDK's own type definitions
    (`node_modules/stripe/esm/resources/LineItems.d.ts`) that the `LineItem` objects returned
    by `checkout.sessions.listLineItems()` carry their own per-line `metadata` field (distinct
    from `price_data.product_data`), which `checkout.sessions.create()`'s line item params also
    accept -- so `checkout.post.ts` now stamps `metadata: { giftshopType: id }` on each line
    item, and a new `handleGiftshopCartPurchase` webhook handler (dispatched on
    `session.metadata?.kind === 'giftshop_checkout'`, kept separate from
    `handleProductPurchase` rather than overloading it) reads it back per line via
    `listLineItems` with no `expand` needed. (2) The client cart already tracks a real
    `artImageId` per item (`stores/cartStore.ts`'s `CartItem` interface), but `checkout()`
    drops it before sending to the server (`{ id: item.type, quantity }` only) -- so there is
    no real, eligibility-checked art to attach a `PrintJob` to for print/shirt/sticker/mug/book
    today. Filing a `PrintJob` against a fabricated `artImageId` would misrepresent what art is
    being printed, so split that off as `t-033` rather than guessing. Implemented for this
    task: every general-cart purchase now creates a real `Order` + one `OrderItem` per line
    item (upserting a generic `Product` row per `stores/seeds/cartItems.ts` catalog type,
    server-trusted price, same idempotency pattern as `handleProductPurchase` -- check-then-
    transact, backstopped by `Order.stripeSessionId`'s unique constraint). Additionally
    credits real mana for `tokens`-type line items (mirroring `handleManaTopup`'s
    `PURCHASE`-reason pattern) since an audit-only record would mean charging real money for
    "100 Boost Tokens" and granting nothing -- extended `applyMana` (`server/utils/mana.ts`)
    to accept an optional `tx` parameter so this commits atomically inside the same
    transaction as the Order/OrderItem write, rather than opening a second, non-atomic
    transaction (a small, backward-compatible signature change; every other existing caller
    is unaffected). `donation` and POD-mapped types (print/shirt/sticker/mug/book) get
    Order/OrderItem only in this pass -- correct behavior, not a gap, for donation (nothing to
    "own"); genuinely deferred for the POD types, tracked as `t-033`. Verified: `npx eslint`
    clean on all three changed files; `npx prettier --check` clean; full-project `vue-tsc
    --noEmit` (0 errors, after fixing one real type error -- the `GIFTSHOP_TYPE_TO_PRODUCT_TYPE`
    map's keys must match `stores/seeds/cartItems.ts`'s narrower `CartItem['type']`, not the
    similarly-named but broader client-side `stores/cartStore.ts` `CartItem` interface, which
    also declares `extra`/`subscription` types that don't exist in the trusted server catalog);
    `verifyNoPrismaJsonCast.ts` and `verifyFetchGenericPinning.ts` both pass. Could not exercise
    a live Stripe test-mode click-through from this sandbox (no `STRIPE_SECRET_KEY`/
    `STRIPE_WEBHOOK_SECRET`) -- the per-line `metadata` round-trip is verified against the
    Stripe SDK's own type definitions rather than a live call. kind_robots PR #1007: all 4 CI
    checks green (TypeScript, Contract verifiers, facet-catalog, GitGuardian) -- merged squash
    `b29064d9`. No review comments. Follow-up split off as `t-033` (real artImageId/PrintJob
    wiring for the four physical-goods cart types).
