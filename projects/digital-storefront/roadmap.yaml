  note: 'DONE 2026-07-15 (claude-burst-2026-07-15-0105, same session as t-008 which unblocked this): wrote projects/digital-storefront/SPEC.md. Design covers Stripe architecture (keep Checkout Sessions, add the missing webhook handler with raw-body signature verification and idempotency via stored event/session ids), new Product/Order/OrderItem/Entitlement Prisma models replacing the imported stores/seeds/cartItems.ts as the trusted price source, secure PDF/DLC delivery via an Entitlement-gated download route (file stays outside public/ and outside the repo, per Silas''s hard rule), mana crediting (first writers for the already-defined but unused PURCHASE/SUBSCRIPTION_GRANT ManaReason values), subscription handling (webhook-driven isMember flip + a real soft-cancel route replacing cartStore.cancelSubscription''s stub), and admin vs user views. Flagged as a soft needs-human per the 2026-07-04 rule -- this is a proposal to refine, not an approved spec; Silas''s hard rules (no live Stripe products/webhooks in production, no POD account creation, no publishing, no spend without approval) are treated as non-negotiable regardless. Suggested a 6-step independently-landable build order ending with the Mermaids of Venice PDF go-live after step 3. Did not claim this via claim_task.py''s live origin/main check -- it was status:waiting on origin/main until this same session''s t-008 completion unblocked it (via resolve_deps.py), so a live check would have failed until t-008''s PR merges; doing both in one session/PR was faster than a blocked round-trip and collision risk is effectively zero since nothing could see this as ready before now.'
