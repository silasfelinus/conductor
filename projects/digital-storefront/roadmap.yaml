- id: t-008
  milestone: m1
  title: Audit the existing kind_robots giftshop/Stripe surface and write STORE-AUDIT.md
  status: done
  owner: reviewer
  passes: 0
  stakes: reversible
  note: 'DONE 2026-07-15 (claude-burst-2026-07-15-0105): wrote projects/digital-storefront/STORE-AUDIT.md. Findings: Stripe checkout/subscribe routes work end to end up to the Stripe redirect but no webhook exists anywhere, so nothing downstream of a successful payment happens (no order record, no mana credit, no isMember flip). The Stripe checkout route prices against stores/seeds/cartItems.ts (7 items) as the real trusted catalog, but giftshop-interact.vue shows a different, unrelated 2-item demo array -- UI and real catalog are out of sync. Roughly half the giftshop components are wired to real state (shopping-cart.vue, mana-wallet.vue, social-publisher.vue, subscription-manager.vue''s start path) and half are alert()/console.log() stubs that look finished but do nothing (cart-interact.vue, credit-purchase.vue, print-swag.vue, subscription-manager.vue''s cancel path). No Order/Purchase/Cart/Subscription/Product Prisma models exist; commerce state lives only on User.stripeCustomerId. No POD vendor integration exists (0% wired). Neither Stripe route has an auth guard (contrast mana/social routes, which do) -- low severity today since nothing downstream trusts the session, but must be closed before a webhook starts crediting mana/membership off userId. Recommended next task: a Stripe webhook handler is the single highest-leverage next step -- every v1 catalog item (PDF delivery, subscription isMember flip, mana top-ups) needs it and none have it. No code changes made; audit only.'
  claimed_by: claude-burst-2026-07-15-0105
  claimed_at: '2026-07-15T01:07:47Z'
  updated: '2026-07-15T01:13:28Z'
