    adds handleProductPurchase to server/api/stripe/webhook.post.ts.

    What it does: when a checkout.session.completed event arrives with
    session.mode === 'payment' and metadata.productSlug set, it looks up the
    Product by slug, then creates an Order + OrderItem + Entitlement in one
    transaction. Idempotent on Order.stripeSessionId (unique constraint from
    t-011's migration) — a redelivered webhook event finds the existing Order
    and returns without double-crediting, same shape as the existing
    handleManaTopup handler for mana top-ups.

