# Launch pack draft for packmaker/t-003 — see SCHEMA.md in this directory for
# the full field reference. Super-powers theme. All items are drafts only
# (no refId anywhere) — writing this file performs no generation, API calls,
# or database writes. Ends at status: needs-human per t-003: Silas approves
# the pack name (may rename) and contents before any generation runs.

schemaVersion: 1
id: uncanny-valor
title: Uncanny Valor
description: >
  A street-level superhero launch pack: two home-turf locations, two tonal
  genres, four powered cast members with distinct origin flavors, and three
  signature gear rewards tied to those characters.
owner: silas
visibility: draft

price:
  hook: dlc

items:
  - id: ironclad-skyport
    type: location
    itemShape: dream
    draftPayload:
      title: Ironclad Skyport
      description: >
        A retrofitted cargo-blimp dock hovering above the old industrial
        district, now serving as an unofficial hero headquarters — half
        landing pad, half squat, entirely held together by donated parts
        and stubbornness.
      generationPrompt: >
        Write a short evocative location description (80-120 words) for
        Ironclad Skyport, a retrofitted cargo-blimp dock turned makeshift
        superhero headquarters above an industrial district, for use as a
        kind_robots Dream (dreamType: LOCATION) description. Emphasize
        scrappy, held-together-by-hand engineering over polished tech.
      artPrompt: >
        A weathered airship dock bristling with mismatched antennas and
        patched gas envelopes, floating above smokestacks at dusk, warm
        window light, painterly comic-inspired illustration.
    notes: Home base location; anchors the pack's street-level tone.

  - id: sublevel-nine
    type: location
    itemShape: dream
    draftPayload:
      title: Sublevel Nine
      description: >
        A decommissioned subway level converted into a containment wing for
        the city's stranger problems — part holding cell, part evidence
        locker for things that don't fit in either category.
      generationPrompt: >
        Write a short evocative location description (80-120 words) for
        Sublevel Nine, a decommissioned subway level repurposed as a
        containment and evidence facility for superhuman incidents, for use
        as a kind_robots Dream (dreamType: LOCATION) description. Favor an
        uneasy, institutional-but-improvised tone over high-tech polish.
      artPrompt: >
        A disused subway platform lined with reinforced cell doors and
        hand-labeled evidence crates, flickering fluorescent light,
        muted teal and rust color palette, moody illustration.
    notes: Secondary location; source of complication-driven plot hooks.

  - id: grounded-heroics
    type: genre
    itemShape: facet
    draftPayload:
      title: Grounded Heroics
      description: >
        Personal-stakes superhero stories about rent, relationships, and
        showing up for your neighborhood — powers are a complication, not
        a solution.
      generationPrompt: >
        Write a one-sentence flavor description for a "Grounded Heroics"
        genre Facet (kind: GENRE), emphasizing personal, street-level
        stakes over cosmic spectacle.
      artPrompt: >
        Abstract genre icon: a cracked shield overlapping a house key,
        muted urban color palette, flat illustration style.
    notes: Default tonal register for this pack's characters and locations.

  - id: bombastic-showdown
    type: genre
    itemShape: facet
    draftPayload:
      title: Bombastic Showdown
      description: >
        Over-the-top set-piece battles where the skyline is the stakes and
        subtlety took the week off.
      generationPrompt: >
        Write a one-sentence flavor description for a "Bombastic Showdown"
        genre Facet (kind: GENRE), emphasizing large-scale, high-energy
        superhero battles.
      artPrompt: >
        Abstract genre icon: a lightning bolt shattering a city skyline
        silhouette, saturated primary colors, flat illustration style.
    notes: Escalation-flavored counterpart to Grounded Heroics.

  - id: volta-ferrin
    type: character
    itemShape: character
    draftPayload:
      title: Volta Ferrin
      description: >
        A former power-plant engineer who survived a grid-failure accident
        as a living lightning conduit — now moonlights as backup muscle
        while trying to keep her old crew's lights on.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Volta Ferrin,
        a former power-plant engineer turned living lightning conduit, for
        use as a kind_robots Character row's flavor text. Suggest a
        class/species and a short list of notable traits (e.g. blunt,
        protective, exhausted).
      artPrompt: >
        Portrait of a wiry woman in a work jumpsuit crackling with faint
        blue-white electricity along her arms, safety goggles pushed up on
        her forehead, industrial backdrop, character concept art.
    notes: Power source ties directly to Ironclad Skyport's improvised tech.

  - id: greyline
    type: character
    itemShape: character
    draftPayload:
      title: Greyline
      description: >
        A disgraced ex-cop who can turn intangible for short bursts, now
        working the same streets from the other side of the badge — equal
        parts penance and unfinished business.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Greyline, a
        disgraced ex-police officer with short-burst intangibility, for use
        as a kind_robots Character row's flavor text. Suggest a
        class/species and a short list of notable traits (e.g. guarded,
        methodical, self-doubting).
      artPrompt: >
        Portrait of a lean figure in a faded grey coat partially phasing
        into translucency at the edges, city alley backdrop at night,
        noir-tinged character concept art.
    notes: Best paired narratively with Sublevel Nine's containment cases.

  - id: bastion-ruk
    type: character
    itemShape: character
    draftPayload:
      title: Bastion Ruk
      description: >
        A gentle giant with near-total invulnerability, drawn to the team
        less for the fighting and more for the excuse to keep helping
        people move apartments.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Bastion Ruk,
        an invulnerable strongman with a gentle disposition, for use as a
        kind_robots Character row's flavor text. Suggest a class/species and
        a short list of notable traits (e.g. patient, soft-spoken, fiercely
        loyal).
      artPrompt: >
        Portrait of a towering broad-shouldered man with weathered stone-grey
        skin texture, work gloves, a warm easy smile, soft daylight,
        character concept art.
    notes: Tonal anchor toward Grounded Heroics.

  - id: echo-vance
    type: character
    itemShape: character
    draftPayload:
      title: Echo Vance
      description: >
        A former touring musician whose voice can now shatter glass or calm
        a crowd, depending on which show they're putting on that night.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Echo Vance, a
        former musician with sound-manipulation powers, for use as a
        kind_robots Character row's flavor text. Suggest a class/species and
        a short list of notable traits (e.g. theatrical, restless, secretly
        anxious about losing their old life).
      artPrompt: >
        Portrait of a stylish androgynous performer with visible sound-wave
        motifs rippling from their hands, stage lighting, character concept
        art.
    notes: Bombastic Showdown-leaning character; pairs with big set pieces.

  - id: ferrin-coil
    type: reward
    itemShape: reward
    draftPayload:
      title: Ferrin Coil
      description: >
        A palm-sized capacitor coil, cool to the touch until it isn't —
        stores a single stored jolt of borrowed current for later use.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Ferrin Coil" (rewardType: ITEM), themed around stored electrical
        power and improvised engineering, connected to Volta Ferrin.
      artPrompt: >
        A small copper-wound coil device with a faint blue glow at its core,
        item-icon style, soft studio lighting.
    notes: Linked conceptually to volta-ferrin; no DreamToReward relation until locations are generated.

  - id: greylines-badge
    type: reward
    itemShape: reward
    draftPayload:
      title: Greyline's Badge
      description: >
        A tarnished precinct badge, edges gone faintly translucent —
        carrying it seems to make its bearer a little harder to notice.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Greyline's Badge" (rewardType: ITEM), themed around quiet
        watchfulness and unfinished justice, connected to Greyline.
      artPrompt: >
        A worn silver police badge with edges dissolving into faint mist,
        item-icon style, cool blue-grey lighting.
    notes: Linked conceptually to greyline.

  - id: bastions-core-fragment
    type: reward
    itemShape: reward
    draftPayload:
      title: Bastion's Core Fragment
      description: >
        A fist-sized shard of stone-grey material, warm as skin — said to
        lend its bearer a measure of Bastion's steadiness under pressure.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Bastion's Core Fragment" (rewardType: ITEM), themed around
        steadiness and quiet endurance, connected to Bastion Ruk.
      artPrompt: >
        A rough-hewn grey stone shard with faint warm inner light along its
        cracks, item-icon style, soft studio lighting.
    notes: Linked conceptually to bastion-ruk.
