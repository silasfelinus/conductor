# Launch pack draft for packmaker/t-003 — see SCHEMA.md in this directory for
# the full field reference. Magic-powers theme, paired with uncanny-valor.yaml.
# All items are drafts only (no refId anywhere) — writing this file performs
# no generation, API calls, or database writes. Ends at status: needs-human
# per t-003: Silas approves the pack name (may rename) and contents before
# any generation runs.

schemaVersion: 1
id: arcane-whimsy
title: Arcane Whimsy
description: >
  A cozy-to-eerie magic launch pack: a hidden market and a moonlit
  observatory as home locations, two tonal genres spanning whimsical and
  wyrd, four spellcasting cast members, and three enchanted-item rewards
  tied to those characters.
owner: silas
visibility: draft

price:
  hook: dlc

items:
  - id: bramblewick-market
    type: location
    itemShape: dream
    draftPayload:
      title: The Bramblewick Market
      description: >
        A hidden bazaar that only opens on foggy mornings, tucked between
        two buildings that don't quite touch — stalls sell talking teapots,
        secondhand luck, and directions to places that no longer exist.
      generationPrompt: >
        Write a short evocative location description (80-120 words) for The
        Bramblewick Market, a hidden bazaar that only appears on foggy
        mornings between two buildings, for use as a kind_robots Dream
        (dreamType: LOCATION) description. Favor a cozy, whimsical tone with
        a light undercurrent of the uncanny.
      artPrompt: >
        A narrow cobblestone alley market strung with lanterns and fabric
        canopies, stalls overflowing with curious trinkets, soft fog,
        warm painterly fantasy illustration.
    notes: Home base location; anchors the pack's cozy-conjuring tone.

  - id: hollow-moon-observatory
    type: location
    itemShape: dream
    draftPayload:
      title: Hollow Moon Observatory
      description: >
        A cliffside spellcasting academy built around a telescope that
        hasn't pointed at a real star in decades — its lenses show
        somewhere else entirely, and the faculty have opinions about where.
      generationPrompt: >
        Write a short evocative location description (80-120 words) for
        Hollow Moon Observatory, a cliffside magic academy whose central
        telescope shows an uncanny otherworld instead of the sky, for use
        as a kind_robots Dream (dreamType: LOCATION) description. Favor an
        eerie, wyrd tone appropriate for a higher-stakes counterpart to a
        cozy market.
      artPrompt: >
        A stone observatory perched on a moonlit sea cliff, an oversized
        brass telescope aimed at a swirling violet aperture instead of the
        stars, atmospheric fantasy illustration.
    notes: Secondary location; source of higher-stakes, Wyrd Peril plot hooks.

  - id: cozy-conjuring
    type: genre
    itemShape: facet
    draftPayload:
      title: Cozy Conjuring
      description: >
        Low-stakes, slice-of-life magic stories about tea, mending charms,
        and small kindnesses done with a wand.
      generationPrompt: >
        Write a one-sentence flavor description for a "Cozy Conjuring"
        genre Facet (kind: GENRE), emphasizing gentle, low-stakes,
        slice-of-life magic.
      artPrompt: >
        Abstract genre icon: a teacup with a swirl of sparkling steam
        shaped like a small star, warm pastel palette, flat illustration
        style.
    notes: Default tonal register for this pack's lighter characters and market location.

  - id: wyrd-peril
    type: genre
    itemShape: facet
    draftPayload:
      title: Wyrd Peril
      description: >
        Eerie, fae-touched danger where the rules of magic bend and the
        bill always comes due, one way or another.
      generationPrompt: >
        Write a one-sentence flavor description for a "Wyrd Peril" genre
        Facet (kind: GENRE), emphasizing eerie, higher-stakes fae-touched
        danger.
      artPrompt: >
        Abstract genre icon: a crescent moon cracked open with thorned
        vines spilling out, deep violet and black palette, flat
        illustration style.
    notes: Escalation-flavored counterpart to Cozy Conjuring.

  - id: marigold-thistlewick
    type: character
    itemShape: character
    draftPayload:
      title: Marigold Thistlewick
      description: >
        A hedge witch who brews potions out of a market stall, more
        interested in fixing small everyday problems than in grand magic —
        though the grand magic keeps finding her anyway.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Marigold
        Thistlewick, a hedge witch and potion brewer working out of a
        market stall, for use as a kind_robots Character row's flavor text.
        Suggest a class/species and a short list of notable traits (e.g.
        practical, warm, quietly stubborn).
      artPrompt: >
        Portrait of a middle-aged woman in a patched apron surrounded by
        floating bottles and dried herbs, warm lantern light, character
        concept art.
    notes: Anchors Bramblewick Market and the Cozy Conjuring tone.

  - id: corvid-nightshade
    type: character
    itemShape: character
    draftPayload:
      title: Corvid Nightshade
      description: >
        An illusionist bonded to a raven familiar who may or may not be the
        one actually in charge — their tricks are gorgeous, unsettling, and
        never quite what they first appear to be.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Corvid
        Nightshade, a raven-familiar-bonded illusionist, for use as a
        kind_robots Character row's flavor text. Suggest a class/species
        and a short list of notable traits (e.g. sly, theatrical, hard to
        pin down).
      artPrompt: >
        Portrait of a slender figure in a feathered cloak with a raven
        perched on one shoulder, faint illusory duplicates shimmering at
        the edges, moody violet lighting, character concept art.
    notes: Wyrd Peril-leaning character; pairs with Hollow Moon Observatory.

  - id: pell-wickstone
    type: character
    itemShape: character
    draftPayload:
      title: Pell Wickstone
      description: >
        An apprentice enchanter at Hollow Moon who is earnest, clumsy, and
        one accidental miscast away from a very interesting afternoon —
        beloved by the market stallholders for the same reason the faculty
        find them exhausting.
      generationPrompt: >
        Write a short character backstory (100-150 words) for Pell
        Wickstone, a well-meaning but clumsy apprentice enchanter, for use
        as a kind_robots Character row's flavor text. Suggest a
        class/species and a short list of notable traits (e.g. eager,
        accident-prone, kind).
      artPrompt: >
        Portrait of a young apprentice in an ill-fitting robe with singed
        sleeve cuffs, sparks fizzling from an overloaded wand, sheepish
        expression, character concept art.
    notes: Bridges both locations; comic relief with real stakes underneath.

  - id: hollow-warden
    type: character
    itemShape: character
    draftPayload:
      title: The Hollow Warden
      description: >
        An ancient moss-covered golem that has guarded the observatory's
        telescope for longer than anyone living can account for — slow to
        speak, slower to trust, and the only one who remembers what the
        telescope used to point at.
      generationPrompt: >
        Write a short character backstory (100-150 words) for The Hollow
        Warden, an ancient moss-covered golem guardian of a magical
        observatory, for use as a kind_robots Character row's flavor text.
        Suggest a class/species and a short list of notable traits (e.g.
        ancient, taciturn, unexpectedly gentle).
      artPrompt: >
        Portrait of a massive stone golem overgrown with moss and small
        flowering vines, glowing faint violet runes across its chest,
        moonlit cliff backdrop, character concept art.
    notes: Wyrd Peril anchor character tied directly to Hollow Moon Observatory.

  - id: thistlewicks-ledger
    type: reward
    itemShape: reward
    draftPayload:
      title: Thistlewick's Ledger
      description: >
        A small leather-bound recipe book whose pages rearrange themselves
        to show whichever potion its holder needs most, whether they asked
        for it or not.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Thistlewick's Ledger" (rewardType: ITEM), themed around practical
        potion-craft and quiet helpfulness, connected to Marigold
        Thistlewick.
      artPrompt: >
        A worn leather recipe book with a pressed flower bookmark and faint
        golden text shimmering across an open page, item-icon style, warm
        lighting.
    notes: Linked conceptually to marigold-thistlewick.

  - id: nightshade-feather
    type: reward
    itemShape: reward
    draftPayload:
      title: Nightshade Feather
      description: >
        A single raven feather that shivers faintly when an illusion is
        nearby — tucked in a pocket, it has a habit of making its bearer
        just slightly harder to look directly at.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Nightshade Feather" (rewardType: ITEM), themed around illusion and
        misdirection, connected to Corvid Nightshade.
      artPrompt: >
        A single glossy black feather with a faint violet shimmer along its
        edge, item-icon style, moody lighting.
    notes: Linked conceptually to corvid-nightshade.

  - id: wardens-lichen-cloak
    type: reward
    itemShape: reward
    draftPayload:
      title: Warden's Lichen Cloak
      description: >
        A cloak woven from moss and lichen scraped from an ancient guardian
        — heavier than it looks, and it seems to steady the nerves of
        whoever wears it near something uncanny.
      generationPrompt: >
        Write flavor text (2-3 sentences) for a kind_robots Reward named
        "Warden's Lichen Cloak" (rewardType: ITEM), themed around ancient
        steadiness and quiet protection, connected to The Hollow Warden.
      artPrompt: >
        A heavy moss-green cloak textured with small lichen patches and
        faint glowing rune-threads along the hem, item-icon style, soft
        moonlit lighting.
    notes: Linked conceptually to hollow-warden.
