- id: t-002
  milestone: m1
  title: Define the pack manifest schema with one worked example
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  depends_on: t-001
  note: >
    DONE 2026-07-15 (conductor-hourly-20260715-1550): schema written as
    projects/packmaker/packs/SCHEMA.md (schemaVersion 1) — top-level pack
    fields (id/title/description/owner/visibility/price) plus a per-item
    schema (type/itemShape/refId/draftPayload/notes). Resolves SPEC.md §7's
    open question at the item level: itemShape lets a character-type entry
    choose dream (lore-only) or character (stat-block) per item rather than
    hardcoding one for the whole pack. price.hook (free|one-time|dlc) maps
    onto digital-storefront's Product/Entitlement design (SPEC §5);
    visibility (draft|released) encodes the interim all-or-nothing isPublic
    rule (SPEC §4) pending kind-robots t-008. Worked example:
    packs/example-starter-pack.yaml, a 4-item draft pack (one location,
    genre, character, reward), validated with a YAML parse check (python
    yaml.safe_load). No generation, API calls, or DB writes performed —
    manifest-only per this task's scope.
  claimed_by: conductor-hourly-20260715-1550
  claimed_at: '2026-07-15T15:51:48Z'
  updated: '2026-07-15T16:05:00Z'
