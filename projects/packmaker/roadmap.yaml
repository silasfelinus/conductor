project: packmaker
kind: software
notes_from_silas: >
  Created 2026-07-05 from my session direction. A dedicated project for the DLC /
  builder-item generator: it will be accessible and repeatable, generating DLC packs
  or general builder items with something that knows the pipeline — a handle tool /
  front end. Packs are collections of generated website items: locations, genres,
  characters, and rewards. Different views for admin and user. Packs can be tied to
  me but private — this is a deliberate, low-stakes proving ground for our
  private-but-shared content security. First deliverable: the two digital-storefront
  launch packs. Working names (two words each, no alliteration, per my naming rule):
  "Uncanny Valor" (the super-powers pack) and "Arcane Whimsy" (the magic-powers pack)
  — I may rename them.
