    updated: '2026-10-25T01:00:23Z'
    note: >-
      Silas 2026-10-24 PT (both notes above; the second supersedes the six-scene pool). Design: the
      week runs in three acts (nights 1-2, 3-4, 5-6) and Halloween. Each night deals two cards and
      the player picks the deck for each: the nightmare's villain deck (cards of the current act,
      harder) or the street deck its kind shares. Beating any villain card of an act earns that
      act's edge; each edge adds +1 to every finale roll and unlocks an edge choice (target 7) that
      remembers the act and counts as fight, trick or heart. Base finale checks are all hard (11);
      Best needs the heart and ten night wins, so first-act failures cost edges but never lock the
      finale.

      Progress 2026-10-24 PT: kind_robots #4129 merged (66 extra villain cards). #4131 merged as
      45d3043: acts, the nightly deck choice, edges (+1 per edge on finale rolls), approach-aware
      endings, the night deck screen, base finale checks at 11, Best at ten night wins. #4134
      merged as 5020e8c: three villain cards per act for every nightmare (198 in all) and three
      finale edge choices each (edge-1 trick, edge-2 fight, edge-3 heart plus the three leads; all
      target 7, each remembering its act). Seeded autoplay: best 65%, good 14%, bittersweet 17%,
      bad 5%. Still to do: regroup the street decks around monster types that read at a glance
      (supernatural, slasher, creature, alien, biohazard, tech, cult, camp, dream, generic suburban
