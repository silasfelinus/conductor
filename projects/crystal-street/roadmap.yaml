  - id: t-018
    milestone: m2
    title: "Acts and villain decks: a deck choice every night, three cards per act, finale edges"
    status: done
    owner: reviewer
    passes: 0
    stakes: reversible
    pr: silasfelinus/kind_robots#4131
    claimed_by: 2026-10-24T135800Z-cs-art-delivery
