# Terrors on Crystal Street: 80s horror-comedy day/night card adventure (Silas, 2026-10-24 PT).
# One week on an idyllic suburban cul-de-sac, twenty-two nightmares, twenty-two companions (ten
# active), illustrated choices, four endings per nightmare and a scrapbook of every run.
# Design: DESIGN-BRIEF.md. Content rules and rosters: WRITING-GUIDE.md.
# Runtime: silasfelinus/kind_robots /admin/crystal-street (admin preview until release).
project: crystal-street
kind: software
autonomous: true
goal: >-
  A full single-screen, console-style horror-comedy card adventure at /admin/crystal-street
  (later /play/crystal-street). A week of seven Days and Nights on Crystal Street against one
  of twenty or more nightmares, each with a backstory, central issue, three leads, three
  signature nights, a fight/trick/heart Halloween finale and four endings (one Best per
  nightmare). Days visit ten locations and a traveling pawnshop for daylight beats, leads,
  training, gear and companions; nights deal signature scenes and tag-deck pulls with
  teleports. Twenty or more companions (ten active) with perks, six emotions, portrait and
  poster art. Every choice has two or more options whose success and failure outcomes are
  illustrated. Every run is recorded in a scrapbook. Queer-positive, PG-13, deterministic and
  seeded, no LLM at play time. Finished only after painted art is delivered for key art,
  cast and scenes, a balance pass, phone/tablet/desktop review, and Silas's acceptance.
notes_from_silas: |
  2026-10-24 PT: "New playbook games concept: Nightmare on Crystal Street style remix, set in
  an idyllic suburb, with creepy but 80's fun exploration of horror, camp, slasher genres,
  queer theatre, and lgbt+ positive themes. The game should involve one week on Crystal
  Street (another name worth considering), that is beset upon by a malevolent entity. There
  should be at least 20 villains, and each game round is either spending actions during the
  Day or Night. During the day, they can visit the library, gym, the traveling pawnshop,
  school, etc, gaining information, solving daylight adventure beats, and developing skills.
  At night they might encounter situations unique to that entity, or randomized pulls from an
  entity's shared tags (a "paranormal" entity such as Screwhead or Frieda Krueger might pull
  from the paranormal encounter deck, which teleports the user to the Junkyard, pulling
  another encounter and facing a maze of endless cars.

  Use Emperor of Dust, ecotone, shifting desks, and shifting lands as guides for level of
  complexity, more ideas, inventory...ooh, companions: we should have at least 20, you can
  keep 10 active max: each follower should have a range of emotions and illustrated and
  poster formats.

  Multiple endings, depending on whether the villains central issue has been explored, and a
  series of interesting encounters have been successfully rolled, the user should get one
  Best ending per antagonist, with all runs recorded in a scrapbook. Full single screen aaa
  console game design. The gameplay variety should involve memorable scenes, captivating back
  stories, and a lot of intriguing choices that have 2+ interesting choices that all have
  positive or negative outcomes that are given art."

  2026-10-24 PT: "Antagonists should start as gender flipped/gender bent variations on
  classic movie villains. They don't all have to be like this, and we're not veering into
  evil tranny tropes, but looking for ways in which the classic monster/slasher tropes leaned
  into stereotypes, and what can be gained dramatically from exploring those stories from
  queerer/different perspectives
  As quickly as possible, I want this prototyped, presented as a front end single screen AAA
  console game interface, with a fully playable day night cycle game and a randomized series
  of encounters that cover the gamut of adventures from the lens of 80's horror cinema looked
  at through a fresh lens"

  2026-10-24 PT: "the cover art for this project should be our gender swapped jason from the
  hollywood monsters recast coloring book project" (approved Masking Up pair,
  projects/coloring-book/sets/monster-recast/approved/masking-up-color.webp).

  2026-10-24 PT: "I like It Came from the Terrors on Crystal Street." Then: "Change to “Terrors on
  Crystal Street”" (the title; closes t-002)

