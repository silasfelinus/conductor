# Terrors on Crystal Street front-end art (crystal-street t-017; Silas, 2026-10-24 PT).
# Built from kind_robots utils/crystalStreet JSON (title-art.json, avatars.json, villain endingPhoto):
#   the idyllic daytime street behind the title ("a white housed suburbia, idyllic");
#   an ending photo for every nightmare in the style of the approved Masking Up cover ("this is the
#   standard we'll use"), which is Counselor Jess's own ending photo and so is not re-rendered;
#   sixteen selectable player avatars in exaggerated poses.
# The runtime looks for /crystal-street/<asset>.webp and draws code-built SVG until delivered;
# delivery is scripts/export_crystal_street_art.py. Prompt contract: positive description only.
# Generated art is pre-approved (AGENTS.md). auto_submit: true. Private.
round: crystal-street-front-1
project_slug: crystal-street
designer: Crystal Street art bay
is_public: false
is_mature: false
cast_loras: false
auto_submit: true
lanes:
- key: street
  label: Krea 2 (idyllic 1980s suburb matte painting)
  engine: krea2
  prompt: prose
