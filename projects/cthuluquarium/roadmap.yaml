project: cthuluquarium
kind: software

notes_from_silas: |
  Long time silly project planned that I've never made happen.

  My inspiration is the absolutely excellent mobile game Insaniquarium (sp?). It was
  one of the first mobile games that actually hooked me.

  I want a darkly funny variant inspired by it. We start with a web-game version.
  It should use simple assets created with our ComfyUI pipeline: aquarium
  backgrounds, different monstrous fish, tappable collectibles, random rare
  experiences, memory, a leaderboard, and browsable aquariums. Each user's aquarium
  should be viewable — they can decorate it, populate it with fish monsters, and
  interact with a gameplay loop where random clickables give coins, which can be
  used to buy food to feed their fish or buy upgrades. Treat this like a beginning
  plan, not the full proposal — research both gameplay loops for idle/incremental
  games and current features for light aquarium experiences, plus what people
  actually want and appreciate in this genre.

  The first completed version is a fully working webpage where users can load and
  interact with their aquariums. Think idle/cookie-clicker style: they can leave it
  running and get pickups, or actively play it and gain resources faster. A second
  tier evolution is an iOS and Android version, and final-final would be Steam, but
  that requires human-gated evolution of tools — don't build toward those yet.

  There is no legitimate reason we can't have a prototype build from our agents with
  proper planning and ComfyUI access (which you should have — if the agents can't
  create assets, that gap becomes part of this workflow, since we're also testing
  our ability to autonomously scaffold this type of project).

  Kind Robots Project record already exists: id 2112, slug `cthuluquarium`,
  conductorSlug `cthuluquarium`, status BRAINSTORM, liveUrl `/aquarium`. Do not
  create another Project record — the next sync will link this roadmap to it via
  conductorSlug.

  The Project's `repoUrl` points at `https://github.com/silasfelinus/cthulhuquarium`,
  a repository outside this session's current GitHub scope (conductor, kind_robots,
  Kapowarr, humboldtscoopsolutions only). Until that repo is in scope, treat actual
  game-client implementation as a cross-repo task per AGENTS.md's "Cross-repo tasks"
  section: preserve patches as a conductor documentation handoff
  (`projects/cthuluquarium/docs/`) rather than improvising a different target
  (e.g. do not fold this into kind_robots itself unless Silas redirects it there).

