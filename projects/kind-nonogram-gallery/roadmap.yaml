# Copy this folder to projects/<your-project>/ to add a project.
# Default scaffold per PROJECT-CREATION.md (approved by Silas 2026-07-04):
# three milestones — SHAPE / BUILD / POLISH & SHIP — with a NON-BLOCKING scope
# gate. Agents build the design brief and start working immediately; scope
# confirmation runs in parallel as a soft needs-human. Two-word slugs preferred.
project: kind-nonogram-gallery
kind: software
goal: "Picture-cross puzzles where row/column clues reveal pixel portraits of Kind Robot species, with a mistake-forgiving mode and a gallery of solved grids that colour in with species palettes; no LLM at runtime."

notes_from_silas: |
  Approved pitch 2026-10-06 (pitches/2026-10-06-kind-nonogram-gallery.md). Free for every
  visitor: no LLM at runtime. Art plan: 30 hand-authored grids + 30 pre-generated colour reveals.

milestones:
  - id: m1
    title: "SHAPE — outline, brainstorm, design brief"
    weight: 25
    status: in-progress

  - id: m2
    title: "BUILD — actualize, adjust, test"
    weight: 50
    status: not-started

  - id: m3
    title: "POLISH & SHIP — aesthetics, performance, delivery"
    weight: 25
    status: not-started

tasks:
  - id: t-001
    milestone: m1
    title: "Write the design brief and start building"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Take the idea and run: write DESIGN-BRIEF.md (what it is, who it serves,
      the creative direction, MVP shape), then immediately create and claim the
      first BUILD tasks. Do NOT wait for scope approval — that's t-002, and it
      runs in parallel.

  - id: t-002
    milestone: m1
    title: "Confirm scope with Silas"
    status: done
    owner: null
    passes: 0
    stakes: reversible
    # AGENTS.md, "Hard vs soft needs-human": scope gates on NEW projects are soft
    # (Silas, 2026-07-04) -- the whole point of this task is that it runs in
    # parallel and blocks nothing. Without soft_gate, audit_human_gates.py
    # classifies it `[hard]` and it reports to Silas as a blocker every session.
    soft_gate: true
    note: >-
      FOR SILAS: soft checkpoint, nothing is blocked on it. Read DESIGN-BRIEF.md
      and confirm or redirect the scope. Development is already underway; if you
      redirect, agents fold your correction into the roadmap and keep moving.
      (Outward-facing/irreversible steps still hard-gate as always.)

      Silas 2026-10-10 in session: scope confirmed as written in DESIGN-BRIEF.md.
    gate_reason: creative-approval
    gate_rechecked: '2026-10-07'
    approved_by_human: true
    updated: '2026-10-10T09:34:39Z'

  - id: t-003
    milestone: m2
    title: "First slice: one 8x8 puzzle with clue generation, tap-to-fill and colour reveal"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Suggested first task from the approved pitch. One 8x8 puzzle stored as a
      bitmap; row/column clues generated from it; tap-to-fill and mark-empty;
      gentle mistake-forgiving mode; on solve, colour the grid with the species
      palette. Lives in silasfelinus/kind_robots; no LLM calls at runtime.
      Verify at phone/tablet/desktop widths.
  - id: t-004
    milestone: m2
    title: "Build an actual admin-only interactive preview"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    source_pitch: "pitches/2026-10-06-kind-nonogram-gallery.md"
    note: "Implement the first executable interaction under an /admin/ route, with an ADMIN tab, contextual tutorial, server authorization, and targeted tests. A scaffold or status URL is NOT a preview. Pitch: Picture-cross puzzles where numeric row and column clues reveal a pixel portrait of a Kind Robot species, with a gentle mistake-forgiving mode. Each solved grid is stored in a gallery and colours in using the species palette."
  - id: t-005
    milestone: m2
    title: "Implement the first playable or usable content slice and art"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    source_pitch: "pitches/2026-10-06-kind-nonogram-gallery.md"
    note: "Produce genuine mechanics/content and queue or reuse verified art through the normal no-unapproved-spend pipeline; test the experience, not only metadata. Pitch: Picture-cross puzzles where numeric row and column clues reveal a pixel portrait of a Kind Robot species, with a gentle mistake-forgiving mode. Each solved grid is stored in a gallery and colours in using the species palette."
  - id: t-006
    milestone: m3
    title: "Polish, verify and request explicit Play promotion"
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    source_pitch: "pitches/2026-10-06-kind-nonogram-gallery.md"
    note: "Review phone/tablet/desktop usability, art relevance and functional checks. Only after a working build and owner approval may a public /play route launch; publishing and outward-facing operations remain human-gated. Pitch: Picture-cross puzzles where numeric row and column clues reveal a pixel portrait of a Kind Robot species, with a gentle mistake-forgiving mode. Each solved grid is stored in a gallery and colours in using the species palette."
    depends_on: t-005
