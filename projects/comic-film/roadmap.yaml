# Copy this folder to projects/<your-project>/ to add a project.
# Default scaffold per PROJECT-CREATION.md (approved by Silas 2026-07-04):
# three milestones — SHAPE / BUILD / POLISH & SHIP — with a NON-BLOCKING scope
# gate. Agents build the design brief and start working immediately; scope
# confirmation runs in parallel as a soft needs-human. Two-word slugs preferred.
project: comic-film
kind: software
goal: "Turn a comic issue's story beats into a short animated film on our Comfy backend (shot list, house-lane keyframes, LTX clips, score, captions, MP4), starting with Zuzu: Koala Assassin #1 and reusable for later issues, accepted by Silas."

notes_from_silas: |
  Silas, 2026-10-04: "a regular video project where the story beats for issue 1 are turned into an
  animated movie ... this might highlight some gaps in their capabilities, so please upgrade as
  needed so this can be manifested." He chose a new project with its own Kind Robots admin page,
  reusable for later issues; a soundtrack from both ACE-Step and an upload; and the core upgrades
  built rather than only filed.

  Hard rules: a film is a MusicVideo row with kind film (see DESIGN-BRIEF.md), so build on the
  music-video pipeline instead of beside it. ArtJob is the only generation queue. Never put
  comic-creator's bannedTerms (issues/zuzu-koala-assassin-01/VIDEO-GUARDRAILS.md) into any prompt,
  caption or title. Renders are private; publishing is publish-gated. kind_robots PR titles start
  comic-film/t-0NN:, and the kind_robots side merges before the conductor side.

milestones:
  - id: m1
    title: "SHAPE — outline, brainstorm, design brief"
    weight: 25
    status: in-progress

  - id: m2
    title: "BUILD — actualize, adjust, test"
    weight: 50
    status: not-started

  - id: m3
    title: "POLISH & SHIP — aesthetics, performance, delivery"
    weight: 25
    status: not-started

tasks:
  - id: t-001
    milestone: m1
    title: "Write the design brief and start building"
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-10-04T00:00:00Z'
    note: >-
      DESIGN-BRIEF.md written 2026-10-04: a film is a MusicVideo with kind film, built on the
      music-video pipeline (music-video t-013, t-025..t-028 carry the shared upgrades), with
      scripts/build_comic_film.py importing build_music_video.py's plumbing.

  - id: t-002
    milestone: m1
    title: "Confirm scope with Silas"
    status: needs-human
    owner: null
    passes: 0
    stakes: reversible
    soft_gate: true
    updated: '2026-10-04T00:00:00Z'
    note: >-
      FOR SILAS: soft checkpoint, nothing is blocked on it. Read DESIGN-BRIEF.md (a film is a
      MusicVideo with kind film; 2.5-4 minutes; at most 12 real clips, Ken Burns elsewhere;
      captions for the ~60 words of dialogue) and its three open questions: score source, whether
      Old Komodo belongs in issue 1, and title card / stinger.

  - id: t-003
    milestone: m1
    title: "Zuzu: Koala Assassin #1 shot list (films/zuzu-koala-assassin-01/SHOT-LIST.yaml)"
    status: ready
