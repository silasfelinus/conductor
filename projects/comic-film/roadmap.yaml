      world, no contract captions; show "the job is already done" through action). 2.5-4
      minutes, about 30-45 shots; each shot: beat, durationSec, camera (static, push-in,
      pull-out, pan-left, pan-right, tilt-up, tilt-down), a prose still prompt and a tag prompt,
      optional caption (dialogue, caption, sfx or title), and which shots spend one of at most 12
