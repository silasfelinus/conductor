    passes: 0
    note: >
      Audit complete. Real, generalizable gap found and fixed in scripts/build_dream_records.py
      (kind_robots not involved -- conductor-repo-only sidecar). eligible_proposal() keeps a
      failed daily-dream proposal pinned at the head of the build queue until it succeeds --
      the same already-failed-forever shape as t-102/t-104's hourly-conductor.yml incident: a
      scheduled sidecar re-deriving pass/fail from a persisted item's status with no
      distinction between a fresh failure and one already known-broken from a prior run.
