  passes: 0
  stakes: reversible
  note: >
    Worker's kaizen suggestion from conductor PR #142 (alexa-integration/t-008):
    the connector safety filter has now blocked a full roadmap.yaml rewrite
    twice for reasons unrelated to the actual edit (the file's own protected-infra
    boundary language trips the filter), forcing the claim commit and the
    needs-human status flip to be skipped even though the Worker knew exactly
    what to write. Add a small script (e.g. scripts/set_task_field.py
