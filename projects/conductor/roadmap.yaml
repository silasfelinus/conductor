- id: t-159
  milestone: m2
  title: Rotate root TALKBACK.md into monthly archives
  status: ready
  passes: 0
  stakes: reversible
  owner: null
  depends_on: t-158
  note: >-
    Filed 2026-09-14 at Silas's direction, same size assessment as t-158. Depends on t-158 only
    because that PR lands the AGENTS.md archival carve-out this task needs.


    Root TALKBACK.md is 3.67MB / 1,034 entries (2026-06 x8, 07 x323, 08 x479, 09 x223), growing
    ~48KB/day. It is NOT in the Kind Robots projection payload, so unlike t-158 there is no
    transport deadline -- but this is an operational bug, not merely token cost.
    scripts/append_ledger_entry.py's append_with_retry() reads the whole 3.67MB via
    `git show origin/main:TALKBACK.md`, rebuilds the entire text, and pushes a single-file commit
    straight to refs/heads/main ON EVERY APPEND. That is almost certainly the cause of the HTTP-413
    TALKBACK-only push failures already documented in CLAUDE.md ("a follow-up TALKBACK-only commit
    hit 413 on every retry"). Rotation fixes something that is actively failing.


    SHAPE. Rotate to talkback/YYYY-MM.md. The ROOT PATH KEEPS THE CURRENT MONTH -- not a bare
    index. .claude/hooks/session-start.sh:73-83 read_text()s the root file and surfaces its last 30
    lines at every session start; an index at that path would show index text instead of recent
    entries. Preserve the lines 1-22 preamble.


    THREE SPECIFICS -- do not rediscover these:

    - Split on ^## \d{4}-\d{2}-\d{2}, NOT on ^## . Line 11 is a format template inside a fenced
    code block and is a false positive; the dated form matches 1034/1034 real entries and zero
    templates. Do not try to parse the role field -- there are 126 variants of it.

    - scripts/backfill_learning.py:376 whole-file-parses TALKBACK.md and indexes EVERY ## header
    into a (project, task, outcome) -> latest-entry map. After rotation it would silently see only
    the current month, so `--since all` backfills lose historical candidates. It needs a glob
    across talkback/*.md. This is the one real breakage.

    - LEAVE LEARNING.yaml ALONE. At 725KB it has the same append-only rule but four whole-file YAML
    parsers (process_task_events.py, build_learning_summary.py, backfill_learning.py,
    append_ledger_entry.py) and two workflow path filters, versus TALKBACK's one parser and zero.
    Splitting it is a larger, different job -- note it and move on.


    CONVENTION. Copy projects/interface-vision/T104-HISTORY.md: an archive file headed with what it
    covers and why, plus an explicit pointer left at the original location. Do NOT treat
    TALKBACK-wonderlab-retirement-2026-08-11.md as the precedent -- it is a standalone decision
    record that nothing in the repo links to, an orphan rather than a pattern.


    Same byte-for-byte round-trip verification as t-158: every rotated entry must be recoverable
    identical to its original. check_large_deletion_guard.py does not currently watch TALKBACK.md,
    so it will not fire here.
  updated: '2026-09-14T10:30:00Z'
