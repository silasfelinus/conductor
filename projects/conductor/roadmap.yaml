    well-tooled (100 references, media_direct_consumer.py, media_migrate.py, check_render_box.py,
    auto-art-generate.yml) but is scoped to kind_robots-TARGETED GENERATED ART. Extending it to
    conductor-owned binaries means amending that doc. projects/coat-dance/BRIEF.md:25 and
    projects/coat-dance/roadmap.yaml:249 both record the MP4's presence in git as a settled fact
    and need updating too.


    SAFETY RULE, NON-NEGOTIABLE: never delete a binary from git until a HEAD probe confirms the
    media origin serves it 200. This repo already learned this the hard way --
    scripts/distribute_images.py's docstring records ai-art-academy/t-010 (2026-07-27), where a
    local copy LOOKED like delivery, the art-prompts request got pruned as done, and the record
    that real delivery had never happened was silently lost. For the coat-dance MP4 especially,
    assume it may be the only copy until proven otherwise. If a probe fails, upload first, verify,
    and only then remove -- or leave it and say so.


    DO NOT REWRITE GIT HISTORY to reclaim the 231MB. Filtering shared history is a worse problem
    than the one it solves, and every other checkout would break. Stopping the growth is the goal.


    ALSO IN SCOPE, both small:

    - Delete docs/art-request-status.md. Generated 2026-06-30, it is a hand-made status table
    describing the superseded manual ART-PROMPTS.md workflow. The live pipeline it predates
    (art-request.post.ts -> artRequestYaml.ts -> projects/art-prompts.yaml ->
    auto-art-generate.yml on a 0 */6 * * * cron) makes it actively misleading. Replace with a
    generated queue-depth line or nothing.

    - Fix .gitattributes. It is TRUNCATED: lines 18-26 are a comment block explaining that the
    vendored WordPress trees should be marked linguist-vendored, but the actual directive lines are
    missing -- the file just ends on the comment. It also has no *.mp4 / *.mov / *.webm entries
    while *.png/jpg/webp/pdf/zip are all listed. Note there is no Git LFS configured (no .lfsconfig,
    no filter=lfs lines) and no size policy anywhere in AGENTS.md or CLAUDE.md.
