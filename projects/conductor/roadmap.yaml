    title: Two concurrent scheduled sessions computed the identical session id, defeating claim_task.py collision detection
    status: ready
    passes: 0
    stakes: reversible
    note: >
      Observed 2026-07-18: two concurrent conductor sessions both independently
      claimed and ran a full ai-art-academy/t-010 cycle (a recurring task) at
      essentially the same time, using the LITERAL SAME session identity string
      `claude-conductor-scheduled-20260718T0705Z` (visible in both cycles'
      `claimed_by`/RAN-entry text; presumably the scheduler names sessions by
      truncating to the minute, and two triggers landed in the same minute).
      This time the collision resolved harmlessly by luck: one session did
      option (a) front-end polish (kind_robots PR #387) and the other did
      option (d) curriculum-coverage docs, and their roadmap.yaml note edits
      happened to land in different parts of the same block-literal `note`
      field, so `git rebase`/merge combined both without a real conflict. But
      `claim_task.py`'s collision check almost certainly compares the
      incoming `--session` value against the existing `claimed_by` field --
      if both sessions present the identical identity, the second claim looks
      like "the same session re-confirming its own claim" rather than a
      genuine second claimant, which is exactly the gap t-040 (2026-07-14)
      was meant to close. A future collision on a task whose two independent
      diffs touch the *same* lines (e.g. both editing `status:` or the same
      note paragraph) would not resolve as cleanly. Fix: make session
      identities actually unique across concurrent triggers of the same
      scheduled task (e.g. append a short random suffix or a monotonic
      counter, not just a to-the-minute timestamp) so `claim_task.py` can
      always distinguish two real concurrent sessions from one session's
      repeat calls.

  - id: t-066
    milestone: m2
    title: A background subagent delegated a file push, then completed after the dispatching session had already pushed further changes to the same file directly, overwriting them
    status: ready
    passes: 0
    stakes: reversible
    note: >
      Observed 2026-07-18 (kind-robots/t-038 burst-mode cycle). Hit conductor's
      documented HTTP 413 push failure on this session's own designated
      branch and delegated the documented `push_files` MCP workaround to a
      background subagent, handing it the file content as it stood at that
      moment. Before the subagent returned, this session found and used a
      faster/different fix directly in the foreground (`create_branch` +
      rebase + normal `git push`) and kept committing further changes to the
      SAME file on top of that (a status flip from `review` to `done` plus a
      completion note). The background subagent, with no way to know its
      task had been superseded, eventually finished and pushed its own
      `push_files` commit built from the STALE content it was dispatched
      with -- landing on top of the branch tip and silently reverting the
      file back to the earlier `status: review` state, dropping both later
      edits. Caught immediately via the task-completion notification,
      refetched `origin/<branch>`, and reapplied the dropped edits, so no
      permanent loss -- but it cost an extra round-trip and could easily go
      unnoticed for a subagent whose output isn't re-read afterward. This is
      a real write race, not just wasted work: a background subagent
      operating on a file the dispatching session is concurrently editing
      can clobber later commits even within a single session with no other
      human or agent involved. Fix ideas (pick one or combine): (a) when a
      workaround is resolved in the foreground while a delegated subagent
      for the same fix is still in flight, explicitly cancel/ignore that
      subagent's eventual result rather than letting it complete and push
      unsupervised; (b) never delegate a git-state-mutating workaround
      (push_files, create_branch, etc.) to a background subagent for a
      problem already being actively fixed inline -- reserve background
      delegation for genuinely independent work; (c) if delegation is
      unavoidable, have the subagent re-fetch and diff against the CURRENT
      remote tip immediately before its push (not just use content handed
      to it at dispatch time), so a stale push_files call fails loudly on
      an unexpected base instead of silently overwriting newer commits.
