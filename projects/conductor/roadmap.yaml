  - id: t-056
    milestone: m2
    title: Document the Reviewer batch-merge auto-gen race in AGENTS.md
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Kaizen from this cycle's Reviewer sweep (2026-07-16, conductor PRs
      #640/#641/#643/#644/#645/#646/#647/#648, an 8-PR backlog cleared in one
      session). t-045 (this same cycle) covers the Worker-side half of the
      auto-gen conflict problem (rebase before opening a PR), but the
      Reviewer-side half is distinct and was hit repeatedly here:
      refresh-status.yml's "chore: refresh STATUS.md and workspace.html"
      commit lands on main within seconds of every merge, so when the
      Reviewer clears several backlogged PRs back-to-back, nearly every merge
      after the first races that auto-commit and turns mergeable_state dirty
      moments after it was clean — no amount of Worker-side rebase-before-PR
      prevents this, since the staleness is introduced by the Reviewer's own
      prior merge, not by anything the Worker did. Add a short "Reviewer
      batch-merge" note to AGENTS.md (near hard rule 9): when clearing
      multiple PRs in one sweep, expect this race after each merge; re-fetch
      main and retry rather than treating mergeable_state:dirty as a real
      conflict on the first try. For genuine conflicts, the resolution is
      the same as any auto-gen conflict — take main's copy for
      STATUS.md/ROADMAP-AUDIT.*/LEARNING-REPORT.md and regenerate; for
      append-only files (TALKBACK.md, LEARNING.yaml) that both sides touched,
      keep both sides' entries rather than picking one.

