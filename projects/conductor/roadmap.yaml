- id: t-132
  milestone: m2
  title: "kind_robots' required 'Contract verifiers' check's 'ESLint ratchet' step repeatedly hangs mid-run"
  status: ready
  gate_human: false
  stakes: reversible
  passes: 0
  note: >-
    FOR SILAS: Observed 2026-08-27 on silasfelinus/kind_robots#2141 (interface-vision/t-121, a trivial 2-file template-only header polish -- pages/music-mentor.vue and pages/coloring-page.vue). `Contract verifiers` is a required check on kind_robots (unlike conductor's own non-required `Python test suite`/`Analyze (javascript-typescript)` stalls documented in t-124/t-106 -- this one cannot be merged past). Across 6 consecutive attempts (initial run + 5 cancel/rerun cycles, each waited 5-15+ minutes with zero step progress before retrying), the job hung at a DIFFERENT step nearly every time -- Install dependencies (twice), Route gallery contract, the very first Set up job step, and the "ESLint ratchet" step specifically 3 of the 6 times (steps 5-31, the ~300-step job's normal per-step contracts, always completed in 1-2s each when the job was moving at all; only "ESLint ratchet" itself, a full-repo `npx eslint` run via `utils/scripts/verifyLintRatchet.ts` / `npm run test:lint-ratchet`, ever sat in_progress for 10-20+ minutes with the job otherwise idle). Ran the exact same script locally against the same branch/diff: completed in a few seconds (`ESLint ratchet: 335 problem(s) across 24 rule(s) (-57)`, ratchet holds) -- confirms this is not the diff's content or the script's own logic, and not something a local `timeout 120s` run reproduces. githubstatus.com showed a string of real Actions incidents in the prior 24-48h (job queue saturation Aug 26 15:02- 15:45 UTC, start delays from a node disk failure Aug 24, an Actions/PRs degradation resolved the morning of Aug 27) -- consistent with, but not conclusively proving, platform-level flakiness rather than a kind_robots-repo- specific cause. The step recurring 3/6 times specifically (vs. the other stalls being one-offs at varied steps) is the one data point that doesn't fully fit "purely random dispatch noise" -- worth checking whether ESLint's cache/memory footprint on a fresh `npm ci` install (no warm `.eslintcache`) is disproportionately likely to hit a resource-constrained runner's ceiling compared to the job's other, much smaller per-file/per-manifest contract checks. Investigate: (a) whether this reproduces on other kind_robots PRs/days going forward, and whether it's always "ESLint ratchet" specifically when the job does stall mid-run (vs. earlier-step dispatch stalls, which look like ordinary runner-provisioning flakiness); (b) whether `contract-tests.yml`'s `ESLint ratchet` step (or the whole `Contract verifiers` job) needs an explicit `timeout-minutes` so a genuine hang fails loud instead of silently blocking a required check indefinitely with no signal; (c) whether enabling ESLint's cache (`--cache`) in `test:lint-ratchet`/CI specifically would reduce memory/CPU pressure on that one step without changing what it verifies. kind_robots#2141 was left open through this, eventually merged once attempt 6 (or later) actually completed green -- this task tracks the underlying CI-health question, not that PR's own outcome.
    Second occurrence, same day (2026-08-27, later, scheduled conductor sweep session): kind_robots#2161 (cthulhuquarium/t-028, a small 3-file additive backend change). First attempt (job 98695620393, run 33123396419 attempt 1) sat `in_progress` for 24+ minutes with zero step progress visible via the Actions API (no per-step detail surfaced for that attempt before it was cancelled -- unlike attempt 2 below, this confirms the job can hang somewhere the check-runs summary alone doesn't show step-level detail for an in-progress run, worth remembering when triaging future occurrences). Cancelled and reran once via `rerun_failed_jobs`, per AGENTS.md's "re-run at most once" rule. Attempt 2 (job 98696592310, started 22:44:35) initially progressed completely normally -- all steps 1-70 completed within ~2 minutes, including `ESLint ratchet` (step 32) finishing in 50s, well within its usual range -- then stalled at step 71, "Capture-group guard checker self-test", sitting `in_progress` with zero further step progress for 5+ minutes and counting as of this note. This is the first occurrence where the hang step was neither "ESLint ratchet" nor an early dispatch/install step, and the first where a *rerun* also stalled (all four prior stalls referenced above were first-attempt hangs) -- both data points argue harder for genuine platform-level Actions runner flakiness (a wedged runner process, not anything about this specific step's own logic) over a repo-content or single-step-specific cause. Per the "re-run at most once" rule this session did not attempt a third try; kind_robots#2161 was left open, unmerged, for a later session or Silas to just re-check CI and merge once green -- the PR's actual content was already fully verified locally (vue-tsc, eslint, prettier, and the relevant unit test suite all clean) before this stall, same as every prior occurrence's PR.
    Third data point (2026-08-30, scheduled conductor sweep session): kind_robots#2234 (interface-vision/t-104 slice 70, a trivial 7-file class-rename-only PR, zero behavior change). Attempt 1 (job 99295054115, run 33325602115) sat `in_progress` for ~25 minutes with zero step progress after all other 36 checks on the PR had gone green -- this was the ONLY outstanding check, and it is required, so it fully blocked the merge (conductor PR #3250, the paired roadmap-status-review PR, merged cleanly in the same session with no stall at all, underlining this is kind_robots-repo/workflow-specific, not a general GitHub Actions outage at the time). Cancelled and reran once via `rerun_workflow_run` (the `cancel_workflow_run` + `rerun_workflow_run` pair, since `rerun_failed_jobs` doesn't apply to a run with no failed jobs yet -- everything else on it was still green, only this one job was stuck). Attempt 2 (job 99295459787, started 17:37:03Z) also stalled -- sat `in_progress` for 23+ minutes with zero step progress, the same duration order as attempt 1 and every prior occurrence documented above. Per the established "re-run at most once" rule, did not attempt a third try. PR content was already fully verified locally before either attempt (eslint, prettier --check, vue-tsc --noEmit, and test:layout-contract all clean) -- this is purely a CI-infrastructure stall, not a content issue, consistent with every prior occurrence's own local verification. Left kind_robots#2234 open, unmerged, for a later session or Silas to re-check CI and merge once green; interface-vision/t-104 itself is unaffected (recurring task, already correctly back at status: review on the conductor side per PR #3250, independent of this specific slice's kind_robots-side merge).
    This is now 3 independent occurrences across 3 different PRs/days (2026-08-27 x2, 2026-08-30 x1), all showing the same "sits in_progress with zero step-level progress for 15-25+ minutes; a fresh rerun sometimes but not reliably clears it" signature. The open investigation items in the first note (timeout-minutes on the job/step, ESLint --cache) remain unactioned -- worth prioritizing now that a rerun has been shown to NOT reliably self-heal (this session's rerun stalled again, unlike the mixed record above).
    Fresh recurrence, 2026-09-02, kind_robots PR #2336 (model-builder/t-029 cycle 82, a trivial 2-file+2-wiring-file change). Contract verifiers stalled 3 times in a row on the exact same commit (fdeca382), zero forward progress each time (10-25+ min waits before cancelling): attempt 1 hung at 'ESLint ratchet', attempt 2 also hung at 'ESLint ratchet' (this time confirmed via job-level steps API after the run-level status lagged behind -- the run showed in_progress well after the job itself had already been cancelled), attempt 3 hung at 'Install dependencies' (a step that completed in ~20-30s on both prior attempts). Confirms this note's existing pattern: a different step nearly every time, ESLint ratchet still the single most common one. All other required checks (TypeScript, layout-contract, every other contract job in the same run) passed cleanly on this commit each time they got the chance to run. Stopped after 3 cancel+rerun cycles per this session's own retry budget; left kind_robots PR #2336 open with a standing-down comment and subscribed to its PR activity rather than merging past an unverified required check. Also newly confirmed this session: the check_runs GitHub API can report a run/job as 'in_progress' for several minutes after it has actually completed (confirmed via cross- checking actions_get get_workflow_run/get_workflow_job directly) -- a session relying on check_runs alone without this cross-check could wait indefinitely on a check that already finished, or conversely could think a stalled run is still 'normal' when actions_get would show it's genuinely stuck. Worth folding into whichever future fix investigates this task's item (b).
    New evidence, 2026-09-07 (interface-vision/t-104 slice 130, kind_robots PR #2483): this stall pattern is not limited to Contract verifiers/ESLint ratchet. The 'Build production image' (Publish Production Container workflow) job on this PR sat in_progress at the exact same 'Build and publish' step for 35+ minutes on attempt 1 with zero step-level progress; cancelled and re-run once per this task's own established 're-run at most once' convention, and attempt 2 also sat at the identical step for 40+ minutes with zero progress before this session stopped retrying. All other 49 required checks on the same commit passed cleanly each time they ran (vue-tsc, eslint, layout-contract, lint- ratchet, Contract Tests' ~330 sequential checks, etc.) -- consistent with every prior occurrence's own local verification showing this is a CI-infrastructure stall, not a content issue. Per the established convention, left kind_robots#2483 open, unmerged, with a standing-down comment, for a later session or Silas to re-check CI and merge once green. Widening this task's scope: the stall signature (sits in_progress with zero step- level progress for 20-40+ minutes, a fresh rerun sometimes but not reliably clears it) now spans at least two different required-check workflows (Contract Tests' ESLint ratchet step, and Publish Production Container's Build and publish step), suggesting a shared runner/infra-level cause rather than something specific to either job's own script.

    Reconciled during Silas's 2026-09-07 human-gate backlog audit. This is recurring CI/platform diagnosis work, not a decision for Silas. Recent evidence includes stalls at multiple Contract verifiers steps and, on 2026-09-07, the Build production image job showing the same 35-40+ minute no-progress signature while the rest of the PR checks completed. Return to the worker queue to investigate the Actions-level stall, observability, timeout, and recovery behavior; do not park routine CI diagnosis in the human queue.
    Investigation update, 2026-09-08 (scheduled conductor sweep session): checked this task's own open item (b) -- whether Contract verifiers needs an explicit `timeout-minutes` so a genuine hang fails loud -- against the live workflow file (kind_robots `.github/workflows/contract-tests.yml`). It already has `timeout-minutes: 10` on the `contract-tests` job, present since at least the earliest version in this repo's history (well before every stall occurrence logged above, all of which ran 15-40+ minutes with zero step progress before a human/session cancelled them manually). A job-level timeout that is already set but does not fire on a genuinely wedged run is stronger evidence than anything logged so far for the "wedged GitHub-hosted runner, not a repo-content or script cause" reading of this whole pattern: GitHub's own timeout enforcement apparently cannot always reach a runner that has stopped reporting progress. This closes off item (b) as already-tried-and-insufficient rather than unactioned -- a smaller timeout-minutes value would only make cancellation happen sooner, it would not make it happen reliably. Did not action item (c) (ESLint `--cache`) this session: the logged occurrences hang at varied, mostly non-ESLint steps (Install dependencies, Set up job, Route gallery contract, Capture-group guard checker self-test, Build and publish), so an ESLint-specific cache would at best address a minority of instances and adds its own risk (a stale/poisoned `.eslintcache` surviving between runs) for uncertain benefit against what looks like a platform-level runner fault. Recommend downgrading remaining investigation effort here to periodic monitoring (does the pattern's rate change, does GitHub Support/status ever confirm a runner-wedge root cause) rather than further repo-side config changes, since the two config-shaped fixes this task proposed are now either tried-and-insufficient (b) or unlikely-to-generalize (c).

    Observation (2026-09-11, scheduled Conductor session, incidental to unrelated
    coloring-book/t-022 work): kind_robots' contract-tests.yml already carries a
    job-level `timeout-minutes: 10` on the Contract verifiers job as of
    2026-09-09 (commit 78b9d6e, bundled into an unrelated interface-vision/t-104
    slice PR #2564 -- not a dedicated fix for this task, so likely incidental
    rather than a deliberate response to this investigation). This may already
    substantially address open question (b) from this task's note (whether the
    job needs an explicit timeout so a genuine hang fails loud) -- worth
    confirming whether a future stall now actually gets killed at 10 minutes
    before treating (b) as still open. Questions (a) and (c) are untouched by
    this. Not verified against a live reproduction this session -- flagging for
    whoever picks this up next rather than closing anything out.
  updated: '2026-09-11T08:40:50Z'

