    status: done
    owner: reviewer
    passes: 0
    stakes: reversible
    note: |-
      Found 2026-07-21 ~22:20 UTC (ai-art-academy/t-010 cycle,
      claude-conductor-scheduled-20260721T220455Z-t010) while fixing an
      unrelated bug in ai-art-academy/roadmap.yaml: t-010's `owner`/
