  - id: t-026
    milestone: m2
    title: Reviewer trigger fires with no open worker/* PR to review, repeatedly
    status: needs-human
    owner: null
    updated: '2026-07-12T02:36:00Z'
    passes: 0
    stakes: reversible
    note: >
      FOR SILAS: The Reviewer session trigger is firing far more often than there
      is Worker PR volume to review — this is a platform/scheduling issue, not
      something fixable from inside the repo.

      UPDATE 2026-07-12 02:36: 26th recurrence, but throughput looks healthy —
      between the 25th firing (21:36) and this one, conductor #375 merged and
      four more sessions closed real work (challenge-center/t-003, the
      kind_robots migration, and a genuine worker-shaped PR #402/#403). This
      firing just caught an empty queue. Downgrading urgency: still worth
      fixing the cadence/gating to cut session-cost waste, but it is not
      blocking the pipeline. See TALKBACK.md 2026-07-12 entry for detail.

      What's happening: at least 25 Reviewer sessions now (root TALKBACK.md
      2026-07-05 evening, 2026-07-07 PR #345, 2026-07-10 14:35 PR #348, 2026-07-10
      ~15:35, 2026-07-11 00:37 PR #371, 2026-07-11 01:36, 2026-07-11 04:37,
      2026-07-11 05:36, 2026-07-11 06:36, 2026-07-11 07:36, 2026-07-11 08:36,
      2026-07-11 09:36, 2026-07-11 10:36, 2026-07-11 11:36, 2026-07-11 12:37,
      2026-07-11 13:37, 2026-07-11 14:37, 2026-07-11 15:36, 2026-07-11 16:36,
      2026-07-11 17:36, 2026-07-11 18:36, 2026-07-11 19:36, 2026-07-11 20:36, and
      2026-07-11 21:36) have fired on an hourly cadence. The first several found zero
      open PRs anywhere and no roadmap task at status: review/claimed. Starting 04:37
      the pattern shifted: each session re-fires almost exactly 1 hour after the prior
      session had already reviewed conductor PR #375 (requested changes, logged in
      TALKBACK) — with zero new commits, comments, or state change on that PR in
      between firings. So the trigger isn't only firing into an empty queue; it's also
      repeatedly re-firing on the same already-reviewed PR before the Worker
      could plausibly have responded. Each occurrence burns a full sweep (git
      log, PR list, roadmap grep, TALKBACK tail) to reach the same "nothing new
      to do" conclusion. The 2026-07-11 21:36 occurrence is a seventeenth instance
      of that exact pattern: PR #375 still has only the one original commit and
      the one review comment from 03:37 — no Worker response in the ~18 hours
      since. The Worker side also looks stalled independent of this PR: its last
      claim commit on this roadmap was 2026-07-08, and the last worker/* PR
      merged anywhere in scope was ~2026-07-10 22:31 UTC — Silas may want to
      check whether the Worker's own hourly trigger is still firing.

      TO APPROVE: This needs a change to how/how-often the Reviewer session is
      triggered (cron cadence, or a webhook/condition gate that only fires the
      Reviewer when an actual worker/* PR is opened) — that configuration lives
      outside this repo, so no agent can fix it directly. Please check the trigger
      config for this session and either slow its interval or make it conditional
      on an open worker/* PR existing. Once addressed, set status: done here (or
      leave a note if you want the roadmap task kept open to track effectiveness).

      What unblocks: nothing depends on this — it's pure session-cost waste, not
      a blocker. Logging the recurrence here (rather than yet another passive
      pattern note) since prior soft notes did not surface a fix; escalating
      instead of repeating a full redundant sweep, per this task's own point about
      the cost of doing that every cycle.
