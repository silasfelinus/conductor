- id: t-158
  milestone: m2
  title: Offload done-task notes to per-project HISTORY.md and enforce the size ceiling
  status: done
  passes: 0
  stakes: reversible
  owner: worker
  note: >-
    Filed 2026-09-14 at Silas's direction after a portfolio size assessment. URGENT: this has a
    deadline, not just a cost.


    WHY NOW. `scripts/sync_kind_robots_projection.py` POSTs the raw text of every
    projects/*/roadmap.yaml to https://kindrobots.org/api/conductor/sync under a hard
    MAX_PAYLOAD_BYTES = 4_000_000. It blew that limit on 2026-09-11 at 4,000,134 bytes, failing
    tests/test_sync_kind_robots_projection.py; conductor/t-151 fixed it by hand-archiving
    interface-vision/t-104's ~395KB note to T104-HISTORY.md, dropping the snapshot to ~3.6MB.
    Measured again 2026-09-14: 3,734,373 bytes, 93.4% of the limit, regrowing ~45KB/day. That is
    roughly a week of headroom on a soft estimate. 66% of all roadmap text (2,421,423 bytes) is the
    `note:` bodies of `status: done` tasks. Offloading them lands the payload near 33%.


    Biggest contributors, done-note bytes: conductor 337,553; kind-robots 275,696;
    interface-vision 251,239; ai-art-academy 201,831; cthulhuquarium 190,391; kapowarr 123,002;
    rainbow-butterflies 97,382; digital-storefront 82,794. Work biggest-first.


    DO THREE THINGS IN ONE PR.


    (1) Add the archival carve-out to AGENTS.md's append-only rules. Silas authorized this
    explicitly on 2026-09-14 in session. Today `Delete TALKBACK entries (the log is append-only)`
    sits under "Neither agent -- EVER" and scripts/set_task_field.py:363 refuses to replace a
    >300-char note with text that does not contain it (the t-129 guard, added after a session lost
    199 lines of diagnostics on cthulhuquarium/t-033 and t-034). An offload script is
    indistinguishable from those incidents without a stated rule, and a future agent will correctly
    refuse the work. The carve-out: moving content VERBATIM into a named archive file is not
    deletion, provided the script verifies a byte-for-byte round-trip and the PR names the
    authorizing session. Rewriting, summarizing, or dropping an entry remains forbidden.


    (2) Write scripts/archive_done_task_notes.py. It must write the HISTORY.md entry FIRST, verify
    the recovered note equals the original byte-for-byte, and only then rewrite the roadmap. Never
    call close_task.py --set note= ; use set_task_field_text(..., force=True, force_block='>-')
    from inside the script.


    (3) Run it across all projects, biggest first.


    POINTER FORMAT -- NOT COSMETIC. Leave a one-sentence outcome summary followed by the pointer,
    e.g. "Digest portfolio math now reads milestone weights directly. Full history:
    projects/kind-robots/HISTORY.md#t-101". Two live consumers depend on the first sentence
    remaining meaningful: scripts/backfill_learning.py:276 takes first_sentence(note) as the lesson
    for closed tasks, and kind_robots components/conductor/project-detail.vue:363 renders
    {{ task.note }} verbatim on the live project board. Copy the ROADMAP POINTER style of
    projects/humboldt-scoop-cms/HISTORY.md, but NOT its archive style -- that file keeps only a
    one-line summary per task and links to a commit SHA, which is summarizing and would break both
    the carve-out and the byte-for-byte verification. HISTORY.md must hold the full original note
    verbatim.


    CONSTRAINTS, all load-bearing:

    - Scope strictly to `status: done`. select_role.py (RAN/NO-OP recurring markers),
    daily_gate.py, audit_human_gates.py and audit_roadmaps.py all scan note text, none of them on
    done tasks. Touching a recurring, needs-human or claimed task breaks them.

    - Emit block scalars (>-). scripts/check_roadmap_yaml.py rejects a quoted flow scalar whose
    continuation lines sit at column 0.

    - check_large_deletion_guard.py WILL fire (it flags >=500 deleted lines or >=20%). It is
    continue-on-error: true and its own docstring blesses this case: "A deliberate large prune (an
    archival pass, a roadmap reorganization) is legitimate." Expected -- explain it in the PR body.


    THEN MAKE IT STICK. A one-time prune does not hold: t-104 was archived 2026-09-11 carrying the
    literal instruction "Keep this note short going forward" and has regrown through slice 269
    anyway. scripts/check_roadmap_note_size.py (from t-151) only warns on a SINGLE note over 50KB,
    which misses today's actual failure mode -- 154 medium notes summing to 411KB in one file.
    There is no byte-size check anywhere else in this repo (a grep for st_size/getsize/MAX_BYTES
    across scripts/*.py returns zero). Extend it with a per-FILE threshold and a total-projection
    check against MAX_PAYLOAD_BYTES, and add the projection-headroom line to the CLAUDE.md startup
    sweep so every session sees the number.


    VERIFY: python scripts/validate_roadmaps.py ; python scripts/check_roadmap_yaml.py ;
    pytest tests/test_sync_kind_robots_projection.py ; and measure the payload before and after
    with: python3 -c "import json,pathlib; print(len(json.dumps({'roadmaps':{p.parent.name:
    p.read_text() for p in pathlib.Path('projects').glob('*/roadmap.yaml')}})))"

    DONE 2026-09-14 (PR #4331). Archived 1,110 done-task notes across 48 projects into projects/<slug>/HISTORY.md. Projection payload 3,734,373 -> 1,635,532 bytes (93.4% -> 40.9%), headroom 2,364,468. Verification: 1,110/1,110 round-trip byte-identical against git HEAD, 0 backfill_learning lessons changed, re-run is a no-op, 1,895 tests pass.

    TWO THINGS THE FIRST ATTEMPT GOT WRONG, both silent. (1) I wrote my own first_sentence() for the pointer summary; backfill_learning.py has its own that caps at 280 chars with a raw-truncation fallback, so for notes with no sentence boundary the appended "Full history:" text bled into that window and silently altered 3 of 34 lesson records on the storybook trial run. Fixed by importing the real function and having build_pointer() VERIFY first_sentence(pointer) == first_sentence(original) per task, declining rather than rewriting where it cannot hold. (2) verify_project() matched a loose "HISTORY.md#" and reported t-158 itself as a broken pointer, because this notes quotes the pointer format as example text; tightened to each task own exact pointer. Both now have tests.

    ENFORCEMENT, because a one-time prune does not hold (t-104 was archived 2026-09-11 carrying the literal instruction "Keep this note short going forward" and regrew through slice 269): check_roadmap_note_size.py now also reports oversized roadmap FILES and the true projection headroom, measured with sync_kind_robots_projection own encoder rather than an approximation. CLAUDE.md startup sweep reports the headroom line every session.

    AGENTS.md gained the archival carve-out (authorized by Silas in session 2026-09-14): a verified byte-for-byte move into a named archive file is not deletion; summarizing or trimming remains forbidden. This is what makes the work distinguishable from t-129 and lets a future agent run the script rather than correctly refusing.

    CI: "Build changed TypeScript projects" failed on a cause unrelated to this diff -- it selects any changed projects/<x>/ with a package.json then runs npm ci, which refuses without a lockfile, and projects/approval-portal (retired) has no lockfile. Latent until this pass touched all 48 project dirs at once. Fixed at the selection step (skip with a message) rather than by generating a lockfile for a retired project; also dropped --silent, which had hidden the error entirely.

    FOLLOW-UPS, not in scope here: two oversized notes remain on LIVE recurring tasks (model-builder/t-029 118KB, storybook/t-010 65KB) -- the t-104 per-task pattern applies there, not this script, which is done-only. interface-vision/roadmap.yaml is still marginally over the new 150KB per-file threshold. t-159 (TALKBACK rotation) is unblocked now that the carve-out has landed.
  updated: '2026-09-14T11:59:38Z'
