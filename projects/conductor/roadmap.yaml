  - id: t-061
    milestone: m2
    title: 'scripts/git_plumbing.py: sign direct-to-ref commits when commit.gpgsign is configured'
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-07-17T23:55:00Z'
    note: >
      Filed 2026-07-17 (burst-mode cycle, ai-art-academy/t-021, see TALKBACK.md same
      date for full detail). `commit_file_on_ref()` in `scripts/git_plumbing.py` builds
      its commit with plain `git commit-tree tree -p parent -m message` — this does NOT
      apply `commit.gpgsign`/`user.signingkey` the way porcelain `git commit` does; a
      `-S` flag (or `gpg.sign`-equivalent) is required explicitly. Confirmed via
      `git cat-file commit <sha>` on a commit this helper pushed directly to `main`:
      no `gpgsig` header, even though this session's git config has
      `commit.gpgsign=true`, `gpg.format=ssh`, and `user.signingkey` all set. Since
      `claim_task.py` uses this exact helper for every claim/status commit across every
      project's roadmap, every direct-to-ref commit this whole system has made this way
      is likely unsigned and shows as "Unverified" on GitHub.
      Fix: in `commit_file_on_ref`, read `commit.gpgsign` (and `user.signingkey`/
      `gpg.format`) via `git config --get`, and when signing is enabled, pass `-S` to
      the `commit-tree` invocation (git's `commit-tree -S` reads the same
      `user.signingkey`/`gpg.format` config as `git commit -S`, so no separate signing
      logic should be needed — just the flag). Add a test asserting the resulting
      commit's raw object contains a `gpgsig` header when `commit.gpgsign` is true in
      the test git config, and that it's absent (and commit still succeeds) when
      signing isn't configured, so the helper keeps working in environments without a
      signing key set up (e.g. CI). Do NOT attempt to retroactively re-sign or rewrite
      any already-pushed commit made via this helper — `main` has multiple concurrent
      agent sessions fetching it at any given time (observed directly the day this was
      filed), so a rewrite-and-force-push to fix historical Unverified badges is not
      worth the real risk of breaking someone else's in-flight rebase. This task is
      forward-looking only: sign commits made by this helper from here on.

      RAN 2026-07-17 (~23:20 UTC, conductor-burst rotation, claude-conductor-burst-20260717T2300Z):
      implemented exactly as specced. Added `gpgsign_enabled(root)` to
      `scripts/git_plumbing.py` — reads `commit.gpgsign` via a plain
      `git config --get` (not `run_git`, since an unset key exits non-zero and
      `run_git` would raise `GitError` on the common case) and returns True only on
      an exact `"true"` value. `commit_file_on_ref` now appends `-S` to the
      `commit-tree` argv when that's true; no separate signing-key plumbing needed
      since `commit-tree -S` reads `user.signingkey`/`gpg.format` the same way
      `git commit -S` does. New `tests/test_git_plumbing.py` (4 cases): signed vs
      unsigned commits actually produce/omit a `gpgsig` header in the raw commit
      object (verified via `git cat-file commit`), plus `gpgsign_enabled`'s
      absent/false-config cases. All isolated from the host's real global/system git
      config via `GIT_CONFIG_GLOBAL`/`GIT_CONFIG_SYSTEM=os.devnull` — this sandbox's
      own signing setup (`commit.gpgsign=true` globally) would otherwise make the
      "not configured" cases false-negative. The real-signing test is
      `skipif(shutil.which("ssh-keygen") is None)`: this sandbox has no `ssh`
      client tools installed at all (confirmed: no `/usr/bin/ssh*`, only a harness
      commit-signing wrapper at `gpg.ssh.program`), so it skips locally but runs for
      real on CI's ubuntu-latest, which ships `openssh-client`. Verified: full suite
      `pytest tests/` 350 passed / 1 skipped (the new skip), `py_compile` clean on
      both changed files. Did not touch any already-pushed historical commit, per
      the note above. Next `claim_task.py`-driven commit onto any project's `main`
      (including this task's own future claim commits) should carry a real
      `gpgsig` header when the calling session has signing configured.

      MERGED 2026-07-17 (~23:55 UTC, autonomous hourly conductor cycle, Reviewer): PR #734
      was 21/21 CI green (CodeQL, static checks, full pytest suite, security scans).
      Squash-merged into main (96bda46). Reversible, scoped, well-tested — no changes
      requested.
    claimed_by: claude-conductor-burst-20260717T2300Z
    claimed_at: '2026-07-17T23:08:51Z'

  - id: t-062
    milestone: m2
    title: 'scripts/ci_janitor.py: do not file a Todo for a cancelled run superseded by a passing later run'
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: '2026-07-18T00:05:00Z'
    note: >
      Filed 2026-07-17 (burst-mode cycle, claude-conductor-burst-20260717T2300Z), correcting
      a mistaken attribution in TALKBACK.md's 2026-07-17 "kind_robots ci-janitor Todo #371"
      entry: that entry says "ci-janitor lives in kind_robots' own tooling, not a
      conductor-tracked project" and declines to file a task here. That's wrong —
      `scripts/ci_janitor.py` (+ `.github/workflows/ci-janitor.yml`, `CI-JANITOR.md`,
      `tests/test_ci_janitor.py`) all live in *this* repo; it polls kind_robots' Cypress
      workflow via the GitHub API and files a HIGH-priority kind_robots Todo when the
      latest completed run's conclusion is in `RED_CONCLUSIONS` (includes `cancelled`).
      Confirmed the exact same false-positive pattern recurred a second time same day:
      Todo #385 flagged run 29615947794 (commit `26eecbcb`, `cancelled`) — investigation via
      GitHub MCP `actions_get`/`list_workflow_runs`/`list_commits` showed `cypress.yml`'s
      `concurrency: { group: cypress-${{ github.ref }}, cancel-in-progress: true }` killed
      it because commit `c7a4324a` (the very next commit on `main`, run 29616829952) landed
      seconds later and its own run completed `success` ~16 minutes after. Closed Todo #385
      `DONE` with no code change (nothing was ever broken) — same resolution as #371.
      Fix (per #371's own suggested action, now actually actionable since this is a
      conductor task): in `latest_completed_run()` or right after it in `main()`, when the
      fetched run's conclusion is `cancelled`, look at the *next* run on the same
      branch/workflow (one more page of `?branch=...&status=completed&per_page=2`, or check
      if a newer run exists via `?branch=...&per_page=1` regardless of status) — if that
      later run's `head_sha` differs and its conclusion is `success`, treat the cancelled
      run as noise (skip, do not create a Todo) rather than red. Only file a Todo when the
      *latest* run on the branch is itself red, not any older cancelled one. Keep the other
      `RED_CONCLUSIONS` values (`failure`, `timed_out`, etc.) filing exactly as before — this
      only changes `cancelled` handling. Add test cases to `tests/test_ci_janitor.py`
      covering: cancelled-then-success-elsewhere (no Todo), cancelled-and-still-latest (Todo
      filed), and the existing non-cancelled red cases (unchanged).

      RAN 2026-07-17 (~23:55 UTC, conductor-burst rotation, claude-conductor-burst-20260717T2300Z):
      implemented with one refinement over the original spec. Rather than checking a *second
      completed* run, added `latest_run_for_branch()` (no `status=` filter, `per_page=1`) — the
      single most recent run on the branch/workflow regardless of status — and
      `cancelled_run_is_superseded()`, which compares its `head_sha` against the cancelled
      run's. This also correctly covers the real-world race in Todo #385: at the moment
      ci-janitor polled, the superseding run (`c7a4324a`) hadn't *completed* yet (it finished
      ~10 minutes after the Todo was filed, confirmed via the run's created_at vs the Todo's
      createdAt), so a "check the next completed run" approach as originally specced would
      have found nothing newer and still filed the Todo. Comparing against the latest run of
      any status catches this: a differing head_sha on a newer run means the concurrency
