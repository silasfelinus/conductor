    depends_on: t-002
    note: >
      Build scripts/build_kaizen.py. For each active project it emits:
      1. KAIZEN PROMPT — the single most impactful action Silas can take right now, one sentence framed as a direct instruction (e.g. "Approve the stack spec in humboldt-scoop-cms/t-001"). Priority order: needs-human tasks first, then gate_human gates with approved_by_human: false, then passes==3 blocked tasks, then stale claimed tasks with no recent commit.
