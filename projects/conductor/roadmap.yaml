  - id: t-064
    milestone: m2
    title: 'set_task_field.py: preserve block-literal formatting when a note value contains embedded newlines'
    status: done
    passes: 0
    stakes: reversible
    updated: '2026-07-18T16:15:45Z'
    note: 'Kaizen from ai-art-academy/t-010 (2026-07-18, claude-conductor-scheduled-20260718T0705Z). scripts/set_task_field.py''s own docstring says "Newlines in a new value are flattened to spaces — the writer emits exactly one line per field," by design, for every field including `note`. But in practice, every recurring/multi-cycle task''s `note` field (t-010 itself has 21+ entries) is hand-maintained as a `note: |-` block-literal scalar with one `RAN <date>: ...` paragraph per line, specifically so the roadmap stays human-readable and diff-friendly for Silas. Calling `set_task_field.py <project> <task-id> note "<existing note>\n<new RAN paragraph>"` silently collapses that entire multi-paragraph history into one giant single-line quoted flow scalar, destroying the paragraph breaks (content is preserved, formatting is not) -- caught this in dry-run/diff review before pushing (had to `git reset --soft`+`git checkout HEAD --` to recover the original block-literal file and hand-append the new paragraph with Edit instead), so no bad state landed on main, but a less careful session would ship the flattened version and every note field that gets touched this way afterward stays flattened forever (the script always re-flattens on the next edit, so the format never self-heals). Fix: when the field is `note` (or any field whose incoming value contains embedded newlines) and the existing field being replaced was itself a block-literal (`key: |-` / `key: >-` etc.), emit the new value in the same block style instead of collapsing to a quoted flow scalar -- preserves the established per-paragraph-per-line convention. Add a regression test asserting a multi-paragraph note round-trips through the block-literal form. Until this lands, the safe pattern for appending to a multi-paragraph note is a direct Edit/text insertion of the new paragraph line, not `set_task_field.py note "..."`. DONE 2026-07-18 (conductor Agent session): implemented in scripts/set_task_field.py — when the existing field is a block-literal (note: |- / >- etc.) and the new value contains embedded newlines, the writer now re-emits the same block style (render_block_scalar()) instead of collapsing to a quoted flow scalar; a plain quoted-scalar or single-line field still flattens as before (unchanged, documented behavior). Added two regression tests to tests/test_set_task_field.py (block-literal preservation, and confirming the no-prior-block-style case still flattens) plus a demo dry-run against the real ai-art-academy/t-010 note (21+ RAN paragraphs) confirming round-trip fidelity through yaml.safe_load. Full pytest suite: 360 passed, 1 skipped. kind_robots not touched — conductor-tooling-only change.'

  - id: t-065
    milestone: m2
    title: Two concurrent scheduled sessions computed the identical session id, defeating claim_task.py collision detection
    status: done
    passes: 0
    stakes: reversible
    note: >
      Observed 2026-07-18: two concurrent conductor sessions both independently claimed and ran a full ai-art-academy/t-010 cycle (a recurring task) at essentially the same time, using the LITERAL SAME session identity string `claude-conductor-scheduled-20260718T0705Z` (visible in both cycles' `claimed_by`/RAN-entry text; presumably the scheduler names sessions by truncating to the minute, and two triggers landed in the same minute). This time the collision resolved harmlessly by luck: one session did option (a) front-end polish (kind_robots PR #387) and the other did option (d) curriculum-coverage docs, and their roadmap.yaml note edits happened to land in different parts of the same block-literal `note` field, so `git rebase`/merge combined both without a real conflict. But `claim_task.py`'s collision check almost certainly compares the incoming `--session` value against the existing `claimed_by` field -- if both sessions present the identical identity, the second claim looks like "the same session re-confirming its own claim" rather than a genuine second claimant, which is exactly the gap t-040 (2026-07-14) was meant to close. A future collision on a task whose two independent diffs touch the *same* lines (e.g. both editing `status:` or the same note paragraph) would not resolve as cleanly. Fix: make session identities actually unique across concurrent triggers of the same scheduled task (e.g. append a short random suffix or a monotonic counter, not just a to-the-minute timestamp) so `claim_task.py` can always distinguish two real concurrent sessions from one session's repeat calls.

      RAN 2026-07-18 (~23:20 UTC, conductor-burst-hourly rotation, claude-conductor-burst-20260718T230803Z): traced the actual claim mechanism instead of extending the speculation. `roadmap_claims.task_is_claimable()` -- the sole function claim_task.py's `check_claimable()` consults -- decides claimability purely from the task's `status` and `claimed_at` read off `origin/main`; it never compares the incoming `--session` value against the existing `claimed_by` field. So a second caller presenting the IDENTICAL session string as an already-landed claim is rejected exactly like any other second claimant (status is `claimed` and not stale) -- there is no special-case path where matching claimed_by is treated as "the same session re-confirming its own claim." Added test_identical_session_string_does_not_bypass_collision_check to tests/test_claim_task.py to lock this guarantee in as a regression test (full suite: 361 passed, 1 skipped). This means the specific mechanism this note speculated about is not a gap in claim_task.py itself. The real explanation for the observed 2026-07-18 collision is almost certainly that ai-art-academy/t-010 is a recurring task: per AGENTS.md's recurring-task rule, its status flips back to `ready` immediately after each cycle (not held at `claimed`/`review` like a normal task), so two triggers landing minutes apart can each legitimately claim, run, and re-arm the SAME recurring task in quick succession -- that's the intended re-entrant design for recurring tasks, not a collision bug. The remaining actionable idea from this note (unique-per-invocation session identities, e.g. a random/monotonic suffix on scheduler-assigned session ids) is still a reasonable defense-in-depth / audit-readability improvement, but it isn't fixing a proven vote-splitting defect -- punting that as a genuine UX nice-to-have rather than implementing a session-id-format change speculatively, since it would touch how every scheduled session is named (outside this repo's control) for marginal benefit over the now-verified git-plumbing guarantee.
    owner: reviewer
