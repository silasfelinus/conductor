      '2026-07-21T16:06:13Z'` trio sat at the very end of the same block,
      after the long recurring-task `note:` block scalar. Under YAML's
      standard last-key-wins mapping semantics (confirmed via
      `yaml.safe_load`), the trailing duplicate silently won — every reader
      of that file (`claim_task.py`, `next_ready_task.py`,
      `audit_roadmaps.py`, this note itself before I fixed it) was seeing the
      wrong owner/claim timestamp for that task, even though `status:` (not
      duplicated) stayed correct. Root cause is almost certainly an editor
      pattern where a session appends a new `RAN ...` paragraph to the note
      block and then re-adds owner/claimed_by/claimed_at below it instead of
      updating the existing fields above the note — the same failure mode
      hard rule 9 already warns about for STATUS.md/workspace.html conflicts,
      just self-inflicted instead of a merge artifact.
      SCOPE: fixed the one instance directly blocking my own claimed task
      (ai-art-academy/roadmap.yaml, t-010) as part of that cycle. A repo-wide
      scan (custom PyYAML loader that flags repeated keys within the same
      mapping instead of silently overwriting) found it is NOT isolated:
        - projects/conductor/roadmap.yaml: duplicate `updated` near source
          lines ~1278, ~1528ish, ~1587ish, ~1606ish, ~1627ish, ~1656ish (6
          instances — line numbers shift as the file grows; re-run the scan
          below rather than trusting these literally)
        - projects/global-ui/roadmap.yaml: duplicate `updated` (1 instance)
        - projects/kind-robots/roadmap.yaml: duplicate `approved_by_human`
          (both `true`, so no behavior change there) and duplicate
          `claimed_by`/`claimed_at` on a `status: done` task (no behavior
          change since status itself isn't duplicated) — 2 locations
        - projects/packmaker/roadmap.yaml: duplicate `updated` (2 instances)
      All of the ones outside ai-art-academy are currently low-consequence
      (`updated` timestamp cosmetics, or duplicates with identical values, or
      duplicates on already-`done` tasks) — none flipped a live claim or
      approval gate at scan time. But the *pattern* is a real safety-relevant
      gap: this exact shape could silently corrupt `approved_by_human` or
      `status` on a live task, and nothing currently catches it. Left these
      other projects' roadmap.yaml files untouched rather than editing them
      without a claim (four different active projects, collision risk).
      TO DO:
      1. Add a duplicate-key check to `scripts/audit_roadmaps.py` (or a new
         small script it calls) so this becomes a normal audit finding
         instead of something only found by accident. A minimal repro
         loader:
         ```python
         class DupKeyLoader(yaml.SafeLoader): pass
         def construct_mapping(loader, node, deep=False):
             mapping = {}
             for k_node, v_node in node.value:
                 k = loader.construct_object(k_node, deep=deep)
                 if k in mapping:
                     raise ValueError(f"duplicate key {k!r} at line {k_node.start_mark.line+1}")
                 mapping[k] = loader.construct_object(v_node, deep=deep)
             return mapping
         DupKeyLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping)
         ```
      2. Once the check exists, fix the remaining instances in conductor,
         global-ui, kind-robots, and packmaker's roadmap.yaml (claim each
         project normally before editing its roadmap, per the usual rule —
         this is 4 small, independent, mechanical fixes, not one cross-project
         diff).
