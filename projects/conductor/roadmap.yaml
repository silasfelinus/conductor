  - id: t-040
    milestone: m2
    title: Burst-mode rotation has no claim step, so concurrent hourly triggers can pick the same project/task
    status: done
    owner: reviewer
    passes: 0
    stakes: reversible
    updated: '2026-07-14T15:16:44Z'
    note: >
      Original finding (full account in TALKBACK.md, 2026-07-14
      "ecosystem-map/t-001, t-003 | burst-mode pattern + rotation-collision
      finding"): two concurrent burst-mode sessions independently picked and
      fully implemented animation-manager/t-008, discovered only at push
      time; no data was lost but the duplicate implementation was pure waste
      and a less careful session could have force-pushed over the real merge.

      Fix shipped this cycle: `scripts/claim_task.py` (new), backed by
      `scripts/git_plumbing.py` (new -- builds and pushes a single-file
      commit via a scratch git index, without touching the caller's checked-
      out branch/working tree/HEAD) and `scripts/roadmap_claims.py` (new --
      shared claimability/staleness rule: `status: ready`, or `status:
      claimed` with `claimed_at` older than `CLAIM_TTL_MINUTES` = 90).
      `claim_task.py` re-reads the task straight from `origin/main` (not the
      local checkout), refuses with exit 3 (`ALREADY_CLAIMED`) if someone
      else already holds it, and otherwise pushes a small `status: claimed`
      commit straight to `origin/main` before real implementation work
      starts, with bounded retry-on-race (re-fetch, re-check claimability,
      rebuild the commit). `set_task_field.py` gained `claimed_by`/
      `claimed_at` to its allowed-fields set; fixing this also surfaced and
      fixed a real latent bug in its `normalize_scalar` -- a literal
      timestamp value (as opposed to the `now` keyword) was left unquoted
      and silently reparsed by PyYAML as a native `datetime` instead of a
      string (caught by the new test suite, not by inspection).
      `next_ready_task.py` now treats a stale `claimed` task as pickable
      again, so a crashed claiming session can't lock a task forever.
      AGENTS.md's "Picking what to work on" and the Worker's "Step 2 --
      Claim" now document the required claim step and a new "Rotation
      collisions" subsection explains why it exists. Covered by
      tests/test_claim_task.py (real throwaway git repos exercising the
      actual commit/push/race-rejection plumbing, not just the YAML edit),
      tests/test_roadmap_claims.py, and a new case in
      tests/test_set_task_field.py; full suite green (155 passed) and
      `scripts/audit_roadmaps.py` unchanged (still the same 1 error / 1
      warning already deferred to t-038/t-039).

      Deliberately out of scope: this only closes the gap for sessions that
      actually run `claim_task.py` -- it can't force a session to call it,
      and doesn't touch `scripts/run_worker.py`'s separate, purely
      informational `find_ready_task()` (that script explicitly never
      executes tasks; see its module docstring). It also doesn't resolve the
      pre-existing tension between AGENTS.md's formal "Reviewer CANNOT...
      set status: claimed" rule and the established burst-mode practice of
      Claude sessions claiming/implementing conductor-tooling tasks directly
      under Silas's in-session direction (the "CAN... claude/* branches...
      directed by Silas" carve-out) -- flagging it here rather than
      resolving it unilaterally, since it's a process-authority question for
      Silas, not a one-line fix.

  - id: t-041
    milestone: m2
    title: Document the "create branch via API before first git push" step for sessions whose designated branch doesn't exist on the remote yet
    status: done
    owner: null
    passes: 0
    stakes: reversible
    updated: '2026-07-14T17:49:58Z'
    note: >
      Kaizen from t-038 (PR #515, merged 2026-07-14). This session's designated
      branch (claude/great-goldberg-4srsd6) had never had a PR opened from it,
      so it did not yet exist on the actual GitHub remote even though the
      local checkout's remote-tracking ref showed a SHA for it (stale/local-
      only knowledge). A plain `git push -u origin <branch>` for a genuinely
      new remote branch failed with HTTP 413 from the git-smart-HTTP proxy --
      GIT_TRACE_CURL showed it attempting to send an ~500MB pack (matching
      the full .git size) instead of a small delta, apparently because the
      proxy's handling of a brand-new ref requires a full pack rather than
      computing one relative to objects already reachable via other refs
      (e.g. main). Workaround that worked: call the GitHub MCP
      `create_branch` tool (owner/repo/branch/from_branch: main) first --
      this creates the ref instantly via the API with zero data transfer,
      since it just points at a commit the remote already has -- then the
      normal `git push` of the session's actual commits went through as a
      small, fast delta. Add this as a documented step in AGENTS.md or
      CLAUDE.md's session-startup guidance (something like: "if `git push -u
      origin <your-branch>` fails with HTTP 413 and the branch has no prior
      PR, the branch likely doesn't exist on the remote yet -- create it via
      the GitHub API/MCP `create_branch` from main first, then push normally")
      so the next session that hits this doesn't have to re-diagnose it from
      a raw curl trace.
    claimed_by: reviewer-hourly-1784051334
    claimed_at: '2026-07-14T17:48:54Z'
