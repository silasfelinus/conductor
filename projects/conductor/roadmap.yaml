    one more step before reporting "could not verify" -- list open branches in the relevant repo(s)
    matching `worker/<project>-<task-id>-*` or `<project>-<task-id>` and, if one exists with no open PR
    against it, name it explicitly in the finding (e.g. "no PR found, but branch X has unmerged commits
    and no open PR -- likely an un-PR'd close-out"). This turns a generic "could not verify, check by
    hand" into a specific, actionable pointer, the same way this session's manual
    `list_branches`/`list_commits` detour worked, without requiring a human or agent to repeat that
    detour every time. Advisory only -- never auto-opens a PR itself, since that decision (is the branch
    real, safe, on-task) still needs judgment; it only needs to surface the candidate. kind_robots is
    already checked via the GitHub API by this script's existing repo-scanning code path, so reuse that
