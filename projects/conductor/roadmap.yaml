- id: t-161
  milestone: m2
  title: close_task.py can silently drop a caller's unpushed local commits on the target branch
  status: done
  stakes: reversible
  passes: 0
  owner: worker
  note: >-
    Kaizen from coloring-book/t-046 (silasfelinus/conductor#4356, 2026-09-14): this session implemented t-046 locally (committed but not yet pushed) on its designated branch claude/blissful-curie-pubxnn, then ran `close_task.py coloring-book t-046 review --branch claude/blissful-curie-pubxnn ...`. The script's scratch-index plumbing built its close-out commit on top of the branch's remote tip (which did not yet have the local implementation commit, since it had never been pushed) rather than the caller's local HEAD, and force-pushed that result -- silently overwriting the remote ref with a branch that no longer contained the local implementation commit. Caught immediately via `git diff origin/main --stat` before opening the PR (the diff was missing scripts/art_quality.py and tests/test_art_quality.py); recovered via the still-present local commit object (`git reflog` + a clean cherry-pick) and a verified `--force-with-lease` re-push. No data was permanently lost, but it could easily have gone unnoticed by a session that didn't diff before pushing/opening the PR.
    DO: read close_task.py's actual git-plumbing implementation and confirm exactly what base it builds from when `--branch` names a branch that already has local (or even already-pushed) commits beyond origin/main. Fix one of: (a) make it fast-forward from the caller's actual local branch tip when one exists and matches `--branch`, or (b) refuse/warn loudly when the local branch tip it's about to build on top of doesn't match what `git rev-parse --branch` reports locally, rather than silently rebuilding from a stale base. At minimum, add an explicit docstring note describing the actual behavior so a caller knows to push their own commits first (or use a distinct `--branch` name for the close-out) rather than assuming `--branch <my-current-branch>` preserves local work the way a normal `git push` would.

    Implemented a fail-closed branch-tip guard in close_task.py so --branch cannot silently omit local-only commits; added regression coverage for mismatched and matching local/remote branch tips.

    RESOLVED: merged in #4378 (squash 17a9924) - fail-closed local-vs-remote branch-tip
    guard in close_task.py, with regression tests for both refusal and matching-tip cases.
    Reviewed and merged same session.
