notes_from_silas: >
  REWRITTEN 2026-07-05 from my session direction. Scrap the earlier plans: this
  project has NO AI in the front end, and no selective ordering of parts. The book's
  prose is mine — every word is my craftsmanship and I won't give it up, culturally
  it's important. AI may act as an editor (insights, notes, catches), but never
  drafts prose intended for the book. What I need: (1) a simple kind_robots landing
  page that offers the book, with a personal note I will write myself, plus a note
  that no AI was used to write the book other than the words of that paragraph
  itself — ending on a punchline about reality/existence/originality; (2) when I
  drop the manuscript PDF into manuscript/, produce editorial outputs: general
  impressions, editorial notes, cultural-awareness notes (gaps in gaze or
  privilege), and a VERY-IMPORTANT.md for actual typos and grammar errors (I edited
  by hand and caught many between printings — there will be more); (3) later,
  build/expand the full site at mermaidsofvenice.com — currently a parked WordPress
  address; it stays parked until I'm comfortable selling the book as-is. The PDF
  edition is also the digital-storefront's first product.
