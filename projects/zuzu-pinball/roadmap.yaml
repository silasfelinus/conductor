# Zuzu Pinball — The Last Bell. New standalone Arcade table (Silas, 2026-10-09 PT).
# Creative deliverables: DESIGN-BRIEF.md, CONCEPT-ART.svg,
# PLAYFIELD-MOCKUP.svg and GAMEPLAY-SCREEN-MOCKUP.svg.
project: zuzu-pinball
kind: software
goal: >-
  Ship Zuzu: The Last Bell as a visually arresting, mechanically deep, original
  single-table pinball game inside the Kind Robots Arcade. FX3-class aspiration:
  a 3D rendered and physically calibrated weird-west samurai cabinet with at least
  three ramps, two orbits, upper dual-flipper mini playfield, lower dual flippers,
  independent nudge and tilt, three multiball variants (3, 4, 6 balls), multiple
  narrative modes, rich addressable LED and cabinet splash treatment, DMD, sound,
  and a physically playable hidden undercrypt that returns to the main deck.
  River Croc is a signature animatronic toy with a shootable opening jaw,
  captured-ball hold, Death Roll, and a safe return to the right inlane.
  Initial preview is admin only. Definition of done requires device QA and
  Silas's hands-on judgment that the table is genuinely FX3-quality.
notes_from_silas: |
  2026-10-09 PT follow-up: "I want the river croc to make an appearance,
  you should be able to shoot the ball into its mouth." The established
  Zuzu River Croc is now the mandatory #07 physical shot and animatronic,
  not a decorative decal. See RIVER-CROC-TOY-CONCEPT.svg and revised mockups.
  2026-10-09 PT: "I want a new project, a zuzu pinball game ... This should aim
  to be at the level of a pinball fx3 table in terms of quality and complexity:
  mulltiball, multiple flipper levels, tilt, multiple ramps, led, designed table
  layout, splash borders, etc. add it to conductor as a new project, and give
  an outline, realistic mockup, and concept art. Probably in reverse order."
  The design begins with authored cabinet concept art, then a physical shot-map
  mockup, then a thorough design brief. All are in this directory.
  This is a distinct Zuzu game, not an extension or replacement of the
  AMI Village Rescue table owned by kind-pinball. Share the engine;
  separately author level geometry, game rules, art, audio, achievements and scores.
  Treat Pinball FX3 as a bar for physical feel and quality, never as copied IP.
  Preserve Zuzu's Edo-era ronin outsider persona and haunted-weird-west canon.
  The Abbess feeds children to a cosmic horror; prior human world is a mystery.
  Internal concept assets and reversible development may proceed without another
  scope approval. Admin previews require /admin routes plus admin nav tabs.
  A public /play game is outward-facing and requires explicit approval.
  Do not mark the project complete until Silas judges a playable desktop/touch
  build as good as a serious FX3 table. First make the table *fun*, then lavish it.

