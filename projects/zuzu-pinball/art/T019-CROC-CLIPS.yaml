- key: wan-clips
  label: WAN 2.2 image-to-video (14B), first frame to last frame
  engine: wan
  prompt: prose
  fps: 16
  output_format: webp
  negative: camera movement, camera pan, zoom, cut, scene change, background change, darkening, colour shift, morphing,
    melting, extra heads, extra jaws, extra limbs, extra tails, text, watermark, blurry, flicker, photorealistic,
    3d render
