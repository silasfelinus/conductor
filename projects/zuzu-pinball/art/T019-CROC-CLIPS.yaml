# zuzu-pinball t-019 step 2b: the River Croc's clips, WAN 2.2 image-to-video between the approved poses
# (T019-CROC-POSES.yaml) so every frame is the croc Silas picked (key 245776). Each clip is cut out of its white
# surround and packed into the table's sprite atlas; the rules' phases play them:
#   open        gape loop                 (245782 -> 245782, loop)
#   captured    the snap                  (245782 gape -> 245776 jaws shut)
#   death-roll  the roll                  (245776 -> 245776, a full roll in foam; or via the 245788 belly-up pose)
#   spit        the spit                  (245776 -> 245782, a gush of water)
#   submerged / rising                    (queued once the white-surround submerged pose is in)
# Round 1 (37646-37651) all FAILED: Kind Robots sent end_image to ComfyUI's WanImageToVideo, which has none
# (fixed in kind_robots#3608: WanFirstLastFrameToVideo; first-last clips also run the A14B pair, an overnight
# job). Round 2 below: first frame only on the default TI2V-5B, the same day; the atlas ping-pongs the loops.
# Round 2 (37652-37658, TI2V-5B, first frame only): the open loop breathes and is kept; roll, sink and snap
# barely move (the snap never shuts) and the spit melts. 5B will not make big prompted motion from a still.
# Round 3 (croc-clip3-*): first-last-frame on the A14B pair once kind_robots#3608 is deployed, the poses pinned
# at both ends. Round 1 (croc-clip-*) is SUPERSEDED by round 3: its FAILED status is history, not a retry.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
series: zuzu-pinball
project_slug: zuzu-pinball
designer: Zuzu Pinball
is_public: false
