# zuzu-pinball t-019: the River Croc toy, second take. Silas, 2026-10-12, on the procedural
# 3D Croc (t-018): "I want something closer to an animation style. Something that looks like
# our concept art ... We should start with an image of that quality, built in arthemy or
# something like that, then generated out. None of this nintendo 64 quality graphic."
# Step 1 (this ledger): the key image, the Croc as the player sees him on the table: front on
# from above, rising out of the watering hole with his jaws open at the camera, in the house
# Arthemy lane that drew the croc-and-coyote plate (ArtImage 243624) and the canonical croc
# (243495, zuzu-showdown T012-REFERENCES). Plain white background so the picked seed can be
# keyed out. Silas picks a seed; step 2 animates it (LTX/WAN first-to-last-frame clips per
# phase) and the table plays them as the toy.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
series: zuzu-pinball
project_slug: zuzu-pinball
designer: Zuzu Pinball
is_public: false
is_mature: false
lanes:
- key: arthemy-house
  label: Arthemy Western Art v3.0 (house, author's settings)
  engine: comfy
  checkpoint: Illustrious/arthemyWesternArt_v30.safetensors
  prompt: tags
  prefix: masterpiece, best quality, amazing quality, absurdres, very aesthetic, toon (style), western comics (style),
    gritty, dark atmosphere, grindhouse, high contrast, heavy shadows, muted earthy palette, desaturated, weathered,
    grimy
  suffix: western, dusty, dramatic lighting, gritty
  steps: 30
  cfg: 5
  sampler: euler_ancestral
