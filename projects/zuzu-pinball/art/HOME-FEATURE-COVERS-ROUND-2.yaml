  prompt_prose: Three-quarter front view of one complete pinball machine standing on dark floorboards in a dim lantern-lit
    saloon. The cabinet is dark cedar wood with oxblood lacquer, copper side rails and four steel legs. Its long
    tilted glass-covered playfield is clearly visible from above at an angle. Near the front edge are two white
    flippers and a silver steel ball. In the middle stand three round pop bumpers with glowing amber caps, and three
    curving copper wire ramps rise over the table. On the left side of the playfield a sculpted giant scarred olive-green
    crocodile head with glowing amber eyes and an old broken harpoon in its back rises from teal-painted water,
    jaws wide open toward the center. At the far end of the playfield a raised wooden platform holds a large swinging
    bronze abbey bell. The tall upright backbox behind the playfield displays a painted picture of a grey koala
    ronin in a weathered straw kasa hat and a faded indigo kimono holding a chipped katana, standing before a moonlit
    stone abbey on a hill above a dusty frontier town with paper lanterns. The whole machine fills the picture;
    amber, cyan and violet lights glow across the playfield.
