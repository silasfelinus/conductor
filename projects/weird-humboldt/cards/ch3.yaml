  scene: A drumbeat comes up F Street and then, strangely, goes down it. A marching band in flannel and axes steps backward in perfect time, unspilling coffee, un-dropping a flag, unpicking a quarrel from the sidewalk. The drum major spots you over her shoulder. "We have been marching yesterday since sunrise," Alder says through her baton. "Can you help us end it before the part where we trip?"
