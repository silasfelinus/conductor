      effects:
      - evidence:schedule
      - evidence:calendar
      - flag:shop_certificates
    failure:
      text: You read for an hour and find only fine print about refunds. Barnaby, delighted, offers you tea and asks if you'd like to read the terms again.
      effects:
      - time-1
      - evidence:rumor
  - id: c
    label: Buy the music box and let it finish
    skill: none
    target: null
    success:
