    label: Haggle for the lamp that almost granted a wish
    skill: rizz
    target: 7
    success:
      text: Barnaby accepts your offer with an air of ceremony. The lamp, when you polish it, grants nothing, but a slip of paper falls out with a name and a date on it.
      effects:
      - evidence:document
      - flag:shop_lamp
      - goodwill+1
    failure:
