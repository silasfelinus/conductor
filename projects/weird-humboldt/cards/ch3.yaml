- id: WH-060
  revision: 1
  chapter: 3
  location: Sequoia Park, Eureka
  title: The Tree That Grows Entrances
  tier: invented
  provenance: Sequoia Park holds real old-growth trees; the hollow trunk that grows doors is invented fiction, and no real tree or trail is claimed to have such doors.
  rarity: rare
  tone: [wonder, dreamy, mysterious]
  cast: ['The Hollow Trunk (grows entrances, never exits, fixed)', A trail ranger named Ofelia (unflustered)]
  canon: ['The hollow trunk offers three doors, none requiring a key, and a fourth that appears if you wait.', 'Each door leads to a place already on the player''s journey, but a different day of it.', Ofelia has been told not to go through them and is extremely tempted.]
  scene: 'A hollow redwood trunk the width of a small room has three doors in its bark: a green one, a red one, a faded blue one. None has a lock. A fourth is forming slowly in the wood, like a bruise becoming a plan. A trail ranger named Ofelia stands beside it with a clipboard and the expression of a person who has filed a report about it. "They show up on Thursdays," she says. "I''m not allowed to open them. I''m allowed to supervise you."'
  options:
  - id: a
    label: Open the green door
    skill: wits
    target: 7
    success:
      text: The green door opens onto a room full of maps, one of which shows the festival route redrawn by someone who has already walked it. You slip out with the margin notes.
      effects: ['evidence:geography', 'evidence:schedule', 'flag:trunk_green']
    failure:
      text: The green door opens onto a very small picnic you're not invited to. You are firmly shown out and your sandwich is taken as a toll.
      effects: [nerve-1, 'flag:trunk_picnic']
  - id: b
    label: Open the faded blue door
    skill: psyche
    target: 9
    success:
      text: Blue opens onto a quiet pond at dusk and a feeling like being forgiven. You step out lighter and clearer, with a vague memory of a frequency.
      effects: ['evidence:frequency', clarity+1, 'flag:trunk_blue']
    failure:
      text: Blue opens onto the same pond and a feeling like being forgotten. You come out unsettled and very slightly older.
      effects: [weird+1, time-1]
  - id: c
    label: Wait for the fourth door
    skill: none
    target: null
    success:
      text: You wait, and Ofelia waits with you, and the fourth door finishes growing. It has your name on it in her handwriting. You do not open it yet but she writes down that you could.
      effects: ['flag:trunk_fourth', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: Mara studies the grain around each door. "They're not carved. They're healed. Somebody asked the tree nicely.", kit: Kit tests each handle without turning it. "Green says adventure. Red says consequences. Blue says nap.", juniper: Juniper lays her palm on the bark. "The tree is not showing you where to go. It is showing you who you were.", cedar: Cedar eyes the hollow. "I've seen big hollow trees. This one's been hollow on purpose."}
