  scene: 'A bell chimes the moment you step inside. Shelves are crowded with objects tagged in neat handwriting: THE SECOND-BEST CROWN OF A MINOR KING, A LAMP THAT ALMOST GRANTED A WISH. Barnaby, a round man in a cardigan, waves from behind the register. "Everything here nearly changed the world," he says. "Nothing did, so the prices are fair." A music box in the corner is playing, a little sadly, a song that has never been written.'
  options:
