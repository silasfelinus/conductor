- id: WH-041
  revision: 1
  chapter: 3
  location: Old Town Eureka
  title: The Victorian with Too Many Windows
  tier: invented
  provenance: Old Town Eureka's Victorian architecture is real; this house, its windows and its boarder are invented fiction and depict no real building or resident.
  rarity: rare
  tone:
  - eerie
  - droll
  - gothic
  cast:
  - The House (adds windows, fixed)
  - Miss Adelaide Pruitt (a boarder who counts, wary)
  canon:
  - A Victorian adds one window each time a secret is spoken within earshot.
  - The windows all look out onto rooms that are not in the house.
  - Miss Pruitt has been counting for eleven years and has never been wrong.
  scene: Between a bakery and a bank stands a Victorian with more windows than a house can hold, every pane lit from within. A new one blinks open as you read the front door's brass plate. Miss Pruitt sits on the porch with a notebook, tallying. "Careful what you say near it," she says. "It collects." She turns a page. "That was fourteen." The windows seem to face an audience.
  options:
  - id: a
    label: Look through a window that just appeared
    skill: wits
    target: 9
    success:
      text: 'The new window shows a room you have never been in but know: a chair, a lamp and a letter addressed to someone who died here. You memorize the street of its return address.'
      effects:
      - evidence:document
      - evidence:geography
      - flag:windows_looked
    failure:
      text: The window shows you looking, then looks back, and you step away with a headache and the feeling you have been catalogued.
      effects:
      - nerve-1
      - weird+1
  - id: b
    label: Tell the house a harmless secret on purpose
    skill: psyche
    target: 9
    success:
      text: You confide something small and kind. A window opens onto a warm kitchen, and Miss Pruitt writes a number in her notebook and smiles for the first time in years.
      effects:
      - goodwill+1
      - flag:windows_confided
      - evidence:memory
    failure:
      text: The secret turns out to be heavier than you meant. A cold window opens above your head and watches for a long time.
      effects:
      - nerve-1
      - flag:windows_cold
  - id: c
    label: Sit on the porch and help Miss Pruitt count
    skill: none
    target: null
    success:
      text: You count windows alongside her, and by dusk you have fixed the number at forty-one, which she pronounces correct. She gives you the front key to remember her by.
      effects:
      - flag:windows_counted
      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara watches the glass. "Every pane is hand-leaded. Whoever built these windows loved secrets and hated doors."
    kit: Kit whispers. "A house that listens. Finally, a landlord with taste."
    juniper: Juniper puts a palm to the wall. "The house isn't greedy. It's lonely, and secrets are the only company that stays."
    cedar: Cedar looks up at the eaves. "Counting like that takes years. She's not a boarder. She's the house's friend."
