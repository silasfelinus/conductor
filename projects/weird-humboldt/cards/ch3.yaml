      effects:
      - flag:shop_music_box
      - goodwill+1
      - evidence:history
  lead_reactions:
    mara: Mara turns a pendant over. "Second-best cursed. Honest of him. Most shops oversell."
    kit: Kit grins at the tags. "An archive of nearlys. Nothing in this room is trying to impress me, and I'm charmed."
    juniper: Juniper touches the music box. "The song knows it was never written. It plays anyway, which is its own sort of grace."
    cedar: Cedar reads a certificate. "Honest dealer. That's rarer than a cursed lamp in this county."
