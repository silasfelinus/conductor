- id: WH-056
  revision: 1
  chapter: 3
  location: Sequoia Park, Eureka
  title: The Redwood's Lost-and-Found
  tier: invented
  provenance: Sequoia Park is a real Eureka park; the bench that collects forgotten childhood things and the objects it holds are invented fiction and depict no actual property.
  rarity: common
  tone: [tender, whimsical, wistful]
  cast: ['The Bench (a park bench with a drawer, fixed)', 'A seven-year-old named Moss (sitting on it, solemn)']
  canon: ['The bench keeps small things people forgot as children: a tooth, a sticker book, a name for a pet rock.', An object can be reclaimed only by someone who can say what it meant., The bench has a drawer that opens onto more bench.]
  scene: Under a redwood, a bench has a drawer where no drawer should be. Inside lie a lone mitten, a plastic dinosaur wearing a monocle, a slip of paper reading SECRET FORT and a tooth in a matchbox. A seven-year-old named Moss swings her legs and supervises. "It's the lost-and-found," she says. "You have to say what it was for. Grownups usually cry."
  options:
  - id: a
    label: Say what the dinosaur was for
    skill: rizz
    target: 7
    success:
      text: You tell the truth, simply, about a monocle and a thing you were afraid of. The bench slides the dinosaur toward you, and it turns out to hold a folded map of a forgotten trail.
      effects: ['evidence:geography', goodwill+1, 'flag:bench_reclaimed']
    failure:
      text: You make something up and the drawer snaps shut. Moss gives you a sympathetic look that is entirely too old for her.
      effects: [nerve-1, 'flag:bench_unconvinced']
  - id: b
    label: Read the SECRET FORT note
    skill: wits
    target: 9
    success:
      text: The note is a child's careful map to a fort that still stands. You note the trail marks and recognize a landmark that appears on no official park chart.
      effects: ['evidence:document', 'evidence:geography']
    failure:
      text: The note is in a child's cipher you can't crack. By the time you give up the bench has swallowed it and offered you a sticker.
      effects: [time-1]
  - id: c
    label: Leave something of your own in the drawer
    skill: none
    target: null
    success:
      text: You tuck in a small, true thing from your own childhood. The drawer closes with a click, and the bench will keep it, which Moss says is the best thing a bench can do.
      effects: ['flag:bench_gift', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: Mara touches the tooth box. "People bring me their forgotten things on skin. This bench keeps them without the ink.", kit: Kit puts the monocle on the dinosaur. "A dignified creature. I would like to apologize on its behalf to everyone.", juniper: Juniper lays her hand on the wood. "Trees remember too. This one has been holding other people's quiet things.", cedar: Cedar nods at Moss. "Good kid. She knows how a place works better than half the adults."}
  callbacks: [bench_reclaimed, bench_unconvinced, bench_gift]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-057
  revision: 1
  chapter: 3
  location: Sequoia Park Zoo, Eureka
  title: The Volunteer in the Bear Costume
  tier: invented
  provenance: Sequoia Park Zoo is a real Eureka institution; the stuck costume, its volunteer and the talk are invented fiction and depict no actual staff, volunteer or program.
  rarity: uncommon
  tone: [comic, tender, awkward]
  cast: ['Dale (a volunteer who cannot remove the bear head, fixed)', 'A school group of fourteen children (loud, unconvinced)']
  canon: [Dale gives animal talks in a bear costume that no longer comes off., Dale is cheerful and more worried about the children than himself., The costume's zipper opens only for people who answer the talk's closing question honestly.]
  scene: 'A volunteer in a full bear costume is giving a talk to fourteen skeptical children under a sign about native animals. Mid-sentence he stops and, with great dignity, says: "I need someone to unzip me." The zipper pull is jammed under the chin. The children are not surprised. One of them says, "He did this on Tuesday too." Dale''s voice comes out muffled and gentle from behind the bear. "It''s not an emergency. It is also an emergency."'
  options:
  - id: a
    label: Work the zipper loose
    skill: burly
    target: 7
    success:
      text: The zipper gives with a shriek, and Dale breathes freely for the first time in a week. His real face is tired and delighted. He hands you a key card for a staff-only service gate.
      effects: [goodwill+1, 'flag:bear_unzipped', 'evidence:document']
    failure:
      text: The zipper holds, and the pull snaps off in your hand. Dale takes this very well and the children take it better. You are given a sticker for effort.
      effects: [nerve-1, 'flag:bear_zipper_broke']
  - id: b
    label: Answer the closing question honestly
    skill: psyche
    target: 9
    success:
      text: 'The question is: what are you afraid of leaving behind? You answer truthfully and the costume loosens itself seam by seam, in a ripple that makes the children gasp.'
      effects: ['flag:bear_honest', 'evidence:memory', weird+1]
    failure:
      text: Your answer comes out as a joke, and the costume tightens a notch. Dale pats your shoulder with a foam paw and promises to try again tomorrow.
      effects: [time-1]
  - id: c
    label: Finish the talk for him
    skill: none
    target: null
    success:
      text: You take the fourteen children through the rest of the talk, bear facts and all, while Dale supervises from the bench. It costs you an afternoon and earns you a lasting reputation.
      effects: ['flag:bear_talk_finished', goodwill+1, 'lose:free_draw']
