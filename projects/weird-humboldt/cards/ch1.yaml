      effects:
      - evidence:schedule
      - flag:deer_rope
      - goodwill+1
    failure:
      text: You lean on the rope and it is, in fact, there. The deer sighs, gently, and takes your name for the report.
      effects:
      - nerve-1
      - flag:deer_reported
  - id: c
    label: Thank the deer and ask about the oxen
    skill: none
    target: null
    success:
