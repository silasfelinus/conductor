  - The briefings are accurate for 1897 and slightly alarming for any other year.
  - Anyone who follows the briefing reaches the trailhead fifteen minutes before they left.
  scene: 'A deer in a bright orange volunteer vest steps onto the path and clears its throat. "Good evening. Today''s hazards are as follows: a steam donkey on the east grade, a mild stampede of oxen, and a speech by the county supervisor. Please stay behind the rope." There is no rope. The deer waits, politely, until you nod. A faint brass band tunes up somewhere in the ferns.'
