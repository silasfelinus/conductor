  revision: 1
  chapter: 1
  location: Arcata Community Forest / Redwood Park
  title: The Deer in the Reflective Vest
  tier: invented
  provenance: The Community Forest and its volunteer culture are real; the vested deer and its 1897 committee are invented fiction and no real volunteer or official is depicted.
