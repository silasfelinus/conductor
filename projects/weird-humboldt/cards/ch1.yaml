- id: WH-018
  revision: 1
  chapter: 1
  location: Cal Poly Humboldt campus
  title: The Thesis Defense of the Dead
  tier: invented
  provenance: Thesis defenses are routine academic practice; the committee member who never graduated or died, and the defense itself, are invented fiction.
  rarity: uncommon
  tone:
  - dry
  - gothic
  - funny
  cast:
  - Dr. Ellery Marsh (committee member, unfinished, unending)
  - The Chair (human, tired)
  canon:
  - The committee has had the same fifth seat since before the building was renovated.
  - Dr. Marsh never graduated and never died; he insists both facts are on the form.
  - A defense passes only when every member signs, including the one who cannot hold a pen.
  scene: The defense room has five chairs and four nameplates. The fifth chair holds a tweed coat with no one in it, and the coat is asking pointed questions about your methods. The chair of the committee mouths please just answer. A cold cup of coffee refills itself whenever you lie. "I never graduated," the coat says, "and I never died. I am a very rigorous examiner for that reason."
  options:
  - id: a
    label: Defend your argument on its merits
    skill: wits
    target: 9
    success:
      text: The coat nods slowly, and the fifth nameplate warms to read a real surname. You learn the committee seat hides a map of old campus tunnels.
      effects:
      - evidence:geography
      - flag:thesis_defended
      - goodwill+1
    failure:
      text: Dr. Marsh finds an error in footnote nine that you have not yet committed. The coffee boils over and the room records it.
      effects:
      - nerve-1
      - flag:thesis_flunked
  - id: b
    label: Ask Dr. Marsh about his own unfinished work
    skill: rizz
    target: 9
    success:
      text: 'The coat softens. He passes you a yellowed index card of research notes ending mid-sentence, and a request: finish the sentence for him.'
      effects:
      - evidence:document
      - flag:thesis_marsh_heard
    failure:
      text: He takes offense, and the nameplates all rotate one chair to the left, which is not helpful.
      effects:
      - time-1
  - id: c
    label: Request a recess and read the committee bylaws
    skill: local_lore
    target: 7
    success:
      text: Bylaw nine allows a living guest to call a witness. You note the clause, a legal pathway the rest of the county will need later.
      effects:
      - evidence:history
      - flag:thesis_bylaw
    failure:
      text: The bylaws are in a dead language of footnotes. You come back with a headache and ten fewer minutes.
      effects:
      - time-1
  lead_reactions:
    mara: Mara studies the coat's seams. "Hand-stitched, mended often. Somebody loved this thing before it started grading."
    kit: Kit addresses the empty chair with a bow. "A fine examiner deserves a standing ovation and a longer lunch."
    juniper: Juniper sits quietly beside the coat. "He is not angry. He is waiting to be told he is allowed to finish."
    cedar: Cedar reads the nameplates. "Four of these are real names. Who put the fifth up, and who is paying the dues?"
