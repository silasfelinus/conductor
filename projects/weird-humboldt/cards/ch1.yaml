- id: WH-011
  revision: 1
  chapter: 1
  location: Arcata Community Forest / Redwood Park
  title: The Trail with Two Trailheads
  tier: invented
  provenance: The Community Forest trails are real and public; the jogger, the double trailhead and its sign are invented fiction and depict no real person.
  rarity: common
  tone:
  - eerie
  - funny
  - looping
  cast:
  - Priya Dunmore (a jogger in a reflective headband, fixed)
  - The Second Trailhead (patient, fixed)
  canon:
  - The jogger keeps emerging at a trailhead she has not yet reached.
  - Both trailheads carry the same wooden sign and the same mud.
  - The trail is only a loop if you insist on reaching the end.
  scene: A jogger in a reflective headband jogs out of the trees, checks her watch, looks up at the trailhead sign and groans. "That is the third time I have arrived at the one I was leaving." Behind her the same sign stands twice, thirty feet apart, with identical mud. She hands you a trail map folded wrong. "Please tell me which one is real. I would like to go home."
  options:
  - id: a
    label: Trace the loop on her map
    skill: wits
    target: 9
    success:
      text: You notice the two trailheads share a single parking lot that exists only on the map, and mark the spot. Priya laughs with relief and gives you her trail pass stub, stamped with a date from last week.
      effects:
      - evidence:geography
      - flag:trailhead_traced
      - weird+1
    failure:
      text: You fold the map the wrong way and the second trailhead lands on your own start point. Priya wishes you a speedy return, for both of you.
      effects:
      - time-1
      - flag:trailhead_tangled
  - id: b
    label: Jog the trail with her until it resolves
    skill: burly
    target: 7
    success:
      text: You keep pace for a mile, then another, then a third, and the trail finally runs out of ideas and delivers you both to a single sign. Priya collapses onto it, thrilled.
      effects:
      - flag:trailhead_jogged
      - goodwill+1
      - evidence:rumor
    failure:
      text: You are fit for a plaza, not a forest, and you finish winded and a trailhead behind.
      effects:
      - nerve-1
      - time-1
  - id: c
    label: Tell her to sit down and stop arriving
    skill: none
    target: null
    success:
      text: You make Priya sit on a log between the two signs. Slowly, the one on the left stops feeling plausible and fades like a bad habit. She tips her water bottle to you in thanks.
      effects:
      - flag:trailhead_rested
      - goodwill+1
  lead_reactions:
    mara: Mara studies the sign. "Same carving, same grain. Somebody made two on purpose, and only one is in the budget."
    kit: Kit grins. "A trail that gets you coming and going. Efficiency, finally."
    juniper: Juniper kneels in the mud. "It is not lost. It is shy. It keeps showing up early because it is afraid of being late."
    cedar: Cedar shakes his head. "I have walked that forest forty years. There was never a second sign. Until now, there never needed to be."
