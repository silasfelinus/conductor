      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara checks the clipboard. "Real clipboard, real cue times. Whoever wrote these knows this building very well."
    kit: Kit is delighted. "A chicken with notes. Honestly, the most professional person in this theater."
    juniper: Juniper tilts her head at the stage. "It is not a prop anymore. Something wanted a voice, and the chicken was nearby."
