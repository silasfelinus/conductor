- id: WH-019
  revision: 1
  chapter: 1
  location: Cal Poly Humboldt campus
  title: The Mascot Disputes Biology
  tier: invented
  provenance: The campus has a real mascot tradition; the mascot suit developing accurate, unsolicited zoological opinions is invented fiction.
  rarity: common
  tone:
  - absurd
  - funny
  - warm
  cast:
  - The Mascot (a sentient costume with a master's in zoology)
  - Bystanders (loyal, embarrassed)
  canon:
  - The mascot knows more about local wildlife than anyone on the quad.
  - It is always correct and never tactful.
  - It will keep correcting everyone until someone says thank you.
  scene: A pep rally is in progress when the mascot interrupts the cheer to correct it. "A lumberjack is not a bird," it announces, "and neither is a banana slug, which is a gastropod with opinions." The crowd cheers, then winces. The mascot corrects a nearby sign, a passing crow and a man holding a hot dog. Its voice is warm, relentless and, annoyingly, accurate.
  options:
  - id: a
    label: Challenge it to a trivia duel
    skill: wits
    target: 9
    success:
      text: You hold your own for six rounds and win on a rare lichen question. The mascot pins a hand-lettered ribbon on you and shares a field guide tip.
      effects:
      - evidence:geography
      - flag:mascot_dueled
    failure:
      text: It is right. It is right again. The crowd gives you a kind round of applause that hurts worse than silence.
      effects:
      - nerve-1
  - id: b
    label: Thank it sincerely for the corrections
    skill: rizz
    target: 7
    success:
      text: The mascot goes quiet, then bows. "Nobody ever says that," it whispers, and offers a mud-stained map of its favorite quiet stretch of the dunes.
      effects:
      - evidence:geography
      - goodwill+1
      - flag:mascot_thanked
    failure:
      text: It hears sarcasm that is not there and corrects your gratitude for three minutes while the rally empties.
      effects:
      - time-1
  - id: c
    label: Lead it away to a quieter lawn
    skill: none
    target: null
    success:
      text: You steer the mascot toward the grass, where it names every plant on the way. The detour costs time and a free draw, but it stops shouting.
      effects:
      - flag:mascot_walked
      - lose:free_draw
  lead_reactions:
    mara: Mara admires the stitching on the costume. "The seam work is gorgeous. Whoever built this took pride in being corrected."
    kit: Kit starts a rhythm with the crowd. "If it is going to lecture, it deserves a backbeat."
    juniper: Juniper looks at the mascot with respect. "It says the true things loudly. That is a hard way to live."
    cedar: Cedar nods. "Corrections save time. I like it better than the folks who nod and get it wrong."
  callbacks:
  - mascot_dueled
  - mascot_thanked
  - mascot_walked
