      effects:
      - flag:deer_oxen
      - goodwill+1
  lead_reactions:
    mara: Mara frowns at the vest. "Stitched, not printed. Somebody sewed that to a deer on purpose, and they did a lovely job."
    kit: Kit salutes the deer. "Finally, a safety officer who looks the part. I would follow that vest anywhere."
    juniper: Juniper bows to it. "He is not pretending. For him it is 1897 and the forest is grateful someone still keeps the rules."
