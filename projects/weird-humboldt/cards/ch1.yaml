  scene: 'At the midnight show a rubber chicken in a feather boa has climbed onto the lip of the stage and is reading notes off a clipboard it should not be able to hold. "Nobody told me my motivation," it says in a surprisingly reasonable voice. Wendell, the stage manager, mouths a single word at you from the wings: help. The audience is throwing toast at nothing in particular.'
