  scene: A rowboat comes up the Mad River against the current. The water around it is perfectly still, a mirror in a moving stream. The rower is dry from hat to boots. "I have a meeting," he says, "with you. About the oars." He holds one up. It is bone dry and humming faintly with an unfinished sentence.
