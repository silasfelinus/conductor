- id: WH-031
  revision: 1
  chapter: 2
  location: Luffenholtz Beach
  title: Footprints Arriving from the Sea
  tier: invented
  provenance: Luffenholtz Beach is a real stretch of coast; the wet footprints, their direction and the walker they imply are invented fiction, and no real visitor or drowning is depicted.
  rarity: common
  tone: [eerie, gentle, puzzling]
  cast: ['The Walker (never seen, leaves wet bare tracks, fixed)', 'A dog walker named Ines (local, startled, helpful)']
  canon: [The footprints climb uphill from the water before the waves reach that point., The walker is not hostile; the prints stop at the same bench every night., 'The tide is arriving later each day, as if to give the walker time.']
  scene: The sand is dry at the top of the stair, and yet a line of wet bare footprints climbs it, one print after another, glistening and cold. They begin at the waterline and walk upward. The waves haven't reached that point yet, which means the walker walked out of the sea before the sea got there. A dog walker named Ines points with her leash. "Every night," she says. "They stop at the bench."
  options:
  - id: a
    label: Follow the prints to the bench
    skill: local_lore
    target: 7
    success:
      text: At the bench the prints stop and a small puddle of seawater holds an old coin and a tide table in a language of knots. You recognize a local fishing family's shorthand.
      effects: ['evidence:document', 'flag:prints_followed']
    failure:
      text: The prints loop twice around the bench and lead you back to the stairs, where you find your own boot prints arriving from the sea. You have been walking in circles.
      effects: [time-1, weird+1]
  - id: b
    label: Ask Ines what she has noticed
    skill: rizz
    target: 7
    success:
      text: Ines has kept a notebook. She shows you eight nights of pencil sketches and the tide times, and lets you copy the pattern that the sea seems to be keeping for someone.
      effects: ['evidence:schedule', goodwill+1, 'flag:ines_notebook']
    failure:
      text: 'Ines gets protective of her dog and her night and shuts the notebook. She says only: "They''re polite. Don''t be loud."'
      effects: [nerve-1]
  - id: c
    label: Leave a dry towel on the bench
    skill: none
    target: null
    success:
      text: You leave the towel folded on the bench like a small offering. Whoever walks out of the sea will have somewhere to put their hands, and Ines raises her leash to you in salute.
      effects: ['flag:walker_towel', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: 'Mara crouches near a print. "Arch is high, toes spread. Barefoot, practiced. Someone who has done this walk many times."', kit: 'Kit tiptoes alongside them. "Whoever it is, I would love to have their cardio."', juniper: Juniper lays a palm on the sand. "The beach is not afraid. It's making room.", cedar: 'Cedar studies the stair. "Tide tables lie sometimes. Prints don''t. Whoever this is, they''re patient."'}
