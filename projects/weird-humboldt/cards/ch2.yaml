# Weird Humboldt v1 deck — chapter 2, Coast of improbable tides.
- id: WH-021
  revision: 1
  chapter: 2
  location: "Moonstone Beach"
  title: "Bigfoot Family Picnic"
  tier: invented
  provenance: "Moonstone Beach is a real place; the Sasquatch family, Uncle Glenn and the backward tide are original comic fiction. No local group is depicted."
  rarity: uncommon
  tone: [warm, domestic, uncanny]
  cast: ["Mama Orla (tallest Sasquatch, fixed)", "Pip (youngest, holds the cracked phone)", "Uncle Glenn (missing, never appears)"]
  canon:
    - A fourth figure appears in the family photo of three, and always did.
    - The tide is moving backward, and has been since before the player arrived.
    - Uncle Glenn is missing again; the family says this is typical.
  scene: >-
    Three vast figures in sun hats are arguing over the proper way to pose for a family photo. The youngest, Pip, holds a phone with a cracked screen. Mama Orla says you may leave if you promise not to call them the Sasquatches. Uncle Glenn is missing again; everyone agrees this is typical. The cooler contains sparkling water and a truly impossible number of deviled eggs. The tide has begun moving backward, but the family is focused on whether Glenn got the invitation.
  options:
    - id: a
      label: "Become the family photographer"
      skill: rizz
      target: 7
      success:
        text: "They pose. On Pip's cracked screen a fourth figure stands at the family's edge, smiling the way relatives do at a reunion they've outlived. Mama Orla clutches your hand and doesn't say a word."
        effects: [goodwill+1, "evidence:memory", "flag:picnic_photo_taken"]
      failure:
        text: "You mention Glenn at the wrong moment and the family splits into two arguments. One relative, offended and polite, follows you into the next scene."
        effects: [nerve-1, "flag:glenn_followup"]
    - id: b
      label: "Follow the backward tide"
      skill: psyche
      target: 9
      success:
        text: "The water backs away from your feet and leaves Glenn's folded note on the sand. It points to a place the family has avoided for forty years."
        effects: ["evidence:geography", "flag:glenn_note"]
      failure:
        text: "You return two hours older and soaked, with sea glass in every pocket and no explanation."
        effects: [time-1, weird+1]
    - id: c
      label: "Ask who brought the eggs"
      skill: none
      target: null
      success:
        text: "Pip receives your question like a compliment. You walk away with a recipe, a warning never to photograph the sea at dawn, and a standing invitation to the next picnic."
        effects: ["flag:sasquatch_recipe", goodwill+1]
  lead_reactions:
    mara: "Mara kneels to Pip's eye level. \"Show me the fourth one. I do portraits. I know the difference between a person and a pose.\""
    kit: "Kit catches an egg in mid-air, juggles two, and wins the whole beach over in seconds."
    juniper: "Juniper sets a ribbon on the cooler. \"They're family of the forest. You're allowed to be afraid; they're afraid of you too.\""
    cedar: "Cedar checks the cracked phone's timestamp and says, very quietly, \"This photo is from tomorrow.\""
  callbacks: [picnic_photo_taken, glenn_note, glenn_followup, sasquatch_recipe]
  eligibility: {requires_flags: [], excludes_flags: []}
  by_state:
    sober:
      narration: "Sober, you spot that the phone's clock and the sun disagree by an exact hour, and the fourth figure casts no shadow on the beach."
      check_mods: {}
    tipsy:
      narration: "A little loose and fond of every stranger, you want the whole family in one frame with you in it."
      check_mods: {a: 1, b: -1}
    stoned:
      narration: "The surf pulses to a rhythm you've definitely heard at the festival; it's a lead, and it needs a second witness."
      check_mods: {b: 1}
    tripping_balls:
      narration: "The picnic blanket is a map of the county, folds and all, with a red thread running toward a cove that isn't there yet."
      check_mods: {a: -1, b: 1}
      extra_option:
        id: d
        label: "Read the blanket as a map"
        skill: psyche
        target: 9
        success:
          text: "The red thread ends at a boulder the family has circled for years. Glenn's note was under it all along."
          effects: ["evidence:geography", "flag:glenn_note"]
        failure:
          text: "The map leads to the egg cooler, where you are given an egg and a heartfelt apology."
          effects: [nerve-1, "flag:sasquatch_recipe"]

- id: WH-027
  revision: 1
  chapter: 2
  location: "Trinidad Harbor"
  title: "The Seagull Union Bargain"
  tier: invented
  provenance: "Trinidad Harbor is real; the union, the lunches and the grievances are invented fiction. No real fishing or labor organization is depicted."
  rarity: common
  tone: [comic, bureaucratic]
  cast: ["Shop Steward Gwendolyn (herring gull, fixed)", "Harbormaster Lou (human, tired)"]
  canon:
    - The gulls have organized and have a grievance list at least eleven items long.
    - Stolen lunches are item one; the gulls want compensation, not apology.
    - Harbormaster Lou will not negotiate without a human witness.
  scene: >-
    Forty gulls stand in perfect formation on the dock. A herring gull in a tiny hard hat steps forward. "Shop steward Gwendolyn," she says, in a voice that has done this before. "We have years of unattended lunches stolen and no collective bargaining agreement. We require a mediator." Harbormaster Lou looks at you pleadingly over a thermos. "Please. Just say yes."
  options:
    - id: a
      label: "Mediate the grievance list"
      skill: rizz
      target: 9
      success:
        text: "You trade one sandwich-free hour a day for a pledge not to dive-bomb tourists. Gwendolyn shakes your hand with a webbed foot and the harbor cheers."
        effects: [goodwill+1, "flag:gull_accord"]
      failure:
        text: "The meeting runs long. Lunches are stolen anyway, including yours, and a gull files a formal complaint about your negotiating style."
        effects: [nerve-1, time-1]
    - id: b
      label: "Audit the dock's lunch records"
      skill: wits
      target: 7
      success:
        text: "The stolen lunches match a perfect tide schedule. Someone is feeding the gulls on purpose, in order, as if to make them organize."
        effects: ["evidence:document", weird+1]
      failure:
        text: "The records list lunches that were stolen on days the harbor was closed. You decide not to ask."
        effects: [time-1]
    - id: c
      label: "Offer your own lunch as a good-faith gesture"
      skill: none
      target: null
      success:
        text: "Gwendolyn accepts, inspects it and declares it adequate. The gulls adopt you as a courtesy member, which will matter later."
        effects: ["flag:gull_courtesy_member", "lose:free_draw"]
  lead_reactions:
    mara: "Mara signs the grievance list with a flourish. \"Clear terms. Written down. Everyone gets something.\""
    kit: "Kit mimes a boxing match with the lead gull, and loses with theatrical grace."
    juniper: "Juniper speaks to the gulls in a low coastal tongue and they straighten their ranks."
    cedar: "Cedar reads the contract clauses aloud. \"Item eight is a CB channel assignment. Why do the gulls have a radio plan?\""
  callbacks: [gull_accord, gull_courtesy_member]
  eligibility: {requires_flags: [], excludes_flags: [gull_accord]}

- id: WH-039
  revision: 1
  chapter: 2
  location: "Mad River / Hammond Trail"
  title: "The Secret Tide Committee"
  tier: invented
  provenance: "The trail and river are real; the committee, its clipboards and the vote are invented fiction. No real local committee is depicted."
  rarity: uncommon
  tone: [satire, civic, uncanny]
  cast: ["Chairperson Bea Tanaka (fixed)", "Treasurer Ollie (silent, holds the gavel)"]
  canon:
    - The committee has motions to remove the moon from office and has the votes.
    - The Moon is a guest on campus and is not aware of the vote.
    - Chair Tanaka sincerely believes the tide is a public utility.
  scene: >-
    Eleven locals with clipboards sit in a ring of folding chairs at the edge of the river. A banner reads SPECIAL SESSION: MOTION TO VACATE THE MOON. Chairperson Tanaka bangs a gavel made from a driftwood knot. "The motion is on the floor. Who will speak for the defendant?" The Moon is not present. No one has told it.
  options:
    - id: a
      label: "Speak for the Moon in public comment"
      skill: rizz
      target: 9
      success:
        text: "You mention the harbor, the sea glass and the sandwich-stealing gulls. Three members flip to nay. The vote ties, and Treasurer Ollie breaks it with one slow bang of the gavel."
        effects: [goodwill+1, "flag:moon_defended"]
      failure:
        text: "The motion carries by one vote. The tides will be running strangely for the rest of the weekend."
        effects: [nerve-1, weird+1, "flag:moon_vacated"]
    - id: b
      label: "Move to table the motion for lack of notice"
      skill: local_lore
      target: 7
      success:
        text: "Quoting a bylaw nobody remembers, you table the motion. Chair Tanaka beams. \"Finally, someone who reads.\""
        effects: ["evidence:history", "flag:motion_tabled"]
      failure:
        text: "The bylaw you quote was repealed in 1974. You are loudly thanked for your service and asked to sit down."
        effects: [time-1]
    - id: c
      label: "Take the minutes and say nothing"
      skill: none
      target: null
      success:
        text: "Your minutes become the only record of the session. When someone later asks who voted, you are the only one who knows."
        effects: ["flag:tide_minutes", "evidence:document"]
  lead_reactions:
    mara: "Mara asks whether the committee will compensate the Moon. They have not thought of that."
    kit: "Kit stages a mock trial in the dirt, with a rock as the defendant."
    juniper: "Juniper simply laughs, a long delighted laugh, and the whole committee falls quiet."
    cedar: "Cedar scans the agenda. \"Item four is a rate hike on the river. Someone is charging for water that moves.\""
  callbacks: [moon_defended, moon_vacated, motion_tabled, tide_minutes]
  eligibility: {requires_flags: [], excludes_flags: []}
- id: WH-040
  revision: 1
  chapter: 2
  location: Hammond Trail, Mad River
  title: The Kayak in the Tree
  tier: reported
  provenance: The Hammond Trail and Mad River estuary are real places; the lost kayak, its saltwater and its need for directions are invented fiction.
  rarity: common
  tone:
  - wry
  - salty
  - gentle
  cast:
  - The Kayak (upside down, dripping, polite)
  - A Jogger Who Did Not Stop
  canon:
  - An upside-down kayak sits wedged in a spruce well above any tide line and drips saltwater onto the trail.
  - The kayak speaks in a hull-hollow murmur and only asks where home is, never why it is in a tree.
  - Home is a particular dock, and the kayak will not accept any other.
  scene: 'A red kayak hangs upside down in a spruce beside the Hammond Trail, twenty feet above any tide line, dripping saltwater onto the path in slow, patient beats. A jogger passes below without looking up. From inside the hull, a murmur asks: "Excuse me. Which way is the water? Not this water. The water I belong to." It sounds embarrassed to have to ask a stranger.'
  options:
  - id: a
    label: Ask which dock it remembers
    skill: local_lore
    target: 7
    success:
      text: It names a dock with a green door, a tide gauge and a gull called Bernard. You know the place, and the kayak sags with relief against the branches.
      effects:
      - goodwill+1
      - flag:kayak_heading_known
    failure:
      text: The dock it describes belongs to three different harbors. The kayak's hull rings flatly, and a little saltwater runs down the trunk.
      effects:
      - evidence:rumor
      - nerve-1
  - id: b
    label: Climb up and ease it down
    skill: burly
    target: 9
    success:
      text: You work it loose branch by branch and carry it to the estuary mud. It floats the second the tide touches it, then rights itself with a very small cheer.
      effects:
      - flag:kayak_carried
      - goodwill+1
    failure:
      text: A branch gives way and you slide down with a mouthful of needles. The kayak, kindly, pretends to have seen nothing.
      effects:
      - nerve-1
      - time-1
  - id: c
    label: Say the trail is the way home
    skill: none
    target: null
    success:
      text: The kayak is quiet for a long while. "That seems unlikely," it says, "but I appreciate the effort." It drips once, lightly, onto your shoulder.
      effects:
      - flag:kayak_misdirected
  lead_reactions:
    mara: Mara pats the hull like a stubborn horse. "It's been out too long. Everyone gets like this when they're lost near the water."
    kit: Kit grins at the drip pattern. "That's a rhythm. It's counting down to a tide it can feel from here."
    juniper: Juniper sniffs the salt and tilts their head. "It smells like kelp and sorrow. It isn't lying about being far from home."
    cedar: Cedar measures the height and frowns. "No flood puts a boat there. Something carried it, and it wasn't water."
  callbacks:
  - kayak_heading_known
  - kayak_carried
  - kayak_misdirected
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-022
  revision: 1
  chapter: 2
  location: Trinidad Head tide pools
  title: The Tide-Pool Tenant
  tier: invented
  provenance: Tide pools on the Humboldt coast are real; the tiny landlord, its rent roll and the crab tenants are invented fiction. No real person or business is depicted.
  rarity: uncommon
  tone: [absurd, petty, coastal]
  cast: ["Landlord Whelk (a snail the size of a thumbnail, litigious)", "Three Hermit Crabs (behind on rent)"]
  canon:
    - A small tide-pool landlord charges rent to every crab on the rocks, payable in shells and favors.
    - The crabs believe the rent is fair and also fraudulent.
    - Landlord Whelk will accept any mediator who can stay dry at ankle height.
  scene: >-
    The tide has pulled out and left a pool the size of a dinner table. A snail with a ledger balanced on its shell announces itself as Landlord Whelk and asks if you are a witness or a guarantor. Three hermit crabs wave claws at you from three different directions, each with a different understanding of who owes what. The anemones, you gather, are the building inspectors, and they are watching.
  options:
    - id: a
      label: "Mediate a payment plan in shells"
      skill: rizz
      target: 9
      success:
        text: "You broker a schedule of two shells a tide and a moratorium on eviction during storms. Whelk stamps the ledger, the crabs click their approval, and the pool exhales."
        effects: [goodwill+1, "flag:whelk_settlement"]
      failure:
        text: "The crabs hear a rent hike, the snail hears an insult, and you are asked, politely, to leave the pool and the jurisdiction."
        effects: [nerve-1]
    - id: b
      label: "Audit the ledger"
      skill: wits
      target: 9
      success:
        text: "The ledger counts each tide twice: once going out, once coming in. You circle the double billing, and Whelk goes pale in the way snails can."
        effects: ["evidence:ledger", weird+1]
      failure:
        text: "The columns are in tide time, which runs backward on alternate pages. You close the ledger with a headache."
        effects: [time-1]
    - id: c
      label: "Pay a month's rent yourself"
      skill: none
      target: null
      success:
        text: "You leave a handful of beach glass on the rim of the pool. The snail issues a receipt in the form of a very small, very official bubble."
        effects: ["flag:whelk_receipt", "lose:free_draw"]
  lead_reactions:
    mara: "Mara photographs the ledger page and murmurs, \"The handwriting is pure spite, but beautiful spite.\""
    kit: "Kit tips an imaginary hat to the landlord. \"Sir. I would like to speak to the manager of the ocean.\""
    juniper: "Juniper kneels by the water and watches the smallest crab. \"They're not mad. They're scared of the tide.\""
    cedar: "Cedar crouches and checks the rock for a lease. \"Whoever owns this holds it by gravity and persistence.\""
  callbacks: [whelk_settlement, whelk_receipt]
  eligibility: {requires_flags: [], excludes_flags: []}
- id: WH-028
  revision: 1
  chapter: 2
  location: Trinidad Harbor
  title: Fish with a Press Credential
  tier: invented
  provenance: Trinidad Harbor is a real working harbor; the salmon reporter, its credential and its exclusive are invented fiction. No real journalists, outlets or fishers are depicted.
  rarity: uncommon
  tone: [whimsical, dry, tense]
  cast: [Pike Marlow (a salmon with a laminated press pass), 'The Harbor Dock Cart (listening in, badly)']
  canon: [The salmon has a valid press credential from an outlet that has never printed anything., 'Its exclusive is real, but it demands discretion in exchange.', 'Salmon have no sense of an embargo, only of tide.']
  scene: A salmon is propped against a dock piling in a shallow tray of water, a laminated press pass clipped to one fin. "Pike Marlow, tide desk," it says, in the clipped voice of someone who has done this before. "I have an exclusive. I will trade it for discretion. You have until the next wave to decide what I am worth."
  options:
  - id: a
    label: Promise discretion and ask for the exclusive
    skill: rizz
    target: 7
    success:
      text: Marlow glances left, then right, then tells you which boat is quietly not coming back. You write it down and say nothing to anyone.
      effects: ['evidence:harbor_exclusive', goodwill+1]
    failure:
      text: You promise too eagerly. Marlow files a brief item about your eagerness, which does not stay brief.
      effects: [nerve-1]
  - id: b
    label: Check the press pass for forgery
    skill: wits
    target: 9
    success:
      text: The laminate is real, and the outlet is a tide chart printed on kelp. You hand the pass back, impressed, and Marlow nods with a flicker of respect.
      effects: ['flag:marlow_vetted', weird+1]
    failure:
      text: You read the pass upside down, and Marlow files a correction on your behalf. The correction is also about you.
      effects: [time-1]
  - id: c
    label: Buy the interview a round of kelp chips
    skill: none
    target: null
    success:
      text: 'Marlow accepts the chips with a stiff little nod and a quote for the record: the tide is a story, and you are in it. A press pass appears, folded, in your pocket.'
      effects: ['flag:marlow_pass', goodwill+1]
  lead_reactions: {mara: 'Mara sketches Marlow mid-interview. "Fins like a collar, eyes like a deadline. I would hire this fish in a heartbeat."', kit: 'Kit leans in and whispers, "Off the record, on the record, and on the water. I respect the hustle."', juniper: 'Juniper dips her fingers in the tray, and Marlow flinches, then settles. "He is nervous," she says. "Not about us."', cedar: Cedar frowns at the pass. "Real laminate. Somebody in this harbor has a very good press."}
  callbacks: [marlow_vetted, marlow_pass]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-029
  revision: 1
  chapter: 2
  location: "Trinidad Harbor"
  title: "The Harbor Below the Harbor"
  tier: invented
  provenance: "Trinidad Harbor is a real working harbor; the uncharted dock, its keeper and the ledger are invented fiction. No real harbor staff or vessels are depicted."
  rarity: rare
  tone: [eerie, quiet, wry]
  cast: ["Dockmaster Orrin (a patient figure in a yellow slicker)", "The Lower Dock (appears only at low tide)"]
  canon:
    - "A low tide exposes a dock that appears on no navigational chart."
    - "Boats are moored there that left port a long time ago."
    - "The dock exists until the tide returns, and no longer."
  scene: "At the bottom of the tide a second set of pilings stands out of the wet sand, and a weathered dock runs out to nothing. A figure in a yellow slicker is stamping a ledger. \"Berth seven is yours if you can be quick,\" says Dockmaster Orrin. \"The sea gives us about an hour, and it does not give extensions.\""
  options:
    - id: a
      label: "Ask which boats are moored here"
      skill: wits
      target: 9
      success:
        text: "Orrin reads out the names, and one belongs to a boat whose crew is still being searched for upstairs. You commit it to memory."
        effects: ["evidence:lower_dock_ledger", weird+1]
      failure:
        text: "Orrin reads out the names. You can only remember that one sounded like soup."
        effects: [time-1]
    - id: b
      label: "Charm your way to berth seven"
      skill: rizz
      target: 7
      success:
        text: "Orrin stamps the ledger with a flourish. \"Berth seven, no fee, and mind the third plank. It remembers.\""
        effects: [goodwill+1, "flag:berth_seven"]
      failure:
        text: "Orrin takes your charm for an attempt at bribery and logs it with a sigh."
        effects: [nerve-1]
    - id: c
      label: "Leave a note and head back before the tide"
      skill: none
      target: null
      success:
        text: "You pin a note to a piling and hurry back as the water closes. Behind you, the dock finishes folding itself away, and the note, you are fairly sure, is read."
        effects: ["flag:lower_dock_note", "lose:free_draw"]
  lead_reactions:
    mara: "Mara walks the planks, tracing the grain with one finger. \"This was built by a person who cared. Nobody builds like this for a lie.\""
    kit: "Kit juggles three pebbles along the dock edge and misses none. \"I like a stage that disappears. It forgives the bad nights.\""
    juniper: "Juniper kneels at the water's edge and listens. \"The tide is not hiding it. It is only holding it.\""
    cedar: "Cedar checks the pilings with a knuckle. \"Good timber, no rot. Somebody keeps this up, even when it is not here.\""
  callbacks: [berth_seven, lower_dock_note]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-023
  revision: 1
  chapter: 2
  location: Moonstone Beach
  title: Message in a Glass Kombucha
  tier: invented
  provenance: Moonstone Beach is real; the bottle, the handwriting, the date and the ocean's postage are invented fiction, and no real brand is depicted.
  rarity: common
  tone: [quirky, eerie, self-aware]
  cast: ['The Bottle (kombucha, glass, sealed, fixed)', Gull Eleven (an opinionated witness)]
  canon: [The note in the bottle is in the player's own handwriting and carries tomorrow's date., Whatever the note instructs is already half done by the time it is read., The sea has no postage system; the bottle simply insists on arriving.]
  scene: 'Between a drift log and a tangle of kelp lies a brown glass kombucha bottle, cap still tight, a slip of paper curled inside. When you hold it to the light the handwriting is unmistakably yours: the same crossed sevens, the same sulking loop on every G. The date at the top is tomorrow''s. Gull Eleven stands over it like a notary. "It arrived," she says, "before it was sent. Please sign for it."'
  options:
  - id: a
    label: Break the cap and read the whole note
    skill: wits
    target: 7
    success:
      text: 'The note is a list: three directions, one warning and a promise that you will be fine. The warning names a stretch of tideline, and you get to it before the tide does.'
      effects: ['evidence:geography', 'flag:bottle_read']
    failure:
      text: The cap shatters and the note smears into your own signature. You can read half of one sentence, which says only WHY DID YOU OPEN IT.
      effects: [nerve-1, 'flag:bottle_smeared']
  - id: b
    label: Write a reply and send it back on the tide
    skill: rizz
    target: 9
    success:
      text: You write a short, honest answer to yourself and send it to sea. Gull Eleven nods approval and the bottle, for a moment, floats upstream toward the future.
      effects: [goodwill+1, 'flag:bottle_replied', weird+1]
    failure:
      text: Your reply comes out bossy, and the sea sends it back immediately, soggy, with a gull's footprint on it as formal review.
      effects: [time-1, 'evidence:rumor']
  - id: c
    label: Leave it sealed and walk away
    skill: none
    target: null
    success:
      text: You set the bottle on the log, unopened. Whatever is in it will be true either way, and Gull Eleven writes you down as someone who respects a deadline.
      effects: ['flag:bottle_unread', 'lose:free_draw']
  lead_reactions: {mara: 'Mara compares the ink. "Same pen pressure. Same shaking on the Gs. This is you, tired, being clever."', kit: Kit tests the cap and gasps. "Kombucha! The fizz survived the apocalypse of timing. Tragic and delicious.", juniper: Juniper kneels in the foam. "The sea carries what it carries. Whether it's late or early is your problem.", cedar: 'Cedar studies the bottle. "Brewed in a garage, not a factory. Somebody local sent this, or you did."'}
  callbacks: [bottle_read, bottle_smeared, bottle_replied, bottle_unread]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-025
  revision: 1
  chapter: 2
  location: Moonstone Beach
  title: The Last Sea Glass
  tier: invented
  provenance: Moonstone Beach is real and sea glass is a genuine local pastime; the tiny working lighthouse inside this piece and its keeper's schedule are invented fiction.
  rarity: uncommon
  tone: [wonder, gentle, quiet]
  cast: ['The Sea Glass (frosted green, contains a lighthouse, fixed)', 'The Tiny Keeper (an inch tall, polite, overworked)']
  canon: [Inside the sea glass is a miniature lighthouse that really sweeps its beam across the beach., The Tiny Keeper tends the light by hand and has not had a visitor since the last storm., 'The beam falls on things the tide has hidden, one at a time, in the same order every night.']
  scene: 'One piece of frosted green sea glass, the last on the strand, hums when you pick it up. Inside, a lighthouse no taller than a grain of rice turns a beam across a beach no bigger than a thumbnail. Someone small is waving from the lantern room. A voice the size of a hiccup says: "Please do not shake me. I have a tight schedule and no assistants."'
  options:
  - id: a
    label: Ask the keeper which way the beam falls next
    skill: wits
    target: 7
    success:
      text: The keeper checks a ledger the size of a flea and gives you three bearings. The beam lights a half-buried marker; the marker is a signpost that wasn't there at noon.
      effects: ['evidence:geography', 'flag:glass_bearings']
    failure:
      text: You jostle the glass and the beam strobes in your face. The keeper curses in a language of small bells and refuses to talk until you have apologized.
      effects: [nerve-1, time-1]
  - id: b
    label: Offer to carry the glass to a safer shore
    skill: rizz
    target: 9
    success:
      text: The keeper agrees, with conditions. You walk the glass up the beach in your cupped hands while the beam makes a path for you, and a tide-warning pulses twice.
      effects: [goodwill+1, 'flag:glass_carried', 'evidence:schedule']
    failure:
      text: The promise rings insincere, and the keeper draws the shutters inside the glass. It sits dark and pretending to be ordinary in your palm.
      effects: ['flag:glass_dark']
  - id: c
    label: Set it back where you found it
