  - The Tiny Council meets on the hour and votes with its antennae.
  scene: A castle the size of a hatbox sits in the sand, flags snapping, battlements immaculate. A speck in a sash climbs the tallest tower. "By the authority vested in me by approximately three thousand grains," Mayor Quartz announces in a voice like a whisper through a flute, "this course is hereby rerouted through the Municipal Moat." Nine ants raise their antennae in solemn assent. The race marshal is nowhere to be found.
