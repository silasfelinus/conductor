  revision: 1
  chapter: 6
  location: Ferndale finish line
  title: The Trophy with a Pulse
  tier: invented
  provenance: The Ferndale finish line is a real tradition in spirit; the trophy, its pulse and the name it whispers are invented fiction, and the real names of Wiyot and other peoples' places are treated with care, not claimed or invented here.
