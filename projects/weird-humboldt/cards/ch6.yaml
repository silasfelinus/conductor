      effects:
      - goodwill+1
      - flag:trophy_told
      - evidence:rumor
    failure:
      text: The truth comes out clumsy and the trophy winces kindly. It thanks you for trying and goes still, its pulse a patient drumbeat.
      effects:
      - time-1
  - id: c
    label: Stand with the trophy and hold its hand, so to speak
    skill: none
    target: null
    success:
      text: You rest a palm on its base and feel the pulse steady. It does not speak again, but you leave with the sense of having been thanked by something older than the race.
      effects:
      - flag:trophy_companion
      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara touches the base lightly. "There's a heartbeat in there. I'm not going to ask whose."
    kit: Kit lowers his voice. "A trophy with manners. If only every award did."
    juniper: Juniper steps back with care. "Some names are not mine to ask for. The trophy knows the difference, and so should we."
    cedar: Cedar takes off his hat. "That's the first trophy I ever felt like thanking. Good heart, whoever made it."
