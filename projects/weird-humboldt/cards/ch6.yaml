  - uncanny
  - solemn
  cast:
  - The Trophy (alive, gracious, fixed)
  - The Plaque (reads the county's original name)
  canon:
  - A trophy congratulates winners and whispers the county's original name.
  - The trophy's pulse speeds up when someone tells it a true thing.
  - The original name is not a secret; it is a gift handed over when asked correctly.
  scene: On the finish-line table, the trophy is gleaming and, quietly, breathing. Its base lifts and settles like a chest. "Well done," it says, in a voice like warm brass. "I mean it." It tilts toward you. "Ask me what this place was called, before the county, and I will tell you what I am allowed to." The crowd around you has gone gently quiet, as if hearing something very old.
