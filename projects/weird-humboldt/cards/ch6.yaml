  scene: A kinetic sculpture shaped like a giant copper fish crests the dune and drops, shrieking its gears. It rolls so fast that the sand behind it goes yesterday-colored. The pilot, clinging to a handlebar, waves frantically as the machine climbs back out of the dune a moment before it went in. "Can you stop us?" Ravi calls. "We keep arriving too early."
