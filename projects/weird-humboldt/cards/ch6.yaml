- id: WH-114
  revision: 1
  chapter: 6
  location: Humboldt Bay · kinetic water crossing
  title: The Tide Swaps Places with Time
  tier: invented
  provenance: Humboldt Bay's tides and the kinetic water crossing are real; the swapped tide, the stranger and the choice are invented fiction and depict no real person.
  rarity: rare
  tone:
  - tense
  - wistful
  - mythic
  cast:
  - The Tide (patient, fixed)
  - A Stranger on the Pier (mid-memory, fixed)
  canon:
  - At the crossing the tide trades places with time and offers a hard choice.
  - The player may save their equipment or rescue a stranger's lost memory, but not both.
  - The stranger will remember either way. The cost is whose memory it is.
  scene: Halfway across the bay, the tide stops and the seconds start coming in like water. A stranger stands on the pier clutching an empty frame, whose picture is draining away. The tide speaks, gently. "I can carry your gear to shore, or I can return her memory. Not both." Your equipment bobs at your feet in the swelling clock. The stranger looks at you and does not ask.
  options:
  - id: a
    label: Save the equipment and carry on
    skill: burly
    target: 7
    success:
      text: 'You haul the gear to shore with a great heave. The stranger watches you go without reproach, and leaves you a note: a description of the memory you did not save.'
      effects:
      - evidence:rumor
      - flag:tide_gear
      - nerve+1
    failure:
      text: You drop half the gear in the swell and the stranger still loses her memory.
      effects:
      - nerve-1
      - time-1
  - id: b
    label: Rescue the stranger's memory
    skill: psyche
    target: 9
    success:
      text: You reach into the swelling time and pull her memory out, whole and wet. She remembers your name and, in gratitude, tells you the route the tide will take next.
      effects:
      - evidence:geography
      - flag:tide_memory
      - goodwill+1
    failure:
      text: You grasp a memory that is not hers, and it shatters into harmless glass.
      effects:
      - nerve-1
      - flag:tide_shattered
  - id: c
    label: Ask the tide for a third option
    skill: none
    target: null
    success:
      text: The tide thinks. "There is one," it says. "Wait." You wait, and it hands you half the gear and half the memory, and keeps the rest for itself, which costs your free draw.
      effects:
      - flag:tide_third
      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara steadies the boat. "Equipment is replaceable. People are not. But I understand why you might hesitate."
    kit: Kit bites a lip. "I would have saved her. Then I would have complained for a week about the gear."
    juniper: Juniper sets a palm on the water. "The tide is not cruel. It is simply honest about what it can hold."
    cedar: Cedar looks at the stranger. "Some things you pick up even if it costs you. That is what decent looks like."
  callbacks:
  - tide_gear
  - tide_memory
  - tide_shattered
  - tide_third
