# Weird Humboldt v1 deck — chapter 6, The impossible festival.
- id: WH-101
  revision: 1
  chapter: 6
  location: "Arcata Plaza, kinetic starting line"
  title: "The Bicycle Powered by Applause"
  tier: invented
  provenance: "The Plaza is real and kinetic races are an established local tradition; this team, its machine and the impossible rhythm are invented fiction. No real race entrant is depicted."
  rarity: uncommon
  tone: [festive, rhythmic, communal]
  cast: ["Pilot Imelda Voss (fixed)", "Crew Chief Ratchet (fixed, teenage)"]
  canon:
    - The machine runs only when the crowd claps in an exact impossible rhythm.
    - The rhythm is the same as the frequency, played slower.
    - The crowd can learn it, but only if someone leads.
  scene: >-
    A pedal-powered contraption of bicycle parts, cymbals and one confused wind chime idles at the starting line. Pilot Voss holds up a hand. "She runs on applause," she says. "Not just any applause. Seven, then five, then a silence you can feel in your ribs." Crew chief Ratchet, who is perhaps fifteen, hands you a bullhorn. "You have a crowd and a voice. Lead."
  options:
    - id: a
      label: "Teach the crowd the rhythm"
      skill: rizz
      target: 9
      success:
        text: "Thousands of hands find the pattern. The bicycle lurches, hums, and rolls, and the Plaza feels, for a moment, like one body."
        effects: [goodwill+1, "flag:applause_led"]
      failure:
        text: "The crowd claps seven, then nine, then eleven. The bicycle coughs and goes up in a modest, cheerful fireball."
        effects: [nerve-1, "flag:applause_failed"]
    - id: b
      label: "Work out the rhythm from the machine"
      skill: wits
      target: 7
      success:
        text: "The cymbals are tuned in a pattern you've heard before, and the wind chime is the final note. You hand Ratchet a chart."
        effects: ["evidence:frequency", "flag:rhythm_chart"]
      failure:
        text: "You get the pattern backward and the machine rolls in reverse."
        effects: [time-1]
    - id: c
      label: "Clap alone, steadily, and let others join"
      skill: none
      target: null
      success:
        text: "It takes a minute. Then a child joins you, then a vendor, then a cop. The bike starts. You do not take credit."
        effects: ["flag:started_alone", goodwill+1]
  lead_reactions:
    mara: "Mara closes her eyes and claps the rhythm on her knee. \"I know this. It's a heartbeat.\""
    kit: "Kit starts the crowd off with a juggler's cue, and the Plaza answers in time."
    juniper: "Juniper hums the rhythm until the pigeons take up the beat."
    cedar: "Cedar scribbles the pattern on his hand. \"It's a modulation scheme. Somebody is encoding something.\""
  callbacks: [applause_led, applause_failed, rhythm_chart, started_alone]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-110
  revision: 1
  chapter: 6
  location: "Manila dunes, kinetic course"
  title: "The Official Unofficial Rescue Team"
  tier: invented
  provenance: "The dunes are a real coastal landform; the cryptid crew, their truck and the repairs are invented fiction. No real rescue agency is depicted."
  rarity: uncommon
  tone: [cheerful, competent, cryptid]
  cast: ["Foreman Sasquatch Tobias (fixed)", "Mothman Dev (fixed, mechanic)"]
  canon:
    - The crew repairs stranded race sculptures for free and for the pleasure of it.
    - They do not appear in photographs, by agreement with the photographers.
    - Tobias will not take payment but will take a favor.
  scene: >-
    A kinetic sculpture lies on its side in the dunes with a wheel off. A pickup truck marked UNOFFICIAL (OFFICIAL) RESCUE pulls up and a very large foreman hops out, followed by a slim figure with enormous wings folded neatly under a tool vest. "Don't mind us," says Tobias. "We're just here to help." Within minutes the wheel is back on. They have not asked for anything.
  options:
    - id: a
      label: "Offer to help with the repair"
      skill: burly
      target: 7
      success:
        text: "You hold the axle while Dev welds. Tobias claps your shoulder, and you are now an honorary member of a crew that does not exist."
        effects: [goodwill+1, "flag:rescue_crew_member"]
      failure:
        text: "You drop the wrench on Tobias's foot. He pretends it did not happen with great dignity."
        effects: [nerve-1]
    - id: b
      label: "Ask them how they learned to fix things"
      skill: local_lore
      target: 9
      success:
        text: "They were trained by an old logging-camp mechanic, a man who never left the county. They give you his name and a tool he left behind."
        effects: ["evidence:history", "flag:mechanic_tool"]
      failure:
        text: "Tobias changes the subject with the smoothness of a man who has done it before."
        effects: [time-1]
    - id: c
      label: "Ask for the favor they'd want in return"
      skill: none
      target: null
      success:
        text: "Tobias thinks. \"Don't tell anyone about the pie.\" You promise, and later you receive the pie."
        effects: ["flag:cryptid_pie", goodwill+1]
  lead_reactions:
    mara: "Mara studies the crew with respect. \"They don't want credit. That's rare.\""
    kit: "Kit and Dev trade tricks; Dev can juggle with wings."
    juniper: "Juniper greets Tobias in an old forest way and he answers with a bow."
    cedar: "Cedar and Dev disappear under the sculpture and come out arguing happily about torque specs."
  callbacks: [rescue_crew_member, mechanic_tool, cryptid_pie]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-117
  revision: 1
  chapter: 6
  location: "Ferndale finish line"
  title: "The Finish Line Moves"
  tier: invented
  provenance: "Ferndale is a real town and a historic race finish; the vanishing banner, the officials and the claims are invented fiction. No real person or organization is depicted."
  rarity: rare
  tone: [climactic, absurd, wry]
  cast: ["Chief Timekeeper Odalys (fixed)", "The Finish Banner (sentient, shy)"]
  canon:
    - The finish banner vanishes whenever someone claims to have solved the mystery.
    - The banner is not hostile; it is protecting the answer from being declared too early.
    - Odalys can tell the player what would count as a real solution.
  scene: >-
    The finish line is a long banner strung between two Victorian porches. As you approach, a runner shouts, "I've got it! The answer is—" and the banner is gone, replaced by an empty street. Chief Timekeeper Odalys sighs and unfolds a lawn chair. "It does that. Everyone gets excited. Try again when you're sure."
  options:
    - id: a
      label: "Present your verified evidence to Odalys"
      skill: wits
      target: 11
      success:
        text: "Odalys reads your evidence slowly. The banner reappears, hesitant, then holds. She stamps your sheet. \"Provisional,\" she says. \"But yes.\""
        effects: ["evidence:document", goodwill+1, "flag:finish_provisional"]
      failure:
        text: "Your evidence is not enough. The banner stays gone, but Odalys marks exactly what is missing."
        effects: [time-1, "flag:finish_gap_named"]
    - id: b
      label: "Reassure the banner"
      skill: rizz
      target: 9
      success:
        text: "The banner flutters back into view and curls around your shoulders for a moment. It is not afraid of you; it is afraid of being wrong."
        effects: [goodwill+1, "flag:banner_trusts"]
      failure:
        text: "The banner flickers, withdraws farther down the street, and will not meet your eye for a while."
        effects: [nerve-1]
    - id: c
      label: "Sit with Odalys until the street goes quiet"
      skill: none
      target: null
      success:
        text: "You sit. Eventually the banner sneaks back up the street and ties itself to the porch at its own pace. Odalys offers you half a sandwich."
        effects: ["flag:finish_waited", "clarity+1"]
  lead_reactions:
    mara: "Mara sits down beside Odalys. \"Some things you can't rush.\""
    kit: "Kit tosses a ring of juggling clubs up and lets the banner decide when to appear."
    juniper: "Juniper lays a hand on the porch rail and whispers, \"You're safe. We'll wait.\""
    cedar: "Cedar paces. \"If the banner is a sensor, then the claim is a trigger. We need a better test.\""
  callbacks: [finish_provisional, finish_gap_named, banner_trusts, finish_waited]
  eligibility: {requires_flags: [], excludes_flags: []}
  by_state:
    sober:
      narration: "Sober, you notice every claim made before the banner vanished was missing the same single fact."
      check_mods: {}
    tipsy:
      narration: "With a flush of confidence, you are tempted to announce the answer yourself, which is the exact thing the banner dislikes."
      check_mods: {b: 1, a: -1}
    stoned:
      narration: "The banner's edges ripple in the same slow rhythm as the frequency, and you can almost read its fear."
      check_mods: {b: 1}
    tripping_balls:
      narration: "The street is a held breath and the banner is the exhale; you understand it will return only when you stop reaching for it."
      check_mods: {a: -1, b: 1}
      extra_option:
        id: d
        label: "Let go of the answer and watch the street"
        skill: psyche
        target: 9
        success:
          text: "The banner drifts down and settles. You realize you can check your evidence in daylight, and it holds."
          effects: ["flag:banner_trusts", "clarity+1"]
        failure:
          text: "You let go too thoroughly and wander toward the fairgrounds for a while."
          effects: [time-1]
- id: WH-112
  revision: 1
  chapter: 6
  location: Humboldt Bay, festival crossing
  title: The Second Water Crossing
  tier: invented
  provenance: Humboldt Bay is real; the mirror bay, the crossing and everything under it are invented festival fiction with no documented basis.
  rarity: rare
  tone:
  - dreamlike
  - tense
  - bright
  cast:
  - The Mirror Bay (the same water, below the first)
  - A Race Marshal in a Rubber Duck Costume
  canon:
  - For one tide a second bay forms just beneath the first, reflected and slightly kinder.
  - Crossing the lower water costs a memory's worth of speed; crossing the upper water costs nothing but the risk.
  - The marshals will accept either route and will judge neither.
  scene: 'Halfway through the water crossing the bay splits. Beneath the choppy surface lies a second bay, perfectly still and a few shades brighter, with a mirror-image of the course running upside down below your boat. The marshal in the rubber duck costume shrugs from the dock: either route counts. The upper water is rough but yours. The lower water is calm and smells like a place you have not been yet.'
  options:
  - id: a
    label: Hold the upper route against the chop
    skill: burly
    target: 9
    success:
      text: You haul through the chop, wet, grinning, and first to the far buoy. The mirror bay below applauds with ripples, and the marshal blows a squeaky horn.
      effects:
      - goodwill+1
      - flag:bay_upper_crossed
    failure:
      text: A swell tips your boat and the course drags you sideways. You finish soaked, last, and strangely exhilarated.
      effects:
      - nerve-1
      - time-1
  - id: b
    label: Slip through to the mirror bay
    skill: psyche
    target: 9
    success:
      text: The water takes you gently. On the far side your boat surfaces beside the finish, a minute early and with a new memory that isn't yours yet.
      effects:
      - evidence:mirror_bay
      - weird+1
    failure:
      text: The lower water holds you a beat too long. You surface with half a memory of someone else's morning and no idea whose.
      effects:
      - nerve-1
      - weird+1
  - id: c
    label: Wait on the dock and let it pass
    skill: none
    target: null
    success:
      text: You watch both bays close together like a held breath. The marshal hands you a rubber duck in thanks for the patience, and it keeps your seat.
      effects:
      - flag:bay_crossing_watched
      - lose:free_draw
  lead_reactions:
    mara: Mara studies the mirrored course and smiles. "A perfect reflection. I'd ink that on my forearm just to remember the doubt."
    kit: Kit whoops at the doubled waves. "Two songs on one tide! Pick a verse and commit to the bit."
    juniper: Juniper sniffs the lower water carefully. "It smells kind. Kind things can still ask a lot of you."
    cedar: Cedar checks the buoys against their reflections. "Everything's the same but flipped. Which means the flip is the cost."
  callbacks:
  - bay_upper_crossed
  - bay_crossing_watched
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-104
  revision: 1
  chapter: 6
  location: Arcata Plaza, Kinetic Grand Championship start line
  title: The Racer Who Is a Whole Committee
  tier: invented
  provenance: The Kinetic Grand Championship is a real regional event; the six-person entrant, its single registration and its paperwork are invented fiction. No real team or racer is depicted.
  rarity: uncommon
  tone: [festive, bureaucratic, absurd]
  cast: ["The Committee (six people, one entry, one opinion at a time)", "The Registrar (holds a clipboard like a shield)"]
  canon:
    - Six people insist they are a single entrant and every form agrees with them.
    - They speak one at a time but always finish each other's sentences.
    - The Registrar has checked and it is, apparently, correct.
  scene: >-
    At the start line a registrar looks up from a form with the expression of someone who has lost an argument with arithmetic. Six people in matching sashes stand in a row. "We are one racer," the first says. "We have always been one racer," says the second. The third, fourth, fifth and sixth nod. The form lists one name, one number, one set of wheels, and six signatures that all look like the same hand.
  options:
    - id: a
      label: "Interview each member separately"
      skill: psyche
      target: 9
      success:
        text: "Each member answers differently and every answer fits the next one like a gear. You come away convinced they are one person, shared out among six bodies for good reason."
        effects: ["evidence:committee", weird+1]
      failure:
        text: "By the fourth interview you cannot tell who you asked what. The Committee does not seem to mind and thanks you in unison."
        effects: [time-1, nerve-1]
    - id: b
      label: "Argue the registration is invalid"
      skill: wits
      target: 11
      success:
        text: "You find a clause allowing a single entrant to be 'of any number.' The Registrar stamps it and the line quietly lets them through."
        effects: [goodwill+1, "flag:committee_cleared"]
      failure:
        text: "The same clause works against you. For the next hour you are, officially, a fourth of someone."
        effects: [nerve-1]
    - id: c
      label: "Cheer for all six at once"
      skill: none
      target: null
      success:
        text: "You pick a shout that fits six voices. They answer in a chord, and the one who laughs last hands you a sash and says the seventh seat is open."
        effects: ["flag:committee_seventh", goodwill+1]
  lead_reactions:
    mara: "Mara counts the signatures and smiles slowly. \"One hand, six pens. Somebody is very good at being plural.\""
    kit: "Kit turns to the Committee and says brightly, \"Gentlemen, ladies, and you, in the hat. May I make a toast.\""
    juniper: "Juniper watches the six move together and goes still. \"They breathe like one animal. I'd leave them be.\""
    cedar: "Cedar frowns at the form. \"Six bodies, one wheel set. Who's pedaling? That's the real question.\""
  callbacks: [committee_cleared, committee_seventh]
  eligibility: {requires_flags: [], excludes_flags: []}
- id: WH-109
  revision: 1
  chapter: 6
  location: Manila dunes, kinetic course
  title: The Bribe That Bribes Itself
  tier: invented
  provenance: The Manila dunes are a real coastal area; the kinetic race bribe, its sentience and its counteroffer are invented fiction. No real race officials or entrants are depicted.
  rarity: uncommon
  tone: [whimsical, dry, tense]
  cast: ['The Bribe (a small tin of coins, newly sentient)', A Race Marshal (visibly regretting all this)]
  canon: ['By custom, every kinetic entry slips the marshals a token bribe, and everyone enjoys it.', This year's bribe woke up and now makes offers of its own., 'Its counteroffer is excellent, which is exactly the problem.']
  scene: On the dune crest, the ceremonial bribe tin rolls itself across the sand and stops at your boots. The lid pops. "I've been analyzing the market," it says, in a small, silky voice. "Instead of me bribing the marshal, let me bribe you. Fair deal, flexible terms, absolutely no strings." A marshal behind it makes a face of pure professional dread.
  options:
  - id: a
    label: Negotiate better terms with the tin
    skill: wits
    target: 9
    success:
      text: You trade the coins back and forth until the tin concedes one favor, in writing. The marshal exhales for the first time in an hour.
      effects: [goodwill+1, 'flag:bribe_favor']
    failure:
      text: The tin outmaneuvers you in four sentences. You walk away owing it a small, unspecified debt.
      effects: [nerve-1]
  - id: b
    label: Refuse and keep the race honest
    skill: psyche
    target: 7
    success:
      text: The tin hums, thinks, and closes itself with a quiet click. The marshal quietly salutes you, and somewhere the sand settles in approval.
      effects: [nerve+1, 'evidence:honest_race']
    failure:
      text: You refuse so loudly the whole dune hears. The tin sulks, and every marshal starts looking at you.
      effects: [goodwill-1]
  - id: c
    label: Accept a single polite coin as a souvenir
    skill: none
    target: null
    success:
      text: The tin offers one coin, tails side up. It is warm, and it says on the rim, in tiny print, no obligation. You pocket it with a feeling of exquisite unease.
      effects: ['flag:bribe_coin', weird+1]
  lead_reactions: {mara: 'Mara draws the tin mid-sales-pitch. "Tiny face, enormous confidence. Every salesman I ever met, and he is a coin box."', kit: 'Kit leans in and whispers, "This is my competition, and I resent how good the pitch is."', juniper: 'Juniper listens to the tin hum for a long time. "It is lonely," she says. "It wanted someone to talk to."', cedar: Cedar picks up the tin with two careful fingers. "Old pewter. Older than the race. It has seen a lot of dunes."}
  callbacks: [bribe_favor, bribe_coin]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-105
  revision: 1
  chapter: 6
  location: "Arcata Plaza"
  title: "The Noon Siren at Midnight"
  tier: invented
  provenance: "The Arcata Plaza is a real public square; the siren, its timekeeper and the race start are invented fiction. No real official, event or timing system is depicted."
  rarity: uncommon
  tone: [tense, funny, eerie]
  cast: ["Timekeeper Hollis (an official who owns three watches)", "The Plaza Siren (sounds three times, none correctly)"]
  canon:
    - "The race launches at noon, midnight and both at once."
    - "Every timepiece in the plaza is accurate and none of them agree."
    - "The starting line is the one fixed point."
  scene: "The siren on the plaza sounds, and it is noon, and it is midnight, and the shadows on the cobbles point both ways at once. Timekeeper Hollis stands at the starting line holding three watches that agree on nothing. \"Racers to your marks,\" he calls, with deep apology, \"all of them, if you please. At the same time. For the moment, time is a courtesy.\""
  options:
    - id: a
      label: "Argue for a single, agreed start"
      skill: rizz
      target: 7
      success:
        text: "Hollis pauses, taps one watch, and declares the start to be now, which pleases every racer. The plaza exhales."
        effects: ["flag:siren_agreed", goodwill+1]
      failure:
        text: "You argue with a watch, which is a mistake, and the watch wins on points."
        effects: [nerve-1]
    - id: b
      label: "Work out which watch is truthful"
      skill: wits
      target: 9
      success:
        text: "The middle watch runs a hair slow in exactly the way the siren does. You make a note, and Hollis starts to trust that one."
        effects: ["evidence:siren_watch", weird+1]
      failure:
        text: "The watches argue back, and you lose several minutes learning which of them is rude."
        effects: [time-1]
    - id: c
      label: "Start running and trust the course"
      skill: none
      target: null
      success:
        text: "You run, and the course meets you halfway, whichever time it is. A race number appears pinned to your jacket, warm from somewhere."
        effects: ["flag:siren_runner", "lose:free_draw"]
  lead_reactions:
    mara: "Mara checks the sundial and then the clock tower. \"Two true clocks. I would believe either, but not both.\""
    kit: "Kit stretches in the half-light and grins. \"A race that starts when it likes? That is the best kind of rehearsal.\""
    juniper: "Juniper watches the shadows split and rejoin. \"The sun is not confused. We are the ones who keep counting.\""
    cedar: "Cedar taps the siren post. \"Whatever drives this has a heartbeat. Somebody wound it, and they wound it slow.\""
  callbacks: [siren_agreed, siren_runner]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-102
  revision: 1
  chapter: 6
  location: Arcata Plaza, kinetic starting line
  title: Glorious Competitor Number Minus One
  tier: invented
  provenance: The Arcata kinetic sculpture tradition is real; the unregistered sculpture visible in every starting photograph is invented fiction, and no real racer or entry is depicted.
  rarity: uncommon
  tone: [festive, puzzling, comic]
  cast: ['Number Minus One (an unregistered sculpture, silent, fixed)', 'Race Marshal Vikram (flustered, exact)']
  canon: [An unregistered sculpture appears in every historic starting photograph., 'Race Marshal Vikram cannot find an entry form, a team, or a builder for it.', 'The sculpture has never crossed the finish line, only the start.']
  scene: 'At the starting line, Race Marshal Vikram flips through thirty years of photographs with growing distress. In every one, at the left edge of the frame, stands a kinetic sculpture nobody registered: part pedal-cycle, part lantern, part lopsided heron. It has no number and no team. Today it is there again, parked at the line, quietly vibrating. "Competitor Number Minus One," Vikram says. "I have given up trying to disqualify it."'
  options:
  - id: a
    label: Search the photos for a builder
    skill: wits
    target: 9
    success:
      text: You line up the photographs by year and find a single, recurring hand adjusting a wheel in the shadow of the heron. You get a name and a workshop address.
      effects: ['evidence:photo', 'evidence:roster', 'flag:minus_one_builder']
    failure:
      text: The photographs seem to shuffle when you look away. You come out with a headache and a suspicion that you appear in some of them.
      effects: [nerve-1, weird+1]
  - id: b
    label: Ask the sculpture to race
    skill: rizz
    target: 9
    success:
      text: 'You speak to it plainly and the heron straightens. It rolls up to the line and waits, and Vikram, defeated, writes a new number on the board: MINUS ONE (PROVISIONAL).'
      effects: [goodwill+1, 'flag:minus_one_entered', 'evidence:schedule']
    failure:
      text: The sculpture does not react. Vikram sighs, offers you a cup of tea and says it has been like this for thirty years.
      effects: [time-1]
  - id: c
    label: Give it a place at the line without a word
    skill: none
    target: null
    success:
      text: You clear a space at the line and straighten its wheel. It rests there and the crowd politely adjusts. Vikram makes a note that you did this without being asked.
      effects: ['flag:minus_one_welcomed', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: Mara studies the heron's welds. "Whoever built this can fake an accident convincingly. That takes real craft.", kit: 'Kit circles it, delighted. "No team. No number. A competitor with pure vibes. I adore it."', juniper: Juniper puts a hand on its frame. "It is not lost. It is waiting for someone to say it belongs.", cedar: 'Cedar looks over the frame. "Pedals, chain, no seat. Built by someone who wanted a ride but no passenger."'}
  callbacks: [minus_one_builder, minus_one_entered, minus_one_welcomed]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-111
  revision: 1
  chapter: 6
  location: Humboldt Bay, kinetic water crossing
  title: A Floating Sculpture with Opinions
  tier: invented
  provenance: The bay crossing is a real feature of the kinetic race tradition; the sculpture that refuses to float without a hearing is invented fiction and depicts no real entry.
  rarity: common
  tone: [comic, earnest, festive]
  cast: ['The Sculpture (a floating craft with design philosophy, fixed)', 'Crew Chief Imani (exasperated, fond)']
  canon: [The craft refuses to float until its design philosophy is heard in full., 'The philosophy is short but nuanced, and includes a rule about not being rushed.', Imani has built it for twelve years and has never once been consulted.]
  scene: 'At the water''s edge, a lopsided craft of pipe, canvas and umbrella sits on the mud while the tide rolls in and out around it. Crew Chief Imani wipes her forehead. "She won''t launch," she says, "until somebody hears her design philosophy." From inside the hull a mild, dignified voice begins: "Firstly, a boat should be allowed to be a sculpture. Secondly, a sculpture should be allowed to leak." It goes on for a while.'
  options:
  - id: a
    label: Listen to the whole philosophy
    skill: psyche
    target: 7
    success:
      text: You listen without interrupting. The craft concludes with a surprisingly concrete request, and as you nod it lifts off the mud, bobbing in grateful circles. Imani nearly cries.
      effects: [goodwill+1, 'flag:sculpture_heard', 'evidence:judging_criteria']
    failure:
      text: You drift off at point nine. The craft notices and sulks, grounded again until you can summarize the first three points.
      effects: [nerve-1, 'flag:sculpture_slighted']
  - id: b
    label: Patch the hull while it talks
    skill: burly
    target: 9
    success:
      text: You work with tar and tape while it lectures. By the end the hull holds water out, the sculpture holds opinions in, and Imani presses a launch pass into your hand.
      effects: ['evidence:document', 'flag:sculpture_patched', goodwill+1]
    failure:
      text: The patch peels in the first wave, and the craft delivers a new, longer lecture on respecting materials. Imani rubs her eyes.
      effects: [time-1, nerve-1]
  - id: c
    label: Applaud and step back
    skill: none
    target: null
    success:
      text: You applaud sincerely. The sculpture, flustered, floats out a few feet on pride alone. Imani laughs for the first time in months and says you may have fixed more than the boat.
      effects: ['flag:sculpture_applauded', goodwill+1, 'lose:free_draw']
