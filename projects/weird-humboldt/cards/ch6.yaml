- id: WH-113
  revision: 1
  chapter: 6
  location: Humboldt Bay, kinetic water crossing
  title: The Cosmic Coast Guard
  tier: invented
  provenance: The Humboldt Bay coast guard presence is real; the cosmic rescue boat, its paperwork and its vanished galaxy are invented fiction, and no real agency or personnel are depicted.
  rarity: rare
  tone: [cosmic, bureaucratic, melancholy]
  cast: ['Captain Sef (a cosmic coast guard officer, fixed)', 'The Paperwork (valid in a galaxy that no longer exists, fixed)']
  canon: [A rescue boat arrives with paperwork from a galaxy that no longer exists., Captain Sef is not here to rescue the race but to close out an old file., The paperwork is binding in a way that only matters to those who answer it honestly.]
  scene: A white rescue boat noses into the bay with a lamp of no known color. Captain Sef steps aboard your craft with a clipboard and a regulation expression. "Cosmic Coast Guard," she says. "I'm here to close a rescue file opened four billion years ago." She hands you a form. It is dated from a galaxy that is, as far as she knows, gone. "Technically, you are the surviving party. Please sign where the stars used to be."
  options:
  - id: a
    label: Read the form closely before signing
    skill: wits
    target: 9
    success:
      text: The form is a rescue request signed by a ship that may be the race's oldest ancestor. Among the clauses is a coordinate that sits just off the finish line.
      effects: ['evidence:document', 'evidence:geography', 'flag:coastguard_read']
    failure:
      text: The form rewrites itself as you read and by the end you aren't certain whether you've signed. Captain Sef stamps it either way, apologetically.
      effects: [nerve-1, weird+1]
  - id: b
    label: Offer Captain Sef a cup of tea and a moment
    skill: rizz
    target: 7
    success:
      text: She takes the cup. For a while she is no longer an officer but a person far from home. She tells you what the file was really about and slides you a pass to the finish.
      effects: [goodwill+1, 'flag:coastguard_tea', 'evidence:history']
    failure:
      text: She refuses the tea out of regulation and the moment passes. The file stays open and her expression doesn't change.
      effects: [time-1]
  - id: c
    label: Sign where the stars used to be
    skill: none
    target: null
    success:
      text: You sign, and the pen leaves a faint light on the page. Captain Sef closes the file with ceremony and the boat leaves with a long, low note. You feel responsible for something very old.
      effects: ['flag:coastguard_signed', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: Mara studies the form without touching it. "Paperwork for the dead. I know a few people who'd have a lot to say about that.", kit: 'Kit salutes Captain Sef, wide-eyed. "I always hoped someone was watching the coast. I did not expect them to file reports."', juniper: Juniper bows her head. "Some endings need a witness more than a rescue.", cedar: Cedar reads the form upside down. "Looks like a work order. Somebody's been waiting a long time for a crew to answer it."}
