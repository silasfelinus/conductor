  canon:
  - A judge from elsewhere gives perfect scores for violating Earth's physics.
  - The Judge is sincerely trying to be fair by the standards of somewhere else.
  - Contestants who explain their machine's failure get higher marks than those who explain its success.
  scene: At the starting line, a tall judge in a pressed gray coat inspects each craft with an expression of grave delight. She awards a perfect score to a bicycle that is clearly on fire. "Excellent defiance of conservation," she says in a pleasant, flat voice. "Ten." She turns to you, clipboard raised, and asks you to explain what you have built. You have, at best, a plan.
  options:
  - id: a
    label: Present your plan as a machine
    skill: rizz
    target: 9
    success:
      text: You describe your plan with such conviction that the Judge scores it a nine and offers a note. The note, once translated, contains a shortcut and an apology.
      effects:
      - goodwill+1
      - flag:judge_impressed
      - evidence:document
    failure:
      text: The Judge scores your plan a three for conventional adhesion to physics. Her pen taps the clipboard in something like sympathy.
      effects:
      - nerve-1
      - time-1
  - id: b
    label: Ask the Judge how she scores
    skill: wits
    target: 9
    success:
      text: She is delighted to be asked. She explains that on her world, rules are the thing you have not yet broken. You learn what she values and where the course is weakest.
      effects:
      - evidence:rumor
      - evidence:history
      - flag:judge_rubric
    failure:
      text: The explanation is lovely but incomprehensible, and you nod your way through it with a vague sense of having failed an exam you did not know you were taking.
      effects:
      - time-1
      - weird+1
  - id: c
    label: Let her inspect your craft in silence
    skill: none
    target: null
    success:
      text: The Judge circles your craft slowly, pen still, and then writes one word on the clipboard. She does not show you, but she smiles, and nods you toward the course.
      effects:
      - flag:judge_silent_nod
      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara watches the burning bicycle. "Ten out of ten. I hope someone's got an extinguisher at the finish."
    kit: Kit applauds the Judge. "An arbiter who rewards disaster. I could tour with her."
    juniper: Juniper steps back. "She isn't judging us. She's collecting how people try."
    cedar: Cedar nods at the bicycle. "Seen worse engineering in a county fair. She's right about the defiance."
