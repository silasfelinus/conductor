# Weird Humboldt v1 deck — chapter 5, Southern Humboldt and older roads.
- id: WH-090
  revision: 1
  chapter: 5
  location: "Eel River Valley"
  title: "The Eel River Forecast Desk"
  tier: invented
  provenance: "The Eel River valley is real; the weather station, its volunteer and the emotional forecasts are invented fiction. No real station or agency is depicted."
  rarity: common
  tone: [cozy, strange, sincere]
  cast: ["Volunteer Forecaster Wendell (fixed)", "Barometer (a very old dog)"]
  canon:
    - The forecast desk predicts emotional conditions alongside rainfall.
    - The predictions are right about eighty percent of the time.
    - Wendell knows the pattern follows the frequency and has told no one.
  scene: >-
    The volunteer weather station is a shed with a hand-lettered sign: TODAY, 40% CHANCE OF RAIN, 70% CHANCE OF NOSTALGIA. Wendell hands you a mug and a printed forecast for your own day. It says, in careful block letters, that you will be tempted to forgive someone before dusk. Barometer the dog thumps his tail twice, which Wendell translates as "yes."
  options:
    - id: a
      label: "Ask Wendell how the forecast works"
      skill: wits
      target: 9
      success:
        text: "Wendell shows you a hand-built receiver that picks up the county's mood, one pulse at a time. It matches the frequency down to the last tone."
        effects: ["evidence:frequency", "flag:forecast_explained"]
      failure:
        text: "Wendell explains for forty minutes. You leave with three new hobbies and no answer."
        effects: [time-1]
    - id: b
      label: "Take the forecast seriously and act on it"
      skill: rizz
      target: 7
      success:
        text: "You forgive someone, a little. The forecast clears and Wendell prints a new one that says only: good."
        effects: [goodwill+1, "flag:forecast_followed"]
      failure:
        text: "You try to forgive and fumble it. The forecast adds a 90% chance of awkwardness."
        effects: [nerve-1]
    - id: c
      label: "Pet Barometer and sit a while"
      skill: none
      target: null
      success:
        text: "The dog leans against your leg. A quiet minute passes. Clarity returns by a small, honest notch."
        effects: ["flag:valley_rest", "clarity+1"]
  lead_reactions:
    mara: "Mara reads the forecast aloud and says, \"That's the most honest weather report I've ever heard.\""
    kit: "Kit performs the forecast as a three-line pantomime for Wendell, who weeps happily."
    juniper: "Juniper tells Wendell the river is delighted to be listened to."
    cedar: "Cedar eyes the receiver. \"That's built from a pickup coil and a coffee can. I love this man.\""
  callbacks: [forecast_explained, forecast_followed, valley_rest]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-091
  revision: 1
  chapter: 5
  location: "Avenue of the Giants"
  title: "The Tree with a Reception Desk"
  tier: invented
  provenance: "The Avenue of the Giants is a real scenic route; the receptionist, the hollow redwood and the impossible visitors are invented fiction. No real tree or business is depicted."
  rarity: rare
  tone: [serene, bureaucratic, mythic]
  cast: ["Receptionist Alder (fixed)", "The Visitor in the Waiting Room (identity withheld)"]
  canon:
    - A hollow redwood hosts a receptionist for the forest's impossible visitors.
    - The waiting room contains one visitor who will not say who they are.
    - Alder keeps a ledger of every anomaly that has come through, and it includes the player.
  scene: >-
    A hollow redwood stands on the side of the road with a brass bell and a hand-lettered sign: PLEASE RING FOR SERVICE. Inside, under a cathedral of bark, a receptionist named Alder looks up from a ledger. "Name?" she asks. "I have you down for a quarter past." You have never been here. The waiting room has one chair, and the person in it has been waiting a very long time.
  options:
    - id: a
      label: "Ask to see the ledger"
      skill: wits
      target: 9
      success:
        text: "The ledger lists every impossible visitor in order. Your name appears twice, once in the past tense. A margin note says, in the same hand, \"Ask about the frequency.\""
        effects: ["evidence:document", weird+1, "flag:ledger_seen"]
      failure:
        text: "Alder closes the ledger with the gentlest of smiles. \"That requires an appointment.\""
        effects: [time-1]
    - id: b
      label: "Speak to the visitor in the waiting room"
      skill: rizz
      target: 7
      success:
        text: "The visitor shifts a little and talks. They have been here since before the highway. They ask only that someone remember them."
        effects: [goodwill+1, "flag:visitor_remembered"]
      failure:
        text: "The visitor looks at you with great patience and does not answer."
        effects: [nerve-1]
    - id: c
      label: "Take a number and sit quietly"
      skill: none
      target: null
      success:
        text: "Alder hands you number thirteen. Time passes in a way that doesn't hurt. When your number is called, the lobby is empty and a door has appeared."
        effects: ["flag:reception_door", "clarity+1"]
  lead_reactions:
    mara: "Mara bows to Alder as to an elder. \"Thank you for keeping the record.\""
    kit: "Kit mimes ringing the bell and the bell rings back."
    juniper: "Juniper is quiet for a long time, then says, \"This is a house. A very old house. We're guests.\""
    cedar: "Cedar checks the ledger's binding. \"This paper is older than the highway. And it's still dry.\""
  callbacks: [ledger_seen, visitor_remembered, reception_door]
  eligibility: {requires_flags: [], excludes_flags: []}
  by_state:
    sober:
      narration: "Sober, you notice that the clock above the desk runs at exactly the speed of your pulse, and so does the ledger's pen."
      check_mods: {}
    tipsy:
      narration: "Warm and sociable, you want to introduce yourself to everyone, including the person who would rather not."
      check_mods: {b: 1, a: -1}
    stoned:
      narration: "The room hums with the redwood's slow pulse, and the ledger's handwriting seems to rearrange as you look."
      check_mods: {a: 1}
    tripping_balls:
      narration: "The hollow is a cathedral of lungs; the receptionist is a bell, and the visitor is the sound it's trying to make."
      check_mods: {b: -1, a: 1}
      extra_option:
        id: d
        label: "Ask the bell what it remembers"
        skill: psyche
        target: 9
        success:
          text: "The bell remembers the visitor's name. You are sure it's right, and you will verify it, and it checks out."
          effects: ["evidence:memory", "flag:visitor_remembered"]
        failure:
          text: "The bell remembers only its own ringing. It rings once, in apology."
          effects: [nerve-1]

- id: WH-099
  revision: 1
  chapter: 5
  location: "Eel River Valley"
  title: "The River Stone Adoption Agency"
  tier: invented
  provenance: "The valley is real; the family, the pet rock and the ranch dispute are invented fiction. No real family or property is depicted."
  rarity: common
  tone: [domestic, absurd, legalistic]
  cast: ["Grandma Josephine Pruitt (fixed)", "Pebble (a pet rock, claimed heir)"]
  canon:
    - The Pruitts insist their pet rock is the rightful heir to their ranch.
    - Pebble has, in some sense, been speaking for years.
    - The rival heir is a cousin who has never visited.
  scene: >-
    Grandma Pruitt greets you at the gate with a legal pad and a deed. "My grandson is out of the picture and my cousin is a vulture," she says. "The ranch goes to Pebble." On the porch rail sits a grey river stone about the size of a loaf of bread. It does not move. Everyone present is certain it has a position on the matter.
  options:
    - id: a
      label: "Draft a trust naming Pebble as beneficiary"
      skill: wits
      target: 9
      success:
        text: "You draft the trust and name the ranch a conservation easement in Pebble's honor. Grandma Pruitt signs, the cousin loses interest, and Pebble sits in a patch of sun."
        effects: [goodwill+1, "flag:pebble_trust"]
      failure:
        text: "The draft names Pebble twice and Grandma Pruitt once. A notary shakes her head."
        effects: [time-1, nerve-1]
    - id: b
      label: "Interview Pebble formally"
      skill: psyche
      target: 7
      success:
        text: "You sit with the stone. After a long minute you are quite sure it wants the ranch left alone. Your certainty is odd and total."
        effects: ["evidence:memory", "flag:pebble_interviewed"]
      failure:
        text: "Pebble is silent. The silence is so complete it takes on opinions."
        effects: [nerve-1]
    - id: c
      label: "Accept a jar of Grandma's pickles and move on"
      skill: none
      target: null
      success:
        text: "The pickles are sharp and wonderful. Grandma Pruitt gives you a recipe and a promise: if you ever need a place to stay, the porch is yours."
        effects: ["flag:pruitt_porch", goodwill+1]
  lead_reactions:
    mara: "Mara reads the deed and says quietly, \"A signature is a kind of tattoo. Make sure you mean it.\""
    kit: "Kit sets Pebble on a pedestal and bows. Pebble remains unimpressed, which is correct."
    juniper: "Juniper sits beside the stone and says nothing. After a while the stone seems less alone."
    cedar: "Cedar taps the deed. \"Heir to a ranch. This is going to cost a lot of lawyers.\""
  callbacks: [pebble_trust, pebble_interviewed, pruitt_porch]
  eligibility: {requires_flags: [], excludes_flags: []}
- id: WH-094
  revision: 1
  chapter: 5
  location: Avenue of the Giants
  title: The Redwood Rings of Tomorrow
  tier: reported
  provenance: The Avenue of the Giants and its fallen redwoods are real; the log's extra rings and what they record are invented fiction.
  rarity: rare
  tone:
  - hushed
  - uncanny
  - reverent
  cast:
  - The Fallen Giant (slow, patient, a record-keeper)
  - A Ranger Who Is Late for Something
  canon:
  - A fallen log by the Avenue of the Giants holds two more summers of rings than have yet occurred.
  - The extra rings are thin and pale and appear to record weather nobody has seen.
  - The log is not a prophecy, only a ledger that is slightly ahead of schedule.
  scene: 'A fallen giant lies across the forest floor off the Avenue, its cross-section cut years ago and polished by rain. You count the rings the way you were taught, and the count is wrong. Two outer rings are pale, thin, and clearly new, but the tree has been dead longer than that. One records a wet spring. The other records something you cannot read: a summer with a name you do not know.'
  options:
  - id: a
    label: Read the pale rings aloud
    skill: local_lore
    target: 9
    success:
      text: The wet spring is next March. The nameless summer is not a warning, only a long, gentle one. You say so, and the log settles into the moss.
      effects:
      - evidence:future_rings
      - weird+1
    failure:
      text: The rings blur as you read, and a few words come out in the wrong language. The log goes quiet, politely.
      effects:
      - nerve-1
  - id: b
    label: Press your palm to the newest ring
    skill: psyche
    target: 9
    success:
      text: It is warm. For a moment you feel a long summer coming that will be easy on the forest. You walk out lighter and a little less afraid.
      effects:
      - goodwill+1
      - flag:redwood_ring_felt
    failure:
      text: The ring is cold, and a dread you can't name follows you for a mile. It fades, but you remember it.
      effects:
      - nerve-1
      - time-1
  - id: c
    label: Sit with the log until the light changes
    skill: none
    target: null
    success:
      text: You wait through an afternoon of green light. When you rise the moss has grown over your footprints, and the log feels like it has been listened to.
      effects:
      - flag:redwood_sat_with
      - lose:free_draw
  lead_reactions:
    mara: Mara traces the pale ring with a fingertip. "I would tattoo that line if it let me. It's too honest."
    kit: Kit hums low to the grain. "It's keeping a beat from next year. I could dance to that, almost."
    juniper: Juniper lies down beside the bark and sighs. "It's not scary. It just remembers forward, that's all."
    cedar: Cedar counts the rings twice and frowns. "Dendrology says no. The log disagrees, and I respect the log."
  callbacks:
  - redwood_ring_felt
  - redwood_sat_with
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-096
  revision: 1
  chapter: 5
  location: Southern Humboldt backroads
  title: The Backwoods Crop that Talks Back
  tier: invented
  provenance: Southern Humboldt farms and backroads are real; the scarecrow, its employment demands and the garden are invented fiction. No real farm, grower or crop is depicted.
  rarity: uncommon
  tone: [absurd, earnest, legalistic]
  cast: ["Mr. Hayes (a scarecrow with a clipboard)", "The Gardener (asleep, possibly on purpose)"]
  canon:
    - A remote garden's scarecrow demands employment protections and a written job description.
    - Mr. Hayes has scared nothing in six years and considers this a performance review in his favor.
    - The gardener has never once been seen awake in his presence.
  scene: >-
    You follow a gravel track to a hillside garden fenced with chicken wire and pallet slats. A scarecrow stands at the center in a plaid shirt, one cardboard hand holding a clipboard. "Before you say anything," he says, "I want it on the record that I work nights, I work weekends and I have never been given a break." Crows sit on every fence post. None of them are scared, but all of them are listening.
  options:
    - id: a
      label: "Negotiate a job description"
      skill: rizz
      target: 9
      success:
        text: "You draft terms: dusk to dawn, one break at noon, no crows named in the contract. Mr. Hayes signs with a splinter and stands a little straighter."
        effects: [goodwill+1, "flag:hayes_contract"]
      failure:
        text: "The word 'scarecrow' appears in the first clause and Mr. Hayes tears the page with great dignity."
        effects: [nerve-1]
    - id: b
      label: "Ask why the crows have not left"
      skill: wits
      target: 7
      success:
        text: "The crows are not afraid; they are staff. The scarecrow holds the roster, and every post on the fence is a shift. You copy the schedule."
        effects: ["evidence:roster", weird+1]
      failure:
        text: "A crow lands on your head. The other crows seem to take this as a verdict."
        effects: [time-1]
    - id: c
      label: "Take over the night shift for an hour"
      skill: none
      target: null
      success:
        text: "You stand in the plaid shirt and nothing at all happens, which is exactly the job. At the end of the hour Mr. Hayes leaves a stitched patch on your sleeve that reads: relief."
        effects: ["flag:hayes_relief", "lose:free_draw"]
  lead_reactions:
    mara: "Mara studies the clipboard and nods. \"Nobody ever gave him a title. That's most of the problem.\""
    kit: "Kit salutes the scarecrow and says, in a low voice, \"Colleague. Respect. I once held a post like yours.\""
    juniper: "Juniper smooths a loose thread on the scarecrow's sleeve. \"He just wants to be asked how his day went.\""
    cedar: "Cedar checks the fence line and hums. \"Crows on the posts. He's got a better crew than most people.\""
  callbacks: [hayes_contract, hayes_relief]
  eligibility: {requires_flags: [], excludes_flags: []}
- id: WH-082
