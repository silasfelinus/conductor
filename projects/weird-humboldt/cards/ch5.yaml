    - "Every room is real and every card is true."
    - "The house has never lost anyone, only misfiled them."
  scene: "A small Victorian house on Main Street offers tours by appointment, and its parlor holds a long table with a single deck of cards on it. Docent Edmund bows. \"Each visitor draws one card,\" he says. \"The house then arranges itself accordingly. Last week a gentleman drew the Seven of Hearts and found himself in the pantry. He has been quite content.\""
  options:
    - id: a
      label: "Draw a card and trust the house"
      skill: rizz
      target: 7
      success:
        text: "The Queen of Spades, and the stair rearranges to an unlooked-for room full of afternoon light. Edmund nods with approval."
        effects: ["flag:house_chosen", goodwill+1]
      failure:
        text: "You draw the Two of Clubs, and the house sends you through a very long hall to the front door."
        effects: [time-1]
    - id: b
      label: "Study the deck for a pattern"
      skill: wits
      target: 9
      success:
        text: "Every card is marked with a tiny door number, and the numbers loop. You work out which card will lead to the attic."
        effects: ["evidence:house_deck_pattern", weird+1]
      failure:
        text: "The deck is marked with something you cannot place, and Edmund coughs politely when you hold it up to the light."
        effects: [nerve-1]
    - id: c
      label: "Ask Edmund to draw for you"
      skill: none
      target: null
      success:
        text: "Edmund draws with theatrical care. The house arranges a small and private room, and you are served tea on a tray that was not there a moment ago."
        effects: ["flag:house_tea", "lose:free_draw"]
  lead_reactions:
    mara: "Mara traces a cornice and then the deck. \"Same hand drew the plasterwork and the cards. That is one very patient person.\""
    kit: "Kit shuffles with a flourish and nearly lands the ace of spades in Edmund's pocket. \"I will return it. I always return it.\""
    juniper: "Juniper stands very still in the hall. \"The house breathes in the evenings. It is not a haunt, only a good listener.\""
    cedar: "Cedar runs a thumb along the doorframe. \"These joints have been moved. Many times. And the wall never complained.\""
  callbacks: [house_chosen, house_tea]
  eligibility: {requires_flags: [], excludes_flags: []}

- id: WH-084
  revision: 1
  chapter: 5
  location: Ferndale Main Street
  title: The Pie Contest with a Second Jury
  tier: invented
  provenance: Ferndale is a real Victorian village with a real tradition of community events; the second jury, its regret-based scoring and the pies are invented fiction and depict no actual contest.
  rarity: uncommon
  tone: [cozy, absurd, tart]
  cast: ['Judge Marigold (the visible jury, fixed)', 'The Second Jury (unseen, awards by regret, fixed)']
  canon: ['A second, invisible jury awards the pie prizes based on regret rather than flavor.', The visible jury is aware of the second jury and tries to keep it out of the paperwork., 'The most regretted pie wins, and last year''s winner is still missing a recipe.']
  scene: 'On a long folding table on Main Street, eleven pies sit under paper doilies. Judge Marigold sips water and says, "The scores come in from two juries. One of them is me." A second set of scorecards flutters onto the table from nowhere, each with a pie''s name and a number that is not about taste. The unseen jury''s marks are written in the margins: TOO LATE TO APOLOGIZE. NEVER CALLED BACK. ALMOST SAID IT.'
  options:
  - id: a
    label: Bake an honest pie entry on the spot
    skill: rizz
    target: 9
    success:
      text: You hand-make an apology pie using the same recipe as your last regret. The second jury marks it perfect, and Marigold quietly tells you the pie recipe that unlocks last year's winner.
      effects: ['evidence:pie_recipe', 'flag:pie_apology_won', goodwill+1]
    failure:
      text: Your pie is delicious and has no regret in it at all. The second jury gives it a polite zero and Marigold apologizes for the system.
      effects: [nerve-1, 'flag:pie_zero']
  - id: b
    label: Read the unseen scorecards
    skill: wits
    target: 7
    success:
      text: The scorecards share handwriting with a ledger you've seen elsewhere. You get the full list of regrets the jury is scoring, and a pattern in how they're collected.
      effects: ['evidence:ledger', 'evidence:document', 'flag:pie_jury_read']
    failure:
      text: The scorecards flutter away before you finish, but not before one lands on your shoe and names a regret of yours.
      effects: [nerve-1, weird+1]
  - id: c
    label: Ask Marigold what she would pick
    skill: none
    target: null
    success:
      text: 'Marigold is honest: she''d pick the plain apple pie. She hands you a slice wrapped in a napkin, and it tastes like a kindness and a deadline. You stay and watch the scoring.'
      effects: ['flag:pie_marigold_friend', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: 'Mara sniffs a crust. "Butter, no shortcuts. Whoever made this one meant every layer."', kit: Kit holds a doily up like a flag. "The second jury has a better critic's vocabulary than any food writer I know.", juniper: 'Juniper looks at the table gravely. "Regret is a fine spice, but it does not rise."', cedar: 'Cedar eyes the pies. "Home bakers, every one. Nobody here is trying to win, just to be seen."'}
  callbacks: [pie_apology_won, pie_zero, pie_jury_read, pie_marigold_friend]
  eligibility:
    requires_flags: []
    excludes_flags: []
- id: WH-087
  revision: 1
  chapter: 5
  location: Fortuna
  title: An Extremely Civilized Were-Bear
  tier: invented
  provenance: Fortuna is a real city; the were-bear, his noise complaints and his manners are invented fiction, and no real resident or neighbor dispute is depicted.
  rarity: common
  tone: [gentle, comic, civic]
  cast: ['Mr. Ruiz-Abernathy (a were-bear, cheerful, fixed)', 'Neighbor Pat (a human, patient, overwhelmed)']
  canon: [Mr. Ruiz-Abernathy is a genial local who turns into a bear on full moons and files polite noise complaints about himself., The neighbors do not mind the bear; they mind the paperwork., 'He wants a quiet solution that harms no one, including himself.']
  scene: A genial man in a cardigan knocks on your door with a stack of paperwork. "Forgive the intrusion," says Mr. Ruiz-Abernathy. "I am a were-bear. It is a quiet condition, mostly. I'd like help with the noise complaints during full moons. They are all about me, and I agree with them." Neighbor Pat waves from across the lawn, holding a thermos. "We love him. We just want one night of sleep."
  options:
  - id: a
    label: Mediate a schedule with the neighbors
    skill: rizz
    target: 7
    success:
      text: You draw up a full-moon schedule with quiet hours, a snack plan and a guest bedroom for Pat's insomnia. Everyone signs, including a paw print in the margin.
      effects: [goodwill+1, 'flag:werebear_schedule', 'evidence:schedule']
    failure:
      text: The meeting dissolves into an argument about parking. Mr. Ruiz-Abernathy apologizes for everyone and the paperwork gets worse.
      effects: [nerve-1, 'flag:werebear_mediation_failed']
  - id: b
    label: Soundproof the cellar for him
    skill: burly
    target: 9
    success:
      text: You haul insulation, fix the door and reinforce the latch. The cellar is quiet by moonrise, and Mr. Ruiz-Abernathy gives you a jar of honey and a trail map.
      effects: ['evidence:geography', 'flag:werebear_cellar', goodwill+1]
    failure:
      text: The insulation falls on you and the latch sticks. The cellar is nearly quiet and mostly dusty, and the bear is polite about it.
      effects: [time-1, nerve-1]
  - id: c
    label: Keep him company on the next full moon
    skill: none
    target: null
    success:
