  - Accepting her payment does not create a debt, only a date.
  scene: On the shoulder of the highway stands a woman with a small canvas pack and a hand held up in a neat, apologetic wave. "I can pay," Ines says, and offers a folded gas receipt. You read the date and it is ten years from now. The station is one you know, in a town that is not yet famous. "I'm told they take these," she adds. "Eventually."
  options:
