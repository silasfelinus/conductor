  - The remembered bridge connects to a place that is not on this side of the river.
  - Wendell's memory is accurate in every detail except its date.
  scene: A man sits on the riverbank with his shoes off, looking at an empty span of air. "I crossed here last Thursday," Wendell says, mildly. "It was a good bridge. Green. It hummed when you walked on it." There is no bridge. There are only two concrete stubs on either bank. "I would like to know who is keeping it," he adds. "I would like to go back and thank them."
  options:
  - id: a
    label: Walk the line where the bridge should be
    skill: psyche
    target: 9
    success:
      text: You step onto the air and feel a green, humming floor. Three paces over, you find a handrail with initials carved into it and a faded stamp.
      effects:
      - evidence:history
      - evidence:document
      - flag:bridge_walked
      - weird+1
    failure:
      text: You step out and your foot finds river. You climb out shivering, and Wendell wraps you in his coat without comment.
      effects:
      - nerve-1
      - flag:bridge_wet
  - id: b
    label: Ask Wendell to describe the crossing in detail
    skill: rizz
    target: 7
    success:
      text: Wendell remembers the hum, the paint, the toll, the dog at the far end. He has more detail than any record, and you write it down for him, which he finds deeply moving.
      effects:
      - goodwill+1
      - flag:bridge_described
      - evidence:memory
    failure:
      text: Wendell frets and loses the thread. His memory slides into some other bridge, another year, and he does not recover for a while.
      effects:
      - time-1
      - evidence:rumor
  - id: c
    label: Sit with him and wait for the bridge
    skill: none
    target: null
    success:
      text: You sit until the light changes. Nothing appears, but Wendell is quiet and unburdened, and he leaves you with a carved token the shape of a handrail.
      effects:
      - flag:bridge_vigil
      - goodwill+1
      - lose:free_draw
  lead_reactions:
    mara: Mara studies the stubs. "Concrete's old. Rebar's older. Someone did a very thorough job removing a thing that people still remember."
    kit: Kit tips an imaginary hat. "A bridge so good it outlived its own demolition. I want its agent."
    juniper: Juniper closes her eyes. "The span is still there. It just crossed over to the other side."
    cedar: Cedar checks the bank. "Sure there was a crossing here once. My granddad mentioned it and then wouldn't say any more."
