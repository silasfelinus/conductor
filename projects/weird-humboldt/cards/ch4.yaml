- id: WH-076
  revision: 1
  chapter: 4
  location: Highway 299 roadside
  title: Mile Marker Zero and a Half
  tier: invented
  provenance: Highway 299 is a real route; the lying mile marker and its distance rule are invented fiction, and no real signage or Caltrans property is claimed to behave this way.
  rarity: uncommon
  tone: [roadside, dry, uncanny]
  cast: ['Mile Marker 0.5 (a roadside sign that changes distance when someone lies, fixed)', 'A trucker named Orla (unimpressed, honest)']
  canon: [The mile marker changes its distance whenever someone nearby lies., 'The sign has never been wrong about a lie, only about the size of it.', Orla has lied to it three times and regrets all of them.]
  scene: 'A reflective green sign by the shoulder reads MILE 0.5. Orla leans on her truck''s fender beside it. "Watch," she says, then tells the sign she has never taken a shortcut. The sign flickers: MILE 0.7. "Little one," she says, satisfied. She tells it she''s never speeded and it ticks to MILE 3.2. "There," says Orla. "Eight hundred miles of road and the only honest thing on it is a sign."'
  options:
  - id: a
    label: Ask the sign a true question
    skill: local_lore
    target: 7
    success:
      text: You ask where the road actually goes and the sign turns to MILE 0.0 and holds it. The answer is a turnoff you didn't know about, wide enough for one truck.
      effects: ['evidence:geography', 'flag:marker_truthful']
    failure:
      text: You ask a question with a hidden premise and the sign jumps to MILE 11.0. Orla lifts an eyebrow at your honesty problem.
      effects: [nerve-1, weird+1]
  - id: b
    label: Lie small on purpose to calibrate it
    skill: wits
    target: 9
    success:
      text: You tell a calibrated, tiny lie. The sign moves just a tenth of a mile. You now know its scale and can measure anyone's fibs nearby.
      effects: ['evidence:rumor', 'flag:marker_calibrated', weird+1]
    failure:
      text: 'You lie too well and the sign goes dark in a huff. Orla taps it: "You broke it for the day. Good job, genius."'
      effects: [time-1, 'flag:marker_offended']
  - id: c
    label: Tell the sign the plain truth about yourself
    skill: none
    target: null
    success:
      text: You tell the sign your actual worry, in plain words. It reads MILE 0.5 and stays that way, and Orla offers a ride as far as the next honest stretch.
      effects: ['flag:marker_confided', goodwill+1, 'lose:free_draw']
  lead_reactions: {mara: 'Mara crosses her arms at the sign. "If it can measure lies, it would have a field day in my industry."', kit: Kit tests it with a flagrant fib and delights in the response. "Mile eleven! I am a legend!", juniper: Juniper stands quietly beside it. "It's not punishing anyone. It's just refusing to pretend.", cedar: Cedar nods at Orla. "Truckers know what a road tells you and what it hides. This one's a straight talker."}
