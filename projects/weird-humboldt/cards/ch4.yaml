  scene: At a gravel turnout stands a single pay phone, its cord frayed, its receiver sweating. It rings, bright and insistent, though the booth has no lines running to it. A hand-lettered sign says OUT OF ORDER, NEVER REPAIRED. The phone rings again. A moth lands on the coin slot and appears to listen. It is the kind of ring that expects you to pick up.
