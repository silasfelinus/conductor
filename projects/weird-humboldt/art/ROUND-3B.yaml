  prompt_prose: At night in a lantern-lit redwood park clearing, a troupe of adult human physical-theatre performers
    puts on a tribute show for a small delighted audience sitting on blankets. Every performer wears only a small
    papier-mache half-mask over the brow and nose or has it pushed up on top of the head, so each full human face,
    eyes, cheeks and grin, is plainly visible. A grown man in a shaggy brown costume coat with a chimpanzee half-mask
    pushed up on his forehead blows a raspberry; a grown woman in a sleek painted otter-print bodysuit with an otter
    half-mask runs along a wooden fence beside a laughing child; three adult actors in knitted prairie-dog ear hoods
    with their faces showing pop up from behind hay bales. Theatrical, warm and bittersweet.
