  prompt_prose: A narrow trail runs straight into old-growth redwoods, marked with green ribbons tied at eye level.
    A fallen mossy log and a fern curled like a question mark sit beside the path. In the foreground, crossing a
    root, is a real bright-yellow banana slug, a soft legless glossy land slug with two long eye stalks, wearing
    a tiny toy racing helmet. Further down the trail the same mossy log, the same curled fern and the same ribbons
    appear again and again, repeating faintly into the mist, quietly uncanny.
