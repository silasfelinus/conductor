  prompt_prose: The last night of a forest-edge festival. In the middle of a meadow a tall wicker sculpture woven
    from pale willow branches in the shape of a redwood tree is fully engulfed in roaring orange flames, the centre
    of a great bonfire. A crowd watches in silhouette. A giant moss-covered puppet bows beside the fire, two folding
    tables hold clipboards and lanterns, and the smoke rising high above the flames curls into the faint outline
