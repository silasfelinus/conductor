# Ecotone art standard (weird-humboldt t-042). Silas, 2026-10-20 PT: "Every choice card and consequence ending
# should have an art object." "We want to give images to all outcomes." After the checkpoint review: "we should use
# nova comix, krea2, arthemy, and z-image turbo should all have generation lanes". Then: "I authorize all unique art
# generations for quests and consequences. The more the user gets to participate in the story, the better."
# One subject per picture (every card, every choice outcome, every ending), each rendered once per lane; the lane
# key is the Ecotone art style id. Same seed across lanes so the styles compare like with like. Briefs follow the
# canon cast and content rules (PG-13, no paraphernalia, no readable text, the player never face-on, no anthro).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status); export finished
# renders with scripts/export_ecotone_art.py. Private. Hold a bad render back with withdrawn: {<lane>: reason}.
round: ecotone-art-standard
project_slug: weird-humboldt
designer: Ecotone
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: zimage
