# Ecotone Mysteries art, round 1 (weird-humboldt t-063). Silas, 2026-10-23 PT: "add the mystery scenes to the
# Playbook Manager, submit art requests". Silas, 2026-10-20 PT, standing: "I authorize all unique art generations for
# quests and consequences" and "We want to give images to all outcomes."
# One subject per picture: every mystery scene card (cards/my-NN-*), every gate outcome, success and failure
# (outcomes/my-NN-gN/<approach>-<result>), and every Real Ending (mysteries/<case>/<ending>). These are the asset
# keys the game already looks up (utils/ecotone/artSlots.ts, mysteries/index.ts mysteryEndingArtKey), so a
# finished render shows in play once scripts/export_ecotone_art.py writes it into kind_robots.
# Lane: Z-Image Turbo only, the default Ecotone style; every other style falls back to it until it renders its own.
# Briefs follow the Ecotone canon: PG-13, the player only ever seen from behind in a weathered rain jacket,
# companions left out (they vary by run), invented locals, real places as geography, no Native material,
# positive description only (every surface bare and unmarked).
# auto_submit: true -> scripts/sweep_art_ledgers.py submits and refreshes this ledger on every Auto Art Generate run.
# Queued is not rendered; rendered is not shipped. Private (is_public: false).
# t-064 (2026-10-24 PT, Silas: "vary the culprit genders across the twelve cases"): Case I's culprit is now Hollis
# Ostrander, Case IV's the widower Arne Sorensen, Case IX's Wren uses they/them. The 19 briefs that showed those culprits
# were rewritten with new seeds; their round-1 jobs moved to superseded_jobs, so the sweep submits the new prompts.
