# Ecotone checkpoint bake-off (weird-humboldt). Silas, 2026-10-19 PT, looking at the zoo-tribute card: "What's with
# the animal kids in the center. This isn't an anthro game. We might want a different checkpoint. How about we do some
# tests with different checkpoints. Our art queue is open. Focus on the four companions. Actually, do some settings
# around Humboldt's as well, let's see how the various checkpoints work with setting. We may want to use actual photos
# when there are settings taking place in real locations, but that's later. Still, seeing how they do sequoias and
# Bigfoot may be helpful."
# The house lane (Arthemy Western Art) leans anthro: it is the Zuzu checkpoint. This compares it with seven non-anthro
# candidates on the same eight subjects: Mara, Kit, Juniper and Cedar (current canon), and four Humboldt settings
# (a redwood grove in Sequoia Park, a Bigfoot family picnic at Moonstone Beach, Arcata Plaza at night, and the Old
# Town Eureka waterfront).
# Each subject has one seed shared across all lanes. Tag lanes share a prefix/suffix; prose lanes get the same scene
# as plain positive prose. The winner (or a split: one lane for people, one for places) becomes the Ecotone house
# lane. Nothing here is a final asset.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
