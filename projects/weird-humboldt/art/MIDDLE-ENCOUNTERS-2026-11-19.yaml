# Ecotone middle-encounter art (weird-humboldt t-027 build, t-077). Silas, 2026-11-19 PT, in session:
# "Go ahead and build the 8 candidate encounters." The art standard (t-042) gives every card and every choice
# outcome its own picture in each of the four style lanes. 8 cards + 40 outcomes = 48 subjects x 4 lanes.
# Card prompts are copied verbatim from kind_robots utils/ecotone/artPrompts.ts. Companions never appear in
# outcome art (it cannot know who you travel with); the player is the figure in the weathered rain jacket seen
# from behind; no readable text; animals stay real. Submit with scripts/enqueue_art_requests.py; export with
# scripts/export_ecotone_art.py. Private.
round: ecotone-middle-encounters-2026-11-19
project_slug: weird-humboldt
designer: Ecotone
is_public: false
is_mature: false
cast_loras: false
