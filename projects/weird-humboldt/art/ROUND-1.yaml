# Ecotone (weird-humboldt) art round 1, t-006. Silas, 2026-10-19 PT, in session: "help me get a front end,
# pointed to Play, and submit the art prompts". That request opens the art gate for these foundation images only:
# project icon/card/hero, the Play title art, the four companions (two seeds each), the six chapter regions,
# the festival prologue, the three sample encounters (WH-006, WH-021, WH-061) and a card back. The 56 ending
# signatures and their prompts still go through the Keep/Modify/Reject review in ECOTONE-ENDING-GRAMMAR.md.
# House lane (Arthemy Western Art v3.0), painted as a foggy North Coast comic: Twin Peaks / X-Files mood, warm
# and funny, never grim. Care rules from COMPANIONS-AND-PROLOGUE.md and FACT-CHECK.md: Mara wears modern studio
# clothes and her own flash designs (no regalia, feathers or sacred designs); Kit is a contemporary performer
# (no costume-shop "oriental" styling); Juniper is fully clothed and nonsexual; Cedar is a capable working
# local, not a joke. No real businesses' signage, no Houdini likeness, no readable text anywhere.
# Keepers export to kind_robots public/ecotone/<asset>.webp (the /play/ecotone board overlays them on its drawn
# scenes) and, for the three project subjects, to projects/images/weird-humboldt-{icon,card,hero}.webp.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
