# Ecotone choice-card OUTCOME art backlog (weird-humboldt t-042 art standard), drafted 2026-11-02 PT.
# Silas, 2026-11-02 PT, on the hand-of-cards change (kind_robots components/narrative/kr-choice-hand.vue: each
# choice card shows only its own outcome painting, else a drawn icon face): "Yes, commission." Silas, 2026-10-20 PT,
# standing: "We want to give images to all outcomes."
# One subject per choice card the board can deal: outcomeArtKey(card, choice, 'success')
# (utils/ecotone/artSlots.ts; components/ecotone-board.vue thumbFor), for every BEAT/ENCOUNTER choice in
# ecotoneArtSlots().outcomes whose default-style render is missing. 398 card slots; 70 already render in the default
# style; 2 (outcomes/kn-1/*) are review-held (reviewHold.ts) and already rendered in ART-STANDARD.yaml, so are left
# out; 326 here. Failure plates (182 missing) are not on the cards and are not in this round.
# Lane: Z-Image Turbo only, the default Ecotone style (lane key = style id), as MYSTERIES-ROUND-1.yaml: every other
# style falls back to it. Briefs follow the Ecotone canon: PG-13, the player only ever a figure in a weathered rain
# jacket seen from behind, companions in their canon descriptions, Mara kept out of frame (portrait under review),
# no substance use or paraphernalia shown, invented locals, positive description only (every surface bare).
# Delivery: a DONE render is not visible until scripts/export_ecotone_art.py <this ledger> --kind-robots ../kind_robots
# writes public/ecotone/styles/zimage/<asset>.webp and regenerates utils/ecotone/artManifest.ts (a kind_robots PR).
# priority: 1 (background: renders only when no game or interactive job waits). auto_submit: true. Private.
# Queued is not rendered; rendered is not shipped.
