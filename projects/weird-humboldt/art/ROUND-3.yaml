# Ecotone (weird-humboldt) art round 3, on the bake-off's provisional house lane (Z-Image Turbo; see
# CHECKPOINT-BAKEOFF.yaml review). Two jobs:
# 1. Re-render the zoo tribute (WH-124). Silas, 2026-10-19 PT, on the round-2 render: "What's with the animal kids in
#    the center. This isn't an anthro game." Past zoo animals appear only as performance or vision, so the prompt
#    asks for adult human performers whose faces show under handmade masks.
# 2. The seven new story beats from the event-opening rebuild (t-032, kind_robots#3872) that have no art: GR-2, GR-4,
#    GR-5, KN-2, KN-4, KN-5, KN-6. Care: no readable signage, no real race teams, and nobody shown using drugs.
# Keepers export to kind_robots public/ecotone/<asset>.webp. Submit/refresh with scripts/enqueue_art_requests.py
# (dry run by default; --live; --status). Private.
# Review 2026-11-02 PT: keep GR-2 and KN-2 (kind_robots#4634); the other six are redone in ROUND-3B.yaml.
round: ecotone-3
project_slug: weird-humboldt
designer: Ecotone
is_public: false
is_mature: false
cast_loras: false
lanes:
- key: zimage
  label: Z-Image Turbo (provisional house lane)
  engine: zimage
  prompt: prose
  suffix: painterly illustration, coastal fog, redwood greens, teal and amber light
subjects:
- key: eco3-friends
  asset: encounters/friends-who-arent-here
  title: The Friends Who Aren't Here, actors in a lantern-lit clearing
  size: 1344x768
  seed: 65101
  prompt_prose: At night in a lantern-lit redwood park clearing, a troupe of adult human physical-theatre performers
    puts on a tribute show for a small delighted audience sitting on blankets. One grown man wears a handmade papier-mache
    chimpanzee mask pushed up on his forehead and a shaggy costume coat, blowing a raspberry; a grown woman in a
    sleek painted otter costume runs along a wooden fence beside a laughing child; three adult actors in knitted
    prairie dog hoods pop up from behind hay bales. Their human faces show clearly, theatrical, warm and bittersweet.
  jobs:
    zimage: 40963
  art:
    zimage:
      status: DONE
      art_image_id: 248901
  verdict: 'redo in ROUND-3B: Fails the core fix. The chimp performer wears a full closed chimpanzee head (not pushed
    up, no human face) with hairy bare feet, so he reads as a real ape; the otter is a full-head costume walking
    upright and reads as an anthro otter; the prairie-dog hoods became plain knit beanies. Only the audience shows
    human faces. Redo with half-masks or masks pushed up, faces fully visible.'
- key: eco3-gr2
  asset: encounters/gr-2-something-to-share
  title: GR-2 Something to Share, the acrobats' blanket
  size: 1344x768
  seed: 65102
  prompt_prose: A sunny festival lawn at the edge of a redwood forest. A group of circus acrobats rests on a big
    patchwork blanket sharing water bottles, sandwiches and a basket of food; a huge bearded man with a gentle smile
    holds out a wax-paper parcel. In the background a woman in patched coveralls balances upside down on a partner's
    shoulders, and a giant moss-covered wooden puppet towers over the crowd.
  jobs:
    zimage: 40964
  art:
    zimage:
      status: DONE
      art_image_id: 248902
  verdict: 'keep: shipped in kind_robots#4634. Matches: acrobats resting on a patchwork blanket with water bottles,
    basket and food, a big gentle bearded man holding out a paper parcel, an upside-down acrobat behind, and a moss-topped
    wooden puppet over the crowd. Minor drift (the inverted acrobat isn''t clearly in coveralls on a partner''s
    shoulders). No readable signage, no drugs.'
- key: eco3-gr4
  asset: encounters/gr-4-path-behind-the-stage
  title: GR-4 The Path Behind the Stage, the looping trail
  size: 1344x768
  seed: 65103
  prompt_prose: A narrow trail runs straight into old-growth redwoods, marked with green ribbons tied at eye level.
    A fallen mossy log and a fern curled like a question mark sit beside the path, and in the foreground a bright
    yellow banana slug wearing a tiny racing helmet crosses a root. Soft mist, the same log and ribbons repeating
    faintly into the distance, quietly uncanny.
  jobs:
    zimage: 40965
  art:
    zimage:
      status: DONE
      art_image_id: 248903
  verdict: 'redo in ROUND-3B: Trail, eye-level green ribbons, mossy log and question-mark fiddleheads are right,
    but the "banana slug in a racing helmet" is a cartoon banana with eyes, and the repeating log/ribbons uncanny
    loop isn''t shown. Redo.'
- key: eco3-gr5
  asset: encounters/gr-5-closing-bonfire
  title: GR-5 The Closing Bonfire, the last night of the fair
  size: 1344x768
  seed: 65104
  prompt_prose: The last night of a forest-edge festival. A tall wicker sculpture of a redwood tree burns in a great
    bonfire in a meadow while a crowd watches, silhouetted. A giant moss-covered puppet bows beside the fire, two
    folding tables hold clipboards and lanterns, and the smoke rising over the flames forms the faint outline of
    a coastline.
  jobs:
    zimage: 40966
  art:
    zimage:
      status: DONE
      art_image_id: 248904
  verdict: 'redo in ROUND-3B: The central beat is missing: the "wicker redwood" is a living broadleaf tree that
    isn''t burning, and the fire is a small separate campfire, not a great bonfire. No coastline in the smoke. Crowd,
    puppet and lantern tables are fine. Redo.'
- key: eco3-kn2
  asset: encounters/kn-2-the-afterparty
  title: KN-2 The Afterparty, the waterfront warehouse
  size: 1344x768
  seed: 65105
  prompt_prose: An old timber warehouse on a foggy bay waterfront at night, turned into a party. A brass band plays
    under strings of bulbs while dancers in wild homemade race costumes whirl past a pedal-powered sculpture parked
    inside. Through the open doors a pickup truck waits with its tailgate down and a CB antenna tied with a green
    ribbon.
  jobs:
    zimage: 40967
  art:
    zimage:
      status: DONE
      art_image_id: 248905
  verdict: 'keep: shipped in kind_robots#4634. Matches: an old timber waterfront building in fog with a brass band
    under string lights, costumed dancers, and the pickup with a CB antenna tied with a green ribbon. Minor: the
    pedal sculpture isn''t visible inside and it reads dusk more than night. The small door sign is blank; no branding,
    no drugs.'
