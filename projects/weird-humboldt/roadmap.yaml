  fill in for a last minute racer injury, experience the race with the
  companion, and then go through a series of days adventures. This
  conflicts with our "weekend" plan, but these stories can be more
  expansive than a single long period, especially when sobriety and drug
  interactions have such a pronounced impact on the story and themes. The
  user that takes psychedelics at the festival is expected to have a
  psychedelic experience throughout the story. It's stronger if most of
  these are presented as the consequences of one string of adventures
  across one weekend or extended time, but all with a through line that
  connects to the user meeting a companion, explores the events together,
  has weird experiences, succeeds or fails on some skill checks, then the
  events, and their choice of companion and drug or sobriety, shows them
