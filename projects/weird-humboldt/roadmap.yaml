# Weird Humboldt / working title ECOTONE — regional future-shaping comedy-horror adventure (Silas, 2026-10-19 PT)
# New design-first project. No image generation or art queue creation until specifically requested.
# 2026-10-19 PT later: Silas requested it in session ("get a front end, pointed to Play, and submit the art
# prompts"): art round 1 (t-006) is queued and the Play front page is t-029.
project: weird-humboldt
kind: software
autonomous: true
goal: >-
  A replayable, illustrated, second-person, dark-comic Humboldt County card adventure
  built on the best deterministic authored-deck mechanics of Shifting Lands and
  Shifting Desks. At least 120 fully written encounter cards across six regional
  chapters with 2-4 meaningful choices, visible 2d6 skill checks, persistent
  consequences, distinct Humboldt archetypes, a seeded save/resume system,
  a county-wide fate-shaping story with optional hidden mystery, 56 collectible
  journey signatures (28 hopeful and 28 dark) assembled from curated core
  futures, opening/final companion text-art callbacks and earned choices,
  and a polished responsive
  one-screen Play experience. Final art direction and any public release remain
  subject to Silas's later explicit creative approval.
notes_from_silas: |
  2026-10-20 PT (late night), Silas, after asking how many art pieces one
  checkpoint style adds: "I call absolute suss on those numbers. Every choice
  card and consequence ending should have an art object." Recount: 25 story
  cards, 84 endings (6 lines x 7 lenses x 2 fates), the fixed set, and art for
  every outcome, about 240 pieces per style. Silas: "Ok, so 240 sounds about
  right. + new beat makes sense. We want to give images to all outcomes. So
  I can easily ask for 2-4 styles. Where can I see an output of the example
  generations? If there isn't one, I'll take a temporary route for a review
  page that shows me a comparison of all assets, along with generation
  times". (t-041, t-042, t-043)
  2026-10-20 PT (night), Silas, sending five mockups plus a Story Atlas
  gallery mockup (design/2026-10-20/): "here's our new mockups for playbook
  manager and an ecotone layout structure. Ecotone should definitely support
  multiple styles, same as we do with shifting desks. I'l have to review the
  checkpoints still to figure out the sweet spots". (t-038, t-039, t-040)
  2026-10-20 PT (evening), Silas, on making Playbook Manager edits work in
  every game: "What does this mean? Is it a fundamental gap in
  implementation. Can it be worked with, or have all systems use the
  optimal system? We can redesign everything to use the same upgraded
  engine. Which includes rewriting for said engine. We want to be optimal,
  as long as we keep the integrity of each system". Plan agreed in
  session: (1) one content layer, every game reads its text through an
  overlay-aware lookup so live edits work everywhere; (2) a shared story
  kernel (seeded RNG, 2d6 checks, choice/outcome/effects, flags, save
  versioning) under each game's own rules; (3) golden seeded-replay tests
  guard each game's integrity. No single rules engine for all games.
  Silas: "Yes, go forward with step 1." (t-037)
  2026-10-20 PT (later), Silas, verbatim: "We can have at least three
  choices at first, because both of those are very social, the user should
  have the option to simply engage in contemplative solo activities.
  Walking to the marsh or visiting the zoo could give an alternate  route
  to certain followers, but also allow the user to choose the solo path
  immediately, and allow us to highlight some of the other things bout
  Humboldt's right away" ... "Realizing there is a solo path inspired me to
  think about the ecoutopia path.it has a clear line, the user can have a
  series of adventures that are potentially all animal focused. If they
  follow those choices consistently, they can either be faced with the
  positive path, where their future is envisioned as a wonderful
  ecological paradise. And the fail ending has things never getting better
  because they never made a real choice. The user could retire as a
  hermit. Never interacting with many people. Failing should be
  interesting, but might as well hit "bittersweet'." (t-035)
  Same message, on the Playbook Manager: "The storybook manger should be
  backwards compatible with the previous shifting games. It may or may not
  make sense to be backward compatible with the gamebook series, it's got
  a different flow. If it can load, great, otherwise we'll have a special
  case for it" ... "Is is too much to ask that we can also use the manager
  to track emperor of dust? Follower and quest lines?" (t-036)
  2026-10-20 PT, Silas, verbatim on structure: "It should definitely be a
  fictitious festival. And yes on afterparty. And the experience should
  absolutely have a resolution where the protagonist is conscripted to
  fill in for a last minute racer injury, experience the race with the
  companion, and then go through a series of days adventures. This
  conflicts with our "weekend" plan, but these stories can be more
  expansive than a single long period, especially when sobriety and drug
  interactions have such a pronounced impact on the story and themes. The
  user that takes psychedelics at the festival is expected to have a
  psychedelic experience throughout the story. It's stronger if most of
  these are presented as the consequences of one string of adventures
  across one weekend or extended time, but all with a through line that
  connects to the user meeting a companion, explores the events together,
  has weird experiences, succeeds or fails on some skill checks, then the
  events, and their choice of companion and drug or sobriety, shows them
  the Humboldt of their future, which succeeds or fails based on their
  stats at the end of the journey." On companions: "They should choose
  the companion before having the experience of choosing the drug or
  not ... at the cannabis festival, the users first choice is whether to
  watch the circus performers doing partner acro on the lawn, or follow
  the sounds of a drum circle in the woods. Then maybe they are offered
  their drug choice by some encounter. Then they get the chance to
  interact, and choose or not, the appropriate companion ... it should be
  possible to be a loner and just experience things that way (an ending
  permutation I didn't even think of)." Earlier the same thread: every
  story draw is at least a binary "white rabbit" choice (an Alice riff
  with a Humboldt twist is welcome); the first choice is which event to
  attend; the cannabis festival leads to marijuana, psychedelics, Juniper
  and Kit; the Kinetic Sculpture Race leads to Cedar, alcohol, party drugs
  and Mara; companions can be re-met on later days in other capacities.
  This SUPERSEDES the "NEWEST 2026-10-19 PT STORY LOOP" below where it
  maps the opener lens directly to a first follower: the companion now
  comes from the area choice, the lens from the offer, and going alone is
  a real path with its own endings (t-032).
  2026-10-20 PT, Silas, verbatim: "I need an admin front end that lets me
  see these events as a chained set of choices, with a pleasing
  interface, the link should be on / Admin channel and should be a
  "Playbook Manager". Obvious things like being able to edit, comment,
  add extra choices, submit or flag images, request images for
  unfulfilled choices. Needs to recognize sub choices within an art
  event, and should have sorting of both (what levels this occurs in,
  which companion it's written for, but also that the same event can
  have different variations for factors like sobriety. It should also
  highlight things like the ending storylines versus random encounters."
  (t-033)
