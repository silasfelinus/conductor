  Hmong community". Canon: Kit is Hmong American, US-born and second
  generation. Her grandparents came as refugees from Laos after the war
  (Hmong families who fought in the US-backed war in Laos). She was born
  in Minnesota, still remembers it, and her parents moved the family to
