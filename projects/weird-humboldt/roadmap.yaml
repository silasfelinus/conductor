  2026-10-19 PT (evening), Silas, verbatim: "Kit is second generation
  American born. Her grandparents emigrated from Laos after the vietnam
  war, settling in Minnesota (a common story for Hmong immigrants who
  assisted in Vietnam). Then her parents moved them to California when
  she was young. She has memories of Minnesota, but she grew up in arcata
