  stats at the end of the journey." On companions: "They should choose
  the companion before having the experience of choosing the drug or
  not ... at the cannabis festival, the users first choice is whether to
  watch the circus performers doing partner acro on the lawn, or follow
  the sounds of a drum circle in the woods. Then maybe they are offered
  their drug choice by some encounter. Then they get the chance to
  interact, and choose or not, the appropriate companion ... it should be
  possible to be a loner and just experience things that way (an ending
  permutation I didn't even think of)." Earlier the same thread: every
  story draw is at least a binary "white rabbit" choice (an Alice riff
  with a Humboldt twist is welcome); the first choice is which event to
  attend; the cannabis festival leads to marijuana, psychedelics, Juniper
