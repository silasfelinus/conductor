# Weird Humboldt / working title ECOTONE — regional future-shaping comedy-horror adventure (Silas, 2026-10-19 PT)
# New design-first project. No image generation or art queue creation until specifically requested.
# 2026-10-19 PT later: Silas requested it in session ("get a front end, pointed to Play, and submit the art
# prompts"): art round 1 (t-006) is queued and the Play front page is t-029.
project: weird-humboldt
kind: software
autonomous: true
goal: >-
  A replayable, illustrated, second-person, dark-comic Humboldt County card adventure
  built on the best deterministic authored-deck mechanics of Shifting Lands and
  Shifting Desks. At least 120 fully written encounter cards across six regional
  chapters with 2-4 meaningful choices, visible 2d6 skill checks, persistent
  consequences, distinct Humboldt archetypes, a seeded save/resume system,
  a county-wide fate-shaping story with optional hidden mystery, 56 collectible
  journey signatures (28 hopeful and 28 dark) assembled from curated core
  futures, opening/final companion text-art callbacks and earned choices,
  and a polished responsive
  one-screen Play experience. Final art direction and any public release remain
  subject to Silas's later explicit creative approval.
