# Weird Humboldt / working title ECOTONE — regional future-shaping comedy-horror adventure (Silas, 2026-10-19 PT)
# New design-first project. No image generation or art queue creation until specifically requested.
project: weird-humboldt
kind: software
autonomous: true
goal: >-
  A replayable, illustrated, second-person, dark-comic Humboldt County card adventure
  built on the best deterministic authored-deck mechanics of Shifting Lands and
  Shifting Desks. At least 120 fully written encounter cards across six regional
  chapters with 2-4 meaningful choices, visible 2d6 skill checks, persistent
  consequences, distinct Humboldt archetypes, a seeded save/resume system,
  a county-wide fate-shaping story with optional hidden mystery, multiple
  divergent futures and a polished responsive
  one-screen Play experience. Final art direction and any public release remain
  subject to Silas's later explicit creative approval.
notes_from_silas: |
  2026-10-19 PT: New project, Weird Humboldt. Shifting Sands/Lands and Shifting
  Desks-like experiential cards with skill checks; Humboldt County locations,
  events and locals. Play journalist, student, rower, lifelong local, Native
  character and other Humboldt archetypes. At least 120 randomized encounters
  over stages, wacky comedy horror (X-Files x Twin Peaks x Weekly World News x
  High Times), real Moonstone Beach, Arcata Plaza, Redwood Park, Minor Theatre,
  Perilous Plunge and Kinetic Sculpture Race. Stories: Bigfoot's family, alien
  abductions, fictional pagan rituals, weed patches, ghost of Harry Houdini;
  surreal unexpected turns. Decide whether an overarching goal is needed.
  Explicit instruction: explore the premise *before committing to art*.
  Research warning: Minor Theatre/Houdini trapdoor is owner testimony and
  disputed local lore, not verified historical fact; separate Perilous Plunge
  from the Kinetic Grand Championship. Modern Native characters deserve
  independent lives, not mystical stereotypes; no appropriation of rituals.
  DESIGN-BRIEF.md and PITCHES.md are recommendations, not accepted final canon.
  2026-10-19 PT LATER: Voluntary adult opening at an invented Humboldt festival:
  sober, tipsy, stoned or tripping-balls story lenses. Conditions alter how
  canonical events are experienced and which checks/choices are available;
  underlying supernatural facts and all core endings remain accessible sober.
  Suggested character skills now Rizz, Burly, Wits, Local Lore and Psyche;
  sobriety is a mutable current state/Clarity condition, not a fixed skill.
  A cannabis-smoking young woman may be a recurring nonsexual forest nymph
  guide in all branches. Events are experienced first, not named from the
  festival calendar; original references include Fear and Loathing, SubGenius,
  Illuminatus!, Burning Man, the juggling festival, Dell'Arte, and older
  Gravity Falls. PG-13 drug references, no covert dosing; NO ART YET.
  PRELUDE-STATE-CONTRACT.md is the authoring reference.
  2026-10-19 PT: Kit is Chinese American. Proposed family history: her distant
  ancestors were among Eureka residents expelled in 1885; Kit returned
  generations later to attend HSU and pursue Blue Lake physical theatre.
  The mid-1950s mark Chinese American return, not the original expulsion.
  Preserve factual history, local cultural specificity and Kit's agency.
  2026-10-19 PT, LATEST: Juniper and Kit confirmed as distinct companions.
  Replace sober dispatcher with Indigenous Humboldt tattoo artist raised on
  her reservation, whose studio began with a casino-revenue-funded tribal
  entrepreneurship grant; she avoids cannabis to protect precision of her
  work. Replace tripping radio sleuth with older male ex-grower, dispensary
  proprietor and licensed massage therapist, joking conspiratorial hippie
  with ties to backwoods growers. Working names Mara and Cedar. No tribe,
  grant program or casino named as a fact until grounded; identity carries
  no supernatural power or stat bonus. Four independent companions remain
  available in all runs. COMPANIONS-AND-PROLOGUE.md owns character details.
  NO ART or public release authorized.
  2026-10-19 PT NEW UI AND PROGRESSION RULE: Every phone/tablet/desktop
  gameplay view is a single non-page-scroll visual surface, as in Shifting
  Lands' journey board and Shifting Desks' desk. Use compact tabs and bounded
  inner scroll only for long journals/endings, never document scrolling.
  Show an always-reachable Endings X/10 entry; track ten stable, distinct
  completed future families persistently across fresh runs; locked slots must
  not reveal spoilers. Also integrate standard Kind Robots achievements,
  including first ending, collaborative paths and completing all ten.
  Test at phone/tablet/desktop landscape/portrait viewports, with actual
  mounted-browser geometry and save/reload persistence. UI and badge art
  remain gated until creative approval. See VIEWPORT-ACHIEVEMENTS-CONTRACT.md.
  2026-10-19 PT NEW THEMATIC THESIS: Ecotone is a candidate game title and
  metaphor for the junction of living ecosystems, histories, populations,
  economic transitions and multiple futures. Humboldt's Indigenous nations
  remain sovereign living communities, not a vanished historical era. Forest,
  logging, fisheries, cannabis boom/bust, college life, arts, housing,
  homelessness, technology and evolving labor possibilities intersect. User
  wants the player to help decide Humboldt's collective fate through one
  psychedelic/strange festival weekend, then see 1/10/30-year alternate
  epilogues: hippy paradise, tech utopia, corporate dystopia, anarchy, slow
  decline, ecological refuge, hybrid futures, and more. Avoid a pro- or
  anti-tech editorial verdict; include fictional exploitative developers,
  flawed anti-development splinters and nuanced workers/residents. Fate
  stakes are mandatory; deep metaphysical explanation may remain optional.
  Preserve existing 120 seeds, four voluntary perception states and cast.
  See ECOTONE-CORE.md and ECOTONE-ENDINGS.md; no art/publish authorization.
