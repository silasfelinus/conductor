  His parents remain together in all routes. Story matrix
  ECOTONE-32-ENDINGS.md; art/release still strictly gated.

  2026-10-19 PT LATEST HOPE AND COMPANION-ARC DIRECTION: This is
  ultimately an OPTIMISTIC fantasy/scifi/horror game because the
  protagonist and community can steer Humboldt toward better futures,
  without a guaranteed perfect ideological outcome. All FOUR
  independent companions must have a reachable, earned optimal
  exploration path with a distinctive personal epilogue; nonoptimal
  paths stay dignified. The optimal threads must be reachable from
  ALL initial Sober/Tipsy/Stoned/Tripping perception states, even
  after declining an introduction, with deterministic anchor beats,
  rather than rare RNG. Cedar's logger/grower-family parents ARE
  STILL TOGETHER in the present and throughout the ending variants,
  especially his optimum. Their marriage is NOT a player-dependent
  rescue objective. Reference COMPANION-OPTIMAL-PATHS.md, retain
  ten background county motifs and Endings X/32 gallery, one-screen
  UI, art and publication human gates.

  2026-10-19 PT LATEST CHARACTER REWRITE: The Tripping-route companion
  Cedar (still a working name) is now a younger, country/redneck Humboldt
  local skilled in practical repairs, NOT a former older hippie/grower,
  dispensary proprietor or massage therapist. One parent grew up in a
  timber-working family, the other in a backwoods cannabis-growing
  family; their relationship crossed the forest/timber conflicts.
  Green/yellow antenna ribbons were complex symbols (Silas remembers
  GREEN on his family's car), not Earth First! membership indicators.
  Earth First! could be a pejorative; real tree spiking harmed sawmill
  workers, though 1990 Northern California organizers renounced it.
  Julia Butterfly Hill's 738-day 1997-99 Luna tree-sit near Stafford,
  conservation agreement and later 2000 vandalism are immutable real
  history, not magical alternate facts or an accessible game location.
  Incorporate the historical anchor without inventing named people's
  personal actions. See COMPANIONS-AND-PROLOGUE.md and FACT-CHECK.md.

  2026-10-19 PT NEW UI AND PROGRESSION RULE: Every phone/tablet/desktop
  gameplay view is a single non-page-scroll visual surface, as in Shifting
  Lands' journey board and Shifting Desks' desk. Use compact tabs and bounded
  inner scroll only for long journals/endings, never document scrolling.
  Show an always-reachable Endings X/32 entry; track 32 stable, distinct
  lead/lens/fate combinations across fresh runs; locked slots must
  not reveal spoilers. Also integrate standard Kind Robots achievements,
  including first ending, collaborative paths and completing all 32.
  Test at phone/tablet/desktop landscape/portrait viewports, with actual
  mounted-browser geometry and save/reload persistence. UI and badge art
  remain gated until creative approval. See VIEWPORT-ACHIEVEMENTS-CONTRACT.md.
  2026-10-19 PT NEW THEMATIC THESIS: Ecotone is a candidate game title and
  metaphor for the junction of living ecosystems, histories, populations,
  economic transitions and multiple futures. Humboldt's Indigenous nations
  remain sovereign living communities, not a vanished historical era. Forest,
  logging, fisheries, cannabis boom/bust, college life, arts, housing,
  homelessness, technology and evolving labor possibilities intersect. User
  wants the player to help decide Humboldt's collective fate through one
  psychedelic/strange festival weekend, then see 1/10/30-year alternate
  epilogues: hippy paradise, tech utopia, corporate dystopia, anarchy, slow
  decline, ecological refuge, hybrid futures, and more. Avoid a pro- or
  anti-tech editorial verdict; include fictional exploitative developers,
  flawed anti-development splinters and nuanced workers/residents. Fate
  stakes are mandatory; deep metaphysical explanation may remain optional.
  Preserve existing 120 seeds, four voluntary perception states and cast.
  See ECOTONE-CORE.md and ECOTONE-ENDINGS.md; no art/publish authorization.
