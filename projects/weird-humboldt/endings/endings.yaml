# Weird Humboldt v1 - 12 ending records: 8 companion cores (lead x fate) + 4 county futures.
# Grammar: ECOTONE-ENDING-GRAMMAR.md (cores carry 1/10/30-year beats; signatures/callbacks come later).
# Checked by scripts/validate_weird_humboldt_cards.py (validate_endings). Text only: no art, no ArtJobs.
# Every requires_flags entry must be set by a real card or anchor effect; Wiyot/Tuluwat material is excluded.
- id: E-mara.hope
  kind: core
  lead: mara
  fate: hope
  title: "The Studio With Two Doors"
  requires_flags: [anchor5_promises_kept, anchor6_named_the_promise]
  civic_future: "Mara's studio stays locally owned and trains apprentices on a posted, fair pay scale."
  one_year: "The studio signs a five-year lease with a landlord who keeps the promise made at the county table. Mara hangs the schedule of apprentice hours on the front door where anyone can read it."
  ten_year: "Two apprentices run their own shop down the street. Mara argues with them about prices and loses, cheerfully. Rent is steady because the block's owners agreed to it in public."
  thirty_year: "A teenager brings in a sketch of the six-winged sign and asks if it is real. Mara says it was once, and it was kept honest by people who showed up to meetings."
  cost: "Steady rents mean slower growth: two storefronts stay empty for years, and the city taxes feel it."
  quiet_scene: "On the safety corridor an egret stands in the ditch where the marsh was restored. Mara slows down for it, as she always does."
- id: E-mara.dark
  kind: core
  lead: mara
  fate: dark
  title: "The Chair Nobody Can Afford"
  requires_flags: [anchor5_betrayed_one, anchor6_county_decides]
  civic_future: "Mara's studio is squeezed out when a promise she trusted is quietly broken."
  one_year: "The lease is renewed at a number that reads like a polite goodbye. Mara signs because the alternative is a worse number in a town she does not know."
  ten_year: "She works from a spare room, taking walk-ins she cannot refuse. The apprentices she promised to train found paid work elsewhere, and she does not blame them."
  thirty_year: "The old shop is a bank branch with a mural of the sign, smoothed and recoloured. Mara can still draw the original from memory, and does, on napkins, for anyone who asks."
  cost: "The county gained a tax base and lost the people who could explain why the sign mattered."
  quiet_scene: "On the safety corridor the ditch is drained and the egrets are gone. Mara notices the silence before she notices the empty field."
- id: E-kit.hope
  kind: core
  lead: kit
  fate: hope
  title: "The Machine That Pays Its Makers"
  requires_flags: [fog_union_deal, anchor6_four_voices]
  civic_future: "Kit's kinetic workshop becomes a fairly paid public venue owned by the people who build in it."
  one_year: "Kit turns the sign-gear drawing into a working piece. The workshop wage board goes up on the wall next to the parts shelf, and nobody takes it down."
  ten_year: "Her Hmong American family fills the venue for a New Year gathering, with a new generation of cousins fighting over who gets to turn the crank. Kit refuses a buyout twice."
  thirty_year: "The workshop is a quiet fixture of the waterfront. Kit mentors in the mornings and breaks things on purpose in the afternoons, because that is how the good ideas start."
  cost: "Fair pay limits how fast the workshop can scale, and a larger firm builds a flashier competitor ten miles away."
  quiet_scene: "On the safety corridor a peregrine rides the wind above a field that was fought for. Kit times the wingbeats with her thumb."
- id: E-kit.dark
  kind: core
  lead: kit
  fate: dark
  title: "The Branded Gear"
  requires_flags: [marker_union, anchor6_county_decides]
  civic_future: "Kit's machine is absorbed into corporate branding and its makers are scattered."
  one_year: "Kit sells because the offer arrives the week the rent does. The gear train becomes a logo, and the logo is everywhere."
  ten_year: "The workshop is a showroom. Kit visits once and is asked by a guard whether she has an appointment. Her family tells her the pride is still hers, and she half believes it."
  thirty_year: "She builds again in a borrowed garage, small and unsold, and finds the old joy intact. It is not a happy ending, but it is a working one."
  cost: "The county got a polished waterfront and lost the people who built it, and the repair bill arrives later."
  quiet_scene: "On the safety corridor a billboard shows the logo. Beneath it the ditch is dry, and Kit counts the lost species out loud."
- id: E-juniper.hope
  kind: core
  lead: juniper
  fate: hope
  title: "Shared Stewardship"
  requires_flags: [thesis_marsh_heard, anchor6_four_voices]
  civic_future: "Juniper trusts humans to co-steward a living forest, with written safeguards and her own veto."
  one_year: "Juniper signs a stewardship agreement she wrote herself, with a clause giving the forest the last word on timing. The first trail closure holds."
  ten_year: "A mixed crew of loggers, volunteers and students repair a slope together. Juniper argues that change is sometimes the forest's own idea, and wins the argument by being right."
  thirty_year: "The grove is thicker, louder and occasionally closed to visitors. Juniper counts this as the best kind of success: it did not need her to be there."
  cost: "Closures cost local businesses a season of tourists, and the stewardship fund has to be re-voted every few years."
  quiet_scene: "On the safety corridor shorebirds work the mud flats, fat and unbothered. Juniper opens the window and says nothing."
- id: E-juniper.dark
  kind: core
  lead: juniper
  fate: dark
  title: "The Retreat"
  requires_flags: [anchor5_betrayed_one, anchor6_county_decides]
  civic_future: "Juniper withdraws with her nonhuman neighbours after promises to the forest are broken."
  one_year: "The agreement is signed, then ignored. Juniper leaves a note on the council's door that reads only: listen."
  ten_year: "She lives at the edge of a patch the loggers skip because the maps are wrong. Visitors report the forest as quiet, which is not the same as peaceful."
  thirty_year: "The patch is the only old growth left in the district, and Juniper keeps it that way by being difficult. She is not lonely, only unconvinced."
  cost: "The county kept its jobs and lost the one person who could translate the forest into a budget line."
  quiet_scene: "On the safety corridor the egret stands alone in a drained field, looking at a road. Juniper turns the car around."
- id: E-cedar.hope
  kind: core
  lead: cedar
  fate: hope
  title: "The Accountable Antenna"
  requires_flags: [crossroads3_council_seated, anchor6_named_the_promise]
  civic_future: "Cedar's locally owned technical network supports skilled rural work and a living watershed."
  one_year: "Cedar's handset becomes the first node of a community network governed by the people it serves. The charter is posted at the feed store."
  ten_year: "His logger father and activist mother, still married and still disagreeing, argue over how to repair a creek crossing. The network's sensors tell them the creek is fine. They fix it anyway."
  thirty_year: "The sensors are everywhere and nobody minds, because everyone knows who owns them. Cedar teaches a class on this, and his parents sit in the front row, together, heckling gently."
  cost: "Open sensors cost energy and upkeep, and a fraction of residents opt out and are quietly resented for it."
  quiet_scene: "On the safety corridor a monitoring station sits beside the ditch, solar-powered and ignored by the egrets."
- id: E-cedar.dark
  kind: core
  lead: cedar
  fate: dark
  title: "The Private Key"
  requires_flags: [crossroads3_followed, anchor6_county_decides]
  civic_future: "Cedar's network is captured by a private owner; his parents remain together through the loss."
  one_year: "The network changes hands in a paperwork hour nobody attended. Cedar finds out from a notification."
  ten_year: "His parents, still married and still arguing, keep the old crossing repaired by hand. His father says the work is the point, and his mother says the work is the protest."
  thirty_year: "Cedar builds a smaller network in the barn, off the grid and off the record. It is not much. It is theirs."
  cost: "Skilled rural jobs left for the cities, and the community lost both the network and the habit of owning things together."
  quiet_scene: "On the safety corridor a locked sensor box stands in the ditch. The egrets avoid it, and Cedar's mother says so every time."
- id: E-county.tidelands_accord
  kind: county
  title: "The Tidelands Accord"
  requires_flags: [vote_all_voices, vote_shared_work]
  civic_future: "Housing, livable jobs and estuary restoration are negotiated together, slowly, and nobody gets everything."
  one_year: "The accord is signed after eleven hearings. Every faction is annoyed, which the facilitator calls a success."
  ten_year: "Stable homes sit beside a restored marsh, and the working waterfront still works. The first generation to grow up under it takes it for granted."
  thirty_year: "The accord is amended, not replaced. Compromise has become a local skill, taught in schools and mocked at barbecues."
  cost: "Negotiation takes years, rents rise a little, and the compromises satisfy no one completely."
  quiet_scene: "On the safety corridor the marsh is full of birds and the fence is a bike path."
- id: E-county.silicon_estuary
  kind: county
  title: "The Silicon Estuary"
  requires_flags: [crossroads3_council_seated, vote_road_speaks]
  civic_future: "Community-controlled broadband and transparent infrastructure bring remote work, good schools and new craft jobs."
  one_year: "Fibre reaches the last logging road, owned by a co-op whose board includes a bus driver and a schoolteacher."
  ten_year: "Remote workers arrive and rents climb. The co-op responds with a housing fund the first time anyone threatens to leave."
  thirty_year: "The estuary is a small, odd hub of repair-minded engineers. The energy bills are public and so are the arguments about them."
  cost: "Newcomers change the town, rents press on long-time residents, and the infrastructure has its own ecological footprint."
  quiet_scene: "On the safety corridor an egret fishes beside a cell tower that is, for once, quietly hosting an owl box."
- id: E-county.beautiful_museum
  kind: county
  title: "The Beautiful Museum"
  requires_flags: [vote_thin_count, marker_restored]
  civic_future: "Absolute preservation rules protect the views and push young families out."
  one_year: "The rules pass with the best intentions. The town looks exactly the same, which is the problem."
  ten_year: "Services close one by one, and the school merges with another. The festival traditions survive in front of smaller crowds."
  thirty_year: "Nostalgia has become a kind of gatekeeping. A group of locals begins, tentatively, to ask for the rules to be amended."
  cost: "Housing is frozen, young people leave, and preservation protects the setting but not the community."
  quiet_scene: "On the safety corridor everything is beautiful and nobody under forty is driving it."
- id: E-county.split_county
  kind: county
  title: "The Split County"
  requires_flags: [vote_rough_hearing, winners_tangled]
  civic_future: "A failed stabilizer leaves several Humboldts overlapping, and ordinary care becomes unreliable."
  one_year: "On Tuesday there are two Plazas. By Thursday the council has stopped issuing permits for either."
  ten_year: "Families live in incompatible versions of the same street. They wave across the gap, and sometimes pass casseroles through it."
  thirty_year: "The gap is a landmark. Children grow up knowing which side they were born on and which side they would like to visit."
  cost: "Geography, records and emergency services are unreliable, and the hardest cost is being a neighbour of someone you cannot reach."
  quiet_scene: "On the safety corridor two egrets stand in the same ditch at the same time, one of them faintly transparent."
- id: E-county.redwood_commons
  kind: county
  title: "Redwood Commons"
  requires_flags: [vote_shared_work, redwood_ring_felt]
  civic_future: "Restoration, cooperative land and mutual-aid trust keep the woods protected and the gardens full."
  one_year: "The land co-op posts its first annual report on a barn door. Every member signs it, including the ones who argued all winter."
  ten_year: "Music drifts out of the garden barns most evenings. A hiring board for repair trades has quietly replaced the old rumour that the commons has no jobs."
  thirty_year: "Newcomers learn the unwritten rules and the written ones, and the written ones are the ones that survive. Belonging is still decided by people, and the people keep revising how."
  cost: "Housing and food supply stay tight, informal gatekeepers sometimes decide who belongs, and specialists leave for cities."
  quiet_scene: "On the safety corridor the marsh edge is thick with shorebirds, and someone has hand-painted a thank-you on the culvert."
- id: E-county.global_terminal
  kind: county
  title: "The Global Terminal"
  requires_flags: [vote_thin_count, pell_paid]
  civic_future: "Private infrastructure with weak oversight turns the bay into a logistics hub and the town into its edge."
  one_year: "Cranes go up fast and the permits go faster. A handful of residents get very good jobs and a lot of residents get nothing in writing."
  ten_year: "Downtown looks like the future on brochures. Storefronts sit empty behind it, and warehouse shifts are assigned by an app nobody can argue with."
  thirty_year: "The bay moves goods for the world and almost nothing for the neighbours. A small tenants' union meets in a church basement and has kept every minute."
  cost: "Surveillance, precarious labour and scarred habitat arrive together, and the county has to sue for information about its own harbour."
  quiet_scene: "On the safety corridor a floodlit fence runs beside the ditch. A single peregrine perches on the lamp, unimpressed."
- id: E-county.free_county
  kind: county
  title: "The Free County"
  requires_flags: [vote_all_voices, council_citizen]
  civic_future: "Widely shared resources and accountable decentralised decisions give neighbourhoods real autonomy, and real coordination headaches."
  one_year: "Each watershed holds its own meeting and sends a delegate with a written mandate. The first joint budget takes nine sessions and a lot of soup."
  ten_year: "DIY energy and arts collectives run half the town. Disputes over the shared water line are loud, public and, usually, resolved."
  thirty_year: "The delegates' mandates are a local art form, and the oldest ones hang framed in the library. Repair is treated as a civic skill rather than a failure."
  cost: "Coordination is exhausting, shared infrastructure is a constant argument, and a disaster drill exposes how many gaps remain."
  quiet_scene: "On the safety corridor a community crew mows the verge by hand on a Saturday, and an egret supervises."
- id: E-county.barricaded_county
  kind: county
  title: "The Barricaded County"
  requires_flags: [vote_rough_hearing, council_subpoenaed]
  civic_future: "Escalating factions and broken trust leave communication, emergency services and confidence in tatters."
  one_year: "The county road is closed at two points by people who each believe they are protecting someone. The phones go down the same week."
  ten_year: "A few isolated communities cope well by accident and by long habit. Elsewhere splinter groups make rules, and the ambulance takes the long way."
  thirty_year: "Some of the barricades are now gardens. Nobody remembers who put up the first one, and everybody remembers who took the first one down."
  cost: "Lost lives are fewer than feared and lost trust is greater, and rebuilding the habit of showing up to a meeting is slow."
  quiet_scene: "On the safety corridor the ditch is quiet and a hand-lettered sign says LAST EGRET SEEN: TUESDAY. Someone updates it."
- id: E-county.worktown
  kind: county
  title: "Worktown"
  requires_flags: [motion_tabled, council_typo]
  civic_future: "No durable coalition forms, services fragment, and the old landscapes survive in pockets."
  one_year: "A motion is tabled and tabled again, and nobody notices the day it stops being a procedural move and starts being a decision."
  ten_year: "Windows are boarded on Main while housing is short, which is a trick only a depopulating town can pull off. Young people leave after high school."
  thirty_year: "Neighbourhood rituals persist where a few households keep them: a porch light, a parade of nine, a shared tomato. The county is quiet and not entirely sad."
  cost: "Opportunities slip away without a villain, and the lack of a durable coalition becomes the thing the next generation has to build."
  quiet_scene: "On the safety corridor the egrets are there and the road is half empty. A tractor idles at the shoulder with no one on it."
- id: E-county.sanctuary_redwood_curtain
  kind: county
  title: "The Sanctuary of the Redwood Curtain"
  requires_flags: [gull_accord, redwood_sat_with]
  civic_future: "High surreal permeability and stewardship alliances protect the strange corridors and the people who live beside them."
  one_year: "The county posts a list of corridors no one may enter without invitation, in three languages and one very formal bird call."
  ten_year: "Nymphs, cryptids and humans share a fortnightly calendar of obligations. Mail takes a strange route to a few addresses and everyone has stopped complaining."
  thirty_year: "An uncanny edge isolates some communities, and the services that reach them do so on someone else's terms. Coexistence is a standing agenda item rather than a miracle."
  cost: "Access, mail and emergency routes bend around the border, and coexistence demands ongoing work from people who would prefer a clear rule."
  quiet_scene: "On the safety corridor the egrets stand politely aside for something you cannot quite see, and then resume."
