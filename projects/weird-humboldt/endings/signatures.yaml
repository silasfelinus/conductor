# Weird Humboldt v1 - 56 journey signatures (7 openings x 4 final companions x 2 fates).
# Grammar: ECOTONE-ENDING-GRAMMAR.md. Each signature is one compact paragraph + one art brief.
# Text only: no art, no ArtJobs, no publication. review_status stays "draft" until Silas's creative gate.
# Truthfulness: signatures name no stay/follow jump and no specific saved decision; only the lens the
# player chose at the opening, the final companion and the earned fate. Specific events are callbacks.
# No opening assigns morality, competence or outcome. Checked by validate_signatures().
shared_art:
  style: "painterly, warm and slightly strange, consistent with the Weird Humboldt card deck"
  must_not_imply: "that the opening lens caused the outcome; real drug use, preparation or effects; a real tribal art style, ceremony or protected status; any real person's private conduct"
  review_status: draft
signatures:
- id: juniper.sober.hope
  core: E-juniper.hope
  title: "Patient Canopy"
  paragraph: "You started the weekend clear-eyed, and Juniper noticed. She trusted your notes, and so the protections that held were the ones anyone could check: a posted habitat map, a hiring list with real names on it. Years later the canopy has closed over the old clearcut, and the neighbours who said it would never pay are on the crew."
  art: {subject: "Juniper beside a posted habitat map, canopy closing overhead", place_time: "Redwood edge at dawn, decade after", visual_contrast: "neat hand-lettered public map against wild green growth"}
  alt_text: "A woman in work gloves stands beside a hand-lettered map nailed to a redwood, young canopy rising behind her."
- id: juniper.sober.dark
  core: E-juniper.dark
  title: "Silent Preserve"
  paragraph: "Everything in the deal was green and legal, and that was the trouble. You read the fine print and saw the neighbours missing from it too late to move it. The forest is protected now, and the road to it is gated, and Juniper keeps the key she never asked for."
  art: {subject: "Juniper at a locked trailhead gate holding a single key", place_time: "Gated forest road, late autumn", visual_contrast: "pristine forest behind, empty parking lot in front"}
  alt_text: "A woman holds a key beside a closed trailhead gate; unused picnic tables sit in the empty lot."
- id: juniper.tipsy.hope
  core: E-juniper.hope
  title: "Common Ground Jubilee"
  paragraph: "The night loosened everyone's tongue, you included, and promises made over a shared table turned out to be easy to write down the next morning. The festival alliance endowed an open stretch of forest that no venue can rent. Juniper still teases you about the toast."
  art: {subject: "Long communal table under redwoods, a deed ribbon tied to a bench", place_time: "Festival grounds, golden hour", visual_contrast: "party warmth against the quiet legal gravity of the ribbon"}
  alt_text: "Neighbours gather at a long table under tall trees; a ribbon is tied around a bench in the foreground."
- id: juniper.tipsy.dark
  core: E-juniper.dark
  title: "Festival Fence"
  paragraph: "The party was wonderful and the paperwork afterward was not. A luxury venue bought the meadow where the table had stood, and a tasteful fence went up around the memory. Juniper walks the perimeter some evenings and names the trees she can still see through the slats."
  art: {subject: "Juniper at a tasteful wooden fence looking through slats into a meadow", place_time: "Former festival meadow, dusk", visual_contrast: "string lights inside the fence, dark forest outside"}
  alt_text: "A woman looks through a wooden fence at a lit private venue while tall trees stand dark behind her."
- id: juniper.stoned.hope
  core: E-juniper.hope
  title: "Living Patchwork"
  paragraph: "You saw the land as a quilt and Juniper helped you stitch it: a restored creek here, a tool-lending barn there, a few families whose livelihoods depended on the seam holding. It is not tidy. It works, and the patches have started to look like one thing."
  art: {subject: "Aerial quilt of restored creek, tool barn and small plots", place_time: "Coastal hillside, mid-morning ten years on", visual_contrast: "ragged patchwork edges against a single continuous watershed line"}
  alt_text: "A hillside seen from above, divided into small restored patches joined by a creek."
- id: juniper.stoned.dark
  core: E-juniper.dark
  title: "Evergreen Dream"
  paragraph: "The pledges were lovely and nobody had to keep them. Runoff stained the creek a shade of milk, and a banner over the office promised an evergreen future in a font that cost more than the monitoring. Juniper counts the gaps in the habitat instead of the signatures."
  art: {subject: "A cheerful banner over a neglected creek with pale runoff", place_time: "Creek mouth, overcast afternoon", visual_contrast: "bright banner lettering against murky water"}
  alt_text: "A bright promotional banner hangs above a creek running cloudy, with bare stumps along the bank."
- id: juniper.tripping.hope
  core: E-juniper.hope
  title: "Doors in the Roots"
  paragraph: "What you saw at the start turned out to be there when you looked again with a witness. The crossings in the roots are real, and the ones that matter are now posted, kept open and kept honest for every neighbour. Juniper leaves bread at one of them on Sundays."
  art: {subject: "A doorway between redwood roots with a posted notice and a loaf of bread", place_time: "Old-growth grove, soft fog", visual_contrast: "ordinary municipal signage beside an impossible threshold"}
  alt_text: "A small arched doorway among giant roots, with a typed notice and a loaf of bread set before it."
- id: juniper.tripping.dark
  core: E-juniper.dark
  title: "Mirror Grove"
  paragraph: "The crossings were real, and so was the person who decided to own them. Private gatekeepers charged for passage and sometimes forgot to open the way back. Juniper keeps a ledger of the stranded and visits the ones she can reach."
  art: {subject: "A mirror-bright grove with a toll booth at its entrance, a figure standing on the wrong side", place_time: "Grove at twilight", visual_contrast: "perfect reflected forest against a stranded real person"}
  alt_text: "A woman stands outside a toll booth at a grove whose trees are reflected like a mirror."
- id: juniper.cocaine.hope
  core: E-juniper.hope
  title: "Fast Easement"
  paragraph: "You moved at the speed of a fax machine on fire, and for once the urgency was on the right side. A land deal that should have taken years closed in weeks because the habitat was real and the paperwork was clean. Juniper was impressed and says so when nobody is recording."
  art: {subject: "Juniper and a land trustee signing an easement on a truck hood as a bird flies overhead", place_time: "Gravel pullout, early morning", visual_contrast: "frantic paperwork against a quiet nesting site"}
  alt_text: "Two people sign a document on the hood of a truck while a large bird glides over a nearby treeline."
- id: juniper.cocaine.dark
  core: E-juniper.dark
  title: "Closing Day"
  paragraph: "Everything closed on schedule, which should have been a clue. The deal was rushed past the neighbours who would have asked questions, and the ones it displaced learned about it from a sign. Juniper still believes in the forest and has stopped believing in speed."
  art: {subject: "A SOLD sign nailed to a gate beside a neighbour's shuttered farmstand", place_time: "Rural road, harsh midday", visual_contrast: "crisp closing paperwork against a hand-painted farmstand sign"}
  alt_text: "A bright sold sign on a gate beside a closed farmstand with a faded hand-painted sign."
- id: juniper.meth.hope
  core: E-juniper.hope
  title: "Night Frequency"
  paragraph: "You stayed up with a radio and a hunch and, crucially, a second listener to confirm it. The signal pointed to a corridor where the old trees cross, and the corridor was protected because two people could say exactly what they heard. Juniper brings a thermos when she checks."
  art: {subject: "Two people at a hand-cranked radio on a forest log, a faint corridor of light between trees", place_time: "Deep night, forest clearing", visual_contrast: "small warm radio glow against enormous dark trunks"}
  alt_text: "Two figures sit on a log by a glowing radio at night, with a pale path of light between redwoods."
- id: juniper.meth.dark
  core: E-juniper.dark
  title: "Static Grove"
  paragraph: "The broadcast was real enough to be used against someone. An uncorroborated signal became the reason to close a stretch of forest, and the people who lived beside it were not consulted. Juniper tuned the same station later and heard only static, then her own name."
  art: {subject: "A closed-forest notice stapled to a tree with a radio hissing below it", place_time: "Trailhead, grey dawn", visual_contrast: "official closure notice against an unreadable static-filled radio"}
  alt_text: "A closure notice on a tree trunk above a small radio lying in the leaf litter."
- id: juniper.mdma.hope
  core: E-juniper.hope
  title: "Circle of Neighbors"
  paragraph: "The warmth you felt that night did not evaporate; it went to work. The festival circle became a standing stewardship council, with chairs for people who had never been invited before. Juniper sits in the one by the window and lets you talk first."
  art: {subject: "A circle of mismatched chairs in a forest hall, one by the window left open", place_time: "Community hall at dusk, year ten", visual_contrast: "informal circle against an elaborate set of binding minutes"}
  alt_text: "Mismatched chairs arranged in a circle in a wooden hall, a notebook open on one seat."
- id: juniper.mdma.dark
  core: E-juniper.dark
  title: "Warm Words, Cold Title"
  paragraph: "Everyone meant it, and meaning it was the whole agreement. When the property changed hands, the pledges of goodwill had no signature behind them. Juniper still holds your hand at the gate, and it is genuinely kind, and it does not reopen it."
  art: {subject: "A hand-embroidered pledge banner on a fence, the property sign newer than the banner", place_time: "Meadow gate, late light", visual_contrast: "soft handmade banner against new legal signage"}
  alt_text: "A faded embroidered banner on a fence next to a crisp new property sign."
- id: kit.sober.hope
  core: E-kit.hope
  title: "Workshop Charter"
  paragraph: "You came in sober and read the room. The charter you helped Kit draft pays makers fairly and keeps the real history on the wall. The workshop is not glamorous. The cranes in the window were built by people who got paid for building them."
  art: {subject: "Kit pinning a signed wage charter beside a half-built kinetic piece", place_time: "Waterfront workshop, bright morning", visual_contrast: "sober paperwork against a playful machine in motion"}
  alt_text: "A young woman pins a signed paper to a wall beside a half-built brass kinetic sculpture."
- id: kit.sober.dark
  core: E-kit.dark
  title: "Museum Without Makers"
  paragraph: "The plaques survived and the people who made the things did not. You saw the rents turn before anyone said so, and could not hold the line alone. Kit still gives the tour, in a building she can no longer afford to work in."
  art: {subject: "Kit leading a museum tour past empty workbenches with name plaques", place_time: "Converted workshop, cool light", visual_contrast: "polished plaques against dust-free, unused tools"}
  alt_text: "A guide gestures at a row of labelled but empty workbenches in a gleaming museum hall."
- id: kit.tipsy.hope
  core: E-kit.hope
  title: "Carnival of Makers"
  paragraph: "It began as a loose night and a lot of cardboard. The kinetic parade you helped carry became a durable local institution with a board, a budget and a standing parking permit. Kit says the secret is that the glue was never the point."
  art: {subject: "A kinetic parade of cardboard machines led by Kit with a banner reading the institution's name", place_time: "Waterfront street, festival evening", visual_contrast: "improvised cardboard against permanent civic banners"}
  alt_text: "A parade of homemade moving cardboard machines passes under string lights and a permanent banner."
- id: kit.tipsy.dark
  core: E-kit.dark
  title: "Sponsored Spectacle"
  paragraph: "The party was so good someone bought it. A corporation licensed the parade, the name and the music, and kept the cranks. Kit still turns one by hand in the parking lot, off the clock, and the children still come."
  art: {subject: "A branded parade float beside Kit turning a hand crank in an empty lot", place_time: "Parking lot, after the parade", visual_contrast: "slick logo float against a single homemade crank"}
  alt_text: "A large branded float rolls past while a woman turns a small hand crank alone in a lot."
- id: kit.stoned.hope
  core: E-kit.hope
  title: "Handmade City"
  paragraph: "You and Kit let the idea ripple until it had walls. A cooperative housing block and a build hall went up side by side, owned by the people who use them. Her family comes on holidays and argues about which cousin is allowed to touch the lathe."
  art: {subject: "A cooperative housing block with a build hall at its base, laundry and sculpture on the balconies", place_time: "Waterfront district, bright afternoon", visual_contrast: "domestic laundry lines against monumental kinetic art"}
  alt_text: "A mixed housing and workshop building with laundry and sculptures on its balconies."
- id: kit.stoned.dark
  core: E-kit.dark
  title: "Creative Exodus"
  paragraph: "The art was loved so much it got repackaged as a luxury brand. The artists moved inland one lease at a time, and the district kept their style and lost their address. Kit keeps a small sketchbook of the studios, so someone remembers where they were."
  art: {subject: "A luxury shop window displaying kinetic sculptures labelled 'inspired by Humboldt'", place_time: "Gentrified street, glowing evening", visual_contrast: "expensive display against a rusted moving van in the background"}
  alt_text: "A shop window with polished kinetic sculptures while a moving van is loaded down the street."
- id: kit.tripping.hope
  core: E-kit.hope
  title: "Machine of Belonging"
  paragraph: "The machine that unfolded in the dark could show you choices without rewriting a thing, and you built a daylight version with Kit. It sits in the public venue, and visitors turn the crank to see which paths they passed. It does not change the past. It lets them choose better ones."
  art: {subject: "A public kinetic installation whose rotating panels show branching paths", place_time: "Civic venue interior, soft daylight", visual_contrast: "impossible geometry against the ordinary crowd at its crank"}
  alt_text: "Visitors gather around a large kinetic installation with rotating panels depicting branching paths."
- id: kit.tripping.dark
  core: E-kit.dark
  title: "Perfect Replica"
  paragraph: "The copy was flawless, and that was its crime. A counterfeit Humboldt opened beside the real one and quietly displaced the living culture that made it. Kit stands at the door of the original and hands out maps."
  art: {subject: "Two identical storefronts, one bright and crowded, one dim with Kit at the door", place_time: "Main street, dusk", visual_contrast: "flawless copy against a worn but real original"}
  alt_text: "Two nearly identical storefronts side by side; a woman at the dimmer one holds out a paper map."
- id: kit.cocaine.hope
  core: E-kit.hope
  title: "Overtime Pays Everyone"
  paragraph: "The rush order was real and so was the crunch. You pushed to put every maker's name on the invoice, and the crew was paid for the extra hours at the posted rate. Kit still has the receipt framed over the parts shelf."
  art: {subject: "Kit and a crew finishing a sculpture at night beside a framed invoice", place_time: "Workshop at midnight, warm light", visual_contrast: "urgent night work against a framed, fair paycheck"}
  alt_text: "A crew works late on a large sculpture; a framed invoice hangs on the wall behind them."
- id: kit.cocaine.dark
  core: E-kit.dark
  title: "Rush Order"
  paragraph: "The deadline was met and the crew was spent. Shortcuts that looked harmless on Friday became the reason someone sat out the next season. Kit, who loves speed, makes everyone take lunch now and is still saying sorry."
  art: {subject: "A finished sculpture with unwelcome safety tape around it and a tired crew at a table", place_time: "Workshop, grey morning", visual_contrast: "triumphant finished piece against exhausted people"}
  alt_text: "A finished large sculpture wrapped in safety tape while tired workers sit at a table."
- id: kit.meth.hope
  core: E-kit.hope
  title: "Lamp in the Workshop"
  paragraph: "The night shift had a hum that you did not understand until daylight, and then you made rules around it. The workshop stays open late by choice, with rest hours posted and honored. Kit leaves a lamp on, and a note: go home."
  art: {subject: "A lit workshop window at night with a note taped inside reading 'go home'", place_time: "Waterfront at night", visual_contrast: "a single warm lamp against a vast dark bay"}
  alt_text: "A lit workshop window at night, a handwritten note taped to the glass."
- id: kit.meth.dark
  core: E-kit.dark
  title: "Always-On Machine"
  paragraph: "The rig never stopped, and neither did the people feeding it. The venue's contract rewarded constant output and did not count the cost. Kit pulled the plug in the end, a decade too late for some, and she says so first."
  art: {subject: "A machine running under hanging lamps with empty chairs around it", place_time: "Workshop, small hours", visual_contrast: "relentless motion against abandoned seats"}
  alt_text: "A kinetic machine runs under bare lamps while chairs around it sit empty."
- id: kit.mdma.hope
  core: E-kit.hope
  title: "Hands on the Crank"
  paragraph: "The feeling that everyone belonged did not fade; it got a shift schedule. Neighbours of every age sign up to turn the crank, and the venue's door is propped open by a rule, not a mood. Kit calls it the only machine that runs on being asked."
  art: {subject: "Kit's workshop open to neighbours of all ages, children at a crank", place_time: "Workshop open day, bright", visual_contrast: "intimate hands on a giant machine"}
  alt_text: "Neighbours of different ages take turns at a large crank in a bright workshop."
- id: kit.mdma.dark
  core: E-kit.dark
  title: "Gratitude Economy"
  paragraph: "Everyone was so thankful that no one asked for money. The venue ran on exposure and goodwill until the goodwill ran out, and the sponsors kept the receipts. Kit still believes in the people in the room and has learned to read the contract."
  art: {subject: "Kit reading a contract at a lively venue entrance while volunteers carry equipment", place_time: "Venue front door, evening", visual_contrast: "warm crowd against a cold printed contract"}
  alt_text: "A young woman reads a contract at the door of a busy venue as volunteers carry equipment."
- id: mara.sober.hope
  core: E-mara.hope
  title: "Lines That Last"
  paragraph: "You kept your head, and Mara kept her lease. An independent studio, a posted pay scale for apprentices and a block whose owners agreed in public. Mara hangs your first practice sketch where clients can see it, because honesty is a good look."
  art: {subject: "Mara's studio front with a posted apprentice schedule and a framed practice sketch", place_time: "Main street storefront, morning", visual_contrast: "needle-fine linework against a plain public noticeboard"}
  alt_text: "A tattoo studio window with a posted schedule and a framed sketch, a person sweeping the step."
- id: mara.sober.dark
  core: E-mara.dark
  title: "Fine-Print Ink"
  paragraph: "The lease read like a handshake and worked like a trap. Client disclosures turned out to be a liability, not a courtesy, and trust thinned a signature at a time. Mara still draws the old sign from memory when someone asks."
  art: {subject: "Mara beside a stack of leases and release forms, a sketch of the old sign half-visible", place_time: "Back-office desk, late afternoon", visual_contrast: "dense legal text against a single fluid drawn line"}
  alt_text: "A woman sits at a desk piled with forms, a half-drawn sign sketch under her hand."
- id: mara.tipsy.hope
  core: E-mara.hope
  title: "Open Studio"
  paragraph: "The night was loud and the signatures were quiet, and both lasted. An arts gathering turned into a standing open studio where everyone is credited for what they draw. Mara frames the sign-in sheet, and you are on it."
  art: {subject: "A crowded open studio with a credit sheet on the wall", place_time: "Studio evening, string lights", visual_contrast: "crowded revelry against a simple signed credit list"}
  alt_text: "A crowded art studio with a sign-in sheet pinned to the wall and people drawing together."
- id: mara.tipsy.dark
  core: E-mara.dark
  title: "Stolen Flash"
  paragraph: "The flash sheets from that night were everywhere before the next morning, and nobody could say whose they were. Promoters printed them and sold the shirts. Mara found her line on a stranger's chest and had to prove it was hers."
  art: {subject: "Mara spotting her own design on a stranger's printed shirt", place_time: "Street market, midday", visual_contrast: "mass-printed reproduction against the personal quirks of her hand"}
  alt_text: "A woman stops to look at a stranger's shirt printed with a design she drew."
- id: mara.stoned.hope
  core: E-mara.hope
  title: "Room to Grow"
  paragraph: "The slow idea turned out to be a network. A cooperative of small studios shares insurance, a lease and a waiting room, and rents stay viable for people who draw for a living. Mara puts a plant in each window and names them."
  art: {subject: "A row of small studios with potted plants in each window and a shared sign", place_time: "Back-street block, afternoon", visual_contrast: "tiny individual shops against one shared roofline"}
  alt_text: "A row of small studio storefronts with plants in each window under one shared sign."
- id: mara.stoned.dark
  core: E-mara.dark
  title: "Souvenir Humboldt"
  paragraph: "Investors loved the look and not the artists. The district became a souvenir of itself, with mugs of Mara's style and none of her rent. She works from her kitchen and says the souvenir does not ask her opinion."
  art: {subject: "A souvenir shop selling mugs in Mara's style while she sketches at a kitchen table", place_time: "Gentrified street and a small kitchen, split frame", visual_contrast: "mass-market kitsch against a hand-drawn original"}
  alt_text: "A split scene: a souvenir shop of printed mugs and a woman sketching at a kitchen table."
- id: mara.tripping.hope
  core: E-mara.hope
  title: "Original Line"
  paragraph: "The uncanny trail you followed led to a copied line and the hand that first drew it. Authorship was restored, in writing, and the thief was invited to apprentice. Mara signs her work now with a small mark only she and you recognise."
  art: {subject: "A glowing trail of ink lines leading from a copy back to Mara's hand", place_time: "Studio, twilight", visual_contrast: "impossible luminous trail against a plain drafting desk"}
  alt_text: "A luminous trail of ink lines runs across a drafting desk toward a woman's hand."
- id: mara.tripping.dark
  core: E-mara.dark
  title: "Erased Signature"
  paragraph: "A prediction system learned her style and then claimed it. Her own pieces were flagged as imitations of the model that copied them. Mara stands in the studio doorway holding her signature as evidence, and nobody asks for it."
  art: {subject: "A screen flagging Mara's drawing as 'copy' while she holds the original", place_time: "Studio doorway, harsh screen light", visual_contrast: "authoritative interface against a hand-drawn original"}
  alt_text: "A woman holds a drawing beside a computer screen that labels it a copy."
- id: mara.cocaine.hope
  core: E-mara.hope
  title: "Signed in Full"
  paragraph: "You were quick, and for once the speed served the paperwork. Every commission carried credit clauses, apprentice pay and a payment date. Mara calls it the only time a deadline worked for her, and has pinned the contract above the autoclave."
  art: {subject: "Mara pinning a fully signed commission contract above equipment", place_time: "Studio wall, bright morning", visual_contrast: "crisp legal signatures against delicate linework"}
  alt_text: "A tattoo artist pins a signed contract to a studio wall above her equipment."
- id: mara.cocaine.dark
  core: E-mara.dark
  title: "Net Sixty"
  paragraph: "The commissions came fast and the payments came never. Clients who loved the work paid on a schedule only their accountants understood, and the studio overextended to match. Mara survives on cash jobs and a glare she is working to soften."
  art: {subject: "A calendar with 'NET 60' circled and unpaid invoices in a pile", place_time: "Studio back office, evening", visual_contrast: "busy appointment book against empty bank envelopes"}
  alt_text: "A wall calendar with a circled date and a pile of unpaid invoices on a desk."
- id: mara.meth.hope
  core: E-mara.hope
  title: "Quiet Hours Studio"
  paragraph: "The long night ended with a decision to stop working. The studio now keeps quiet hours, apprentices are paid for rest, and clients accept that a good line takes time. Mara locks up at nine and sleeps, and you have been told to do the same."
  art: {subject: "A studio with a CLOSED-FOR-REST sign at night, a cat asleep in the window", place_time: "Main street at night", visual_contrast: "calm sleeping studio against a restless city glow"}
  alt_text: "A dim studio window with a closed sign and a cat sleeping inside."
- id: mara.meth.dark
  core: E-mara.dark
  title: "Sleepless Commission"
  paragraph: "The big commission ate every hour and the studio's rest rules went with it. Mara signed a contract that made rest optional and quality mandatory. She delivered the work and left the building behind it."
  art: {subject: "Mara at a work table at 4 a.m. beside a stack of unfinished commissions", place_time: "Studio, predawn", visual_contrast: "dazzling finished work against a depleted artist"}
  alt_text: "A woman sits at a cluttered work table before dawn, surrounded by commissions."
- id: mara.mdma.hope
  core: E-mara.hope
  title: "Everyone's Name on It"
  paragraph: "The collaborative piece from that night stayed a collaboration. Every hand that touched it is credited in the margin, and the mural pays residuals to the block that painted it. Mara signs her own corner small and yours smaller, as a joke that lands."
  art: {subject: "A community mural with a ribbon of credited names along its edge", place_time: "Alley wall, afternoon", visual_contrast: "sprawling shared image against a tidy list of names"}
  alt_text: "A large community mural with a long list of painters' names along its border."
- id: mara.mdma.dark
  core: E-mara.dark
  title: "Group Piece, One Owner"
  paragraph: "Everyone loved the mural, and the building owner loved it most of all. A brand claimed the group's image and the group's goodwill together. Mara still believes the room was sincere and has learned to put it in writing."
  art: {subject: "A branded poster of the community mural, original painters standing before it", place_time: "Alley, early evening", visual_contrast: "corporate poster against faded hand-painted original"}
  alt_text: "A branded poster of a mural, with the original painters gathered in front."
- id: cedar.sober.hope
  core: E-cedar.hope
  title: "Watershed Network"
  paragraph: "You kept the numbers honest, and Cedar built around them: co-owned fibre along the logging roads, sensor crews on fair pay, a safe trades ladder. His father reads the logbook and his mother checks the sensors, and they argue about it at the same table."
  art: {subject: "Cedar with a sensor crew mounting a probe on a creek bank, fibre conduit in the foreground", place_time: "Watershed morning, ten years on", visual_contrast: "high-tech sensors against ancient streambank"}
  alt_text: "A young man and crew mount a sensor probe on a creek bank beside a length of fibre conduit."
- id: cedar.sober.dark
  core: E-cedar.dark
  title: "Private Backbone"
  paragraph: "The network was there. It belonged to someone else. Ecological data flowed out of the county to owners who sold it back as a service. Cedar's parents still sit at the same table, and the router blinks at them from the shelf."
  art: {subject: "A locked network cabinet by the roadside with an out-of-state owner's plate", place_time: "Logging road, dusk", visual_contrast: "sealed corporate cabinet against open forest"}
  alt_text: "A locked equipment cabinet on a forest road with an out-of-state company's plate."
- id: cedar.tipsy.hope
  core: E-cedar.hope
  title: "Toast to Tomorrow"
  paragraph: "Over a long toast the tradespeople and technologists found they were hiring from the same pool. They wrote it into an enforceable coalition with real penalties and real apprenticeships. Cedar's parents raised their glasses first, since neither trusted the other's speech."
  art: {subject: "A diverse room of tradespeople and technologists raising glasses beside a signed coalition charter", place_time: "Union hall, evening", visual_contrast: "convivial toast against a stern legal document"}
  alt_text: "People in work clothes and office wear raise glasses in a hall beside a signed charter."
- id: cedar.tipsy.dark
  core: E-cedar.dark
  title: "Salesman's Promise"
  paragraph: "The developers were charming and the jobs were real for about a year. When the contracts moved on, so did the money, leaving half-built offices and a workforce with certificates in a field that left. Cedar's parents hold the family together with practical casseroles."
  art: {subject: "A half-built office park with a charming banner reading 'JOBS COMING'", place_time: "Industrial lot, late afternoon", visual_contrast: "optimistic banner against rusting rebar"}
  alt_text: "A half-built office complex under a worn banner promising jobs."
- id: cedar.stoned.hope
  core: E-cedar.hope
  title: "Redwood Cloud"
  paragraph: "You drifted into the idea and Cedar made it a spreadsheet. An energy-aware computing co-op now supports remote work and forest care, with a public cap on power and water. His parents use it to video-call the cousins and complain about the lag."
  art: {subject: "A small server shed with solar panels in a redwood clearing", place_time: "Clearing, afternoon", visual_contrast: "modest data shed against soaring trunks"}
  alt_text: "A small solar-powered server shed in a clearing ringed by redwoods."
- id: cedar.stoned.dark
  core: E-cedar.dark
  title: "Server Clearing"
  paragraph: "The servers arrived with promises about power that only worked on paper. The clearing is permanent and the local jobs were temporary. Cedar's parents argue about whether to move and decide, again, not to."
  art: {subject: "A fenced server campus in a clear-cut with a bare local hiring board", place_time: "Industrial clearing, harsh light", visual_contrast: "humming server hall against stumps"}
  alt_text: "A fenced server building in a clearing of stumps beside an empty hiring board."
- id: cedar.tripping.hope
  core: E-cedar.hope
  title: "Signal from Home"
  paragraph: "The future whispered, and Cedar made it prove itself. Only corroborated signals made it into policy, and the resulting tools are accountable to the county that uses them. His parents keep a radio on the kitchen windowsill, just in case."
  art: {subject: "A kitchen windowsill radio glowing, a county map on the wall behind", place_time: "Family kitchen, early evening", visual_contrast: "uncanny signal in a warm domestic scene"}
  alt_text: "A radio glows on a kitchen windowsill beside a county map pinned to the wall."
- id: cedar.tripping.dark
  core: E-cedar.dark
  title: "Perfect Prediction Trap"
  paragraph: "The prophecy was wrong, and everything was built on it. A centralised system took control of the county's infrastructure on the strength of a forecast no one could audit. Cedar's parents stay together, which is the only reliable thing left."
  art: {subject: "A central control room with a glowing forecast screen and a skeptical onlooker", place_time: "Control room, late night", visual_contrast: "confident glowing forecast against a blank paper note"}
  alt_text: "A control room with a large glowing forecast screen and one person looking sceptical."
- id: cedar.cocaine.hope
  core: E-cedar.hope
  title: "Hiring Hall, Online"
  paragraph: "Your pace matched Cedar's wiring. A rapid hiring pipeline tied to the broadband co-op put local people into safe trades in months, with training paid on the way in. His father says the speed is suspicious and signs up three nephews."
  art: {subject: "A hiring hall with a monitor showing a local apprenticeship pipeline", place_time: "Union hall, bright morning", visual_contrast: "fast screen interface against a worn wooden hall"}
  alt_text: "A union hall with a monitor displaying apprenticeship listings and workers in hard hats."
- id: cedar.cocaine.dark
  core: E-cedar.dark
  title: "Gig Backbone"
  paragraph: "The network got built fast with contractors who left as quickly as they came. There was no one to maintain it and no way to ask for accountability. Cedar fixes the weak links himself, with his father's tools and a mother's insistence."
  art: {subject: "Cedar on a pole repairing a cable while a contractor van drives away", place_time: "Rural road, dusk", visual_contrast: "lone repairer against departing branded van"}
  alt_text: "A young man works on a utility pole as a contractor van drives off down the road."
- id: cedar.meth.hope
  core: E-cedar.hope
  title: "Listening Station"
  paragraph: "The signal that never slept turned out to be a public service waiting to be built. Corroborated by many ears, the radio network now supports emergency calls and trusted forecasts. Cedar's mother sets the schedule so nobody listens alone."
  art: {subject: "A community radio shack with volunteers on shifts and a posted schedule", place_time: "Radio shack, night", visual_contrast: "warm shared shifts against an endless night frequency"}
  alt_text: "A small radio shack at night with volunteers, a thermos and a posted shift schedule."
- id: cedar.meth.dark
  core: E-cedar.dark
  title: "Open Channel, Closed Door"
  paragraph: "The relay was open to everyone and owned by one party. It carried every message through a system with no oversight, and some messages stopped arriving. Cedar's parents still hold hands at the dinner table, and neither takes the call."
  art: {subject: "A relay tower with a locked door and a stream of tiny message lights", place_time: "Hilltop at night", visual_contrast: "open stream of lights against a locked gate"}
  alt_text: "A relay tower on a hill with a locked door at its base and many faint lights above."
- id: cedar.mdma.hope
  core: E-cedar.hope
  title: "First Co-op Meeting"
  paragraph: "The festival bond turned into the first accountable co-op meeting, held in the loading dock of a lumber yard. Everyone signed in and everyone stayed to the end. Cedar's parents disagree about the creek crossing, loudly and happily, and the minutes record both."
  art: {subject: "A co-op meeting in a lumber yard loading dock, folding chairs and a sign-in sheet", place_time: "Loading dock, early evening", visual_contrast: "rustic setting against careful public minutes"}
  alt_text: "People on folding chairs in a lumber yard loading dock sign a sheet during a meeting."
- id: cedar.mdma.dark
  core: E-cedar.dark
  title: "Friendly Terms"
  paragraph: "The developer was warm and the terms were friendly until they were not. Ownership of the network buried itself in an appendix. Cedar's parents read all of it twice, aloud, at the kitchen table, and it was too late."
  art: {subject: "A smiling developer handing over a thick contract at a friendly handshake", place_time: "Town hall steps, bright", visual_contrast: "warm smile against dense appendix pages"}
  alt_text: "A smiling man hands a thick contract to a young man on the steps of a town hall."
