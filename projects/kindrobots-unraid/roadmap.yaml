    This establishes a healthy steady-state baseline with substantial connection headroom. Recommended operational thresholds: warn if hostgroup 10 ConnUsed sustains >=28/40 (70%) or MaxConnUsed reaches >=30 between restarts; critical if ConnUsed sustains >=36/40 (90%), any ConnERR/ConnPool_get_conn_failure begins increasing, or monitor connect/ping errors appear. Treat backend latency sustained above ~5ms as an investigation signal relative to this ~0.1ms local baseline rather than tuning from isolated query max-times. The 8 wrong-password/access- denied counters are authentication noise rather than pool-health failures; track only if they continue increasing unexpectedly.
