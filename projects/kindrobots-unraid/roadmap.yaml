# Kind Robots Unraid — curated self-hosted app catalog

project: kindrobots-unraid
kind: infrastructure

notes_from_silas: |
  Build a polished Unraid catalog for the Kind Robots ecosystem. Each service should
  eventually have a tested Unraid template and, when appropriate, a Community
  Applications listing. Prefer official upstream images and keep secrets out of source.
  Design for today's home deployment without blocking a future viral-scale architecture.

