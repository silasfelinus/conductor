    depends_on: t-003
    soft_gate: true
    note: >
      FOR SILAS: after normal production traffic has accumulated, capture
      stats_mysql_connection_pool plus frontend connection and query statistics from the
      ProxySQL admin interface. Record ConnUsed, ConnFree, ConnOK, ConnERR, Queries,
      latency, and failure behavior; then define alert and capacity thresholds. This is a
      soft gate because Alexandria's ProxySQL admin interface is intentionally available
      only through local docker exec and is not reachable by the Worker sandbox.

