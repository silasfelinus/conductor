  note: |-
    FOR SILAS: after normal production traffic has accumulated, capture stats_mysql_connection_pool plus frontend connection and query statistics from the ProxySQL admin interface. Record ConnUsed, ConnFree, ConnOK, ConnERR, Queries, latency, and failure behavior; then define alert and capacity thresholds. This is a soft gate because Alexandria's ProxySQL admin interface is intentionally available only through local docker exec and is not reachable by the Worker sandbox.


    SENT BACK by silasfelinus via Kind Robots For You. You haven't given me information on this thread to do the work so I do not know how to get it.

    Reconciliation (conductor scheduled sweep, 2026-08-10T11:47Z): claim from session
    2026-08-10T092116Z-kindrobots-unraid-t012-q6n4 had gone stale (claimed 09:21Z, past
    the 90-minute CLAIM_TTL_MINUTES with no further progress -- the claiming session
    ended after the "SENT BACK" note above without releasing it). No agent sandbox can
    do this work regardless of TTL: the ProxySQL admin interface genuinely requires
    local docker exec access. Corrected status from stale `claimed` to `needs-human`
    (soft) to reflect that reality accurately -- this was already effectively a soft
    gate per this note's own first paragraph, just not reflected in `status`.

    Silas supplied a fresh Alexandria ProxySQL admin snapshot after normal production traffic. Hostgroup 10 (mariadb-kindrobots2:3306) is ONLINE at 3 ConnUsed / 4 ConnFree, MaxConnUsed 18 against the configured 40-connection backend cap, 157763 queries, ConnERR 0, and measured backend latency 92us. Hostgroup 30 is also ONLINE with ConnERR 0. Global stats show 0 active transactions at capture, 0 server connections aborted, 0 delayed server connections, 0 ConnPool_get_conn failures, 0 killed backend connections/queries, and only 4 slow queries across 338077 Questions. The monitor reports 19233 successful / 0 failed connect checks and 19568 successful / 0 failed ping checks; the latest 20 connect checks are all successful (~350-533us) and latest 20 pings are all successful (~66-170us).
    This establishes a healthy steady-state baseline with substantial connection headroom. Recommended operational thresholds: warn if hostgroup 10 ConnUsed sustains >=28/40 (70%) or MaxConnUsed reaches >=30 between restarts; critical if ConnUsed sustains >=36/40 (90%), any ConnERR/ConnPool_get_conn_failure begins increasing, or monitor connect/ping errors appear. Treat backend latency sustained above ~5ms as an investigation signal relative to this ~0.1ms local baseline rather than tuning from isolated query max-times. The 8 wrong-password/access- denied counters are authentication noise rather than pool-health failures; track only if they continue increasing unexpectedly.
    Human action complete. No ProxySQL capacity change is warranted from this snapshot.
