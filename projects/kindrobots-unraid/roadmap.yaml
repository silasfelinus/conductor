  - id: t-003
    milestone: m2
    title: Tune ProxySQL and switch Kind Robots database traffic
    status: done
    owner: reviewer
    updated: "2026-07-14T03:20:00Z"
    passes: 0
    stakes: high
    depends_on: t-002
    gate_human: true
    approved_by_human: true
    note: >
      Completed the production cutover. ProxySQL uses backend hostgroup 10 with
      mariadb-kindrobots2:3306, a 40-connection backend cap, the Kind Robots application
      user and schema, monitoring, and verified frontend TLS. The certificate now
      identifies acrocatranch.com as well as the local endpoints. Vercel strict hostname
      verification passed, Prisma checked all 43 migrations with none pending, the final
      clean production deployment reached READY, the homepage returned HTTP 200, and a
      database-backed /api/dreams request returned HTTP 200 with live records. Kind Robots
      retains a two-connection application pool limit per Vercel runtime instance.

