# Cthulhuquarium book cards for the 44 species redesigned on 2026-11-05 (conductor cthulhuquarium/t-110).
# Their swimming sprites were redrawn then (t-099) and their card art_prompt subjects changed to match, but the
# card plates were never re-rendered, so the book, the creatures room and the reveal showed the old concept
# (several not even creatures: a jar, frying pans, a keyhole). Same Krea 2 Classic engine and each species' own
# book-plate medium (fish/<slug>.yaml `plate`), one lane per medium so each prompt holds only its own subject.
# Delivered to kind_robots by scripts/deliver_cthulhuquarium_cards.py. Submitted with Silas's admin token. Private.
round: cthulhuquarium-redesigned-cards-1
project_slug: cthulhuquarium
designer: Cthulhuquarium book cards (t-110)
is_public: false
is_mature: false
cast_loras: false
auto_submit: false
priority: 700
lanes:
- key: gosse-1
  label: Krea 2, gosse plate
  engine: krea2
  prompt: prose
  suffix: hand- coloured lithograph plate from an 1850s natural history book, fine engraved line under flat hand-laid
    watercolour washes, Prussian blue and madder and gamboge, visible plate mark, foxed paper, the wash running
    slightly outside the line, the creature alone on the sheet, a wide plain margin of foxed paper beneath it
