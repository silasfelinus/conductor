- key: scraperboard-1
  label: Krea 2, scraperboard plate
  engine: krea2
  prompt: prose
  suffix: scraperboard illustration, white line scratched out of solid black ink with a blade, pure black and pure
    white only, every tone built from line density, form built entirely from cut hatching, the creature alone, the
    board around it left solid uncut black
- key: haeckel-1
  label: Krea 2, haeckel plate
  engine: krea2
  prompt: prose
  suffix: ornamental natural history plate, obsessive radial symmetry, the organism arranged as design to fill the
    sheet, fine line and restrained colour, ruled ornamental border, the creature alone inside the ruled border,
    a plain strip of bare paper beneath it
- key: moulage-1
  label: Krea 2, moulage plate
  engine: krea2
  prompt: prose
  suffix: wet specimen preserved in a sealed glass jar of fluid, formalin yellow, colours leached toward parchment,
    the glass refracting the body where it presses against it, a handwritten paper label tied on with string, the
    jar standing alone, the label's brown ink faded to pale looping scribbles
- key: riso-1
  label: Krea 2, riso plate
  engine: krea2
  prompt: prose
  suffix: risograph print in two fluorescent spot inks on cheap absorbent paper, deliberate misregistration, the
    inks overprinting to a third colour where they cross, flat unblended areas, paper showing through, the creature
    alone on the sheet, wide bare margins
- key: blaschka-1
  label: Krea 2, blaschka plate
  engine: krea2
  prompt: prose
  suffix: lampworked glass model on a thin wire mount, transparent hollow body, light passing through the glass
    and pooling where it thickens, colour suspended in the glass itself, museum specimen on a small wooden base,
    faint dust, the glass creature standing alone, a small plain cream paper tag on the wooden base
- key: gyotaku-1
  label: Krea 2, gyotaku plate
  engine: krea2
  prompt: prose
  suffix: gyotaku fish rubbing, sumi ink pressed directly from the body onto fibrous washi paper, flat black, coverage
    uneven, the ink thin and skipping where the body lifted away, fins printing as fine radiating lines, one wet
    painted eye added afterward by hand, the creature alone in the middle of the sheet, the rest of the sheet bare
