  - id: t-039
    milestone: m3
    title: "The finale — the eye at the window, and the last tank that has to exist first"
    status: waiting
    gate_human: true
    approved_by_human: true
    soft_gate: true
    owner: null
    passes: 0
    stakes: reversible
    depends_on: [t-032, t-028, t-017]
    note: >
      SETTING AND ENDING, Silas 2026-08-25, both now written up in full in DESIGN-BRIEF.md
      ("The setting -- you came in out of it" and "The finale -- you are also in an
      aquarium"). Setting: "You are welcomed after stumbling into the aquarium store. Things
      are *oof* outside, but they are welcoming you, and maybe it will be better if you
      distract yourself. After all, everything out is in, or so they tell you..." Ending:
      "finale moment is the realization that you are also in an aquarium... discovered after
      buying the last and largest aquarium, when you get to see a giant eye moving around and
      watching you from a window." THE ONE THING THAT BLOCKS IT: there is no purchasable tank
      in this design. Capacity is `slots_cap`, an abstract integer, and every point of it
      comes from MILESTONES keyed to bestiary breakpoints (economy.yaml
      slots.cap_per_bestiary_breakpoint, milestones bestiary_5/10/15/20). ECONOMY.md states
      the principle explicitly, citing SYSTEMS.md "Two economies, pacing each other": coins
      buy breadth, milestones buy room. So "buying the last and largest aquarium" does not
      merely lack an implementation -- it contradicts a decided rule. That is a call for
      Silas, not something to reinterpret quietly into "unlocking" and hope nobody notices the
      difference. RECOMMENDATION, offered because someone should: keep the rule for the whole
      game and break it exactly once, at the end. Every slot up to the last comes from
      milestones as designed; the final tank is the one thing you buy, it costs more than
      anything else in the game, and it is the only purchase that grants room. That is
      mechanically coherent (one deliberate exception, at the point where the game stops), it
      preserves the pacing rule everywhere it matters, and it is thematically exact -- you
      spend the entire game paying for a bigger enclosure and the reward for the biggest one
      is finding out it is an enclosure. The alternative reading, that the last tank is simply
      the terminal milestone reward, is cleaner mechanically and weaker thematically, because
      "buying" is the part that implicates the player. EITHER WAY THE CURVE MUST TERMINATE. An
      idle game that never stops selling a bigger tank has no final purchase to hang an ending
      on. Today the ladder stops at bestiary_20 (12 slots) only because that was the MVP bar,
      not because it was designed as an end. CRAFT NOTES, so they survive into implementation:
      the eye MOVES AROUND rather than staring -- it drifts past, pauses the way you pause at
      a tank you have already seen today, and moves on. Being stared at is frightening; being
      unremarkable is worse, and it is the note this whole game has been playing. Render it in
      the same vibrant cartoon register as everything else, because a horror-styled eye lets
      the player file it under "spooky bit" and a cheerful one does not give them anywhere to
      put it. The window is not the door -- the door stays closed all game and is never
      opened, because it was never the way out. DO NOT ADD FORESHADOWING. It is already built:
      t-014's browsable public aquariums, described in DESIGN-BRIEF.md from day one as "you
      visit someone's aquarium the way you'd look in someone's window". Every player has spent
      the whole game looking into other people's tanks; the finale is realising the view goes
      both ways. Charlotte and Wilbur do not hint and are not in on it. DEPENDS ON: a terminal
      tank existing (t-032 capacity work / ECONOMY.md), t-028 for the interstitial surface,
      t-017 for a tank renderer that can put a window in it once. None of those need changing
      until this is answered. SETTLED 2026-08-25, and the conflict dissolved rather than being
      excepted. Silas: "I like there being a final tank and what you get is functionally the
      same or minorly larger, but cosmetically it re-evaluates everything." SO ECONOMY.md's
      RULE SURVIVES INTACT. The final tank grants slots_cap +0 or +1, so it does not buy room,
      so "coins buy breadth, milestones buy room" needs no exception. The recommendation in
      this note -- keep the rule all game and break it once at the end -- is superseded by
      something cleaner: there is nothing to break. Capacity growth stays entirely milestone-
      driven exactly as economy.yaml already specifies it. WHAT TO BUILD: one terminal
      purchasable tank, the most expensive item in the game, granting no meaningful capacity.
      It is the only cosmetic anything coins can buy -- backgrounds are milestone rewards and
      everything else coins buy is capability -- which is itself part of why it stands out. It
      is also now safe to gate the ending on: no power spike, no balance implication, nothing
      for t-019 to tune around. "COSMETICALLY RE-EVALUATES EVERYTHING" MEANS RE-RENDER WHAT
      EXISTS, NOT ADD ASSETS. Same fish, same set pieces, same room -- re-lit, re-framed, seen
      from a step further back. Cheaper to build than new content and far stronger, because
      the player is not shown something new, they are shown THEIR OWN TANK, the one they spent
      hours arranging, and understand it differently. Nothing has changed except what it
      means. THE RISK, and it is the only real one: an enormous purchase that does nothing can
      read as a bad shop item rather than a payoff. The entire mitigation is the size of the
      cosmetic moment. If the last tank looks like "a slightly nicer tank" this fails.
      Charlotte still sells it cheerfully and without comment, so the shop copy cannot carry
      it -- the art has to. STATUS: no longer needs-human. The question that gated it is
      answered; what remains is implementation, and it depends on t-032 (a terminal entry in
      the capacity progression), t-028 (the interstitial surface) and t-017 (a tank renderer
      that can put a window in it once). TWO PIECES LANDED 2026-08-25, the ones that were
      unblocked once Silas settled the design. (1) THE TERMINAL PURCHASE EXISTS IN THE
      ECONOMY: data/economy.yaml gains `last_aquarium`, cost 250000, slots_cap_delta 0, effect
      cosmetic_reframe, unlocks_finale true. Zero rather than "a small amount", deliberately,
      so SYSTEMS.md's "coins buy breadth, milestones buy room" has no exception at all; +1 is
      the ceiling Silas named and is a t-019 call rather than a design one. reframe_scope is
      existing_tank_contents, which is the note above made machine-readable: re-render what
      the player already owns, do not author new content. (2) TWO ART PLATES QUEUED. set-last-
      aquarium is a trade-catalogue engraving like every other purchasable, because Charlotte
      sells it cheerfully and without comment and the shop plate must not wink. screen-finale
      is deliberately the SAME albumen interior stock as screen-shop and screen-bestiary --
      that is the whole trick, the medium does not change and the vantage does. A player who
      has spent the game looking at rooms photographed exactly like this one (and, since
      t-014, looking into other people's tanks "the way you'd look in someone's window") must
      not be tipped off by a change of register. The prompt says the eye is "mid-drift and
      incurious" because a fixed staring eye is the wrong image and the easy one, and the pane
      is across the foreground rather than being a door. Art queue is now 174 entries. STILL
      BLOCKED, unchanged: the interstitial surface (t-028) and a tank renderer that can put a
      window in it once (t-017). Nothing about those needs a decision, only building. NOTICED
      WHILE IN HERE AND DELIBERATELY NOT ACTED ON: the milestone ladder stops at bestiary_20
      while the bestiary is now 151 species, so 131 of them award nothing. That is a real gap
      the t-037 expansion created, but extending the ladder is a BALANCE change -- twenty more
      breakpoints at +2 would put slots_cap past 50 and make the packing problem trivial -- so
      it belongs to t-019 with play data, not to a session tidying up at night. Recorded
      there.

      RECLASSIFIED 2026-08-25 (conductor sweep): this task was showing status: ready with
      no formal depends_on field, so select_role.py/next_ready_task.py surfaced it as the
      top pickable task even though t-017 and t-028 are both still status: waiting
      themselves (t-032 is done). Set depends_on: [t-032, t-028, t-017] and status:
      waiting so it stops surfacing as workable until its actual prerequisites land;
      resolve_deps.py will flip it back to ready automatically once t-017 and t-028 both
      reach status: done. No design content changed.
  - id: t-040
    milestone: m1
    title: "Eight plate lineages, and no negations anywhere in an art prompt"
    status: done
    gate_human: false
    approved_by_human: null
    owner: null
    passes: 0
    stakes: reversible
    note: 'Silas, 2026-08-25: "There is a lot of pushback about ai generated text and art these days,
      mostly involving tells. I want us to do our best to avoid that critique, not because I intend to
      hide our development, I believe 100% in transparency, but because I want this to feel free and
      unique... our art needs to have some touches that are creative...and by that, I mean pulling from
      inspirations that are unconventional and will produce art that is new and unique." Then: "my thought
      is we need to pull inspiration from styles that arent expected." Then: "ok, do what you think best."
      THE DIAGNOSIS, and the biggest tell was ours rather than the models. All 74 prompts ended in the
      SAME 40-word style block. Whatever the creature, the surface was identical -- and uniformity across
      a set is exactly what reads as machine-made. No amount of rewriting that one block fixes a problem
      caused by there being one block. THE FIX: eight named plate lineages with real histories, recorded
      per species in a new `plate` field, so the medium is a property of the creature like its tier rather
      than something chosen at render time. gosse (hand-coloured lithograph, 1850s), blaschka (lampworked
      glass model on a wire mount), gyotaku (direct ink rubbing pressed from the animal), trade-card (chromolithograph
      cigarette card c.1900), scraperboard (white line scratched out of black), haeckel (ornamental plate,
      radial symmetry), moulage (wet specimen in a jar), riso (two or three spot inks on cheap paper).
      Palette follows the plate, not the prompt -- which is what lets the bestiary cohere while looking
      varied. The framing that makes eight lineages one artifact rather than eight: the Ichthyonomicon
      is a SCRAPBOOK, not a catalogue. Somebody collected these plates over decades from whatever source
      would part with one. All of it in ART-DIRECTION.md. The 15 non-fish assets got four more lineages
      in Conductor (#2849): backgrounds take the plainest one on purpose since they sit behind 74 foregrounds,
      set pieces are Victorian trade-catalogue engravings because they are things you buy, and Charlotte
      and Wilbur are hand-tinted cartes-de-visite -- the only photographic lineage in the project, because
      they are the only people in it. THE SECOND HALF WAS WORSE AND NEARLY GOT MISSED. Every prompt also
      ended "NOT photorealistic, not a photograph". Krea 2 has no instruction-following layer and its negative
      prompt is inert at cfg 1, so that clause was a POSITIVE prompt containing the word photograph -- a
      fair explanation for the first render batch coming back as competent nature photography. Worse, the
      art queues own assertion REQUIRED that clause on every prompt, so the guard was enforcing the bug.
      Reversing it was not enough: the first reversal only banned negations attached to a STYLE word, and
      27 files sailed through carrying "no face at all", "no eyes anywhere", "no midtones and no wash",
      and "coverage uneven where the body did not touch". `no face` is how you commission a face. The narrow
      rule needed a new noun bolted on every time somebody found a new way to say no; the rule that holds
      is that there is nothing worth saying in one of these prompts with a negation, because every one
      of those had a positive form that was also a better prompt. "a smooth blank head, unbroken skin where
      a face would be" tells the model where to put paint. All 27 rewritten, before/after table in ART-DIRECTION.md
      rule 2. ENFORCED, not just documented: scripts/validate_fish.py and Conductors build_cthulhuquarium_art_queue.py
      both reject any negation outright, and the guard was confirmed to fire by injecting one rather than
      assumed to. Conductors ART-PROMPTS.md gained this as its third Krea 2 rule, including the specific
      trap that caused it -- that files own "Hard rules for every generation: no readable text, no logos,
      no watermarks" line is addressed to ChatGPT, which follows instructions, and copying it into a Krea
      2 prompt orders lettering. That is exactly how "no lettering" ended up on all 74 fish prompts. RESULT:
      89 queue entries, 89 unique prompts, zero negations, every one naming a medium. NOTHING HERE IS ABOUT
      DISGUISE -- the development is public and the art is generated, and both stay true. It is about using
      references narrow enough to produce something specific. The critique that actually lands is not "a
      machine made it", it is "it looks like everything else".

      '
  - id: t-041
    milestone: m3
    title: "Hidden egg purchases — rarity, and the size rule that keeps them housable"
    status: waiting
    gate_human: true
    approved_by_human: null
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-029
    note: >
      Silas, 2026-08-25: "a hidden egg purchase in the store, with different rarity. The
      challenge is that it should hatch something that fits in the aquarium, so it cannot
      hatch something beyond its own size." THE CONSTRAINT IS THE DESIGN, and it is the good
      part. Capacity in this game is WEIGHED rather than counted (SCHEMA.md, 2026-08-24), so a
      random reward can hand the player a creature they have no room for -- the failure mode
      every mystery-box mechanic in a capacity-limited game hits. Silas's own sentence carries
      the fix. RECOMMENDED MECHANISM: the egg occupies its own size in the tank from the
      moment it is bought, and hatches something of size <= that. Capacity is then checked
      ONCE, at purchase, by the ordinary rule, with no new capacity logic anywhere; hatching
      can never overflow, because the space was reserved before the creature existed; the
      player sees the cost before committing, which keeps it a decision rather than a gamble
      with a hidden bill; and a hatchling smaller than its egg hands back space, which is a
      free pleasant surprise. This also subsumes the looser reading of the sentence -- if the
      egg fit, the fish fits. TWO DIALS, NOT ONE. Egg rarity should govern the RARITY of what
      hatches and egg size the SIZE, kept independent. Collapsing them makes a MYTHIC egg
      necessarily enormous, which the bible contradicts: The Conservatory is LEGENDARY at size
      10 while The Reconciliation is MYTHIC and small. Two dials give a small expensive high-
      rarity egg and a big cheap ordinary one, which is a more interesting shop than one dial.
      EGGS HATCH EXISTING SPECIES. The bible closed at 151 under t-037 and SCHEMA.md now says
      the target is met and is NOT a cap -- going past it needs a reason rather than momentum.
      An egg system that mints new species would blow through 151 by accident. The egg is an
      alternate acquisition route into the existing 151, never a species generator. THE
      BLOCKING FINDING, measured against the finished bible rather than assumed. The obvious
      filter is "species of rarity R, size <= N, unlock_cost > 0", where the last clause keeps
      an egg from handing out an evolution terminus and devaluing every chain the bestiary is
      built on. Only 56 of the 151 species are purchasable at all, and the pools that filter
      leaves are: COMMON 29, UNCOMMON 12, RARE 3, EPIC 10, LEGENDARY 2, MYTHIC 0. A MYTHIC egg
      is IMPOSSIBLE and a RARE egg has a pool of three. The system would be broken at exactly
      the tiers that make it worth having, so "no evolution termini" and "eggs have
      interesting rarities" are in direct conflict and one of them has to give. THE
      RECOMMENDATION, and it is a better feature than the thing it replaces: make the rarity
      dial describe the LINE the egg seeds rather than the hatchling. A MYTHIC egg hatches a
      plain common fish that is the base of a line ending in a MYTHIC. The egg is a PROMISE
      rather than a prize, which is precisely Silas's magikarp-to-gyarados framing and
      precisely why this bible spent batch 3 building 55 lines instead of 151 standalones. It
      resolves the conflict completely -- every line base is purchasable and small, so every
      pool is healthy and every hatchling trivially fits its egg. It also makes the size rule
      do more work: the hatchling fits today, and keeping room for what it BECOMES is the
      player's problem, exactly as it already is for every chain in the game. DECISIONS FOR
      SILAS: (1) rarity-of-hatchling or rarity-of-line, per above -- this one gates
      implementation. (2) What "hidden" means. Three different features hide in the phrase: a
      mystery box whose contents are unknown but which is plainly on sale; a purchase option
      that is itself concealed until something is discovered; or both. The phrasing leans to
      the second. (3) Whether the egg is consumed on hatching. SCHEMA.md's "nothing is ever
      taken from the player" is a game rule, and an egg carried for a while will feel
      collected even though it is an item rather than a species. ONE THING THAT MUST NOT
      HAPPEN: an egg must never be eaten. `diet_role: predator` exists on 57 species and live
      food is already a mechanic, so a predator treating an egg as feed is the most obvious
      emergent bug this feature can produce, and it violates the no-degradation rule outright.
      DEPENDS ON t-029, which settles the SPECIES versus INDIVIDUAL distinction -- an egg
      hatches an individual, so the schema question lands there first. Overlaps t-030 (shop
      stock and selling back) and t-016 (rare random experiences), and its pricing belongs to
      t-019. DECISION 1 SETTLED by Silas, 2026-08-25: "ok with your idea of rarity tied to
      appearance." Rarity describes the LINE the egg seeds, and it is READ OFF THE EGG rather
      than off what hatches. That second half closes the one real hole in the recommendation,
      which Silas spotted and this note had missed: under rarity-of-line every egg hatches a
      plain common fish, so the hatchling tells the player nothing. Buy a MYTHIC egg, get a
      Penny Bream, and there is no way to know what you have until the line has run for hours.
      Putting the grade on the shell fixes it outright. THE MEDIUM ALREADY DECIDES HOW. Eggs
      are things you BUY, so under ART-DIRECTION.md they take the set-piece lineage --
      Victorian trade-catalogue engraving, the object alone on bare white paper, drawn to be
      sold from a supplier's list. That medium's entire vocabulary is LINE DENSITY AND
      ORNAMENT, which is exactly the right dial: COMMON is a plain smooth ovoid with a few
      contour lines and mostly bare shell; UNCOMMON gains simple banding; RARE is finely
      speckled with a ruled seam pole to pole; EPIC is worked all over with ornamental whorls;
      LEGENDARY is elaborate scrollwork with a raised collar; MYTHIC is engraved so densely
      the shell reads as solid black with the form picked out in reserved white line. WHY THAT
      PARTICULAR DIAL, rather than colour or size: it is a single monotonic ramp, so a row of
      eggs in the shop sorts itself at a glance; it survives 256px, which SCHEMA.md requires
      of every silhouette; it needs no colour, so it works in the one lineage eggs should be
      drawn in; and crucially it is TEXTURE rather than SCALE, which keeps rarity and size the
      independent dials this task already requires. A small MYTHIC egg and a large COMMON egg
      are both instantly legible, and that pair is the most interesting thing the shop can
      offer. IT ALSO NARROWS DECISION 2. If the grade is on the shell, the mystery is WHICH
      SPECIES rather than HOW GOOD -- you know what you are paying for and you do not know
      what you are getting. That is a decision rather than a gamble, which is the same job the
      size rule is already doing, and it is the better mystery. Whether the egg OPTION is
      itself concealed until discovered is still open and still Silas's call. ART IS QUEUED
      AHEAD OF THE MECHANIC ON PURPOSE, and safely: the six egg plates depend only on the
      appearance ramp above, which holds however decisions 2 and 3 land, so they cannot be
      wasted by a later change to hatching or hiding. They are in projects/art-generate.yaml
      as egg-common through egg-mythic. DECISION 3 SETTLED by Silas, 2026-08-25: "an egg
      should be consumed. it isn't technically against my rules, as it evolves into another
      Monster of that size." The egg IS consumed on hatching, and it is the ONLY base form in
      the game that is -- SCHEMA.md's evolution section says flatly that the base form is not
      consumed, so the exception is now written in there rather than left as an apparent
      violation a future agent would be right to revert. TWO REASONS IT IS NOT A LOSS, the
      first of them Silas's own. SIZE IS CONSERVED: N tank units of egg become at most N units
      of Monster, so the player's holdings transform rather than diminish, which is the same
      conservation the size rule at the top of this task already relies on. And THE RECORD
      SURVIVES: what the player collects is the entry, not the object, which is exactly the
      job t-031 gives the Ichthyonomicon -- "the record that makes everything else safe" turns
      out to be load-bearing rather than a decorative subtitle, and this is the first mechanic
      that actually leans on it. TWO CONSEQUENCES THAT BIND THE IMPLEMENTATION. (1) THE HATCH
      MUST BE SHOWN, NEVER SILENT. The difference between "my egg became a fish" and "my egg
      vanished" is entirely presentation, and only the first is the no-degradation rule being
      honoured rather than merely argued. A silent swap satisfies the letter of Silas's
      reasoning and breaks its spirit completely. (2) AN EGG IS AN ITEM, NOT A BESTIARY
      SPECIES. Silas's phrasing -- "it evolves into another Monster" -- invites modelling the
      egg as a Monster row carrying evolves_to, and that CANNOT work: evolves_to is single-
      valued and validated (target must exist, be a higher tier, and declare the reciprocal
      evolves_from) while an egg resolves to one of a pool of dozens. Modelling eggs as
      species would also take the bestiary from 151 to 157, and 151 was deliberate. Eggs
      follow the set-piece precedent instead: a thing you buy that is not a creature, already
      sharing the set pieces' trade-catalogue art lineage. Flagged rather than asked, because
      "another Monster" is as likely loose phrasing as a modelling instruction and the no-loss
      argument holds identically either way -- but if Silas did mean eggs to be bestiary
      species, this is the paragraph to overturn, and the 151 count is what it costs. DECISION
      2 IS NOW THE ONLY ONE OPEN: whether the egg OPTION is itself concealed until something
      is discovered. Everything else about eggs is settled.
  - id: t-042
    milestone: m2
    title: "Monster is missing four bible fields — additive migration, DO NOT MERGE until kind-robots/t-072 is fixed or it is applied by hand"
    status: done
    gate_human: false
    approved_by_human: null
    owner: worker
    passes: 0
    stakes: reversible
    depends_on: t-008
    note: >-
      READ THIS FIRST. Every item below is a Prisma migration, and kind-robots/t-072 means nothing applies pending migrations on deploy -- so merging this ships a client that selects columns the database does not have. That is precisely the shape of kind- robots/t-071, which 500'd every prisma.character.findUnique() in production for days. The additive-only nature of these changes does NOT protect against it: a nullable column the client asks for and the database lacks is just as fatal as a required one. Implement freely; do not merge until t-072 is fixed or the migration has been applied by hand and confirmed. The repo's own CI guard (#2081) only checks that a schema diff HAS a migration -- it cannot check that the migration was applied, which is the half that matters here. Found 2026-08-25 while writing the t-008 seed script -- i.e. by actually mapping all 151 species onto the columns rather than by reading the model and assuming. FOUR BIBLE FIELDS HAVE NOWHERE TO LAND, and one column is documented as holding something it should not. (1) EvolutionKind IS MISSING "SECRET". The bible allows growth | breeding | secret and the enum has only GROWTH and BREEDING. Exactly one species uses it today -- the- proprietor -> the-concern -- and mapping secret onto BREEDING would be a lie, since SCHEMA.md defines breeding as requiring two parents and secret as a hidden individual- stat roll. They are different mechanics and t-029 will implement them differently. The seed script therefore writes the evolvesToId edge and leaves evolutionKind null with a loud warning; adding the enum value and re-running fills it in for free, because the seed is idempotent. This is the only one of the four that currently loses information a player would notice. (2) Monster.behavior IS DOCUMENTED AS THE WRONG AXIS. Its doc comment reads "free-form ecological role tag (the fish bible's diet_role/school_role ... predator/prey, school/anchor/solitary)". Those school/anchor/solitary values are the PRE-MERGE school_role vocabulary, which SCHEMA.md renamed to shoaling | solitary | territorial precisely because it collided with behavior's own school and anchor values and invited exactly this confusion. The bible's `behavior` is the MOVEMENT MODE the renderer reads -- drift, dart, lurk, school, anchor, surface, hover, tumble, cling -- and the column name matches it exactly, so t-008 seeds movement mode there and the doc comment needs correcting. (3) diet_role AND school_role HAVE NO COLUMNS AT ALL. 151 species carry both; they feed t-025's rivalry rules and t-027's feeding. Two nullable VarChar columns, dietRole and schoolRole, named for the bible fields so the next person cannot repeat mistake (2). (4) THE BIBLE'S OWN `tier` (1-5, "roughly how deep into the game it appears") HAS NO COLUMN, because Monster.tier is taken by the Rarity enum. It is real design data -- 32/41/36/25/17 across the five values -- and it wants a name that cannot be confused with rarity. `depth` or `stage` rather than a second `tier`. Lowest priority of the four; nothing reads it yet. DELIBERATELY NOT FILED HERE: `plate` (the art lineage) and `rivals`. Plate belongs to the bible and the art queue, which both already read it, and nothing in the game needs it at runtime. Rivals is six species and wants a join table rather than a column, which is t-030's call when it builds rivalry. Adding columns nothing reads is how a schema rots. WHY THIS IS ITS OWN TASK AND NOT PART OF t-008. Every item here is a MIGRATION, and this repo is currently living with kind- robots/t-072 -- nothing applies pending Prisma migrations on deploy, so a merged migration sits unapplied and the schema silently diverges from the client. kind- robots/t-071 was a production outage caused by exactly that shape. The seed script works correctly against the schema as it stands today and loses only the one `secret` kind, so the safe split was to land the seed and gate the migration. All four changes are ADDITIVE -- new nullable columns and a new enum value, no drops, no renames -- so the migration itself is the low-risk kind; it is the APPLYING that needs a human at the keyboard. MISTAKE AND RECOVERY, 2026-08-25: a scheduled session claimed this task, implemented all four field changes plus the corrected doc comment (kind_robots PR #2103), and merged it -- without re-reading this task's live note first, so it missed the DO NOT MERGE warning above (added to this exact note between the claim and the merge). kind-robots/t-072 was, and still is, genuinely unresolved (migrate-on-deploy is not wired in; that is Silas's call), so #2103 briefly left main with a schema.prisma that selects columns and an enum value the production database does not have. No outage resulted -- there is no auto-deploy-on-merge, so nothing redeployed in the window -- but the same session caught it immediately after merging (re-read this note as part of closing the task out) and reverted #2103 in full via kind_robots PR #2104, restoring schema.prisma, the migration file, seed_bestiary.ts's mapping, and the generated Prisma client to their pre-#2103 state. The complete, correct implementation still exists at kind_robots commit cc814b3 (the tip of the now-reverted PR #2103's branch, claude/eager-bohr-ctff3a) -- whoever picks this back up once t-072 is resolved (or the migration has been applied to production by hand and confirmed) can re-apply it directly (e.g. `git revert` the revert, or cherry-pick cc814b3) rather than re-implementing from scratch. Releasing the claim; this goes back to `ready` rather than `waiting` because depends_on here is scoped to this roadmap file and cannot formally reference kind-robots/t-072 across projects (resolve_deps.py resolves same-file task ids only) -- the DO NOT MERGE prose warning is the actual gate until t-072 closes.


      Reclaim t-042 after Silas accepted the documented manual migrate-before-Force-Update deployment policy for Alexandria. Replay the preserved additive Monster schema changes from kind_robots PR #2103 on current main, keep the migration and client in the same GHCR image, and do not call deployment ready until exact-head CI and image publication pass.

      Reapply the preserved one-commit t-042 implementation from kind_robots #2103 on a branch rooted at cc814b3, allowing GitHub's three-way merge to preserve all later main changes. The delta is additive Monster schema/migration plus bestiary seed/verifier wiring, with no Character changes. Production is not ready until the PR is green, merged, and its exact merge SHA is published to GHCR.

      RECONCILED (conductor scheduled Agent run, 2026-08-26): the split expand-then-client
      rollout this task documented is fully merged. kind_robots#2124 (additive migration:
      Monster.depth/dietRole/schoolRole + EvolutionKind.SECRET) merged 2026-08-26T05:24Z and
      its own PR body confirms the migration was applied to Alexandria and Force Updated
      before this half proceeded. kind_robots#2126 (client wiring: schema.prisma fields,
      seed_bestiary.ts mapping, verifier updates, regenerated Prisma client) merged
      2026-08-26T07:35Z -- exact-head CI green, reviewed under marker REVIEWING:
      2026-08-26T063015Z-chatgpt-cthulhu-t042-client-restore. Both changes are additive-only
      (new nullable columns/enum value), so there is no client-before-column outage risk
      regardless of exactly when Alexandria picks up this merge SHA via its next Force Update
      -- unlike the original #2103 mistake, order no longer matters for safety, only for
      freshness. Closing as done per this repo convention that a software task completes at
      merge, not at next manual Force Update (see cthulhuquarium/t-007, t-009 precedent). No
      further action needed from this task; Alexandria will pick up the client half on its
      next routine Force Update.

