  - id: t-033
    milestone: m1
    title: "Render box cannot load two of three text encoders — art generation is blocked at ComfyUI, not at the queue"
    status: needs-human
    gate_human: false
    soft_gate: true
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Found 2026-08-24 while doing t-005's end-to-end proof, and worth separating from
      t-005 because the conclusion is not about this project: THE CONDUCTOR SIDE OF THE
      ART PIPELINE WORKS. Submitting through `POST /api/art/queue` with KR_API_TOKEN
      authenticated, queued, was picked up by the home-box relay, and polled correctly.
      Two of three engines then failed inside ComfyUI on model files. MEASURED, one entry
      each, same prompt and size (1024x1024): - `krea2` -- job 9179 queued, then FAILED:
      "node 3 (CLIPTextEncode): hostbuf_file_reader_read failed". The model is present
      enough to be selected but cannot be read. Reads like a corrupted or partially-
      downloaded file, or a memory-mapping failure on the box. THIS IS THE DEFAULT ENGINE
      for most of this repo's art, so this is the one that matters most. - `flux2-klein`
      -- job 9181 queued, then FAILED fast and informatively: "ComfyUI has no matching
      file for: CLIPLoader.clip_name='flux2_klein_text_encoder_fp8_scaled .safetensors'.
      Not in the live model list at http://127.0.0.1:8188". Simply not installed. - `flux`
      (schnell variant) -- ran long rather than failing fast, which is the signature of an
      actual render. Result not yet confirmed; re-run to establish whether it is the
      working fallback. FOR SILAS: this needs the home box, which no agent can reach.
      Concretely: re-download or verify the krea2 text encoder (a checksum would confirm
      the corruption hypothesis), and install
      `flux2_klein_text_encoder_fp8_scaled.safetensors` or accept that engine as
      unavailable. Until then, agents should queue art on whichever engine is confirmed
      working rather than the krea2 default. Soft gate: it blocks the ART for this
      project, not the project. Every other ready task proceeds, and the queue entries can
      be written now and drained once the box is healthy. Filed separately from t-005 so
      t-005 can still close on the pipeline recipe it was actually asked for. CORRECTION
      2026-08-24, and it changes the leading hypothesis: Silas reports the models do NOT
      live on the render box. Alexandria hosts them at /mnt/user/pc/ai/models/..., and the
      ComfyUI box reaches them over a network mount at Z:/ai/models/.... That reframes
      both failures as most likely ONE root cause -- the mount -- rather than two damaged
      files. Why the mount fits the evidence better than corruption: (a)
      `hostbuf_file_reader_read failed` is a host-buffer READ failure, which is what a
      short or failed read over SMB looks like, and large safetensors are typically
      memory-mapped, which is exactly the access pattern that is unreliable over a network
      share; (b) the one engine that WORKED, flux/schnell, uses a quantised GGUF
      (flux1-schnell-Q8_0.gguf) -- smaller, and GGUF loaders commonly stream sequentially
      rather than mmap the whole tensor, so it is the case least likely to trip a flaky
      mount; (c) flux2-klein's "no matching file... not in the live model list" may not
      mean the file is absent at all -- if the share fails to enumerate, ComfyUI's scan
      simply does not see it, which is indistinguishable from missing; and (d) five
      unrelated jobs (9177, 9178, 9180, 9182, 9183) failed in the same window, which
      points at shared infrastructure rather than per-model damage. Also relevant and
      Unraid-specific: /mnt/user/ is the FUSE (shfs) layer, which is a well-known source
      of trouble for large sequential reads. Reading from the underlying device path
      instead (/mnt/cache/... or /mnt/diskN/...) bypasses shfs entirely and is both faster
      and more reliable -- worth testing as a fix, not just a diagnostic. THE DECISIVE
      TEST is a full-read checksum of the same file from both sides: hash it locally on
      Alexandria, then hash it across Z: from the ComfyUI box. Local passes and remote
      fails means the mount. Both fail means the file really is damaged. Do that before
      re-downloading anything -- re-downloading a file that is fine, over a mount that is
      not, will appear to fail the same way and waste the trip. RESOLVED TO TWO SEPARATE
      CAUSES, 2026-08-24, after Silas listed the actual model store. The single-mount
      hypothesis in the correction above is half wrong and is superseded here. Exact
      filenames the workflows request, from consume_art_queue_core.py: krea2 -- unet
      Krea-2-Turbo-Q5_K_S.gguf, clip qwen3vl_4b_fp8_scaled.safetensors, vae
      qwen_image_vae.safetensors. flux2-klein -- unet flux-2-klein-4b-Q4_K_M.gguf, clip
      flux2_klein_text_encoder_fp8_scaled.safetensors, vae flux2-vae.safetensors. (1)
      FLUX2-KLEIN IS A GENUINELY MISSING FILE, not a mount or enumeration problem. Silas's
      listing of /mnt/user/pc/ai/models/text_encoders/ has no
      flux2_klein_text_encoder_fp8_scaled.safetensors at all. What IS present is
      mistral_3_small_flux2_bf16.safetensors (35.5 GB), which is the Flux 2 text encoder
      in bf16 rather than the fp8_scaled build the constant names. So either the fp8
      variant was never downloaded, or FLUX2_KLEIN_CLIP should point at the bf16 file that
      exists. Decide which -- the bf16 is 35.5 GB and this box is described as 12 GB VRAM,
      so pointing at it may simply trade one failure for an OOM. Downloading the
      fp8_scaled build is likely the right answer. (2) KREA2 IS A READ FAILURE ON A FILE
      THAT EXISTS. qwen3vl_4b_fp8_scaled.safetensors is present at 5,242,467,968 bytes,
      and its size is not obviously truncated (its bf16 sibling is 8,875,719,384, and
      fp8_scaled legitimately keeps some layers at higher precision, so the ratio is
      plausible). Present but unreadable is exactly the shape of a storage-layer problem
      rather than a bad download. AND THE SHAPE OF THE STORE MATTERS HERE: /mnt/user/ is
      Unraid's shfs FUSE union over disk1..disk17, and text_encoders/ exists on at least
      eleven of them (disk3, 4, 5, 8, 10, 11, 12, 13, 14, 16, 17). So the merged directory
      Comfy reads through is assembled across many physical disks, and a single large file
      is served from whichever disk holds it. A spun-down, slow, or failing member disk
      produces a read failure through the union that looks like nothing at all at the
      directory level. THE TEST THAT SETTLES IT: locate the physical disk holding the
      krea2 clip, then read it BOTH ways -- through /mnt/user/ and directly from
      /mnt/diskN/. Direct read succeeding while the union read fails is conclusive for
      shfs/member-disk trouble, and the fix is to serve the model share from the device
      path rather than the union. Both failing means the file is damaged after all and
      should be re-downloaded. ROOT CAUSE FOUND, 2026-08-24, from the ComfyUI box's SMB
      client event log. Not shfs, not a member disk, not a corrupt file. THE SMB LINK TO
      ALEXANDRIA IS DROPPING ABOUT ONCE A MINUTE. Microsoft-Windows-SMBClient/Connectivity
      shows a repeating 30804 (network connection disconnected) -> 30805 (client lost its
      session) -> 30806 (re-established) cycle at 11:30:56, 11:32:01, 11:33:09, 11:34:15,
      11:35:21, 11:36:27 and 11:37:34 -- seven drops in seven minutes, roughly one per 60
      seconds -- preceded by two 30803 "Failed to establish a network connection: {Device
      Timeout}" at 11:28:07 and 11:29:12. Still happening later: 30808 re-established
      events on three shares at 14:00:28. That fully explains the split between engines
      without needing any other theory. krea2's text encoder is
      qwen3vl_4b_fp8_scaled.safetensors at 5.24 GB; a read that large cannot survive a
      mount that resets every ~60 seconds, and a torn read is precisely what
      `hostbuf_file_reader_read failed` reports. flux/schnell succeeded because
      flux1-schnell-Q8_0.gguf is far smaller and fits inside a stable window (or was
      already in page cache). Nothing is wrong with the file, the disk, or the union
      mount. AND THE LIKELY WHY: the server address in every one of those events is
      100.89.251.10, which is in 100.64.0.0/10 -- CGNAT space, i.e. a TAILSCALE address.
      The ComfyUI box is mounting Z: over the Tailscale tunnel rather than the LAN. Multi-
      gigabyte SMB reads over WireGuard are already marginal; if the tailnet is falling
      back to a DERP relay rather than a direct path, sustained large reads are hopeless
      and periodic renegotiation matches the ~60s cadence exactly. The log also shows SMB-
      over-QUIC being attempted on :443 and failing on certificate mapping (30827) before
      falling back to TCP 445, which is extra churn on an already unstable link. FIX, in
      order of expected impact: (1) if both machines are on the same LAN, remount the
      share on Alexandria's LAN address instead of its 100.x tailnet address -- this is
      the whole fix if it applies; (2) otherwise check whether the tailnet path is direct
      or relayed (`tailscale status`, `tailscale ping alexandria`) and get it direct; (3)
      stop the QUIC attempts so the client is not renegotiating transports mid-read; (4)
      only if the link genuinely cannot be stabilised, cache the handful of models the
      render box actually needs on local disk -- roughly 5 GB for krea2 -- and point
      ComfyUI at the local copies, which removes the network from the hot path entirely
      and is arguably right regardless. NOTE that fix (4) also makes the box resilient to
      Alexandria being down, which is independently valuable given how much depends on
      this render path. SEPARATELY AND STILL TRUE: flux2-klein's encoder really is absent
      from the store, so it needs downloading (or repointing) no matter what happens to
      the mount. FLUX2-KLEIN'S CONFIGURED FILENAME IS NOT REAL, checked against the actual
      Comfy-Org releases 2026-08-24. FLUX2_KLEIN_CLIP is set to
      `flux2_klein_text_encoder_fp8_scaled.safetensors`, which does not exist in any
      Comfy-Org Flux.2 repository -- it appears to have been guessed rather than verified,
      and the constant block's own comment says "VERIFY these filenames against the Comfy-
      Org Flux.2 release you download." Nobody did. What actually exists: Comfy-
      Org/flux2-dev ships
      split_files/text_encoders/mistral_3_small_flux2_{bf16,fp8,fp4_mixed}.safetensors,
      and Comfy-Org/vae-text-encorder-for-flux-klein-9b ships
      split_files/text_encoders/qwen_3_8b{,_fp8mixed,_fp4mixed}.safetensors (16.4 GB /
      8.66 GB / 6.8 GB). Klein pairs with a QWEN3 encoder, not the Mistral one that
      flux2-dev uses -- which also means the 35.5 GB
      mistral_3_small_flux2_bf16.safetensors already on Alexandria is the flux2-DEV
      encoder and is not what klein wants. Unresolved and worth checking rather than
      guessing: our model constant is klein 4B (flux-2-klein-4b-Q4_K_M.gguf) while the
      encoder repo above is published for klein 9B. Whether 4B pairs with qwen_3_8b or
      with a 4B encoder is not established here; note that Alexandria already has
      qwen_3_4b.safetensors (8.04 GB), which may be the intended partner. Confirm against
      the ComfyUI Flux.2 docs for the specific klein build before downloading 8.66 GB on a
      guess. For a 12 GB card, qwen_3_8b_fp8mixed is the plausible choice if 8B is
      correct. So flux2-klein needs BOTH a config fix and a download, and the config fix
      should land first -- otherwise a correct download still fails against a wrong
      filename. CORRECTED AGAIN 2026-08-24, and this supersedes the "download qwen_3_8b"
      advice above. Silas asked whether any of this was checked against the Resource
      registry and the art generator's engine presets. It was not, and doing so changes
      the answer completely: NOTHING NEEDS DOWNLOADING. A COMPLETE, REGISTERED FLUX 2
      STACK ALREADY EXISTS. Queried live from /api/resources: DIFFUSION_MODEL
      `flux2_dev_fp8mixed` -> diffusion_models/flux2_dev_fp8mixed.safetensors
      (supportedServer FLUX); TEXT_ENCODER `mistral_3_small_flux2_bf16` ->
      text_encoders/mistral_3_small_flux2_bf16.safetensors; VAE `flux2-vae` ->
      vae/flux2-vae.safetensors. There is also a CHECKPOINT row
      `bigLove_klein2_fp8_pruned` -> Flux/bigLove_klein2_fp8_pruned.safetensors (FLUX),
      i.e. a Klein 2 checkpoint already on the box. Silas: "I don't really care as long as
      we have some representation of flux klein. obviously whatever fits our server is
      best." SO THE FIX IS A CONFIG FIX ONLY. Of the three files the flux2 config names,
      exactly one (flux2-vae.safetensors) is real. The unet flux-2-klein-4b-Q4_K_M.gguf
      and the encoder flux2_klein_text_encoder_fp8_scaled.safetensors are in neither the
      Resource registry nor the model store. Point the config at the registered trio
      instead, and note the unet is a .safetensors so the loader must move from
      UnetLoaderGGUF to UNETLoader. THE SAME FICTIONAL NAMES LIVE IN BOTH REPOS, which is
      how this survived: kind_robots server/api/comfy/flux2/utils/workflow.ts declares
      FLUX2_KLEIN_MODEL, FLUX2_KLEIN_TEXT_ENCODER and FLUX2_KLEIN_VAE with the same
      invented values, and conductor's consume_art_queue_core.py mirrors them. Fixing one
      without the other leaves the bug live on the other path. kind_robots also carries
      ENGINE_PRESETS in server/api/comfy/utils/engineWorkflow.ts mapping
      klein/flux2-klein/flux2 -> 'flux2', so the preset layer is fine; it is only the
      model filenames underneath that are wrong. ONE REAL CAVEAT before anyone flips it:
      mistral_3_small_flux2_bf16 is 35.5 GB against a 12 GB card. ComfyUI can offload a
      text encoder to CPU, but this needs an actual test rather than an assumption, and an
      fp8 build of the same encoder would be the better long-term answer if one is ever
      pulled -- that IS worth a download, unlike the klein encoder that started this. THE
      STRUCTURAL LESSON, worth more than the fix: conductor hardcodes model filenames as
      Python constants while Kind Robots maintains a Resource registry with localPath,
      supportedServer and commercialSafe for every model. Nothing validates one against
      the other, so an invented filename ships silently and only fails at render time. See
      t-034.
  - id: t-034
    milestone: m2
    title: "Validate engine model filenames against the Resource registry instead of hardcoding them twice"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Root cause behind t-033's flux2 failure, and it will recur on the next engine added
      unless it is fixed. Model filenames are hardcoded as constants in TWO places --
      kind_robots server/api/comfy/flux2/utils/workflow.ts (FLUX2_KLEIN_MODEL,
      FLUX2_KLEIN_TEXT_ENCODER, FLUX2_KLEIN_VAE) and conductor
      scripts/consume_art_queue_core.py (the FLUX2_KLEIN_*/KREA2_*/FLUX_MODELS blocks) --
      while Kind Robots separately maintains a Resource registry that already knows every
      model on the box, with resourceType (CHECKPOINT, TEXT_ENCODER, VAE,
      DIFFUSION_MODEL), localPath, supportedServer, and commercialSafe.
      Nothing validates the constants against the registry. The flux2 config names three
      files of which exactly one exists; the other two were invented and shipped in both
      repos, and only failed at render time, months later, on someone else's task. The
      constant blocks even carry a comment telling the reader to "VERIFY these filenames
      against the release you download" -- which is a comment doing a test's job.
      Do the cheap version first and the good version second.
      CHEAP: a check that reads every hardcoded model constant, queries
      /api/resources?resourceType=..., and fails when a named file has no matching
      Resource row. Run it in CI on both repos. This alone would have caught flux2 the day
      it was written, and it is a small script.
      GOOD: stop hardcoding. Resolve engine models from the registry at submit time --
      look up by Resource name or slug, read localPath, and let the registry be the single
      source of truth it already almost is. That also makes `commercialSafe` enforceable at
      the point of generation rather than as a separate audit, and makes adding a model a
      data change rather than a code change in two repos.
      Either way, fix the flux2 constants in BOTH repos in the same pass -- correcting one
      leaves the bug live on the other path. The registered trio to point at is
      flux2_dev_fp8mixed.safetensors, mistral_3_small_flux2_bf16.safetensors and
      flux2-vae.safetensors, and the unet is a .safetensors so the loader moves from
      UnetLoaderGGUF to UNETLoader. Test the 35.5 GB encoder against the 12 GB card before
      declaring it done.
