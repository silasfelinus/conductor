    note: 'RESOLVED 2026-08-25. Silas remounted the model share on Alexandria LAN IP 192.168.7.172 instead of the 100.x tailnet address, which was the fix named first in the diagnosis. krea2 then rendered successfully (job 9186), and cthulhuquarium/t-005 subsequently completed four jobs end to end with zero errors. The SMB drop cycle that tore every large read is gone. Note that three of four diagnoses in the history above were WRONG before the right one -- corrupt file, then shfs member disk, then a relayed tailnet path, the last of which Silas disproved outright with `tailscale status` showing a direct connection. What actually settled it was reading the SMB client event log rather than reasoning from the ComfyUI error. The lesson worth keeping: a read failure at the application layer says almost nothing about which layer failed, and the transport logs were available the whole time. The flux2-klein half is separately fixed as a config change in kind_robots#2076 and conductor#2810 -- it pointed at two filenames that exist nowhere, so that engine had never once run. Fix (4) from the list above, caching the handful of models the render box actually needs on local disk, remains unimplemented and is still worth doing: it removes the network from the hot path and makes rendering survive Alexandria being down.'
    updated: '2026-08-25T01:17:54Z'
  - id: t-034
    milestone: m2
    title: "Validate engine model filenames against the Resource registry instead of hardcoding them twice"
    status: done
    owner: null
    passes: 0
    stakes: reversible
    note: 'DONE 2026-08-25, merged in conductor#2810 with the kind_robots half in #2076. consume_art_queue_core.py now resolves every engine model constant through the Kind Robots Resource registry (resolve_model / _load_resource_index) instead of hardcoding filenames that nothing checked. The constants became LOGICAL NAMES -- a Resource name, slug, or bare filename all resolve, so existing hardcoded values kept working while they migrated. localPath prefix stripping is a per-resourceType tuple matched longest-first, because one type can live under more than one ComfyUI directory (a GGUF quant in unet/ beside its safetensors sibling in diffusion_models/), and getting that wrong is silent: the loader is handed a path with a directory still on the front and reports the model as missing. It paid for itself twice during implementation -- it immediately caught that Krea-2-Turbo-Q5_K_S.gguf has no Resource row at all, and a prefix bug of its own where unet/ was not being stripped for DIFFUSION_MODEL. DELIBERATELY WARN-AND-PASS-THROUGH RATHER THAN HARD-FAIL, with a STRICT_MODELS flag to opt in. The registry is currently incomplete rather than authoritative -- GGUF quants in particular render fine while having no Resource row -- so failing closed would brick engines that demonstrably work, which is a worse failure than the one this fixes. Revisit once the registry is complete. FOLLOW-UP worth filing separately: nothing yet fails CI when a constant names a model with no Resource row, so the warning only appears at queue time in a log nobody reads. A check that resolves every engine constant against the live registry would turn this from a runtime warning into a build-time error.'
    updated: '2026-08-25T01:18:10Z'
    implementation_pr: 'silasfelinus/conductor#2810'
  - id: t-035
    milestone: m2
    title: "Give monsters their own model — Character is for people you can talk to"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      ARCHITECTURAL CORRECTION, Silas 2026-08-25: "why do our characters have size? These
      monsters are not meant to be added as characters. characters are our website's
      chattable personalities and npcs for story based games. the monsters are something
      new." He is right and this supersedes the original decision in DESIGN-BRIEF.md that
      fish would be Character records.
      WHY THE ORIGINAL CALL WAS WRONG: it reused Character because its COLUMNS fit --
      species, class, backstory, quirks, slug, packId, six Rarity stats. That ignored what
      the model MEANS. Character is the chattable-personality table the rest of the site
      depends on; aquarium fish have no dialogue, no personality and no chat surface. The
      concrete cost is already paid: fish needed a capacity weight, `Character.size` was
      added for them, and when that migration shipped unapplied it returned HTTP 500 from
      every `prisma.character.findUnique()` on production, taking character-linked art
      generation down with it (kind-robots/t-071).
      BUILD: a new `Creature` model in kind_robots carrying what the bible actually needs
      -- slug, name, species, class, fieldNote, quirks, alignment, rarity, the six rarity
      stats, tier, size, yield, interval, unlockCost, behavior, hue, games, artPrompt,
      evolvesTo/evolvesFrom, plus the art image relations every visual entity here has.
      Name is a proposal: `Creature` because not everything in the table is monstrous (the
      Parlour Goldfish is not) and because Ruler is Hooked shares it. `Monster` is the
      obvious alternative -- Silas overrides in one word, so confirm before generating a
      migration.
      SHARING SURVIVES UNCHANGED. The `games` list was always the sharing mechanism, not
      Character. A Creature tagged [cthulhuquarium, ruler-hooked] is read by both games
      exactly as designed. Ruler is Hooked keeps Character for its actual characters -- the
      ruler, the warlock, the druids -- which is what its own brief meant.
      THEN, IN ORDER: repoint AquariumStock.characterId at the new table; repoint the seed
      script (t-008) and every task that says "Character rows" for fish (t-003, t-011,
      t-015, t-029, t-030, t-031); and only once nothing reads it, drop `Character.size` in
      a NEW forward migration. Do not edit 20260824223600 in place -- it is merged and may
      be applied in a dev database, so the sequence everywhere must be add-then-drop.
      DO NOT START THE DROP until kind-robots/t-071 has been resolved and production is
      healthy again. Converging the database to the shipped client comes first; correcting
      the model comes second. Doing both at once makes an outage harder to reason about,
      not easier.

  - id: t-036
    milestone: m1
    title: "TWO fish bibles exist and they share no species — Silas picks the canon"
    status: needs-human
    gate_human: true
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Found 2026-08-25 while merging two sessions that both worked t-003 in parallel.
      There are now two complete, internally consistent fish bibles with ZERO slugs in
      common, and both were written against the same task.
      (A) silasfelinus/cthulhuquarium, fish/*.yaml -- 23 species, one file per species,
      validated by that repo's scripts/validate_fish.py, art prompts already rewritten to
      the corrected cartoon direction. Slugs: parlour-goldfish, gutter-minnow,
      lamplight-angler, the-sexton, the-long-patience and so on. DESIGN-BRIEF.md and
      fish/SCHEMA.md both name this repo as the canonical source of truth, and the
      generated art queue reads from it.
      (B) conductor, projects/cthulhuquarium/fish/{common,uncommon,rare,epic,legendary,
      mythic}.yaml -- 24 species grouped by rarity tier, with its own fish/SCHEMA.md.
      Slugs: goldfish-common, sardine-common, crawdad-common, the-unlidded-goldfish-rare,
      the-founding-goldfish-legendary and so on. Carries fields (A) does not:
      `diet_role`, `school_role`, `rivals`, `evolution_kind` -- the rivalry and diet
      systems from t-025, which (A) has no representation for. Its art prompts are still
      the silhouette-forward ones Silas rejected.
      HOW THIS HAPPENED, and it is not either session being careless: the scheduled
      session's GitHub access was scoped without the cthulhuquarium repo, and AGENTS.md's
      cross-repo protocol says to land the work in the conductor project folder as a
      ready-to-relocate handoff rather than stall. t-004 did exactly that for ECONOMY.md
      and it worked fine, because nothing else was writing ECONOMY.md. t-003 had another
      session writing the same artifact in the repo the protocol was routing around. The
      protocol has no step for "check whether the canonical location is already being
      written", so both were correct locally and the canon forked.
      WHAT IS AND IS NOT AT STAKE: this is not a merge conflict and must not be resolved
      by picking whichever file a tool touched last. It is roughly 24 species of authored
      creature writing on one side and 23 on the other, in two different registers.
      NEITHER HAS BEEN DELETED -- both are committed and readable, so nothing is lost
      while this sits.
      FOR SILAS, and this is a taste call rather than a technical one: read a few field
      notes from each and say which register is the game. The recommendation, offered only
      because someone should: keep (A) as the canon -- it is where every other document
      already points, it is validated, and its prompts already match the corrected art
      direction -- then port (B)'s rivalry/diet/school fields into fish/SCHEMA.md and
      harvest any of its 24 species worth keeping as new entries. That treats (B) as a
      second authoring pass rather than a discard. If Silas prefers (B)'s register
      instead, the port runs the other way and the art prompts need the cartoon rewrite.
      DO NOT let t-008 seed either bible until this is answered -- seeding the wrong one
      writes 20-odd rows that then need unpicking.
      PREVENTING THE RECURRENCE is a separate and smaller fix, worth filing against
      conductor once this is settled: the cross-repo handoff protocol should require
      checking whether the canonical artifact already exists (or is claimed) in its home
      repo before writing a parallel copy, and should name the copy something that cannot
      be mistaken for canon.
