  - id: t-048
    milestone: m3
    title: "Pause the tank's 20s poll/render loop when the tab is hidden"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >-
      Kaizen from the t-021 mobile-packaging audit (see
      projects/cthulhuquarium/docs/t-021-mobile-packaging-audit.md). Neither
      cthulhuquarium-game.vue's TANK_POLL_INTERVAL_MS (20s) setInterval poll nor its
      requestAnimationFrame render loop pauses on document.visibilitychange. Browsers
      already throttle background-tab timers/rAF on their own, so this isn't a
      functional bug today, but it's exactly the kind of background CPU/battery
      behavior that becomes more visible (and more reviewer-relevant) once/if the game
      ever ships inside a native Capacitor wrapper. Small, independently reversible:
      gate both loops on document.hidden / a visibilitychange listener, resume cleanly
      on foreground.

