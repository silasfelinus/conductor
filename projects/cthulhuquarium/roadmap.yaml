  - id: t-008
    milestone: m2
    title: "Seed the bestiary — fish YAML into the Monster table"
    status: done
    owner: null
    passes: 0
    stakes: reversible
    depends_on: [t-003, t-035, t-036]
    note: >
      Write the idempotent seed script that reads fish/*.yaml from the cthulhuquarium repo and
      upserts rows in the bestiary table t-035 landed, `Monster`, keyed on slug. Map fields
      per the bible schema: species, class, backstory (the field note), quirks, alignment, and
      the six `Rarity` stats. Idempotent means re-running after a bible edit updates rows
      rather than duplicating them -- match on the unique slug. Fish tagged for ruler-hooked
      get seeded too; that is the entire shared-bestiary mechanism and it costs nothing extra
      here -- sharing is the `games` list on the row, not membership in a table. Never delete
      a row the script does not recognize -- a fish removed from the bible gets isActive
      false, not a DELETE. CORRECTED 2026-08-25 (Silas): this task previously said Character
      rows grouped under a Pack with slug abyssal-bestiary. Both halves are gone. Fish are not
      Characters -- Character is the chattable-personality table -- and a Pack was only ever
      the grouping mechanism BECAUSE they were Characters. A dedicated table needs no Pack to
      separate it from unrelated rows. Depends on t-035 now, because there is nothing to seed
      into until that model exists. IMPLEMENTED 2026-08-25 in silasfelinus/kind_robots,
      scripts/seed_bestiary.ts, with utils/scripts/verifyBestiarySeedMapping.ts and three npm
      scripts (seed:bestiary, :write, :verify). Dry run by default and --write to apply,
      matching seed_achievements.ts. Two passes, because evolvesToId is an FK and a chain
      target can sort after its source. Never deletes: a creature dropped from the bible gets
      isActive false. SAFETY RAIL worth knowing about -- deactivation is the one destructive-
      ish thing the script does, and the way it goes wrong is a bible that failed to load,
      since zero species parsed makes every row look dropped and switches off the whole
      bestiary in a single run. A floor of 100 species makes that unreachable; an empty
      directory, a 3-species directory and a bad path were each confirmed to exit 1 BEFORE the
      Prisma client is even constructed. VERIFIED OFFLINE across all 151: every stat lands in
      a legal Rarity, no value overruns its VarChar (the widths are asserted from the schema's
      own numbers, which is where a seed like this actually fails -- invisible until the
      insert hits production, by which point it has half-applied), all 92 evolution edges
      resolve, 14 shared with ruler-hooked. LEFT AT review RATHER THAN done, deliberately: the
      live dry run has not happened. This sandbox cannot reach the database host -- DNS
      resolves, TCP to the port times out -- so the attempt got as far as proving the retry
      wrapper correctly classifies a pool timeout as transient and backs off three times,
      which is a real check of that integration and nothing more. NOTHING HAS BEEN SEEDED.
      Closing this needs two things on the box: `npm run seed:bestiary` (read-only) to confirm
      151 to create and 92 edges, then `npm run seed:bestiary:write`. FOUR SCHEMA GAPS FOUND
      while mapping the fields, filed as t-042 rather than fixed here because every one is a
      migration and kind-robots/t-072 means a merged migration sits unapplied -- the exact
      shape that caused the t-071 outage. The seed works against the schema as it stands and
      loses only the one `secret` evolution kind. SEEDED 2026-08-26 01:45 by Silas, from his
      WSL checkout at /mnt/d/code/kind_robots, which is where the reachability actually was --
      the remote session could never reach the database host (DNS resolved, TCP to the port
      timed out) and two of the three places he tried failed for unrelated reasons (netcat
      absent on alexandria, `git pull` in a directory that was not a repo on the Windows
      side). VERBATIM RESULT: "bible: /mnt/d/code/cthulhuquarium/fish (151 species) / applied:
      151 to create, 0 to update, 92 evolution edges". 0-to-update confirms these were fresh
      rows rather than a re-run over existing ones, and 92 edges matches the bible exactly.
      The dry run was executed first and reported the same numbers, which is the sequence the
      script is built around. THE RUN PICKED UP MORE THAN THIS TASK ORIGINALLY SCOPED, because
      t-042 landed in between: EvolutionKind now has SECRET, so the-proprietor -> the-concern
      seeded with its real kind instead of a null and a warning, and `depth`, `dietRole` and
