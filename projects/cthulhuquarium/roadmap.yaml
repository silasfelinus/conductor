      44; this task is the remaining 107. THIS IS A CONTENT TASK WITH A QUALITY CEILING, which
      is the whole difficulty. 107 species is easy to produce badly and the failure is not
      obvious per-species -- it shows up as a bestiary where nothing is memorable because
      everything is a variation on a drifting anomaly. Every batch is judged on whether the
      bible is BETTER at 60 than it was at 44, not on whether 16 files appeared. WORK IN
      BATCHES OF ROUGHLY 15, each one a PR, each one validated by scripts/validate_fish.py
      before it opens. Do not attempt this in one pass -- a single 107-species commit is
      unreviewable, and the tone drift that makes this fail is only visible when someone reads
      a batch end to end. PER-BATCH RULES, all of them from gaps the merge exposed and
      recorded in fish/SCHEMA.md: (1) ROUGHLY TWO THIRDS OF NEW SPECIES SHOULD LAND IN A LINE.
      Only 20 of 44 do now. Extending an existing chain beats inventing a standalone creature
      when both fill the same slot -- three chains are still two stages long and want a third.
      A line is also cheaper to author WELL, because "and then what happens to it" is a far
      better prompt than a blank page. (2) HOLD THE WEIRDNESS CEILING AT EVERY BATCH. COMMON
      stays recognisably a fish. Authoring at volume is exactly the pressure that pushes every
      new common toward being strange, and a bible whose bottom tier is all anomalies has
      already spent the escalation it needs upstairs. If a batch's commons are getting weird,
      write more boring fish, not fewer. (3) SPEND BUDGET ON THE THIN MOVEMENT MODES.
      `tumble`, `surface` and `cling` have one specimen each. Three motions with a single user
      apiece read as one-offs rather than a vocabulary. Adding a fourth drifter is the lazy
      move. (4) FIX THE FOOD CHAIN. 7 prey against 22 predators. t-025's rivalry system has
      almost nothing to work with at the bottom, and prey species are mostly small
      recognisable fish -- which is what tier 1 wants more of anyway, so this and rule 2 solve
      each other. (5) RARITY SHAPE, as a target rather than a quota: COMMON ~32, UNCOMMON ~40,
      RARE ~36, EPIC ~26, LEGENDARY ~13, MYTHIC ~4. Batches that all pile into RARE because
      rare is more fun to write are the predictable failure. ART IS NOT BLOCKED ON THIS AND
      SHOULD NOT WAIT FOR IT. projects/art-generate.yaml regenerates from the bible via
      scripts/build_cthulhuquarium_art_queue.py, so each merged batch adds its own queue
      entries with no further work. Run the generator in the same PR and commit the result, or
      `--check` fails on the next one. NOT IN SCOPE HERE: seeding (t-008, which is blocked on
      t-035's Monster model anyway), and balance. Every new species needs plausible economy
      numbers in its tier band, but tuning them is t-019's job -- do not stall a batch arguing
