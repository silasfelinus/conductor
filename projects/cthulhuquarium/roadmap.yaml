    soft_gate: true
    note: >
      SYSTEMS.md is written (Silas's 2026-08-24 design download, plus the analysis of where
      it collides with his own rules). It leaves four structural questions that the build
      cannot resolve by guessing, and every one of them changes t-007's schema. Settle them
      on paper, in SYSTEMS.md, before t-026 or t-027 start.
      (1) DO SET PIECES AND FISH SHARE ONE SLOT POOL? One pool makes every build a sharp
      trade and is the stronger design; two pools is gentler and easier to balance. This is
      the biggest structural decision left in the systems layer and it propagates into the
      Aquarium schema, the shop UI, and every set's value.
      (2) IS RIVALRY AUTHORED OR EMERGENT? Hand-authored pairs are funnier and controllable;
      rules-based rivalry (predator vs small, anchor vs school) scales and surprises. Likely
      both, with authored pairs as memorable exceptions -- but decide, because authored pairs
      need a bible field and emergent rivalry needs a rules table.
      (3) DOES TANK SIZE GROW, OR DO YOU OWN SEVERAL TANKS? One growing tank is simpler.
      Several tanks let rival species coexist in the collection and make the arrangement
      puzzle much richer, at the cost of multiplying persistence and UI work.
      (4) WHAT IS A MILESTONE? Coin thresholds are the obvious and least interesting answer.
      First full tank, first evolution, first spotless tank, first rivalry resolved -- these
