  - id: t-036
    milestone: m1
    title: "TWO fish bibles exist and they share no species — Silas picks the canon"
    status: done
    gate_human: true
    approved_by_human: true
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Found 2026-08-25 while merging two sessions that both worked t-003 in parallel.
      There are now two complete, internally consistent fish bibles with ZERO slugs in
      common, and both were written against the same task.
      (A) silasfelinus/cthulhuquarium, fish/*.yaml -- 23 species, one file per species,
      validated by that repo's scripts/validate_fish.py, art prompts already rewritten to
      the corrected cartoon direction. Slugs: parlour-goldfish, gutter-minnow,
      lamplight-angler, the-sexton, the-long-patience and so on. DESIGN-BRIEF.md and
      fish/SCHEMA.md both name this repo as the canonical source of truth, and the
      generated art queue reads from it.
      (B) conductor, projects/cthulhuquarium/fish/{common,uncommon,rare,epic,legendary,
      mythic}.yaml -- 24 species grouped by rarity tier, with its own fish/SCHEMA.md.
      Slugs: goldfish-common, sardine-common, crawdad-common, the-unlidded-goldfish-rare,
      the-founding-goldfish-legendary and so on. Carries fields (A) does not:
      `diet_role`, `school_role`, `rivals`, `evolution_kind` -- the rivalry and diet
      systems from t-025, which (A) has no representation for. Its art prompts are still
      the silhouette-forward ones Silas rejected.
      HOW THIS HAPPENED, and it is not either session being careless: the scheduled
      session's GitHub access was scoped without the cthulhuquarium repo, and AGENTS.md's
      cross-repo protocol says to land the work in the conductor project folder as a
      ready-to-relocate handoff rather than stall. t-004 did exactly that for ECONOMY.md
      and it worked fine, because nothing else was writing ECONOMY.md. t-003 had another
      session writing the same artifact in the repo the protocol was routing around. The
      protocol has no step for "check whether the canonical location is already being
      written", so both were correct locally and the canon forked.
      WHAT IS AND IS NOT AT STAKE: this is not a merge conflict and must not be resolved
      by picking whichever file a tool touched last. It is roughly 24 species of authored
      creature writing on one side and 23 on the other, in two different registers.
      NEITHER HAS BEEN DELETED -- both are committed and readable, so nothing is lost
      while this sits.
      FOR SILAS, and this is a taste call rather than a technical one: read a few field
      notes from each and say which register is the game. The recommendation, offered only
      because someone should: keep (A) as the canon -- it is where every other document
      already points, it is validated, and its prompts already match the corrected art
      direction -- then port (B)'s rivalry/diet/school fields into fish/SCHEMA.md and
      harvest any of its 24 species worth keeping as new entries. That treats (B) as a
      second authoring pass rather than a discard. If Silas prefers (B)'s register
      instead, the port runs the other way and the art prompts need the cartoon rewrite.
      DO NOT let t-008 seed either bible until this is answered -- seeding the wrong one
      writes 20-odd rows that then need unpicking.
      PREVENTING THE RECURRENCE is a separate and smaller fix, worth filing against
      conductor once this is settled: the cross-repo handoff protocol should require
      checking whether the canonical artifact already exists (or is claimed) in its home
      repo before writing a parallel copy, and should name the copy something that cannot
      be mistaken for canon.
      RESOLVED 2026-08-25 by Silas, who answered the question by rejecting its premise:
      "Let's merge those two bibles then." Neither was discarded. Done in
      silasfelinus/cthulhuquarium (branch claude/cthulhuquarium-setup-0kp3v1).
      WHAT WON, AND IT WAS NOT ALL ONE SIDE. This repo's format won -- per-species files
      in the cthulhuquarium repo, because every other document points there, it is
      validated, and it carries the economy fields the game actually needs. The OTHER
      bible's STRUCTURE won, which was genuinely the better half of it: it was built as
      evolution lines running COMMON to MYTHIC, and that backbone is now the bible's. The
      recommendation this task carried (keep A, harvest B) was half wrong -- it treated B
      as a source of spare parts when B's organising idea was the thing worth taking.
      THREE SPECIES DROPPED AS DUPLICATES, not as rejects: goldfish-common is
      parlour-goldfish, minnow-common is gutter-minnow, and lure-bearer is
      lamplight-angler. ONE RENAMED: B's "The Chandelier" collided with this bible's
      chandelier-lion at the same rarity, and became The Seven Lights -- a name its own
      field note had already handed us.
      THREE LINES SPLICED rather than run in parallel, because both bibles had
      independently invented them. The goldfish line now runs all five tiers using A's
      base and terminus with B's two middle stages, which is the first time Silas's
      magikarp-to-gyarados has been a real climb rather than a two-step. Same for the
      angler and sardine lines. Splicing kept every distinct creature and produced longer
      chains than either bible had alone.
      FOUR FIELDS ADOPTED from B -- diet_role, school_role, rivals, evolution_kind, the
      t-025 rivalry and diet systems A had no representation for -- and backfilled onto
      all 23 originals. school_role was renamed from B's `school | solitary | anchor` to
      `shoaling | solitary | territorial` because the original collided with `behavior`'s
      own `school` and `anchor` values; they are different axes and the old names invited
      exactly the wrong reading.
      RESULT: 44 species, eight evolution lines, 156 tank units to stock one of
      everything. The conductor-side copy is deleted, so there is one bible again. The
      art queue regenerated to 59 entries without being touched, which is the generator
      from #2810 doing its job.
      THE RECURRENCE FIX IS STILL UNFILED and still worth doing: the cross-repo handoff
      protocol needs a step requiring a check of whether the canonical artifact already
      exists or is claimed in its home repo before writing a parallel copy. This cost a
      full duplicate authoring pass; next time it could cost a duplicate implementation.
      TARGET IS NOW 151 (Silas: "a real game should have at least 100 fish, but I think
      151 is the right number for...reasons :)"). 107 to go, tracked as t-037.
      RENAMED AFTER THE FACT, 2026-08-25: the goldfish line named above is now the
      RUSTFISH line -- Silas, "goldfish is a terrible terrible name. Brassfish or rustfish
      is much better." Parlour Rustfish -> Elder Rustfish -> The Unlidded Rustfish -> The
      Founding Rustfish -> The Long Patience. Rustfish over Brassfish because brass is
      already the aquarium's fitting material and spending it on the starter fish wastes a
      distinctive word on the least distinctive creature. The slugs above are left as
      written because they are a record of what the two bibles contained at merge time,
      not a description of the bible today.
      AND THE 151 IS NOW EXPLAINED rather than winked at, in fish/SCHEMA.md. It is the
      original Pokemon count, Mew included. Silas: "Make it explicit. The joke was for you,
      not for me to read ten days from now that each agent communicates they refused to
      examine why we are committing to 151 monsters as instructed." A magic number that
      every future reader is instructed not to question is a documentation failure however
      good the joke was.

  - id: t-037
    milestone: m3
    title: "The road to 151 — author 107 more species without diluting the bible"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-036
    note: >
      Silas, 2026-08-25: "a real game should have at least 100 fish, but I think 151 is
      the right number for...reasons :)" The reasons are not in dispute. The merge
      (t-036) landed 44; this task is the remaining 107.
      THIS IS A CONTENT TASK WITH A QUALITY CEILING, which is the whole difficulty. 107
      species is easy to produce badly and the failure is not obvious per-species -- it
      shows up as a bestiary where nothing is memorable because everything is a variation
      on a drifting anomaly. Every batch is judged on whether the bible is BETTER at 60
      than it was at 44, not on whether 16 files appeared.
      WORK IN BATCHES OF ROUGHLY 15, each one a PR, each one validated by
      scripts/validate_fish.py before it opens. Do not attempt this in one pass -- a
      single 107-species commit is unreviewable, and the tone drift that makes this fail
      is only visible when someone reads a batch end to end.
      PER-BATCH RULES, all of them from gaps the merge exposed and recorded in
      fish/SCHEMA.md:
      (1) ROUGHLY TWO THIRDS OF NEW SPECIES SHOULD LAND IN A LINE. Only 20 of 44 do now.
      Extending an existing chain beats inventing a standalone creature when both fill
      the same slot -- three chains are still two stages long and want a third. A line is
      also cheaper to author WELL, because "and then what happens to it" is a far better
      prompt than a blank page.
      (2) HOLD THE WEIRDNESS CEILING AT EVERY BATCH. COMMON stays recognisably a fish.
      Authoring at volume is exactly the pressure that pushes every new common toward
      being strange, and a bible whose bottom tier is all anomalies has already spent the
      escalation it needs upstairs. If a batch's commons are getting weird, write more
      boring fish, not fewer.
      (3) SPEND BUDGET ON THE THIN MOVEMENT MODES. `tumble`, `surface` and `cling` have
      one specimen each. Three motions with a single user apiece read as one-offs rather
      than a vocabulary. Adding a fourth drifter is the lazy move.
      (4) FIX THE FOOD CHAIN. 7 prey against 22 predators. t-025's rivalry system has
      almost nothing to work with at the bottom, and prey species are mostly small
      recognisable fish -- which is what tier 1 wants more of anyway, so this and rule 2
      solve each other.
      (5) RARITY SHAPE, as a target rather than a quota: COMMON ~32, UNCOMMON ~40, RARE
      ~36, EPIC ~26, LEGENDARY ~13, MYTHIC ~4. Batches that all pile into RARE because
      rare is more fun to write are the predictable failure.
      ART IS NOT BLOCKED ON THIS AND SHOULD NOT WAIT FOR IT. projects/art-generate.yaml
      regenerates from the bible via scripts/build_cthulhuquarium_art_queue.py, so each
      merged batch adds its own queue entries with no further work. Run the generator in
      the same PR and commit the result, or `--check` fails on the next one.
      NOT IN SCOPE HERE: seeding (t-008, which is blocked on t-035's Monster model
      anyway), and balance. Every new species needs plausible economy numbers in its tier
      band, but tuning them is t-019's job -- do not stall a batch arguing about a yield.
      BATCH 1 LANDED 2026-08-25: 15 species, 44 -> 59 of 151. 92 to go, so this stays
      `ready` rather than done -- roughly six more batches. Delivered as a CROSS-REPO
      HANDOFF, not as a direct commit: the bible lives in silasfelinus/cthulhuquarium and
      this session's connector and git proxy are both scoped without it (clone works,
      push is 403). The batch was therefore authored and validated INSIDE a clone of the
      real bible at c551b77 -- `scripts/validate_fish.py` reports 59 valid -- and the
      files ship as
      projects/cthulhuquarium/docs/t-037-batch1-thin-modes.md, with a verified extractor
      and a `git apply --check`-clean diff for the four one-line edits to existing
      species. It is deliberately NOT written into conductor/projects/cthulhuquarium/fish/,
      which conductor#2819 retired: recreating that directory is exactly the two-bibles
      failure t-036 documents.
      AGAINST THE FIVE RULES: (1) 11/15 in a line (73%); bible 52% -> 58%; all three
      two-stage chains named in SCHEMA.md now run three stages (catfish, crawdad, bell)
      and four new two-stage lines were authored base-and-payoff in one pass. (2) all six
      commons are ordinary fish, five of six `class: minnow`, no anomaly/construct/colony
      below RARE. (3) the thin modes were the batch's main job -- cling 1 -> 6, surface
      1 -> 6, tumble 1 -> 4, and drift stayed at 10. (4) prey 7 -> 15 against predator
      22 -> 27, from 1:3.1 to 1:1.8. (5) COMMON 8 -> 14, UNCOMMON 11 -> 16, RARE 10 -> 13,
      EPIC 9 -> 10, LEGENDARY and MYTHIC untouched -- deliberately bottom-weighted because
      the merged 44 were top-heavy against target.
      ART QUEUE NOT REGENERATED, deliberately, and this is the one instruction above that
      was not followed literally. The queue is generated FROM the bible; until the handoff
      is applied the canon bible still holds 44, so committing 74 entries now would make
      `--check` fail permanently against the real bible -- the same drift the generator
      exists to prevent, pointed the other way. Verified rather than assumed: `--check`
      passes against canon today and reports stale against the modified clone, and the
      regeneration is purely additive (+15, no existing entry moves). The single command
      to run once the batch is on cthulhuquarium/main is in the handoff doc. No CI
      workflow runs `--check`, so nothing is red in the meantime.
      NEXT BATCH SHOULD PRIORITISE, in order: LEGENDARY and MYTHIC (4/13 and 2/4, the two
      furthest-behind tiers, untouched here -- and each should terminate a line that
      already exists rather than stand alone); UNCOMMON and RARE, the largest absolute
      gaps at 24 and 23; `hover` (6) and `dart` (5), now the thinnest modes, with still no
      fourteenth drifter; third stages for the four new two-stage lines; and the `bloom`
      (1) and `angler` (2) classes, since `anomaly` is 12 and rising and is the class a
      lazy batch will drift into. Also pending: SCHEMA.md's counts are now stale, and its
      "89 tank units to stock one of everything" was already stale before this batch --
      the validator reports 156 at c551b77 and 194 after. That number is load-bearing for
      tank sizing, so it is flagged for t-019 rather than quietly rewritten.
