# Cthulhuquarium fish bible — RARE tier (cthulhuquarium/t-003)
# Schema: ../fish/SCHEMA.md. Rare and above may cross into DESIGN-BRIEF
# decision 4's "clearly not a fish" territory — unsettling, never
# gross-out, always a legible silhouette.

fish:
  - slug: the-unlidded-goldfish-rare
    name: "The Unlidded Goldfish"
    tier: RARE
    stats:
      charm: LEGENDARY
      empathy: RARE
      grace: RARE
      luck: RARE
      might: UNCOMMON
      wits: RARE
    diet_role: neutral
    school_role: school
    rivals: []
    size: 3
    evolves_to: the-founding-goldfish-legendary
    evolution_kind: growth
    field_note: >
      Blinks now. This is understood to be new. No one on staff will
      confirm what it was doing with its eyes before.
    art_prompt: >
      Oversized goldfish silhouette with one additional visible eye set
      into its flank, still a legible fish outline, unsettling but clean
      silhouette, warm backlight.
    games:
      - cthulhuquarium

  - slug: the-single-fish-rare
    name: "The Single Fish"
    tier: RARE
    stats:
      charm: RARE
      empathy: EPIC
      grace: UNCOMMON
      luck: UNCOMMON
      might: COMMON
      wits: RARE
    diet_role: prey
    school_role: school
    rivals: []
    size: 4
    field_note: >
      Officially one fish. The paperwork was filed before anyone counted
      properly, and the paperwork is not being revisited.
    art_prompt: >
      Large silhouette shaped like a tight sardine school seen from a
      distance, its outline made of many smaller overlapping fish-shapes
      fused into one form, backlit shimmer.
    games:
      - cthulhuquarium

  - slug: the-chandelier-rare
    name: "The Chandelier"
    tier: RARE
    stats:
      charm: EPIC
      empathy: COMMON
      grace: RARE
      luck: UNCOMMON
      might: RARE
      wits: RARE
    diet_role: predator
    school_role: solitary
    rivals: []
    size: 3
    evolves_to: the-foyer-epic
    evolution_kind: growth
    field_note: >
      Now carries seven lights instead of one. Guests are advised the
      resemblance to fine dining fixtures is coincidental, and the
      resemblance to teeth is not.
    art_prompt: >
      Anglerfish-shaped silhouette bristling with many glowing lure-lights
