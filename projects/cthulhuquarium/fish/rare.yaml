      teeth-edged silhouette, still legibly fish-adjacent.
    games:
      - cthulhuquarium

  - slug: the-testimony-rare
    name: "The Testimony"
    tier: RARE
    stats:
      charm: COMMON
      empathy: UNCOMMON
      grace: RARE
      luck: COMMON
      might: RARE
      wits: EPIC
    diet_role: predator
    school_role: anchor
    rivals: []
    size: 3
    evolves_to: the-committee-epic
    evolution_kind: growth
    field_note: >
