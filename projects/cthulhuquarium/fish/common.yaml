# Cthulhuquarium fish bible — COMMON tier (cthulhuquarium/t-003)
# Schema: ../fish/SCHEMA.md. Common tier stays recognizably a fish per
# DESIGN-BRIEF decision 4 — the restraint here is what makes the higher-tier
# escalation land.

fish:
  - slug: goldfish-common
    name: "Common Goldfish"
    tier: COMMON
    stats:
      charm: UNCOMMON
      empathy: COMMON
      grace: COMMON
      luck: COMMON
      might: COMMON
      wits: COMMON
    diet_role: neutral
    school_role: school
    rivals: []
    size: 1
    evolves_to: goldfish-elder
    evolution_kind: growth
    field_note: >
      Orange, biddable, and kept alive by people who forget why they wanted a
      fish in the first place. No cause of death has ever satisfied its owner.
    art_prompt: >
      Clean orange goldfish silhouette in three-quarter profile, single
      flowing tail fin, soft backlit glow against dark water, classic
      recognizable goldfish shape, no additional features.
    games:
      - cthulhuquarium

  - slug: sardine-common
    name: "Harbor Sardine"
    tier: COMMON
    stats:
      charm: COMMON
      empathy: UNCOMMON
      grace: UNCOMMON
      luck: COMMON
      might: COMMON
      wits: COMMON
    diet_role: prey
    school_role: school
    rivals: []
    size: 1
    evolves_to: the-single-fish-rare
    evolution_kind: growth
    field_note: >
      Silver, identical to its neighbor, and correct that no one will ever
      tell them apart. This is not considered a tragedy by the sardine.
    art_prompt: >
      Small silver sardine silhouette, sleek torpedo body, tight schooling
      formation of matching silhouettes fading into darkness behind it,
      high-contrast backlighting.
    games:
      - cthulhuquarium

  - slug: crawdad-common
    name: "Ditch Crawdad"
    tier: COMMON
    stats:
      charm: COMMON
      empathy: COMMON
      grace: COMMON
      luck: COMMON
      might: UNCOMMON
      wits: COMMON
    diet_role: prey
    school_role: solitary
    rivals: []
    size: 1
    evolves_to: marsh-sovereign-crawdad
    evolution_kind: growth
    field_note: >
      Found wherever water forgets to keep moving. Its claims to territory
      are entirely sincere and entirely unenforceable.
    art_prompt: >
      Small crawdad silhouette viewed from above, two raised claws,
      segmented tail, murky ditch-water backlighting, legible crustacean
      shape.
    games:
      - cthulhuquarium

  - slug: guppy-common
    name: "Feeder Guppy"
    tier: COMMON
    stats:
      charm: UNCOMMON
      empathy: COMMON
      grace: COMMON
      luck: COMMON
      might: COMMON
      wits: COMMON
    diet_role: prey
    school_role: school
    rivals: []
    size: 1
    field_note: >
      Sold by the dozen, replaced by the dozen, and the only fish in this
      ledger whose price has never once increased.
    art_prompt: >
      Tiny guppy silhouette with a flared tail fin, simple teardrop body,
      softly lit against pale blue water, unmistakably small and harmless
      in scale.
    games:
      - cthulhuquarium

  - slug: catfish-common
    name: "Bottom Catfish"
    tier: COMMON
    stats:
      charm: COMMON
      empathy: COMMON
      grace: COMMON
      luck: COMMON
      might: UNCOMMON
      wits: UNCOMMON
    diet_role: predator
    school_role: solitary
    rivals: []
    size: 2
    evolves_to: old-catfish-uncommon
    evolution_kind: growth
    field_note: >
      Whiskered, bottom-feeding, and the reason the tank glass never needs
      cleaning below the waterline. It has opinions about this arrangement.
    art_prompt: >
      Broad flat-bodied catfish silhouette with long trailing whiskers, low
      along the tank floor, dim murky backlighting, recognizable catfish
      profile.
    games:
      - cthulhuquarium

  - slug: minnow-common
    name: "Culvert Minnow"
    tier: COMMON
    stats:
      charm: COMMON
      empathy: COMMON
      grace: COMMON
      luck: UNCOMMON
      might: COMMON
      wits: COMMON
    diet_role: prey
    school_role: school
    rivals: []
    size: 1
    field_note: >
      Too small to be worth catching and too numerous to be worth counting.
      The tank's population figure is considered a courtesy estimate.
    art_prompt: >
      Cluster of tiny minnow silhouettes in loose formation, simple slender
      bodies, pale grey-blue backlight, deliberately indistinct as
      individuals.
    games:
      - cthulhuquarium
