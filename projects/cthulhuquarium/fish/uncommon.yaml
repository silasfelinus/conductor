# Cthulhuquarium fish bible — UNCOMMON tier (cthulhuquarium/t-003)
# Schema: ../fish/SCHEMA.md.

fish:
  - slug: goldfish-elder
    name: "Elder Goldfish"
    tier: UNCOMMON
    stats:
      charm: RARE
      empathy: UNCOMMON
      grace: UNCOMMON
      luck: UNCOMMON
      might: COMMON
      wits: UNCOMMON
    diet_role: neutral
    school_role: school
    rivals: []
    size: 2
    evolves_to: the-unlidded-goldfish-rare
    evolution_kind: growth
    field_note: >
      Outlived three owners, two decorative castles, and one entire
