# Scaffolded 2026-07-04 from the SHAPE/BUILD/POLISH template (PROJECT-CREATION.md).
project: da-vinci
kind: software

notes_from_silas: |
  A life-simulation game on kind_robots: a seeded playthrough (LifeRun) advances
  chapter by chapter through choices (LifeChoice) that move stats (LifeStat),
  generates art along the way (LifeRunArt via the existing art system), and
  resolves to an ending (LifeEnding) with achievements (LifeAchievement /
  LifeAchievementUnlock). Schema drafted by the Worker, applied by the Reviewer
  in kind_robots PR #87; Silas runs the migration manually.

  Skillset segment (per the ecosystem principle): stateful narrative progression —
  seeded, resumable, stat-driven story state that other projects (storymaker,
  serendipity, challenge-center SCENARIO challenges) can reuse.

