  - id: t-021
    milestone: m5
    title: Build the ruler character creator (body, skin, honorific, species)
    status: claimed
    passes: 0
    stakes: reversible
    owner: worker
    claimed_by: claude-scheduled-20260827T0830Z-rh-t021
    claimed_at: '2026-08-27T07:33:19Z'
    note: >
      Silas, 2026-08-26: "we will need to add a character creator element that lets
      the user pick body shapes, skin color, and ruler title, etc." Cross-repo: the
      code lands in kind_robots, this task holds the state.

      The data model already anticipates this and is not yet wired to anything.
      docs/data-model.md defines `ruler.honorific` (King|Queen|other, a cosmetic
      label) and `ruler.cosmetics` (currently `{ outfit, crownTilt }`), and
      newGame.ts sets defaults nobody can change. Nothing in the UI reads or writes
      either, and the compositor's asset scheme has no cosmetic axis at all --
      `assetCandidates()` resolves `{region}-{state}[-{time}]`, so there is
      currently no path shape that can address "the ruler layer, but Pip".

      Three pieces of work, in order:
      (1) Widen `ruler.cosmetics` to carry the axes Silas named -- body, skin,
          species, plus the existing outfit/crownTilt -- and widen `honorific` past
          the King|Queen|other trio to the set t-020 settles. Save-format change:
          bump `contentVersion` and make old saves load with defaults rather than
          breaking, per the brief's multiple-named-saves guarantee.
      (2) Give the compositor a cosmetic axis for the `ruler` region so a preset
          resolves to its own file, with the same graceful fallback ladder the time
          variants already use -- a missing cosmetic degrades to the base ruler
          layer, never a hole.
      (3) A creation screen at new-game time, and the ability to change cosmetics
          later (they are cosmetic-only by design, so there is no reason to lock
          them at creation).

      t-020's twelve presets are the art this builds against, at
      public/images/ruler-hooked/ruler/<id>.webp. Read the list as data; do not
      hardcode ids, since adding a preset is one dict entry plus one render.

      DECIDED (Silas, in session 2026-08-26): "Agreed on your reasoning for custom
      ruler images being too complex for expansion, I like custom name and
      honorific, your presets are fine, we can always add more, and custom should
      be an option." So: preset figures, free-text name and honorific, no
      composable overlay system, and a custom escape hatch (see CUSTOM below).

      The reasoning he agreed with, kept because it is the constraint, not a
      preference: presets for the figure, free text for the words, and overlays
      only where registration is genuinely free.

      A composable overlay creator (pick a body, then a skin, then a crown) needs
      every part drawn to a shared skeleton with consistent anchor points. Diffusion
      models do not produce registered separable parts -- each render reinvents the
      proportions, so a crown generated against one body sits wrong on the next.
      Getting real overlays means a deliberately drawn paper-doll set, which is an
      illustration commission rather than a pipeline run. That is a legitimate thing
      to want, and it should be chosen knowingly, not arrived at by discovering the
      generator cannot do it.

      Presets do not have that problem, and Silas's own "art is cheap" is the reason
      they win: a coherent new ruler costs one dict entry and one render, the
      compositor already swaps whole files by key so no new compositing axis is
      needed, and every preset is guaranteed internally consistent because one
      render drew all of it. The cost is combinatorial range -- twelve fixed figures
      instead of a body x skin x crown product.

      Two axes are free either way, and Silas confirmed both: `honorific` and the
      ruler's name are pure data, no art, and they are the customisation that reads
      as most personal. Widen `honorific` past King|Queen|other to FREE TEXT, with
      the twelve preset titles (King, Queen, Sovereign, Regent, Matriarch,
      Chieftain, Monarch, Prince) offered as suggestions rather than as the set.

      If the combinatorial range turns out to matter more than the coherence, the
      upgrade path is additive: keep presets as base figures and add a small set of
      overlays that do not need tight registration (a held item, a colour tint on
      the robes), rather than rebuilding the figure as parts.

      CUSTOM -- what "custom should be an option" can mean here. Worth stating
      because the obvious reading is ruled out by a design pillar: DESIGN-BRIEF.md
      is explicit that AI is used for asset generation DURING DEVELOPMENT and that
      "there are NO live LLM interactions at runtime" -- the shipped game runs with
      no internet. So custom cannot mean describe-your-ruler-and-we-generate-it,
      and it cannot mean composable parts either, since that is the overlay system
      just rejected.

      What is left, and what this task should build: the player supplies their own
      ruler picture from their own device. A file picker, held locally, alongside
      the free-text name and honorific -- "your picture, your name, your title" is
      a complete custom ruler with no runtime AI, no registration problem, and no
      network. It also degrades correctly: a save with a custom image that is no
      longer readable falls back to a preset rather than to a hole, using the same
      ladder as the missing-art case.

      Storage caveat: saves are local (rulerHookedStore.ts, localStorage) and the
      brief requires multiple named saves. A 768x1024 webp is roughly 80-130KB, so
      base64 in localStorage costs ~110-175KB per save against a ~5MB quota --
      workable for a handful of saves and fragile past that. Prefer IndexedDB for
      the image blob with the save holding only a key, and cap or downscale on
      import. Do not let a custom portrait be the thing that makes save #12 fail
      to write.

      Flagged as interpretation rather than instruction: Silas said "custom should
      be an option" without saying which kind, and the offline pillar is what
      narrows it. If he meant something else -- a request queue that generates a
      new preset for him during development, say -- that is a different and simpler
