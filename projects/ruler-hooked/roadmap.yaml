  note: >-
    Silas, 2026-09-11: "I see no visuals of the kingdom, no interactions with populous, no ability to
    see text based prompts with an image that asks me to decide important things."

    The PoC does recomposite a landscape from kingdom-health sliders, so a kingdom view is not
    starting from nothing -- but the player never meets it. Half the title is "rule the realm" and
    the realm is currently a set of numbers behind a fishing screen.

    DO: (1) A kingdom view the player can actually go to and read: the realm's state, what changed
    since last turn, what is going badly. Reuse the existing composited landscape as its centrepiece
    rather than drawing a second representation of the same state. (2) Decision encounters that
    arrive as an IMAGE plus a situation plus real choices with consequences -- the card shape the
    design brief describes and the audit's encounter-authoring item covers. The image is not
    decoration here; Silas is explicit that the prompt should be visual and ask him to decide
    something important. (3) Populace presence: the realm should contain people who want things and
    react, so decisions have someone on the other side of them.

    Sequence note: the encounter AUTHORING pipeline (generation/import/validation, duplicate and
    dead-trigger checks) is the audit's item 5 and is what makes this scale past a handful of
    hand-written cards. Build enough cards by hand to prove the shape, then build the pipeline
    before writing the full deck.
  updated: '2026-09-11T13:30:00Z'
