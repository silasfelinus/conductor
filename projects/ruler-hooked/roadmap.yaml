project: ruler-hooked
kind: software

goal: >
  Playable slideshow fishing/kingdom-management PoC on the web: fish at the lake
  while kingdom event-cards prompt choices that move kingdom-health sliders and
  visibly recomposite the landscape, with multiple named save slots — offline-playable.

notes_from_silas: |
  "The Ruler is Hooked" — fishing/kingdom management simulator, told in
  slideshow format. You play the King (or Queen) (or other) of a country, but
  you don't want to rule, you just want to fish all day. Perched at the edge
  of a beautiful lake behind your castle, you fish while kingdom tasks are
  occasionally handed to you as choices that affect the environment (e.g. a
  warlock land developer vs Druid preservationists). Choices move kingdom
  health and swap specific landscape regions, merged together into one play
  screen image. Web app/app first (JavaScript + backend) as proof of concept;
  future expansion to a full Steam game via Unreal. Cartoony and goofy,
  exaggerated good/evil stereotypes with wry twists, always nuanced
  characters — think Monkey Island, Bakshi, Treasure Planet, Steven Universe,
  She-Ra. Characters use the kind_robots Character model (reuse existing when
  they fit); different characters/events appear on different runs (e.g. the
  ruler's child wants to elope). Multiple saves required. AI for assets and
  inspiration during development, but the final game is playable OFFLINE — no
  live LLM interactions. Bucket-list project.

