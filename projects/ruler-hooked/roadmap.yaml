    THIS IS SYSTEMIC, NOT RULER-HOOKED'S. The "DELIVERABLES & STATUS / What 100% looks like /
    Shipped / Up next" block is components/conductor/project-deliverables-panel.vue, rendered by
    components/conductor/project-front-page.vue -- a SHARED wrapper mounted by at least four product
    pages: ruler-hooked-page.vue, aquarium-page.vue (Cthulhuquarium), coloring-book-page.vue and
    scoop-cms-page.vue. Conductor's internal roadmap state is being shown to players on every one of
    them. cthulhuquarium/t-066 was filed as an aquarium-specific version of this same complaint
    ("stop rendering the project pitch as player-facing copy") and should be closed by reference to
    this task rather than fixed twice; its own note already flagged the possibility that the leak
    was in a shared wrapper.

    DO: (1) Stop rendering the deliverables/status panel on player-facing product surfaces.
    project-front-page is genuinely useful as a shared shell -- do not delete it; give it a way to
    omit the project-info chrome, and have the product pages use that. Whether it stays visible on
    an admin/conductor view is a separate question and fine to keep. (2) Remove the PWA
    "Install ... to play offline / Not now" banner from ruler-hooked-page.vue's top; installability
    can live behind a menu item rather than a banner ahead of the game. (3) Move the "Cast & catch"
    and "Rule the realm" explainer cards out of the page body and behind a tutorial affordance --
    a help icon opening an overlay, not two cards competing with the game for the first screen.

    Check the other three surfaces while in here: what reads as harmless boilerplate on an admin CMS
    page reads as scaffolding left on the set when it is the first thing a player sees.

    CROSS-REFERENCE CHECKED 2026-09-11, after this task was written: cthulhuquarium/t-066
    already closed a DIFFERENT leak through this same wrapper and must not be re-done here.
    kind_robots#2623 fixed view.description preferring the live Project.description field
    (frozen to Silas's raw pitch dictation at scaffold time) over each page's authored
