    produce something other than a fish and rare pulls feel different from common ones. (2) A shop
    with two spend directions, because Silas named both: GEAR that changes fishing (rods, lures,
    line -- these should visibly alter t-026's timing minigame: band width, marker speed, a second
    chance) and KINGDOM investment that changes the realm's state and its art. (3) Wire it to the
    existing kingdom-health model rather than a parallel currency: spending should move the sliders
    the PoC already recomposites the landscape from.

    Design before building: ECONOMY-shaped decisions (what currencies exist, what a rare catch is
    worth, whether gear is permanent) are cheap to change on paper and expensive to change in a
    save format. Cthulhuquarium's data/economy.yaml + simulate_economy.py pattern -- tunable
    constants plus a simulation proving the curve -- is the house precedent and worth copying here.

    Implemented and opened kind_robots#2934: treasure drop (rarity-scaled odds/coin range,
    rolled after all existing rng draws in resolveFishingCatch so it never perturbs an
