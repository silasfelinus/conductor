  - id: t-017
    milestone: m5
    title: Resolve the region-layer format contract before rendering the environment matrix
    status: done
    passes: 0
    stakes: reversible
    owner: worker
    claimed_by: 2026-08-26T23-claude-ruler-hooked-art
    claimed_at: '2026-08-26T23:20:00Z'
    updated: '2026-08-27T01:34:18Z'
    implementation_pr: 'silasfelinus/kind_robots#2139'
    note: >-
      Two shipped specs disagree about what a region layer file actually is, and
      they cannot both be satisfied by one rendered image. docs/art-direction.md
      §2 (t-008) specifies every layer as a full-play-screen image with everything
      outside its own depth band transparent, registered so layers stack into one
      frame. What actually shipped in kind_robots
      components/ruler-hooked/ruler-hooked-stage.vue renders each region as its own
      `flex-1` band inside an `h-72 sm:h-96` column — eight bands, so roughly a
      20:1 strip — with the layer image as `object-cover` inside that strip. A
      full-frame transparent layer sent through that component is cropped to a thin
      slice of its own middle; a strip authored for the component cannot be
      generated at 20:1 by any image model.

      Pick one and make the other follow: either (a) change the stage to absolutely
      position full-frame layers over one shared canvas, which is what the
      compositing spec assumed and what makes the art direction's registration and
      shared-key-light rules mean anything, or (b) keep banded rendering and respec
      the art direction to per-band crops with a generatable aspect ratio and a
      documented crop rectangle per region. (a) is the recommendation — it is what
      docs/compositing.md already describes and it does not require re-deriving the
      art direction — but the call is a real one, not a formality.

      RESOLVED (kind_robots PR #2139) in favour of (a), the compositing spec.
      ruler-hooked-stage.vue now composites full-frame layers in z-order over one
      canvas, keeping the banded gradients underneath as the placeholder floor so
      the artless state and the graceful degradation are unchanged. Verified:
      vue-tsc exit 0, eslint clean, prettier clean, both headless self-tests ALL
      PASS, test:layout-contract holds. Not verified: real pixels -- no browser in
      this sandbox, and no layer art existed yet at the time.

      Storage turned out to need no change, which was not obvious: the pipeline
      writes to self-hosted media while the compositor asks for a relative
      /images/ruler-hooked/... path, and those are the same store -- kind_robots'
      own images route serves /images/** from IMAGES_PATH, which in production is
      the mounted media root. Confirmed live rather than assumed (key-art-day.webp
      and characters/warlock-vex.webp both 200, byte-identical to the media origin).

      DONE: kind_robots PR #2139 squash-merged 2026-08-26 (f36f87b), all 38 checks
      green. Unblocked t-018, whose 37 renders went out the same session.

      RECONCILED 2026-08-27 (conductor scheduled Agent run): kind_robots#2139 confirmed merged
      (merged_by silasfelinus). Task's own note says 'Flip to done when #2139 merges' -- doing
      so. Unblocks t-018 (already submitted, still status: review pending its own art-render
      verification).

