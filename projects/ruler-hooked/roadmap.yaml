    speed upgrades snapshotted onto FishingEncounter from save.flags at buildEncounter time,
    so the visual timing bar and game-logic resolution never diverge), and a KINGDOM_CATALOG
    (spends coins to move the real kingdomHealth sliders directly, per Silas's own note --
    no parallel currency). Both purchase paths spend through the existing closed Effect
    reducer (applyEffects.ts) -- counters for coins, flags for owned gear, sliders for
    kingdom investment -- no new save-mutation path. New Shop UI (ruler-hooked-shop.vue)
    wired into ruler-hooked-game.vue behind a coin-balance button, same modal pattern as
    existing dialogs. Deliberately deferred: a 'second chance' gear effect (would touch the
