- id: t-026
  milestone: m4
  title: Replace the text-button fishing panel with a real timing minigame
  status: ready
  gate_human: false
  owner: worker
  stakes: reversible
  passes: 0
  note: >-
    Silas, 2026-09-11, twice: "The fishing game aspect should be a sliding animation that requires
    stopping in the green for optimal percentage chance. These things should be visual, not text
    based" and "as mentioned, on the line section should be visual experience."

    Today "ON THE LINE" is a text panel: species name, rarity line, a prose cue, two labelled
    progress bars (Landing progress, Line tension), and three buttons -- Reel / Give slack / Wait --
    with a footnote explaining that "Fishing is beat-based, not twitch-based." That footnote is the
    design decision he is overruling. He wants an actual skill moment.

    DO: build a sliding-marker timing bar with a target band -- the player stops it, and where it
    lands sets the outcome chance. Visual first: the bar, the band, the marker and the result should
    be legible without reading a word. Keep what is good underneath: the existing encounter model
    already has tension, progress and per-species behaviour, and the deterministic seeded resolution
    is worth preserving -- record the player's stop positions as the input sequence so a replay of
    the same seed and the same stops reproduces the same encounter. Difficulty should come from band
    width and marker speed, varied per species and rarity, so the 15-fish roster's `catchBehavior`
    strings become mechanics rather than flavour text.

    Do not simply animate the existing buttons. The complaint is that the mechanic is a menu, not
    that the menu lacks motion.
