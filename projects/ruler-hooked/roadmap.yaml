project: ruler-hooked
kind: software

goal: >-
  Ship a complete offline-playable first-person fishing and kingdom-management adventure, not merely the finished proof of concept: psychedelic rainbow fantasy, full-screen lake/map/court/gear/fishopedia, classic/quiz/Mandarin fishing, quests, meaningful ecology and economic consequences, named saves, original illustrated cast/fish/worlds/endings, and adversarial full-run and device QA. Finish at verified playtest readiness; final subjective verdict and public release remain separately gated.

notes_from_silas: |
  2026-11-06 PT (latest visual call): the Ruler Hooked game should be
  psychedelic RAINBOW fantasy, with a slight worn print / old-time texture,
  NOT ornate medieval gold trim or sepia Chronicle/Broadside chrome. Keep
  the newer illustrated handheld console structure, kingdom decay,
  intuitive fishing controls and art-first map/court decisions, but apply
  the vivid spectrum as the governing style. This supersedes older
  gold-and-vellum design briefs. Rescue PR kind_robots#4870 merged
  this direction after exact-head CI; corresponding new art still requires
  actual queue/delivery/visual verification. Master issue: #4144.

  "The Ruler is Hooked" — fishing/kingdom management simulator, told in
  slideshow format. You play the King (or Queen) (or other) of a country, but
  you don't want to rule, you just want to fish all day. Perched at the edge
  of a beautiful lake behind your castle, you fish while kingdom tasks are
  occasionally handed to you as choices that affect the environment (e.g. a
  warlock land developer vs Druid preservationists). Choices move kingdom
  health and swap specific landscape regions, merged together into one play
  screen image. Web app/app first (JavaScript + backend) as proof of concept;
  future expansion to a full Steam game via Unreal. Cartoony and goofy,
  exaggerated good/evil stereotypes with wry twists, always nuanced
  characters — think Monkey Island, Bakshi, Treasure Planet, Steven Universe,
  She-Ra. Characters use the kind_robots Character model (reuse existing when
  they fit); different characters/events appear on different runs (e.g. the
  ruler's child wants to elope). Multiple saves required. AI for assets and
  inspiration during development, but the final game is playable OFFLINE — no
  live LLM interactions. Bucket-list project.

