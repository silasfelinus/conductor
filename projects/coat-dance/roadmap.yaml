project: coat-dance
kind: content

notes_from_silas: |
  Coat Dance is an active creative content project based on Silas's experimental
  avant-garde duet with a black Goodwill trench coat, created around 2006 while
  finishing a dance major at Humboldt State University. The original piece mixed
  physical theater, object manipulation, juggling vocabulary, spins, pantomime,
  and deliberate weirdness.

  The goal is to use the original video recording as the choreographic spine for
  a hybrid AI-assisted music video. The finished piece should preserve the strange
  intimate relationship between performer and coat while expanding it with AI
  animation, perspective shifts, style changes, artistic flourishes, and remixed
  sequences. Likely tools include ComfyUI, LAX, Wan, and related video/image
  generation pipelines.

  This project needs many small planning and production steps: ingest the source
  video, break it into beats or sections, describe the movement and emotional arc,
  plan style treatments per section, generate/remap shots in Comfy-style pipelines,
  restitch the sections, sound/music-align the result, and review/export a full
  music-video cut.

creative_constraints:
- Use the original coat dance recording as inspiration and structural source, not disposable b-roll.
- Preserve the experimental physical-theater feel; do not flatten it into generic AI spectacle.
- Treat the trench coat as a duet partner, character, shadow, relic, ghost, or trickster as useful per section.
- Prefer modular tests and reversible edits before committing to long renders.
- No public posting, paid tool spend, or final release without explicit Silas approval.

assets_needed:
- Original coat dance video file.
- Any available audio or music used in the original performance.
- Desired final music track or mood reference.
- Optional still frames, program notes, or memories from the performance.
- Local tool inventory: ComfyUI workflows, LAX/Wan availability, GPU constraints, and installed video utilities.

