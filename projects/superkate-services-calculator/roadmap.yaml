project: superkate-services-calculator
kind: software
notes_from_silas: "High priority request from Superkate for Hair by Superkate.\nBuild a private appointment services calculator
  with a dark theme, purple and teal accents,\nappointment history, search by client/date, and receipt email preparation.\n\
  Required fields: client name, appointment date, hourly rate, time spent, product cost, appointment total.\nCore formula:
  hourly rate × time spent + product cost = total price.\nReference sources added by Silas: projects/superkate-services-calculator/examples/
  contains Superkate hair-work examples; her current WordPress front end is the live hairbysuperkate.com Unraid container (the local reference copy was removed, conductor/t-106)
  front end for reference and may be replaced later.\nDefault Flutter app scaffolding should include ios, android, windows,
  and linux targets going forward.\nSilas cleared the current human gates on 2026-07-08 and approved the next reversible build
  runway. First app target is Android. Receipt/contact schedule link is https://hairbysuperkate.glossgenius.com/ and reply-to
  contact is hairbysuperkate@gmail.com. Cloud sync ownership is now chosen: build a dedicated Hair by Superkate backend backed
  by Silas's self-hosted Postgres/MariaDB-capable Unraid infrastructure. Keep the Android beta local-only until durable persistence,
  export, app-lock, and fake-data backend sync are safe.\n"
