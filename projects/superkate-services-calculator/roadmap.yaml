  updated: 2026-07-07
  note: "DONE (2026-07-07, Silas-directed session): built lib/ui/new_appointment_form.dart — client name,\
    \ appointment date picker, hourly rate, time spent (hours/minutes steppers + preset chips 30m/45m/1h/1h30m/2h),\
    \ optional product cost defaulting to $0. Live appointment total recomputes on every keystroke via the\
    \ t-003 domain layer (parseDollarsToCents -> calculateAppointmentTotalCents -> formatCents) and is shown\
    \ in a total card with the formula line. Save delegates to the injected PersistenceService (total is\
    \ recalculated at save, never trusted from UI); errors are user-safe. Added parseDollarsToCents to\
    \ domain/money.dart, wired main.dart to host the form with a save confirmation snackbar, and added\
    \ widget tests (boot, live-total updates from rate+preset+product, save persists the calculated total)\
    \ plus money parser unit tests. VERIFICATION GAP: no Flutter toolchain here, so flutter test/analyze\
    \ not run — verified by inspection; see t-014 (run flutter create + flutter test in a toolchain env).\n"
