    \ is minutes, totals are always recalculated, customer delete detaches (not cascades). VERIFICATION\
    \ GAP: no Dart/Flutter toolchain in this environment, so `flutter test` was NOT run here \u2014 logic\
    \ was verified by inspection and the tests are written to pass. Silas/CI should run `flutter test`\
    \ from apps/superkate-services-calculator/ to confirm. Follow-on: a durable SQLite adapter behind\
    \ the same PersistenceService interface. Unblocks t-004 (calculator form) and t-005 (search) via resolve_deps.\n"
