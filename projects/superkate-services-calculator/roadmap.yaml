project: superkate-services-calculator
kind: software
notes_from_silas: |
  High priority request from Superkate for Hair by Superkate.
  Build a private appointment services calculator with a dark theme, purple and teal accents,
  appointment history, search by client/date, and receipt email preparation.
  Required fields: client name, appointment date, hourly rate, time spent, product cost, appointment total.
  Core formula: hourly rate × time spent + product cost = total price.

milestones:
  - id: m1
    title: Project identity and MVP spec
    weight: 20
    status: in-progress
  - id: m2
    title: Customer database, sync, and calculator
    weight: 35
    status: not-started
  - id: m3
    title: Search and receipt email flow
    weight: 30
    status: not-started
  - id: m4
    title: Polish and handoff
    weight: 15
    status: not-started

tasks:
  - id: t-001
    milestone: m1
    title: Create the matching PROJECT Dream for slug parity
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Run scripts/sync_projects_to_dreams.py or create the Dream via the kind_robots API so
      kind_robots has a PROJECT Dream with slug "superkate-services-calculator", priority HIGH,
      projectStatus ACTIVE, and the friendly title "Superkate Services Calculator".
      This is the display/identity record for the app.

  - id: t-002
    milestone: m1
    title: Review and finalize the MVP spec with Superkate
    status: needs-human
    owner: null
    passes: 0
    stakes: reversible
    gate_human: true
    approved_by_human: false
    note: >
      FOR SILAS/SUPERKATE: Review projects/superkate-services-calculator/SPEC.md.
      Silas has decided hours/minutes with preset chips, optional product cost defaulting
      to zero, a customer database with stored email for repeat clientele, warm receipts
      including "Superkate loves you!", cloud sync as an initial beta expectation, optional
      app/device lock, receipt contact details as configurable salon/contact fields, delete/edit
      plus CSV export for paid v1, and backend direct-send receipts as future-only. Set
      approved_by_human: true and status: done when Superkate/Silas approve the whole spec.
      Unblocks implementation tasks.

  - id: t-009
    milestone: m1
    title: Add paid-app customer data security baseline to the MVP spec
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: 2026-07-04
    note: >
      Added an explicit customer data security baseline to SPEC.md covering data minimization,
      local-first storage, safe receipt behavior, deletion/export expectations, and paid-app release gates before appointment persistence begins.

  - id: t-011
    milestone: m1
    title: Record Silas's beta product decisions in the MVP spec
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    updated: 2026-07-05
    note: >
      Updated SPEC.md and roadmap notes from Silas's feedback: hours/minutes with preset chips,
      product cost optional defaulting to zero, customer database and email storage as a reasonable
      local-business feature, cloud sync as an initial beta expectation, warm receipts with
      "Superkate loves you!", and optional app/device lock.

  - id: t-012
    milestone: m1
    title: Record Silas's final open-question approvals in the MVP spec
    status: claimed
    owner: worker
    passes: 0
    stakes: reversible
    updated: 2026-07-05
    note: >
      Record Silas's approval of the remaining recommendation package: configurable receipt
      contact fields, app-lock onboarding prompt with settings toggle, appointment deletion,
      customer edit/delete, cloud sync backup, CSV export in paid v1, no bulk delete in v1,
      and backend direct-send receipts as a future roadmap option rather than beta behavior.

  - id: t-003
    milestone: m2
    title: Build the appointment and customer data model with persistence
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on:
      - t-002
      - t-009
      - t-010
    note: >
      Implement Appointment and Customer models. Appointment stores customerId/clientName snapshot,
      appointmentDate, hourlyRateCents, timeSpentMinutes, productCostCents, appointmentTotalCents,
      createdAt, and updatedAt. Customer stores name and optional email for repeat clientele.
      Money must be stored as cents and totals calculated from inputs. Follow SPEC.md's customer
      data security baseline and the cloud-sync architecture note.

  - id: t-004
    milestone: m2
    title: Build calculator form with live totals
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-003
    note: >
      Add the new appointment form for client/customer, appointment date, hourly rate, time spent,
      and optional product cost defaulting to $0. Show the live total as hourly rate × time spent
      + product cost.

  - id: t-005
    milestone: m3
    title: Add client/date appointment search
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-003
    note: >
      Add searchable appointment history with client-name search and date filtering.
      Results should show client, date, and appointment total.

  - id: t-006
    milestone: m3
    title: Add warm receipt email composer
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on:
      - t-004
      - t-005
    note: >
      Add a receipt action that opens an email composer with customer email prefilled when known,
      client name, appointment date, hourly rate, time spent, product cost, total price, the formula
      line, and the slogan "Superkate loves you!" Backend direct-send remains a separate approval.

  - id: t-007
    milestone: m4
    title: Polish the dark purple/teal salon UI
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-006
    note: >
      Make the app feel polished and salon-friendly with a dark base, purple and teal accents,
      clear touch targets, calm spacing, and receipt screens that look professional.

  - id: t-008
    milestone: m4
    title: Prepare handoff checklist without store submission
    status: waiting
    owner: null
    passes: 0
    stakes: outward-facing
    gate_human: true
    approved_by_human: false
    depends_on: t-007
    note: >
      Prepare a handoff checklist for device install/test, data backup expectations, privacy notes,
      customer data security review, cloud-sync readiness, and app-store readiness. Do not submit
      to any app store without explicit human approval.

  - id: t-010
    milestone: m2
    title: Write a pre-implementation architecture note for customer database and cloud sync
    status: waiting
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-002
    note: >
      Once Superkate approves the MVP spec, write a short architecture note selecting the customer
      database, appointment storage, cloud sync approach, auth/tenant model, conflict handling,
      backup/export path, and optional app-lock/device-auth approach required by SPEC.md before
      coding appointment persistence (t-003). Scope is a decision record, not implementation.
