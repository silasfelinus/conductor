  note: "Implemented in apps/superkate-services-calculator/ (Silas-directed session 2026-07-07). The prior\
    \ handoff wrongly parked this as \"cannot locate the app repository\" \u2014 the Flutter app is in-repo\
    \ at apps/superkate-services-calculator/, so the domain + persistence layer was built directly there\
    \ against the SPEC.md data model: - domain/money.dart (cents/minutes math, appointment-total formula,\
    \ display formatting),\n  domain/validation.dart (user-safe validation), domain/ids.dart (sync-ready\
    \ local ids);\n- models/customer.dart, models/appointment.dart (immutable value objects, toMap/fromMap);\
    \ - data/persistence_service.dart (interface + input/filter types),\n  data/in_memory_persistence_service.dart\
