project: brainstorm
kind: software
goal: >-
  Restore Brainstorm as a first-class Kind Robots creative ideation tool at /brainstorm:
  pitch -> generate diverse candidates -> keep/edit/reject/regenerate -> save and reuse,
  with object-aware prompt variation and optional Krea2-backed art generation after the
  text experience is excellent.
notes_from_silas: >-
  Brainstorm is one of the earliest and most personally meaningful LLM services on Kind
  Robots. It predates most of the current site and should recover its playful, useful soul:
  riddles, absurd fictional facts, terrible ice-cream flavors, dark-comedy improv, creative
  lists, practical idea generation, and variations for Kind Robots objects. The historical
  page let people enter a pitch, ask for X responses, keep/edit selected results, save them,
  or request replacements. Restore that contract before expanding it. Text comes first.
  Later, support art-prompt brainstorming and optional art generation using the normal
  durable ArtJob pipeline with current Krea2 defaults. Canonical route is /brainstorm;
  /plan/brainstorm should resolve to the same product. Do not turn this back into a Dream
  gallery. Do not let the internal Conductor proposal generator redefine the public product.

