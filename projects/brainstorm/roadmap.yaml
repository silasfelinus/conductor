project: brainstorm
kind: proposal
notes_from_silas: >
  Generate ideas for me to vote on. I want to log in and see things like: 5 STL
  project ideas, 5 comic pitches under the genre guidelines I gave, lists of
  potential revenue streams, and ways to improve AI_Networker. QUALITY OVER
  QUANTITY — a few strong, specific, buildable pitches beat a pile of vague ones.
  Respect my genre and direction guidance in CONTROL.md. Tie product ideas to our
  approved product types where relevant. Most importantly, do not pitch work that
  already exists as a project, roadmap task, shipped feature, archived pitch, or
  obvious extension of an active project. Existing work belongs in that project's
  roadmap or kaizen queue, not back in the pitch inbox wearing a fake moustache.
pitch_policy:
  max_new_pitches_per_cycle: 3
  max_open_awaiting_pitches: 6
  dedup: true
  dedup_sources:
    - pitches/*.md regardless of status
    - projects/*/roadmap.yaml project goals, waypoints, tasks, and notes
    - STATUS.md active project inventory
    - known kind_robots routes, stores, APIs, and shipped dashboard features
  existing_work_action: >
    If an idea overlaps an existing project or shipped feature, do not create a new
    pitch. Either skip it, or add a clearly scoped task/kaizen to the existing
    project when the idea contains a genuinely new increment.
  required_pitch_sections:
    - The idea
    - Why it's worth doing
    - Rough effort
    - Suggested first task
    - Existing-work check
  categories:
    - new-products
    - content-series
    - revenue-streams
    - ai-networker-upgrades
    - cross-project
milestones:
  - id: m1
    title: Idea engine running and producing votable pitches
    weight: 0
    status: in-progress
