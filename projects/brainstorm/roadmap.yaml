  - id: t-012
    milestone: m3
    title: Define reusable source-object context adapter
    status: done
    depends_on:
      - t-005
      - t-006
    updated: '2026-08-12T21:40:00Z'
    passes: 0
    stakes: reversible
    implementation_pr: 'silasfelinus/kind_robots#1820'
    note: |-
      Create an explicit, inspectable adapter contract for brainstorming from Kind Robots entities. The user sees the selected source object and can remove it. Start with Character and Dream and design the contract so Scenario, Reward, Bot, Project and Prompt can follow without bespoke endpoints. Limit context to relevant canonical fields and avoid leaking private data across ownership/visibility boundaries.

      REVIEW REJECTED (quality) on Kind Robots PR #1820 exact head 8582736a5eada206391a3c4511469bed9d05a5a5. Character source resolution can reuse a cached/localStorage Character without a fresh server visibility check because fetchCharacterById(ref.id) defaults to force=false; resolve must revalidate authorization before displaying source data. The async source watcher also lacks invalidation/request identity, so a slower old resolve can resurrect a removed or superseded source card. All 21 GitHub Actions on the head passed, but the separate Vercel status remains failure: Account is blocked. Fix these defects on the existing PR branch and rerun exact-head checks; do not bypass the Vercel account gate.

      FOLLOW-UP REVIEW REJECTED (quality) on Kind Robots PR #1820 exact head c8b4d4818a670238ba7d9b5a4fd6b5cb191fde78. The prior privacy revalidation and selected-source resolve race are fixed, but runSourceSearch still has no request-identity guard: a slower earlier search can overwrite a newer search's results and clear isSearchingSource while the newer request is still in flight. Add a search token/captured request identity so only the latest search may write results or clear loading state, with regression coverage. All 21 attached GitHub Actions completed successfully on this head. Separate Vercel status remains failure because the account is blocked; do not bypass that gate.

      FIX PUSHED 2026-08-12 to Kind Robots PR #1820 exact head bd82875: added sourceSearchToken (mirrors the existing sourceResolveToken pattern) so runSourceSearch drops a stale search's results and no longer clears isSearchingSource out from under a newer, still-in-flight search. vue-tsc/eslint/prettier clean, verifyBrainstormSourceAdapters.test.ts extended with the new guard's assertions and passes, verifyBrainstormWorkbench.mjs/verifyBrainstormStoreContract.mjs/test:workflow-paths unaffected. Awaiting re-review; merge still blocked separately on kind-robots/t-064 (Vercel account gate).

      FOLLOW-UP REVIEW REJECTED (quality) on Kind Robots PR #1820 exact head bd8287580ed567b057fa2292ee11145fe375ff0c. The sourceSearchToken race fix is correct and all 21 attached GitHub Actions completed successfully, but Character search still calls fetchCharacters() with its default force=false. characterStore short-circuits to persisted/in-memory characters when hasLoaded is true, so after an auth transition the Brainstorm source picker can still list stale Character rows the current session may no longer be authorized to view. Force a fresh authorized Character list fetch for search (or equivalent server-authorized search path) and add regression coverage. Separate Vercel status remains failure: Account is blocked; do not bypass that gate.

      FIX PUSHED 2026-08-12 to Kind Robots PR #1820 exact head e7272c6: characterAdapter.search now calls store.fetchCharacters(true) instead of the unforced default, so the source picker can no longer surface a pre-auth-transition cached Character list -- same staleness class as the resolve() fix, just on the search path. Confirmed Dream's fetchDreams()/fetchDreamById() have no equivalent hasLoaded cache short-circuit, so no analogous fix was needed there. vue-tsc/eslint/prettier clean on changed files; verifyBrainstormSourceAdapters.test.ts extended with a regression assertion and passes; verifyBrainstormWorkbench.mjs/verifyBrainstormStoreContract.mjs/test:workflow-paths/verifyCaptureGroupGuards.ts all clean. Awaiting re-review; merge still blocked separately on kind-robots/t-064 (Vercel account gate).

      FOLLOW-UP REVIEW REJECTED (quality/privacy boundary) on Kind Robots PR #1820 exact head e7272c618476d38e9e9cca84edfc7cbc4e2423a5. Character search now calls fetchCharacters(true), but characterStore.fetchCharacters() catches failed revalidation and returns the existing persisted characters array; the adapter then searches store.characters anyway. An expired/unauthorized/network-failed forced fetch can therefore still surface stale private Character rows. Make the Brainstorm Character picker fail closed on unsuccessful fresh authorization (prefer adapter-scoped handling rather than changing global offline fallback semantics unless audited) and add a regression proving a failed forced fetch yields no cached candidates. All 21 attached GitHub Actions passed on this head. Separate Vercel status remains failure: Account is blocked; do not bypass that gate.

      CORRECTION TO THE 2026-08-12 e7272c6 REVIEW NOTE: the failed-fresh-fetch privacy issue affects both list adapters, not only Character. Character fetchCharacters(true) returns the existing persisted characters array on request failure, and characterAdapter.search then reads store.characters. Dream fetchDreams() returns [] on request failure but leaves store.dreams intact, and dreamAdapter.search ignores the returned fresh array and reads store.dreams instead. Thus either picker can surface stale pre-auth-transition rows when fresh authorization/list retrieval fails. Make both Brainstorm source searches fail closed on unsuccessful fresh retrieval and add regression coverage with preloaded cached rows plus failed fetches, asserting zero candidates. PR #1820 exact head e7272c618476d38e9e9cca84edfc7cbc4e2423a5 remains Actions-green but separately blocked by Vercel Account is blocked.

