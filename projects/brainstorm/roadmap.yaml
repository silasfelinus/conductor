    retry_context: >
      pass 1 failed (quality): kind_robots PR #1714 (worker/brainstorm-t-007-a7d4) has two
      real, distinct CI failures on components/brainstorm/brainstorm-candidate-card.vue --
      not transient, both reproduced from the uploaded diagnostics.
      (1) TypeScript (exit 2): lines 130 and 140 (the toggleKeep/toggleReject `@click`
      bindings) -- `error TS2769: No overload matches this call` on `emit('reset')`/
      `emit('keep')` and `emit('reject')`/`emit('reset')`, with the reported expected type
      collapsing to the *last* `defineEmits<{...}>()` member (`'branch'`) instead of the
      matching one. This is TypeScript's known limitation resolving many-member shorthand
      `defineEmits<{ eventA: []; eventB: []; ... }>()` overloads inside a plain function body
      referenced (not inlined) from a template `@click` -- worth trying a single discriminated
      call signature (e.g. `(e: 'keep' | 'reject' | 'reset' | 'delete' | 'regenerate' | 'branch') => void`
      plus separate overloads only for `edit`/`feedback`'s payload) instead of one property per
      event, or inlining the emit call directly in the template handler.
      (2) Contract verifiers (`audit:wonderlab-previews --strict`, exit 1): the new
      brainstorm-candidate-card.vue is "newly missing preview-fixture coverage since the
      baseline" (missing fixture prop `candidate`) -- add a preview fixture for `candidate`
      (and any other required props) or an explicit skip reason per the WonderLab preview
      audit's existing allow-list convention; the allow-list only shrinks, so this can't be
      left uncovered.
      All 13 other checks on the PR are green. Branch/PR left open for the retry -- fix on
      the same branch, don't open a new PR. See PR #1714 review comment for the same detail.
    note: >-
