# Pocket Pet Robot — free-to-play, built in kind_robots. Architecture in DESIGN-BRIEF.md.
project: pocket-pet-robot
kind: software
goal: A tiny virtual pet you adopt, name, feed, play with and put to bed, whose mood sprites and room
  scenes are all pre-generated and whose state lives in your own browser. It grows through three forms
  over a couple of weeks of casual visits and never needs a server or a token.
notes_from_silas: '2026-10-02: approved by Silas from the daily pitch docket (individually confirmed 2026-10-02). Free-to-play:
  no LLM at runtime; sessions pre-author content and art.

