# Pocket Pet Robot art round 1 (t-010 first content slice and art; docs/spec.md section 7 sprite and scene manifest).
# The spec fixes the art: 3 forms x 8 moods = 24 sprites (512x512, transparent, one consistent design per form) and
# 6 room backdrops (1600x900: kitchen, bedroom, playroom, garden, workshop, rooftop). No character design exists yet, so
# this round queues the parts that unblock everything else and nothing that depends on a pick:
#   - FORM KEYS: sprout, buddy and champion as one growing robot (same palette, outline weight and chest light), on
#     flat white for matting, Krea 2 and Z-Image. The 8 moods per form are a Kontext round from the picked keys, so
#     the design holds across moods (the croc/Pip key-pose recipe).
#   - ROOMS: all six day backdrops, unpeopled, at 16:9 (1344x768, upscale on export to 1600x900). Night and care-state
#     variants (t-007) follow from the picked rooms.
# Krea 2 contract: physical subject first, no negations (ART-PROMPTS.md). Private; auto_submit: true.
