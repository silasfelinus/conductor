project: superkate-hairstyle-ai
kind: software

notes_from_silas: |
  Surprise feature for Hair by Superkate — a "Hair Studio" tab. Superkate uploads/snaps a
  client photo, picks color / style / enhance (any combination), and it comes back with the
  new hair via the Kind Robots Kontext Comfy backend. Loading indicator while it works, but
  the app must stay navigable while waiting. Per-client before/after gallery.

  Superkate-only for now — don't over-index on security until we plan the public launch. It
  would eventually gate behind a service charge + free trial, and might become a separate app.
  Keep it a SURPRISE: do not reveal it in anything Superkate can see until Silas says go.

  Sibling of superkate-services-calculator; the calculator's customer profile is the client
  identity anchor. Backend already exists (POST /api/comfy/kontext/generate) — MVP is frontend
  + prompt building + gallery, no backend build. See DESIGN-BRIEF.md.

  Collab: ChatGPT (Worker) builds, Claude (Reviewer) reviews and hard-gates every step toward
  charging money / going public / touching real client data at scale.

milestones:
