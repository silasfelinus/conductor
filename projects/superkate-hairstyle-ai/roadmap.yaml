    title: "SHAPE — brief, backend contract, prompt design"
    weight: 25
    status: in-progress

  - id: m2
    title: "BUILD — tab, intake, controls, async generate, gallery"
    weight: 50
    status: in-progress

  - id: m3
    title: "POLISH & SHIP — states, monetization plan, launch gate"
    weight: 25
    status: not-started

