project: storymaker
kind: software
notes_from_silas: 'Build the collaborative storytelling experience layer on top of the existing Kind Robots models. Support guided adventure and limited-visibility collaboration modes with async-first play, branching choices, custom inputs, rewards, inventory, and reusable story state. Boundaries with Da Vinci (see projects/davinci/docs/storymaker-boundary-comparison.md): no shared run/session tables, no columns added to Life* models — shared behavior only through existing Kind Robots models (Bot, Chat, Character, Dream, Scenario, ArtCollection, Milestone) or extracted pure utilities. Respect this when designing the session schema.'
