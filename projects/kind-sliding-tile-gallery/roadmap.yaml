# Copy this folder to projects/<your-project>/ to add a project.
# Default scaffold per PROJECT-CREATION.md (approved by Silas 2026-07-04):
# three milestones — SHAPE / BUILD / POLISH & SHIP — with a NON-BLOCKING scope
# gate. Agents build the design brief and start working immediately; scope
# confirmation runs in parallel as a soft needs-human. Two-word slugs preferred.
project: kind-sliding-tile-gallery
kind: software
goal: "A free, no-LLM sliding-tile puzzle toy where solved boards reveal pre-generated Kind Robots art with pre-written captions, a local keepsake wall, and a daily seeded board."

notes_from_silas: |
  Steering notes. Agents read this first.

milestones:
  - id: m1
    title: "SHAPE — outline, brainstorm, design brief"
    weight: 25
    status: not-started

  - id: m2
    title: "BUILD — actualize, adjust, test"
    weight: 50
    status: in-progress

  - id: m3
    title: "POLISH & SHIP — aesthetics, performance, delivery"
    weight: 25
    status: not-started

tasks:
  - id: t-001
    milestone: m1
    title: "Write the design brief and start building"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Take the idea and run: write DESIGN-BRIEF.md (what it is, who it serves,
      the creative direction, MVP shape), then immediately create and claim the
      first BUILD tasks. Do NOT wait for scope approval — that's t-002, and it
      runs in parallel.

  - id: t-002
    milestone: m1
    title: "Confirm scope with Silas"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    # AGENTS.md, "Hard vs soft needs-human": scope gates on NEW projects are soft
    # (Silas, 2026-07-04) -- the whole point of this task is that it runs in
    # parallel and blocks nothing. Without soft_gate, audit_human_gates.py
    # classifies it `[hard]` and it reports to Silas as a blocker every session.
    soft_gate: true
    note: >
      FOR SILAS: soft checkpoint, nothing is blocked on it. Read DESIGN-BRIEF.md
      and confirm or redirect the scope. Development is already underway; if you
      redirect, agents fold your correction into the roadmap and keep moving.
      (Outward-facing/irreversible steps still hard-gate as always.)

  - id: t-003
    milestone: m2
    title: "Ship one 3x3 board with move counter, solved-reveal screen, keepsake wall and daily seeded shuffle"
    status: done
    passes: 0
    stakes: reversible
    note: |-
      First slice from the approved pitch (pitches/2026-10-11-kind-sliding-tile-gallery.md). No LLM at runtime; captions and art are pre-authored. Keepsake wall saved in localStorage.


      First actual private puzzle implementation staged in Kind Robots, with deterministic solvable daily and practice boards, move count, solved postcard, local keepsakes, admin-gated discoverable route and contextual tutorial. Pure verification added. Public publishing remains gated and final artwork is not claimed delivered.

      Kind Robots PR #3658 merged as 1f744988a0e9941b882606f02005487980ff693f after repairing three Prettier-ratchet files and replacing the duplicate admin gallery icon with the existing unique gridsquare icon. Confirmed all 34 final-head GitHub Actions workflows completed successfully, including Contract Tests, icon audit, TypeScript and container build. Admin-only prototype is merged; final art/public release remain separate.
    claimed_by: 2026-10-14T013100Z-sliding-tiles-t003-gpt6-64ad
    claimed_at: '2026-10-14T01:31:00Z'
    updated: '2026-10-14T02:52:00Z'
  - id: t-004
    milestone: m2
    title: "Build an actual admin-only interactive preview"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    source_pitch: "pitches/2026-10-11-kind-sliding-tile-gallery.md"
    note: "Implement the first executable interaction under an /admin/ route, with an ADMIN tab, contextual tutorial, server authorization, and targeted tests. A scaffold or status URL is NOT a preview. Pitch: A sliding-tile puzzle toy where each solved board reveals one piece from a pre-generated gallery of Kind Robots art, with captions written ahead of time. Boards grow from three-by-three to five-by-five, and every solve fills a keepsake wall saved locally, with a daily seeded board for a shared challenge."
  - id: t-005
    milestone: m3
    title: "Polish, verify and request explicit Play promotion"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    source_pitch: "pitches/2026-10-11-kind-sliding-tile-gallery.md"
    note: "Review phone/tablet/desktop usability, art relevance and functional checks. Only after a working build and owner approval may a public /play route launch; publishing and outward-facing operations remain human-gated. Pitch: A sliding-tile puzzle toy where each solved board reveals one piece from a pre-generated gallery of Kind Robots art, with captions written ahead of time. Boards grow from three-by-three to five-by-five, and every solve fills a keepsake wall saved locally, with a daily seeded board for a shared challenge."
    depends_on: t-003
