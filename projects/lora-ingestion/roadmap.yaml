project: lora-ingestion
kind: infrastructure
goal: >
  Keep LoRA/checkpoint files automatically represented as canonical Kind Robots Resource
  records, browsable/downloadable from the unified library, and prove Resource-localPath
  selection reaches real generation end-to-end before closing this now-nearly-complete project.
notes_from_silas: |
  Auto-import LoRAs: drop a file into Lora/import on the home box
  and have it detected, sorted into <Base>/<SFW|NSFW>/, and registered as a
  kind_robots Resource with no manual input. Then a front-end browser (My Library
  + Discover tabs) to browse/manage owned LoRAs and download new ones from
  Civitai/CivArchive, with maturity + base-model filters, hide-owned, and
  update-to-new-version. Builds on the completed lora-catalog sort/import work.
