- id: t-001
  milestone: m1
  title: Resolve enqueue LoRA to Resource.localPath (never bare name)
  status: done
  owner: worker
  stakes: reversible
  note: 'Landed on kind_robots main as server/utils/artLoraResource.ts
    (resolveEnqueueLoraResource) — resolves loraResourceIds/loraName to a LoRA
    Resource, sets loraName = localPath, and 409s when a Resource has no
    localPath. This is the server side of the ume_classic_impressionist bug.'
- id: t-002
  milestone: m2
  title: Build the watched-folder LoRA import agent
  status: done
  owner: claude
  stakes: reversible
  note: 'conductor/ops/home-server/lora_import_agent.py — stdlib poller; on a
    stable drop it runs kind_robots scan_loras.py (--organize move) then
    import_catalog.py --upsert. Runs embedded as a daemon thread inside kr-relay
    (relay_media_agent.start_lora_watcher) — one process/token/log, watcher and
    render loop cannot stall each other. Host: the pm2 render box (alexandria is
    a locked-down NAS; SMB is case-insensitive so Windows moves are safe post
    case_merge). Verified live 2026-07-28 with ume_classic_impressionist
    (detected Flux, moved, Resource created:1); Civitai flagged it nsfw so it
    sorted NSFW — override to SFW via scan --overrides if wrong.'
