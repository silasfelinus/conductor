project: ecosystem-map
kind: software

notes_from_silas: |
  Build an ecosystem-level map of Kind Robots projects so agents reuse shared layers instead of rebuilding the same concepts in parallel. Each project should have inspiration images, mock screenshot concepts, a title image, and a matching Manager or Assistant bot connected to the project Dream. Manager bots should use the existing bot/image framework: generated avatar plus twenty thin portrait emotion/action images, tied into narrator topics and threads so project-specific navigation can be customized without inventing a second menu system.

  Art generation should be request-rich but approval-gated. Populate the generator queue aggressively with high-quality prompts and metadata, but treat generated images as candidates until Silas approves them. Do not promote generated candidates into canonical project, gallery, Dream, or Bot image slots automatically.

  Front-end surface rule (Silas, 2026-07-10): most active product, content, game, and creative-tool projects should have a useful page inside Kind Robots, even when their deeper implementation lives elsewhere. Every PROJECT Dream should use its existing liveUrl as the canonical launch pointer. The individual project view must expose that link prominently as an Open Project action or tab. Infrastructure-only projects may be explicitly classified as internal rather than receiving fake placeholder pages.

  Tab placement rule (Silas, 2026-07-10): a user-facing project without a stitched front end should receive a tab in the most appropriate EXISTING Kind Robots channel. Search for an existing tab/route first and never duplicate a working surface. WonderLab (`wonder`) is the fallback when no other channel fits honestly. Creating a new top-level channel remains a human-gated exception, not the default response to a new project. Follow TAB-INTEGRATION.md for placement, implementation, and verification.

