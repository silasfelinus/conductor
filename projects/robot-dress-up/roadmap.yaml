# Robot Dress-Up Workshop — free-to-play, built in kind_robots. Architecture in DESIGN-BRIEF.md.
project: robot-dress-up
kind: software
goal: A paper-doll workshop where you pick a robot body and layer on pre-generated hats, arms, antennae,
  paint jobs and accessories, save the result to your device and download it as a sticker. Pure client-side
  layering, with parts that snap to anchor points so nothing needs generation.
notes_from_silas: '2026-10-02: approved from the daily pitch docket ("I like all proposals"). Free-to-play:
  no LLM at runtime; sessions pre-author content and art.

  '
