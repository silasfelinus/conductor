# Save the Plumber — original 8-world platformer campaign, Silas 2026-10-11 PT.
project: save-the-plumber
kind: software
autonomous: true
goal: >-
  Build a full original browser platforming adventure in the Kind Robots
  Arcade in which a randomly generated young adult woman sets out to
  rescue her plumber boyfriend. Eight visually distinct authored worlds
  with at least four substantial stages apiece (32 total), eight world
  bosses, hidden exits and rewards, original memorable foes, responsive
  platforming, layered levels, meaningful powerups and abilities,
  varied traversal and puzzle-combat encounters, checkpoints, secrets,
  introductory sequence, world interludes, ending and credits. Target
  campaign length, level design and depth comparable to Super Mario Bros 3
  and Super Mario World (Gen-2 bar, 2026-10-22), with walkable world maps,
  secret exits, persistent save slots and more original world and enemy variety. Reuse Arcade
  plumbing where appropriate; no runtime LLM or borrowed Nintendo IP.
  Completion requires whole-campaign play, fairness metrics, visual
  acceptance and Silas's hands-on verdict.
notes_from_silas: |
  2026-10-11 PT: "Save the Plumber. A riff on super Mario bros 1 and 2.
  Play as a random young woman going through 8 worlds to save her
  plumber boyfriend. Again, equivalent length and challenge to
  original Mario bros, but with more variety and unique enemies."

  2026-10-22 PT, confirmed (verbatim): "I meant 2d. super mario world should be the
  benchmark for save the plumber. or any of the later 2d mario wonder level games. I
  authorize all projects to get them to wonderful states." Benchmark: Super Mario World,
  with later 2D Marios (Wonder) as fair targets; 2D stays.

  2026-10-22 PT, concept evolution (verbatim): "save the plumber (and zuzu ghost
  trail, even though it's not high priority) needs a concept evolution. i was saying
  the games needed an old school mario bros / ghosts and goblins vibe, but they need
  to aim for super mario bros 3 / super mario world for level design, gameplay
  conception, gameplay depth, etc. The games should have persistent save states, long
  form exploration, etc. ... games should have memory, recognize progress, etc. So we
  need open world maps, save states, etc. And probably upgrades to pixel expectations
  and other factors. they need an upgrade." And: "we will need animations if we are
  upgrading our platformers to n64 level expectations. which we now are." The shared
  bar is projects/kr-arcade/GEN2-STANDARD.md; milestone m6 carries it. The 32 Gen-1
  stages are raw material for Gen-2 worlds, not a reason to call Gen-2 done.

  Treat the heroine as a generated young ADULT woman, with coherent
  appearance/name established once per run (not shuffled per level).
  Her playable silhouette and hitbox remain consistent and legible;
  appearance is cosmetic, never an unwanted randomized disadvantage.
  Inspired by the originals' kinetic precision, secrets and
  enemy-toy creativity, but all cast, visual assets, sounds,
  mechanics combinations, stage layouts and world writing are original.
  This is an authored campaign, not randomly generated obstacle tiles
  or an endless score chase. Show private /admin/save-the-plumber
  in requiredRole ADMIN nav, then public /play and Arcade only with
  explicit publication approval. Source work and internal art may begin.
