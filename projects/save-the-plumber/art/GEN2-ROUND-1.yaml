    3d render, blurry, low quality, collage, grid, multiple panels, border, frame, characters, people, creatures
  prompt_prose: 'A charming storybook overworld map of Bluebell Pipeworks, seen from a high three-quarter angle
    like a hand-painted board game: rain-washed garden courtyards of teal copper pipes, brass valve wheels and bluebell
    beds. A winding sandy footpath links seven round empty clearings where levels sit, crossing little bridges and
    climbing hills; a squat brick pump tower stands at the far end as the fortress; a small cottage sits beside
    the path; one narrow overgrown side trail slips behind a waterfall to a hidden clearing. cerulean, apricot and
    emerald palette, soft morning light, deliberate empty space on each clearing for game markers, unpeopled, every
    surface bare and unmarked, modern storybook side-scrolling platformer art, lavish hand-painted animation background,
    soft painterly brushwork, clear readable shapes, warm saturated colour'
