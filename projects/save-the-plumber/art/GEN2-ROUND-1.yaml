# Save the Plumber Generation 2 art, round 1 (Silas 2026-10-22 PT: "aim for Super Mario Bros 3 / Super Mario World
# for level design ... open world maps, save states ... we will need animations"). See projects/kr-arcade/GEN2-STANDARD.md.
# Per world: an overworld map plate (seven empty clearings for level nodes, a fortress, a cottage, one hidden side
# trail), a far-sky parallax plate and an arrival vista. Plus the four new level types (fortress, Hush House haunted
# maze, Valve Chapel switch palace, Upstream Sky special zone) and eight white-ground key poses of Pip that GEN2-CLIPS
# will animate with WAN first/last-frame clips (the zuzu-pinball T019 croc recipe). Two lanes to pick from.
# auto_submit: true -> scripts/sweep_art_ledgers.py submits and refreshes this ledger on every Auto Art Generate run.
# Queued is not rendered; rendered is not shipped. Private.
