# Save the Plumber Gen-2 map motion, round 1 (Silas 2026-10-22 PT: the map should be animated, not a still).
# Each world's reviewed Krea 2 map plate (GEN2-ROUND-1, ArtImages 251323-251344) becomes a seamless WAN 2.2
# first/last-frame loop (same frame at both ends): water, waterfalls, flags, lanterns and clouds move while every
# path and clearing stays put, so the map nodes stay on their clearings. Exported as H.264 MP4 to kind_robots
# public/save-the-plumber/maps/world-N.mp4 and drawn as a looping video under the map (the still plate is the
# fallback). auto_submit: true. Private.
