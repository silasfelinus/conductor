project: hybridizer
kind: software
autonomous: true
goal: >-
  Build a beautiful one-screen hybrid creation laboratory in Kind Robots where
  people can fuse any two illustrated ingredients, use prior hybrids as inputs,
  browse shared permanent discoveries, add their own accessible art, and continue
  playing while missing combinations are generated in the existing ArtJob queue.
  Ship 200 curated starting ingredients, an audited 4000-image pre-generation
  campaign, deterministic global pair matching, original hybrids with provenance,
  accessible animation and status notifications; finish only after adversarial
  functionality and rendered mobile/tablet/desktop checks and subjective design approval.
notes_from_silas: |
  2026-10-28 PT: New Conductor front-end project Hybridizer. Begin with 200 animals
  plus playful extras (fruit such as banana and concepts such as zombie/vampire).
  Curate 200 total initial concepts; about 4,000 pre-generated combinations initially.
  Let players choose two concepts and trigger a fusion animation that reveals the
  illustrated hybrid. Let users contribute images, share past matches and remix
  already-hybridized creations; immediately reuse globally cached matches.
  Generation misses run asynchronously through the existing artwork pipeline;
  player remains able to play and receives a notification upon completion.
  Create design renderings after project registration.
  Clarification: Monsters are canonical Facet taxonomy SPECIES, not a separate
  Hybridizer taxonomy. Preserve ANIMAL for real animals; fruits are OTHER with
  groupKey fruit until a shared fruit taxonomy is explicitly introduced.
  Full 200-starter catalog is STARTER-CATALOG.json. Existing 73 animal Facet IDs
  are known but image delivery status is NOT verified.

