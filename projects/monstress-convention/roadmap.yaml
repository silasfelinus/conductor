# MONSTRIQUE (formerly MONSTREXX): mature point-and-click detective comedy, authorized 2026-11-05 PT.
# Full design: DESIGN-BRIEF.md; world, cast, eras and case: STORY-BIBLE.md. First playable dependency graph: OPENING-SLICE.md.
project: monstress-convention
kind: software
autonomous: true
goal: >-
  Develop MONSTRIQUE as an adult point-and-click murder mystery: Iris is the field protagonist; her astute germophobic boss Norb supports her; at the seedy motel smarmy franchise agent Odette and adult companion Violet are both murdered, both become ghost witnesses, and the separate Monstrique Convention Center plus joke shop, mansion and sewers unlock through city leads. Deliver a fully playable, fair-clue investigation with hotspot-and-verb puzzles, shared evidence/topic notebooks, differential dialogue, an interactive ghost witness, optional consensual flirtation, lavish hand-painted single-screen art, seeded playtests, and a guest/CHILD/mature-off-safe general edition alongside server-authorized mature extras for signed-in non-CHILD opt-in adults. The initial public Play route and dual editions were approved in kind_robots#4903; full-story visual acceptance, new public promotion and any further publication remain separately gated.
notes_from_silas: |
  2026-11-07 PT LATEST ACCESS DIRECTIVE: MONSTRIQUE is one point-and-click game with two editions. General edition is playable by guests, mature-off adults and CHILD accounts with covered, non-graphic murder aftermath, public-safe dialogue/locations/art, no sexual/romance interactions or adult scrapbook; retain all required clues, witnesses and endings. Mature extras unlock only for signed-in non-CHILD adults with persisted `showMature: true`, server-enforced on APIs and ArtImage delivery. Separate save and progress namespaces; new content defaults hidden from general until explicitly safe-listed. Keep /admin/monstrique a restricted creator studio. Public Play route and external publication await actual visual/security human approval. See DESIGN-BRIEF.md "Access and release" and kind_robots PR #4903.\n  2026-11-07 PT LATEST CAST DIRECTIVE: Draculina is an original charter member but appears about 20, younger-looking than every other star; her clique-leader/high-school mean-girl demeanor hides centuries of calculation. Siobhan MacRae (The Pack) is the second-youngest in apparent age, a Scottish former were-pop singer with an unresolved frenemy rivalry against were-panther Nyx Sable. Cleo Pappatra appears and behaves among the oldest, with real mature mummy-star gravitas. Albina / Allie Gator is NOT a never-hired wannabe: she was a billed 1963 founding Monstrique performer removed before Beach Hex, now a huge fully reptilian albino alligator hiding in the motel sewers, staging tragic old-star comebacks amid rotting memorabilia. Preserve the seven official album-era expulsions in addition to this secret pre-album erasure. See FRANCHISE-HISTORY.md and CHARACTER-LOOKBOOK.md; art prompts, dialogue, scrapbook clues must reflect this.
  2026-11-07 PT: "I like draculina for the villain. But in the last act. The mummy should be named Cleo Pappatra" — Draculina is the killer, revealed in Chapter 6 (Marta the invisible drummer is the misdirect); the mummy star is Cleo Pappatra, replacing Celestine Veil / Nefertari everywhere. See STORY-BIBLE.md "The case".
  2026-11-06 PT (Midnight City brief): Renamed MONSTRIQUE — "our newest mature point and click adventure, inspired by leisure suit Larry, monster musume, monkey island, and thimbleweed park." Midnight City; player is the assistant to the city's "premiere blogger and amateur sleuth"; the murdered agent is "responsible for Monstrique, the world's premiere Monstarr's franchise. Everyone had a reason to see her dead." Her ghost is the client, "confined to the hotel room with the prostitute she hired to dress up as a vampire and get frisky." Boss is a diminutive germaphobe who "doesn't touch things" and "continues to rebuff your advances (he's all about the case)". "A ribald adventure, full of tongue in cheek humor, sex jokes, good puzzles and low morals." Follow "the path of Monstrique over the years and rotating cast of has-been and still-has-its"; "a monster woman can be very grateful if you help her out." Full verbatim brief and expansion: STORY-BIBLE.md.
  2026-11-06 PT LATEST: MONSTRIQUE is canonical game and entertainment-franchise name (former Monstrexx display branding retired). Seven decade-accurate music/film eras 1960s–2020s, each with a distinct expelled monster, replacement, reinvention and collectible original-versus-reissue sleeve; see FRANCHISE-HISTORY.md and ALBUM-ART-REGISTER.md. Monster celebrity origin spans movies, music, modeling and NEXT idol act; Pack were-animal girl group, 2000s Monstrexxx failed marketing gimmick, motel hot-tub hopefuls including fly woman and Blobzo. Admin artist tool may grow toward art-led contextual scene creator; visual mockups are not implemented features. Generated seven album concepts exist but are not delivered ArtJobs or game gallery assets. Stable monstress-convention slug and present /admin/monstrexx route are legacy identifiers, not the product name.\n  2026-11-06 PT: User requested actual /admin/monstrexx game front page: Settings, New Game, Continue, Scrapbook. Germophobic boss should be a short, ugly, geeky COMIC character, never suave. Working displayed name Norbert 'Norb' Vale; internal character key nico left unchanged. App PR #4848. Public release remains gated.
  2026-11-05 PT REVISION (supersedes prior notes): Game/franchise display title MONSTRIQUE, not Monstrique Convention; the convention is one separate city destination, NOT the murder motel. Iris Quill is the primary field protagonist; Norb Vale is her astute ugly germophobic boss who avoids contact and rebuffs her playful flirting. Odette Harker, smarmy MONSTRIQUE agent, and adult sex worker Violet Wisp share a consensual date in a suggestive cold open; unseen killer murders BOTH with an unusual knife; BOTH return as separately interrogable ghosts. Mummy monster actress, alligator woman celebrity wannabe beneath motel, vampire mansion, occult novelty store, neighbors, ice machine, office, MONSTRIQUE acting/modeling/idol brand. Mature opt-in, no CHILD, optional consensual romance/scrapbook with non-explicit steamy art. Old Celestine-victim/Odette-killer logic is void; Gavin is never killer. Keep stable technical slug monstress-convention for continuity; user-facing title MONSTRIQUE.
  2026-11-05 PT: New Conductor project, "Monstress Convention": mature point-and-click adventure inspired by Leisure Suit Larry, Monkey Island, Thimbleweed Park and monster-girl ensembles. The setting is a seedy two-storey hotel hosting a convention of stars from a famous female-monster film/TV/franchise. Cast includes female Dracula, Francesca Stein, werewolf, slime woman, lagoon woman and giant fly-headed woman. Protagonist: scrappy, hungry journalist for a failing blog, with a smarter, attractive female assistant. Both are playable; conversations react to which asks. A cast member is murdered, then returns as a ghost who does not know the culprit. A creepy fanboy stalker is explicitly NOT the killer. Hot tub, hotel rooms and convention floor support campy adult cheesecake and puzzle scenes. Shared dynamic conversation topics, complex inventory/hotspot puzzles and a single-screen AAA console-quality interface. Only show in nav/highlights to logged-in mature-opted-in accounts without CHILD role.
