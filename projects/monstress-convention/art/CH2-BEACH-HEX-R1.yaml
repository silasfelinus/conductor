# MONSTRIQUE Chapter 2 "Beach Hex" art, general edition, round 1 (2026-11-28 PT).
# Task monstress-convention/t-022: queue the chapter's art round first (backgrounds, cast figures), then build
# the chapter. Silas gave standing permission to submit art requests. Queued is not delivered: each cell needs
# a DONE ArtJob, an ArtImage id and a verified final URL before a later worker puts it into the game, and Silas
# reviews before anything ships publicly (t-013 gate unchanged).
# Source: STORY-BIBLE.md chapter plan row 2 and act spine (featured ex-member Francesca Stein, cut 1964; her
# grudge: Odette sold her Hexblade designs as merch), Midnight City districts Hexwater Beach (Starlite Drive-In,
# where the 1964 Beach Hex films still play: the 1964 reels and prop invoices) and Bolt Street (Francesca's
# midnight science-cinema). Puzzles: the 1964 reel, Francesca's prop invoice, the scratched-out sleeve
# (FRANCHISE-HISTORY: the original Beach Hex sleeve hides a scratched-out Francesca photograph). Ends with
# Francesca's "I made five knives". Kind Robots prologue.ts already names the destination "Starlite Drive-In,
# Hexwater Beach" and the knife stamp "STARLITE PICTURES · BEACH HEX · 1964".
# Rooms (six): drive-in lot and screen, projection booth (1964 reel can on the shelf), snack bar (scratched sleeve
# in the memorabilia case), Starlite Pictures office behind the screen (prop invoice on the desk spike), the
# science-cinema lobby on Bolt Street, and Francesca's lab behind her cinema screen (the five-knife blueprint and
# the empty five-slot case). Puzzle props are placed where hotspots can sit on them. 1344x768, unpeopled, lower
# third open floor for cut-out figures, same krea2 lane and style as CH1-CAST-AND-MOTEL-R1.
# Cast: Francesca Stein (Kind Robots characterModels.ts `francesca`: pale green patchwork skin, neat stitches,
# small neck bolts, towering black beehive with white lightning streaks, lab coat over a 1960s cocktail dress,
# goggles pushed up, soldering iron) gets a full-body stage figure and a four-head expression sheet. The bible
# names no other Chapter 2 NPC, so two supporting witnesses are PROPOSED here under Silas's 2026-11-22 free
# authority over clues and scenes: Clem, the Starlite's night projectionist since 1964 (keeper of the reels),
# and Dee Dee, a bat-woman carhop at the snack bar (gossip route to the sleeve). Both are adults; the builder
# may rename or drop them. Stage figures 832x1216 full body on plain light grey.
# Spoiler rule: Draculina and any culprit stay off the art; Marta (the misdirect) too. The 1964 line-up appears
# only as unnamed surf-era monster starlets on the screen and the sleeve. General edition: is_mature false,
# comedy, adults only, fully clothed. Identity LoRAs are not trained, so cast_loras is false and every prompt
# carries full identity prose. Private. priority 60 (game art). auto_submit: true.
