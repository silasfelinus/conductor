# MONSTRIQUE Chapter 1 cast rig source art, general edition, round 1 (2026-11-28 PT).
# Task monstress-convention/t-020. The cut-out rig shipped for the leads in t-018 (kind_robots#6057) cuts layered
# parts from two images per character: a full-body A-pose (832x1216, plain flat grey, limbs clear of the body)
# and a head sheet (1344x768) of four cells in a fixed order: neutral, open ah mouth, closed-eye blink, oh mouth.
# This round asks for both images for the six Chapter 1 NPCs. Each prompt describes the delivered krea2 designs
# from CH1-CAST-AND-MOTEL-R1: Odette expression sheet 280898 and stage figure 280900, Violet 280899 and 280901,
# Marta 280902, Dolores 280903, Gavin 280904. Cleo Pappatra has no general-edition game art yet, so her cells
# follow CHARACTER-LOOKBOOK.md (living mummy, visibly one of the oldest stars, aged linen, couture, hieroglyphic
# jewelry) and her pin-up identity prose (gold-and-lapis collar, kohl-lined eyes) in a fully clothed couture look.
# Lessons from CH1-LEADS-RIG-R2 applied: each head sheet names the same skin tone, jaw and fixed props as its
# A-pose, keeps every prop (glasses, wig, sunglasses, curlers, cap) in the same place in all four cells, and draws
# the blink as its own cell with the lids as curved lash lines. The two ghosts are painted as solid opaque pale
# figures with crisp silhouettes on the flat grey so they cut cleanly; the ghost glow and float are added in
# engine. Props that animate (Gavin's long lens) are held clear of the body; Marta keeps her opera gloves.
# Marta's oversized black sunglasses are canon (she is the invisible drummer under the foundation), so her third
# cell is a slow deadpan brow dip above the lenses in place of a visible eye blink. Same krea2 lane, style and
# grey ground as R1 (Silas 2026-11-28 PT: "As usual, krea2 gives us the best designs for both."). Identity LoRAs
# are not trained, so cast_loras is false. General edition only: the lookbook calls for no mature rig. is_mature
# false, fully clothed, comedy, adults only. Private. priority 60 (game art). auto_submit: true.
