    a big round head, untidy brown hair greying at the temples, a round bulbous pink nose, grey stubble and small
    round wire spectacles with a thick magnifying left lens that makes his left eye look huge, wears a hot-pink
    T-shirt under a rumpled charcoal-grey suit jacket, a grey bow tie and bright yellow rubber gloves, and points
