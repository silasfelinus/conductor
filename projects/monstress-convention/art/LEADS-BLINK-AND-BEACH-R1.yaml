  prompt_prose: Hand-painted cinematic cutscene illustration for a 2D comedy mystery adventure game, bold ink outlines,
    painted detail, moonlit seaside palette of deep teal, silver and warm neon pink. A wide view from high above
    a winding coast road at night as a battered cherry-red 1960s convertible with its top down crests a hill. Below,
    on the cliff edge over the moonlit surf, sprawls a faded seaside drive-in, rows of speaker posts and a few old
    cars facing a giant glowing screen that shows a forty-foot rubber sea monster rising from painted waves. Beside
    the entrance a shooting-star neon sign fizzes with two of its bulbs gone dark. At the wheel on the left Iris
    Quill, a curvy woman about thirty with a big messy jet-black mane and one thick white streak whipping in the
    sea wind, gold hoops and a rose-and-plum trench coat, drives with one elbow on the door and a sly smirk. In
    the back seat on the right Norb Vale, a short stocky little person with a big round head, untidy greying brown
    hair, a bulbous pink nose, round wire spectacles with a thick left lens, a hot-pink T-shirt, a grey suit jacket
    and yellow rubber gloves, clutches a white bath towel against the wind with an annoyed scowl. Salt spray, a
    full moon and dark palm silhouettes. Breezy, eerie and funny.
