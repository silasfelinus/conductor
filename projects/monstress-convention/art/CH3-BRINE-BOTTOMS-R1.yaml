# MONSTRIQUE Chapter 3 "Brine Bottoms" art, general edition, round 1 (2026-11-28 PT).
# Task monstress-convention/t-023: queue the chapter's art round first (rooms, cast figures, an expression sheet,
# the ending plate and rig sources), then build the chapter in Kind Robots without waiting for delivery. Silas gave
# standing permission to submit art requests. Queued is not delivered: each cell needs a DONE ArtJob, an ArtImage
# id and a verified final URL before a later worker puts it into the game, and Silas reviews before anything ships
# publicly (t-013 gate unchanged).
# Source: STORY-BIBLE.md chapter plan row 3 and act spine (featured ex-member Laguna Brine, pushed out 1974; her
# grudge: Odette sold her face to Lagoon Lass Fish Sticks and, from 2017, to a licensed look-alike), the Midnight
# City district Brine Bottoms (mobile home park, bait shop and airboat dock, the Gator Bait Bar & Grill) and The
# Low End (the Velvet Crypt, a 1974 glam club turned gay bar where the licensed "Laguna" plays), and
# CHARACTER-LOOKBOOK.md "Laguna Brine and the bayou brood". Four evidence threads: the reversed 1974 songwriting
# credit (the Velvet Crypt sleeve; Laguna's gold records), the Lagoon Lass licensing statement, the 2017 look-alike
# contract (countersigned at Fang Heights; reached by Cherie's gossip or Delta's boat route) and Laguna's Hexblade
# pawned at Delta's bait shop. Ends "The Real Laguna": the Laguna on stage isn't Laguna, her contract was
# countersigned at Fang Heights, and one Hexblade is accounted for.
# Rooms (seven, 1344x768, unpeopled, lower third open floor for cut-out figures): the mobile home park (Laguna's
# porch, gold records on the skirting, the garden hose, the kiddie pool of tadpoles, the crawdad boil), the inside
# of Laguna's single-wide (Lagoon Lass freezer, statement coasters, the guitar case with the pawn ticket), Delta's
# bait and pawn shed (the pawn case with the dagger, the pawn ledger, the airboat route map, the bait freezer), the
# airboat dock, the Gator Bait Bar & Grill (the TV over the bar, the tabloid corkboard, the kitchen pass), the
# Velvet Crypt club floor (the framed 1974 sleeve, the mirror-tiled wall, the stage) and its backstage dressing room
# (the dressing-table drawer with the contract, wig heads wearing latex gill frills, the back door to the canal).
# Puzzle props are placed where hotspots can sit on them; Kind Robots keeps every hotspot coordinate in
# chapterThree.ts so the art pass can re-place them. The brood's children are scenery only: tadpoles in the pool
# and toys in the yard, never figures (lookbook rule: no model sheet, kid-safe, never near flirt content).
# Cast (832x1216 full body on plain light grey): Laguna Brine, Delta Brine and Cherie Brine in the words of Kind
# Robots characterModels.ts and the lookbook; Laguna also gets a four-head expression sheet (she is the chapter's
# lead witness). One NPC is PROPOSED under Silas's 2026-11-22 free authority over clues and scenes: Coral Pike,
# the licensed look-alike who has toured as "Laguna" since 2017, a human performer in green body paint and latex
# gill frills (the builder may rename or drop her). Rig sources follow CH2-CAST-RIG-R1 with the lesson of
# LEADS-BLINK-AND-BEACH-R1 (krea2 drops the blink cell from four-cell sheets): each head sheet has three heads,
# open, ah mouth and an eyes-shut blink, matched to that character's stage figure, with props left out of the
# A-pose so both hands hang open and clear. Ending plate: the porch at Brine Bottoms with Laguna, Iris and Norb, the
# leads in the same words as CH2-ENDING-R1. Spoiler rule: Draculina, Marta and any culprit stay off the art; the
# 1974 line-up appears only as unnamed velvet silhouettes on the sleeve, and Fang Heights is never drawn. General
# edition: is_mature false, comedy, adults only, fully clothed. Identity LoRAs are not trained, so cast_loras is
# false and every prompt carries full identity prose. Private. priority 60 (game art). auto_submit: true. Same krea2
# lane and style as CH2-BEACH-HEX-R1 (Silas 2026-11-28 PT: krea2 gives the best designs). Seeds 1148001-1148019.
