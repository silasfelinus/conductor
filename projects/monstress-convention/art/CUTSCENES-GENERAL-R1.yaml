# MONSTRIQUE shipped cutscenes, painted 2D shots, GENERAL edition, round 1 (2026-11-28 PT).
# Task monstress-convention/t-021: queue painted art per shot from Kind Robots utils/monstrique/cutscenes.ts
# (origin/main 441d8f80), then play them in the cutscene player with captions and a skip. Silas gave standing
# permission to submit art requests. Queued is not delivered: each cell needs a DONE ArtJob, an ArtImage id and
# a verified final URL before it ships, and Silas reviews before anything is public (t-013 gate unchanged).
# One cell per general-edition shot, nine in all: Cold Open (cold-open-1..4, captions from edition.ts
# GENERAL_INTRO), Your New Client (client-1, client-2), Elbow Deep (elbow-1, elbow-2) and Get the Car (car-1).
# Each prompt paints the shot's setting, action, framing, staging (cast x positions, expressions, poses) and gag;
# the caption and line stay as on-screen text, never painted. A Cold Kiss is mature only and the mature Cold Open
# shot 2 ("Bite Me": gin, the fang lost, curtain yanked shut) differs in content, so both live in the separate
# CUTSCENES-MATURE-R1.yaml; general and mature cells are never mixed. Mature cold-open shots 1, 3 and 4 differ
# only in caption text, so the mature edition reuses these general paintings.
# Cast: Iris and Norb match the canonical krea2 designs (CHARACTER-LOOKBOOK "Canonical faces": Iris ArtImage
# 280896, Norb ArtImage 280897) in the wording of CH1-LEADS-RIG-R1, which describes those delivered images.
# Odette and Violet are alive in the Cold Open (cast living: true): no ghost glow, and Odette looks her real
# fifty-eight (her ghost looks thirty-five, STORY-BIBLE). After the Cold Open both are ghosts as in CH1 art.
# General edition rules (DESIGN-BRIEF): the double murder is non-graphic: the cold-open-3 shot shows only the
# closed door and the prop knife moving on its own, victims offscreen, and nobody is drawn as the killer (the
# Draculina reveal stays locked to Chapter 6; Marta, the misdirect, is off the art too). The 1964 billboard in
# car-1 shows unnamed surf-era monster starlets. is_mature false, comedy, adults only, fully clothed.
# 1344x768 cinematic shots in the same krea2 lane and style as CH1-CAST-AND-MOTEL-R1. cast_loras false (identity
# LoRAs untrained). Private. priority 60 (game art). auto_submit: true.
