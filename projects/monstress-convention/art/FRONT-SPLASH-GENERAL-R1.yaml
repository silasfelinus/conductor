# Monstrique front-end splash and Play-card hero, general edition (Silas 2026-11-10 PT: "A really
# artistically generated front end ... And we need a hero on the highlight page"). Replaces the
# vector title scene. Two seeds per subject; Silas picks. Cast looks follow
# kind_robots utils/monstrique/characterModels.ts (Iris: dark shoulder-length hair, rose-and-plum
# trench, press camera; Norb: 4'11", huge round glasses, bulbous nose, buck teeth, grey suit, yellow
# gloves). Draculina is kept off the art (spoiler rule).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
