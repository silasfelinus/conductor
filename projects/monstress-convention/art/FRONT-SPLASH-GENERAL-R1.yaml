- key: splash-wide-1
  entity: monstrique-front
  title: Title splash, landscape (seed 11)
  size: 1344x768
  seed: 11
  prompt_prose: Hand-painted title screen art for a 1990s-style comedy point-and-click adventure game, rendered
    as a modern HD cartoon with bold ink outlines and caricature proportions. A rain-soaked two-storey roadside
    motel at night, the Last Call Motor Lodge, with a buzzing pink neon sign that has one burnt-out letter, a glowing
    blue ice machine by the stairs and wet asphalt reflecting the neon. Above the motel a giant billboard shows
    four glamorous adult monster starlets posing together, a werewolf woman, a green lagoon woman, an elegant bandaged
    mummy woman and a sultry starlet in a black cape, under glowing retro marquee lettering. In the right foreground
    a tall confident adult woman photojournalist with shoulder-length dark hair, berry lipstick and a belted rose-and-plum
    trench coat holds a chunky vintage press camera and winks at the viewer. Beside her stands a tiny four-foot-eleven
    adult man with an oversized head, huge round coke-bottle glasses, a bulbous nose, buck teeth, a rumpled grey
    suit and bright yellow rubber gloves, recoiling in horror from a puddle. In a glowing upstairs window two translucent
    adult ghost women glare out, one in a silver power suit with a cigarette holder, one in a satin vampire cape
    with plastic fangs. Open dark rainy sky across the upper left for a title logo. Saturated magenta, teal and
    violet neon noir palette, cheeky comedic mood, cinematic lighting.
  jobs:
    krea2: 67475
  art:
    krea2:
      status: DONE
      art_image_id: 268790
