# pale green patchwork skin with neat surgical stitches, small silver neck bolts, a towering black beehive with
# white lightning-bolt streaks over short black curls, brass safety goggles pushed up into the beehive, plum
# lipstick, small gold stud earrings, a white lab coat with rolled sleeves over a knee-length purple 1960s
# cocktail dress, and black heels. Lessons from CH1-LEADS-RIG-R2 and CH1-CAST-RIG-R1 applied: the head sheet
# names the same skin, jaw and fixed props as the A-pose and keeps the goggles pushed up in the same place in all
# four cells (the delivered expression sheet wore them down over her eyes, which hides a blink), and draws the
# blink as its own cell with the lids as curved lash lines. Her soldering iron and blueprint are left out of the
# A-pose so both hands hang open and clear and the figure cuts cleanly; the engine adds props. Clem and Dee Dee
# stay as static cut-outs for now. Same krea2 lane, style and grey ground as the Chapter 1 rig rounds (Silas
# 2026-11-28 PT: krea2 gives the best designs). Identity LoRAs are not trained, so cast_loras is false. General
# edition only. is_mature false, fully clothed, comedy, adults only. Private. priority 60 (game art). auto_submit: true.
