# Kind Oracle art round 1 (t-010 first content slice and art; docs/spec.md "The deck" and "Art plan"): the 22 major
# arcana faces, ship-first per the spec. Each prompt draws the card's "Kind Robots idea" (the spec's art direction;
# ids, numbers and themes are the contract). Faces are 2:3 (832x1248) full-bleed illustrations only: the frame and
# numeral band are composed in code (spec: CSS/SVG fallback face), so nothing here asks for lettering. The spec's
# "style bible" step is folded in: every face renders in Krea 2 (the brief's contract) and Z-Image with one shared
# style tail, and the reviewer picks the lane that reads as one deck before the minors are queued. The card back is
# reused (five existing backs). Content (t-005 meanings) is independent of these faces. Private; auto_submit: true.
