# Kind Oracle — free-to-play, built in kind_robots. Architecture in DESIGN-BRIEF.md.
project: kind-oracle
kind: software
goal: 'A full 78-card Kind Robots tarot deck (22 major arcana plus 56 minor arcana in four suits), each card a full piece of art with an upright and a reversed meaning, where you draw a one, three or five card spread and read a pre-written reading assembled from hand-authored card, pair and position texts. Every combination is written ahead of time, so it feels personal and costs nothing to run. The 22 major arcana ship first as a complete, playable oracle; the minor arcana follow in suit-sized slices.'
notes_from_silas: '2026-10-02: approved by Silas (kind-oracle and pocket-pet-robot only; an earlier "I like all proposals" was a miscommunication and did not approve the other pitches). Scope widened the same day: a full 78-card Kind tarot deck plus readings. Free-to-play: no LLM at runtime; sessions pre-author content and art.

  '
