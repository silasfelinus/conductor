# Deepheart: a saga-tier playbook on the Playbook Kit, scaffolded 2026-11-16 by scripts/new_playbook.py.
# Silas asked for a ~50-preset roster up front, so the tier starts at saga with written
# allowances (kind_robots utils/playbookKit/games/deepheart.ts). Master issue: kind_robots#5256.
project: deepheart
kind: software
autonomous: true
goal: >-
  Deepheart: a saga-tier party dungeon crawler on the Playbook Kit in Kind Robots. Delve three layers with a hero and one to three companions from a 50-character preset roster; puzzle, treasure, combat, choice and campfire rooms; supports and romances that depend on the party; role and pair synergies with a party optimizer; multiple endings with painted plates; main-game standard (title screen, settings, save/load, 12+ achievements, scrapbook, customizable hero, replay hooks); every picture rendered; then playtest.
notes_from_silas: |
  Silas, 2026-11-16 PT: New dungeon crawler project game. User can delve into a three layer dungeon with one or more companions. Traditional dungeon dwelling aesthetic. Romance options depending on party. Presets with romances and supports, romanceable or not, should encompass the majority of the variety, start with 50 or so players and companions, then try to optimize based on special combinations, roles, etc. include rooms based on puzzles, simple treasures, combats, choice rooms with special endings, etc. / To confirm and align: all our games should have a GitHub project issue, which functions as the roadmap, and this project will start on kind robots as high priority. The goal is to fully complete it, including art and everything, at which point it will be marked as ready for human testing, and then swapped to playtest mode on kind robots with normal priority. For now though, like all our games, we want: achievements, save load, art first design, front end, multiple endings, scrapbook like system, multiple characters, etc
# Playtest-readiness requirements: docs/agents/main-game-standard.md (project acceptance ownership).
