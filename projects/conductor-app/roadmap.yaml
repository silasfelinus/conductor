  depends_on: t-006
  note: 'Prepare (do NOT submit) App Store / Play Store release: bundle ids, signing docs (secrets stay out of source control),
    privacy nutrition labels (local mode = zero collection), Apple-required account deletion flow, TestFlight/internal-track
    plan. Submission itself is a separate needs-human action by Silas.

    PROGRESS 2026-08-16 (scheduled conductor sweep, session scheduled-conductor-20260816T2130Z-conductorapp-t010): wrote projects/conductor-app/store-readiness.md
    covering all five checklist items. Bundle ids already set and consistent (org.kindrobots.conductor_app / org.kindrobots.conductorApp)
    -- no action needed. Implemented and shipped the Apple-required in-app account-deletion flow: Settings screen now has
    a destructive "Delete account" tile (confirmation dialog, only shown for real signed-in server accounts, never in local
    mode) wired to AuthController.deleteAccount(), which calls kind_robots'' existing DELETE /api/users/:id self-delete cascade
    (deleteUserWithOwnedData) and then resets the app to the welcome screen. Added test/auth_controller_test.dart (2 tests:
    delete fires against the right user id and resets local state; throws with no request when nobody is signed in) using
    an in-memory AppStorage fake + http.testing.MockClient so the test never touches the real secure-storage platform channel.
    Drafted a data-collection inventory table for the store privacy-label forms, grounded in the same tables the server''s
    own purge cascade touches. Verified: flutter analyze --fatal-infos clean (matches app-ci.yml exactly), dart format clean
    on all touched files, all 7 apps/conductor test files pass when run individually (32 tests total, 2 new) -- note bare
    `flutter test` with no args silently drops 2 of 7 files (appmaker_test.dart and this cycle''s new auth_controller_test.dart)
    in this sandbox specifically (root-user warning printed each run); pre-existing on appmaker_test.dart before this cycle
    touched anything, confirmed each file passes standalone and via flutter test on the real (non-root) GitHub Actions runner
    is expected to differ -- not blocking, but worth a kaizen if it recurs in CI.

    Genuine gap found and left for Silas rather than worked around: android/app/build.gradle.kts''s release build type still
    signs with the debug keystore (no production signing config exists yet), and there is no reachable privacy-policy URL
    for either store''s listing. Both require Silas''s own developer-account credentials/decisions and cannot be generated
    by an agent. TestFlight/internal-track plan is drafted but not run. See store-readiness.md''s "Summary" section for the
    full needs-human list. Remains gate_human/outward-facing overall (submission itself, per the task''s own note) -- rearming
    to needs-human after this slice''s PR merges, not done, since real scope (signing + privacy URL + submission) is still
    blocked on Silas.

    MERGED 2026-08-16 (scheduled conductor sweep, session claude/blissful-curie-m5b1va): reviewed PR #2345 (all 24 CI checks
    green, mergeable_state clean, scoped 5-file/351+/3- diff) and squash-merged d9c5541. FOR SILAS: projects/conductor-app/store-readiness.md
    has the full checklist. TO APPROVE / ACT: (1) decide on Android release signing (keystore vs. Play App Signing) -- build.gradle.kts
    still signs release with the debug keystore, (2) get a reachable privacy-policy URL for both store listings, (3) enroll/confirm
    Apple Developer Program + iOS distribution cert, (4) review the drafted privacy data-collection table against the live
    Prisma schema, (5) run the TestFlight/internal-track plan and the actual store submissions. Nothing here can be done by
    an agent -- all five need your credentials or judgment call. Set approved_by_human: true and status: done once submission
    is actually complete (or once you decide this task''s remaining scope is handled elsewhere).

    '
