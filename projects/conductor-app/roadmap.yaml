- id: t-007
  milestone: m3
  title: Move pitch votes and project priorities from localStorage to per-user DB state in kind_robots
  status: done
  owner: reviewer
  passes: 0
  stakes: reversible
  note: 'conductorStore keeps pitch votes (kr.workspacePitchVotes) and project priorities (kr.projectPriorities)
    in browser localStorage, so they are per-browser, not per-user, and invisible to the Flutter app.
    Design per-user persistence (or fold into Dream.priority for priorities) and migrate the workspace
    + app to it.

    DONE 2026-07-20 (conductor agent session claude-conductor-agent-20260720T1620Z): researched
    current kind_robots main via an Explore agent before writing any code, and found this task''s
    premise is stale -- the migration already happened, just not through this roadmap task.
    `kr.projectPriorities` has zero references anywhere in the repo; project priority is already a
    real Prisma column (`Project.priority: ProjectPriority`, indexed), set via `PATCH
    /api/projects/[id]` -- DB-backed and already visible to the Flutter app via the same REST API it
    already calls. `stores/conductorStore.ts` still references `kr.workspacePitchVotes`, but only to
    `localStorage.removeItem()` it as one-time legacy cleanup on load -- actual voting already goes
    through `POST /api/conductor/pitch-vote` (admin-gated via `requireAdminApiUser`), which sets a
    canonical `status:` field on the pitch''s markdown file in this (conductor) repo. That''s a
    real, non-localStorage, per-pitch status -- not per-browser -- so the literal "move off
    localStorage" objective is done. It is NOT a per-user multi-voter table (one canonical status per
    pitch, admin-set), which is a different, larger feature than what this task described; see t-014
    for that as a separate, explicitly-scoped follow-up rather than building it speculatively here.
    No kind_robots code change needed -- this is a roadmap-accuracy close, not an implementation.'
  claimed_by: claude-conductor-agent-20260720T1620Z
  claimed_at: '2026-07-20T16:22:32Z'
  updated: '2026-07-20T16:22:32Z'
