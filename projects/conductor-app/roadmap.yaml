- id: t-014
  milestone: m3
  title: 'Design true per-user multi-voter pitch voting (if actually wanted)'
  status: done
  approved_by_human: true
  soft_gate: true
  owner: null
  passes: 0
  stakes: reversible
  note: >
    FOR SILAS: t-007 closed as done 2026-07-20 -- pitch votes and project priorities are
    already off localStorage and DB/API-backed. But pitch voting today is one canonical
    `status:` field per pitch (admin-only, set via POST /api/conductor/pitch-vote, stored
    on the pitch's markdown file), not a per-user table where multiple people each cast
    their own vote. t-007's original wording ("per-user DB state ... invisible to the
    Flutter app") suggests that might have been the real intent, but a single admin-set
    status could equally be the intended design for a workspace only Silas curates.

    TO APPROVE: if you want real multi-voter pitch voting (e.g. Silas + collaborators each
    voting, tallied), set status: ready and I'll design a PitchVote Prisma model
    (userId + pitchSlug, @@unique per pattern from the Reaction model) plus a
    server/api/conductor/pitch-votes endpoint. If the current single-admin-status design is
    actually what you want, set status: done with a note -- no code change needed either
    way, this is purely a scope question.

    DECIDED 2026-07-26 (Silas): "the system we have is what i want, no need for
    multi-user voting, this app is meant for solo users, with possibly a
    public facing aspect, but no need for multi-user voting." Current
    single-admin-status design is correct as-is; no code change needed.
