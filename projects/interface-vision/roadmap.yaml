    dream-card was the only holdout and was moved onto it in kind_robots PR #1338 (t-031),
    which is also how Dreams finally got a reaction affordance at all.

    SO THE REMAINING DUPLICATION IS THE BODY, and it is very consistent. Prop surfaces are
    near-identical across all five: entity, selected, compact, showImage, showActions,
    showDescription, showMeta, allowEdit, allowDelete on every one; showReaction and
    showDebug on four; allowClone on three. The genuine per-object extras are small --
    showPersonality/showPromptPreview/showLaunchButton (bot), showStats/showModeButtons/
    showInlineInteract (character), showStats/showSelectButton/earnedKarma (reward),
    showInspirations (scenario), showStats (dream). Emits are the same shape too: edit,
    delete, clone plus one primary action that differs per object (select / launch /
    chat+adventure / choose).

    What the body actually repeats: the <figure> art plate with its gradient scrim and
    overlaid title, the description block, the meta chips, and the Yours/Mature badges.
    scenario-card.vue:81's scrim class string is CHARACTER-FOR-CHARACTER IDENTICAL to
    kr-art-plate.vue:41, and scenario-card and character-card already import
    resolveArtVariantSrc and then hand-roll the frame around it anyway.

    DRIFT WORTH FIXING WHILE CONVERGING (all found by comparing the five side by side):
    character-card and dream-card each declare BOTH `selected` and `isSelected` for one
    state (dream's was collapsed to an activeSelected computed in PR #1338, keeping both
    props since callers pass both spellings; character-card still has the pair);
    reward-card says `fallbackIcon` where the others say `fallbackImage`; dream-card
    defaults showDescription false and allowDelete false where every other card defaults
    both true.

    SUGGESTED SHAPE: a kr-entity-card-body taking {title, description, meta, badges, art
    source} plus slots for the per-object extras, sitting inside reactable-card. That keeps
    the bells and whistles (they live in the shell, already shared) and converges the part
    that is actually copy-pasted. Verify each migration on the Vercel preview per AGENTS.md
    -- these are daily drivers and no source-text contract can judge a card's look.

    NOT blocked on a decision any more; the decision is made. Kept as m2 because "one
    review affordance" and "one gallery" both depend on it.

    REACHABILITY, 2026-08-03 (see t-060's correction for the full account): a card is only
    visible if a manager routes to the gallery that renders it. Before migrating any card,
    confirm its gallery appears with a route in verifyGalleryAdoption.ts's tier table.
