  note: |-
    Follow-on from t-028 (kind_robots PR #1381), which shipped only the additive EntityArtImage schema
    (entityType, entityId, artImageId; FK on artImageId to ArtImage). This task is the actual wiring, split out
    because it bundles a live-endpoint behavior change that deserves its own review pass rather than riding
    along with a schema migration.

    Landed in kind_robots #1459. All four parts of the split:

    1. archiveCurrentEntityArt's project-only "reuse the existing ArtImage row instead of duplicating" fast path
       is generalized to every entity type via a new linkEntityArtImage() helper: when the current slot already
       names a real ArtImage row, archiving upserts an EntityArtImage join (and, for project, the existing
       ProjectArtImage row too) instead of creating a throwaway duplicate. createHistoryReference's duplicate-row
       creation is now reached only by the legacy fallback -- a bare path string with no artImageId behind it.
    2. listEntityArtHistory now queries EntityArtImage for (entityType, entityId) instead of
       ArtImage.path.startsWith. field/fieldLabel (used to scope the history panel to the selected slot) are
       recovered best-effort from the joined ArtImage's own path tag when present; a shared/plain ArtImage row
       has neither tag, so field comes back undefined, which entity-art-manager.vue's existing filteredHistory
       fallback already treats as "show under every slot" rather than hiding it.
    3. The history delete endpoint now unlinks (EntityArtImage.deleteMany) and never deletes the underlying
       ArtImage row -- the main correctness fix the task called out. History entries can now point at real,
       still-referenced art (an entity's own primary image, reused rather than duplicated), so the old
       prisma.artImage.delete(...) could have taken down art another slot/entity/collection still depends on.
    4. entityArtHistoryPrefix is no longer used as a query mechanism anywhere (no more path: {startsWith} in a
       Prisma where-clause); the function and its path tag stay only for the descriptive Studio path and the
       best-effort field recovery in #2.

    Fixed in passing: applyEntityArtImage's archivedArtImageId branch (hit by the queue's overwrite-retry
    completion path) was calling createHistoryReference on an ArtImage id the caller had already freshly created
    as a standalone snapshot row -- duplicating it a second time. It now links that row directly.

    Verified: npm test (vue-tsc) clean; verifyEntityArtManager.ts and verifyEntityArtPromptSuggest.ts contracts
    both pass; eslint clean; prisma validate clean; all PR CI green (TypeScript, Contract verifiers, facet-catalog,
    layout-contract, narrative/storybook contracts, Vercel deploy). No local DB to exercise the Prisma calls
    end-to-end -- verified by read-through against the schema's compound unique key and the callers' actual
    argument shapes, including tracing both applyEntityArtCompletion call sites in the queue completion endpoint.

    field/fieldLabel on history rows is best-effort by design (the join table itself doesn't carry a field
    column, and this task deliberately scoped out further schema migrations) -- not visually verified, no local
    dev server reachable in this sandbox.
