    stakes: reversible
    note: 'Landed in kind_robots #1457 as candidate guard (1), the sweep the task named cheapest-first. utils/scripts/verifyStoredArtPaths.ts collects every distinct stored art path across the seven models that hold one (imagePath/cardPath/heroPath/iconPath plus Bot.avatarImage) and asserts the RESPONSE IS AN IMAGE rather than that the request succeeded. Failure/backlog split is the design decision that keeps it usable: only a 2xx with a non-image body fails (the silent path bug); a genuine 404 is art backlog, reported and never failing, per Silas standing direction that missing art is self-healing. Verified live against production, meeting this task explicit bar of reintroducing a /rewards/ path and confirming the check goes red: /rewards/item/alien-communicator.webp still returns 200 text/html and classifies shell, while /images/rewards/item/alien-communicator.webp returns 200 image/webp 174KB and an absent file returns 404 classified missing. Classifier additionally mutation-verified three ways (treat any 2xx as healthy; conflate 404 with a path bug; stop skipping /api/art routes) -- each fails the self-test. Runs nightly via .github/workflows/stored-art-paths.yml rather than per-PR because it checks DATA, which changes when rows are written, not when code merges; joins the tailnet first, the trap that has now bitten two dispatch-only DB workflows. Candidate guard (2), teaching auditResponsiveLayout BROKEN-ART detector about content-type, was deliberately NOT done and should not be filed as follow-up: investigation showed the audit missed the 214 rewards not because its detector is too narrow but because kr-art-plate caught the decode failure and swapped in its fallback exactly as designed, so naturalWidth was nonzero and the page genuinely was not broken. Did the UI break and is the stored data correct are different questions; guard (1) answers the second and the audit correctly answers the first. Unrelated incident found while doing this and filed in TALKBACK (