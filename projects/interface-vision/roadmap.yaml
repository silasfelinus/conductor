    unlikely to fail given tablet already clears it. /about, /cart, /giving, /mermaids, /privacy, /sanctuary were added to
    audit coverage in slice 5 (kind_robots #1574) without a verification run (that slice's note claimed "no responsive-audit
    run was needed" for a pure route-list change) -- this is the counterexample proving that assumption wrong: a route resolving
    through a shared shell can still fail on chrome the route itself never touches. Likely root cause: the channel-select
    tab strip doesn't reflow or scroll cleanly at 390px for channels with enough tabs/label length -- worth comparing against
    a channel whose tab strip passes (e.g. the play channel, all of whose routes passed) to isolate what differs (tab count?
    label length? snap-x overflow behavior?). Screenshots: kind_robots run 31203187021, artifact responsive-audit-31203187021
    (phone shots for each of the 7 routes above).
    CORRECTION (conductor sweep, 2026-08-07 ~20:30Z): kind_robots PR #1577 (making channel-select shrinkable via `shrink`+`min-w-0`)
    merged on a misread of its own audit log -- the merge review read the run's pass/fail summary rather than the raw per-route
    output. The PR's OWN triggered run 31212650601 (against #1577's exact head 5a1893f) directly confirms all seven routes
    still crushed identically (w=18 sanctuary, w=12 auth/google) -- the fix had zero measured effect. Root cause of why: `.tab-strip`
    sets overflow-x:auto, and per the flexbox spec an item's AUTOMATIC minimum size (used when min-width is auto) resolves
    to 0 on an overflowing axis -- so the browser never detected the row as overflowing, and the shrink algorithm #1577 relies
    on never engaged regardless of how shrinkable channel-select was marked. Follow-up kind_robots PR #1578 adds an EXPLICIT
    min-width floor to `.tab-strip` (96/112/128px, matching tab-button's own existing floor), which bypasses the automatic-minimum-is-0
    rule and lets the browser actually detect the deficit. Posted a correction comment on #1577 for the record. This task
    stays status: review, implementation_pr updated to #1578 -- watching its own CI-triggered audit (reading the raw log this
    time, not just the summary) before merging.

