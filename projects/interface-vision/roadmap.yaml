      caption-over-art title would sit on a placeholder for most Rewards. The shared body puts
      the title in the art caption, so both need a title-placement parameter (something like
      titlePlacement: 'caption' | 'below') agreed first. Guessing at that shape is exactly how
      a caption-meta row and a surface-toned scrim got written for bot-card in #1352 and then
      deleted before commit for being unexercised; do not repeat that by porting reward
