      section: for branches matching those prefixes, skip straight to the
      post-merge production-deployment verification path (merge on CI-green
      per the standing merge instruction, then poll list_deployments for the
      resulting production deploy, fetch the relevant route once READY, and
      check get_runtime_errors) instead of looking for a preview first.

