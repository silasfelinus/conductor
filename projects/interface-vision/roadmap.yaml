    note: >
      DONE 2026-08-01: kind_robots PR #1252 (merged) built the three mockups at
      /storybook-mockups (components/storybook/storybook-mockups.vue), all fixture
      data, no store/DB wiring, all six required elements present in each of A/B/C.
      Mockup routes are intentionally still live — t-003 says to delete them, but t-002
      (Silas's pick) is still open, so deletion is deferred until he has actually seen
      them; see t-003's note. DESIGN-BRIEF.md exists in this project folder but does not
      yet record a pick (that's t-002's job once Silas responds).
      Phase 0. Silas judges reliably by eye and unreliably from description, so nothing
      else on this project is decided until he has seen options. Build three static
      mockups of THE SAME Storybook screen, fixture data only, no store wiring, no DB
      reads (the sandbox has no DB): (A) theater / lit stage — dark receding surround,
      bright lit panel holding narrator + art, chrome dims while a story runs;
      (B) storybook — warm paper tones, generous margins, large rounded image plates,
      display serif for narration vs clean sans for UI; (C) bright playground —
      saturated daisyUI brights, chunky friendly buttons, bold cards, playful motion.
      Each must show the same six elements so comparison is fair: narrator with
      expression, generated-art plate, narration text window, choice buttons, free-text
      input, one piece of persistent chrome. Review via Vercel preview deployment at
      phone, tablet and desktop widths. Mockup routes are deleted in t-003.

      CORRECTION 2026-08-07 (interface-vision/t-101, weekly site-audit
      reconciliation): "intentionally still live" above described the state as of
      this task's close, not today's. Once Silas picked Storybook (t-002) the mockup
      page was pared to the one surviving direction (kind_robots PR #1294), then
      deleted outright once the real reading surface took over its job (kind_robots
      PR #1297, 2026-08-02: "The mockup page is deleted. t-003 always said to remove
