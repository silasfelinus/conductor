      Also NOT done: deleting the t-001 mockup routes, since t-002 (Silas's pick) is
      still open and those routes are the only way to compare the three options.
      Original note, for the parts not yet done: >
        THE root cause of "containers fighting each other". app.vue L104-106 wraps
        NuxtPage in `overflow-y-auto` (the page scrolls) while pages/[...slug].vue
        `.content-host` is `h-full min-h-0 flex-col` with `:deep(*) { flex: 1 1 0%;
        min-height: 0 }` (children fill the viewport exactly). These are contradictory,
        and every page resolves it differently — which is why some scroll the shell,
        some clip below the fold, and Storymaker/Taskmaster collapse to a sliver.
        Pick ONE owner; recommended is "the page owns its scroll". Target <=5 wrappers
