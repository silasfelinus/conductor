  - id: t-108
    milestone: m4
    title: "/navigation's site-directory (~85 icons/page) flakes BROKEN-ART on a different image set each run"
    status: ready
    owner: null
    passes: 0
    stakes: reversible
    depends_on: t-103
    note: >
      UPDATED after a second data point -- read this paragraph first, the rest below is the
      original (now partly superseded) hypothesis. kind_robots PR #1567's own cancelled audit
      run flagged 3 specific cards ("Join Kind Robots", "Navigation Overview", "Privacy and
      Data Philosophy", all /images/dashboard-tabs/user/profile.webp). The very next full run
      (kind_robots PR #1569, run 31180459280, ~45min later, fresh Vercel preview) flagged
      /navigation again but with a COMPLETELY DIFFERENT set of broken images -- "Resource
      Gallery", "Storybook", "Music Mentor", "About Kind Robots", "Giving & Support" (5 at
      tablet, only "Storybook"+"Music Mentor" still broken at desktop) -- and phone had ZERO
      defects that run, where phone had been clean before too. None of the original 3 repeated.
      This rules out "one specific missing asset" as the root cause: it is a **different**
      subset of the page's images each run, shrinking as the run progresses through viewports
      (more images warm/cached by the time desktop runs). /navigation renders ~85 small icons
      at once (one per reachable site surface, see t-102's inventory) -- the likeliest
      explanation is a genuine load-timing race across that many concurrent image requests
      against `IMAGE_SETTLE_MS` (20s fixed wait), not a per-image or per-tab content bug.
      Confirm with 1-2 more runs before investigating further, then look at whether
      `IMAGE_SETTLE_MS` needs to scale with image count on directory-style pages, or whether
      navigation-image-fallback.client.ts's error-driven reload just needs longer to complete
      under this much concurrent load. Original hypothesis (kept for context, now the weaker
      explanation): (1) two OTHER tabs sharing the exact same user/profile path
      (content/channels/home/{account,wallet}.md) did NOT get flagged in the first run --
      plugins/navigation-image-fallback.client.ts listens for exactly this failure and swaps
      in /images/botcafe.webp on error, so the inconsistency was suspected to be a timing race
      between that fallback's error-driven reload and the audit's fixed IMAGE_SETTLE_MS wait --
      the second run's totally different broken set makes a per-tab explanation unlikely now.
      Whichever explanation wins, docs/contracts/responsive-layout-audit.md's BROKEN-ART
      philosophy still applies: a page that degrades properly (placeholder while art loads or
      is absent) should trip nothing, so a real fix here is either giving the settle wait more
      budget on image-dense pages or making the fallback swap land faster/more reliably --
      not chasing individual asset paths that turn out to be a different set each run.
      Screenshots: kind_robots run 31177028472 (artifact responsive-audit-31177028472, first/
      cancelled run) and run 31180459280 (artifact responsive-audit-31180459280, second/
      completed run -- this is the more informative one, since it actually finished).

