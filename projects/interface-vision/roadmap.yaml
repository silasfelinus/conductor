      CORRECTION TO THIS TASK'S FIRST DRAFT: it claimed five bespoke cards. Wrong. FOUR of the
      five already share components/wonderlab/reactable-card.vue (214 lines), which owns the
      <article>, the selected border and tint, the karma badge, the reaction button and the
