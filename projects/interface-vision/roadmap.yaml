      `entity:${entityType}:${entityId}:history:${field}:`). This task is:
      design and ship a ProjectArtImage-equivalent join table (or a single
      generic EntityArtImage join keyed on entityType+entityId+artImageId) for
      the remaining entity types, migrate archiveCurrentEntityArt/
      createHistoryReference/listEntityArtHistory in entityArt.ts to use it,
