- id: t-138
  milestone: m6
  title: Pending-art placeholder contract so queued art never reads as broken
  status: done
  passes: 0
  stakes: reversible
  owner: worker
  note: >-
    Filed 2026-09-14 from Silas's art-pipeline assessment. This is the one interface-shaped slice
    of that pipeline -- the plumbing stays on kind-robots, only the placeholder belongs here.


    When a card's image has been queued through the art-request fallback but not yet rendered, the
    surface currently shows nothing distinguishable from a failure. Silas hit this an hour before
    filing, on the new Storybook mode cards: he could not tell "art queued" from "art broken" and
    reasonably guessed the art server outage (2026-09-14: "i hope they are queued and not appearing
    because our art server is currently down"). From the reading end those two states must not look
    identical.


    Establish one shared treatment: any card whose image is queued says so visibly and calmly --
    not an error, not an empty well. Apply it wherever entity art can be missing (Storybook cards,
    Facets, project galleries, reward/character art).


    Reuse rather than rebuild: stores/facetArtRequestStore.ts already tracks `requesting`,
    `requested` and `errors` per entity id, and already calls POST /api/conductor/art-request --
    but only on the Facets surface. Generalize that state into the shared treatment instead of
    introducing a second mechanism.


    Related: kind-robots/t-101 adds requested_at to the queue entries, which would let a placeholder
    say how long something has been waiting. Useful but not required -- do not block on it.

    Shipped: stores/artRequestStore.ts (generic src-keyed pending/failed ledger),
    composables/useArtPendingState.ts, components/art/art-pending-placeholder.vue (shared
    calm 'art is on its way' / 'couldn't load' treatment), plugins/missing-image-
    reporter.client.ts now writes into the shared store on any broken <img> capture. Wired
    into kr-art-plate.vue (via kr-entity-card-body.vue -> character-card, reward-card
    explicitly; bot/scenario/dream/server-card have the prop plumbing but don't yet compute
    it themselves), kr-gallery.vue (via facet-gallery.vue using the existing
    facetArtRequestStore), and narrative-ingredient-card.vue (the Storybook surface that
    prompted this task). Deliberately left for follow-up: bot/scenario/dream/server-card
    computing their own pending prop; Storybook's non-Facet ingredients only get the
    automatic broken-image path, not an explicit request trigger. kind-robots/t-101
    (requested_at) not implemented, per task note not required. Verified: eslint + prettier
    clean on touched files, full-repo vue-tsc 0 errors, all 50 kind_robots CI checks green
    (including verify-project-architecture.mjs and verifyFacetCatalogMaintenance.ts, both of
    which caught real issues in the first pass -- composables/ at repo root is forbidden by
    this repo's architecture contract, and the Facets wiring needed to stay off the YAML-
    art-request path -- both fixed and re-verified before merge). No live browser/dev-server
    check was possible (no .env/database in the sandbox).
