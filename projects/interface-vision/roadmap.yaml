      kind_robots vercel.json now sets `claude/*: true` in git.deploymentEnabled. Agent-authored branches get a real preview deployment, so front-end work can be verified BEFORE it merges instead of only against production afterwards. agent/*, worker/*, and conductor/* stay false for cost -- the original saving is preserved for the prefixes that don't need visual review.

