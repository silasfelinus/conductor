      review affordance" and "one gallery" both depend on it.

      REACHABILITY, 2026-08-03 (see t-060's correction for the full account): a card is only
      visible if a manager routes to the gallery that renders it. Before migrating any card,
      confirm its gallery appears with a route in verifyGalleryAdoption.ts's tier table.
      PR #1334 adopted kr-gallery inside a component nothing mounted, and the counter of the
      day scored it as progress -- the same mistake is available to every card in this list.

      PROGRESS, 2026-08-03. components/gallery/kr-entity-card-body.vue exists (kind_robots PR
      #1352) and three of the five cards are on it: scenario (#1352), bot and character
      (#1355). verifyGalleryAdoption prints the count with each card's route. Line counts:
