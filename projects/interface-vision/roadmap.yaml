      Also documented while confirming the flip: a docs-only merge shows as CANCELED rather than deploying, because vercel.json's ignoreCommand (scripts/vercel-ignore-build.mjs) skips builds whose changed files are all docs/tests. That is correct behavior and had already been mistaken for a failed deploy once.
