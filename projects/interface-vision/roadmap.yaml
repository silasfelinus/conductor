    the same individually-verified pattern as prior slices, but that pace does not scale
    to a pool this size. Decide and record: (a) keep hand-slicing in small verified
    batches like slice 14, accepting it will take many more slices, or (b) write a
    scripted codemod (grep + sed/AST transform) that applies the exact-match substitution
    mechanically across the whole pool in one pass, followed by the same eslint/vue-tsc/
    layout-contract/lint-ratchet/prettier verification this task has used throughout. If
    (b), scope the codemod strictly to the byte-for-byte exact-match cases already proven
    safe -- do not expand into opacity variants, extra intermixed layout classes, or
    no-padding cases without the same case-by-case visual-delta reasoning slices 10-14
    applied by hand.


    DECISION (2026-08-09): (b), codemod, scoped exactly as this note required. Opened as
    silasfelinus/kind_robots#1646 -- utils/scripts/codemods/kr_panel_codemod.py. It fires
    only on a static class="..." attribute containing an exact, contiguous, space-separated
    token run for kr-panel/kr-panel-muted/kr-panel-flat (longest-first), and additionally
    requires every OTHER token on the element to be a plain Tailwind utility or a no-bg/
    border kr-* layout primitive -- any bare DaisyUI component-root class (stat, card, btn,
    collapse, menu, dropdown-content, ...) co-occurring skips that occurrence for manual
    review instead of substituting it. This matters because kr-panel* classes live in
    tailwind.css's @layer components block, the same layer DaisyUI's own component classes
    occupy -- Tailwind utilities always beat components regardless of source order, but two
    components-layer classes on the same element do not have that guarantee, which is
    exactly why slice 12 hand-excluded kr-stat-tile.vue (DaisyUI .stat conflict). The
    codemod's allowlist reproduces that judgment call mechanically.


    Re-running the exact-match grep found kr-panel and kr-panel-muted's pools are actually
