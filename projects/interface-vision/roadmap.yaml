project: interface-vision
kind: software
goal: >
  Finish the entire user-facing Kind Robots front end in three explicit phases: make
  every reachable page work on phone/tablet/desktop with no hidden or unreachable UI;
  make the implementation consistent around shared kr-* primitives and responsive
  patterns; then make every surface visually polished enough for human beta acceptance.

notes_from_silas: |
  From Silas, 2026-08-01, in his own words:

  "My big weakness is front end. I was trained as a theater director and performer,
  with a focus on physical theater. I can look at something and say if it works or
  not, but when it comes to my website, I get lost in the weeds. I know the essence
  of what I want: a clean, focused interface. Large images, friendly buttons, clean
  design. Preferably single screen interfaces that scroll within containers that know
  where they need to stay rather than fighting each other, and a straightforward
  interface that is modular and open, but has a clear vision.

  Instead we've been developing countless tools with ai, and there are tons of nested
  containers when one would suffice, components fighting for space because there isn't
  a clear vision. I have pages that have three different nested container divs before
  we get anything. I have dashboards nested inside dashboards, and tools like
  Storybook and Taskmaster that might work but the navigable interface is a thin
  sliver blocked by nested dashboards that can't decide where to keep their stuff.

  A seriously strong example of the opposite is our taskmaster and storyteller
  endpoints. Massive duplicated headers (plural) — should be a single line if we need
  an extra header beyond our normal dashboard. This is perhaps the biggest rule that
  could change a lot of front end issues. Zero real images, even when we have
  extensive image based facet choices. And really, we lack VISION.

  Narrators are supposed to be front and center interactibles for our dreams and
  storytelling (and taskmaster). Large spaces for images, but also friendly text
  windows. As is, our images are nonexistent and fighting each other, and our text
  looks just like regular text, rather than a special narrative based storytelling
  experience.

  A great interface is the Project gallery — it lets the user choose between multiple
  views, all with friendly large images when applicable, working across devices. A lot
  of our other galleries are stingy with art and filled with noise, awkward padding and
  poor vision.

  Admin based routes are last on priority. My most used pages currently are: artjob
  queue, video-gen, newsfeeds, and the various galleries, especially project.

  This is the biggest thing holding us back from releasing the site and moving into
  beta."

  Scope decisions Silas made when this project was planned (2026-08-01):
  1. Sequencing — thin foundation, then flagship, then sweep.
  2. Aesthetic — build mockups first; Silas picks by eye, not from description.
  3. Duplicates — one canonical implementation, migrate callers, then DELETE the losers.
  4. Beta scope — all four tracks: narrative surfaces, galleries, daily-driver tools,
     onboarding + user dashboard.

  WHY THIS IS A NEW PROJECT AND NOT A REOPENED global-ui:
  global-ui is marked `finished`, 25/25 tasks done — but the design system it shipped
  has ~7% adoption (29 of ~421 component files use any `kr-*` class, while the
  hand-rolled equivalent string appears 366 times across 145 files). Its t-012
  ("migrate components onto .kr-*") closed by delegating to t-023, which closed after
  four passes over a subset. Nobody ever measured total adoption, so "all tasks done"
  read as "goal achieved." Root TALKBACK named this exact pattern on 2026-07-31.

  THEREFORE: every task here carries a NUMERIC exit criterion enforced by a CI script
  whose allow-list only ever shrinks. Do not close a task on this project because the
  work "feels done" — close it when the counter says so. If a counter cannot move for
  a good reason, say so in the note and leave the task open.

  Constraints inherited from global-ui t-012/t-023 — do not relearn these the hard way:
  - Do NOT force bespoke surfaces onto .kr-panel. The workspace header (translucent +
    backdrop-blur), the login page (glassmorphism), and dashed-border empty states are
    intentionally bespoke. This project targets the LAYOUT/SCROLL/HEADER contract,
    which is a different axis from surface skin.
  - The sandbox has NO DATABASE. `nuxt dev` 500s and data-heavy pages cannot be
    verified locally. Visual verification goes through Vercel MCP preview deployments
    (conductor/AGENTS.md ~L338-366).
  - The UI never writes to conductor roadmap.yaml (global-ui TASK-SURFACE-SPEC.md §6).
  - Mana is read-only to the UI (kind-robots BOUNDARY.md). Mutation only via applyMana
    + ManaTransaction.
  - Never `prisma migrate reset`. All schema work here is additive.

