      is visible rather than pure code motion: compact art became 16:9 instead of a fixed
      h-44/h-48; the full-cover base-300 gradient became the shared bottom scrim; meta chips
      moved from inside the art footer to the row below it. One of those was a live bug --
      both cards drew their selected check at top-2, which is where reactable-card renders its
      actions row, so a selected card with actions visible was overlapping them.

      THE REMAINING TWO ARE A DECISION, NOT A PORT. dream-card is the full-bleed poster
      (padded=false, title over edge-to-edge art) and reward-card is an icon tile whose title
