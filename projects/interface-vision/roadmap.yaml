  - id: t-003
    milestone: m2
    title: 'Resolve the app.vue / [...slug].vue scroll contradiction and collapse shell nesting'
    status: done
    owner: worker
    passes: 0
    stakes: reversible
    note: >
      PARTIAL, 2026-08-01: kind_robots PR #1255 (open, CI pending) landed the low-risk
      half only. Done: merged main.kr-main + div.rounded-2xl into one wrapper (one fewer
      layer, fx-region's absolute positioning unaffected since its relative ancestor is
      unchanged); scoped content-host's blanket `:deep(*)` rule to `:deep(:first-child)`
      so a second top-level MDC block no longer gets free 50/50 layout.
      NOT done, split out as t-003b: flipping app.vue's NuxtPage wrapper from
      overflow-y-auto to overflow-hidden ("the page owns its scroll"). 18 of 30
      components/pages/*.vue have no scroll container of their own today and rely on
      that ancestor scrolling — flipping it blind would make their content completely
      unreachable (worse than the current "some pages clip" bug). Needs per-page
      audit/backfill first, verified via Vercel preview since the sandbox has no DB.
      Also NOT done: deleting the t-001 mockup routes, since t-002 (Silas's pick) is
      still open and those routes are the only way to compare the three options.
      Original note, for the parts not yet done: >
        THE root cause of "containers fighting each other". app.vue L104-106 wraps
        NuxtPage in `overflow-y-auto` (the page scrolls) while pages/[...slug].vue
        `.content-host` is `h-full min-h-0 flex-col` with `:deep(*) { flex: 1 1 0%;
        min-height: 0 }` (children fill the viewport exactly). These are contradictory,
        and every page resolves it differently — which is why some scroll the shell,
        some clip below the fold, and Storybook/Taskmaster collapse to a sliver.
        Pick ONE owner; recommended is "the page owns its scroll". Target <=5 wrappers
        before page content (currently 9-10, now 8-9 after this PR's one-wrapper merge).
