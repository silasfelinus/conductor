    Soft/reversible — no known active exploit, unlike t-035's now-closed gap. A Worker session may pick this up and propose a design directly; only the client-secret and revocation decisions ((2) and (3)) need Silas's sign-off before merging, since they're genuine product/security tradeoffs rather than bugs. (1) is an uncontroversial fix and can just be implemented.
