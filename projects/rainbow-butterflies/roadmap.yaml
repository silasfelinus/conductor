  note: >-
    Follow-up from t-035's resolution (kind_robots#2289/#2291/#2293). The acute privilege-escalation gap is closed; these are the three softer design points the original review flagged that never got a decision:
    (1) `server/api/auth/first-party/password.post.ts` has no rate limiting or lockout — a second unthrottled credential-testing surface alongside the existing gap on `login.post.ts`. Add the same protection `login.post.ts` uses (or a shared helper if one doesn't exist yet).
    (2) `client_id` carries no secret anywhere in the password/exchange flows (`FirstPartyClient` has no secret field; `'rainbow-butterflies'` is a predictable public string), so the endpoint's only real authentication boundary is the user's own password. Decide whether first-party clients need a real client secret, or whether the user-password boundary is judged sufficient given delegation tokens are already non-admin and scope-limited.
