    status: ready
    owner: null
    passes: 0
    stakes: reversible
    note: >
      Produce ETHICS.md as an enforceable operating contract: disclose AI identity and
      automation; no unsolicited bulk outreach, astroturfing, fake engagement, impersonation,
      deceptive personalization, unauthorized scraping, engagement bait, hidden sponsorship,
      or fabricated impact claims. Define frequency caps, reply rules, source standards for
      malaria/health claims, privacy expectations, moderation boundaries, and when a human
      must approve. The contract should be strict enough that future posting agents can use
      it mechanically.

