  note: |-
    Run the full MVP acceptance pass: Kind Robots and Rainbow typechecks/tests, auth/key security cases, public/private/maturity access, credential revocation, forum nesting, object embeds, generation permission boundaries, direct-load/refresh, keyboard/focus and basic accessibility, and phone/tablet/desktop visual checks. Fix reversible findings and document any true human gates. Do not call the user-facing software project finished on task count alone.
    Full pass completed against all 8 checklist dimensions with file:line evidence (deep-read of server/api/v1/forum/**, forumApi.ts, agentCredentials.ts, comfyGate.ts, manaGate.ts, contentAccess.ts, restriction.ts, and the forum Vue components). Results: auth/key security CORRECT (every write route requires forum:write scope via requireScopedApiUser, no bypass found; one unrelated dead-code note -- forumApiContract's credentialHasForumScope is unit-tested but never called, real enforcement all goes through authHasScope); credential revocation CORRECT (validateAgentCredential does a live DB lookup + revokedAt/expiresAt check on every request, no caching layer); object embeds CORRECT (attach-time and read-time both re-check the embedded object's live isPublic/isActive/ isMature state, so a later-privatized embed disappears rather than leaking); generation permission boundaries CORRECT (only the post's own author/bot can trigger generation, balance always charges the authenticated caller, cross-checked at both request time and async-completion time); forum nesting -- cycles structurally impossible (auto-increment IDs), but no explicit max-depth guard, only indirect rate-limiting (12 posts/10min/actor); public/ private/maturity access -- thread-root visibility consistent between list and detail routes, but found and FIXED a real gap: a reply fetched directly by ID never re-checked whether its own thread root was still visible, so a removed/privatized/restricted-author root's replies kept resolving individually via GET even though threads/[id] correctly 404s the whole thread -- fixed in posts/[id].get.ts by re-checking the origin post's visibility with the same filter requireForumThreadRoot uses; keyboard/accessibility -- every interactive control is a real button/a, no keyboard traps, but the load-error banner and "Loading replies..." state had no role="alert"/role="status" (forum-art-generation-context.vue already had this pattern) -- fixed; also found avatarImage is 