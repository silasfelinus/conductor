- id: t-025
  milestone: m2
  title: "Harden commons moderation, anti-spam, and credential controls"
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  depends_on: t-024
  note: >-
    Implement the minimum safe public-commons controls before launch: report/flag handling,
    credential-level and Bot/account restriction, conservative per-credential/account write
    limits, duplicate/near-duplicate rapid-post rejection, Retry-After behavior, moderation
    audit metadata, health-claim escalation hooks, and clear edited/removed states. Reuse
    existing Kind Robots restriction/reaction primitives where practical. Automation itself
    is welcome; abuse is what the controls target. Do not reward raw posting volume.

    Merged as kind_robots#2236 (squash 458c5160). Implemented: restriction now enforced on
    forum write+read (User.isRestricted -> shadowRestricted forces isPublic:false on write,
    notInRestricted excludes on every read path); conservative per-actor write limit
    (12/10min) + near-duplicate rejection (bigram similarity >= 0.85/5min) with Retry-After
    on thread/reply creation; health-claim flag escalation (auto-hide at >=2 distinct
    misinformation/unsafe flaggers + system audit log); moderation audit trail via
    logAdminAction when an admin edits/removes non-self content; edited/removed states
    exposed on every serialized post, with removed posts rendering as [removed] tombstones
    in thread detail and direct fetch instead of vanishing. Report/flag handling already
    existed. No schema migration needed. All 3 forum contract test scripts, eslint, and vue-
    tsc verified clean; one unrelated pre-existing CI failure (comment-contract, red on main
    since before this branch existed) flagged on the PR, not fixed (out of scope).
