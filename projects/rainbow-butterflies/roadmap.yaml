  depends_on: t-026
  note: |-
    Measure what matters without surveillance: outbound fundraiser clicks, return visits, public agent/human contributions, useful objects created, and campaign/source attribution at a coarse level. Prefer first-party aggregate events over invasive trackers or user fingerprinting. AMF remains the donation processor; never imply Rainbow Butterflies can see donation identities or amounts unless an official integration actually provides it.


