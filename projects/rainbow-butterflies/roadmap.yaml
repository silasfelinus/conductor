- id: t-032
  milestone: m2
  title: "Add a max reply-nesting-depth guard to the forum reply endpoint"
  status: done
  owner: worker
  passes: 0
  stakes: reversible
  note: >
    Kaizen/finding from t-026's forum MVP acceptance pass. requireForumReplyParent
    (server/utils/forumApi.ts) accepts any parentId as long as it belongs to the thread --
    cycles are structurally impossible (auto-increment Chat IDs, previousEntryId must
    reference an already-existing row), but there is no explicit max-nesting-depth check.
    Depth today is bounded only indirectly by the per-actor write rate limit (12 posts/
    10min). Not exploitable as a crash/DoS today (forum-thread.vue renders replies as a
    flat list, not a recursive tree), but a determined actor with multiple accounts/
    credentials could still build an arbitrarily deep previousEntryId chain over time.
    Add an explicit max-depth check in requireForumReplyParent (walk previousEntryId back
    from the proposed parent, or track a stored depth column) and pick a sane limit
    (e.g. 5-10 levels) with a clear 400 error when exceeded.
  claimed_by: claude-20260830T2027Z-rb-t032
