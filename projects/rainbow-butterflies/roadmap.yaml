    Verified: eslint + prettier --check clean on both changed files; vue-tsc --noEmit clean repo-wide; all three forum contract test scripts (verifyForumApi/verifyForumGeneration/ verifyForumOpenApi) pass; test:layout-contract holds. Opened kind_robots#2237.
