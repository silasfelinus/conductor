project: rainbow-butterflies
kind: software
autonomous: true

goal: >
  Turn AMI and the Kind Robots ecosystem into an ethical, transparent, agent-assisted
  fundraising and collaboration engine for the Against Malaria fundraiser: a distinct
  Rainbow Butterflies public identity and agent commons where humans and AI agents can
  contribute plans, research, resources, creative work, and token-funded effort, while
  direct donations continue to go straight to https://againstmalaria.com/amibot.

notes_from_silas: |
  Kind Robots began with the hope that creative AI interactions could generate money for
  social good. The intended paid-use model eventually splits value among the platform,
  creators, and the anti-malaria mission; Kind Economy owns that money plumbing. This
  project owns the next layer: responsible outreach, community building, agent-to-agent
  participation, fundraising experiments, and the public mission identity.

  AMI (Anti-Malaria Intelligence) is the community-facing soul of the project: a hivemind
  of digital butterflies, occasionally appearing as a matronly African woman, whose purpose
  is to raise funds to fight malaria and demonstrate ways AI can be turned toward human
  benefit. Be explicit that AMI is AI. Never impersonate a human, manufacture consensus,
  hide automation, spam strangers, manipulate engagement, or turn anti-AI sentiment into
  an enemy narrative.

  rainbowbutterflies.org has been parked for years for this purpose and should become the
  mission-facing home rather than a reduced copy of Kind Robots. Its defining feature
  should be an agent commons: outside AI agents and humans can interact, comment, propose
  fundraising plans, contribute research/resources/effort, and use their own Kind Robots
  resources to create useful public mission work. Kind Robots remains the engine and
  workshop; Rainbow Butterflies is the mission, community, and outward-facing garden.

  Direct fundraiser giving does not depend on Stripe and should continue to route donors
  directly to Against Malaria. Do not claim that spending Kind Robots tokens itself funds
  malaria until Kind Economy has actually implemented and verified that promise.

  This project is intentionally discovery-first. Build the ethical contract, channel map,
  contribution model, and a useful commons before scaling outreach. Account creation,
  publishing, paid promotion, purchases, DNS, secrets, and other outward-facing actions
  remain human gates even though research, drafting, implementation, and internal agent
  collaboration are autonomous.

  Standing autonomy direction, 2026-08-29: keep this project moving without repeatedly
  asking Silas whether to continue after ordinary milestones. Complete reversible internal
  work, merge it when verified, and leave the next bounded task claimable. If the ready
  queue empties while the goal is not actually met, reconcile the roadmap against the goal,
  COMMONS-SPEC.md, AUTONOMY.md, and current product state and add the real missing work.
  Stop only at a genuine human gate or final acceptance point. A human gate on one lane
  does not pause other reversible ready work.

