# Hopeful Hues: original hopecore match-three with a Back button. Silas, 2026-11-22 PT.
project: hopeful-hues
kind: software
autonomous: true
goal: >-
  Ship Hopeful Hues to a human-testable complete game in Kind Robots: an original rainbow
  hopecore/cutecore match-three starring Superkate and the Kind Robots, with an exact unlimited
  Back button, daily and weekly quests, achievements, very long branching maps with multiple
  pathways and unique endings, character select, sound and music, three save slots with
  export/import, settings, and a scrapbook. Painted original art, region-specific mechanics,
  full browser playthrough QA at 390/768/1440, then a playtest handoff. It lives as a
  standalone front-end Play page (/play/hopeful-hues) with a home highlight entry and a Play
  link, each with its own art; it is not an Arcade cabinet.
notes_from_silas: |-
  Silas, 2026-11-23 PT (verbatim, three messages): "the character select should actually be tied into both the storyline and the theme. let the player choose their starting path, then go through a unique line that has different art for the jewels, and storyline." / "the themes should be really unique. superkate rainbow paradise. kind robot's journey through Clanktown. a dark gothic romance with blue and purple with rose vines, a gitchzy female space pirate adventure a la barbarella an austin powers...five more. generate unique art and animation, maps and quests and endings for each." / "and achievements"
  Interpreted as nine hero-led worlds (four named plus five designed by the agent), each with its own jewels, blockers, effects, music, map, story, quests, achievements, ending and painted art; the secret ending needs all nine. Genre references are inspiration only: original characters, kid-safe camp. Tracked as t-014.
  Silas, 2026-11-23 PT (verbatim): "And a quick tutorial. What does candy crush do? Are we art gameplay feature parity?" Tutorial shipped with t-002 art in kind_robots #5662 (guided salon-1 swap, goal and Back highlights, one-time tips per element, Settings > Replay tutorial). Parity gap audit recorded as t-009..t-013. Deliberate differences stay: no lives, no timers, no purchases, and an unlimited Back button.
  Silas, 2026-11-23 PT (verbatim): "All of the intro bits need real art. Character select screen, intro, etc." Queued 31 painted requests (4 hero portraits, 7 region intros, 15 story beats, 5 endings) under public/images/hopeful-hues/{heroes,regions,story,endings}/; the game shows each as soon as it is delivered and falls back to its SVG art until then.
  Silas, 2026-11-22 PT (verbatim): "This game should not be an arcade game. For the record. It should exist as a front end page, with highlight entry and link in play. Art for each of course"
  Done in t-008: /play/hopeful-hues front page, Play channel tab, home highlight entry and share card, each with interim code-rendered art; painted replacements are queued in t-002. Never add it to the Arcade cabinet hall or the advert cabinet posters.
  Silas, 2026-11-22 PT (verbatim): "New project, a desired clone of candy crush, but with a back button. Themed on superkate, kind robots, and general good vibes. I expect daily and weekly quests, achievements, loooooooong maps, sound, music, save load settings, scrapbook, character select, multiple pathways, unique endings, and an overall rainbow and colorful aesthetic. Hopecore. Cutecore."
  Build an original game in the match-three genre. Do not copy Candy Crush names, characters, art, music, level layouts or look. Design brief: projects/hopeful-hues/DESIGN-BRIEF.md.
