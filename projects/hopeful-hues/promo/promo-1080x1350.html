<!doctype html>
<!-- Hopeful Hues social card source (1080x1350). Render with render-promo.mjs.
     Art: live Kind Robots images (delivered ArtJobs); gameplay: real 2026-11-25 QA capture
     of Rainbow Falls level 2 (portals). Feature claims match what agents verified in
     kind_robots#5856. Not for posting until Silas approves sharing/promotion separately. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1080px; height: 1350px; overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif; color: #4a2a6e;
        background: linear-gradient(180deg, #ffe3f3 0%, #fff6d9 45%, #dff6ff 100%);
      }
      .hero { position: relative; height: 520px; overflow: hidden; }
      .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
      .hero::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent 72%, #fff6d9 100%);
      }
      .title { margin-top: -26px; position: relative; z-index: 1; text-align: center; }
      .title h1 {
        font-size: 118px; line-height: 0.95; font-weight: 950; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #ff5fa8, #ff9b3d, #ffd23f, #3fd68f, #3fb6ff, #a46bff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 0 #ffffff) drop-shadow(0 8px 18px #7a3fb055);
      }
      .title small {
        display: block; margin-top: 8px; font-size: 30px; font-weight: 850; color: #6b3fa0;
        text-shadow: 0 2px 0 #ffffff;
      }
      .row { display: flex; gap: 30px; padding: 22px 56px 0; align-items: flex-start; }
      .board {
        width: 380px; height: 380px; border-radius: 28px; overflow: hidden; flex: none;
        border: 5px solid #ffffff; box-shadow: 0 18px 40px #7a3fb04d;
      }
      .board img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .side { flex: 1; display: grid; gap: 18px; }
      .heroes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .heroes img {
        width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover;
        border: 4px solid #ffffff; box-shadow: 0 8px 18px #7a3fb040; background: #fff;
      }
      .facts { display: flex; flex-wrap: wrap; gap: 10px; }
      .facts b {
        padding: 9px 16px; border-radius: 999px; font-size: 22px; font-weight: 850;
        background: #ffffffd9; border: 2px solid #f3c8ff; color: #6b3fa0;
      }
      .cta {
        position: absolute; left: 56px; right: 56px; bottom: 42px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 27px; font-weight: 900; color: #6b3fa0; white-space: nowrap;
      }
      .cta em { font-style: normal; color: #ff4f9e; }
    </style>
  </head>
  <body>
    <div class="hero">
      <img src="https://kindrobots.org/images/hopeful-hues/splash.webp" alt="" />
    </div>
    <div class="title">
      <h1>Hopeful Hues</h1>
      <small>Superkate &amp; the Kind Robots paint the world back</small>
    </div>
    <div class="row">
      <div class="board"><img src="gameplay-rainbow-falls.webp" alt="" /></div>
      <div class="side">
        <div class="heroes">
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/kate.webp" alt="" />
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/sprocket.webp" alt="" />
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/ottilie.webp" alt="" />
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/jubilee.webp" alt="" />
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/juniper.webp" alt="" />
          <img src="https://kindrobots.org/images/hopeful-hues/heroes/marigold.webp" alt="" />
        </div>
        <div class="facts">
          <b>↶ Back any move</b>
          <b>9 worlds</b>
          <b>495 levels</b>
          <b>10 endings</b>
          <b>No lives · no timers</b>
        </div>
      </div>
    </div>
    <div class="cta">
      <span>A match-three with a <em>Back</em> button</span>
      <span>kindrobots.org/play/hopeful-hues</span>
    </div>
  </body>
</html>
