# Music Mentor — audio singing & arrangement feedback tool, built in kind_robots.
# Cross-repo software project: roadmap here owns task state; the implementation
# ships as a page + composable + endpoint in silasfelinus/kind_robots.
project: music-mentor
kind: software

notes_from_silas: |
  Silas writes musical medleys and wants to upload a recording and get back
  feedback on singing quality and arrangement, with toggleable choices for the
  kind of feedback. Front-end page on kind_robots (originally imagined as a
  ComfyUI node graph — moved to a site page).

  Honest scope: no tool judges "good singing" like a vocal coach (tone, emotion,
  style are subjective). What this DOES: the browser extracts objective audio
  signals via the Web Audio API — pitch/intonation, timing/tempo, dynamics, key,
  rough section structure — then an LLM reasons over those numbers plus the
  user's setlist to give singing + arrangement feedback. Feature extraction runs
  client-side (no Comfy GPU, no Python, works on Vercel); audio never leaves the
  browser (ephemeral — nothing stored).

  This project has write access to develop the music-mentor page and its
  supporting composable/endpoint in kind_robots.

