version: 1
date: '2026-11-25'
slug: empty-chair-rental
title: "The Empty Chair Rental"
universe: "An early-1960s Technicolor town where every holiday table has one chair nobody can fill, and a downtown department store will deliver a polite guest to sit in it."
product: "Gladhand Seat-Filler Guests, a pressed and smiling holiday dinner companion delivered in a gift box, guaranteed to laugh at every story."
format: "Early-1960s Technicolor department-store holiday commercial with a velvet-voiced announcer, swooping script captions and a rotating showroom turntable."
world_law: "A rented guest will agree with anyone at the table, but it can only eat what is shown on television that night."
promise: "No more empty chairs. A full table, a fuller heart, delivered by four o'clock."
reveal: "Every rented guest is the little station in a borrowed cardigan; when the gravy boat is passed, its reflection shows a small yellow single-eyed television happily wearing a paper pilgrim collar."
visual_style: "Original early-1960s Technicolor department-store commercial painting, saturated cranberry and avocado-green palette with gold accents, glossy still-life sheen, soft gauzy studio glow, slightly faded film-print color and fine dust specks."
aspect: '16:9'
duration_seconds: 15
voiceover: "Another empty chair this holiday? Not anymore. Gladhand Seat-Filler Guests arrive pressed, polite, and delighted by every story you tell. They'll even pass the gravy. Gladhand. Somebody's finally home. Please stay tuned."
sound: "Original lush string-and-celesta holiday jingle, a doorbell chime, tissue paper rustle from a gift box, polite clinking silverware, a single crackle of television static, then a warm fade under a soft station hum."
