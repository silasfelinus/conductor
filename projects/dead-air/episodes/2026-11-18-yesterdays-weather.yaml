slug: yesterdays-weather
title: "Yesterday's Weather"
universe: "A rural television station starts selling shelter from storms made of memories that have already happened."
product: "Yesterday's Weather Service, regional protection from remembered precipitation."
format: "1970s psychedelic regional weather bulletin with increasingly alarming sincerity."
world_law: "Weather fronts drift backward through time, bringing objects and people who were forgotten yesterday."
promise: "Never be surprised by the past."
reveal: "The weathercaster discovers the station itself will fall as rain, and a silent jaguar opens an umbrella for the human audience."
visual_style: "Original 1970s public-access weather collage, glowing tangerine sun disks, jade topographic maps, stormy ultraviolet cloud shapes, paper-cut rainbow rain, grainy painted videotape texture, quiet black jaguar with pale blue cheek marks, tiny yellow electric station eye."
aspect: '16:9'
duration_seconds: 15
voiceover: "Tonight's forecast: a warm front of things you forgot. Scattered birthdays, heavy furniture, one unresolved conversation. Keep an umbrella handy. Tomorrow the television station itself is expected to fall."
sound: "Original gentle marimba weather theme, vinyl crackle, lightning made from shuffled photograph cards, umbrellas snapping open and one distant purring bass note."
