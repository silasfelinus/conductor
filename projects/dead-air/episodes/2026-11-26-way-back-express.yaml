version: 1
date: '2026-11-26'
slug: way-back-express
title: "The Way Back Express"
universe: "A mid-1970s Midwest of two-lane highways and chrome-sided intercity coaches, where a holiday bus ticket can take you home exactly the way you remember it."
product: "Homeward Coach Lines Way Back Express, a holiday round-trip ticket printed on a punch card that delivers riders to the hometown they remember instead of the one that is there now."
format: "Mid-1970s regional intercity bus-line holiday commercial with a folksy baritone announcer, an animated route-map line, hard-cut passenger testimonials and a jingle tag."
world_law: "The coach can only stop where somebody aboard still remembers the place; a stop nobody remembers dissolves into a color-bar test pattern outside the window."
promise: "Home for the holidays, just the way you left it. Every seat a window seat."
reveal: "In the driver's wide rear-view mirror, the driver is a small yellow single-eyed television in a coach cap, and the route map behind the ticket counter is the station's own broadcast coverage circle, every stop a town that still tunes in."
visual_style: "Original mid-1970s regional TV commercial painting, warm harvest-gold, rust-orange and chrome palette, low late-autumn sun over cornfields, wood-panel bus-depot interiors, plaid wool coats, slightly soft 16mm film grain with gentle halation and a faint tape wobble."
aspect: '16:9'
duration_seconds: 15
voiceover: "This year, go home the way you remember it. Homeward Coach Lines' Way Back Express stops anywhere somebody still remembers. Pack light. Sit by the window. Homeward. We'll keep the light on. Please stay tuned."
sound: "Original warm acoustic-guitar and harmonica holiday jingle, a bus air-brake hiss, a ticket punch click, tires humming on two-lane asphalt, one soft test-tone beep as a stop dissolves, then a gentle station hum under the tag."
