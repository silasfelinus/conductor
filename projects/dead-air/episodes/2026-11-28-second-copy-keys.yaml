version: 1
date: '2026-11-28'
slug: second-copy-keys
title: "Second Copy Keys"
universe: "A mid-1980s small-town Main Street on the Saturday after Thanksgiving, where a narrow corner locksmith and clock-repair shop with a striped awning, a bell over the door and a wall of blank brass keys stays open for neighborhood shoppers."
product: "Halvorsen Key & Clock's Second Copy, a brass key cut while you wait that opens one door you used to call home, for one ten-minute visit."
format: "Mid-1980s small-business Saturday local TV commercial with a warm grandfatherly owner speaking straight to camera, a hand-drawn caption card, a whirring key machine close-up and a cheerful accordion-and-glockenspiel jingle tag."
world_law: "A Second Copy only opens a door that is no longer yours, only once, and only for ten minutes; the room inside is exactly as you left it, and nobody living there now notices you."
promise: "Every door you ever closed still has a lock. We just cut the key."
reveal: "The master blank the key machine traces from is a small yellow single-eyed television's antenna, and the drawer under the counter holds a labeled spare for every living room in town, each tag reading 'TUNED IN'."
visual_style: "Original mid-1980s local TV commercial painting, mustard, forest-green and warm brass palette, low winter afternoon sun through a frosted shop window, wood-paneled walls of keys and ticking clocks, soft videotape bloom with gentle chroma bleed and an occasional tracking wobble."
aspect: '16:9'
duration_seconds: 15
voiceover: "Halvorsen Key and Clock, on Main since forever. Miss the old place? Bring us the address. One Second Copy, cut while you wait. Ten minutes, just like you left it. Shop small this Saturday. Halvorsen Key and Clock. We've got a spare."
sound: "Original accordion-and-glockenspiel shop jingle, a brass door bell, a wall of clocks ticking slightly out of step, the bright whine of a key-cutting machine, a lock turning with a soft click, then a quiet station tone under the tag."
