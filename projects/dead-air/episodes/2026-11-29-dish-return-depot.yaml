slug: dish-return-depot
title: "The Dish Return Depot"
universe: "A late-1980s small-town Sunday after Thanksgiving, where a cheerful family-run delivery depot in a converted gas station with a checkered floor, steel shelving and a little orange step van sends borrowed casserole dishes, pie tins and lidded plastic containers back to the relatives who brought them."
product: "Okafor Family Dish Return, a same-day Sunday service that carries every borrowed dish home with one sentence you meant to say at dinner sealed under its lid."
format: "Late-1980s regional Sunday-morning local TV commercial with a brisk, warm mother-and-son owner team talking to camera, a tidy hand-lettered rate card, a quick montage of the van on snowy back roads and a bouncy synth-and-handclap jingle tag."
world_law: "Each returned dish carries exactly one unsaid sentence; only the person it was meant for can lift the lid, and the sentence is heard once, in the sender's own voice, then the dish is just a clean dish again."
promise: "You brought the dish back. Now bring back what you meant to say."
reveal: "The dispatcher sorting the day's routes on the depot's back counter is a small yellow single-eyed television, and every lid it stamps carries the same tiny sticker: 'TUNED IN'."
visual_style: "Original late-1980s local TV commercial painting, tangerine, teal and cream palette, pale Sunday-morning snow light, soft videotape bloom with gentle chroma bleed and a faint tracking wobble."
aspect: '16:9'
duration_seconds: 15
voiceover: "Holiday's over, and Aunt Ruth wants her dish back. Okafor Family Dish Return. We wash it, we wrap it, we drive it. And under every lid, the one thing you didn't get to say. Same-day Sunday service. Okafor Dish Return. Lids up!"
sound: "Original bouncy synth-and-handclap jingle, the rattle of a garage door rolling up, clinking glass dishes, tires on fresh snow, the soft pop of a plastic lid lifting with a single warm spoken phrase, then a quiet station tone under the tag."
