slug: odd-mitten-exchange
title: "The Odd Mitten Exchange"
universe: "An early-1980s snowbound mountain town where every winter's lost single mittens are mailed to a cheerful brick depot beside the ski-lift road, sorted on long felt tables under hanging pegboard signs and a big wall map dotted with pushpins."
product: "The Odd Mitten Exchange, a mail-in service that pairs your one lonely mitten with a stranger's one lonely mitten, so both of you finally have a warm and wonderfully mismatched set."
format: "Early-1980s regional cable-access commercial with a bright folksy announcer in a knit hat, chunky yellow title cards, a squeaky jump-cut demonstration and a whistled banjo-and-glockenspiel jingle tag."
world_law: "A mitten mailed in always comes back paired with another single, never its own lost twin, and the two mittens refuse to be separated again once they have been worn together."
promise: "Nobody's twin. Everybody's pair."
reveal: "In the depot's back sorting room, the mittens are matched by a small yellow single-eyed television on a rolling cart, which studies each mitten under its glowing screen and pins them together with a gentle click, a long row of finished pairs drying above it on a clothesline."
visual_style: "Original early-1980s cable-access TV commercial painting, tomato-red, cobalt and butter-yellow palette with oatmeal accents, flat overcast snow light against warm fluorescent interiors, mild video softness, slight chroma bleed and soft film grain."
aspect: '16:9'
duration_seconds: 15
voiceover: "One mitten. Again. Every winter, the other one just walks away. Don't toss it. Mail it to the Odd Mitten Exchange. We'll pair it with somebody else's lonely mitten, and you'll both stay warm. Nobody's twin. Everybody's pair. The Odd Mitten Exchange. Postage paid!"
sound: "Original whistled banjo-and-glockenspiel jingle, the crunch of boots on snow, the slap of a padded envelope on a counter, rubber stamps thumping, a soft click of two mittens pinned together, then a cheerful bicycle bell and a quiet station tone under the tag."
