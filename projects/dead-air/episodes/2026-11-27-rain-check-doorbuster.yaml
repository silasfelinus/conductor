slug: rain-check-doorbuster
title: "The Rain Check Doorbuster"
universe: "An early-1980s small-city downtown the morning after Thanksgiving, where a family-owned department store opens at dawn with brass revolving doors, escalators and hand-lettered sale banners."
product: "Fairmont & Daughters Department Store's Rain Check Doorbuster, a free printed rain check redeemable for any moment you ran out of time for yesterday, re-staged once in a display window while you watch."
format: "Early-1980s local department-store day-after-Thanksgiving doorbuster commercial with an excited announcer, a dawn queue on the sidewalk, a price-slash graphic and a store-jingle tag."
world_law: "A rain check can only be redeemed by the person who missed the moment, and the window shows it exactly once; nobody else can see what is playing behind the glass."
promise: "Missed it at the table? We'll honor it at the window. While supplies last, which is forever."
reveal: "Last in line, waiting politely on the sidewalk, is a small yellow single-eyed television in a knit scarf, holding a rain check that reads 'one evening of being watched', and the store's display windows are all tuned to its signal."
visual_style: "Original early-1980s local TV commercial painting, cranberry-red, cream and brass palette, pale blue dawn light on wet downtown sidewalks, cranberry bunting over brass-trimmed display windows, wool scarves and quilted vests, soft videotape bloom with a faint chroma bleed and occasional tracking line."
aspect: '16:9'
duration_seconds: 15
voiceover: "Doors open at dawn! Fairmont and Daughters' Rain Check Doorbuster. Missed a moment at the table? Bring your rain check. We'll play it in the window, just for you. Fairmont and Daughters. Thank you for waiting."
sound: "Original bright brass-and-synth department-store jingle, a crowd murmur on the sidewalk, a brass revolving door whoosh, a cash-register bell, a soft glass hum as a window lights, then a gentle station tone under the tag."
