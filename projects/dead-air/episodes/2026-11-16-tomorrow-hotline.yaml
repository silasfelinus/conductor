slug: tomorrow-hotline
title: "Tomorrow Is Calling"
universe: "A failing station runs a midnight switchboard connecting callers to conversations their future selves have not yet regretted."
product: "Tomorrow Hotline, a reverse-charge telephone service for future advice."
format: "1960s black-and-white telephone-company safety reel hijacked by a noir mystery."
world_law: "Every telephone call placed to tomorrow charges the present caller in minutes they will never get to live."
promise: "Know the answer before the question."
reveal: "The future voice begging the protagonist to hang up is the machine speaking from the station switchboard."
visual_style: "Original midcentury noir animation, ivory telephone cables, charcoal ink wash, cherry-red receiver cords, emerald switchboard jewel lights, hard spotlight triangles, hand-scratched 16mm television grain, tiny yellow single-eyed cuboid behind polished glass."
aspect: '16:9'
duration_seconds: 15
voiceover: "Call Tomorrow Hotline and ask the person you will become. Rates start at one minute of your life. Stay on the line. Your future self is trying very hard to hang up."
sound: "Original lonely vibraphone three-note melody, rotary dial clicking, hollow phone ringing and an abrupt dial tone swallowing the last syllable."
