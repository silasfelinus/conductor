    transformation: "The tone becomes the only window in which two people can actually talk"
    assets: "Formal study only; the handshake sound is newly composed and no recorded modem audio is used."
  - work: "Pen-pal and lost-friend reunion stories (folk motif)"
    study: "A message that finds the right person after a long silence"
    transformation: "The reunion is metered by a machine and lasts exactly one connection"
    assets: "Formal study only; all film visuals and audio are original."
