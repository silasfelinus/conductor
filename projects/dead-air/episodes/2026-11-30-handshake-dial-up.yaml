version: 1
date: '2026-11-30'
slug: handshake-dial-up
title: "The Handshake Dial-Up"
universe: "A late-1990s Monday after Thanksgiving in a mid-sized suburb, where a chirpy regional internet provider runs its service out of a strip-mall office with beige tower computers, a wall of blinking modems and a front window painted with a cartoon telephone cord."
product: "Handshake Online, a 56k dial-up plan whose connection screech reaches one person you lost touch with, for exactly as long as the modem sings."
format: "Late-1990s regional dial-up internet provider TV commercial with an upbeat young spokesperson in a fleece vest, swooping clip-art graphics, a chunky CRT monitor screen-take and a chiptune-and-slap-bass jingle tag."
world_law: "Every connection reaches exactly one person you meant to keep in touch with; the line stays open only while the modem's handshake tone plays, and when the tone ends you are simply online, with one new message waiting."
promise: "Back to work, back online, back in touch."
reveal: "The server humming in the provider's back closet, its cables looping into every modem on the wall, is a small yellow single-eyed television, and its screen saver scrolls the same two words: 'TUNED IN'."
visual_style: "Original late-1990s local TV commercial painting, beige, teal and grape-purple palette with lime accents, flat fluorescent office light and a cold blue Monday morning through the strip-mall window, chunky CRT glow, soft videotape bloom with light scanlines and a faint tracking wobble."
aspect: '16:9'
duration_seconds: 15
voiceover: "Monday morning. Inbox full. And somebody you meant to call back since summer. Handshake Online. Dial in, and for as long as that modem sings, you're talking to them. Fifty-six k, one old friend. Handshake Online. Get connected!"
sound: "Original chiptune-and-slap-bass jingle, a dial tone and keypad beeps, an original warbling modem handshake that melts into a warm two-voice laugh down the line, the clack of a beige keyboard, then a soft new-mail chime and a quiet station tone under the tag."
