slug: plot-assist
title: 'PLOT ASSIST: You Are the Road Hazard'
universe: 'The local television station sells roadside recovery to fictional people whose story arcs have stalled in physical space.'
product: 'Plot Assist, an emergency towing service for stranded motivations.'
format: 'Queer-friendly midnight anime motor-club advertisement filmed like a heavy-metal record sleeve has come alive.'
world_law: 'A lost personal motivation becomes a literal road hazard, and rescuers must tow the abandoned story arc away before sunrise.'
promise: 'We will get your character moving again.'
reveal: 'The rescue truck is driven by the station signal in jaguar form, who ignores the road and escapes through the television frame.'
visual_style: 'Original painted neon-anime cel art, torn-paper punk print texture, cobalt-blue shadows and sizzling magenta and acid-yellow stage light, exuberant heavy-metal illustration energy, weathered local-broadcast grain, recurring yellow one-eye television mark visible as a tiny reflection, memorable black jaguar with blue cheek streaks and a red neck scarf, cinematic midnight rain.'
aspect: '16:9'
duration_seconds: 15
voiceover: 'Story stalled? Call Plot Assist. We tow abandoned motives twenty-four hours a day. Please stay seated. The driver is improvising.'
sound: 'An original crunchy electric-guitar stab, rain on pavement, metal tow hook clang, abrupt engine purr and a very sincere chime at the end.'
references:
  - work: 'FLCL (2000)'
    study: 'Compact propulsive visual editing that communicates impossible events in a flash'
    transformation: 'A roadside service transforms story structure into a broken-down road and a jaguar-shaped escape'
