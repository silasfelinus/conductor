version: 1
date: '2026-11-24'
slug: leftover-hour
title: "The Leftover Hour"
universe: "A mid-1990s suburb where every household's unused minutes pile up in the refrigerator like leftovers, wrapped in foil and labeled by the day they were skipped."
product: "Time-Saver Leftover Hour Wrap, reusable foil that preserves any minute you didn't use so you can reheat it later."
format: "Mid-1990s holiday-season kitchen-products infomercial with a sunny host, split-screen demos and bouncy yellow price captions."
world_law: "A wrapped minute keeps forever in the fridge, but reheating it always plays the same quiet scene from the day it was skipped."
promise: "Never waste a moment again. Wrap it, stack it, heat and enjoy."
reveal: "The refrigerator light is a broadcast tuner; every reheated minute is being aired on the little station, which has been running the town's skipped afternoons as overnight programming."
visual_style: "Original mid-1990s holiday infomercial painting, warm butter-yellow kitchen with harvest-orange accents, crinkled silver foil packets labeled in marker, humming almond-colored refrigerator, flat studio lighting with slight bloom, VHS tracking grain, a tiny square yellow single-eyed television sitting on top of the refrigerator."
aspect: '16:9'
duration_seconds: 15
voiceover: "Too busy for that walk? That phone call? That nap? Don't throw it out. Wrap it in Leftover Hour, pop it in the fridge, and heat it up whenever you're ready. Leftover Hour. Time well saved. Please stay tuned."
sound: "Original bouncy synth-and-slap-bass infomercial bed, foil crinkles, a refrigerator door suction pop, a microwave hum and ding, then a soft tape hiss under a faint refrigerator drone."
