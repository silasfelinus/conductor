slug: hold-music-spa
title: "Hold Music Day Spa"
universe: "A pastel strip-mall day spa where frazzled customers unwind to endless telephone hold music piped through seashell headphones."
product: "Serenity On Hold Day Spa, full-body relaxation packages set to soothing hold music, no appointment ever completed."
format: "Late-1980s regional day-spa commercial with soft-focus glamour, a whispering spokesperson and cheerful pastel captions."
world_law: "The longer a guest stays on hold, the calmer they become, but nobody's call is ever actually answered."
promise: "Total relaxation, one more moment at a time. Your call is important to us."
reveal: "Every spa line is routed to the broadcast station's switchboard, where the tiny television keeps the guests politely waiting as its permanent audience."
visual_style: "Original late-1980s soft-focus day-spa commercial painting, peach and seafoam pastel walls, wicker chairs, potted ferns, beige corded telephones on every armrest, seashell-shaped headphones, gentle vaseline-lens glow, VHS tracking grain, a tiny square yellow single-eyed television perched on the reception desk."
aspect: '16:9'
duration_seconds: 15
voiceover: "Stressed? Rushed? Let it all go at Serenity On Hold Day Spa. Lie back, put on your shell, and let the music carry you. Your call is important to us. Please continue to hold. Please stay tuned."
sound: "Original gentle synth hold-music loop with soft marimba, a fountain trickle, a distant telephone click, the loop repeating once too many times, then thinning into a faint carrier hum."
