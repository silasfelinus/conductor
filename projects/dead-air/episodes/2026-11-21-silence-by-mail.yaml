slug: silence-by-mail
title: "Silence by Mail"
universe: "A cheerful 1970s mail-order company ships bottled quiet to noisy suburbs, one corked glass jar at a time."
product: "Hush-Post Silence by Mail, genuine quiet delivered to your door in reusable glass jars."
format: "1970s daytime mail-order television spot with warm suburban deadpan."
world_law: "Each jar of silence can be uncorked exactly once, and the quiet inside must have come from somewhere."
promise: "A peaceful afternoon for every household, guaranteed by mail."
reveal: "The jars are filled every night at the broadcast station, from the dead air between programs."
visual_style: "Original 1970s mail-order commercial painting, harvest gold kitchens, avocado green shag carpet, burnt orange wallpaper, amber glass jars with cork stoppers, soft film grain, warm tungsten lamplight, a tiny square yellow single-eyed television watching from a shelf."
aspect: '16:9'
duration_seconds: 15
voiceover: "Neighbors mowing? Kids practicing tuba? Order Hush-Post Silence by Mail. Just uncork, and relax. Every jar is filled fresh, every night, from a source you already trust. Please stay tuned."
sound: "Original bright jingle on electric organ, lawnmower drone, a sour tuba note, a soft cork pop that drops the room into quiet, then a long faint carrier hum."
