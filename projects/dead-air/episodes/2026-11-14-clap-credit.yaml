slug: clap-credit
title: 'CLAP CREDIT: Borrow an Audience'
universe: 'A struggling local broadcast channel is financed by a lender that offers applause on credit and forecloses on every quiet moment.'
product: 'Clap Credit, the applause lending institution.'
format: 'Queer-friendly heavy-metal anime infomercial, played absolutely straight by a slick local-bank announcer.'
world_law: 'An audience reaction can be lent against future attention, and unpaid applause is physically repossessed.'
promise: 'Everyone deserves to feel appreciated.'
reveal: 'Once interest comes due, a collector vacuums the applause out of the room, leaving a jaguar-shaped audience shadow still clapping.'
visual_style: 'Original sharp-edged midnight anime concert drama, scratched punk woodcut textures, vermilion spotlights, a violet stage, scarlet broadcast tally light, ink-black audience silhouettes and electric guitar flames, one poised black jaguar shadow with blue cheek streaks, vintage late-night station grain.'
aspect: '16:9'
duration_seconds: 15
voiceover: 'No one clapped? Borrow a standing ovation with Clap Credit. One easy payment, due after the encore. Interest is collected in silence.'
sound: 'Original glam-metal guitar squeal, theatrical applause, a tiny cash-register bell, a vacuum motor spooling up and a dead-silent last beat.'
