    motion_prompt: 'The yellow television robot tries to type a sentence, the producer impatiently slaps the big SITCOM button and the monitor scrambles.'
    camera: 'Quick cut from keyboard to producer hand pushing the giant red button.'
    camera_preset: pan-right
