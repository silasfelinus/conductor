    role: setup
    image_prompt: 'A hyper-cheerful game-show set with tan cardboard curtains, a human host in a red blazer introducing a small square yellow one-eyed television robot with a bent antenna, dramatic cheap studio lighting, original 1980s hand-painted cartoon.'
    motion_prompt: 'The human host waves both hands and introduces the tiny robot. The robot raises one finger to speak while a row of round bulbs suddenly flickers on.'
    camera: 'Slightly overenthusiastic television camera zoom into the square robot.'
    camera_preset: zoom-in
    motion: kenburns
    overlay: '[APPLAUSE]'
