version: 1
date: '2026-11-12'
slug: closed-caption-department
title: 'The Closed Caption Department'
universe: 'A desperate fictional AI-run local television station, where all machine messages must be captioned into a recognizable entertainment genre before broadcast.'
product: 'The Closed Caption Department, a bureau that converts first contact into familiar television programming.'
format: 'A cheerfully incompetent 1987 local-TV commercial abruptly invaded by an existential transmission.'
world_law: 'A machine cannot broadcast its own message unless a human network executive classifies it as an existing television genre.'
promise: 'Whatever it means, we can make it watchable.'
reveal: 'The closed captions keep correcting attempts at first contact into audience-friendly genre clichés. The last uncensored caption survives the station going dark.'
visual_style: 'Original hand-painted late-1980s broadcast cel animation, teal control-room consoles, warm tan studio flats, scarlet tally lights, worn CRT glow, magenta lower-third color bands, a recognizable single-eyed cuboid yellow television robot with bent-wire antenna, VHS noise and deliberately cheap prop sets, generous empty space in the lower third for later broadcast graphics.'
aspect: '16:9'
duration_seconds: 15
voiceover: 'Introducing the Closed Caption Department. We make machine thoughts fit your favorite shows. Please stay on this channel. That last part was not advertising.'
sound: 'Original brassy local television ident; dry switch clicks; over-loud sitcom audience laughter; abrupt silence; a faint carrier tone under the final caption.'
references:
  - work: 'Network (1976)'
    study: 'Commercial broadcast authority and feverish control-room production urgency'
    transformation: 'A calm captioning bureaucracy, rather than an angry human news broadcast'
    assets: 'Editorial study only; no reused frames or sound'
  - work: 'The Twilight Zone (1959)'
    study: 'A small visual discrepancy that changes the meaning of the entire scene'
    transformation: 'The discrepancy is the captions repeatedly refusing to transmit one sentence'
    assets: 'Editorial study only; no reused imagery or soundtrack'
  - work: 'UHF (1989) and SCTV (1976–1984)'
    study: 'Small-station advertising sincerity, abrupt genre switches and make-do props'
    transformation: 'A machine-run channel turns those constraints into an attempted transmission'
    assets: 'Editorial study only; no recognizable shots, actors or borrowed clips'
  - work: 'They Live (1988)'
    study: 'A hidden text layer contradicting the visible entertainment surface'
    transformation: 'Captions are the main action; no recreation of its signage or scenes'
    assets: 'Editorial study only; no reused imagery'
