title: "The Empty Square"
universe: "A luxury property broker sells the blank patches cut from old TV shows as affordable rooms for fictional people."
product: "The Empty Square, prime real estate inside deleted broadcast frames."
format: "1980s prestige real-estate commercial for impossible affordable homes."
world_law: "A character edited out of a program can survive by renting one empty frame of television."
promise: "Find enough room to be yourself."
reveal: "A smiling broker shows that the entire station is composed of occupied discarded squares, including the audience's living room."
visual_style: "Original 1980s Memphis design luxury commercial, cobalt checkerboard floors, salmon-pink geometric arches, tropical cyan windows, airbrushed paper textures, brass elevator doors, conspicuous single yellow television eye among warm glowing apartments."
aspect: '16:9'
duration_seconds: 15
voiceover: "The Empty Square. Luxury living in the scenes they cut. Includes one window, unlimited silence, and a view of the credits. Apply today. Even your living room is already occupied."
sound: "Original cheesy synthesized real-estate fanfare, elevator bell, glossy key jingle and a gentle tape-splice click under the last sentence."
