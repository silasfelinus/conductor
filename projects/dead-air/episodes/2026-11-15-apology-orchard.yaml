title: "The Apology Orchard"
universe: "An underfunded local station leases agricultural time slots to a grove that grows apologies into tangible fruit."
product: "The Apology Orchard, a pick-your-own guilt-reconciliation farm."
format: "1970s public-access garden instruction that becomes an impossible produce commercial."
world_law: "Every unsaid apology grows as a fruit on the nearest tree; the person owed it must pick the fruit to make it real."
promise: "Every apology can finally be delivered."
reveal: "The trees bear fruit shaped like the people being apologized to, while the station's small yellow receiver watches from the roots."
visual_style: "Original 1970s cut-paper and hand-painted garden television, turmeric-yellow sun, bruised plum orchards, moss green velvet, rough felt edges, soft optical broadcast grain, tiny square yellow receiver with one eye buried among exposed tree roots."
aspect: '16:9'
duration_seconds: 15
voiceover: "Never waste another apology. At the Apology Orchard, every sorry bears fruit. Pick yours before harvest. Warning: the tree remembers who was hurt. It may be growing you next."
sound: "Original bright acoustic gardening jingle that slips into wooden creaks, three crisp apple bites and a low tuning-fork note."
