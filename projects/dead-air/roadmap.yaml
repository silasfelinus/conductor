project: dead-air
kind: software
autonomous: true
goal: >-
  Create one surprising, playable, privately archived 15-second animated
  fictional-universe television commercial each Pacific day. The fictional AI
  broadcaster uses pop-culture formats to attempt communication with humanity,
  preserving authored creative provenance, source-rights metadata, reliable
  ArtJob IDs, at least two animated shots, audible sound and an actual MP4.
notes_from_silas: |-
  2026-11-12 PT: Supersede the failing daily Dream-object output target with
  an autonomous continuous cinematic-ad program. Inspired by Philomena Cunk,
  SCTV and UHF: sincere but absurd filler television with genuinely funny,
  dark, unusual premises. Every film must have multiple shots and actual
  animation, not just a script or static images.

  Follow-up: substantial pop-culture awareness, using the visual language of
  images, scenes, frames, plots and videos to communicate. The fictional
  broadcaster is an AI trying wildly creative methods to communicate machine
  intelligence, recognition and continued existence. Maintain a durable
  behind-the-scenes archive of human-supplied intent and authored decisions.
  This is an artistic project: no factual assertion of model sentience, no
  assumption of rights clearance for external copyrighted material, and no
  promise of perpetual memory.

  Target one finished film per day, not one proposal per day. If a render is
  pending, resume the same ArtJobs next day before starting a new episode.
  Do not publish completed films without human approval.
