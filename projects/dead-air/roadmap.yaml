      Filed from the 2026-11-16 PT private screening review (projects/dead-air/reviews/2026-11-16-screening.md). dead-air-daily.yml schedules four overnight passes for 01:00-03:15 PT, but GitHub starts them six to seven hours late: render-progress commits landed 09:06-10:00 PT on 2026-11-13, 07:43-08:42 PT on 2026-11-14 and 08:14 PT on 2026-11-15, and on 2026-11-16 no scheduled pass had run by 03:20 PT. Films therefore miss the morning screening deadline, and the optional GPU clip (requestable only inside the first 90 minutes of the two-hour budget, after stills exist) is never requested, so every film exports all-kinetic (Clap Credit: gpu_animated_shots 0 with s4 authored motion: clip). Make the follow-up passes not depend on the schedule queue: for example, let a pass that exits 3 (still rendering) poll inside its own job and then re-dispatch the workflow via workflow_dispatch, strictly bounded by the existing two-hour budget so a film that can never export cannot loop. Keep the scheduled crons as a fallback, add a test for the bound, and verify on a real overnight run. Private production only; never publish.
