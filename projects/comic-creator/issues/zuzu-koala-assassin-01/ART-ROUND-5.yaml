# (Euler a, 30 steps, CFG 5, style tags). Prompts carry the size canon (koala-sized, DeVito build),
# the round-4b clothing fix for full-body shots, a plain hat and grey cloak, and emblem negatives.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
