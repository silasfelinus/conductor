# Zuzu round 9 look test (comic-creator t-015). Silas, 2026-10-05, on the round-8 angle sheets: "Def shouldn't
# have the tiny real otter hanging out with mother superior. Not sure why coyote has a feather duster. Zuzu is still
# too tall, he looks more like a koala, less like a human, much squatter. The siblings are dressed too cleanly and
# seem too 'rich'. They should be in rags, as if animals literally tore at them. Zuzu needs consistently colored
# pants, not blue, those look too much like denim. Overall the characters can have a little darker tone, less
# Disney, more Tarantino."
# Three views (front, left profile, back) x 2 seeds x 5 characters, to confirm the look before full angle sets.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Zuzu seeds 3-4: 'squat' drew him crouched with a staff and the back views put the sword at his waist;
# these swap in 'chubby, standing upright', weight the back rig harder and darken the poncho.
# Coyote seeds 3-4: the stray object in his hand comes from the word 'duster' (as in 'duster coat'),
# so the coat is now a 'trench coat' / 'long riding coat' and plants are negated too.
# Mother superior seeds 3-4: the small otter keeps appearing, likely from 'mother' in the prompt; these
# say 'abbess, elderly head nun', weight solo and negate feral/offspring.
