# Zuzu, Koala Assassin #1: ComfyUI / Krea 2 prompt set
#
# 51 prompts, one or more per script page, written to the Krea 2 contract in ART-PROMPTS.md
# (positive concrete nouns only; no negations, conditionals, art-direction jargon or format nouns).
# All 51 pass server/utils/artPromptContract.ts (checkArtPromptContract, engine krea2) as of 2026-10-03.
#
# - Every prompt repeats its character descriptors in full, because only the CLIP node text is
#   rendered (ART-PROMPTS.md rule 7); nothing is inherited between prompts.
# - Lettering (captions, balloons, sign text, the contract's names) is added in the Comic Creator
#   layout step. Prompts describe such surfaces as worn to illegible loops so nothing is rendered.
# - "an unpeopled scene" marks prompts with no figures; do not append a cast clause to those.
# - aspect: 16:9 widescreen strips, 1:1 inserts, 2:3 full-page splash and cover.
# - Names Ling and Bao are placeholders (see SERIES-BIBLE.md); the prompts do not use names.
