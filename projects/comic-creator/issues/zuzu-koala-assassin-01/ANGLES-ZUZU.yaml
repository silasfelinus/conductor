# Zuzu 8-angle set (comic-creator t-015): Flux Kontext re-poses the locked design R6 (ArtImage 241913,
# Silas, 2026-10-05) into eight angles for the 360 spinner and the LoRA dataset (t-016).
# Every prompt pins the costume and keeps the katana visible (Silas: some back views lost the sword).
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# The Kontext rear views from R6 turned only the head (the body kept the poncho's front), so the two
# *-fix subjects restyle round 7's true Arthemy back views (A4, A5) into R6's costume instead.
# Round 8 Stage B (r8-* subjects): each source is the screened Stage-A render (ART-ROUND-8.yaml) with R6
# stitched to its left as the reference; Kontext redresses the right figure. Crop the right half for use.
# r8-zuzu-profile-right is the left profile (241936) mirrored: all seven right-profile seeds held a
# second sword or faced the wrong way.
# r8c-*: the stitched "match the left figure" pass (r8-*) kept the sword but barely moved the colours, so each
# Stage-A pick also gets a plain single-image recolour: terracotta poncho, brown trousers.
# r9k-*: Kontext single-image sword edits on the round-9 look test. Arthemy keeps putting the katana at
# his waist in back views; Kontext moves it across his back (adding/moving an object, not turning him round).
# r10k-*: round 10's back views came out right on their own; the front and right profile picks carry a
# second sword at the waist, which Kontext removes.
