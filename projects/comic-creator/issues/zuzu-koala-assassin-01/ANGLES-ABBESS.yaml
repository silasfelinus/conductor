# The abbess (otter nun head of the convent): masked face edits on the approved round-10 set (comic-creator t-015).
# Silas, 2026-10-05: "Her snout is too long." Round 12 re-rendered her with "(short blunt muzzle:1.4)" and Arthemy drew
# a literal muzzle (a dog-style restraint) on every seed, with purple and green fur drift, so round 12 is discarded
# for her. Instead the round-10 picks keep their pose, habit and colours, and a masked Kontext edit changes only the
# head box: the word "muzzle" appears nowhere. The back view (242185) shows no face and stands as it is.
# Never use the word "mother" in a prompt (it adds a small otter child).
