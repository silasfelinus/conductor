# Zuzu round 8, Stage A (comic-creator t-015). Silas, 2026-10-05, on round 7: "i'm not happy with them,
# given the sword problem, the angle is often wrong and almost always consistently on his front when we have
# back views. Do again" and "yes on the other character sheets".
# Stage A gets the geometry right: one figure per image, eight angles, true back views, rendered in Arthemy.
# Zuzu carries the canonical sword rig (CAST-PICKS.md): katana diagonally across the back, hilt above the
# right shoulder, scabbard tip at the left hip. Stage B (ANGLES-*.yaml) restyles the best render per angle
# with Kontext, the pick stitched beside it as the reference.
# Submit/refresh with scripts/enqueue_art_requests.py (dry run by default; --live; --status). Private.
# Seeds 4-7 for Zuzu's 3/4-front and right-profile angles: every first-pass seed carried a second sword, a
# sword in hand or a barrel, so these add single-sword, empty-hands tags and negatives for those.
