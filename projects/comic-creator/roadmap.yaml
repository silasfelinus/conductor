# Comic Creator — built in kind_robots, free-to-play (no LLM in the player path).
# Cross-repo software project: this roadmap owns task state; implementation ships in silasfelinus/kind_robots.
# Architecture and guardrails live in DESIGN-BRIEF.md. Read it before claiming anything.
project: comic-creator
kind: software
goal: A visitor opens Kind Robots, picks a page template, fills panels from the gallery or an upload,
  places Kind Robots characters, speech bubbles and captions, and exports a finished comic as PNG pages
  or a PDF, all in the browser with no LLM and no account required, checked at phone, tablet and desktop
  widths and accepted by Silas.
notes_from_silas: "2026-10-02 pitch: \"a comic book creator.\" Part of the free-to-play push: Kind Robots\
  \ has a lot of\n  features locked behind LLM API access, and the interactives that work with zero tokens\
  \ at runtime\n  are the ones every visitor can use. Image generation is plentiful and tokens at authoring\
  \ time are\n  free, so anything that needs words or art is pre-made by sessions and shipped as static\
  \ content.\n  Hard rules: no LLM call anywhere in the player path; the existing gallery images and characters\
  \ are\n  the raw material; Comfy art is pre-generated into a shipped sticker/background pack, never\n\
  \  requested live. Agent picks, each a one-line edit if Silas disagrees: client-only document saved\
  \ to\n  browser storage first, optional signed-in cloud save later; PDF export in the browser.\n"
