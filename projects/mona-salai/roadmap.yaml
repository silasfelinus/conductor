project: mona-salai
kind: software
autonomous: true
goal: >
  Build a transparent, heavily sourced public investigation of the hypothesis that
  Leonardo's Mona Lisa incorporates or depicts features of Gian Giacomo Caprotti,
  known as Salaì, using art history, reproducible computer vision, geometric facial
  analysis, and explicit uncertainty rather than presenting an AI similarity score as proof.
notes_from_silas: >
  New project 2026-07-26. Create a front-end page explaining the theory that Salaì may
  have been the Mona Lisa model, with strong sourcing and room for the evidence to support
  or contradict it. Test the idea using modern facial-recognition, landmark, bone-structure,
  and machine-learning methods across public-domain paintings and drawings associated with
  Salaì, especially Leonardo's Saint John the Baptist because of the visual resemblance.
  First determine what research already exists, what tools and image sources are available,
  and whether a defensible experiment can be designed and replicated. Do not force a verdict.
  Treat paintings as stylized, restored, differently posed artifacts—not biometric photos.
