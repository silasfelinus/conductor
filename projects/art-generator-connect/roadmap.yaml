- id: t-010
  milestone: m5
  title: 'kind_robots ArtJob queue: model, enqueue/claim/complete endpoints, home relay agent'
  status: done
  owner: null
  updated: '2026-07-05T13:30:00Z'
  passes: 0
  stakes: reversible
  note: >
    Cross-repo (kind_robots). Design in
    projects/art-generator-connect/docs/pipeline-architecture.md section 4.
    Additive-only migration (ArtJob model + enum), five endpoints
    (POST /api/art/queue, GET /api/art/queue, GET /api/art/queue/[id],
    POST /api/art/queue/claim, POST /api/art/queue/[id]/complete), and a
    small pull-based relay script that runs on the home box under pm2 and
    drives localhost ComfyUI/A1111. Claim is atomic (guarded updateMany
    CAS); stale RUNNING jobs re-claimable. Merged in kind_robots PR #90
    (squash 131ed63) after Reviewer line-by-line audit of migration.sql
    (CREATE TABLE + ADD FK only, no drops) and the claim/complete logic.
    Relay agent lives at conductor ops/home-server/relay_agent.py.
- id: t-011
  milestone: m5
  title: Accept user apiKey auth on comfy endpoints (machine-auth parity with /api/art/generate)
  status: done
  owner: null
