- id: t-017
  milestone: m4
  title: Guard folder-collection sync against long imagePath overflow and batch the per-image writes
  status: done
  owner: reviewer
  updated: '2026-07-06T20:25:00Z'
  passes: 0
  stakes: reversible
  note: >
    DONE 2026-07-06: merged in kind_robots PR #108 (squash 5d76872), TypeScript
    (vue-tsc) check green. IMPLEMENTED (Silas-directed session, pipeline hardening) on
    branch claude/daily-standup-priorities-gdvhjr. In kind_robots
    server/api/art/collection/folder/[slug]/sync.post.ts: (1) added a
    MAX_IMAGE_PATH=191 guard that splits off any folder URL whose imagePath
    would overflow ArtImage's default VarChar(191), skips it, logs a warning,
    and reports a `skipped` count in the response instead of failing the whole
    batch insert; (2) replaced the per-image loop (2 queries per image:
    create + connect) with a single batched nested `ArtCollection.update ->
    ArtImages.create[]` write. Accounting stays exact: created + skipped +
    alreadyPresent = total. Permanent fix noted in-code = widen imagePath to
    VarChar(764) via migration (deferred; needs its own migration PR). vue-tsc/
    CI validates on the PR. ORIGINAL note follows:
    ---
    Kaizen from kind_robots PR #105 (t-007)'s own "Known limits" section:
    ArtImage.imagePath is the default VARCHAR(191) and a very deeply nested
    long slug path could overflow it, and POST
    /api/art/collection/folder/[slug]/sync currently writes rows
    sequentially (2 queries per image) with the list endpoint resolving all
    folders' images per call - fine at current folder counts but worth
    hardening before folder counts grow. Add a length guard/truncation (or
    widen the column) and batch the sync writes.
