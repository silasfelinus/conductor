# Lightweight directory, NOT a duplicate of issue bodies or Conductor roadmaps.
# Exactly one active master issue per first-tier project; paused projects can
# retain an existing single issue of record. Every indexed master in kind_robots
# has conductor:skip to prevent issue-bridge from importing the umbrella as a task.
# The 11 Daily Dream Workshop member projects (parent: dream-cycle) use the
# dream-cycle issue, while retaining their own Conductor roadmaps and tasks.
# Do not close a master issue from a single engineering PR; use Refs, not Closes.
# Only flag a title [FLAGGED FOR HUMAN TESTING] when a human playtest gate is
# genuinely due; this is separate from public publication approval.
# Conductor remains authoritative for tasks, dependencies, status and gates.
