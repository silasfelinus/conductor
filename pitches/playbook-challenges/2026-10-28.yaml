    preserve: >-
      Retain the same three child travelers, six realms, read-aloud and visual-puzzle parity,
      collectible word objects, gentle failure, and friendship over romance. The atlas physically
      changes and children can repair a promise without losing agency.
    challenge: >-
      Demonstrate two simultaneous map rewrites without stranding a child, show
      that reversing geography never magically restores a broken promise, and
      guarantee an accessible picture-only route through every mandatory puzzle.
      A player must earn the ending by changing both the atlas and a relationship.
    next_questions:
      - "Which six of the eighteen recipes deserve the first Vignette's illustrated before-and-after art, and which two interact without a softlock?"
      - "What observable deed distinguishes apologizing, making restitution, and respecting a friend's decision to remain apart?"
      - "Can a seven-year-old using audio and picture clues solve the Sea bridge puzzle without reading its word tiles?"
    title: "The Bumbledown Atlas"
    hook: >-
      A hand-painted, read-aloud wonderland adventure where the world has misplaced its rules
      and three unlikely young travelers must make stories, songs, and friendship hold it
      together before the final page folds shut.
    genre_pillar: "Children's literary fantasy and family-friendly illustrated wonderland RPG"
    genre_gap: >-
      A substantial playful children's game is missing from a portfolio of more mature horror,
      satire, surrealism, heroes, and wastelands. This brings curious kids and families a whole
      genre rather than a costume for an adult ruleset.
    audience: >-
      Independent readers around eight to twelve, younger children with read-aloud help, and
      adults who enjoy emotionally generous literary nonsense. Text and puzzle difficulty must
      have child-friendly and grown-up modes.
    world_scope: >-
      Six contiguous illustrated realms across three acts, with twelve map render targets: one
      canonical and one transformed overview per realm. Act I joins the Town of Unsaid Things and
      the upside-down Sea; Act II crosses the Orchard and Backward Railroad; Act III opens the
      Sleeping Library and Unwritten Edge. Earlier rewritten paths remain explorable and remembered
      in later scenes.
    emotional_promise: >-
      A child can be kind, brave, silly, mistaken, forgiven, and important. Characters have
      real feelings; failure opens a different way through the page instead of punishing the
      player with cruelty or death.
    core_loop: >-
      Pick a child, a word kit and an opening promise. In each realm discover a
      visual rule, inspect its preconditions and the faces affected, preview a
      reversible page fold, then choose whether to enact it. Solve a route puzzle
      and a separate friendship obligation before earning a page seal. Cross-realm
      promises create difficult but gentle choices: undoing the fold repairs the
      path, while only a conversation and a deed can repair trust. Three acts
      culminate in an atlas that reflects both kinds of change.
    unique_mechanic: >-
      Two deterministic ledgers coexist. The map ledger records recipe ID,
      input tiles, protected exits, before/after geometry and an inverse action;
      the promise ledger records who agreed, who was affected, whether they
      were heard and what repair was attempted. A rewind restores geometry but
      never silently rewinds consent or memory. Optional prose only narrates
      the resolved state and cannot mint a nineteenth rule.
    signature_systems:
      - >-
          Word-and-world cartography: collect words as physical inventory, unlock map
          alterations from verified grammar-like recipes, and see locations and sidequests
          change; never send unconstrained text directly to the world-state parser.
      - >-
          Feelings as relationships, not morality bars: companions remember promises and
          misunderstandings, can disagree constructively, ask forgiveness, and change how
          group puzzles work depending on trust.
      - >-
          Nonsense puzzles with discoverable rules: visual riddles, pattern play, rhyming
          riddles and perspective tricks support alternative non-reading paths, read-aloud
          narration and selectable hint tiers.
      - >-
          A three-act living storybook: pages fold, rotate, and connect across six
          colorful realms, and the ending atlas visibly records every friend helped,
          secret found and word rewritten.
    opening_choices: >-
      Three heroes with three starting dilemmas apiece: the Apprentice Cloud-Stitcher (lost a
      storm), the child-sized Question Mark (looking for its sentence), and the Junior Lullaby
      Keeper (whose last song escaped). Nine distinct illustrated openings select different
      word kits, mentors and early alliances.
    novelty_against_existing: >-
      Not another darkly comic choice deck, surreal festival, western fable or combat
      adventure. Its primary gameplay is world-changing language, visual puzzles, read-aloud
      exploration and lasting child-friendly friendship, staged across an interconnected
      illustrated land.
