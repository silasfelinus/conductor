    production_notes: >-
      34 disjoint recurring characters x 5 emotional portraits = 170. One-off soul portraits are
      part of 120 dossier scene plates, not extra recurring portrait targets. Other images: 16 maps
      (8 canonical + 8 reconfigured), 9 openings, 200 scene plates (120 soul dossiers + 80
      investigation/hearing), 36 friendship, 24 optional adult romance, 48 villain/court
      confrontations, 56 realm-change details (8 regions x 7 states, separate from maps), 60 finale
      frames (15 end-state families x 4), 36 UI = 485. Total 655 unique finished images, 1,310 art
      passes. Text: 15 openings + 240 encounters (120 cases x 2 core beats, with 40 linked appeal
      chains within these beats) + 42 friendship + 30 romance + 56 villain + 36 finales = 419
      authored beats, 838 editorial passes, 2,148 total planned passes. Every dossier has structured
      evidence fields beyond its two counted story beats. Animation, simulation engineering, legal
      sensitivity review, localization, audio and tokens excluded. First Vignette: one contested
      case, two destinations and a reversible appeal with real restitution.