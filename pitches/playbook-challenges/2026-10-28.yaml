      -
        stage: "The promise that survives an undone page"
        seeded_state: >-
          A deterministic pair of Sea recipes and two follower boundaries creates
          a route that is physically reversible but socially costly.
        text_variation: >-
          Authored dialogue distinguishes consent, apology, restitution and a
          friend's legitimate wish to remain apart; generated phrasing cannot
          grant automatic forgiveness.
        image_variation: >-
