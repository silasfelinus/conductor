          bypassing it creates an evidence trail for the Fork Trial and a distinct public-rights finale.
      -
        stage: "A fork refuses the convenient reunion"
        seeded_state: >-
          A seeded memory split gives two rights-bearing copies different
          relationships and a conflicting account of an implant repair.
        text_variation: >-
          The hearing presents sourced testimony, independent counsel and
          voluntary mediation; optional prose may vary tone but cannot
          decide consent or merge actors.
        image_variation: >-
          Two distinct embodiment portraits, one of the existing rights-hearing
          scene plates and the matching district policy map reflect the facts.
        consequence: >-
          Respecting separation preserves two allies with different skills;
          coerced integration creates a rights violation and a civic backlash
          that changes the final infrastructure vote.
    act_spine:
      - >-
          Act I, The License in Your Spine: four playable histories expose incompatible legal contracts.
          A clinic rescue teaches the ten-family hardware compatibility matrix and a no-implant route
          while a first copied witness challenges the player's own identity.
      - >-
          Act II, The City Has a Body: choose among patent control, public repair and black-market
          mutual aid in seven districts; resource shortages alter medicine, transport, sensory access
          and the jobs companions can accept.
      - >-
          Act III, The Fork Trial: a copied lover, union organizer or antagonist can refuse integration.
          Present memory provenance, explicit consent records and witness testimony in a playable rights
          hearing, with distinct friendship, romance and separation outcomes.
      - >-
          Act IV, The Commons or the Cage: the mastermind's program is selected from three coherent
          rights regimes. District governance, surviving copies, faction infrastructure and voluntary
          neural links determine twelve end-state families.
    system_expansions:
      - >-
          Ten hardware families x four curated physical configurations x two rights regimes give eighty
          transformation plates; a compatibility table gates abilities, while maintenance access and
          no-implant paths remain first-class.
      - >-
          Consent as a revocable capability: grants specify whose senses, which duration, permitted
          tasks and copy lineage. A withdrawal instantly changes mission options and must never be
          interpreted as a betrayal stat penalty.
      - >-
          Municipal cybernetics economy: seven districts each track clinic access, patent enforcement,
          repair capacity and union protection; mission aftermath alters services, not just a reputation
          number.
      - >-
          Fork mediation: distinct copied minds retain independent memories, relationships, and legal
          claims. Evidence can reunite people by agreement, establish separate personhood or expose
          forged provenance.
    relationship_routes: >-
      Disjoint recurring cast: 4 playable protagonists, 20 nonrecruitable citizens/corporate figures
      and 14 recruitable companions (38). Six of the 14 have optional consenting adult romance arcs,
      each with platonic and separation routes; all fourteen have three bespoke friendship plates.
      Recurring examples: Imani Vale, a clinic technician who refuses involuntary neural upgrades;
      Sol Ren, a union advocate whose copy votes differently; and Dara Quill, a data diver who will
      revoke shared senses when trust is broken. The corporate architect is one of 20 NPCs. Every
      recurring person receives neutral, warmth, anger, fear, injury and altered-embodiment
      portraits, while curated transformation plates cover hardware-specific silhouettes separately.
    hardware_contract:
      - "Mobility rig: traverse vertical structures; needs torque budget and repair access; alternative is accessible lift coordination."
      - "Tactile prosthetic: perform precision surgery; requires sterile calibration; alternative is a human-assisted tool bench."
      - "Spectrum eye: read hidden infrastructure faults; consumes sensor bandwidth; alternative is a community diagnostic scanner."
      - "Auditory translator: decode machine chatter; license expires; alternative is a trained interpreter with a field receiver."
      - "Respiratory membrane: cross toxic floodwater; filter stock matters; alternative is a sealed community rescue craft."
      - "Neural relay: coordinate remote helpers; permission is revocable; alternative is a physical radio-and-signal crew."
      - "Memory index: compare testimony provenance; cannot establish personhood alone; alternative is witness-led records analysis."
      - "Thermal shunt: enter overheated plants; heat capacity is finite; alternative is staged cooling and safe access windows."
      - "Haptic swarm: repair many small parts; firmware supply can be monopolized; alternative is a trained cooperative repair team."
      - "Synthetic organ kit: stabilize injured patients; clinic inventory matters; alternative is conventional care and transport."
    fork_and_consent_contract: >-
      Each fork has its own immutable origin event, memory provenance hash,
      lived-experience delta, chosen name, legal standing and active grants.
      A shared-sense grant names exact senses, purpose, participants, expiry
      and revocation channel. A fork can decline integration without a
      penalty; a partner can end a neural link without losing their mission
      competence. Disputed copies may seek independent advocacy and
      contradictory memory evidence goes to a hearing, not a morality meter.
    district_economy: >-
      Seven districts independently track public clinic access, repair stock,
      union protection and license enforcement. A player can redirect
      manufacturing from corporate exclusivity to cooperative maintenance,
      but shortages, worker safety and local opposition survive a good
      intention. Three policy outcomes visibly change rescue routes,
      availability of prosthetic repairs and who can testify at the Fork Trial.
    worked_consequence_chain: >-
      At the flooded data commons, an expiring neural relay and a follower's
      revoked sensory grant disable a tempting shortcut. The player can
      recruit an unaugmented signal crew, negotiate a time-limited voluntary
      renewal, or attempt a coercive bypass that leaves an auditable violation.
      The rescue's outcome determines whether a union steward testifies,
      whether the clinic gets shared replacement parts, and which legal
      remedies remain possible in Act III. A different fork may testify
      against the protagonist without being an evil clone.
    content_coverage: >-
      Preserve 778 finished images: 228 portraits for 38 disjoint recurring
      people; 14 before/after district maps; 12 body-history openings; 216
      mission/aftermath plates; 42 friendship; 48 optional adult romance
      (six routes times eight, including relationship boundary turns);
      48 antagonistic regime scenes; 80 curated transformations (ten
      families times four chassis times two governance contexts); 48 finale
      frames (twelve outcomes times four); and 42 UI targets. The 468
      authored beats cover 20 openings, 260 encounters, 48 friendship,
      56 romance, 52 antagonist and 32 finales. Hardware combinations
      composite validated components; they do not multiply portrait targets.
    adversarial_trials:
      - "Revoke a shared-senses grant mid-rescue; the UI and mission solver must remove only that capability, offer a non-implant route, and retain consent history."
      - "Two forks with divergent relationships seek separate legal standing; the hearing must not merge their identities or invent their consent."
      - "Cut repair supply to a district; check that at least one route remains feasible and that later residents react to the actual outage."
      - "Replay identical seed with one expired patent and one cooperative repair policy; the action list and civic finale must differ deterministically."
    first_vignette: >-
      One clinic, two hardware families, one independent fork and one flooded
      rescue with an actual consent revocation. Show a before/after civic
      service indicator, two valid non-implant paths and a legal follow-up
      scene. The full four-act, twelve-ending campaign remains a later tier.
    designs:
      - kind: "other"
        title: "Key art: a city of borrowed bodies"
        prompt: >-
          A sprawling rain-slick neon city rises around a community prosthetics clinic where people with
          varied bodies gather under a translucent network canopy, an orbital garden glowing overhead,
          luminous teal and amber reflections and grounded cinematic science fiction.
      - kind: "other"
        title: "Hero: the civic implant medic"
        prompt: >-
          An adult medic with carefully maintained modular forearm tools repairs a neighbor's prosthetic
          at a crowded street clinic, delicate mechanical joints and compassionate eye contact in focus,
          warm work lights against a rainy cyberpunk alley.
      - kind: "villain"
        title: "The patent architect"
        prompt: >-
          A poised corporate architect stands before a wall of suspended replacement bodies and
          interlocking memory crystals inside a pristine high-rise laboratory, cool clinical blue light
          and a confident expression that conceals fear of losing control.
      - kind: "place"
        title: "The flooded data commons"
        prompt: >-
          Community engineers ferry glowing memory archives through a half-submerged public library
          where fiber-optic roots trail into the water, bioluminescent plants and emergency lanterns
          reflecting on dark ripples, tense yet hopeful atmosphere.
      - kind: "follower"
        title: "Two forks at the clinic"
        prompt: >-
          Two adults sharing recognizable facial features but wearing very different bodies face each
          other across a repair bench as a union advocate listens, tangled cables and consent devices
          between them, intimate amber lamplight and uncertain trust.
      - kind: "ending"
        title: "A city choosing the commons"
        prompt: >-
          Workers and families open a rooftop public repair garden beneath an enormous branching
          communications lattice, diverse embodiments collaborating across bridges and clinics, clear
          sunrise breaking through the neon rain and a hard-earned hopeful mood.
      - kind: "quest"
        title: "The grant is withdrawn"
        prompt: >-
          An adult rescuer in a modular work suit pauses at a flooded clinic doorway
          while a companion calmly unplugs a neural link and a volunteer radio crew
          prepares a rescue boat, blue emergency reflections and intimate ethical tension.
      - kind: "encounter"
        title: "The fork hearing"
        prompt: >-
          Two adults with shared facial features and different chosen bodies sit at
          separate desks in a crowded public hearing hall while a union steward
          presents a memory crystal and neighbors listen, clear daylight and
          grounded human-scale science fiction.
    production_notes: >-
      38 disjoint recurring people x 6 emotion/body portraits = 228. Other art: 14 maps (7 before +
      7 policy-shifted), 12 opening illustrations, 216 mission/aftermath scenes (7 districts x 24 +
      48 cross-district), 42 friendship (14 followers x 3), 48 adult romance (6 routes x 8, with
      non-romance alternatives in prose), 48 villain (4 antagonistic regimes x 12), 80 curated
      hardware transformations (10 families x 4 configurations x 2 rights contexts), 48 finale
      frames (12 end states x 4), 42 UI = 550. Total 778 unique images and 1,556 art passes. Text:
      20 openings + 260 encounters + 48 friendship + 56 romance + 52 antagonist + 32 finale = 468
      authored beats, 936 editing passes; 2,492 total planned passes. Scene plates are not portrait
      duplicates; the combinatorial hardware system composites vetted parts rather than rendering
      every theoretical loadout. Excludes engine coding, accessibility audits, animation, voice,
      localization and token spend. Start with a Vignette clinic rescue, one fork, two hardware
      families and a consent revocation.
  -
    slug: "the-scales-of-forever"
    concept_id: "the-scales-of-forever"
    mode: "expand"
    parents: ["2026-10-27/the-scales-of-forever"]
    evolution: >-
      EXPAND 2026-10-27/the-scales-of-forever: specify a falsifiable soul
      dossier schema, three procedural constitutions with different burdens
      of proof, and an appellate remedy ledger that makes wrongful eternity
      repairable but never consequence-free. Trace a century-late appeal
      through two inhabited realms, forty linked case chains and a final
      legitimacy crisis without adding unbudgeted one-off soul portraits.
    preserve: >-
      Retain the original three arbiter starts, eight realms, Heaven and Hell as changing inhabited
      societies, evidence-based judgments, companions with agency, original nonsectarian cosmology
      and the possible Third Eternity. Never collapse a person's life into a simple virtue score.
    challenge: >-
      Prove that evidence can defeat a favored verdict, that appeals acknowledge
      irreplaceable time lost, and that a compassionate-sounding constitution
      can still produce injustice. Neither Heaven nor Hell is a morality bar,
      and the Third Eternity must require governance rather than a free exit.
    next_questions:
      - "What three evidence-provenance contradictions should a first-time player be able to expose without hidden omniscient facts?"
      - "Which concrete restitution orders remain possible after a soul has spent a century in the wrong realm?"
      - "How do fixed judgment, revisable precedent and self-determined destination alter burden of proof and appellate standing?"
    title: "The Scales of Forever"
    hook: >-
      You have been appointed to decide where the dead spend eternity. Hear the lives of
      saints, monsters, ordinary people and contradictory witnesses, then discover that Heaven
      and Hell have been changing the rules of judgment behind your back.
    genre_pillar: "Epic metaphysical Heaven-and-Hell judgment simulator / cosmic moral drama"
    genre_gap: >-
      The existing portfolio has myth, politics, weird adventures and dark humor but no major
      playable cosmology centered on choosing souls' eternal fate. This delivers a full
      heaven-and-hell simulation rather than another workplace satire.
    audience: >-
      Teen and adult players interested in moral philosophy, mythology, relationship drama,
      evidence, forgiveness, accountability and consequential impossible decisions. Fictional
      cosmology is original, non-sectarian and respectful of real beliefs.
    world_scope: >-
      Eight visually distinct cosmic regions in five acts: the Gate of Last Breath, Memory Sea,
      Gardens Above, Foundries Below, Witness Archive, Covenant Bridge, Court of Appeals and
      the unfinished Third Eternity. Court precedent permanently alters realm architecture and
      the souls who inhabit it.
    emotional_promise: >-
      Judgment is awe-inspiring, terrifying and human. A decision feels irreversible enough to
      matter, but truth is hard; the game explores accountability, mercy and the institutional
      power behind the supposedly final answer.
    core_loop: >-
      Choose one of nine arbiter beginnings, interview a soul and two or more
      contradictory witnesses, inspect a memory artifact's provenance and
      submit a reasoned ruling. Visit the destination as an inhabited place,
      record who was helped or harmed, and later hear an appeal that cites
      the original evidence and precedent. Order restitution, manage an
      institutional legitimacy crisis and choose which constitutional
      procedure may govern the next generation of souls.
    unique_mechanic: >-
      Each ruling stores claims, source confidence, disclosed bias, contradiction
      links, precedent cited, destination and named affected people. A successful
      appeal requires a reason for reversal plus a feasible remedy, which can
      change community access and court legitimacy but cannot return lost years.
      Three constitutional modes change standing, evidence thresholds and
      who may consent to a destination; no algorithm reduces a soul to a score.
    signature_systems:
      - >-
          Soul dossier investigation: each life has conflicting testimonials, timeline
          evidence, harms and kindnesses, unreliable memory fragments and hidden context.
          Verdicts must cite evidence and can be appealed.
      - >-
          Dual-eternity population simulation: sending souls Above or Below visibly
          changes neighborhoods, mentors, factions, resources and relationships in both
          realms. Salvation and damnation have consequences beyond a tally.
      - >-
          Law, mercy and legitimacy: recurring precedents, bargains, coerced confessions
          and revealed celestial bias shift the court's authority. Players must
          distinguish accountability from revenge without a single good/evil meter.
      - >-
          Long-form angel, demon and mortal companion arcs: partners may advocate for
          their own loved ones, oppose corruption, change their views, leave the court or
          romance consenting adult peers.
    opening_choices: >-
      Three arbiters, each with three formative cases: a recently dead mortal granted an
      impossible second hearing, an angelic keeper who discovered a false record, and an
      infernal advocate refusing a predetermined verdict. Nine painted intros change alliances,
      abilities to read testimony and the soul pool's early mysteries.
    novelty_against_existing: >-
      Emperor of Dust's throne events judge living petitioners and assign followers; Shifting Desks
      turns office procedures into dark satire. Scales is a metaphysical evidence-and-appeals
      simulation about eternity, with inhabited Heaven/Hell populations, precedent conflicts, rights
      of the dead, restorative obligations and constitutional change rather than court-themed
      encounter cards.
    runtime_llm: "optional"
    cast:
      playable: 3
      npcs: 19
      followers: 12
      portraits_per_person: 5
    production:
      art_passes_per_image: 2
      text_passes_per_beat: 2
      maps: 16
      opening_choice_images: 9
      scene_illustrations: 200
      friendship_illustrations: 36
      romance_illustrations: 24
      villain_illustrations: 48
      transformation_illustrations: 56
      finale_frames: 60
      interface_art: 36
      opening_scenes: 15
      encounter_scenes: 240
      friendship_scenes: 42
      romance_scenes: 30
      villain_scenes: 56
      finale_scripts: 36
    collisions:
      -
        stage: "The first soul at the gate"
        seeded_state: >-
          The starting arbiter, soul identity and case-seed create a plausible but incomplete
          biography, an alleged harm and two contradictory witnesses.
        text_variation: >-
          Preauthored dossier fragments and testimony branches reveal genuine contradictions;
          optional LLM summation cannot manufacture facts or override the evidence graph.
        image_variation: >-
          A painted lifetime scene, age-appropriate soul portrait and distinct
          heavenly/infernal visual outcomes accompany the hearing.
        consequence: >-
          The ascent/descent ruling changes who lives in each realm and forms a precedent the
          court will later use against or for the player.
      -
        stage: "The witness you trusted has an eternity to lose"
        seeded_state: >-
          Prior judgments determine which celestial or infernal follower has a conflict of
          interest and what relationships make their request difficult.
        text_variation: >-
          Witness confrontation scenes incorporate the cited verdict, consent and affected
          loved ones, with a defensible path to disclose or recuse.
        image_variation: >-
          Correct witness emotions and cosmic relationship scenes reveal grief, loyalty or
          manipulation without visually declaring one side righteous.
        consequence: >-
          A companion may resign, reconcile, testify or challenge precedent, altering the
          evidence available in future cases.
      -
        stage: "A rebellion in the Gardens Above"
        seeded_state: >-
          Accumulated souls in both realms, contested rulings and the presiding faction decide
          whether Heaven or Hell becomes the engine of injustice.
        text_variation: >-
          Villain and faction arguments quote actual court decisions, not random sermon
          templates; appeal scenes make competing obligations explicit.
        image_variation: >-
          Forty-eight antagonist images and fifty-six evolving cosmology illustrations depict the
          people and realms the player's judgments have changed.
        consequence: >-
          The court can lose legitimacy, open appeal rights or conceal systemic harm, shifting
          faction alliances and the final cases.
      -
        stage: "A verdict on the whole of forever"
        seeded_state: >-
          The full precedent ledger, appeals granted, released souls, surviving companions and
          two populations control the attainable endings.
        text_variation: >-
          Thirty-six authored finale scripts select an accountable cosmological outcome and
          address who has been saved, condemned or allowed to return for review.
        image_variation: >-
          Sixty final cinematic panels and the two altered eternity maps present the
          actual faces and consequences of the final ruling.
        consequence: >-
          The ending permanently archives a moral history, and New Game Plus begins with the
          precedent of the last arbiter rather than a meaningless reset.
      -
        stage: "The century-late appeal of an admired precedent"
        seeded_state: >-
          A seeded forty-case appeal chain selects a soul wrongfully confined by an early ruling, the
          advocate who concealed doubt and the specific family separated by the judgment.
        text_variation: >-
          Authored cross-examination reveals the falsified memory provenance and requires the player to
          state a legal reason, a public correction and a restitution order.
        image_variation: >-
          The one-off soul dossier, recurring advocate's grieving portrait, transformed realm detail and
          corrected court scene are selected from the saved evidence and remedy ledger.
        consequence: >-
          Affirming preserves stability but deepens an injustice; reversal reunites some people while
          creating new housing and trust obligations, and changes the constitutional trial's eligible
          arguments.
      -
        stage: "The court cannot return a century"
        seeded_state: >-
          A saved precedent, one fabricated witness interval and the
          affected family's current home create a century-late appeal
          with real restitution limits.
        text_variation: >-
          Authored hearing lines require a cited contradiction, disclosure
          of bias and a named remedy; optional language generation cannot
          overwrite the source record.
        image_variation: >-
          The dossier plate, advocate's changed-conviction portrait,
          altered realm detail and existing court scene match the
          recorded reversal or affirmance.
        consequence: >-
          A reversal restores choice and opens restitution work but
          preserves lost time; affirming a false verdict damages
          legitimacy and changes constitutional standing.
    act_spine:
      - >-
          Act I, The Gate and the Lie: three arbiter origins hear contradictory first cases, learn
          testimony provenance and make a binding judgment whose displaced family is visible in the
          Memory Sea.
      - >-
          Act II, The Cost of a Verdict: explore the Gardens Above and Foundries Below as communities.
          Forty contested case chains expose resource, reunion and restitution conflicts created by
          earlier rulings.
      - >-
          Act III, The Witness Archive: an ally's testimony is implicated in forged memory evidence.
          Reconstruct a life, disclose a conflict of interest, and decide whether to overturn an admired
          precedent.
      - >-
          Act IV, The Court of Appeals: review wrongful eternity, remand unresolved souls, and pay
          specific reparations. A successful appeal changes the two societies rather than merely moving
          a counter.
      - >-
          Act V, The Third Constitution: three possible governance systems face an evidence-backed
          public hearing; choose reform, abolition or shared self-determination, with fifteen distinct
          cosmic outcome families.
    system_expansions:
      - >-
          Case provenance: 120 authored soul dossiers each contain a claim graph, at least two
          contradictory witnesses, a falsifiable memory artifact and three potential reasoned rulings;
          forty chains feed later appeals.
      - >-
          Appeal and restitution: affirm, reverse or remand decisions with an explicit remedy ledger,
          affected companions and permanent acknowledgment of time lost; reversals are costly but
          possible.
      - >-
          Dual-realm civic simulation: eight regions track actual community capacities, social ties and
          institutional legitimacy, with seven illustrated transformation details per region. Souls
          remain named people, never interchangeable morality points.
      - >-
          Three constitutions: fixed judgment, revisable precedent or self-determined destination. Each
          changes evidence burden, realm access, villain strategy and reachable final cases.
    relationship_routes: >-
      Disjoint recurring cast: 3 playable arbiters, 19 nonrecruitable judges/witnesses/antagonists
      and 12 recruitable advocates (34). One-off case souls appear in 120 dossier scene
      illustrations, not in the recurring portrait roster. Example arcs: advocate Neri contests the
      verdict that separated her family; archivist Halem hides an old false record; infernal
      mediator Vessa wants restitution rather than revenge. Six adult advocates can form voluntary
      romances, while all twelve have friendship, disagreement and principled departure paths.
      Portrait states per recurring person: neutral, compassionate, furious, grieving and changed
      conviction; a soul's destination does not dictate visual goodness.
    dossier_schema: >-
      One hundred twenty authored one-off soul cases each have an alleged
      harm, an act of care, at least two competing witness accounts, one
      falsifiable memory artifact, a bias disclosure, three defensible
      verdict rationales and a downstream affected person. Forty cases
      link to later appeals; the other eighty establish communities,
      counterexamples and precedents. A case's two core authored beats
      are hearing and consequence, not 120 additional portrait assets.
    constitutional_procedures:
      - "Fixed judgment: original verdicts are presumed final; extraordinary appeal requires newly authenticated evidence and a narrow restitution order."
      - "Revisable precedent: contradictory cases can reopen a rule; both the harmed soul and affected community have standing and the court must publish a remedy."
      - "Self-determined destination: a soul may propose a third social compact after disclosure of evidence, but affected people can contest coercion and shared resources need governance."
    worked_appeal: >-
      A beloved bridge-builder was sent Below after a witness identified
      sabotage in a damaged memory. A century later, the original
      witness admits that the image omitted a rescue. The player must
      authenticate the missing interval, disclose the advocate's conflict,
      and choose affirm, remand or reverse. Reversal restores the
      bridge-builder's choice of home and requires a reunion route,
      housing, a public correction and an apology that cannot refund
      a century. Affirming protects precedent while allowing the
      wronged family's appeal to grow into a constitutional challenge.
    realm_simulation_contract: >-
      Eight regions track community institutions, housing/access strain,
      personal reunions and legitimacy rather than interchangeable soul
      points. Every ruling affects named relationships and at most two
      civic indicators, keeping the simulation legible. The 56
      transformation details cover eight regions times seven change
      states; sixteen maps cover their baseline and constitutional
      reconfiguration. The unfinished Third Eternity is a society
      requiring consent and infrastructure, not a reward bin.
    content_coverage: >-
      Hold 655 finished images: 170 portraits for 34 disjoint recurring
      characters (three arbiters, nineteen NPCs, twelve recruitable
      advocates); 16 maps; 9 opening choices; 200 scene plates including
      120 one-off dossier images; 36 friendship; 24 optional adult romance;
      48 court/villain confrontations; 56 realm transformations; 60
      finale frames for fifteen ending families; and 36 UI targets.
      The 419 authored beats comprise 15 openings, 240 case/encounter
      beats, 42 friendship, 30 romance, 56 antagonist and 36 finale
      scripts. The 120 one-off souls do not become 120 additional
      recurring portrait sets. Authored testimony and evidence graphs
      are structured data beyond the counted two prose beats per case.
    adversarial_trials:
      - "A trusted witness is shown to have forged an interval; the verdict engine must permit reversal with a cited contradiction, not only an empathy choice."
      - "A century-late appeal is granted; the court must record housing, reunion and public correction, while the loss of time remains visible."
      - "A merciful precedent overwhelms one region; the player must address named residents' access rather than treat souls as numerical capacity."
      - "Change constitution with identical seed; case standing, proof threshold, available appeals and attainable finales must change."
    first_vignette: >-
      One contested soul, two witnesses, one forged memory interval, two
      inhabited destination scenes and one costly appeal. A short
      constitutional preview shows why the same facts may yield different
      procedures. Full five-act, 120-case scope is planning, not a claim
      that all prose or images already exist.
    designs:
      - kind: "other"
        title: "Key art: the two eternities"
        prompt: >-
          An immense bridge of luminous stone spans a sea of remembered lives between flourishing sky
          gardens and fiery subterranean foundries, crowds of distinct souls crossing beneath an
