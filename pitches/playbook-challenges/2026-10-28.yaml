    slug: "afterbody-the-human-question"
    concept_id: "afterbody-the-human-question"
    mode: "expand"
    parents: ["2026-10-27/afterbody-the-human-question"]
    evolution: >-
      EXPAND 2026-10-27/afterbody-the-human-question: specify ten functional
      cyberware families with a non-implant answer to each mandatory capability,
      turn fork autonomy into an executable permission/revocation protocol,
      and make seven district service levels change mission feasibility.
      Add a worked flood-rescue/union-hearing chain and adversarial tests while
      holding the previous art cap to avoid combinatorial costume inflation.
    preserve: >-
      Preserve four playable body histories, seven districts, reversible consent, non-augmented
      routes, complex adult friendships and romance, non-stigmatizing disability representation, and
      community rather than individual cyberware as the political center.
    challenge: >-
      A fork may disagree with its original, a lover may withdraw consent, and
      a repair patent may expire mid-rescue. The engine must respect each
      decision without silently removing a person, punishing disability or
      forcing an upgrade. Civic consequences must change actual mission verbs.
    next_questions:
      - "Which fork-provenance fields must be immutable after a split, and how does a disputed copy contest a fraudulent memory?"
      - "What exact no-implant route preserves each of the ten hardware-family verbs during the flood rescue?"
      - "Which three district service changes can the player verify within two missions after voting for public repair?"
    title: "Afterbody: The Human Question"
    hook: >-
      In a glittering city where bodies are rented, memories have licensing terms and people
      can live across several nervous systems, lead a found family through a cybernetic
      revolution and decide what a person is allowed to become.
    genre_pillar: "Cyberpunk transhumanist RPG and systemic speculative science fiction"
    genre_gap: >-
      A full neon cyberpunk and human-evolution pillar is absent. This is more than cybernetic
      gunplay: the game turns embodiment, augment autonomy, brain interfaces, labor, continuity
      of identity and posthuman rights into persistent choice-driven systems.
    audience: >-
      Teen and adult science-fiction players seeking high-stakes story, action with
      consequences, relational depth, identity dilemmas and clear explanations of genuinely
      strange technologies; accessibility avoids disability-as-corruption stereotypes.
    world_scope: >-
      Seven maps in four acts: the corporate Zenith, the patchwork undercity, a community
      prosthetics clinic, the flooded data commons, the orbital sensor garden, the synthetic
      wetlands and a shared-dream infrastructure. District control, bodies and faction
      infrastructure transform between acts.
    emotional_promise: >-
      Spectacular high-tech ambition collides with intimate vulnerability. Every upgrade offers
      genuine capacity and meaningful tradeoffs, but no person's worth or sanity is graded by
      hardware; liberation can be collective, individual, costly or compromised.
    core_loop: >-
      Choose one of twelve body-history starts, investigate a district's supply
      and rights crisis, build a legal and technically compatible loadout or
      choose its non-implant route, then run a rescue, negotiation, infiltration
      or care mission. A mission can create a distinct fork, a revocable shared
      sense grant or an infrastructure dependency. Return to the clinic, hear
      the people affected, repair or exploit the supply chain, and watch the
      seven-district service graph reshape the next mission and the Fork Trial.
    unique_mechanic: >-
      Hardware and personhood are separate graphs. A device grants a specific
      action subject to chassis, bandwidth, heat, maintenance and firmware
      rights; a mind copy is a new rights-bearing actor with independent consent.
      Grants have issuer, recipient, purpose, duration, scope and revocation
      timestamp. The mission engine reevaluates available actions immediately
      after revocation, never quietly substituting the original's wishes.
    signature_systems:
      - >-
          Modular cyberware as an actual build system: nervous-interface bandwidth, heat,
          sensory translation, firmware trust and physical compatibility create creative
          loadout synergies across movement, combat, infiltration, repair and care, with
          alternate non-implant routes.
      - >-
          Continuity and consent: copied memories, restored versions and neural
          cohabitation have identity ledgers, revocable permissions and branching NPC
          responses; the story never equates hardware with moral worth.
      - >-
          Citywide political economy: clinics, patents, unions, public infrastructure,
          data brokers and open-source engineers react to who controls augment repair and
          basic survival; side quests can shift systemic access rather than only
          reputation.
      - >-
          Companions evolve physically and philosophically: followers can reject updates,
          choose alternate embodiments, pursue romance or friendship, betray a cause or
          reconcile, and each evolution changes their mission kit and cinematic
          appearance.
    opening_choices: >-
      Four protagonists (indentured test pilot, civic implant medic, data-commons courier, or
      synthetic-body heir) with three incompatible body-history starts each, for twelve
      illustrated openings and twelve distinct first missions. Each has a different legal
      status and a personal relationship to the city's core upgrade technology.
    novelty_against_existing: >-
      Prom of Doom dramatizes superhero origin identities; Space Couch uses a red sofa vessel for
      crew diplomacy and away-team missions; Shifting Desks uses coercive office satire. Afterbody
      is a systemic cyberpunk city where body configuration, legal selfhood, shared senses, repair
      rights and public infrastructure determine the action grammar, relationships and endings.
