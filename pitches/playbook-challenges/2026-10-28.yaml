    evolution: >-
      EXPAND 2026-10-27/the-bumbledown-atlas: retain the six-realm, 18-recipe,
      ten-follower foundation but turn it into a concrete language-physics grammar.
      Name all 18 transformations, define transactional rollback and the separate
