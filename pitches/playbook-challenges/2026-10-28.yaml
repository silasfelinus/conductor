        consequence: >-
          Geography returns to normal on rewind while the promise ledger
          still unlocks a later conversation or a respectful separation.
    act_spine:
      - >-
          Act I, Borrowed Words: the child loses a promise in the Town, learns three picture-first
          grammar recipes, and must choose which neighbor gets the only safe bridge across the Sea; the
          overlooked neighbor becomes a recurring ally or skeptic.
      - >-
          Act II, The Quarrel of Maps: the Orchard and Railroad expose a feud between the bell-maker and
          the moth courier. Two followers can be reconciled, separately supported, or allowed time
          apart; every choice alters cooperative puzzle abilities.
      - >-
          Act III, The Last Unwritten Page: the Sleeping Library reveals that the Keeper of Almost has
          been collecting unkept promises to prevent stories from ending. Restore a place, negotiate an
          imperfect peace, or write a new shared rule at the Edge; twelve authored outcome families are
          reachable.
    system_expansions:
      - >-
          Finite rule-recipe graph: eighteen named recipes across movement, weather and cooperation;
          each has preview, inverse, protected tiles and two puzzle solutions, plus a stateful replay
          validator that detects softlocks.
      - >-
          Promise-and-repair ledger: each of ten recruitable friends has one personal request, a
          boundary, an optional separation scene and a deed-based reconciliation; no friendship is
          reducible to a single approval score.
      - >-
          Read-aloud and picture-equivalent route contract: every critical clue has an audio
          description, illustrated pattern alternative, three hint tiers and a replayable practice
          board; reading difficulty never determines story reward.
      - >-
          Atlas scrapbook as evidence: altered geography, unkept promises and forgiven mistakes become
          illustrated spreads that decide which of twelve ending compositions are eligible.
    relationship_routes: >-
      Disjoint recurring cast: 3 selectable child travelers, 16 nonrecruitable
      neighbors/mentors/antagonists, 10 recruitable friends (29 total). Example threads: Pip the
      moth courier wants to be believed; Tamsin the bell-maker must apologize for hiding a dangerous
      shortcut; Lark the cloud-stitcher learns that help offered without asking can be hurtful. The
      Keeper of Almost is one of the 16 NPCs, not an extra villain portrait. All 29 receive neutral,
      delighted, worried, frustrated and comforted portrait states. Friendship is explicit; romance
      is zero.
    rule_catalog:
      - "Town 1, HUSHED to HEARD: open a whisper alley by letting neighbors speak; inverse closes the alley, not the conversation."
      - "Town 2, LOST to FOUND: restore a missing stair from a verified clue; inverse returns the stair to storage."
      - "Town 3, CLOSED to OPEN: unfold a market gate after resolving its guardian's riddle; inverse refolds it."
      - "Sea 1, FAR to NEAR: fold two floating shores together; inverse restores distance while passengers remain on safe tiles."
      - "Sea 2, HEAVY to LIGHT: lift a cloud ferry carrying a friend; inverse requires a safe landing."
      - "Sea 3, DRY to DAMP: grow a rain-path for a stranded boat; inverse drains it without erasing a broken promise."
      - "Orchard 1, UP to DOWN: invert a root ladder between two anchored groves; inverse preserves a rescue exit."
      - "Orchard 2, INSIDE to OUTSIDE: turn a hollow tree's room outward; inverse waits for occupants to leave."
      - "Orchard 3, BITTER to SWEET: ripen lantern fruit for a shared feast; inverse cannot undo a friend's hurt feelings."
      - "Railroad 1, LATE to EARLY: shift one timetable slot, never a person's remembered choice."
      - "Railroad 2, STRAIGHT to CURVED: bend a track around a fragile home; inverse checks both station anchors."
      - "Railroad 3, STOPPED to MOVING: animate a carriage after repairing its brake; inverse stops at the next platform."
      - "Library 1, SILENT to SINGING: turn a hush hall into an audible clue; inverse retains an accessible picture clue."
      - "Library 2, HIDDEN to VISIBLE: reveal a folded shelf passage; inverse keeps an alternate route to every occupied room."
      - "Library 3, FORGOTTEN to REMEMBERED: restore an annotated page; inverse never erases an NPC's testimony."
      - "Edge 1, UNFINISHED to SHARED: join two partial maps only after both owners agree; inverse separates their pages."
      - "Edge 2, ALONE to TOGETHER: build a temporary cooperative bridge with voluntary help; inverse releases both helpers safely."
      - "Edge 3, ENDING to BEGINNING: reopen a sealed page through a final collective promise; inverse cannot cancel the earned finale."
    state_contract: >-
      A recipe is legal only if its two anchored exits, child position, follower
      positions and critical clue access survive both forward and inverse
      transitions. Invalid folds produce a friendly preview and an alternate
      hint, not a softlock. Promise events have actor, request, boundary,
      agreement, impact and deed fields; they persist across map rollback.
      The Keeper of Almost can weaponize neglected promises but cannot force
      children to forgive.
    content_coverage: >-
      The existing 490-image cap is intentional: 145 portraits for 29 disjoint
      recurring people; 12 maps as six before/after realm pairs; 9 hero openings;
      156 local and consequence plates; 48 friendship plates covering ten
      follower arcs plus group turns; 24 antagonist scenes; 32 recipe-change
      details shared by 18 finite rules; 36 ending frames for 12 outcome
      families; and 28 interface images. The 333 text beats include 15 openings,
      204 encounters, 60 friendship scenes, 30 antagonist scenes and 24 finales.
      No romance is budgeted. A rule's visual preview reuses a map and its
      matching detail rather than requiring a new full illustration per state.
    adversarial_trials:
      - "Fold FAR to NEAR while a friend stands on the returning shore; undo must keep both people on reachable anchors."
      - "Promise the same rescue object to two followers; both must have a fair hearing, and neither is auto-forgiven by an inverse map operation."
      - "Disable reading, use picture-only hints and audio; every critical route must remain solvable with the same ending eligibility."
      - "Replay the same seed after a save/load boundary; recipe history, friendship boundaries and atlas ending must be identical."
    first_vignette: >-
      Ship only the Town and Sea crossing, two interacting recipes, one stranded
      friend and three deed-based resolutions. The acceptance trace is preview,
      fold, promise conflict, rollback, repair, scrapbook and replay. Later
      realms and all twelve finale families remain Saga planning, not claims
      of completed content.
