          morning light and expressive storybook brushwork.
      - kind: "villain"
        title: "The Keeper of Almost"
        prompt: >-
          An elderly keeper in a cloak sewn from unfinished paper pages gathers glowing unkept promises
          into a glass lantern at the edge of a sleeping library, soft violet dusk, sympathetic sorrow
          and intricate handmade textures.
      - kind: "place"
        title: "The inside-out orchard"
        prompt: >-
          A whimsical orchard hangs upside down over a winding railroad, roots shaped into ladders and
          lantern fruit illuminating children who are solving a picture puzzle, warm sunset light and
          lush hand-painted fantasy.
      - kind: "follower"
        title: "Pip and Tamsin's quarrel"
        prompt: >-
          A tiny moth courier holds a sealed parcel beside a stubborn young bell-maker on a bridge that
          bends the wrong way, both visibly uncertain as a child offers a repaired bell, gentle overcast
          light and intimate watercolor emotion.
      - kind: "ending"
        title: "A promise kept on the last spread"
        prompt: >-
          A broad pop-up storybook valley unfolds around reunited friends as the painted river finds its
          course and the atlas pages glow from within, joyful twilight, tiny detailed villages and a
          sense of earned communal repair.
      - kind: "quest"
        title: "The two-shore promise"
        prompt: >-
          Two children hold opposite ends of a folded paper bridge above a cloud sea while
          a moth courier waits on a far island and a small bell-maker watches from a
          nearby shore, warm sunrise revealing uncertainty and possible kindness.
      - kind: "encounter"
        title: "The railway remembers"
        prompt: >-
          A curved toy railway circles a delicate orchard cottage while a child kneels
          to check the safe crossing and two animal friends debate beside a lantern
          signal, soft autumn light and lively painted paper textures.
    production_notes: >-
      29 disjoint recurring characters x 5 fixed emotion portraits = 145 portraits. Other images: 12
      maps (6 base + 6 altered), 9 openings, 156 scenes (120 local + 36 anchor/consequence), 48
      friendship plates (40 individual + 8 group), 0 romance, 24 Keeper/conflict scenes, 32 recipe
      transformations (16 paired before/after details), 36 finale frames (12 families x 3), 28 UI =
      345. Total 490 unique finished images, 980 art passes. Text: 15 openings + 204 encounters + 60
      friendship + 0 romance + 30 antagonist + 24 finales = 333 authored beats, 666 writing/edit
      passes, 1,646 planned passes. Distinct character portraits are not counted again as scene
      plates. Audio narration, localization, animation, puzzle QA and compute are excluded. A first
      Vignette must prove one realm and two word recipes before Saga expansion.
