# Human/editorial judgement only. Historical dockets preserve actual dated designs.
# STATUS: incubating | promising | parked | rejected | approved.
# "incubating" does NOT mean Silas has approved development.
rejected_first_pass:
  - title: The Museum of Unfinished Tomorrows
    reason: Original evidence/gallery loop, but lacked a substantial missing genre territory; avoid novelty-only pitches.
  - title: The Last Broadcast from Utopia
    reason: Interesting broadcast mechanic but not a broad enough genre paradigm; grow a genre, not a gimmick.
concepts:
  the-bumbledown-atlas:
    status: incubating
    tags: [children, family, literary-fantasy, wonder, exploration, friendship]
    strengths:
      - Original whimsical read-aloud exploration with the atlas actually transforming
      - Friendship, forgiveness, and language-driven play create its children's identity
    guardrails:
      - No imitating living or classic authors or their recognizable characters
      - No mandatory romance or punishing adult horror; keep younger-player paths accessible
      - Do not reduce world transformation to cosmetic word swaps
    next_moves:
      - Prototype one realm with multi-step language puzzles and alternate reading paths
      - Deepen the companion community and a nonlinear family-friendly mystery
  afterbody-the-human-question:
    status: incubating
    tags: [cyberpunk, transhumanism, augmentation, identity, autonomy, romance]
    strengths:
      - Identity continuity, consent, and implant ownership are real game-state systems
      - Modular cybernetic evolution changes player options and community infrastructure
    guardrails:
      - Do not copy existing cyberpunk franchise plots or character identities
      - Avoid framing prosthetics or disability as corruption or automatic moral damage
      - Cyberware builds must affect gameplay beyond a visual reskin
    next_moves:
      - Define the compatibility graph for hardware, memory copies and shared consciousness
      - Explore how relationships survive when copied minds take different paths
  the-scales-of-forever:
    status: incubating
    tags: [afterlife, heaven, hell, ethics, judgement, cosmic-simulation]
    strengths:
      - Individual soul hearings connect to both eternal realms' changing societies
      - Evidence, precedent, mercy and appeal have systemic consequences
    guardrails:
      - No simple good/evil bar that substitutes for evidence or moral reasoning
      - Fictional original cosmology; respect diverse living beliefs
      - Avoid reusing Emperor of Dust follower-judgment loop under a new coat
    next_moves:
      - Expand soul-case evidence and appeals into a branching investigative courtroom loop
      - Simulate population consequences across Heaven and Hell and a possible third fate
