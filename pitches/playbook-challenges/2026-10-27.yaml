        seeded_state: >-
          A seeded district outage, firmware expiry and one follower's explicit consent window determine
          which body tools remain legal and functional as the clinic floods.
        text_variation: >-
          Authored rescue dialogue identifies the exact revoked permission, names an accessible manual
          alternative and lets the follower explain boundaries without moral condemnation.
        image_variation: >-
          The district flood plate, matching installed hardware transformation and individual
          consent-specific portrait are chosen from the verified art manifest.
        consequence: >-
          Respecting the withdrawal may cost time but preserves trust and opens a union repair route;
          bypassing it creates an evidence trail for the Fork Trial and a distinct public-rights finale.
    act_spine:
      - >-
          Act I, The License in Your Spine: four playable histories expose incompatible legal contracts.
          A clinic rescue teaches the ten-family hardware compatibility matrix and a no-implant route
          while a first copied witness challenges the player's own identity.
      - >-
          Act II, The City Has a Body: choose among patent control, public repair and black-market
          mutual aid in seven districts; resource shortages alter medicine, transport, sensory access
          and the jobs companions can accept.
      - >-
          Act III, The Fork Trial: a copied lover, union organizer or antagonist can refuse integration.
          Present memory provenance, explicit consent records and witness testimony in a playable rights
          hearing, with distinct friendship, romance and separation outcomes.
      - >-
          Act IV, The Commons or the Cage: the mastermind's program is selected from three coherent
          rights regimes. District governance, surviving copies, faction infrastructure and voluntary
          neural links determine twelve end-state families.
    system_expansions:
      - >-
          Ten hardware families x four curated physical configurations x two rights regimes give eighty
          transformation plates; a compatibility table gates abilities, while maintenance access and
          no-implant paths remain first-class.
      - >-
          Consent as a revocable capability: grants specify whose senses, which duration, permitted
          tasks and copy lineage. A withdrawal instantly changes mission options and must never be
          interpreted as a betrayal stat penalty.
      - >-
          Municipal cybernetics economy: seven districts each track clinic access, patent enforcement,
          repair capacity and union protection; mission aftermath alters services, not just a reputation
          number.
      - >-
          Fork mediation: distinct copied minds retain independent memories, relationships, and legal
          claims. Evidence can reunite people by agreement, establish separate personhood or expose
          forged provenance.
    relationship_routes: >-
      Disjoint recurring cast: 4 playable protagonists, 20 nonrecruitable citizens/corporate figures
      and 14 recruitable companions (38). Six of the 14 have optional consenting adult romance arcs,
      each with platonic and separation routes; all fourteen have three bespoke friendship plates.
      Recurring examples: Imani Vale, a clinic technician who refuses involuntary neural upgrades;
      Sol Ren, a union advocate whose copy votes differently; and Dara Quill, a data diver who will
      revoke shared senses when trust is broken. The corporate architect is one of 20 NPCs. Every
      recurring person receives neutral, warmth, anger, fear, injury and altered-embodiment
      portraits, while curated transformation plates cover hardware-specific silhouettes separately.
