          blocked map puzzle.
      -
        stage: "The Unwritten Edge wakes"
        seeded_state: >-
          The lost words and places rewritten determine the shape and motivation of a
          sympathetic antagonist who wants stories to end.
        text_variation: >-
          The antagonist's speeches address actual neglected places and mistakes; witty
          language is original, not a reproduction of a named author's prose.
        image_variation: >-
          A rotating set of painted antagonist emotions, world transformations and wide
