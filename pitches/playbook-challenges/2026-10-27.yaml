    parents: ["2026-10-26/the-scales-of-forever"]
    evolution: >-
      EXPAND 2026-10-26/the-scales-of-forever: make the afterlife judgment engine answerable to an
      independent appellate court, explicit repair orders, soul-by-soul evidence provenance and a
      reversible but costly correction of wrongful eternity. Add a 120-case evidence library, three
      competing cosmic constitutions and a realm-capacity simulation that forces ethical arguments
      to confront their consequences.
    preserve: >-
      Retain the original three arbiter starts, eight realms, Heaven and Hell as changing inhabited
      societies, evidence-based judgments, companions with agency, original nonsectarian cosmology
      and the possible Third Eternity. Never collapse a person's life into a simple virtue score.
    challenge: >-
      Adversarially test a wrong verdict reversed after a century, a maliciously fabricated witness,
      and a benevolent precedent that overcrowds one realm. Appeals must repair actual harms without
      making eternal stakes trivial or equating mercy with innocence.
    next_questions:
      - "What is the smallest evidence graph that can prove a contradiction, reveal a forged memory and justify a precedent exception?"
      - "How does a successful appeal compensate someone wrongly confined while acknowledging that lost time cannot be undone?"
      - "Which population-capacity effects are ethically visible without making souls interchangeable resource units?"
    title: "The Scales of Forever"
    hook: >-
      You have been appointed to decide where the dead spend eternity. Hear the lives of
      saints, monsters, ordinary people and contradictory witnesses, then discover that Heaven
      and Hell have been changing the rules of judgment behind your back.
    genre_pillar: "Epic metaphysical Heaven-and-Hell judgment simulator / cosmic moral drama"
    genre_gap: >-
      The existing portfolio has myth, politics, weird adventures and dark humor but no major
      playable cosmology centered on choosing souls' eternal fate. This delivers a full
      heaven-and-hell simulation rather than another workplace satire.
    audience: >-
      Teen and adult players interested in moral philosophy, mythology, relationship drama,
      evidence, forgiveness, accountability and consequential impossible decisions. Fictional
      cosmology is original, non-sectarian and respectful of real beliefs.
    world_scope: >-
      Eight visually distinct cosmic regions in five acts: the Gate of Last Breath, Memory Sea,
      Gardens Above, Foundries Below, Witness Archive, Covenant Bridge, Court of Appeals and
      the unfinished Third Eternity. Court precedent permanently alters realm architecture and
      the souls who inhabit it.
    emotional_promise: >-
      Judgment is awe-inspiring, terrifying and human. A decision feels irreversible enough to
      matter, but truth is hard; the game explores accountability, mercy and the institutional
      power behind the supposedly final answer.
    core_loop: >-
      Choose an arbiter and one of nine formative cases, investigate a soul's life through witness
      interviews and playable memory tableaux, challenge evidence provenance, cite a precedent and
      sentence the soul Above or Below. Walk both realms to see the result, hear appeals, order
      restitution, and negotiate the changing capacity and legitimacy of eternity before a
      constitutional finale.
    unique_mechanic: >-
      Every ruling is a reasoned case record: claims link to witnesses, memories, contradictions and
      disclosed bias. A separate appeals tribunal can affirm, reverse or remand, but reversal
      requires specific restitution and updates realm population, relationships and precedent. Three
      cosmic constitutions determine which legal powers exist; the player can change the
      constitution only through a costly, evidence-backed final trial.
    signature_systems:
      - >-
          Soul dossier investigation: each life has conflicting testimonials, timeline
          evidence, harms and kindnesses, unreliable memory fragments and hidden context.
          Verdicts must cite evidence and can be appealed.
      - >-
          Dual-eternity population simulation: sending souls Above or Below visibly
          changes neighborhoods, mentors, factions, resources and relationships in both
          realms. Salvation and damnation have consequences beyond a tally.
      - >-
          Law, mercy and legitimacy: recurring precedents, bargains, coerced confessions
          and revealed celestial bias shift the court's authority. Players must
          distinguish accountability from revenge without a single good/evil meter.
      - >-
          Long-form angel, demon and mortal companion arcs: partners may advocate for
          their own loved ones, oppose corruption, change their views, leave the court or
          romance consenting adult peers.
    opening_choices: >-
      Three arbiters, each with three formative cases: a recently dead mortal granted an
      impossible second hearing, an angelic keeper who discovered a false record, and an
      infernal advocate refusing a predetermined verdict. Nine painted intros change alliances,
      abilities to read testimony and the soul pool's early mysteries.
    novelty_against_existing: >-
      Emperor of Dust's throne events judge living petitioners and assign followers; Shifting Desks
      turns office procedures into dark satire. Scales is a metaphysical evidence-and-appeals
      simulation about eternity, with inhabited Heaven/Hell populations, precedent conflicts, rights
      of the dead, restorative obligations and constitutional change rather than court-themed
      encounter cards.
