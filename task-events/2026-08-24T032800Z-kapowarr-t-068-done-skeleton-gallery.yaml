note: >-
  Merged silasfelinus/Kapowarr#143 at 7924631f3b4dd13b9d0e2702988702f3d3fa5fb9. Poster view now establishes the complete lightweight card wall from the existing /api/volumes metadata payload before loading cover media: every card has final 2:3 geometry and title/progress state, cover elements stay source-less until an IntersectionObserver brings them within 1800px of the viewport, visible covers receive high fetch priority, and content-visibility lets supporting browsers skip off-screen rendering while preserving scroll geometry. No second titles/index endpoint was needed. Table view retains #142's bounded renderer. PR Actions were fully green: Tests run 32686425867 passed Python 3.8-3.12 with the frontend suite passing on 3.12; Build docs 32686425860 and container build 32686425896 also passed. Main now points to the squash merge commit.
learning: >-
  Large media galleries need two independent budgets: layout metadata and media hydration. Building only a viewport runway avoids freezes but creates a scroll cliff; building the full cheap shell index gives random-access scrolling, while IntersectionObserver/native lazy loading keeps the expensive image network/decode budget focused around the viewport.
