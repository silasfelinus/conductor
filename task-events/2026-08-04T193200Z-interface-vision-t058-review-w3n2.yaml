note: >
  Tenth t-058 slice (conductor Agent run, kind_robots PR #1439): fixed a genuine
  nested-scroll bug in butterfly-sanctuary.vue rather than a Shape B two-owner
  migration. The roster <aside> (both single-pane and two-pane branches) wrapped
  a fixed Summon/Selected header plus a flex-1 min-h-0 roster-list that already
  owns its own overflow-y-auto scroll, but the aside itself also carried
  overflow-y-auto -- so the whole aside and the inner roster list were both live,
  independent scroll owners simultaneously. Swapped the aside's overflow-y-auto
  for overflow-hidden in both branches (overflow:hidden sets the same used
  min-height:0 as overflow-y-auto per spec, so flex sizing is unaffected); the
  roster-list remains the sole real scroll owner. Verified via
  test:layout-contract (confirms the fix, ratchets one-scroll 3->2), vue-tsc
  --noEmit (clean), and eslint on the changed file (same 3 pre-existing
  import-ordering errors already on main before this change, confirmed via git
  stash -- unrelated, left untouched). Remaining one-scroll entries: stage-manager.vue
  (footer-composer risk), mural-manager.vue (3-pane, hardest case) -- both still
  need visual verification per prior slices' findings before a safe migration.
  Re-arming to ready once PR #1439 merges -- the allow-list is not yet zero.
