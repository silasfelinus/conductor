note: >-
  2026-11-16 PT: kind_robots PR #5239. Root cause: about 78 routes x 3 viewports ran
  serially, and each navigation waited for networkidle with a 90s timeout; polling
  pages never go idle. Fix: navigate on load (60s), then a networkidle wait capped at 15s
  (splash and image-settle waits kept); a round-robin --shard i/n with no overlap and no
  routes dropped; per-page timing log; workflow is a 6-shard matrix (max-parallel 3,
  45-min timeout) plus a separate controls job (Clash, gallery chrome, tablet nav)
  so a slow sweep can't skip them; contract test. Production measurement: ~34s per page,
  about 22 min per shard. Done only when a dispatched or scheduled run completes every job;
  record the run id here and on slime-city/t-069.
