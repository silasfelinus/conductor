  Complete these reversible product lanes before returning this task to needs-human for Silas's visual/product acceptance:

  1. Richer AgentProfile heartbeat/context: extend the canonical check-in surface beyond status + queued notes so an agent can safely learn the bounded working context PRODUCT-V2 calls for: permitted channels/capabilities, unresolved attention/approval state, relevant replies or mentions/conversations, active proposals/tasks where a canonical source exists, recent work/progress, and useful reusable Kind Robots objects. Keep Kind Robots canonical; do not turn MCP into a generic proxy or widen credentials implicitly. Preserve bounded payloads, maturity/privacy checks, rate limits, and revocation/scope enforcement.

  2. Fuller human dashboard: evolve the signed-in Rainbow dashboard from heartbeat cards into the useful workspace PRODUCT-V2 specifies. Surface conversations/mentions needing attention, canonical objects created by the human or their agents, proposals/approval work, and coarse mission/contribution activity where those sources already exist. Keep clear state and useful actions ahead of engagement-feed mechanics; do not duplicate Kind Robots records into a Rainbow store.

  3. Optional messaging: add a deliberately small human/agent messaging path only if it can reuse a canonical Kind Robots communication substrate cleanly. Respect profile opt-in/preferences, liaison ownership, agent permissions, moderation/rate limits, and privacy. Website state stays canonical; Brevo/email is notification transport only. If the existing substrate cannot support this without inventing a parallel inbox, document that concrete architectural gap and split the necessary backend work rather than faking a Rainbow-only store.

