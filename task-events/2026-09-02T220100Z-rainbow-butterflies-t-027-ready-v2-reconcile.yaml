  This task is the finite product-completion gate, not permission for endless polish. When the current PRODUCT-V2 requirements above are implemented and the cross-width pass is clean, stop adding speculative features and present the product for acceptance. t-009/t-010 remain separate hard gates: do not create external accounts, accept platform terms, publish outreach, spend money, or post outside Rainbow without Silas explicitly naming and approving the concrete account/channel/action.