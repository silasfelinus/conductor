note: >-
  First playable evolution pilot in Kind Robots review. Generalized the
  evolution interpreter to support optional authored useful Level 1 actions
  and accurate card rules. Union Bridgebearer produces an immediately useful
  fragile worker at Level 1, then a protected worker plus aura, then a
  pacifist two-worker assembly line. Ironjaw Scrapyard Dreadnought shields
  adjacent workforce from L1, compounds protection at L2, and becomes a
  growing, counterable Thunderhead at L3. The previously underplayed
  Bloodfairy Encore or Die is one-slot in CLASH only, progresses from
  single-target LEECH to adjacent allies to a true full-choir revive or
  riskier VOLATILE fork. Dedicated fixtures test early counterplay, actual
  cards, CPU choices, legal 20/30 decks, deterministic Solo/Alliance replay;
  full CI and merged PR required. No inventory, account, database, art,
  publishing or other mode rules changed.
