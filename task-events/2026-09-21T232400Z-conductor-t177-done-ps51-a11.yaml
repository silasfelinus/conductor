note: >-
  FIXED 2026-09-21 in PR #4970 (squash f237758). The PR #4901 windowless helper used
  ProcessStartInfo.ArgumentList, which is unavailable on the Windows PowerShell 5.1/.NET
  Framework runtime used by SILAS-PC. With ErrorActionPreference=SilentlyContinue, that
  runtime API failure was hidden and cmd.exe received no pm2 command, so every watchdog
  probe hit its 60-second timeout and the 60-minute alert cooldown produced the hourly
  WATCHDOG BLIND mail. The helper now uses the PS5.1-compatible Arguments property with
  explicit Windows argv quoting plus the required cmd.exe /d /s /c outer quoting for batch
  paths. CI now runs the helper itself on Windows PowerShell 5.1 with a spaced .cmd path and
  spaced argument, in addition to parsing every ops PowerShell file. Final PR head
  7f3be2d was current with main and all 24 checks completed without failure; Python suite
  2180 passed, 29 skipped.
learning: >-
  Windows watchdog process-launch code must be runtime-tested on Windows PowerShell 5.1,
  not only parsed there or behavior-tested under PowerShell 7; .NET API availability and
  cmd.exe /c quoting differ enough for a plausible cross-platform helper to fail silently.
