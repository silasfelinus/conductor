note: >-
  Durable Continuous Library Import persistence shipped in silasfelinus/Kapowarr#17,
  merged as c2295f4b4c6035682c883cfffc4b03cabaa655d1. Jobs now persist an ordered folder
  snapshot and per-folder pending/processing/done/review checkpoints in Kapowarr's
  SQLite database, including imported-volume counters and held review rows. A user
  Stop Import is a durable pause that stays paused across restarts and resumes on the
  next explicit Continuous Auto-Import start; an application/container interruption
  leaves the job running and Kapowarr auto-requeues it on startup, resetting only an
  in-flight processing folder to pending. Completed and review checkpoints are kept,
  and durable held rows reconcile against the canonical files table after manual
  imports. Unexpected worker errors persist as paused with the error to avoid restart
  loops. The only crash window is after import_library commits but before the folder
  checkpoint writes: that one folder can replay, but already-recorded files are
  filtered from the rescan, so library state stays safe while the persisted imported
  counter may undercount that crash-window work. Exact-head and post-merge Python
  3.8-3.12 tests, docs, and container builds passed. GHCR latest and sha-c2295f4 were
  published at digest sha256:11a7af9ca32b63e298cf1dcfb62c2573a68f05795926307199d62425fb5bbd15.
