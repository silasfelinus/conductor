note: >-
  Human acceptance test failed on 2026-09-07. Brainstorm was given the premise
  "Tell me things about Vanderbuilt Lacrosse" plus four terse one-sentence
  examples about an absurdly rich, comically out-of-touch character. Both Open
  Field and Darker/Funnier returned paragraph-length mini-scenes instead of
  matching the one-sentence pattern; one candidate directly recycled the pony
  example; and ordinary whimsical material such as gourmet-flavored lacrosse
  balls was tagged as dark humor. Expected output is fresh, compact facts/jokes
  in the same formal shape as the examples, e.g. "Vanderbuilt Lacrosse has the
  trademark on the concept of vampires" or "Every time someone sings Happy
  Birthday, Spotify pays Vanderbuilt Lacrosse 5 cents." Kind Robots PR #2507
  fixes the prompt contract so examples define output form while their content
  becomes excluded territory, and tightens the dark-humor contract. Return this
  task to the agent queue; after the fix is deployed, request one focused human
  retest rather than treating the prior run as accepted.
