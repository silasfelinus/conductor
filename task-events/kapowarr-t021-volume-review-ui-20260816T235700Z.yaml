note: >-
  Library Import review UX shipped in silasfelinus/Kapowarr#20, merged as
  8d849724e7c9d7fe2afbfa411b971cf2e13f34cf. Review rows now collapse by
  Kapowarr's existing volume group_number so a proposed volume appears once while
  its underlying issue/file rows remain hidden and synchronized for the existing
  per-file import payload. Groups without any proposed ComicVine match default to
  unchecked and disabled; assigning a manual group match makes them importable and
  selected. Select All operates only on visible matched volume groups. A Show
  matched only toggle filters the review table without deleting holds, and grouped
  rows expose an expandable file list when individual issues need inspection.
  Matching thresholds and backend import policy are unchanged. Exact-head and
  post-merge Python 3.8-3.12 checks passed, docs passed, and the production container
  published ghcr.io/silasfelinus/kapowarr:latest and
