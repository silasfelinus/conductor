learning:
  kind: software
  stakes: reversible
  lesson: >-
    When a task's own verification instruction assumes infrastructure
    (a PR preview) that a repo-wide config (vercel.json) silently excludes
    for the exact branch prefix agent sessions use, the fallback isn't to
    skip verification -- it's to verify what CAN be checked (CI, structural
    reasoning about the change's own properties) and be explicit in the
    roadmap/PR about what's still open, rather than silently declaring
    full verification done.
