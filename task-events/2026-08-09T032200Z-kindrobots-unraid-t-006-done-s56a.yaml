note: >-
  Completed and merged the full self-hosted Kind Robots packaging. silasfelinus/kind_robots#1637 merged as 63478f728c9ccfdf76ada097c7bf1283d26d493d after all 12 PR workflows completed successfully. silasfelinus/kindrobots-unraid#6 merged as 635bddc9f344b1b4ed3dbbcbb4eb51a1e292da3b after the Unraid catalog validator passed. The runtime now keeps .env out of the image, loads the existing host file at container startup, allows DockerMan variables to override deployment-specific values, persists /mnt/user/pc/kindrobots/images, and ships a DockerMan template/runbook. Actual Unraid installation, reverse-proxy publication, Google OAuth account changes, and DNS cutover remain human-gated deployment steps and were not performed.
learning: >-
  For self-hosted Node 24 services on Unraid, mounting one trusted .env and loading it with --env-file-if-exists avoids duplicating secrets while still allowing DockerMan environment variables to override deployment-specific keys. Excluding .env from the Docker build exposed a Prisma build dependency: prisma.config.ts requires DATABASE_URL even for generate, so image builds need a non-secret dead build-only URL rather than access to production credentials. Local Docker image tags can still be represented by a saved DockerMan template, keeping runtime settings editable in the Unraid WebGUI while registry publication remains optional.
