note: >-
  Found a real async-finalization UI race in Model Builder: pollAsyncArtJob clears queueState/artJobId before finalizeQueuedArtImage completes, so a regenerate could briefly re-enable Keep this asset against the old candidate while GENERATE_ASSETS was still in-progress. The store already discarded the replacement if the old image was approved during this gap, preventing silent overwrite but wasting the completed render. Fix keeps approval disabled while GENERATE_ASSETS is in-progress and extends the existing approved-asset regression contract to cover the UI half of the race.
